# The adverse-order scan (`fedcourts order-scan`, src/fedcourtsai/pipeline/order_scan.py):
# a bounded RECAP search for district orders against federal executive action,
# the candidate generation the adverse-order pool is hand-coded from. It reads
# CourtListener's REST API only, through the shared client and rate governor,
# and writes nothing but its report.
#
# Spend. Every search below runs once per window; a search is at most
# `max_pages_per_search` pages over the whole scan (one for a `count_only`
# control), one request each, and a run stops before the request that would
# pass `max_requests_per_run`. A scan is larger than one run, so each run
# carries the previous run's report forward and resumes where it stopped
# (`fedcourts order-scan --resume`); `--plan` prints the scan's worst case. A
# search that reaches its page cap is reported truncated, which says to narrow
# its query or split its window. The run cap sits under the Tier 4 hourly
# ceiling (300) with room for a pull window's ~90 requests and a live window's
# enrichment step in the same hour, since the governor counts per process and
# the account does not (docs/data-sources.md). The cap counts pages; a page the
# client retries after a transient fault costs up to three requests more, which
# the run-analytics job bounds by running the scan under an hourly governor
# ceiling equal to this cap.
max_requests_per_run: 150
max_pages_per_search: 60

# Windows on the entry date (when an order was entered), one per
# administration, so per-window counts compare. `end` is exclusive; the request
# carries the day before, since upstream's bounds are inclusive.
windows:
  - name: trump-1
    start: 2017-01-20
    end: 2021-01-20
  - name: biden
    start: 2021-01-20
    end: 2025-01-20
  - name: trump-2
    start: 2025-01-20
    end: 2027-01-01

# The immigration pilot. Each query's `params` are upstream's RECAP search
# filters, verbatim; `description` matches docket-entry text, `party_name` the
# docket's parties (which name the agency even where the caption names only an
# officer), `nature_of_suit` the civil cover sheet's code and title. The
# party-name queries reach immigration-policy suits filed as APA (899), other
# statutory (890) or civil-rights (440) cases; the 465 query reaches the
# immigration code itself, whatever the parties are named. The agency queries
# leave out habeas petitions (`q`, on the nature-of-suit field): individual
# detention petitions name the same agencies and outnumber the policy suits by
# far, and an order in one is relief for one person, not against a policy.
# A habeas docket in the gold set is therefore reachable only through the 465
# query, which the recall line will show.
queries:
  - name: pi-agency
    params:
      description: '"preliminary injunction"'
      party_name: >-
        "Homeland Security" OR "Immigration and Customs" OR "Citizenship and Immigration"
        OR "Customs and Border" OR "Executive Office for Immigration Review"
        OR "Refugee Resettlement"
      q: 'NOT suitNature:"Habeas Corpus"'
  - name: tro-agency
    params:
      description: '"temporary restraining order"'
      party_name: >-
        "Homeland Security" OR "Immigration and Customs" OR "Citizenship and Immigration"
        OR "Customs and Border" OR "Executive Office for Immigration Review"
        OR "Refugee Resettlement"
      q: 'NOT suitNature:"Habeas Corpus"'
  - name: vacatur-agency
    params:
      description: >-
        ("summary judgment" AND (vacat* OR "set aside")) OR "section 705"
        OR "postpone the effective date"
      party_name: >-
        "Homeland Security" OR "Immigration and Customs" OR "Citizenship and Immigration"
        OR "Customs and Border" OR "Executive Office for Immigration Review"
        OR "Refugee Resettlement"
      q: 'NOT suitNature:"Habeas Corpus"'
  - name: pi-tro-465
    params:
      description: '"preliminary injunction" OR "temporary restraining order"'
      nature_of_suit: "465"
  # A control, read for its upstream `count` alone (one page a window, its
  # results not kept): pi-agency with no party filter. A pi-agency count close
  # to this one says the party filter was ignored, not applied.
  - name: pi-control
    count_only: true
    params:
      description: '"preliminary injunction"'
      q: 'NOT suitNature:"Habeas Corpus"'

