# Global tracking settings for the pull (refresh), live, historical, and predict
# channels. See docs/data-pipeline.md for the full design. These keys are the
# contract the run-pull workflow reads; treat them as the single place to tune
# scope and the CourtListener API budget.

# pull = targeted CourtListener enrichment from the rate-limited REST API. Owns
# the API budget. The supremecourt.gov live channel owns SCOTUS freshness;
# pull's budget goes to keeping the tracked set's CourtListener records
# current.
# The per-request rate limits the client throttles to are NOT set here: they live
# in the prod env (FEDCOURTS_COURTLISTENER_RPM/_RPH/_RPD, wired from repo
# variables to the active Free Law Project tier — see docs/budget.md). The caps
# below bound how much work each run and each day does within that envelope.
pull:
  # Max dockets refreshed per run (~3 requests each). On Tier 2 (15/150/600) with
  # four daily windows this gives ~120 refreshes/day: 30×3=90 requests/run stays
  # under the 150/hr ceiling, and 4 runs stay under the 600/day ceiling.
  max_cases_per_run: 30
  # Refresh order: stalest first, so a large active set rotates within budget.
  rotation: oldest_last_pulled_first
  # Don't spend budget re-fetching closed / resolved cases.
  skip_closed: true
  # Reserve up to this many of each run's slots for the stalest SCOTUS dockets
  # (the prediction scope), so the in-scope set rotates ahead of the much larger
  # general active set and new docket activity is caught before a case resolves.
  # Unused slots fall through to the normal rotation, so it never wastes budget —
  # a large reserve is safe: it only bites when the SCOTUS-open pool is big
  # enough to fill it, which is exactly when prediction should get priority.
  eligible_refresh_reserve: 20
  # Discover newly-filed dockets in the tracked courts since the last run.
  # OFF: the live channel's frontier probing onboards newly filed SCOTUS
  # petitions (fresher, budget-free), and circuit discovery onboarded cases
  # outside the prediction scope. Its budget slice returns to
  # the enrichment rotation. Flip back on if the live channel is ever paused.
  discover_new_filings: false
  # Hard cap on new dockets onboarded per discovery run (its own slice of the
  # budget, separate from max_cases_per_run above).
  max_new_cases_per_run: 10
  # Wall-clock budget for one pull-all run, minutes — checked between cases (and
  # between courts during discovery), sized well under the workflow's job
  # timeout. On expiry the run stops, defers the rest of the rotation to the
  # next window, and still writes its queues and corpus updates — a degraded
  # upstream degrades the run instead of hanging it into the CI timeout and
  # losing the whole window's work.
  max_run_minutes: 25
  # Stop the refresh rotation after this many consecutive transient REST
  # failures (timeouts / 5xx / 429): the upstream is degraded and each doomed
  # case burns a full retry cycle of budget and minutes. Deterministic per-case
  # errors (e.g. a 404) never trip it; deferred cases keep their stalest-first
  # position, so the next window retries them.
  max_consecutive_transient_failures: 5
  # Only trigger run-predict when a pull detects new docket activity.
  predict_on_change_only: true

# live = the SCOTUS live channel: supremecourt.gov per-docket JSON. Owns
# SCOTUS freshness. No API budget — these caps bound per-cycle wall clock and
# upstream politeness (~1 req/s), not spend.
live:
  # Live petitions re-polled per cycle (recent Terms first, then stalest):
  # pending ones plus the granted dockets retained until their merits
  # judgment (a cohort of roughly a Term's grants, small against this cap).
  # Sized to re-poll the whole pending watchlist each cycle even at its seasonal
  # peak — the September long conference distributes ~180 petitions at once
  # (regular conferences run a median ~34, p90 ~82). This is a coverage ceiling,
  # not the wall-clock bound: a re-poll that catches a distribution transition
  # also fetches up to two document PDFs, and those cluster exactly at that peak,
  # so cycle time is governed by the run-pull live job's `--max-run-seconds` soft
  # budget (which commits progress and resumes next cycle), not by this count.
  # The poller only fetches what is actually live — pending, or granted with
  # the merits proceeding open — so off-peak cycles stay small; a high
  # ceiling just stops the rotation from truncating coverage.
  max_cases_per_run: 300
  # New petitions onboarded from the Term's numbering frontier per cycle
  # (sequential probing: paid from <term>-1, IFP from <term>-5001). Sized to
  # absorb the long-conference onboarding burst within a day (~180 over ~2
  # cycles) rather than trickling it over a week; the same soft
  # budget bounds the onboarding provisioning cost per cycle.
  max_new_cases_per_run: 100
  # Unresolved interim applications re-polled per cycle (recent Terms first,
  # then stalest). A changed, still-unresolved substantive application in
  # predict scope queues predict on the poll (daily-debounced; quota'd by
  # salience.interim_reserve_slots below); the rest is ground-truth
  # collection. Small because each re-poll is one request at the polite
  # ~1 req/s and applications resolve in days to weeks: the unresolved set
  # stays a short list that drains across cycles like the sweep backlog, so a
  # small cap keeps the interim tail cheap without ever starving it.
  max_applications_per_run: 10
  # Oldest October Term the refresh rotation reaches — the reachability probe's
  # floor (docs/live-sources.md): full JSON coverage OT2017+.
  term_floor_year: 2017
  # Seconds between requests (polite-client pacing; browser UA is built in).
  throttle_seconds: 1.0
  # Consecutive 404s that mark a numbering stream's current frontier.
  frontier_misses: 2
  # Per-document cap on extracted text stored in the corpus: ~40 dense
  # pages. Documents (petition, questions presented, BIO) are fetched on the
  # same distribution transition that queues predict; the cap bounds corpus
  # blob growth, and a truncated document is flagged in its provisioning manifest.
  document_text_cap: 150000
  # Predict timing is not configured here: the live channel queues run:predict
  # on a DISTRIBUTION TRANSITION — a petition newly distributed for a
  # conference, or relisted to a new one — the cert-calendar analogue of
  # pull.predict_on_change_only. No separate refresh-rate spend guard is needed
  # because both queueing paths are already bounded: max_cases_per_run above
  # bounds the transition path's worst-case daily volume, and the sweep path is
  # separately bounded at windows x salience.sweep_cases_per_cycle. WHICH
  # transitioned petitions queue is the salience gate's decision: each cycle
  # ends with the selection pass and that bounded sweep of selected petitions
  # the transition trigger missed (see `salience:` below and docs/salience.md).

# historical = the historical Term walker (the run-seed workflow's `seed` job):
# accumulates resolved outcomes reverse-chronologically by Term — primarily
# for the statpack's per-Term base rates, secondarily the cert back-test set —
# by walking October Terms over the supremecourt.gov docket JSON: the same
# client/ingest path as `live:` above, so no API budget. This section IS the
# set's construction frame; it is committed so the set's construction stays
# documented and reproducible.
historical:
  # Two-digit October Terms to walk, newest first. Floor OT2017, the
  # reachability probe's full-JSON floor (docs/live-sources.md). OT2025
  # is walkable alongside the forward poller (`live:`): the walker ingests
  # only decided petitions, skips pending ones, and leaves a decided petition
  # whose existing case carries an open PREDICTED event to the watchlist (its
  # re-poll queues the evaluate handoff the walker never files); the two
  # walkers' cursors are disjoint, so neither rewinds the other. Note the
  # frame below applies to what the WALKER ingests — a Term the forward
  # poller also onboarded (OT2025+) carries the poller's pending-petition
  # coverage on top of the walker's decided-only set, so per-Term composition
  # is not uniform there.
  terms: [25, 24, 23, 22, 21, 20, 19, 18, 17]
  # Docket-JSON probes per `historical-terms` invocation = the workflow loop's
  # checkpoint chunk (~10 min at the polite ~1 req/s; ingested petitions'
  # document fetches ride on top). Trades crash-loss / corpus-push frequency,
  # not the total loaded per run — that is the workflow loop's wall clock.
  max_probes_per_run: 600
  # Per-invocation wall-clock backstop, minutes, checked between serials — so
  # a degraded upstream's retry pauses stop the chunk instead of stalling it.
  max_run_minutes: 20
  # Consecutive 404s that mark a (Term, stream)'s frontier — for a finished
  # Term, the true end of its docket sequence.
  frontier_misses: 2
  # Seconds between requests (polite-client pacing; browser UA is built in).
  throttle_seconds: 1.0
  # Oldest Term whose ingested petitions get filed documents fetched (the
  # document-rich replay cells need them): document links are a rolling
  # ~5-Term window upstream, near-zero before ~OT2021, so older Terms load as
  # metadata+proceedings-only rows. Two-digit Term form.
  document_floor_term: 21
  # Per-document cap on extracted text stored in the corpus (see `live:`).
  document_text_cap: 150000

predict:
  # Prediction-scope gate (docs/data-pipeline.md "Scope", docs/budget.md
  # "Scope: the SCOTUS-docket gate"). Restricts only the agentic
  # predict/evaluate stages; ingestion stays full-coverage. Read at the
  # pull-queue and matrix seams.
  #   scotus_docket — only SCOTUS dockets (court == scotus); the cost gate.
  #                   Originating court-of-appeals dockets are ingested for
  #                   context and retrieval but not predicted.
  #   all           — no gate: every changed case with open events is in-scope;
  #                   keep for dev / unrestricted back-testing.
  scope: scotus_docket
  # Salience-INDEPENDENT hard cap on predict cells (predictor x case x event jobs)
  # queued into one run. A backstop *below* the salience gate, not part of it: it
  # holds whatever selection did, so a selection that fails open cannot fan out an
  # unbounded, expensive run (the failure mode behind a past cost breach). Bounds
  # both GitHub's 256-job matrix ceiling (a wider matrix is rejected outright,
  # losing the whole run) and the run's worst-case model spend. Enforced after
  # scope filtering, by deferring WHOLE overflow cases (never splitting a case's
  # engines) in a deterministic, salience-independent order; a deferred case stays
  # in the predict queue and re-runs next cycle, so the cap defers, never
  # destroys. 240 = 80 fully-tournamented cases x 3 engines, 16 under the 256
  # ceiling. This is the numeric backstop; PREDICT_HANDOFF_ENABLED is the separate
  # coarse on/off pause.
  max_predict_cells_per_run: 240
  # Per-cell poison-pill cap for the durable failure queue — the committed
  # per-run `attempt.json` facts the collect job writes, counted by
  # `matrix.cell_failure_count`. The predict mirror of
  # evaluate.max_attempts_per_cell. Once a (predictor, event) cell has been
  # recorded failed this many times, the live selection sweep stops re-queuing
  # it, so a cell that fails every attempt (a persistent quota wall, a malformed
  # record) cannot re-queue forever — the ceiling the daily predict_queued_at
  # debounce alone does not have. Keyed on cell identity, so a retry under a
  # newer process version still counts against the same cap. 0 disables the cap
  # (every unpredicted cell re-queues). A few attempts above the runner's
  # in-request retry, so a genuinely transient streak still gets several
  # cross-cycle retries before the cell is given up.
  max_attempts_per_cell: 5
  # Hard cap on concurrent predictor matrix jobs. The enforced value is the
  # `strategy.max-parallel` literal in run-predict/run-evaluate;
  # keep this in step with it (nothing reads this key today — it documents intent).
  max_parallel: 6
  # Skip events already resolved (an outcome.json exists).
  skip_resolved: true

evaluate:
  # Per-cycle cap on the evaluate backlog deriver — the path that re-derives owed
  # gradings from committed ledger state (resolved event + prediction + no
  # evaluation), so a failed or paused run:evaluate self-heals instead of losing
  # those gradings. Unlike the selection sweep this costs no network (git ledger +
  # corpus only), so the cap bounds model spend and PR volume, not request rate:
  # each queued case fans out one cell per not-yet-graded evaluator. The backlog
  # drains across cycles, stalest first, under a daily evaluate_queued_at debounce.
  backlog_cases_per_cycle: 25
  # Per-cell poison-pill cap for the durable failure queue — the committed
  # per-run `attempt.json` facts the collect job writes, counted by
  # `matrix.cell_failure_count`.
  # Once an (evaluator, event) cell has been recorded failed this many times, the
  # deriver stops re-queuing it, so a cell that fails every attempt (a persistent
  # quota wall, a malformed record) cannot re-queue forever — the ceiling the
  # evaluate_queued_at daily debounce alone does not have. Keyed on cell identity,
  # so a retry under a newer process version still counts against the same cap.
  # 0 disables the cap (every ungraded cell re-queues). A few attempts above the
  # client's in-request retry, so a genuinely transient streak still gets several
  # cross-cycle retries before the cell is given up.
  max_attempts_per_cell: 5

# salience = the salience gate (see docs/salience.md): ranks in-scope cert
# petitions by a deterministic score and spends the tournament on the top slice
# up to a fundable capacity N. N is a guaranteed floor per conference, not a hard
# ceiling — carve-outs and the sticky latch may push the realized count above it.
salience:
  # Bootstrapping-sized, and sized to BIND. Conference cohorts run a median 34
  # petitions (p90 82, max 369), so a cap of 150 cut 8 of 251 cohorts and
  # selected 96% of the paid docket — a ranking, not a spend control, funding
  # ~$21K/Term against a ~$10K inference envelope. At 12 the gate selects ~543
  # petitions a Term, which with the other stages' moments lands the whole
  # program at ~$10.2K (docs/budget.md).
  #
  # It costs coverage, and the trade is stated rather than hidden: ~80% of the
  # Term's grants are still selected, against ~98% at 150. Raise both as funding
  # lifts, keeping the ratio below.
  per_conference_capacity: 12
  # The Term's opening conference clears the summer backlog at once — ~180
  # petitions against a regular conference's ~34 — so it carries a larger cap.
  # The 2x ratio (up from 1.33x) front-loads deliberately: the opening cohort is
  # where the Term's arrivals concentrate, and at a fixed budget the shift is
  # grant-neutral, so it buys breadth at the moment of highest volume for
  # nothing.
  long_conference_capacity: 24
  # Always-include threshold: a petition at/above this score is selected
  # regardless of rank (the relist-2 / CVSG grant-rate band).
  floor: 0.28
  # Per-cycle cap on the live channel's selection sweep — the path that queues
  # selected petitions the distribution trigger alone would miss (same-cycle
  # first selections, the catch-up backlog, daily retries of runs that
  # committed nothing). Each swept case costs one docket fetch plus document
  # provisioning at the polite ~1 req/s, so the cap keeps the sweep a small
  # tail on the cycle; the backlog drains across cycles under the sticky latch.
  sweep_cases_per_cycle: 25
  # A relist inside this many days of a petition's last predict queue is
  # treated as administrative churn rather than re-tournamented; 1 suppresses
  # only a same-day repeat. 0 disables suppression.
  relist_requeue_cooldown_days: 1
  # Lookback window for the salience-band segment base rate — how many October
  # Terms immediately before a case's own Term may contribute to the band grant
  # rate the evaluator scores Brier skill against and `cert-backtest.json`
  # reports per band. Set to 10 to match `statpack.markdown_terms`: the scored
  # baseline and the band table the agents anchor on then share one window by
  # construction, so the two cannot silently diverge as walked Terms accumulate.
  # With nine Terms walked (OT2017-OT2025) the bound excludes nothing today —
  # every published skill number is unchanged — it only pins where the edge
  # will sit. The bias/variance tension is real and deliberate
  # (docs/salience.md, *Base rates & baselines for the predicted segment*):
  # per-Term high-band grant rates run 25.8%-48.0% across OT2017-OT2025, so a
  # long window is stable but assumes the Court's grant behaviour is
  # stationary, while a short one tracks the drift on only 61-163
  # weighted-resolved petitions per Term. Counted in Term YEARS, not statpack
  # rows: a Term missing from the pack shortens the sample rather than pulling
  # an older Term in. Move it between Terms, never part-way through one —
  # a change re-bases every published skill number at once.
  base_rate_lookback_terms: 10
  # Cap on interim-docket tournament slots (stays, injunctions — docs/salience.md
  # "The interim docket", docs/budget.md). Defined INSIDE N by the selection pass
  # (pipeline.salience.plan_cohorts): each pass, pending substantive
  # applications fill up to this many reserve slots (escalation-ladder order —
  # response requested, then amicus count; a still-pending selected
  # application keeps its slot), and the slots in use
  # lower the current conference cohort's rank-fill limit by the same number —
  # carve-outs above N are untouched, and an unfilled reserve lowers nothing.
  # That limit costs a real cert pick wherever the cohort's non-carve-out
  # remainder exceeds it — which typical cohorts reach at
  # per_conference_capacity 12, where a full reserve leaves a rank fill of 7 —
  # so slots in use displace cert picks by design (docs/budget.md). Set well BELOW the
  # observed concurrency (~16 substantive applications live at once against a
  # walked Term's 219 arrivals): the reserve is a deliberate cap on how much of
  # the interim stream is predicted at all, not a fit to it, which is why the
  # predicted slice is a ladder-ordered subsample. Raising it widens interim
  # coverage and narrows the cert rank fill one-for-one.
  interim_reserve_slots: 5

# statpack = publication knobs for `metrics/statpack.md`
# (src/fedcourtsai/analytics.py). The JSON artifact always carries every Term and
# every bucket; this bounds only what the Markdown renders.
statpack:
  # How many recent Terms the two per-Term tables render. Load-bearing, not
  # cosmetic: `metrics/statpack.md` is the surface the predict and evaluate
  # prompts send agents to anchor on, so this bounds the agent stratum's
  # base-rate window as instructed — the counterpart of
  # `salience.base_rate_lookback_terms`, which bounds the same window for the
  # in-code baseline those agents are scored against. (`statpack.json` sits in
  # the same checkout and carries every Term, so the bound is conventional, not
  # a capability limit; both per-Term captions state the rendered window so a
  # truncation is visible where the agent reads.) The two defaults differ (10
  # here, 0 = unbounded there) and that is stated rather than hidden. With the
  # walked range at OT2017-OT2025 the pack holds 9 Terms, so nothing is truncated
  # today and the two windows coincide; they diverge once the pack passes 10
  # Terms, when the back-test would pool a Term the agents cannot see. 10 spans a
  # decade of cert practice while keeping the document prompt-sized; 0 renders
  # every Term.
  markdown_terms: 10

# spend = the EX-POST inference-spend backstop (see src/fedcourtsai/spend.py).
# Every other cost control here is ex ante — it bounds one decision or one run
# (salience capacity N, predict.max_predict_cells_per_run,
# salience.sweep_cases_per_cycle, the per-cell attempt caps). None of them reads
# what has actually been spent, so they compose into a per-run limit with no
# per-period limit above it: across the day's scheduled windows, spend is bounded
# only by how many cells happen to be owed — the quantity that becomes large at a
# long conference. This section is the bound above them, read by the predict and
# evaluate plan seams before either mints a matrix.
spend:
  # Trailing-window ceiling on measured spend, USD. 0 DISABLES the backstop (the
  # convention the other caps use) and is the default: turning it on is a
  # deliberate act, and a missing section can never wedge the pipeline. Reaching
  # the ceiling DEFERS new cells — the predict queue and the evaluate backlog are
  # untouched and re-derive next cycle — it never destroys queued work. Set it
  # against the envelope in docs/budget.md, and leave room for the ledger lag
  # below rather than at the exact figure you cannot afford to exceed.
  ceiling_usd: 0.0
  # The window the ceiling applies over, days. Sized to the billing period being
  # protected, not to a run. NOTE the measurement lags: a cell's usage.json
  # reaches data/ only when its run's collect PR merges, so the ledger is a FLOOR
  # on spend within the window, never a live figure.
  window_days: 30

# runner = the agentic predict/evaluate cell runner's retry governor (see
# src/fedcourtsai/pipeline/runner.py). A cell that fails on a TRANSIENT fault —
# an HTTP 429 / quota-exceeded throttle, a 5xx upstream, or a timeout — is
# retried with exponential backoff and jitter; a PERMANENT fault (content-filter
# trip, context-length blowout, auth error) is a hard failure and never retried.
# The transient/permanent split mirrors pull's is_transient classifier.
runner:
  # Total attempts a transient-failing cell gets (1 = no retries). A 429/5xx that
  # has not cleared after a handful of exponentially-spaced waits is a degraded
  # upstream, and each extra attempt re-spends a full agent invocation.
  max_attempts: 3
  # Base of the exponential backoff, seconds: the wait before retry N is
  # base * 2**(N-1) before jitter, so this gives ~2s, ~4s, ~8s, … .
  backoff_base_seconds: 2.0
  # Ceiling on any single backoff wait, seconds — including a honored server
  # retry-after — so a retrying cell cannot sleep its way into the CI job timeout.
  backoff_max_seconds: 30.0

courts:
  # The tracked set: SCOTUS + all 13 federal courts of appeals, by CourtListener
  # court id. pull keeps these current. District courts are intentionally out
  # of scope for now.
  - scotus
  - ca1
  - ca2
  - ca3
  - ca4
  - ca5
  - ca6
  - ca7
  - ca8
  - ca9
  - ca10
  - ca11
  - cadc
  - cafc
