# Who may start a run by hand (`workflow_dispatch`) or re-run one
# (src/fedcourtsai/authz.py and `fedcourts authorize-run`).
#
# Every dispatchable workflow that binds a deployment environment opens with an
# `authorize` job that reads this file, and no other job of the run starts until
# it passes. A dispatch proceeds only when the dispatching login is a human
# below, or a bot listed below for that workflow file; a re-run of any run —
# scheduled, pushed or dispatched, whole or a single job — proceeds only when
# the login re-running it is a human below. Bots never re-run. A schedule or a
# push is chosen by no one at run time and is not gated here.
#
# GitHub lets any account with repository write dispatch and re-run, and write
# is wider than this list on purpose: the agent account interactive sessions act
# as (`modelmirror-agent`) holds it to push branches and open PRs. That account
# is deliberately absent, so a session can never start spend, write the corpus
# or re-run a refused round — it composes the dispatch for a maintainer instead
# (AGENTS.md). `tests/test_workflow_auth_gate.py` refuses a file that lists it.
#
# This file decides who may start spend, so it is owned by the maintainer
# (.github/CODEOWNERS, AGENTS.md's maintainer-only classes). An absent or
# malformed file refuses every gated dispatch and re-run; logins compare
# case-insensitively.

# GitHub user logins that may dispatch any gated workflow and re-run any run.
humans:
  - modelmirror

# Pipeline App bot logins (`<app-slug>[bot]`) allowed to dispatch one workflow
# file each — never to re-run. A chained predict round is dispatched by the
# dispatch App from run-predict's `chain` job and run-pull's `chain-predict`.
bots:
  run-predict.yml:
    - fedcourtsai-dispatch[bot]
