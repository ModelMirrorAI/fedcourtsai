# Evaluator registry — the routing table for `run-evaluate`.
# Each enabled evaluator scores EVERY predictor's prediction for a resolved
# event (evaluator x predictor fan-out). Quantitative scores (correctness,
# Brier, vote accuracy) are computed identically in code; evaluators add the
# qualitative judgment of the predicted reasoning.

# Tool manifest: same shape and rules as config/predictors.yaml —
# pinned MCP servers, referenced per evaluator by id, echoed into each cell's
# retrieval_log.json. Evaluators get the same retrieval as predictors so a
# judge can check a cited authority rather than take it on faith.
mcp_servers:
  - id: courtlistener
    package: "courtlistener-api-client[mcp]==1.1.0"
    command: courtlistener-mcp
    token_env: COURTLISTENER_API_TOKEN
    # The pin's advertised `tools/list` — in lockstep with the predictor
    # manifest, since the tools are a property of the pin. Without it every
    # evaluator cell's retrieval log records an empty offered set, which reads
    # as "unrecorded" forever and leaves `fedcourts tool-usage` with a
    # denominator for only half the fan-out.
    tools:
      - search
      - get_endpoint_schema
      - call_endpoint
      - get_endpoint_item
      - get_choices
      - get_counts
      - get_more_results
      - read_document
      - search_document
      - extract_citations
      - analyze_citations
      - resume_citation_analysis
      - create_search_alert
      - delete_search_alert
      - subscribe_to_docket_alert
      - unsubscribe_from_docket_alert
    description: >-
      Official CourtListener MCP (see config/predictors.yaml for the full
      rationale; keep the two manifests' pins and tool lists in lockstep).

evaluators:
  - id: claude-judge
    engine: claude-code
    model: null
    prompt: .github/prompts/evaluate.md
    enabled: true
    mcp_servers: [courtlistener]
    description: Claude Code evaluator scoring reasoning quality against the outcome.

  - id: codex-judge
    engine: codex
    model: null
    prompt: .github/prompts/evaluate.md
    enabled: true
    mcp_servers: [courtlistener]
    description: Codex evaluator, for cross-checking the Claude evaluator.

  - id: gemini-judge
    engine: gemini
    model: null
    prompt: .github/prompts/evaluate.md
    enabled: true
    mcp_servers: [courtlistener]
    description: Gemini evaluator, for cross-checking the Claude and Codex evaluators.
