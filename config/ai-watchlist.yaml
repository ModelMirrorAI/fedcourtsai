# The AI-case watchlist (src/fedcourtsai/ai_watchlist.py): the hand-curated
# lower-court cases the AI-cases feed follows, and later forecasts.
#
# The rule. A case is listed when an AI developer, or an AI system's training,
# outputs or deployment, is central to a claim or defense. Federal district
# courts and circuits only; state courts are out. The list favours cases with
# substantive rulings still ahead, and stays on the order of 10–20 cases.
#
# Changes. A case is added by a PR that cites this rule, on a dated `added`
# line. A case is removed only when it closes, and it stays in the git
# history either way. Nothing adds a case automatically; the maintainer decides.
#
# Fields. `developers` names every AI developer that is a party, because the
# self-interest comparison will key on it; it is never empty. `category` is one
# entry of `categories` below, the case's primary subject; a new category is a
# rule change, made the same way as a new case. `related` lists the case's
# other dockets (an appeal, a transferred-from or companion docket, an MDL's
# panel docket and members), so the `ai` tag follows the case to every court
# it reaches. A SCOTUS petition from a listed case is tagged by the same
# relation once it exists, and enters the SCOTUS pipeline on its own salience
# terms: the tag never changes selection, so `scotus` is never listed here.

categories:
  copyright: Training on, or outputting, protected works (infringement, DMCA §1202, licence claims).
  government: Suits by or against a government over AI (APA review, procurement, regulation).
  product-liability: Harm alleged from a model's outputs or deployment (injury, wrongful death).
  antitrust: Competition claims over AI products or markets.
  competitor: Disputes between AI developers or their founders (governance, trade secrets, contract).
  employment: AI systems used in hiring and employment decisions.
  computer-access: Scraping and automated or agentic access to sites and services.
  privacy: Personal data in training, outputs or logs.
  civil-rights: Discrimination or disability-access claims about AI systems.

