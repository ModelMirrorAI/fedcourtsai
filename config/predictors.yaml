# Predictor registry — the routing table for `run-predict`.
# Each enabled entry becomes one matrix job; all of them predict the same event
# independently and their outputs are scored against each other by `run-evaluate`.
# Adding a competing predictor is a one-line change here (and, later, the output
# of the automated hypothesis-generation harness).
#
# Fields validate against schemas/predictor_config.schema.json.
#   id:          unique, filesystem-safe; names the output directory
#   engine:      claude-code | codex | gemini
#   model:       optional model override (else the engine default in
#                fedcourtsai.pricing.DEFAULT_MODELS, e.g. claude-fable-5)
#   prompt:      repo-relative path to the prompt template
#   enabled:     skipped when false
#   mcp_servers: manifest ids (below) this predictor's cells get

# Tool manifest: the pinned MCP servers cells may be configured with,
# referenced per predictor by id. This is the pipeline-attribution record once
# cells' retrieval varies — each cell's retrieval_log.json snapshots the pinned
# entries it ran with. FREEZE before the September prediction freeze. Fields
# validate against schemas/mcp_server_config.schema.json; the per-engine client
# configs are emitted by `fedcourts mcp-config` from these entries.
mcp_servers:
  - id: courtlistener
    # The official Free Law Project server, local-install (the hosted
    # endpoint's OAuth flow does not fit headless CI). Launched via
    # `uvx --from '<package>'`; exact-version pinned. Two transports, one
    # pin: stdio for local runs, and in the cell workflows a tokenless
    # localhost HTTP sidecar (`fedcourts mcp-serve`) so no client config
    # carries the token. stdio runs the release's own entry point directly.
    # The sidecar cannot: the release's `create_http_app()` requires a Redis
    # URL and forces its OAuth provider, neither of which fits a loopback
    # sidecar, so `fedcourtsai.mcp` builds the server itself and serves HTTP
    # on localhost — a bypass keyed to this exact pin, so a bump re-checks it.
    # This release validates tool arguments strictly (unknown keys and
    # out-of-enum endpoint ids are hard errors, not ignored), so a sloppy
    # retrieval call now fails loudly rather than silently returning nothing.
    package: "courtlistener-api-client[mcp]==1.1.0"
    command: courtlistener-mcp
    # The CourtListener API token env name. In the cell workflows only the
    # MCP sidecar's launch step holds it; locally the stdio launch injects
    # it from the emitting process's env. Unset, the release's tool calls
    # error and the cell degrades to corpus tooling (never blocks).
    token_env: COURTLISTENER_API_TOKEN
    # What this pin advertises over `tools/list`, captured from the running
    # server — the OFFERED set. A cell's retrieval log can only show what it
    # *called*, so without this an unused tool is indistinguishable from an
    # absent one and `fedcourts tool-usage` has no denominator. It sits beside
    # `package` because it is a property of the pin: a bump may add or drop
    # tools, and `mcp-integration-check` compares this list against the live
    # server so drift is caught rather than assumed.
    tools:
      - search
      - get_endpoint_schema
      - call_endpoint
      - get_endpoint_item
      - get_choices
      - get_counts
      - get_more_results
      - read_document
      - search_document
      - extract_citations
      - analyze_citations
      - resume_citation_analysis
      - create_search_alert
      - delete_search_alert
      - subscribe_to_docket_alert
      - unsubscribe_from_docket_alert
    description: >-
      Official CourtListener MCP: search, endpoint access, and citation tools
      over the full legal database. Retrieval under the leakage doctrine —
      timing is the control; the cross-evaluator's leakage grading covers
      replay-cell usage.

predictors:
  - id: claude-baseline
    engine: claude-code
    model: null
    prompt: .github/prompts/predict.md
    enabled: true
    mcp_servers: [courtlistener]
    description: >-
      Baseline Claude Code predictor. Reads the case snapshot and event, emits a
      calibrated grant/deny probability, panel votes, and a reasoning document.

  - id: codex-baseline
    engine: codex
    model: null
    prompt: .github/prompts/predict.md
    enabled: true
    mcp_servers: [courtlistener]
    description: >-
      Baseline Codex predictor using the same prompt for an apples-to-apples
      comparison against claude-baseline.

  - id: gemini-baseline
    engine: gemini
    model: null
    prompt: .github/prompts/predict.md
    enabled: true
    mcp_servers: [courtlistener]
    description: >-
      Baseline Gemini predictor using the same prompt for an apples-to-apples
      comparison against claude-baseline and codex-baseline.
