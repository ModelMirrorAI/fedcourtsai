# When a predict, evaluate, summarize or topic-label round may skip the
# `review` hold (src/fedcourtsai/review_hold.py and `fedcourts hold-decision`).
# Every round renders its plan and waits for a maintainer to release it, unless
# all three bounds below hold at once:
#
#   - its plan prices at most `auto_release_usd_per_round`;
#   - fewer than `auto_release_rounds_per_day` rounds, across the lanes
#     together, were auto-released in the trailing 24 hours;
#   - measured spend over the spend backstop's trailing window (tracking.yaml
#     `spend.window_days`: every committed usage.json, the usage each committed
#     case summary records, and every topic-labeler run's spend record under
#     data/qp-topics/spend/ — the same total the backstop sums) + the in-flight
#     bound (rounds
#     auto-released in the last 24 hours x the per-round cap, for spend that has
#     not reached the ledger yet) + this round's price is at most
#     `auto_release_budget_usd`.
#
# The next round past any bound waits on the `review` hold, and the `spend`
# backstop in tracking.yaml stands behind all three, ex post. A topic-label
# round also waits on the hold while its frame's newest gated labeling run
# stands refused at the reference gate, and while its frame's open labels PR
# holds an unmerged published batch. The back-test is
# not a lane here: its replay always waits on a maintainer's release.
#
# This file is spend authority, so it lives apart from tracking.yaml and is
# owned by the maintainer (.github/CODEOWNERS, AGENTS.md's maintainer-only
# classes): raising a cap lets more spend run without a human release.
#
# A predict or evaluate round's price is the planning rate table's
# (src/fedcourtsai/planning_rates.py), taken over both the plan's would-mint
# cells and the matrix the round actually minted, the larger of the two; a
# summarize round's is its plan's upper estimate, one call per case, which
# leaves out a rejected response's retry; a topic-label round's is its plan's
# upper estimate too, its batch's rows at the labeler's per-row planning rate.
# Those rates sit at or above each engine's measured mean, but a cell's spend varies around its mean and
# retries spend more than a cell's rate, so actual spend can exceed the
# estimate. The budget is a projection over a ledger that lags — a manually
# released round in flight, an auto-released round whose collect PR is still
# open more than 24 hours on, an unmerged summaries PR (except in the
# summarize plan, which counts the summaries it carries), a rejected summary
# response, and an unmerged labels or spend-record PR (except to that frame's
# next label round, whose extract job carries its spend records in) are
# invisible to it — which is why it must sit below the backstop's ceiling: a budget at or above `spend.ceiling_usd` keeps every
# round on the hold. `0` in any knob DISABLES auto-release.
#
# The values. Measured on the committed ledger evaluated on 2026-10-17 before
# ~19:50Z (newest usage created_at 2026-10-16T15:45:57Z): $2,715.66 over 1,155
# agent cells plus $97.32 over 751 case summaries in the trailing 30 days,
# $2,812.98 in all. The figure falls by roughly $350 a day while the
# long-conference campaign (2026-09-16..18 and 2026-10-05..07) rolls out of the
# window. Committed rounds since that campaign (2026-10-08 on, 16 rounds) cost
# $0.41-$97.25 each (predict) and $1.82-$90.48 (evaluate) by actual spend;
# full-size campaign rounds cost ~$99-$196.
#
# - Budget $2,500: the $2,000 model-API envelope in docs/budget.md plus $500,
#   so routine rounds keep releasing while a long-conference campaign's spend
#   sits in the window (the trailing figure was $2,302 on 2026-10-19 and falls
#   under $2,000 only as that campaign ages out). The backstop's ceiling is
#   $3,000 (tracking.yaml `spend:`), so the standing room above the budget is
#   $500. The budget and the backstop read one base: agent cells, case
#   summaries and topic-labeler runs. The steady state since the campaign
#   runs at ~$1,425 per 30 days on the budget's base (cells ~$1,320 + summaries ~$105), extrapolated from 9
#   days, two of which carry over a third of the cell spend.
# - Per round $75: releases most steady-state rounds (14 of the 16 since
#   2026-10-08 by actual spend; the cap applies to the planning-rate price,
#   which differs from actual by engine mix) and holds a campaign-sized one
#   for a human read.
# - Six rounds a day: the four scheduled slots (two predict, one evaluate, one
#   summarize) plus two chained predict rounds. The chain can dispatch far more
#   than two — after any of the sixteen pull and live windows that changes a
#   forecast-relevant record, and after a capped round — so this cap, not the
#   chain, is what bounds how many of them run unattended. Unattended
#   *estimated* spend is then at most 6 x $75 = $450 a day, up to a race at the
#   count when two lanes plan at the same moment (each reads the count before
#   either deploys). The in-flight allowance reaches $375 before the sixth
#   round, and it also counts rounds that already landed, so auto-release in
#   practice stops a few hundred dollars short of the budget.
auto_release_usd_per_round: 75
auto_release_rounds_per_day: 6
auto_release_budget_usd: 2500
