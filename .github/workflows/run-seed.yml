name: run-seed

# The historical Term walker (docs/live-sources.md). It carries the backfill on
# its own schedule, separate from run-pull's forward windows.
# It walks October Terms' docket serials newest-first over the supremecourt.gov
# docket JSON and ingests the sampled decided set — every decided petition except
# denials, which are systematically sampled per config/tracking.yaml's committed
# `historical:` frame. No CourtListener token, no API budget; it files NO
# predict/evaluate handoffs (every ingested petition is decided history, landed
# already resolved).
#
# It is a corpus writer like run-pull's jobs, so it shares the repo-level
# `corpus-write` concurrency group: the corpus is a single blob (pull → mutate →
# push → commit corpus/corpus.db.ref to main), so only one writer runs at a time
# regardless of workflow. The windows sit in the dead zones between run-pull's
# forward windows (`:17` pull, `:47` live) and yield the lock before the next
# one fires.
#
# Each window is a bounded chunk — ≤40 min of walk, except the daily sweep
# window, which walks 25 to fund its trailing sweeps — inside one App
# installation token's 1h life, so there is no self-refreshing-token loop — one token up
# front covers the walk and the trailing steps.
on:
  schedule:
    # Four dead-zone windows/day, each after a pull and before the next live,
    # so a chunk clears the lock before forward work needs it.
    - cron: "31 2 * * *"
    - cron: "31 8 * * *"
    - cron: "31 14 * * *"
    - cron: "31 20 * * *"
  workflow_dispatch:
    inputs:
      refresh_terms:
        description: >-
          Re-open past Terms before walking: space-separated two-digit October
          Terms (e.g. "17 18 19"), or "all" for every configured Term. Leave
          blank — the default, and what every scheduled run uses — to resume
          normally. Clears the walk cursors so the Terms are re-covered from the
          numbering base; re-walking adds through the corpus latches and deletes
          nothing.
        required: false
        default: ""
      refresh_streams:
        description: >-
          Which numbering stream the refresh re-opens. IFP is ~70% of the probe
          cost and feeds no scored segment, so prefer paid when the goal is the
          predicted population. Ignored when refresh_terms is blank.
        required: false
        default: historical-paid
        type: choice
        options:
          - historical-paid
          - historical-ifp
          - both
      refresh_dockets:
        description: >-
          Re-snapshot named dockets without re-walking their Terms: Term-form
          SCOTUS docket numbers, one per line or space-separated (e.g.
          "22-451 23-1234"). Leave blank —
          the default, and what every scheduled run uses. For the case where the
          rows needing a fresh read are known and enumerated; `refresh_terms`
          above is the instrument when a whole population needs re-reading, and
          it costs a Term's entire serial range to reach a handful of dockets.
          Each number is re-served and re-ingested through the walk's own path,
          adding through the corpus latches exactly as a re-walk does, and no
          walk cursor moves — a targeted re-read is not a rewind. Grammar-checked
          all-or-nothing before anything runs; applications ("22A123") and
          original-docket numbers are separate sequences this path does not serve.
        required: false
        default: ""
        type: string
      unlatch_overselected:
        description: >-
          One-time: clear the pre-resize `salience_selected` overhang. The
          sticky latch is additive, so petitions latched under old capacity
          caps keep earning cells the shipped envelope never budgeted; this
          recomputes each pending cohort under the current config and clears
          the latch on pending petitions a from-scratch selection would not
          pick (dry-run it locally first — `fedcourts unlatch-overselected`).
          Only fires on an explicit dispatch with this set; never on the
          schedule. A committed prediction on a cleared case stays committed
          and graded.
        required: false
        default: false
        type: boolean
      qp_backfill:
        description: >-
          Re-derive stored questions-presented rows with the current extractor
          (`fedcourts backfill-questions-presented`). `dry-run` prints the
          reason-class triage ledger to the run summary and writes nothing;
          `apply` rewrites the safe classes, verifies its own convergence, and
          pushes. The intended procedure is two dispatches — `dry-run`, read
          the summary ledger, then `apply`: an apply run's in-run dry-run is a
          receipt, not a reading, since nobody reads it before the rewrite.
          The refusal
          guard holds either way — a stored full-length question the extractor
          can no longer derive is reported, never emptied. Only fires on an
          explicit dispatch naming it; never on the schedule.
        required: false
        default: none
        type: choice
        options:
          - none
          - dry-run
          - apply
      rederive_distribution_parse:
        description: >-
          Re-derive the corpus `distribution_count` column under a registered
          distribution parse (`fedcourts rederive-distribution-counts`), naming
          the parse in `rederive_parse`. The first of the three pieces of work
          that activate a new parse (`docs/salience.md`): the write is a direct
          UPDATE that bypasses the upsert path's max latch, because a narrower
          reading routed through the upsert is a silent no-op. `dry-run` prints
          the plan — changed counts by direction, the band-move matrix over the
          census frame, the unobservable count — and writes nothing; `apply`
          writes and pushes, refusing above the command's blast-radius bound —
          which is fixed in code, not a dispatch input, because the population
          is finite and its delta was measured before the surface existed;
          moving it is a code change with the new basis stated beside it.
          One pass either way, so the dry run's plan is exactly the apply's
          write set. **Dispatch the INCUMBENT parse first**, as a `dry-run`
          control: it must report `changed = 0`, since the stored column is the
          incumbent reading of those same snapshots, and anything it moves is
          stored-column drift rather than the parse — until it is zero, a
          candidate's changed set is a sum nothing can decompose. Dispatch it
          alone: it and `qp_backfill` are both sized in tens of minutes, and
          two of them beside a walk do not fit the job cap. Only fires on an
          explicit dispatch naming it; never on the schedule.
        required: false
        default: none
        type: choice
        options:
          - none
          - dry-run
          - apply
      rederive_parse:
        description: >-
          The distribution parse `rederive_distribution_parse` re-derives the
          column under: a label registered in
          `pipeline.cert_signals.DISTRIBUTION_PARSES`, e.g. `dist-v2`. Required
          in every mode that runs — a re-derivation names its reading rather
          than inheriting the ingest default, since which reading produced a
          stored count is the whole question. Refused before the corpus pull
          unless it is a lowercase label; whether the label is registered is the
          command's own refusal, and an unregistered one exits non-zero rather
          than falling back.
        required: false
        default: ""
        type: string
      disposition_convergence:
        description: >-
          Converge stored disposition labels against the current classifier
          (`fedcourts converge-disposition-labels`). `dry-run` prints the
          relabel ledger to the run summary and writes nothing; `apply`
          rewrites within an explicit blast-radius bound. Two dispatches is the
          procedure — `dry-run`, read the count off the ledger, then `apply`
          with that count in `disposition_max_relabels`. Events carrying
          committed predict/evaluate output are held back: relabelling under a
          scored evaluation would silently restate what was graded, so the
          ledger names them and the sweep moves on. Reaching them takes
          `include_scored` below, and the relabel is only half the repair —
          `regrade_stale` recomputes graded fields under an outcome rather than
          moving one, so it is the follow-through, not an alternative route:
          labels first, then `regrade_stale` naming the affected judge lines,
          which this workflow runs in that order within one dispatch. Only
          fires on an explicit dispatch naming it; never on the schedule.
        required: false
        default: none
        type: choice
        options:
          - none
          - dry-run
          - apply
      disposition_max_relabels:
        description: >-
          The relabel bound for `disposition_convergence=apply`: a positive
          integer, and the number the maintainer read off the dry-run ledger.
          Required on apply, and anything but a positive integer — blank, zero,
          negative, decimal, leading-zero — is refused before the scan runs: an
          unbounded apply would convert a widened predicate into a mass
          rewrite. Ignored in every other mode — but still *required* in every
          mode that sets `include_scored`, which states its blast radius before
          the ledger widens rather than after.
        required: false
        default: ""
        type: string
      include_scored:
        description: >-
          Widen `disposition_convergence` onto candidates carrying committed
          predict/evaluate output (`--include-scored`). Off by default: an
          `evaluation.json` is stamped with a `correct` bit computed from the
          outcome, so relabelling under one moves what a published standing was
          computed from while the standing sits still. Setting this takes on
          the re-grade backlog — each relabel reports how many stamped
          evaluations it owes — so it is refused unless
          `disposition_convergence` names a mode AND `disposition_max_relabels`
          carries a positive integer, in `dry-run` as much as in `apply`. What
          the number states on a dry-run is the decision, not a size: the plain
          dry-run's held-back lines are candidates the sweep never parsed, so
          they bound the population rather than count the relabels. The bound an
          `apply` is actually checked against is the widened dry-run's own
          relabel count. Half a repair on its own — pair it with `regrade_stale`
          naming the affected judge lines, three per event rather than one per
          evaluation, which this workflow runs after the relabel in the same
          dispatch.
        required: false
        default: false
        type: boolean
      regrade_stale:
        description: >-
          Recompute the graded fields of named evaluator cells under their
          original stamp (`fedcourts stamp-cell --regrade`), for cells whose
          committed outcome moved after the grade was taken — this lane's
          sweeps rewrite and reopen outcomes without consulting who has
          already graded them. `dry-run` echoes the commands without invoking
          them; `apply` runs them, and a refusal stops the lane rather than
          scrolling past. Only fires on an explicit dispatch naming it; never
          on the schedule.
        required: false
        default: none
        type: choice
        options:
          - none
          - dry-run
          - apply
      regrade_cells:
        description: >-
          The cells `regrade_stale` acts on, one `court/docket/event/run_id/actor`
          per line (spaces work too). One re-grade per line, so a cell graded by
          three judges is three lines — the list is explicit on purpose: a
          re-grade rewrites a committed evaluation, and which judge's is not a
          thing to infer. Every line is matched against the id grammar before
          anything runs and the whole list is refused if any line fails; so is
          an empty list, in `dry-run` as much as `apply` — a dispatch naming no
          cell asked for nothing.
        required: false
        default: ""
        type: string
      normalize_docket_markings:
        description: >-
          Converge stored docket numbers on their marking-free spelling
          (`fedcourts normalize-docket-markings`), draining the population the
          `docket_numbers_carry_no_capital_marking` corpus check reports.
          `dry-run` prints the per-row rewrite ledger — each old and new
          spelling — to the run summary and writes nothing; `apply` rewrites
          within an explicit blast-radius bound. Two dispatches is the
          procedure — `dry-run`, read the count off the ledger, then `apply`
          with that count in `normalize_max_rewrites`. The rewrite can neither
          create nor resolve a duplicate pair: both SCOTUS channels reconcile
          identity on a key that already strips the marking by shape, so the
          marked and marking-free spellings compare equal to the join before
          the rewrite as well as after, and rows that already share a
          normalized identity are reported as the dedupe pass's population
          rather than touched. Only fires on an explicit dispatch naming it;
          never on the schedule.
        required: false
        default: none
        type: choice
        options:
          - none
          - dry-run
          - apply
      normalize_max_rewrites:
        description: >-
          The rewrite bound for `normalize_docket_markings=apply`: a positive
          integer, and the number the maintainer read off the dry-run ledger.
          Required on apply, and anything but a positive integer — blank, zero,
          negative, decimal, leading-zero — is refused before the scan runs: an
          unbounded apply would convert a widened predicate into a mass
          rewrite. Ignored in every other mode. The population is finite and
          non-growing, since the ingest write site strips the marking, so a
          count above the one read means the predicate widened rather than a
          dirtier corpus.
        required: false
        default: ""
        type: string
      response_backfill:
        description: >-
          Re-derive the dated interim/merits signals — the response-requested,
          response-filed and merits-brief dates — from each row's newest stored
          live-shaped snapshot (`fedcourts backfill-response-fields`). The gaps
          are rows polled before those columns existed, and no channel corrects
          them: the live poller serves the undecided slice, so a decided row is
          never re-polled, and the undated flag beside them is a max-latched
          boolean a later write cannot turn back into a question. `dry-run`
          prints the fill ledger — each row with the dates it would gain — to
          the run summary and writes nothing; `apply` fills within an explicit
          blast-radius bound. Two dispatches is the procedure — `dry-run`, read
          the count off the ledger, then `apply` with that count in
          `response_max_fills`. The three columns are fill-in only, matching
          the latch family they sit in on the upsert path, so a stored value is
          never overwritten and a degraded payload fills nothing rather than
          asserting a date. Only fires on an explicit dispatch naming it; never
          on the schedule.
        required: false
        default: none
        type: choice
        options:
          - none
          - dry-run
          - apply
      response_max_fills:
        description: >-
          The fill bound for `response_backfill=apply`: a positive integer, and
          the number the maintainer read off the dry-run ledger — the rows
          actually filled, not the `candidates` denominator printed beside it.
          That denominator is not finite: the granted arm admits every new cert
          grant that has not yet drawn a respondent brief, so a rising
          candidate count is the ordinary docket rather than a widened
          predicate. Required on apply and refused before the scan runs unless
          it is a positive integer; ignored in every other mode.
        required: false
        default: ""
        type: string
      merits_phantom_removal:
        description: >-
          Drop open SCOTUS merits events whose docket carries no cert grant
          (`fedcourts remove-ungranted-merits-events`) — the shape left behind
          when a live re-poll stops reading a grant out of the proceedings and
          overwrites the stored date with NULL. No re-ingest or convergence
          pass reproduces one and nothing ever closes it, so it parks forever
          on the listed-unforecastable triage surface. `dry-run` prints the
          removal-and-skip ledger to the run summary and writes nothing;
          `apply` removes within an explicit blast-radius bound, in BOTH
          stores — the corpus row and the committed event directory under
          `data/`, staged together in the step's one pointer commit. Two
          dispatches is the procedure — `dry-run`, read the count off the
          ledger, then `apply` with that count in `merits_max_removals`. An
          event carrying committed predict/evaluate output, or a committed
          outcome the open corpus row contradicts, is skipped and reported
          instead. Only fires on an explicit dispatch naming it; never on the
          schedule.
        required: false
        default: none
        type: choice
        options:
          - none
          - dry-run
          - apply
      merits_max_removals:
        description: >-
          The removal bound for `merits_phantom_removal=apply`: a positive
          integer, and the number the maintainer read off the dry-run ledger.
          Required on apply here even though the command carries a default one,
          because a deletion spanning both stores states the count it is
          approving rather than inheriting it; anything but a positive integer
          is refused before the scan runs. Ignored in every other mode. The
          population is finite and non-growing — no mint produces the shape —
          so a count above the one read means the predicate widened.
        required: false
        default: ""
        type: string
      include_failed_attempts:
        description: >-
          Widen `merits_phantom_removal` onto phantoms whose only committed
          output is `attempt.json` cell-failure records, deleting those records
          along with the event (`--include-failed-attempts`). Off by default,
          because it is a trade rather than a tidy-up: those records document
          real spend on an event that names nothing the docket supports, and
          removing them buys a ledger with no dangling phantom paths at the
          cost of that failure history. Which is worth more is a judgement
          about the record, so it is an explicit choice per dispatch. It rides
          the dry-run and the apply together, so the ledger read and the
          removal that follows describe the same population, and it is refused
          unless `merits_phantom_removal` names a mode — on its own it widens
          nothing. The condition stays strict either way: every file under
          `predictions/` must be named `attempt.json` and there must be no
          `evaluations/` directory, so a `usage.json` or `retrieval_log.json`
          the harness left beside an attempt record keeps the event skipped.
        required: false
        default: false
        type: boolean

permissions: {}

# Share run-pull's corpus-writer lock: one writer at a time across both
# workflows. cancel-in-progress:false so a queued window waits rather than
# dropping a chunk; GitHub keeps only the latest pending run per group, so a
# superseded window just resumes from the pushed cursors next time.
concurrency:
  group: corpus-write
  cancel-in-progress: false

jobs:
  seed:
    runs-on: ubuntu-latest
    # The checkpointed loop caps each chunk to its remaining LOOP_BUDGET_SECONDS
    # (--max-run-seconds), stopping itself at the soft budget; this hard cap is
    # the backstop headroom above it — setup + the final checkpoint + the
    # trailing maintenance steps, NOT room for another chunk. A hit here cancels
    # the run, and the guard job turns that into a loud escalation naming the
    # step that stopped it — usually the walk overrunning, but a job can also be
    # killed here while still in setup, which is a different problem. Kept well
    # under the App token's 1h life so one token covers the whole run.
    timeout-minutes: 55
    environment: prod
    # Corpus-split flags (see run-pull): dual-write off unless CASESTORE_URL is
    # set; FEDCOURTS_CORPUS_SPLIT is the go-live switch (unset → '0' → off).
    env:
      FEDCOURTS_CASESTORE_URL: ${{ vars.CASESTORE_URL }}
      FEDCOURTS_CORPUS_SPLIT: ${{ vars.FEDCOURTS_CORPUS_SPLIT || '0' }}
    # The ambient GITHUB_TOKEN is never used here (checkout, the corpus push, and
    # every gh call run on the App token) — so it carries no write at all.
    permissions:
      contents: read
      id-token: write # assume the AWS role for the corpus S3 remote (read-write)
    steps:
      # One token up front: a ≤40-min walk plus the trailing steps stay inside
      # its 1h life, so no mid-loop re-mint is needed. Scoped to contents:write
      # only (the corpus pushes) — progress goes to the Actions step summary,
      # not an issue, so no issues:write is needed;
      # the guard job files its escalation on the ambient token instead.
      - name: Mint app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.DATA_APP_CLIENT_ID }}
          private-key: ${{ secrets.DATA_APP_PRIVATE_KEY }}
          permission-contents: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # A malformed dispatch-only input should cost seconds, not a walk window.
      # Every refusal below is also enforced where it is used, in the
      # dispatch-only steps at the tail of this job — a step has to be safe on
      # whatever reaches it, so those are the checks of record and this one is a
      # duplicate, not a substitute. It sits here, ahead of the first costly
      # step (the corpus pull), so a typo fails inside the first minute instead
      # of after the pull, a full Term walk and five sweeps — and so a bad
      # input never consumes a window on the shared corpus-write lock. Only the
      # token mint and the checkout run before it, which is also why the
      # trailing verdict stays skipped on this refusal rather than publishing:
      # no corpus has been pulled yet, and the gate on that step says so.
      # Every refusal here is kept word-for-word identical to its late twin —
      # the same grammar, the same splitting, the same all-or-nothing refusal,
      # the same `::error::` text — so one mistake can never produce two
      # differently worded refusals depending on where it was caught.
      - name: Validate dispatch inputs
        if: ${{ github.event_name == 'workflow_dispatch' }}
        # The inputs are maintainer-typed free text entering a shell, so they
        # are handled as data here exactly as they are downstream: expanded from
        # the environment, never interpolated into this script.
        env:
          REFRESH_DOCKETS: ${{ inputs.refresh_dockets }}
          REDERIVE_MODE: ${{ inputs.rederive_distribution_parse }}
          REDERIVE_PARSE: ${{ inputs.rederive_parse }}
          DISPOSITION_MODE: ${{ inputs.disposition_convergence }}
          DISPOSITION_MAX_RELABELS: ${{ inputs.disposition_max_relabels }}
          INCLUDE_SCORED: ${{ inputs.include_scored }}
          REGRADE_MODE: ${{ inputs.regrade_stale }}
          REGRADE_CELLS: ${{ inputs.regrade_cells }}
          NORMALIZE_MODE: ${{ inputs.normalize_docket_markings }}
          NORMALIZE_MAX_REWRITES: ${{ inputs.normalize_max_rewrites }}
          RESPONSE_MODE: ${{ inputs.response_backfill }}
          RESPONSE_MAX_FILLS: ${{ inputs.response_max_fills }}
          MERITS_REMOVAL_MODE: ${{ inputs.merits_phantom_removal }}
          MERITS_MAX_REMOVALS: ${{ inputs.merits_max_removals }}
          INCLUDE_FAILED_ATTEMPTS: ${{ inputs.include_failed_attempts }}
        run: |
          set -euo pipefail
          # A targeted re-snapshot is maintainer-scale by construction: a list
          # long enough to want a walk should be a `refresh_terms` dispatch
          # instead. So the numbers are grammar-checked all-or-nothing — the
          # input is typed text entering a shell, and a half-served list is
          # harder to reason about than a refused one — and the count is capped
          # well under what the step's own bound can serve at the client's
          # ~1 req/s, so an oversized list is refused loudly rather than
          # cancelling the run on a timeout.
          # Declared outside the guard so the consumer below is total: an
          # unset array under `set -u` would abort with `unbound variable`
          # instead of the refusal the maintainer needs to read.
          dockets=()
          if [ -n "${REFRESH_DOCKETS}" ]; then
            docket_pattern='^[0-9]{2}-[0-9]+$'
            docket_malformed=0
            # `printf '%s\n'`, not '%s', for the regrade list's reason: `read`
            # returns non-zero on an unterminated final line, which would drop
            # the last number silently and past the all-or-nothing check.
            while IFS= read -r number; do
              [ -n "$number" ] || continue
              if [[ "$number" =~ $docket_pattern ]]; then
                dockets+=("$number")
              else
                echo "::error::malformed refresh docket (want a Term-form SCOTUS number, e.g. 22-451; applications and original-docket numbers are separate sequences this path does not serve): ${number}"
                docket_malformed=1
              fi
            done < <(printf '%s\n' "${REFRESH_DOCKETS}" | tr -s ' \t\r' '\n')
            if [ "$docket_malformed" -ne 0 ]; then
              echo "::error::refusing the whole list — correct the numbers above and re-dispatch."
              exit 1
            fi
            if [ "${#dockets[@]}" -eq 0 ]; then
              echo "::error::refresh_dockets is set but names no docket — leave it blank to skip the re-serve."
              exit 1
            fi
            if [ "${#dockets[@]}" -gt 50 ]; then
              echo "::error::refresh_dockets names ${#dockets[@]} docket(s), past the 50 this step is sized to serve — re-open the Term with refresh_terms instead, or split the list across dispatches."
              exit 1
            fi
          fi
          # The parse label is required in BOTH running modes, not just apply:
          # the dry run's whole product is a plan attributable to one reading,
          # so a re-derivation with no reading named is not a cheaper dry run,
          # it is an unanswerable one. Whether the label is *registered* is the
          # command's refusal, not this one's — the registry lives in Python.
          if [ "${REDERIVE_MODE}" != "none" ] \
            && ! [[ "${REDERIVE_PARSE}" =~ ^[a-z][a-z0-9-]*$ ]]; then
            echo "::error::rederive_distribution_parse needs rederive_parse set to a distribution parse label — lowercase, e.g. dist-v2. A re-derivation names its reading rather than inheriting the ingest default, so there is no default to fall back on. Re-dispatch with the label."
            exit 1
          fi
          # The bound is required on apply and ignored in every other mode, so
          # a blank one is only an error when the apply would actually run.
          if [ "${DISPOSITION_MODE}" = "apply" ] \
            && ! [[ "${DISPOSITION_MAX_RELABELS}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::disposition_convergence=apply needs disposition_max_relabels set to a positive integer — the relabel count read off a previous dry-run dispatch's ledger. Re-dispatch with that number."
            exit 1
          fi
          # `include_scored` widens the sweep onto events already carrying
          # predict/evaluate output and owes a re-grade for each relabel, so it
          # is deliberate on both counts: it must name a mode to widen, and it
          # must carry the bound in EVERY mode — not the apply-only rule above.
          # A dry run that widens the ledger is where the decision to take on
          # that backlog is actually made, so the number is stated there too;
          # what the apply is checked against is the widened dry-run's own
          # relabel count, not the plain run's held-back lines, which bound the
          # population rather than count the rewrites.
          if [ "${INCLUDE_SCORED}" = "true" ]; then
            if [ "${DISPOSITION_MODE}" = "none" ]; then
              echo "::error::include_scored needs disposition_convergence set to dry-run or apply — on its own it widens nothing."
              exit 1
            fi
            if ! [[ "${DISPOSITION_MAX_RELABELS}" =~ ^[1-9][0-9]*$ ]]; then
              echo "::error::include_scored needs disposition_max_relabels set to a positive integer — relabelling a graded cell takes on a re-grade backlog, so its size is stated up front in dry-run as much as in apply. Read the held-back lines off a plain dry-run dispatch's ledger."
              exit 1
            fi
          fi
          if [ "${REGRADE_MODE}" != "none" ]; then
            # The grammar excludes `.` deliberately — with no dots no field can
            # be a `..` path segment, whatever the command does with it.
            pattern='^[a-z0-9-]+/[0-9]+/evt-[a-z0-9-]+/[0-9]{8}T[0-9]{6}Z/[a-z0-9-]+$'
            malformed=0
            cells=()
            # `printf '%s\n'`, not '%s': `read` returns non-zero on a final line
            # with no terminator, so an unterminated last cell would be dropped
            # by the loop — silently, and past the all-or-nothing check below.
            # The blank line this adds is absorbed by the emptiness guard.
            while IFS= read -r line; do
              [ -n "$line" ] || continue
              if [[ "$line" =~ $pattern ]]; then
                cells+=("$line")
              else
                echo "::error::malformed regrade cell (want court/docket/event/run_id/actor, e.g. scotus/1119228/evt-petition-certiorari/20260624T103000Z/claude-judge): ${line}"
                malformed=1
              fi
            done < <(printf '%s\n' "${REGRADE_CELLS}" | tr -s ' \t\r' '\n')
            if [ "$malformed" -ne 0 ]; then
              echo "::error::refusing the whole list — correct the lines above and re-dispatch."
              exit 1
            fi
            if [ "${#cells[@]}" -eq 0 ]; then
              echo "::error::regrade_stale=${REGRADE_MODE} names no cells — set regrade_cells."
              exit 1
            fi
          fi
          # The three repair passes below share the apply-only bound rule the
          # disposition sweep states: the number is required on apply, ignored
          # in every other mode, and is the count the maintainer read off a
          # previous dry-run dispatch's ledger. Unbounded, each would convert a
          # widened predicate into a mass rewrite rather than a loud refusal.
          if [ "${NORMALIZE_MODE}" = "apply" ] \
            && ! [[ "${NORMALIZE_MAX_REWRITES}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::normalize_docket_markings=apply needs normalize_max_rewrites set to a positive integer — the rewrite count read off a previous dry-run dispatch's ledger. Re-dispatch with that number."
            exit 1
          fi
          if [ "${RESPONSE_MODE}" = "apply" ] \
            && ! [[ "${RESPONSE_MAX_FILLS}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::response_backfill=apply needs response_max_fills set to a positive integer — the fill count read off a previous dry-run dispatch's ledger, not the candidates denominator printed beside it. Re-dispatch with that number."
            exit 1
          fi
          # Stricter than the command, which carries a default bound: a
          # deletion spanning the corpus and the committed ledger states the
          # count it is approving rather than inheriting one.
          if [ "${MERITS_REMOVAL_MODE}" = "apply" ] \
            && ! [[ "${MERITS_MAX_REMOVALS}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::merits_phantom_removal=apply needs merits_max_removals set to a positive integer — the removal count read off a previous dry-run dispatch's ledger. Re-dispatch with that number."
            exit 1
          fi
          # `include_failed_attempts` widens the removal onto phantoms carrying
          # attempt-only cell-failure records and deletes those records with the
          # event, so it must name a mode to widen. It does NOT inherit
          # `include_scored`'s every-mode bound rule: that number states a
          # decision to take on a re-grade backlog, and this widening takes on
          # none — what it grows is the removal set, which the apply's own bound
          # already sizes.
          if [ "${INCLUDE_FAILED_ATTEMPTS}" = "true" ] \
            && [ "${MERITS_REMOVAL_MODE}" = "none" ]; then
            echo "::error::include_failed_attempts needs merits_phantom_removal set to dry-run or apply — on its own it widens nothing."
            exit 1
          fi

      - name: Sync the working tree to the current tip of the default branch
        # actions/checkout pins this run's frozen github.sha — the branch tip when
        # the run was CREATED, not when it starts. A run that queues behind another
        # corpus writer on the shared corpus-write lock therefore checks out a
        # stale base, so the corpus blob it pulls and mutates is built on an
        # obsolete pointer and the final commit cannot rebase onto the advanced
        # tip (an unmergeable corpus/corpus.db.ref conflict). Reset to the live tip
        # first, under the lock, so we always mutate the latest committed corpus.
        # The repo is public, so this read-only fetch needs no credentials.
        run: |
          set -euo pipefail
          git fetch origin "${GITHUB_REF_NAME}"
          git reset --hard FETCH_HEAD

      - uses: ./.github/actions/setup-python-env

      - name: Configure git identity
        uses: ./.github/actions/configure-git-identity
        with:
          token: ${{ steps.app-token.outputs.token }}
          app-slug: ${{ steps.app-token.outputs.app-slug }}

      # Same read-write (append-only) role as run-pull's writers: the walker adds
      # snapshots, rows, and documents to the corpus blob but can never wipe
      # remote objects. The 1h session comfortably outlasts the ≤40-min loop.
      - name: Configure AWS credentials (corpus S3 remote, read-write)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}
          role-duration-seconds: 3600 # 1h
          # Bound the assume-role wall clock: unbounded, its 12 retries over a
          # multi-minute connect timeout outlast every job budget here (see the
          # workflow-traps list in docs/pipeline.md). Note the cost this buys —
          # the action does not clear its timer on the error path, so ANY failing
          # assume-role now burns the full 120s and ends on "Action timed out"
          # rather than its own message; the real cause is earlier in the log.
          action-timeout-s: 120

      - name: Pull the current corpus from the remote
        # Named so the trailing verdict can require it: `validate-corpus` is
        # graceful when no corpus is on disk and returns a *skipped* verdict,
        # which would otherwise be published over the last real one.
        id: corpus-pull
        env:
          CORPUS_REMOTE_URL: ${{ vars.CORPUS_REMOTE_URL }}
        run: |
          # The per-(Term, stream) walk cursors and identity reconciliation read
          # prior corpus state, so it must be restored; a first run has no
          # committed pointer yet — warn and start fresh. Checksum-verified.
          uv run fedcourts corpus-pull --missing-pointer warn

      - name: Re-open the requested Terms for a full re-walk
        # Dispatch-only and blank by default, so a scheduled window can never
        # reset a cursor. Runs after the pull and before the loop, under the
        # shared corpus-write lock, so the reset and the re-walk it implies are
        # one serialized operation rather than a local edit racing a cron window.
        # The mutation reaches the remote only through the loop's checkpoint
        # push, so a failure before the first checkpoint leaves the cursors
        # untouched upstream — it fails closed.
        if: inputs.refresh_terms != ''
        env:
          REFRESH_TERMS: ${{ inputs.refresh_terms }}
          REFRESH_STREAMS: ${{ inputs.refresh_streams }}
        run: |
          set -euo pipefail
          args=()
          if [ "$REFRESH_TERMS" != "all" ]; then
            for t in $REFRESH_TERMS; do
              case "$t" in
                [0-9][0-9]) args+=(--term "$t") ;;
                *) echo "::error::refresh_terms must be two-digit Terms or 'all'; got '$t'"; exit 1 ;;
              esac
            done
          fi
          if [ "$REFRESH_STREAMS" != "both" ]; then
            args+=(--stream "$REFRESH_STREAMS")
          fi
          uv run fedcourts refresh-historical "${args[@]}" --apply

      - name: Re-serve the named dockets
        # Dispatch-only and blank by default, so no scheduled window fetches
        # anything here. It sits beside the Term re-open — after the pull, before
        # the loop, under the shared corpus-write lock — for the same reason: the
        # re-serve and the walk that follows are one serialized operation rather
        # than a local corpus edit racing a cron window.
        #
        # Unlike that sibling, it pushes its own blob and commits its own
        # pointer rather than leaving the mutation for the loop's first
        # checkpoint. A cursor reset is a local edit the re-walk will redo; this
        # spends upstream requests, and a walk that fails on its first chunk
        # would take those rows to the scrapheap with the runner. Every other
        # writer step in this lane is self-contained for the same reason.
        #
        # It moves no cursor, which is what keeps it independent of the sibling
        # above: `refresh_terms` rewinds resume points and this re-reads named
        # serials, so the two write the same rows through the same latches and
        # neither can undo the other. Dispatching both together is coherent.
        #
        # No continue-on-error, for the reason the disposition pair below
        # documents: this step fails by REFUSING a list the maintainer typed, and
        # absorbing that would report a re-snapshot that never happened.
        if: inputs.refresh_dockets != ''
        # Sized to the 50-docket list the validation admits: one docket JSON each
        # at the client's ~1 req/s, plus the filed documents an ingest from the
        # document-floor Term provisions.
        timeout-minutes: 15
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          CORPUS_REMOTE_URL: ${{ vars.CORPUS_REMOTE_URL }}
          REFRESH_DOCKETS: ${{ inputs.refresh_dockets }}
        run: |
          set -euo pipefail
          # A targeted re-snapshot is maintainer-scale by construction: a list
          # long enough to want a walk should be a `refresh_terms` dispatch
          # instead. So the numbers are grammar-checked all-or-nothing — the
          # input is typed text entering a shell, and a half-served list is
          # harder to reason about than a refused one — and the count is capped
          # well under what the step's own bound can serve at the client's
          # ~1 req/s, so an oversized list is refused loudly rather than
          # cancelling the run on a timeout.
          # Declared outside the guard so the consumer below is total: an
          # unset array under `set -u` would abort with `unbound variable`
          # instead of the refusal the maintainer needs to read.
          dockets=()
          if [ -n "${REFRESH_DOCKETS}" ]; then
            docket_pattern='^[0-9]{2}-[0-9]+$'
            docket_malformed=0
            # `printf '%s\n'`, not '%s', for the regrade list's reason: `read`
            # returns non-zero on an unterminated final line, which would drop
            # the last number silently and past the all-or-nothing check.
            while IFS= read -r number; do
              [ -n "$number" ] || continue
              if [[ "$number" =~ $docket_pattern ]]; then
                dockets+=("$number")
              else
                echo "::error::malformed refresh docket (want a Term-form SCOTUS number, e.g. 22-451; applications and original-docket numbers are separate sequences this path does not serve): ${number}"
                docket_malformed=1
              fi
            done < <(printf '%s\n' "${REFRESH_DOCKETS}" | tr -s ' \t\r' '\n')
            if [ "$docket_malformed" -ne 0 ]; then
              echo "::error::refusing the whole list — correct the numbers above and re-dispatch."
              exit 1
            fi
            if [ "${#dockets[@]}" -eq 0 ]; then
              echo "::error::refresh_dockets is set but names no docket — leave it blank to skip the re-serve."
              exit 1
            fi
            if [ "${#dockets[@]}" -gt 50 ]; then
              echo "::error::refresh_dockets names ${#dockets[@]} docket(s), past the 50 this step is sized to serve — re-open the Term with refresh_terms instead, or split the list across dispatches."
              exit 1
            fi
          fi
          # `Validate dispatch inputs` up front duplicates the block above word
          # for word so a bad list dies before the corpus pull; this copy is the
          # one of record, because the step has to be safe on whatever reaches
          # it. Everything below is this step's alone.
          #
          # No committed pointer means no corpus — nothing to re-serve against,
          # and the walk that follows is what creates one.
          if [ ! -f corpus/corpus.db.ref ]; then
            echo "no corpus pointer yet; skipping the targeted re-serve"; exit 0
          fi
          gh auth setup-git # persist-credentials is false on checkout
          args=()
          for number in "${dockets[@]}"; do
            args+=(--docket "$number")
          done
          # Dry-run into the summary first: it fetches nothing and resolves each
          # number against the stored rows, so the ledger of which numbers the
          # apply is about to re-serve — and which the corpus does not hold yet —
          # outlives the step log.
          uv run fedcourts refresh-dockets "${args[@]}" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          uv run fedcourts refresh-dockets "${args[@]}" --apply 2>&1 \
            | tee -a "$GITHUB_STEP_SUMMARY"
          # Blob before pointer commit, as everywhere. `data/` rides along
          # because onboarding a number the corpus never held writes that event's
          # `outcome.json`; a re-serve of an already-resolved one writes none, so
          # a converging pass commits the pointer alone.
          uv run fedcourts corpus-push
          git add corpus/corpus.db.ref
          if [ -d data ]; then
            git add data/
          fi
          if git diff --cached --quiet; then
            echo "The named dockets are already current; nothing to persist."
            exit 0
          fi
          git commit -m "seed: re-serve named dockets"
          bash "${GITHUB_WORKSPACE}/.github/actions/commit-corpus-to-main/push_with_retry.sh" \
            "targeted re-serve pointer"

      - name: Walk the Terms in checkpointed chunks until done or out of time
        # Named for the trailing verdict too: the loop publishes at its
        # checkpoints, so a walk that died between two of them leaves ingested
        # rows in the local blob that no pointer commit covers.
        id: term-walk
        env:
          # The loop's checkpoints push the corpus blob, so the remote URL must be
          # job-step env here (CORPUS_REMOTE_URL variable).
          CORPUS_REMOTE_URL: ${{ vars.CORPUS_REMOTE_URL }}
          # Authenticate the pushes via the up-front App token (persist-credentials
          # is false on checkout). One token covers the whole ≤40-min run.
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          # Wall-clock budget for the whole loop, kept under timeout-minutes with
          # room for setup + the trailing steps, and inside the token's 1h life.
          # The 02:31 window carries the daily maintenance sweeps after the
          # loop, so it trades walk time for sweep headroom: the sweeps'
          # bounded worst case only ever binds on a non-converged window, but
          # a cap hit is a cancellation — the one outcome continue-on-error
          # cannot absorb — so the budget yields rather than gambling the
          # trailing verdict.
          # 25m where the rest of the run needs the room — the daily sweep
          # window, and any dispatch arming a writer step whose own bound is
          # large enough to matter against the job's hard cap. The targeted
          # re-serve is on that list even though it runs ahead of the loop
          # rather than after it: its bound is spent before this deadline is
          # even computed, so the job's cap is what it eats into. The three
          # repairs are all on it, including the two whose 8m bounds are small
          # individually: they are dispatchable together, and 16m of tail
          # against the 15m the cap leaves over a 40m loop is exactly the
          # "large enough to matter" this list is for. The two dispatch-only
          # steps absent from the list are absent deliberately —
          # `unlatch_overselected` and the `refresh_terms` cursor reset are
          # local, second-scale edits with no upstream traffic to pay for.
          LOOP_BUDGET_SECONDS: ${{ (github.event.schedule == '31 2 * * *' || (github.event_name == 'workflow_dispatch' && (inputs.refresh_dockets != '' || inputs.qp_backfill != 'none' || inputs.rederive_distribution_parse != 'none' || inputs.disposition_convergence != 'none' || inputs.regrade_stale != 'none' || inputs.normalize_docket_markings != 'none' || inputs.response_backfill != 'none' || inputs.merits_phantom_removal != 'none'))) && '1500' || '2400' }}
        run: |
          set -euo pipefail
          gh auth setup-git

          deadline=$(( $(date -u +%s) + LOOP_BUDGET_SECONDS ))
          # A chunk runs until its probe cap OR historical.max_run_minutes, so a
          # chunk that STARTS just under the deadline can run a full slice past it,
          # and timeout-minutes leaves only slim margin over LOOP_BUDGET_SECONDS.
          # So: never start a chunk under MIN_CHUNK_SECONDS of budget, and cap each
          # chunk to the budget still remaining (--max-run-seconds) so the walker
          # stops ITSELF on the wall clock (stopped=time-cap) rather than
          # overrunning. Cursors are pushed each checkpoint, so a short final chunk
          # just resumes next run — no work is lost.
          MIN_CHUNK_SECONDS=120

          checkpoint() {
            # Push the blob BEFORE committing the pointer so the committed pointer
            # always resolves against the remote (corpus-push streams straight from
            # the workspace file). Facts go straight to the default branch under
            # the shared corpus-write lock: the pointer, plus any outcome.json the
            # walker's resolution recorded onto a previously-open event under data/.
            uv run fedcourts corpus-push
            git add corpus/corpus.db.ref
            if [ -d data ]; then
              git add data/
            fi
            if git diff --cached --quiet; then
              echo "No corpus or outcome change this chunk; nothing to commit."
              return 0
            fi
            local ingested probed
            ingested=$(jq -r '.ingested_granted + .ingested_denied + .ingested_other' historical-report.json)
            probed=$(jq -r '.probed' historical-report.json)
            git commit -m "seed: +${ingested} petition(s) (${probed} probed)"
            # Push under the shared corpus-write lock via the same rebase-and-backoff
            # retry (loud on a genuine pointer divergence) the writer jobs all use.
            bash "${GITHUB_WORKSPACE}/.github/actions/commit-corpus-to-main/push_with_retry.sh" \
              "seed checkpoint pointer (${probed} probed)"
          }

          while :; do
            # Don't start a chunk we can't run out fully — that is the overshoot
            # the hard timeout would kill. The walk resumes next run from the
            # pushed cursors.
            remaining=$(( deadline - $(date -u +%s) ))
            if [ "$remaining" -le "$MIN_CHUNK_SECONDS" ]; then
              echo "Under ${MIN_CHUNK_SECONDS}s of budget left; the walk resumes next run from the cursors."
              break
            fi
            # One checkpoint chunk (historical.max_probes_per_run docket probes, or
            # fewer if the remaining budget binds first). The per-(Term, stream)
            # cursors advance inside the corpus and are pushed each pass, so the
            # loop resumes cleanly after any stop; the totals file accumulates the
            # whole run's counts for the summary.
            uv run fedcourts historical-terms \
              --report historical-report.json --totals historical-totals.json \
              --max-run-seconds "$remaining"
            checkpoint

            if [ "$(jq -r '.complete' historical-report.json)" = "true" ]; then
              echo "Term walk complete: every configured stream is at its frontier."
              break
            fi
            if [ "$(jq -r '.stopped' historical-report.json)" = "stream-errors" ]; then
              echo "::warning::upstream errors stopped the remaining streams; resumes next run."
              break
            fi
            # A time-cap stop means the chunk consumed the remaining budget; the
            # top-of-loop guard ends the loop on the next pass.
          done

      - name: Summarize the run
        run: |
          set -euo pipefail
          # The body is rendered by the tested library renderer over the run's
          # cumulative totals; this step only writes it to the step summary.
          uv run python - <<'PY'
          from pathlib import Path

          from fedcourtsai.pipeline.historical import HistoricalReport, render_markdown

          report = HistoricalReport.model_validate_json(Path("historical-totals.json").read_text())
          Path("historical-summary.md").write_text(render_markdown(report) + "\n")
          PY
          cat historical-summary.md >> "$GITHUB_STEP_SUMMARY"

      # Merge and drop the live-minted duplicate SCOTUS rows on the now-current
      # corpus, before the scope reconcile so the latch pass always weighs the
      # deduped rows. A standing sweep of the one-petition-one-row invariant
      # across the id ranges: any docket-number spelling that defeats the
      # channels' identity join leaves this pair shape, and the sweep merges it
      # away on the next window. Idempotent — a clean corpus finds nothing and
      # persists nothing — so riding every gated window is safe. Same
      # one-window/day gate and NON-BLOCKING contract as the reconcile below.
      - name: Dedupe live-minted duplicate rows
        id: dedupe-live-rows
        if: github.event_name != 'schedule' || github.event.schedule == '31 2 * * *'
        continue-on-error: true
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          CORPUS_REMOTE_URL: ${{ vars.CORPUS_REMOTE_URL }}
        run: |
          set -euo pipefail
          # No committed pointer means no corpus — nothing to dedupe.
          if [ ! -f corpus/corpus.db.ref ]; then
            echo "no corpus pointer yet; skipping dedupe"; exit 0
          fi
          gh auth setup-git # persist-credentials is false on checkout
          # The merge reads committed `data/` as a refusal guard (a twin whose
          # events carry committed cell output must not merge), so it needs the
          # remote tip, not this checkout's — a collect PR merging output under
          # the twin since the walk's last rebase must be visible. Fast-forward
          # only, for the sibling sweeps' reason: a sibling holding an unpushed
          # commit fails this closed rather than publishing a split.
          git fetch origin "$GITHUB_REF_NAME"
          git merge --ff-only FETCH_HEAD
          # Dry-run first, into the summary: the merge moves ledger event
          # directories with the re-keyed rows, and the would-move ledger must
          # outlive the step log the way the attribution repairs' does.
          uv run fedcourts dedupe-live-rows 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          uv run fedcourts dedupe-live-rows --apply
          # Blob before pointer commit, as everywhere.
          uv run fedcourts corpus-push
          # The merge writes both halves: the re-keyed rows into the corpus and
          # the moved minted-event directories into `data/`. Stage them into the
          # one pointer commit so both land together on the push path. The
          # guarantee is per-push, not per-step: this step is continue-on-error,
          # so a corpus-push failure here leaves the applied moves as
          # uncommitted residue that only a later blanket `git add data/` sweep
          # (the merits-events step) would carry — the reason the apply runs in
          # the same window as that sweep and never alone.
          git add corpus/corpus.db.ref
          if [ -d data ]; then
            git add data/
          fi
          if git diff --cached --quiet; then
            echo "No duplicate pairs to persist."
            exit 0
          fi
          git commit -m "seed: dedupe live-minted duplicate rows (corpus + ledger)"
          bash "${GITHUB_WORKSPACE}/.github/actions/commit-corpus-to-main/push_with_retry.sh" \
            "dedupe pointer"

      # Reconcile predict scope on the now-current corpus: latch the out-of-scope
      # cases so `open_events` drops them at the source, and clear the latch on any
      # back in scope. Gated to one window/day (02:31) so the sweep keeps its
      # daily cadence even though the walk now runs four times a day.
      # NON-BLOCKING: a hiccup must not fail the walker run.
      - name: Reconcile predict scope (latch out-of-scope cases)
        if: github.event_name != 'schedule' || github.event.schedule == '31 2 * * *'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          CORPUS_REMOTE_URL: ${{ vars.CORPUS_REMOTE_URL }}
        run: |
          set -euo pipefail
          # No committed pointer means no corpus — nothing to reconcile.
          if [ ! -f corpus/corpus.db.ref ]; then
            echo "no corpus pointer yet; skipping scope reconcile"; exit 0
          fi
          gh auth setup-git # persist-credentials is false on checkout
          uv run fedcourts reconcile-scope --apply
          # Blob before pointer commit, as everywhere.
          uv run fedcourts corpus-push
          git add corpus/corpus.db.ref
          if git diff --cached --quiet; then
            echo "Scope latch already converged; nothing to persist."
            exit 0
          fi
          git commit -m "seed: latch out-of-scope cases"
          bash "${GITHUB_WORKSPACE}/.github/actions/commit-corpus-to-main/push_with_retry.sh" \
            "scope-latch pointer"

      # The one-time pre-resize overhang clear (`unlatch-overselected`). Unlike
      # the scope reconcile above it is NOT a standing daily pass: it fires only
      # on an explicit dispatch that sets `unlatch_overselected`, never on the
      # schedule, because clearing the sticky latch is a deliberate maintainer
      # act after a capacity resize, not a recurring convergence. It runs here,
      # after the scope reconcile, so it recomputes selection over the
      # now-current, in-scope corpus. NON-BLOCKING like its sibling. The printed
      # `SalienceUnlatchResult` (the cleared-id ledger + the pre-apply pointer)
      # lands in the step log as the record of the pre-resize sticky set.
      - name: Clear the pre-resize salience overhang (unlatch-overselected)
        # Dispatch-only and gated on the dedupe sweep succeeding: a merge takes
        # the latch stickily from either twin, so an unmerged bulk twin left by
        # a failed dedupe could re-latch a case this clear just erased —
        # `docs/salience.md`'s "run dedupe first" prerequisite, enforced rather
        # than merely ordered.
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.unlatch_overselected && steps.dedupe-live-rows.outcome == 'success' }}
        continue-on-error: true
        # Comfortably above the ~8 min the sibling scope reconcile takes on the
        # same recompute-plus-~1GB-push, so the write completes and commits its
        # pointer rather than being cancelled mid-flight (below that cost a cap
        # leaves nothing applied). Still bounded, so the step's worst case stays
        # under the job's own 55-min cap: a job-cap cancellation is one
        # `continue-on-error` cannot absorb, and would escalate an otherwise
        # healthy walk.
        timeout-minutes: 15
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          CORPUS_REMOTE_URL: ${{ vars.CORPUS_REMOTE_URL }}
        run: |
          set -euo pipefail
          # No committed pointer means no corpus — nothing to reconcile.
          if [ ! -f corpus/corpus.db.ref ]; then
            echo "no corpus pointer yet; skipping unlatch-overselected"; exit 0
          fi
          gh auth setup-git # persist-credentials is false on checkout
          # The write erases the corpus's own record of the pre-resize sticky
          # set, so the result IS the record: mirror it (stdout + the pre-apply
          # pointer echoed on stderr) into the run summary, which outlives the
          # step log's retention.
          uv run fedcourts unlatch-overselected --apply 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          # Blob before pointer commit, as everywhere.
          uv run fedcourts corpus-push
          git add corpus/corpus.db.ref
          if git diff --cached --quiet; then
            echo "No overhang to clear; nothing to persist."
            exit 0
          fi
          git commit -m "seed: clear pre-resize salience overhang"
          bash "${GITHUB_WORKSPACE}/.github/actions/commit-corpus-to-main/push_with_retry.sh" \
            "unlatch-overselected pointer"

      # The questions-presented re-derivation (`backfill-questions-presented`).
      # Like the overhang clear above, it fires only on an explicit dispatch
      # that names it, never on the schedule: the command's dry-run ledger is
      # the triage list a maintainer reads, so the intended procedure is two
      # dispatches — `dry-run`, read the summary, then `apply` (the apply
      # run's own dry-run is a receipt, not a reading). It runs in this lane
      # because corpus writes exist nowhere else — the write role and the
      # content store are the job's — and inherits the dedupe gate for the
      # sibling's reason: the sweep must weigh deduped rows, not a twin's.
      # No fetch/ff-only here, unlike the merits-events sibling: the command
      # reads corpus rows and documents only — no `data/` ledger guard — and
      # commits only the pointer, the judgments sibling's shape.
      # The refusal guard makes the apply non-destructive (a stored
      # full-length question the current extractor cannot re-derive is
      # reported, never emptied), and the apply verifies itself: under the
      # corpus split the durable write is the content store's per-case PUT —
      # best-effort, per-case failures logged not raised — and the blob and
      # pointer may not move at all, so convergence is witnessed by re-running
      # the dry-run and requiring zero remaining rewrites, not by the pointer.
      - name: Backfill questions presented (dispatch-only)
        # The event_name conjunct is load-bearing: on a schedule the inputs
        # context is empty and `inputs.qp_backfill != 'none'` evaluates TRUE
        # (null vs 'none' is a NaN comparison) — never lift the input clause
        # out of this conjunction.
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.qp_backfill != 'none' && steps.dedupe-live-rows.outcome == 'success' }}
        continue-on-error: true
        # A guess sized above the siblings', not a measurement: the pass reads
        # stored petition text per live-slice SCOTUS row — under the split
        # mode one content-store GET each, twice on an apply, plus the mirror
        # PUTs. The first `dry-run` dispatch is what measures the real cost;
        # resize from its wall clock. A cap hit is absorbed by
        # continue-on-error and nothing publishes without the verification
        # below, so the bound errs generous rather than tight.
        timeout-minutes: 30
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          CORPUS_REMOTE_URL: ${{ vars.CORPUS_REMOTE_URL }}
          QP_BACKFILL_MODE: ${{ inputs.qp_backfill }}
        run: |
          set -euo pipefail
          # No committed pointer means no corpus — nothing to re-derive.
          if [ ! -f corpus/corpus.db.ref ]; then
            echo "no corpus pointer yet; skipping questions-presented backfill"; exit 0
          fi
          gh auth setup-git # persist-credentials is false on checkout
          # Dry-run first, into the summary: the reason-class ledger is the
          # triage record, and it must outlive the step log either way.
          uv run fedcourts backfill-questions-presented 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "${QP_BACKFILL_MODE}" != "apply" ]; then
            echo "dry-run only; nothing written."
            exit 0
          fi
          uv run fedcourts backfill-questions-presented --apply 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          # Convergence check: the command is idempotent, so a clean apply
          # leaves the re-run with nothing to rewrite. This is the witness the
          # pointer cannot be under the split mode (see the step comment) —
          # and it is what catches a swallowed content-store write.
          uv run fedcourts backfill-questions-presented 2>&1 \
            | tee -a "$GITHUB_STEP_SUMMARY" | tee /tmp/qp-verify.txt
          if ! grep -q "would rewrite 0," /tmp/qp-verify.txt; then
            echo "::error::apply did not converge — the re-run still reports rewrites (a content-store write may have failed; see the warnings above)"
            exit 1
          fi
          # Blob before pointer commit, as everywhere. Under the split mode
          # the blob carries no document text, so an unmoved pointer here is
          # the normal converged outcome, not a missing write.
          uv run fedcourts corpus-push
          git add corpus/corpus.db.ref
          if git diff --cached --quiet; then
            echo "pointer unmoved — the durable write is the content store's, verified converged above."
            exit 0
          fi
          git commit -m "seed: converge corpus (questions presented)"
          bash "${GITHUB_WORKSPACE}/.github/actions/commit-corpus-to-main/push_with_retry.sh" \
            "questions-presented pointer"

      # An application docket's baseline event is a stay or injunction, not a
      # cert petition; discovery mints it as motion/interim, and this converges
      # the rows minted before that rule. Idempotent, so after it converges the
      # step costs seconds. Runs in the lane rather than a dev checkout because
      # the pointer is a git file the writers commit to main and `corpus-push`
      # is last-writer-wins — a stale local copy would republish over concurrent
      # walks. The corpus-write concurrency group serializes it.
      - name: Relabel application-docket baseline events (interim stage)
        if: github.event_name != 'schedule' || github.event.schedule == '31 2 * * *'
        continue-on-error: true
        # Bounded so the tail cannot push the job past its cap: overrunning
        # cancels the run, and cancellation is the one outcome
        # `continue-on-error` does not absorb — it would lose the trailing
        # verdict and escalate a healthy run. A timed-out sweep is non-fatal
        # and converges next window.
        timeout-minutes: 8
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          CORPUS_REMOTE_URL: ${{ vars.CORPUS_REMOTE_URL }}
        run: |
          set -euo pipefail
          # No committed pointer means no corpus — nothing to relabel.
          if [ ! -f corpus/corpus.db.ref ]; then
            echo "no corpus pointer yet; skipping application relabel"; exit 0
          fi
          gh auth setup-git # persist-credentials is false on checkout
          # The rename's orphan guard reads committed ledger artifacts out of
          # `data/`, and this checkout is only as fresh as the walk's last
          # checkpoint rebase — up to a window stale. A collect PR merging
          # artifacts for an application docket in that gap would be invisible
          # here, and the rename would orphan exactly what the guard exists to
          # prevent. Read the remote tip instead — fast-forward only, so a
          # sibling step's unpushed local commit (its push retries exhausted)
          # fails this step closed rather than being discarded while its
          # corpus mutations survive in the workspace DB.
          git fetch origin "$GITHUB_REF_NAME"
          git merge --ff-only FETCH_HEAD
          uv run fedcourts relabel-application-events --apply
          # Blob before pointer commit, as everywhere.
          uv run fedcourts corpus-push
          git add corpus/corpus.db.ref
          if git diff --cached --quiet; then
            echo "Application baselines already relabeled; nothing to persist."
            exit 0
          fi
          git commit -m "seed: converge corpus (application baselines)"
          bash "${GITHUB_WORKSPACE}/.github/actions/commit-corpus-to-main/push_with_retry.sh" \
            "application-relabel pointer"

      # Parse each merits-bound grant's stored snapshot for the judgment the
      # Court entered, feeding the statpack's merits section. Reads the content
      # store, so it depends on the job-level split-mode env; a case whose
      # snapshot is unreachable is counted, never fatal. Converges like the
      # sweeps above — a re-run over an unchanged corpus stamps nothing.
      - name: Backfill merits judgments
        if: github.event_name != 'schedule' || github.event.schedule == '31 2 * * *'
        continue-on-error: true
        # Bounded for the same reason, and more tightly needed: the first
        # non-converged pass reads the content store once per merits-bound
        # grant — pooled at PREFETCH_READERS workers, so the bound guards a
        # stalled store, not throughput.
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          CORPUS_REMOTE_URL: ${{ vars.CORPUS_REMOTE_URL }}
        run: |
          set -euo pipefail
          # No committed pointer means no corpus — nothing to parse.
          if [ ! -f corpus/corpus.db.ref ]; then
            echo "no corpus pointer yet; skipping merits backfill"; exit 0
          fi
          gh auth setup-git # persist-credentials is false on checkout
          uv run fedcourts backfill-merits-judgments --apply
          # Blob before pointer commit, as everywhere.
          uv run fedcourts corpus-push
          git add corpus/corpus.db.ref
          if git diff --cached --quiet; then
            echo "Merits judgments already stamped; nothing to persist."
            exit 0
          fi
          git commit -m "seed: converge corpus (merits judgments)"
          bash "${GITHUB_WORKSPACE}/.github/actions/commit-corpus-to-main/push_with_retry.sh" \
            "merits-judgment pointer"

      # Mint the open merits forecast events onto already-granted, undecided
      # dockets. The live mint opens a case's merits events at cert-grant
      # *detection*, so a grant latched by the walker without a live resolution
      # pass carries none — and the merits fan-out has no population there.
      # Ordering contract with the step above: the mint treats a null
      # `merits_judgment` as unlatched, not pending, so
      # `backfill-merits-judgments --apply` must run immediately before this
      # sweep in the same corpus session, leaving the judgment columns
      # as-latched-as-possible before pendency is judged. Converges like the
      # sweeps above — a converged corpus mints nothing.
      - name: Backfill merits events
        if: github.event_name != 'schedule' || github.event.schedule == '31 2 * * *'
        continue-on-error: true
        # Bounded for the same reason as the judgments pass: the pendency check
        # reads a stored snapshot per grant it owes a mint — pooled at
        # PREFETCH_READERS workers on a non-converged corpus. On the first
        # non-converged 02:31 window the job's 55m cap can still bind (the walk
        # plus the judgments pass plus this step, each at its bound), and a cap
        # hit cancels the run rather than continuing — so that window may raise
        # a one-off guard escalation.
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          CORPUS_REMOTE_URL: ${{ vars.CORPUS_REMOTE_URL }}
        run: |
          set -euo pipefail
          # No committed pointer means no corpus — nothing to mint.
          if [ ! -f corpus/corpus.db.ref ]; then
            echo "no corpus pointer yet; skipping merits-event backfill"; exit 0
          fi
          gh auth setup-git # persist-credentials is false on checkout
          # The mint's skip guards read committed ledger artifacts out of
          # `data/` and its writes land new `event.yaml` files beside them, and
          # this checkout is only as fresh as the previous step's rebase — up to
          # a window stale. Read the remote tip first so the guards and the
          # writes both see the current ledger — fast-forward only, failing
          # closed on a sibling step's unpushed commit (see the relabel step).
          git fetch origin "$GITHUB_REF_NAME"
          git merge --ff-only FETCH_HEAD
          # Stamp the null moment columns first (trivially idempotent), so the
          # events sweep and every moment-keyed reader group on materialized
          # moments.
          uv run fedcourts backfill-event-moments --apply
          # Dry-run first so the step log carries the skip/triage report the
          # maintainer reads, then apply through the live mint's write path.
          uv run fedcourts backfill-merits-events
          uv run fedcourts backfill-merits-events --apply
          # Blob before pointer commit, as everywhere.
          uv run fedcourts corpus-push
          # Unlike the pointer-only sweeps above, this one writes ledger
          # `event.yaml` files under `data/` as well as moving the pointer —
          # stage BOTH in the one commit, or the pointer lands without the
          # ledger half of the mint. The directory guard mirrors the walk's
          # checkpoint: on a tip without data/ an unguarded add fails under
          # `set -euo pipefail` AFTER the blob push, and continue-on-error
          # would leave the sweep silently never converging.
          git add corpus/corpus.db.ref
          if [ -d data ]; then
            git add data/
          fi
          if git diff --cached --quiet; then
            echo "Merits events already converged; nothing to persist."
            exit 0
          fi
          git commit -m "seed: converge corpus (merits events)"
          bash "${GITHUB_WORKSPACE}/.github/actions/commit-corpus-to-main/push_with_retry.sh" \
            "merits-event pointer"

      # Repair the misattribution shape an earlier single-open-event
      # attribution shortcut wrote, and its cause: entry-pinned SCOTUS events
      # carrying a case-baseline id are removed (no re-ingest reproduces one —
      # `extract_events` refuses the kind at SCOTUS), then non-baseline events
      # whose outcome duplicates a case-baseline sibling's outcome triple are
      # deleted and reopened. Removal runs first: it clears the entry-pinned
      # case of the reopen sweep's baseline-pair triage, so one window
      # converges both. Both sweeps skip and report any event carrying
      # committed predict/evaluate output, and both refuse to apply above
      # their blast-radius bound — the population is finite and non-growing,
      # so a large count means a widened predicate, not a dirtier ledger. The
      # ledger deletions and rewrites ride this lane because no collect jail
      # admits them (`assert_within_jail` takes adds only,
      # `assert_cleanup_within_jail` deletes under `predictions/` only); here
      # they stage into the one pointer commit, atomic with the corpus they
      # must match. Converges like the sweeps above — a repaired ledger
      # removes and reopens nothing.
      - name: Repair misattributed baseline outcomes
        if: github.event_name != 'schedule' || github.event.schedule == '31 2 * * *'
        continue-on-error: true
        # Bounded like the siblings, and comfortably: both scans are local
        # (committed outcomes against corpus rows), no external-service loop.
        # This raises the 02:31 window's bounded sweep tail to 36m over the
        # 40m loop, against the job's 55m cap — but only a non-converged
        # window pays a sweep's bound, and this pair's backlog is two events;
        # every later window costs seconds.
        timeout-minutes: 8
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          CORPUS_REMOTE_URL: ${{ vars.CORPUS_REMOTE_URL }}
        run: |
          set -euo pipefail
          # No committed pointer means no corpus — nothing to repair.
          if [ ! -f corpus/corpus.db.ref ]; then
            echo "no corpus pointer yet; skipping attribution repairs"; exit 0
          fi
          gh auth setup-git # persist-credentials is false on checkout
          # Both sweeps read committed ledger artifacts out of `data/` and
          # delete or rewrite beside them, and this checkout is only as fresh
          # as the previous step's rebase — read the remote tip first so the
          # skip guards see every collect PR merged in the gap. Fast-forward
          # only: if a sibling step's push retries were exhausted, its local
          # commit is unpushed while its corpus mutations survive in the
          # workspace DB, and a hard reset would publish that split — failing
          # closed here leaves the next window to reconverge instead.
          git fetch origin "$GITHUB_REF_NAME"
          git merge --ff-only FETCH_HEAD
          # Dry-run first, mirrored into the run summary so each sweep's
          # report — every removal, reopen, and skip with its reason — stays
          # answerable after step-log retention; then apply.
          uv run fedcourts remove-unmintable-events | tee -a "$GITHUB_STEP_SUMMARY"
          uv run fedcourts remove-unmintable-events --apply
          uv run fedcourts reopen-misattributed-outcomes | tee -a "$GITHUB_STEP_SUMMARY"
          uv run fedcourts reopen-misattributed-outcomes --apply
          # Blob before pointer commit, as everywhere. An apply that pushed the
          # blob but failed before the commit publishes nothing: readers
          # resolve the committed pointer, and the next window re-detects from
          # the still-committed ledger and reconverges.
          uv run fedcourts corpus-push
          # `git add data/` stages the deletions and rewrites along with the
          # pointer — one commit, so the ledger and the corpus it must match
          # land together or not at all. (The directory guard is inherited
          # from the add sweeps' shape; a repair with anything to stage always
          # has a `data/` tree.)
          git add corpus/corpus.db.ref
          if [ -d data ]; then
            git add data/
          fi
          if git diff --cached --quiet; then
            echo "Attribution already repaired; nothing to persist."
            exit 0
          fi
          git commit -m "seed: converge corpus (attribution repairs)"
          bash "${GITHUB_WORKSPACE}/.github/actions/commit-corpus-to-main/push_with_retry.sh" \
            "attribution-repair pointer"

      # The stored circuit slice still carries the bulk export's misjoined
      # cluster fields; the ingest projection withholds them from a re-served
      # bulk row, and this converges the rows nothing re-serves. Detection is
      # provable bulk provenance — fields the REST channel cannot supply —
      # so docket-derived judges/panel on discovery-onboarded rows survive.
      # The apply refuses above the command's blast-radius bound, sized just
      # over the measured slice: a widened predicate should fail loudly, not
      # null a channel the carve-out never covered. Corpus-only:
      # no ledger surface, so a pointer-only commit like the judgments sweep.
      # Idempotent — a scrubbed corpus matches nothing, so a converged
      # window's cost is the apply's own count scan, seconds over the cases
      # table.
      - name: Scrub the bulk slice's misjoined cluster fields
        if: github.event_name != 'schedule' || github.event.schedule == '31 2 * * *'
        continue-on-error: true
        # Bounded for the same reason as the sibling sweeps — a cap hit
        # cancels the whole run, which continue-on-error cannot absorb — and
        # tightly: one UPDATE against the pulled blob (the first
        # non-converged window rewrites ~1.36M rows in seconds), then the
        # blob push the walk pays on every window anyway.
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          CORPUS_REMOTE_URL: ${{ vars.CORPUS_REMOTE_URL }}
        run: |
          set -euo pipefail
          # No committed pointer means no corpus — nothing to scrub.
          if [ ! -f corpus/corpus.db.ref ]; then
            echo "no corpus pointer yet; skipping cluster scrub"; exit 0
          fi
          gh auth setup-git # persist-credentials is false on checkout
          # One apply, its count line mirrored into the run summary: a
          # separate dry run would repeat the same full-table count for a
          # one-line report the apply already prints.
          uv run fedcourts scrub-bulk-cluster-fields --apply | tee -a "$GITHUB_STEP_SUMMARY"
          # Blob before pointer commit, as everywhere.
          uv run fedcourts corpus-push
          git add corpus/corpus.db.ref
          if git diff --cached --quiet; then
            echo "Bulk cluster fields already scrubbed; nothing to persist."
            exit 0
          fi
          git commit -m "seed: converge corpus (bulk cluster scrub)"
          bash "${GITHUB_WORKSPACE}/.github/actions/commit-corpus-to-main/push_with_retry.sh" \
            "cluster-scrub pointer"

      # Re-deriving `distribution_count` under a named parse is the first of
      # the three pieces of work that activate a new distribution parse
      # (`docs/salience.md`), and the only one that touches stored state. It is
      # dispatch-only and never scheduled: the parse a re-derivation runs under
      # is a maintainer's decision read off a `distribution-census` artifact,
      # and there is no standing reading for a window to converge toward.
      #
      # It writes with a direct UPDATE that bypasses the column's max latch —
      # the upsert path would eat a narrower reading's every row and report
      # success — so the guard the latch was providing is the command's own:
      # a row whose latest live-shaped snapshot discloses no proceedings is
      # counted and left untouched, never written to 0. The apply refuses above
      # the command's blast-radius bound, sized off the census's measured delta.
      # Corpus-only, so a pointer-only commit like the scrub above; idempotent,
      # since a converged column recomputes to itself.
      #
      # It sits here, after the converging sweeps, because it fails hard: a
      # fail-hard step ahead of them would skip every one under the implicit
      # success(). The cost is that anything earlier in the same run weighed
      # incumbent-parse counts — the scope reconcile self-heals next window,
      # but `unlatch_overselected` does not, since its write erases the sticky
      # set it recomputed. So the two do not belong in one dispatch: clear the
      # overhang under the bands the re-derivation leaves behind, not before.
      - name: Re-derive the distribution counts (dispatch-only)
        # The event_name conjunct is load-bearing for the reason the sibling
        # dispatch-only steps document: on a schedule the inputs context is
        # empty and the `!= 'none'` comparison evaluates TRUE. The dedupe
        # conjunct is theirs too — this one recounts off corpus rows, and an
        # unmerged twin is a second row for the same petition, so the count
        # must land on the merged one.
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.rederive_distribution_parse != 'none' && steps.dedupe-live-rows.outcome == 'success' }}
        # Network-bound like the questions-presented backfill rather than the
        # local sweeps: under the corpus split the pass reads one content-store
        # object per live-slice SCOTUS row (tens of thousands), pooled by the
        # shared prefetch, then pays the blob push. The generous bound is NOT
        # the qp sibling's reasoning — that one can afford a loose cap because
        # continue-on-error absorbs a cap hit, and this step deliberately has
        # none, so a cap hit reddens the run and opens a pipeline-health issue.
        # It is sized off the pooled read instead, and the first `dry-run`
        # dispatch is what re-sizes it. For the same reason this input and
        # `qp_backfill` belong to separate dispatches: two 30-minute steps do
        # not fit under the job cap beside a walk, and a cap hit is a
        # cancellation rather than a failure.
        timeout-minutes: 30
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          CORPUS_REMOTE_URL: ${{ vars.CORPUS_REMOTE_URL }}
          REDERIVE_MODE: ${{ inputs.rederive_distribution_parse }}
          REDERIVE_PARSE: ${{ inputs.rederive_parse }}
        run: |
          set -euo pipefail
          # Validate the label before anything else, including the corpus
          # guard: a dispatch that cannot legally run should say so in seconds,
          # not after a full-population read. `Validate dispatch inputs` up
          # front duplicates this word for word so a bad dispatch dies before
          # the corpus pull; this copy is the one of record, because the step
          # has to be safe on whatever reaches it.
          if [ "${REDERIVE_MODE}" != "none" ] \
            && ! [[ "${REDERIVE_PARSE}" =~ ^[a-z][a-z0-9-]*$ ]]; then
            echo "::error::rederive_distribution_parse needs rederive_parse set to a distribution parse label — lowercase, e.g. dist-v2. A re-derivation names its reading rather than inheriting the ingest default, so there is no default to fall back on. Re-dispatch with the label."
            exit 1
          fi
          # No committed pointer means no corpus — nothing to re-derive.
          if [ ! -f corpus/corpus.db.ref ]; then
            echo "no corpus pointer yet; skipping the distribution re-derivation"; exit 0
          fi
          gh auth setup-git # persist-credentials is false on checkout
          # One pass, whichever mode: the command's plan IS its write set, so an
          # apply prints the same report a dry run would and a separate dry run
          # ahead of it would only repeat a full-population read over the
          # content store. Declared outside the guard so the expansion is total
          # under `set -u`.
          apply_args=()
          if [ "${REDERIVE_MODE}" = "apply" ]; then
            apply_args+=(--apply)
          fi
          uv run fedcourts rederive-distribution-counts --parse "${REDERIVE_PARSE}" \
            "${apply_args[@]}" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "${REDERIVE_MODE}" != "apply" ]; then
            echo "dry-run only; nothing written."
            exit 0
          fi
          # Blob before pointer commit, as everywhere.
          uv run fedcourts corpus-push
          git add corpus/corpus.db.ref
          if git diff --cached --quiet; then
            echo "Distribution counts already re-derived under this parse; nothing to persist."
            exit 0
          fi
          git commit -m "seed: converge corpus (distribution counts)"
          bash "${GITHUB_WORKSPACE}/.github/actions/commit-corpus-to-main/push_with_retry.sh" \
            "distribution-count pointer"

      # Converge stored docket numbers on their marking-free spelling, draining
      # the population the `docket_numbers_carry_no_capital_marking` corpus
      # check reports. The ingest write site stores the number with the Court's
      # capital-case marking removed and raises `capital_case` beside it, so a
      # stored row converges only when that site touches it again — which no
      # automatic channel does outside the live slice. This is the dedicated
      # sweep that drains the backlog without a re-read.
      #
      # Corpus-only: no ledger surface, so a pointer-only commit like the
      # cluster scrub, and no fetch/ff-only ahead of it — nothing here reads
      # committed `data/`. Dispatch-only and never scheduled, because the bound
      # is a count a maintainer read off a dry run rather than a state a window
      # can converge toward; and no continue-on-error, for the reason the
      # disposition pair below documents — it fails by REFUSING an apply
      # without its bound, and absorbing that would report a convergence that
      # never happened.
      - name: Converge stored docket markings (dispatch-only)
        # The event_name conjunct is load-bearing for the reason the sibling
        # dispatch-only steps document: on a schedule the inputs context is
        # empty and the `!= 'none'` comparison evaluates TRUE. The dedupe
        # conjunct is theirs too — this rewrites the docket-number column the
        # channels' identity join reads through, so the bound must be checked
        # against the merged population rather than a twin's. The rewrite
        # itself can neither create nor resolve a collision: both channels
        # reconcile on a key that already strips the marking by shape, so the
        # two spellings compare equal to the join before it as well as after.
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.normalize_docket_markings != 'none' && steps.dedupe-live-rows.outcome == 'success' }}
        # Local like the cluster scrub — one scan of the cases table and a
        # bounded UPDATE against the pulled blob — plus the blob push the walk
        # pays on every window anyway. Still bounded, so the step's worst case
        # cannot push the job past its own 55m cap: a cap hit there is a
        # cancellation, which no failure handling absorbs.
        timeout-minutes: 8
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          CORPUS_REMOTE_URL: ${{ vars.CORPUS_REMOTE_URL }}
          NORMALIZE_MODE: ${{ inputs.normalize_docket_markings }}
          NORMALIZE_MAX_REWRITES: ${{ inputs.normalize_max_rewrites }}
        run: |
          set -euo pipefail
          # Validate the bound before anything else, including the corpus
          # guard: a dispatch that cannot legally apply should say so in
          # seconds, not after a full scan. The command refuses an unbounded
          # apply on its own too; this refusal is the one with the maintainer's
          # procedure in it. `Validate dispatch inputs` up front duplicates it
          # word for word so a bad dispatch dies before the corpus pull; this
          # copy is the one of record, because the step has to be safe on
          # whatever reaches it.
          if [ "${NORMALIZE_MODE}" = "apply" ] \
            && ! [[ "${NORMALIZE_MAX_REWRITES}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::normalize_docket_markings=apply needs normalize_max_rewrites set to a positive integer — the rewrite count read off a previous dry-run dispatch's ledger. Re-dispatch with that number."
            exit 1
          fi
          # No committed pointer means no corpus — nothing to converge.
          if [ ! -f corpus/corpus.db.ref ]; then
            echo "no corpus pointer yet; skipping the docket-marking convergence"; exit 0
          fi
          gh auth setup-git # persist-credentials is false on checkout
          # Dry-run first, into the summary: the per-row ledger — each old and
          # new spelling, and which rows already share a normalized identity —
          # is the reading the apply's bound comes from, and it must outlive
          # the step log. (On an apply this run is a receipt, not a reading:
          # nobody reads it before the rewrite.)
          uv run fedcourts normalize-docket-markings 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "${NORMALIZE_MODE}" != "apply" ]; then
            echo "dry-run only; nothing written."
            exit 0
          fi
          uv run fedcourts normalize-docket-markings --apply \
            --max-rewrites "${NORMALIZE_MAX_REWRITES}" 2>&1 \
            | tee -a "$GITHUB_STEP_SUMMARY"
          # Blob before pointer commit, as everywhere.
          uv run fedcourts corpus-push
          git add corpus/corpus.db.ref
          if git diff --cached --quiet; then
            echo "Docket markings already converged; nothing to persist."
            exit 0
          fi
          git commit -m "seed: converge corpus (docket markings)"
          bash "${GITHUB_WORKSPACE}/.github/actions/commit-corpus-to-main/push_with_retry.sh" \
            "docket-marking pointer"

      # Re-derive the dated interim/merits signals — `response_requested_at`,
      # `response_filed_at`, `merits_brief_filed` — from each row's newest
      # stored live-shaped snapshot. The gaps are rows polled before those
      # columns existed, and no channel corrects them: the live poller serves
      # the undecided slice, so a decided row is never re-polled, and the
      # undated flag beside them is a max-latched boolean a later write cannot
      # turn back into a question. Recoverable from the corpus alone, since
      # that stored snapshot is the same payload the original ingest read.
      #
      # It reads those snapshots, which under the corpus split live in the
      # content store rather than the blob — so like the merits-judgment sweep
      # it depends on the job-level split-mode env pair, and a row with no
      # stored snapshot is counted and reported rather than failed. Its write
      # is a direct UPDATE of the index, so unlike the questions-presented
      # backfill the pointer IS the witness here and a plain pointer commit
      # suffices; no ledger surface, so no fetch/ff-only. Dispatch-only, never
      # scheduled, and no continue-on-error — it fails by REFUSING an apply
      # without its bound.
      - name: Backfill the dated response signals (dispatch-only)
        # The event_name conjunct is load-bearing for the sibling steps'
        # reason: on a schedule the inputs context is empty and the `!= 'none'`
        # comparison evaluates TRUE. The dedupe conjunct is theirs too — this
        # fills columns off corpus rows, and an unmerged twin is a second row
        # for the same petition, so the fill must land on the merged one.
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.response_backfill != 'none' && steps.dedupe-live-rows.outcome == 'success' }}
        # Network-bound like the questions-presented backfill rather than the
        # local sweeps: one content-store read per candidate row, pooled by the
        # shared prefetch. Sized between the merits-judgment pass and the
        # questions-presented one — a guess, not a measurement, since the
        # candidate set is a subset of the live slice; the first `dry-run`
        # dispatch is what re-sizes it. This step carries no continue-on-error,
        # so a cap hit reddens the run and the guard job names the step rather
        # than being absorbed — which is why the bound errs generous.
        timeout-minutes: 20
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          CORPUS_REMOTE_URL: ${{ vars.CORPUS_REMOTE_URL }}
          RESPONSE_MODE: ${{ inputs.response_backfill }}
          RESPONSE_MAX_FILLS: ${{ inputs.response_max_fills }}
        run: |
          set -euo pipefail
          # Validate the bound before anything else, including the corpus
          # guard: a dispatch that cannot legally apply should say so in
          # seconds, not after a full-population read of the content store.
          # `Validate dispatch inputs` up front duplicates it word for word so
          # a bad dispatch dies before the corpus pull; this copy is the one of
          # record, because the step has to be safe on whatever reaches it.
          if [ "${RESPONSE_MODE}" = "apply" ] \
            && ! [[ "${RESPONSE_MAX_FILLS}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::response_backfill=apply needs response_max_fills set to a positive integer — the fill count read off a previous dry-run dispatch's ledger, not the candidates denominator printed beside it. Re-dispatch with that number."
            exit 1
          fi
          # No committed pointer means no corpus — nothing to re-derive.
          if [ ! -f corpus/corpus.db.ref ]; then
            echo "no corpus pointer yet; skipping the response-signal backfill"; exit 0
          fi
          gh auth setup-git # persist-credentials is false on checkout
          # Dry-run first, into the summary: the fill ledger — each row with the
          # dates it gains, beside the counts of rows read with nothing to fill,
          # with no stored snapshot, and whose snapshot discloses no proceedings
          # — is the reading the apply's bound comes from, and it must outlive
          # the step log. (On an apply this run is a receipt, not a reading.)
          uv run fedcourts backfill-response-fields 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "${RESPONSE_MODE}" != "apply" ]; then
            echo "dry-run only; nothing written."
            exit 0
          fi
          uv run fedcourts backfill-response-fields --apply \
            --max-fills "${RESPONSE_MAX_FILLS}" 2>&1 \
            | tee -a "$GITHUB_STEP_SUMMARY"
          # Blob before pointer commit, as everywhere.
          uv run fedcourts corpus-push
          git add corpus/corpus.db.ref
          if git diff --cached --quiet; then
            echo "Response signals already filled; nothing to persist."
            exit 0
          fi
          git commit -m "seed: converge corpus (dated response signals)"
          bash "${GITHUB_WORKSPACE}/.github/actions/commit-corpus-to-main/push_with_retry.sh" \
            "response-signal pointer"

      # Drop open SCOTUS merits events whose docket carries no cert grant, in
      # both stores. A merits event is born from a grant — every mint path
      # routes through `opens_merits_proceeding`, which requires the row's
      # `date_cert_granted` — so an open merits-stage event on a row whose
      # grant column is NULL is one no re-ingest or convergence pass
      # reproduces, and one nothing ever closes: merits detection reads the
      # same grant-gated columns, so it parks forever on the
      # listed-unforecastable triage surface rather than resolving.
      #
      # Ordering against the merits-event mint above, which runs on every
      # dispatch: this step is after it, the safe direction — and also the
      # direction that does not matter, which is worth stating so a later
      # reorder knows what it is free to move. The two populations are disjoint
      # by construction: the mint writes only where `date_cert_granted` is
      # non-NULL, and this removes only where it is NULL, so neither can create
      # or destroy the other's population. That is also why this step carries
      # no gate on the mint's outcome, unlike the dedupe gate below — making a
      # maintainer-dispatched repair skip on an unrelated sweep's failure buys
      # nothing when there is no shared population to be wrong about.
      #
      # The ledger half is what shapes the commit. Like the attribution
      # repairs, this deletes committed event directories under `data/` as well
      # as the corpus row, so it reads the remote tip first — the skip guards
      # read committed predict/evaluate output that arrives by collect PR — and
      # stages `data/` with the pointer in ONE commit: an uncommitted ledger
      # half strands a directory under an id the corpus no longer carries, and
      # no later pass re-detects it. Dispatch-only, never scheduled, and no
      # continue-on-error: it fails by REFUSING an apply without its bound.
      - name: Remove ungranted merits phantoms (dispatch-only)
        # The event_name conjunct is load-bearing for the sibling steps'
        # reason: on a schedule the inputs context is empty and the `!= 'none'`
        # comparison evaluates TRUE. The dedupe conjunct is sharpest here of
        # all the siblings: whether an event is a phantom is read off its row's
        # grant column, and an unmerged twin is a second row for the same
        # petition — so the judgment, and the deletion that follows it, must be
        # made on the merged row.
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.merits_phantom_removal != 'none' && steps.dedupe-live-rows.outcome == 'success' }}
        # Bounded like the attribution repairs whose shape this copies: both
        # scans are local — committed ledger artifacts against corpus rows —
        # with no external-service loop, and the blob push the walk pays on
        # every window anyway.
        timeout-minutes: 8
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          CORPUS_REMOTE_URL: ${{ vars.CORPUS_REMOTE_URL }}
          MERITS_REMOVAL_MODE: ${{ inputs.merits_phantom_removal }}
          MERITS_MAX_REMOVALS: ${{ inputs.merits_max_removals }}
          INCLUDE_FAILED_ATTEMPTS: ${{ inputs.include_failed_attempts }}
        run: |
          set -euo pipefail
          # Validate the bound and the widening before anything else, including
          # the corpus guard: a dispatch that cannot legally apply should say so
          # in seconds, not after a full scan. `Validate dispatch inputs` up
          # front duplicates both word for word so a bad dispatch dies before
          # the corpus pull; this copy is the one of record, because the step
          # has to be safe on whatever reaches it.
          if [ "${MERITS_REMOVAL_MODE}" = "apply" ] \
            && ! [[ "${MERITS_MAX_REMOVALS}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::merits_phantom_removal=apply needs merits_max_removals set to a positive integer — the removal count read off a previous dry-run dispatch's ledger. Re-dispatch with that number."
            exit 1
          fi
          if [ "${INCLUDE_FAILED_ATTEMPTS}" = "true" ] \
            && [ "${MERITS_REMOVAL_MODE}" = "none" ]; then
            echo "::error::include_failed_attempts needs merits_phantom_removal set to dry-run or apply — on its own it widens nothing."
            exit 1
          fi
          # No committed pointer means no corpus — nothing to remove.
          if [ ! -f corpus/corpus.db.ref ]; then
            echo "no corpus pointer yet; skipping the merits-phantom removal"; exit 0
          fi
          gh auth setup-git # persist-credentials is false on checkout
          # The sweep reads committed ledger artifacts out of `data/` and
          # deletes beside them, and this checkout is only as fresh as the
          # previous step's rebase — read the remote tip first so the skip
          # guards see every collect PR merged in the gap. Fast-forward only,
          # for the attribution sibling's reason: a sibling step whose push
          # retries were exhausted holds an unpushed commit over live corpus
          # mutations, and a reset would publish that split.
          git fetch origin "$GITHUB_REF_NAME"
          git merge --ff-only FETCH_HEAD
          # `--include-failed-attempts` rides both invocations below or
          # neither, so the ledger the maintainer reads and the removal that
          # follows describe the same population. Declared outside the guard so
          # the expansion is total under `set -u`.
          attempt_args=()
          if [ "${INCLUDE_FAILED_ATTEMPTS}" = "true" ]; then
            attempt_args+=(--include-failed-attempts)
          fi
          # Dry-run first, into the summary: the removal-and-skip ledger — every
          # event removed and every skip with its reason — is the reading the
          # apply's bound comes from, and a deletion's record must outlive the
          # step log. (On an apply this run is a receipt, not a reading.)
          uv run fedcourts remove-ungranted-merits-events "${attempt_args[@]}" 2>&1 \
            | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "${MERITS_REMOVAL_MODE}" != "apply" ]; then
            echo "dry-run only; nothing written."
            exit 0
          fi
          uv run fedcourts remove-ungranted-merits-events "${attempt_args[@]}" \
            --apply --max-removals "${MERITS_MAX_REMOVALS}" 2>&1 \
            | tee -a "$GITHUB_STEP_SUMMARY"
          # Blob before pointer commit, as everywhere. An apply that pushed the
          # blob but failed before the commit publishes nothing: readers resolve
          # the committed pointer, and the next dispatch re-detects from the
          # still-committed ledger.
          uv run fedcourts corpus-push
          # `git add data/` stages the deleted event directories along with the
          # pointer — one commit, so the ledger and the corpus it must match
          # land together or not at all. The directory guard is the add sweeps'
          # shape (on a tip without `data/` an unguarded add fails under
          # `set -euo pipefail` AFTER the blob push), and it cannot fail open
          # here the way it could if this deleted the tree: what it removes is
          # individual event directories out of the whole case tree, so a
          # removal with anything to stage always leaves a `data/` behind it.
          git add corpus/corpus.db.ref
          if [ -d data ]; then
            git add data/
          fi
          if git diff --cached --quiet; then
            echo "No ungranted merits phantoms to remove; nothing to persist."
            exit 0
          fi
          git commit -m "seed: converge corpus (ungranted merits phantoms)"
          bash "${GITHUB_WORKSPACE}/.github/actions/commit-corpus-to-main/push_with_retry.sh" \
            "merits-phantom pointer"

      # The pair below runs in this order for a reason: a label rewrite that
      # lands after a grade was taken leaves the grade stale, so labels move
      # first and the recompute follows in the same dispatch. Neither half
      # fires on the schedule — each acts on a ledger a maintainer has read,
      # and that reading only exists because a `dry-run` dispatch produced it.
      #
      # Like the re-derivation and the three repairs above, and unlike the
      # converging sweeps and the
      # two dispatch-only backfills — the overhang clear and the
      # questions-presented backfill — alike, neither
      # carries continue-on-error, and the distinction is not "dispatch-only". It is
      # what a failure means here. Those steps fail by not converging, and the
      # next window retries for free. These fail by REFUSING: an apply without
      # its bound, a malformed cell id, a stamp the command declines. A
      # refusal is the answer the maintainer dispatched for, and absorbing it
      # would report work that never happened, so the step fails, the job
      # fails, and the guard job names the step in the pipeline-health issue.
      - name: Converge disposition labels (dispatch-only)
        # The event_name conjunct is load-bearing for the reason the
        # questions-presented sibling documents: on a schedule the inputs
        # context is empty and the `!= 'none'` comparison evaluates TRUE.
        # The dedupe conjunct is the sibling sweeps' reason too: this one
        # classifies dispositions off corpus rows, and an unmerged twin is a
        # second row for the same petition — the label must be read off the
        # merged one.
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.disposition_convergence != 'none' && steps.dedupe-live-rows.outcome == 'success' }}
        # The scan is local — committed outcome labels against corpus rows —
        # with the apply's writes under `data/`; sized like the ledger sweeps
        # above rather than the network-bound backfills.
        timeout-minutes: 15
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          CORPUS_REMOTE_URL: ${{ vars.CORPUS_REMOTE_URL }}
          DISPOSITION_MODE: ${{ inputs.disposition_convergence }}
          DISPOSITION_MAX_RELABELS: ${{ inputs.disposition_max_relabels }}
          INCLUDE_SCORED: ${{ inputs.include_scored }}
        run: |
          set -euo pipefail
          # Validate the bound before anything else, including the corpus
          # guard: a dispatch that cannot legally apply should say so in
          # seconds, not after a full scan. The command refuses an unbounded
          # apply on its own too; this refusal is the one with the maintainer's
          # procedure in it. `Validate dispatch inputs` up front duplicates it
          # word for word so a bad dispatch dies before the corpus pull; this
          # copy is the one of record, because the step has to be safe on
          # whatever reaches it.
          if [ "${DISPOSITION_MODE}" = "apply" ] \
            && ! [[ "${DISPOSITION_MAX_RELABELS}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::disposition_convergence=apply needs disposition_max_relabels set to a positive integer — the relabel count read off a previous dry-run dispatch's ledger. Re-dispatch with that number."
            exit 1
          fi
          # `include_scored` widens the sweep onto events already carrying
          # predict/evaluate output and owes a re-grade for each relabel, so it
          # is deliberate on both counts: it must name a mode to widen, and it
          # must carry the bound in EVERY mode — not the apply-only rule above.
          # A dry run that widens the ledger is where the decision to take on
          # that backlog is actually made, so the number is stated there too;
          # what the apply is checked against is the widened dry-run's own
          # relabel count, not the plain run's held-back lines, which bound the
          # population rather than count the rewrites.
          if [ "${INCLUDE_SCORED}" = "true" ]; then
            if [ "${DISPOSITION_MODE}" = "none" ]; then
              echo "::error::include_scored needs disposition_convergence set to dry-run or apply — on its own it widens nothing."
              exit 1
            fi
            if ! [[ "${DISPOSITION_MAX_RELABELS}" =~ ^[1-9][0-9]*$ ]]; then
              echo "::error::include_scored needs disposition_max_relabels set to a positive integer — relabelling a graded cell takes on a re-grade backlog, so its size is stated up front in dry-run as much as in apply. Read the held-back lines off a plain dry-run dispatch's ledger."
              exit 1
            fi
          fi
          # No committed pointer means no corpus — nothing to converge against.
          if [ ! -f corpus/corpus.db.ref ]; then
            echo "no corpus pointer yet; skipping disposition convergence"; exit 0
          fi
          gh auth setup-git # persist-credentials is false on checkout
          # The sweep reads committed ledger artifacts out of `data/` and
          # rewrites beside them, so it needs the remote tip, not this
          # checkout's — the scored-cell holdback is keyed on grades that
          # arrive by collect PR. Fast-forward only, for the attribution
          # sibling's reason: a sibling step whose push retries were exhausted
          # holds an unpushed commit over live corpus mutations, and a reset
          # would publish that split.
          git fetch origin "$GITHUB_REF_NAME"
          git merge --ff-only FETCH_HEAD
          # `--include-scored` rides both invocations below or neither, so the
          # ledger the maintainer reads and the rewrite that follows describe
          # the same population. Without it the sweep converges only events
          # carrying no committed predict/evaluate output: rewriting a graded
          # cell's label would move what a published standing was computed from
          # while the standing itself sat still, so those events are reported
          # instead. With it they are in, which is a bounded decision the
          # validation above makes the maintainer state — and one that owes the
          # re-grade step below the affected judge lines, since this half moves
          # the label and that half recomputes the grades taken under it.
          scored_args=()
          if [ "${INCLUDE_SCORED}" = "true" ]; then
            scored_args+=(--include-scored)
          fi
          # Dry-run first, into the summary: the relabel ledger is the reading
          # the apply's bound comes from, and it must outlive the step log.
          # (On an apply this run is a receipt, not a reading — nobody reads it
          # before the rewrite.)
          uv run fedcourts converge-disposition-labels "${scored_args[@]}" 2>&1 \
            | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "${DISPOSITION_MODE}" != "apply" ]; then
            echo "dry-run only; nothing written."
            exit 0
          fi
          uv run fedcourts converge-disposition-labels "${scored_args[@]}" \
            --apply --max-relabels "${DISPOSITION_MAX_RELABELS}" 2>&1 \
            | tee -a "$GITHUB_STEP_SUMMARY"
          # Blob before pointer commit, as everywhere.
          uv run fedcourts corpus-push
          # The rewrites land in `data/` (`outcome.json`); stage them with the
          # pointer so the ledger and the corpus it must match move together
          # or not at all.
          git add corpus/corpus.db.ref
          if [ -d data ]; then
            git add data/
          fi
          if git diff --cached --quiet; then
            echo "Disposition labels already converged; nothing to persist."
            exit 0
          fi
          git commit -m "seed: converge corpus (disposition labels)"
          bash "${GITHUB_WORKSPACE}/.github/actions/commit-corpus-to-main/push_with_retry.sh" \
            "disposition-label pointer"

      # The recompute for cells whose outcome moved UNDER a committed grade —
      # by the label convergence above or by any of the lane's other ledger
      # sweeps, which rewrite and reopen outcomes without consulting who has
      # already graded them. Ledger-only: it recomputes graded fields under
      # the cell's original stamp and writes `evaluation.json`, touching no
      # corpus row, so this step commits `data/` alone with no blob push and
      # no pointer move.
      #
      # What the scoring surfaces make of the result is the command's
      # contract, not this step's: per `metrics/README.md`, a standing moves
      # honestly only through a grading the supersede-collapse counts, and a
      # bare re-stamp of an existing `evaluation.json` moves it with a trace
      # only in `data/`'s git history. This step names cells and invokes the
      # command; it cannot supply that property if the command does not.
      - name: Re-grade named cells (dispatch-only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.regrade_stale != 'none' }}
        # One local recompute per named cell over a maintainer-sized list.
        timeout-minutes: 15
        # No corpus remote and no `corpus.db.ref` guard, unlike every sibling
        # above: the recompute's inputs are the committed ledger artifacts the
        # sweeps just rewrote, and it neither pulls nor pushes the blob. That
        # is also why it needs no dedupe gate — an unmerged twin row cannot
        # change what a committed outcome already says.
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REGRADE_MODE: ${{ inputs.regrade_stale }}
          REGRADE_CELLS: ${{ inputs.regrade_cells }}
        run: |
          set -euo pipefail
          # `regrade_cells` is maintainer-typed free text entering a shell, so
          # it is handled as data throughout: expanded from the environment
          # (never interpolated into this script), split on whitespace, and
          # every line matched against the id grammar before a command sees
          # it. The grammar excludes `.` deliberately — with no dots no field
          # can be a `..` path segment, whatever the command does with it.
          # `Validate dispatch inputs` up front duplicates this whole block
          # word for word so a bad list dies before the corpus pull; this copy
          # is the one of record, because the step has to be safe on whatever
          # reaches it.
          pattern='^[a-z0-9-]+/[0-9]+/evt-[a-z0-9-]+/[0-9]{8}T[0-9]{6}Z/[a-z0-9-]+$'
          malformed=0
          cells=()
          # `printf '%s\n'`, not '%s': `read` returns non-zero on a final line
          # with no terminator, so an unterminated last cell would be dropped
          # by the loop — silently, and past the all-or-nothing check below.
          # The blank line this adds is absorbed by the emptiness guard.
          while IFS= read -r line; do
            [ -n "$line" ] || continue
            # Bash's own regex match: no pipeline, so no interaction with
            # pipefail and no per-line subprocess.
            if [[ "$line" =~ $pattern ]]; then
              cells+=("$line")
            else
              echo "::error::malformed regrade cell (want court/docket/event/run_id/actor, e.g. scotus/1119228/evt-petition-certiorari/20260624T103000Z/claude-judge): ${line}"
              malformed=1
            fi
          done < <(printf '%s\n' "${REGRADE_CELLS}" | tr -s ' \t\r' '\n')
          # All-or-nothing: a half-applied list is worse to reason about than a
          # refused one, and the fix is the same edit either way.
          if [ "$malformed" -ne 0 ]; then
            echo "::error::refusing the whole list — correct the lines above and re-dispatch."
            exit 1
          fi
          if [ "${#cells[@]}" -eq 0 ]; then
            echo "::error::regrade_stale=${REGRADE_MODE} names no cells — set regrade_cells."
            exit 1
          fi
          if [ "${REGRADE_MODE}" = "apply" ]; then
            gh auth setup-git # persist-credentials is false on checkout
            # Recompute on top of the remote tip, not this checkout's: the
            # evaluations being rewritten arrive by collect PR, and a re-grade
            # computed against a stale copy would commit a rewrite of a
            # superseded file. Fast-forward only, for the attribution
            # sibling's reason — an exhausted push retry upstream must fail
            # this step closed rather than be reset away.
            git fetch origin "$GITHUB_REF_NAME"
            git merge --ff-only FETCH_HEAD
          fi
          touched=()
          for cell in "${cells[@]}"; do
            IFS=/ read -r court docket event run actor <<<"$cell"
            if [ "${REGRADE_MODE}" != "apply" ]; then
              echo "would run: uv run fedcourts stamp-cell --regrade --court ${court} --docket ${docket} --event ${event} --run-id ${run} --role evaluator --actor ${actor}" \
                | tee -a "$GITHUB_STEP_SUMMARY"
              continue
            fi
            uv run fedcourts stamp-cell --regrade \
              --court "$court" --docket "$docket" --event "$event" \
              --run-id "$run" --role evaluator --actor "$actor" 2>&1 \
              | tee -a "$GITHUB_STEP_SUMMARY"
            touched+=("data/cases/${court}/${docket}/events/${event}/evaluations/${actor}")
          done
          if [ "${REGRADE_MODE}" != "apply" ]; then
            echo "dry-run only; nothing written."
            exit 0
          fi
          # Stage the named cells' evaluator directories, never a blanket
          # `git add data/`. Every sweep in this lane is continue-on-error, so
          # one that wrote `data/` and then failed before its own commit
          # leaves ledger writes in the tree; a blanket add would sweep that
          # residue into this pointer-free commit and publish a ledger half
          # whose corpus half never moved. The cells are enumerated and
          # grammar-checked, so the jail is exact.
          git add -- "${touched[@]}"
          if git diff --cached --quiet; then
            echo "Re-grade reproduced the stored grades; nothing to persist."
            exit 0
          fi
          git commit -m "seed: re-grade named cells"
          bash "${GITHUB_WORKSPACE}/.github/actions/commit-corpus-to-main/push_with_retry.sh" \
            "re-grade ledger"

      # Trailing, NON-BLOCKING data-validation, as on run-pull's jobs: produce
      # the correctness verdict on the now-current corpus and publish it for
      # run-ops to present and escalate — loud-not-fatal by contract. Gated to
      # the same one-window/day cadence as the scope reconcile.
      #
      # The condition is what makes "non-blocking" hold in both directions, and
      # each conjunct answers a different way of getting it wrong.
      #
      # `continue-on-error` protects the step from its OWN failure; without a
      # status function the implicit `success()` still lets any unrelated
      # upstream failure skip it — so a refused dispatch input would withhold
      # the corpus data-health reading, which is exactly when it is most
      # wanted. `!cancelled()` restores it — NOT `always()`, because a
      # cancelled job (the hard timeout-minutes kill, an OOM — the case the
      # guard job covers) is stopped mid-step, and a verdict over that reports
      # a corpus state nobody committed. This gate is the one divergence from
      # run-pull's copy of the step, which carries no `if:` at all: run-pull's
      # tail holds no step that fails by refusing, so it has nothing to keep
      # the reading alive for.
      #
      # The two step gates are the same argument applied to the corpus on disk,
      # because publishing is not free: the verdict overwrites the latest file
      # on ops-metrics, which is also the next run's monotonic row-count
      # baseline. A run that failed before `corpus-pull` has no corpus, and
      # `validate-corpus` is graceful about that — it returns a *skipped*
      # verdict, which would replace the last real reading with a blank one and
      # leave the next run no baseline. A run whose walk failed between two
      # checkpoints has the opposite problem: rows in the local blob that no
      # pointer commit covers, published as a baseline the next run's pulled
      # corpus cannot meet, which reads as a corpus shrink. What the gates
      # still admit — a refused dispatch-only step, a failed summary, a sweep
      # that failed before it mutated anything — leaves the corpus exactly as
      # some commit describes it, which is the state worth reporting.
      #
      # One case they do NOT cover, and deliberately: a sweep that mutated the
      # blob and then failed its own push holds rows no pointer commit covers,
      # the same hazard as the half-finished walk. Every sweep is
      # continue-on-error, so the job stays successful and this step has always
      # run over that state — the gates neither create the gap nor widen it.
      # Closing it means giving each sweep the same outcome gate, which is a
      # wider change than this one.
      - name: Produce + publish the corpus validation verdict
        if: >-
          ${{ !cancelled()
          && steps.corpus-pull.outcome == 'success'
          && steps.term-walk.outcome != 'failure'
          && (github.event_name != 'schedule' || github.event.schedule == '31 2 * * *') }}
        continue-on-error: true
        uses: ./.github/actions/publish-corpus-verdict
        with:
          token: ${{ steps.app-token.outputs.token }}

  # Safety net for the walker. Its own summary step cannot run when the job is
  # cancelled — the hard timeout-minutes kill, an OOM, or a setup step that hangs
  # until the budget is gone — so a cancelled or failed run would otherwise pass
  # silently (it commits directly to main; there is no PR gate to redden). This
  # job DEPENDS on seed but is not cancelled with it, so it can read the result,
  # name the step that stopped the run, and raise ONE long-lived escalation issue
  # — clearing it when a later walk finishes clean. Mirrors run-ops' idiom.
  guard:
    needs: [seed]
    if: always()
    runs-on: ubuntu-latest
    # Sized to the retry worst case: 4 retried call groups x 3 bounded 30s
    # attempts plus 60s of backoff sleeps. Nothing downstream waits on this job.
    timeout-minutes: 10
    # This job reads the needs result plus the run's own step outcomes, and writes
    # a NON-triggering issue — no checkout, no corpus, no contents. Per
    # docs/security.md that is exactly the ambient-GITHUB_TOKEN case; the data App
    # token is reserved for the contents:write the walker's own steps need, and
    # deliberately does NOT carry issue-write.
    permissions:
      issues: write
      actions: read # this run's job list (repo-wide read; the guard runs no agent code)
    steps:
      - name: Escalate a cancelled or failed seed walk
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RESULT: ${{ needs.seed.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # Inline copy of scripts/gh_retry.sh's gh_retry — this job deliberately
          # has no checkout (it must fire even when the walk died before one), so
          # it cannot source the file; the workflow-invariants test pins the
          # copies identical. Contract and rationale live in that script's header.
          gh_retry() {
            local attempt out what
            what="${1:-} ${2:-} ${3:-}"
            for attempt in 1 2 3; do
              if out=$(timeout 30 "$@"); then
                printf '%s\n' "$out"
                return 0
              fi
              if [ "$attempt" -lt 3 ]; then
                echo "::warning::${what} failed (attempt ${attempt}/3) — retrying" >&2
                sleep $((attempt * 5))
              fi
            done
            echo "::error::${what} failed after 3 attempts" >&2
            return 1
          }
          # `pipeline-health` is a NON-triggering label by design (no run:* workflow
          # keys on it). Create it idempotently, as run-ops does for its label.
          # Non-fatal after retries: in steady state the label exists, and if it
          # truly does not, the issue write below fails loudly on its own. The
          # retry's own exhaustion annotation still shows on the run — an API
          # unwell enough to lose three attempts is worth surfacing even where
          # this particular call is optional.
          gh_retry gh label create pipeline-health --repo "$REPO" --force \
            --color b60205 --description "Long-lived corpus-writer failure" \
            || echo "::warning::pipeline-health label create failed after retries; continuing"
          num=$(gh_retry gh issue list --repo "$REPO" --label pipeline-health --state open \
            --json number --jq '.[0].number')
          # Only 'success' clears; 'failure'/'cancelled' (or any non-skipped
          # not-clean result — this job's always() runs it regardless) escalate.
          if [ "$RESULT" = "success" ]; then
            if [ -n "$num" ]; then
              gh_retry gh issue comment "$num" --repo "$REPO" \
                --body "✅ The seed walk finished cleanly again ($RUN_URL) — closing."
              gh_retry gh issue close "$num" --repo "$REPO" --reason completed
            fi
            exit 0
          fi
          # Name the step that actually stopped the run. `cancelled` is ambiguous
          # on its own — it covers a walk that overran the job budget AND a job
          # killed while still in setup, which are different problems with
          # different fixes. The run's own job list distinguishes them, and
          # getting it wrong sends triage at the walker when the walk never ran.
          # Keyed on the job id `seed` (the job declares no `name:`); giving it
          # one would degrade this to the unnamed branch below, never break it.
          # A failed lookup only costs the step name, so it stays non-fatal — but
          # it is NOT silenced, so a 403/404 is in the log for whoever triages.
          step=$(gh_retry gh api "repos/${REPO}/actions/runs/${GITHUB_RUN_ID}/jobs" \
            --jq '[.jobs[] | select(.name == "seed") | .steps[]
                   | select(.conclusion != "success" and .conclusion != "skipped")][0].name' \
            || true)
          if [ -n "$step" ] && [ "$step" != "null" ]; then
            where="stopped at step \`${step}\`"
          else
            where="stopped before any step reported"
          fi
          body="⚠️ The seed (historical) run ended \`${RESULT}\` — ${where}. It commits directly to main with no PR gate, so this needs a look: ${RUN_URL}"
          if [ -n "$num" ]; then
            gh_retry gh issue comment "$num" --repo "$REPO" --body "$body"
          else
            gh_retry gh issue create --repo "$REPO" --label pipeline-health \
              --title "Seed walk failing" --body "$body"
          fi
