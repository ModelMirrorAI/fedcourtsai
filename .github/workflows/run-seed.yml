name: run-seed

# The historical Term walker (docs/live-sources.md). It carries the backfill on
# its own schedule, separate from run-pull's forward windows.
# It walks October Terms' docket serials newest-first over the supremecourt.gov
# docket JSON and ingests the sampled decided set — every decided petition except
# denials, which are systematically sampled per config/tracking.yaml's committed
# `historical:` frame. No CourtListener token, no API budget; it files NO
# predict/evaluate handoffs (every ingested petition is decided history, landed
# already resolved).
#
# It is a corpus writer like run-pull's jobs, so it shares the repo-level
# `corpus-write` concurrency group: the corpus is a single blob (pull → mutate →
# push → commit corpus/corpus.db.ref to main), so only one writer runs at a time
# regardless of workflow. The windows sit in the dead zones between run-pull's
# forward windows (`:17` pull, `:47` live) and yield the lock before the next
# one fires.
#
# Each window is a bounded chunk — ≤40 min of walk, except the daily sweep
# window, which walks 25 to fund its trailing sweeps — inside one App
# installation token's 1h life, so there is no self-refreshing-token loop — one token up
# front covers the walk and the trailing steps.
on:
  schedule:
    # Four dead-zone windows/day, each after a pull and before the next live,
    # so a chunk clears the lock before forward work needs it.
    - cron: "31 2 * * *"
    - cron: "31 8 * * *"
    - cron: "31 14 * * *"
    - cron: "31 20 * * *"
  workflow_dispatch:
    inputs:
      refresh_terms:
        description: >-
          Re-open past Terms before walking: space-separated two-digit October
          Terms (e.g. "17 18 19"), or "all" for every configured Term. Leave
          blank — the default, and what every scheduled run uses — to resume
          normally. Clears the walk cursors so the Terms are re-covered from the
          numbering base; re-walking adds through the corpus latches and deletes
          nothing.
        required: false
        default: ""
      refresh_streams:
        description: >-
          Which numbering stream the refresh re-opens. IFP is ~70% of the probe
          cost and feeds no scored segment, so prefer paid when the goal is the
          predicted population. Ignored when refresh_terms is blank.
        required: false
        default: historical-paid
        type: choice
        options:
          - historical-paid
          - historical-ifp
          - both
      unlatch_overselected:
        description: >-
          One-time: clear the pre-resize `salience_selected` overhang. The
          sticky latch is additive, so petitions latched under old capacity
          caps keep earning cells the shipped envelope never budgeted; this
          recomputes each pending cohort under the current config and clears
          the latch on pending petitions a from-scratch selection would not
          pick (dry-run it locally first — `fedcourts unlatch-overselected`).
          Only fires on an explicit dispatch with this set; never on the
          schedule. A committed prediction on a cleared case stays committed
          and graded.
        required: false
        default: false
        type: boolean
      qp_backfill:
        description: >-
          Re-derive stored questions-presented rows with the current extractor
          (`fedcourts backfill-questions-presented`). `dry-run` prints the
          reason-class triage ledger to the run summary and writes nothing;
          `apply` rewrites the safe classes, verifies its own convergence, and
          pushes. The intended procedure is two dispatches — `dry-run`, read
          the summary ledger, then `apply`: an apply run's in-run dry-run is a
          receipt, not a reading, since nobody reads it before the rewrite.
          The refusal
          guard holds either way — a stored full-length question the extractor
          can no longer derive is reported, never emptied. Only fires on an
          explicit dispatch naming it; never on the schedule.
        required: false
        default: none
        type: choice
        options:
          - none
          - dry-run
          - apply
      disposition_convergence:
        description: >-
          Converge stored disposition labels against the current classifier
          (`fedcourts converge-disposition-labels`). `dry-run` prints the
          relabel ledger to the run summary and writes nothing; `apply`
          rewrites within an explicit blast-radius bound. Two dispatches is the
          procedure — `dry-run`, read the count off the ledger, then `apply`
          with that count in `disposition_max_relabels`. Cells carrying a
          committed grade are held back: relabelling under a scored evaluation
          would silently restate what was graded, so those travel the
          `regrade_stale` route below instead. Only fires on an explicit
          dispatch naming it; never on the schedule.
        required: false
        default: none
        type: choice
        options:
          - none
          - dry-run
          - apply
      disposition_max_relabels:
        description: >-
          The relabel bound for `disposition_convergence=apply`: a positive
          integer, and the number the maintainer read off the dry-run ledger.
          Required on apply, and anything but a positive integer — blank, zero,
          negative, decimal, leading-zero — is refused before the scan runs: an
          unbounded apply would convert a widened predicate into a mass
          rewrite. Ignored in every other mode.
        required: false
        default: ""
        type: string
      regrade_stale:
        description: >-
          Recompute the graded fields of named evaluator cells under their
          original stamp (`fedcourts stamp-cell --regrade`), for cells whose
          committed outcome moved after the grade was taken — this lane's
          sweeps rewrite and reopen outcomes without consulting who has
          already graded them. `dry-run` echoes the commands without invoking
          them; `apply` runs them, and a refusal stops the lane rather than
          scrolling past. Only fires on an explicit dispatch naming it; never
          on the schedule.
        required: false
        default: none
        type: choice
        options:
          - none
          - dry-run
          - apply
      regrade_cells:
        description: >-
          The cells `regrade_stale` acts on, one `court/docket/event/run_id/actor`
          per line (spaces work too). One re-grade per line, so a cell graded by
          three judges is three lines — the list is explicit on purpose: a
          re-grade rewrites a committed evaluation, and which judge's is not a
          thing to infer. Every line is matched against the id grammar before
          anything runs and the whole list is refused if any line fails; so is
          an empty list, in `dry-run` as much as `apply` — a dispatch naming no
          cell asked for nothing.
        required: false
        default: ""
        type: string

permissions: {}

# Share run-pull's corpus-writer lock: one writer at a time across both
# workflows. cancel-in-progress:false so a queued window waits rather than
# dropping a chunk; GitHub keeps only the latest pending run per group, so a
# superseded window just resumes from the pushed cursors next time.
concurrency:
  group: corpus-write
  cancel-in-progress: false

jobs:
  seed:
    runs-on: ubuntu-latest
    # The checkpointed loop caps each chunk to its remaining LOOP_BUDGET_SECONDS
    # (--max-run-seconds), stopping itself at the soft budget; this hard cap is
    # the backstop headroom above it — setup + the final checkpoint + the
    # trailing maintenance steps, NOT room for another chunk. A hit here cancels
    # the run, and the guard job turns that into a loud escalation naming the
    # step that stopped it — usually the walk overrunning, but a job can also be
    # killed here while still in setup, which is a different problem. Kept well
    # under the App token's 1h life so one token covers the whole run.
    timeout-minutes: 55
    environment: prod
    # Corpus-split flags (see run-pull): dual-write off unless CASESTORE_URL is
    # set; FEDCOURTS_CORPUS_SPLIT is the go-live switch (unset → '0' → off).
    env:
      FEDCOURTS_CASESTORE_URL: ${{ vars.CASESTORE_URL }}
      FEDCOURTS_CORPUS_SPLIT: ${{ vars.FEDCOURTS_CORPUS_SPLIT || '0' }}
    # The ambient GITHUB_TOKEN is never used here (checkout, the corpus push, and
    # every gh call run on the App token) — so it carries no write at all.
    permissions:
      contents: read
      id-token: write # assume the AWS role for the corpus S3 remote (read-write)
    steps:
      # One token up front: a ≤40-min walk plus the trailing steps stay inside
      # its 1h life, so no mid-loop re-mint is needed. Scoped to contents:write
      # only (the corpus pushes) — progress goes to the Actions step summary,
      # not an issue, so no issues:write is needed;
      # the guard job files its escalation on the ambient token instead.
      - name: Mint app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.DATA_APP_CLIENT_ID }}
          private-key: ${{ secrets.DATA_APP_PRIVATE_KEY }}
          permission-contents: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Sync the working tree to the current tip of the default branch
        # actions/checkout pins this run's frozen github.sha — the branch tip when
        # the run was CREATED, not when it starts. A run that queues behind another
        # corpus writer on the shared corpus-write lock therefore checks out a
        # stale base, so the corpus blob it pulls and mutates is built on an
        # obsolete pointer and the final commit cannot rebase onto the advanced
        # tip (an unmergeable corpus/corpus.db.ref conflict). Reset to the live tip
        # first, under the lock, so we always mutate the latest committed corpus.
        # The repo is public, so this read-only fetch needs no credentials.
        run: |
          set -euo pipefail
          git fetch origin "${GITHUB_REF_NAME}"
          git reset --hard FETCH_HEAD

      - uses: ./.github/actions/setup-python-env

      - name: Configure git identity
        uses: ./.github/actions/configure-git-identity
        with:
          token: ${{ steps.app-token.outputs.token }}
          app-slug: ${{ steps.app-token.outputs.app-slug }}

      # Same read-write (append-only) role as run-pull's writers: the walker adds
      # snapshots, rows, and documents to the corpus blob but can never wipe
      # remote objects. The 1h session comfortably outlasts the ≤40-min loop.
      - name: Configure AWS credentials (corpus S3 remote, read-write)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}
          role-duration-seconds: 3600 # 1h
          # Bound the assume-role wall clock: unbounded, its 12 retries over a
          # multi-minute connect timeout outlast every job budget here (see the
          # workflow-traps list in docs/pipeline.md). Note the cost this buys —
          # the action does not clear its timer on the error path, so ANY failing
          # assume-role now burns the full 120s and ends on "Action timed out"
          # rather than its own message; the real cause is earlier in the log.
          action-timeout-s: 120

      - name: Pull the current corpus from the remote
        env:
          CORPUS_REMOTE_URL: ${{ vars.CORPUS_REMOTE_URL }}
        run: |
          # The per-(Term, stream) walk cursors and identity reconciliation read
          # prior corpus state, so it must be restored; a first run has no
          # committed pointer yet — warn and start fresh. Checksum-verified.
          uv run fedcourts corpus-pull --missing-pointer warn

      - name: Re-open the requested Terms for a full re-walk
        # Dispatch-only and blank by default, so a scheduled window can never
        # reset a cursor. Runs after the pull and before the loop, under the
        # shared corpus-write lock, so the reset and the re-walk it implies are
        # one serialized operation rather than a local edit racing a cron window.
        # The mutation reaches the remote only through the loop's checkpoint
        # push, so a failure before the first checkpoint leaves the cursors
        # untouched upstream — it fails closed.
        if: inputs.refresh_terms != ''
        env:
          REFRESH_TERMS: ${{ inputs.refresh_terms }}
          REFRESH_STREAMS: ${{ inputs.refresh_streams }}
        run: |
          set -euo pipefail
          args=()
          if [ "$REFRESH_TERMS" != "all" ]; then
            for t in $REFRESH_TERMS; do
              case "$t" in
                [0-9][0-9]) args+=(--term "$t") ;;
                *) echo "::error::refresh_terms must be two-digit Terms or 'all'; got '$t'"; exit 1 ;;
              esac
            done
          fi
          if [ "$REFRESH_STREAMS" != "both" ]; then
            args+=(--stream "$REFRESH_STREAMS")
          fi
          uv run fedcourts refresh-historical "${args[@]}" --apply

      - name: Walk the Terms in checkpointed chunks until done or out of time
        env:
          # The loop's checkpoints push the corpus blob, so the remote URL must be
          # job-step env here (CORPUS_REMOTE_URL variable).
          CORPUS_REMOTE_URL: ${{ vars.CORPUS_REMOTE_URL }}
          # Authenticate the pushes via the up-front App token (persist-credentials
          # is false on checkout). One token covers the whole ≤40-min run.
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          # Wall-clock budget for the whole loop, kept under timeout-minutes with
          # room for setup + the trailing steps, and inside the token's 1h life.
          # The 02:31 window carries the daily maintenance sweeps after the
          # loop, so it trades walk time for sweep headroom: the sweeps'
          # bounded worst case only ever binds on a non-converged window, but
          # a cap hit is a cancellation — the one outcome continue-on-error
          # cannot absorb — so the budget yields rather than gambling the
          # trailing verdict.
          # 25m where trailing sweeps need the tail — the daily sweep window,
          # and any dispatch that arms one of the dispatch-only writer steps,
          # each of which adds its own step bound to the tail — 40m otherwise.
          LOOP_BUDGET_SECONDS: ${{ (github.event.schedule == '31 2 * * *' || (github.event_name == 'workflow_dispatch' && (inputs.qp_backfill != 'none' || inputs.disposition_convergence != 'none' || inputs.regrade_stale != 'none'))) && '1500' || '2400' }}
        run: |
          set -euo pipefail
          gh auth setup-git

          deadline=$(( $(date -u +%s) + LOOP_BUDGET_SECONDS ))
          # A chunk runs until its probe cap OR historical.max_run_minutes, so a
          # chunk that STARTS just under the deadline can run a full slice past it,
          # and timeout-minutes leaves only slim margin over LOOP_BUDGET_SECONDS.
          # So: never start a chunk under MIN_CHUNK_SECONDS of budget, and cap each
          # chunk to the budget still remaining (--max-run-seconds) so the walker
          # stops ITSELF on the wall clock (stopped=time-cap) rather than
          # overrunning. Cursors are pushed each checkpoint, so a short final chunk
          # just resumes next run — no work is lost.
          MIN_CHUNK_SECONDS=120

          checkpoint() {
            # Push the blob BEFORE committing the pointer so the committed pointer
            # always resolves against the remote (corpus-push streams straight from
            # the workspace file). Facts go straight to the default branch under
            # the shared corpus-write lock: the pointer, plus any outcome.json the
            # walker's resolution recorded onto a previously-open event under data/.
            uv run fedcourts corpus-push
            git add corpus/corpus.db.ref
            if [ -d data ]; then
              git add data/
            fi
            if git diff --cached --quiet; then
              echo "No corpus or outcome change this chunk; nothing to commit."
              return 0
            fi
            local ingested probed
            ingested=$(jq -r '.ingested_granted + .ingested_denied + .ingested_other' historical-report.json)
            probed=$(jq -r '.probed' historical-report.json)
            git commit -m "seed: +${ingested} petition(s) (${probed} probed)"
            # Push under the shared corpus-write lock via the same rebase-and-backoff
            # retry (loud on a genuine pointer divergence) the writer jobs all use.
            bash "${GITHUB_WORKSPACE}/.github/actions/commit-corpus-to-main/push_with_retry.sh" \
              "seed checkpoint pointer (${probed} probed)"
          }

          while :; do
            # Don't start a chunk we can't run out fully — that is the overshoot
            # the hard timeout would kill. The walk resumes next run from the
            # pushed cursors.
            remaining=$(( deadline - $(date -u +%s) ))
            if [ "$remaining" -le "$MIN_CHUNK_SECONDS" ]; then
              echo "Under ${MIN_CHUNK_SECONDS}s of budget left; the walk resumes next run from the cursors."
              break
            fi
            # One checkpoint chunk (historical.max_probes_per_run docket probes, or
            # fewer if the remaining budget binds first). The per-(Term, stream)
            # cursors advance inside the corpus and are pushed each pass, so the
            # loop resumes cleanly after any stop; the totals file accumulates the
            # whole run's counts for the summary.
            uv run fedcourts historical-terms \
              --report historical-report.json --totals historical-totals.json \
              --max-run-seconds "$remaining"
            checkpoint

            if [ "$(jq -r '.complete' historical-report.json)" = "true" ]; then
              echo "Term walk complete: every configured stream is at its frontier."
              break
            fi
            if [ "$(jq -r '.stopped' historical-report.json)" = "stream-errors" ]; then
              echo "::warning::upstream errors stopped the remaining streams; resumes next run."
              break
            fi
            # A time-cap stop means the chunk consumed the remaining budget; the
            # top-of-loop guard ends the loop on the next pass.
          done

      - name: Summarize the run
        run: |
          set -euo pipefail
          # The body is rendered by the tested library renderer over the run's
          # cumulative totals; this step only writes it to the step summary.
          uv run python - <<'PY'
          from pathlib import Path

          from fedcourtsai.pipeline.historical import HistoricalReport, render_markdown

          report = HistoricalReport.model_validate_json(Path("historical-totals.json").read_text())
          Path("historical-summary.md").write_text(render_markdown(report) + "\n")
          PY
          cat historical-summary.md >> "$GITHUB_STEP_SUMMARY"

      # Merge and drop the live-minted duplicate SCOTUS rows on the now-current
      # corpus, before the scope reconcile so the latch pass always weighs the
      # deduped rows. A standing sweep of the one-petition-one-row invariant
      # across the id ranges: any docket-number spelling that defeats the
      # channels' identity join leaves this pair shape, and the sweep merges it
      # away on the next window. Idempotent — a clean corpus finds nothing and
      # persists nothing — so riding every gated window is safe. Same
      # one-window/day gate and NON-BLOCKING contract as the reconcile below.
      - name: Dedupe live-minted duplicate rows
        id: dedupe-live-rows
        if: github.event_name != 'schedule' || github.event.schedule == '31 2 * * *'
        continue-on-error: true
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          CORPUS_REMOTE_URL: ${{ vars.CORPUS_REMOTE_URL }}
        run: |
          set -euo pipefail
          # No committed pointer means no corpus — nothing to dedupe.
          if [ ! -f corpus/corpus.db.ref ]; then
            echo "no corpus pointer yet; skipping dedupe"; exit 0
          fi
          gh auth setup-git # persist-credentials is false on checkout
          # The merge reads committed `data/` as a refusal guard (a twin whose
          # events carry committed cell output must not merge), so it needs the
          # remote tip, not this checkout's — a collect PR merging output under
          # the twin since the walk's last rebase must be visible. Fast-forward
          # only, for the sibling sweeps' reason: a sibling holding an unpushed
          # commit fails this closed rather than publishing a split.
          git fetch origin "$GITHUB_REF_NAME"
          git merge --ff-only FETCH_HEAD
          # Dry-run first, into the summary: the merge moves ledger event
          # directories with the re-keyed rows, and the would-move ledger must
          # outlive the step log the way the attribution repairs' does.
          uv run fedcourts dedupe-live-rows 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          uv run fedcourts dedupe-live-rows --apply
          # Blob before pointer commit, as everywhere.
          uv run fedcourts corpus-push
          # The merge writes both halves: the re-keyed rows into the corpus and
          # the moved minted-event directories into `data/`. Stage them into the
          # one pointer commit so both land together on the push path. The
          # guarantee is per-push, not per-step: this step is continue-on-error,
          # so a corpus-push failure here leaves the applied moves as
          # uncommitted residue that only a later blanket `git add data/` sweep
          # (the merits-events step) would carry — the reason the apply runs in
          # the same window as that sweep and never alone.
          git add corpus/corpus.db.ref
          if [ -d data ]; then
            git add data/
          fi
          if git diff --cached --quiet; then
            echo "No duplicate pairs to persist."
            exit 0
          fi
          git commit -m "seed: dedupe live-minted duplicate rows (corpus + ledger)"
          bash "${GITHUB_WORKSPACE}/.github/actions/commit-corpus-to-main/push_with_retry.sh" \
            "dedupe pointer"

      # Reconcile predict scope on the now-current corpus: latch the out-of-scope
      # cases so `open_events` drops them at the source, and clear the latch on any
      # back in scope. Gated to one window/day (02:31) so the sweep keeps its
      # daily cadence even though the walk now runs four times a day.
      # NON-BLOCKING: a hiccup must not fail the walker run.
      - name: Reconcile predict scope (latch out-of-scope cases)
        if: github.event_name != 'schedule' || github.event.schedule == '31 2 * * *'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          CORPUS_REMOTE_URL: ${{ vars.CORPUS_REMOTE_URL }}
        run: |
          set -euo pipefail
          # No committed pointer means no corpus — nothing to reconcile.
          if [ ! -f corpus/corpus.db.ref ]; then
            echo "no corpus pointer yet; skipping scope reconcile"; exit 0
          fi
          gh auth setup-git # persist-credentials is false on checkout
          uv run fedcourts reconcile-scope --apply
          # Blob before pointer commit, as everywhere.
          uv run fedcourts corpus-push
          git add corpus/corpus.db.ref
          if git diff --cached --quiet; then
            echo "Scope latch already converged; nothing to persist."
            exit 0
          fi
          git commit -m "seed: latch out-of-scope cases"
          bash "${GITHUB_WORKSPACE}/.github/actions/commit-corpus-to-main/push_with_retry.sh" \
            "scope-latch pointer"

      # The one-time pre-resize overhang clear (`unlatch-overselected`). Unlike
      # the scope reconcile above it is NOT a standing daily pass: it fires only
      # on an explicit dispatch that sets `unlatch_overselected`, never on the
      # schedule, because clearing the sticky latch is a deliberate maintainer
      # act after a capacity resize, not a recurring convergence. It runs here,
      # after the scope reconcile, so it recomputes selection over the
      # now-current, in-scope corpus. NON-BLOCKING like its sibling. The printed
      # `SalienceUnlatchResult` (the cleared-id ledger + the pre-apply pointer)
      # lands in the step log as the record of the pre-resize sticky set.
      - name: Clear the pre-resize salience overhang (unlatch-overselected)
        # Dispatch-only and gated on the dedupe sweep succeeding: a merge takes
        # the latch stickily from either twin, so an unmerged bulk twin left by
        # a failed dedupe could re-latch a case this clear just erased —
        # `docs/salience.md`'s "run dedupe first" prerequisite, enforced rather
        # than merely ordered.
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.unlatch_overselected && steps.dedupe-live-rows.outcome == 'success' }}
        continue-on-error: true
        # Comfortably above the ~8 min the sibling scope reconcile takes on the
        # same recompute-plus-~1GB-push, so the write completes and commits its
        # pointer rather than being cancelled mid-flight (below that cost a cap
        # leaves nothing applied). Still bounded, so the step's worst case stays
        # under the job's own 55-min cap: a job-cap cancellation is one
        # `continue-on-error` cannot absorb, and would escalate an otherwise
        # healthy walk.
        timeout-minutes: 15
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          CORPUS_REMOTE_URL: ${{ vars.CORPUS_REMOTE_URL }}
        run: |
          set -euo pipefail
          # No committed pointer means no corpus — nothing to reconcile.
          if [ ! -f corpus/corpus.db.ref ]; then
            echo "no corpus pointer yet; skipping unlatch-overselected"; exit 0
          fi
          gh auth setup-git # persist-credentials is false on checkout
          # The write erases the corpus's own record of the pre-resize sticky
          # set, so the result IS the record: mirror it (stdout + the pre-apply
          # pointer echoed on stderr) into the run summary, which outlives the
          # step log's retention.
          uv run fedcourts unlatch-overselected --apply 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          # Blob before pointer commit, as everywhere.
          uv run fedcourts corpus-push
          git add corpus/corpus.db.ref
          if git diff --cached --quiet; then
            echo "No overhang to clear; nothing to persist."
            exit 0
          fi
          git commit -m "seed: clear pre-resize salience overhang"
          bash "${GITHUB_WORKSPACE}/.github/actions/commit-corpus-to-main/push_with_retry.sh" \
            "unlatch-overselected pointer"

      # The questions-presented re-derivation (`backfill-questions-presented`).
      # Like the overhang clear above, it fires only on an explicit dispatch
      # that names it, never on the schedule: the command's dry-run ledger is
      # the triage list a maintainer reads, so the intended procedure is two
      # dispatches — `dry-run`, read the summary, then `apply` (the apply
      # run's own dry-run is a receipt, not a reading). It runs in this lane
      # because corpus writes exist nowhere else — the write role and the
      # content store are the job's — and inherits the dedupe gate for the
      # sibling's reason: the sweep must weigh deduped rows, not a twin's.
      # No fetch/ff-only here, unlike the merits-events sibling: the command
      # reads corpus rows and documents only — no `data/` ledger guard — and
      # commits only the pointer, the judgments sibling's shape.
      # The refusal guard makes the apply non-destructive (a stored
      # full-length question the current extractor cannot re-derive is
      # reported, never emptied), and the apply verifies itself: under the
      # corpus split the durable write is the content store's per-case PUT —
      # best-effort, per-case failures logged not raised — and the blob and
      # pointer may not move at all, so convergence is witnessed by re-running
      # the dry-run and requiring zero remaining rewrites, not by the pointer.
      - name: Backfill questions presented (dispatch-only)
        # The event_name conjunct is load-bearing: on a schedule the inputs
        # context is empty and `inputs.qp_backfill != 'none'` evaluates TRUE
        # (null vs 'none' is a NaN comparison) — never lift the input clause
        # out of this conjunction.
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.qp_backfill != 'none' && steps.dedupe-live-rows.outcome == 'success' }}
        continue-on-error: true
        # A guess sized above the siblings', not a measurement: the pass reads
        # stored petition text per live-slice SCOTUS row — under the split
        # mode one content-store GET each, twice on an apply, plus the mirror
        # PUTs. The first `dry-run` dispatch is what measures the real cost;
        # resize from its wall clock. A cap hit is absorbed by
        # continue-on-error and nothing publishes without the verification
        # below, so the bound errs generous rather than tight.
        timeout-minutes: 30
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          CORPUS_REMOTE_URL: ${{ vars.CORPUS_REMOTE_URL }}
          QP_BACKFILL_MODE: ${{ inputs.qp_backfill }}
        run: |
          set -euo pipefail
          # No committed pointer means no corpus — nothing to re-derive.
          if [ ! -f corpus/corpus.db.ref ]; then
            echo "no corpus pointer yet; skipping questions-presented backfill"; exit 0
          fi
          gh auth setup-git # persist-credentials is false on checkout
          # Dry-run first, into the summary: the reason-class ledger is the
          # triage record, and it must outlive the step log either way.
          uv run fedcourts backfill-questions-presented 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "${QP_BACKFILL_MODE}" != "apply" ]; then
            echo "dry-run only; nothing written."
            exit 0
          fi
          uv run fedcourts backfill-questions-presented --apply 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          # Convergence check: the command is idempotent, so a clean apply
          # leaves the re-run with nothing to rewrite. This is the witness the
          # pointer cannot be under the split mode (see the step comment) —
          # and it is what catches a swallowed content-store write.
          uv run fedcourts backfill-questions-presented 2>&1 \
            | tee -a "$GITHUB_STEP_SUMMARY" | tee /tmp/qp-verify.txt
          if ! grep -q "would rewrite 0," /tmp/qp-verify.txt; then
            echo "::error::apply did not converge — the re-run still reports rewrites (a content-store write may have failed; see the warnings above)"
            exit 1
          fi
          # Blob before pointer commit, as everywhere. Under the split mode
          # the blob carries no document text, so an unmoved pointer here is
          # the normal converged outcome, not a missing write.
          uv run fedcourts corpus-push
          git add corpus/corpus.db.ref
          if git diff --cached --quiet; then
            echo "pointer unmoved — the durable write is the content store's, verified converged above."
            exit 0
          fi
          git commit -m "seed: converge corpus (questions presented)"
          bash "${GITHUB_WORKSPACE}/.github/actions/commit-corpus-to-main/push_with_retry.sh" \
            "questions-presented pointer"

      # An application docket's baseline event is a stay or injunction, not a
      # cert petition; discovery mints it as motion/interim, and this converges
      # the rows minted before that rule. Idempotent, so after it converges the
      # step costs seconds. Runs in the lane rather than a dev checkout because
      # the pointer is a git file the writers commit to main and `corpus-push`
      # is last-writer-wins — a stale local copy would republish over concurrent
      # walks. The corpus-write concurrency group serializes it.
      - name: Relabel application-docket baseline events (interim stage)
        if: github.event_name != 'schedule' || github.event.schedule == '31 2 * * *'
        continue-on-error: true
        # Bounded so the tail cannot push the job past its cap: overrunning
        # cancels the run, and cancellation is the one outcome
        # `continue-on-error` does not absorb — it would lose the trailing
        # verdict and escalate a healthy run. A timed-out sweep is non-fatal
        # and converges next window.
        timeout-minutes: 8
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          CORPUS_REMOTE_URL: ${{ vars.CORPUS_REMOTE_URL }}
        run: |
          set -euo pipefail
          # No committed pointer means no corpus — nothing to relabel.
          if [ ! -f corpus/corpus.db.ref ]; then
            echo "no corpus pointer yet; skipping application relabel"; exit 0
          fi
          gh auth setup-git # persist-credentials is false on checkout
          # The rename's orphan guard reads committed ledger artifacts out of
          # `data/`, and this checkout is only as fresh as the walk's last
          # checkpoint rebase — up to a window stale. A collect PR merging
          # artifacts for an application docket in that gap would be invisible
          # here, and the rename would orphan exactly what the guard exists to
          # prevent. Read the remote tip instead — fast-forward only, so a
          # sibling step's unpushed local commit (its push retries exhausted)
          # fails this step closed rather than being discarded while its
          # corpus mutations survive in the workspace DB.
          git fetch origin "$GITHUB_REF_NAME"
          git merge --ff-only FETCH_HEAD
          uv run fedcourts relabel-application-events --apply
          # Blob before pointer commit, as everywhere.
          uv run fedcourts corpus-push
          git add corpus/corpus.db.ref
          if git diff --cached --quiet; then
            echo "Application baselines already relabeled; nothing to persist."
            exit 0
          fi
          git commit -m "seed: converge corpus (application baselines)"
          bash "${GITHUB_WORKSPACE}/.github/actions/commit-corpus-to-main/push_with_retry.sh" \
            "application-relabel pointer"

      # Parse each merits-bound grant's stored snapshot for the judgment the
      # Court entered, feeding the statpack's merits section. Reads the content
      # store, so it depends on the job-level split-mode env; a case whose
      # snapshot is unreachable is counted, never fatal. Converges like the
      # sweeps above — a re-run over an unchanged corpus stamps nothing.
      - name: Backfill merits judgments
        if: github.event_name != 'schedule' || github.event.schedule == '31 2 * * *'
        continue-on-error: true
        # Bounded for the same reason, and more tightly needed: the first
        # non-converged pass reads the content store once per merits-bound
        # grant, an external-service loop with no internal cap.
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          CORPUS_REMOTE_URL: ${{ vars.CORPUS_REMOTE_URL }}
        run: |
          set -euo pipefail
          # No committed pointer means no corpus — nothing to parse.
          if [ ! -f corpus/corpus.db.ref ]; then
            echo "no corpus pointer yet; skipping merits backfill"; exit 0
          fi
          gh auth setup-git # persist-credentials is false on checkout
          uv run fedcourts backfill-merits-judgments --apply
          # Blob before pointer commit, as everywhere.
          uv run fedcourts corpus-push
          git add corpus/corpus.db.ref
          if git diff --cached --quiet; then
            echo "Merits judgments already stamped; nothing to persist."
            exit 0
          fi
          git commit -m "seed: converge corpus (merits judgments)"
          bash "${GITHUB_WORKSPACE}/.github/actions/commit-corpus-to-main/push_with_retry.sh" \
            "merits-judgment pointer"

      # Mint the open merits forecast events onto already-granted, undecided
      # dockets. The live mint opens a case's merits events at cert-grant
      # *detection*, so a grant latched by the walker without a live resolution
      # pass carries none — and the merits fan-out has no population there.
      # Ordering contract with the step above: the mint treats a null
      # `merits_judgment` as unlatched, not pending, so
      # `backfill-merits-judgments --apply` must run immediately before this
      # sweep in the same corpus session, leaving the judgment columns
      # as-latched-as-possible before pendency is judged. Converges like the
      # sweeps above — a converged corpus mints nothing.
      - name: Backfill merits events
        if: github.event_name != 'schedule' || github.event.schedule == '31 2 * * *'
        continue-on-error: true
        # Bounded for the same reason as the judgments pass: the pendency check
        # reads a stored snapshot per candidate grant, an external-service loop
        # with no internal cap on a non-converged corpus. On the first
        # non-converged 02:31 window the job's 55m cap can still bind (the walk
        # plus the judgments pass plus this step, each at its bound), and a cap
        # hit cancels the run rather than continuing — so that window may raise
        # a one-off guard escalation.
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          CORPUS_REMOTE_URL: ${{ vars.CORPUS_REMOTE_URL }}
        run: |
          set -euo pipefail
          # No committed pointer means no corpus — nothing to mint.
          if [ ! -f corpus/corpus.db.ref ]; then
            echo "no corpus pointer yet; skipping merits-event backfill"; exit 0
          fi
          gh auth setup-git # persist-credentials is false on checkout
          # The mint's skip guards read committed ledger artifacts out of
          # `data/` and its writes land new `event.yaml` files beside them, and
          # this checkout is only as fresh as the previous step's rebase — up to
          # a window stale. Read the remote tip first so the guards and the
          # writes both see the current ledger — fast-forward only, failing
          # closed on a sibling step's unpushed commit (see the relabel step).
          git fetch origin "$GITHUB_REF_NAME"
          git merge --ff-only FETCH_HEAD
          # Stamp the null moment columns first (trivially idempotent), so the
          # events sweep and every moment-keyed reader group on materialized
          # moments.
          uv run fedcourts backfill-event-moments --apply
          # Dry-run first so the step log carries the skip/triage report the
          # maintainer reads, then apply through the live mint's write path.
          uv run fedcourts backfill-merits-events
          uv run fedcourts backfill-merits-events --apply
          # Blob before pointer commit, as everywhere.
          uv run fedcourts corpus-push
          # Unlike the pointer-only sweeps above, this one writes ledger
          # `event.yaml` files under `data/` as well as moving the pointer —
          # stage BOTH in the one commit, or the pointer lands without the
          # ledger half of the mint. The directory guard mirrors the walk's
          # checkpoint: on a tip without data/ an unguarded add fails under
          # `set -euo pipefail` AFTER the blob push, and continue-on-error
          # would leave the sweep silently never converging.
          git add corpus/corpus.db.ref
          if [ -d data ]; then
            git add data/
          fi
          if git diff --cached --quiet; then
            echo "Merits events already converged; nothing to persist."
            exit 0
          fi
          git commit -m "seed: converge corpus (merits events)"
          bash "${GITHUB_WORKSPACE}/.github/actions/commit-corpus-to-main/push_with_retry.sh" \
            "merits-event pointer"

      # Repair the misattribution shape an earlier single-open-event
      # attribution shortcut wrote, and its cause: entry-pinned SCOTUS events
      # carrying a case-baseline id are removed (no re-ingest reproduces one —
      # `extract_events` refuses the kind at SCOTUS), then non-baseline events
      # whose outcome duplicates a case-baseline sibling's outcome triple are
      # deleted and reopened. Removal runs first: it clears the entry-pinned
      # case of the reopen sweep's baseline-pair triage, so one window
      # converges both. Both sweeps skip and report any event carrying
      # committed predict/evaluate output, and both refuse to apply above
      # their blast-radius bound — the population is finite and non-growing,
      # so a large count means a widened predicate, not a dirtier ledger. The
      # ledger deletions and rewrites ride this lane because no collect jail
      # admits them (`assert_within_jail` takes adds only,
      # `assert_cleanup_within_jail` deletes under `predictions/` only); here
      # they stage into the one pointer commit, atomic with the corpus they
      # must match. Converges like the sweeps above — a repaired ledger
      # removes and reopens nothing.
      - name: Repair misattributed baseline outcomes
        if: github.event_name != 'schedule' || github.event.schedule == '31 2 * * *'
        continue-on-error: true
        # Bounded like the siblings, and comfortably: both scans are local
        # (committed outcomes against corpus rows), no external-service loop.
        # This raises the 02:31 window's bounded sweep tail to 36m over the
        # 40m loop, against the job's 55m cap — but only a non-converged
        # window pays a sweep's bound, and this pair's backlog is two events;
        # every later window costs seconds.
        timeout-minutes: 8
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          CORPUS_REMOTE_URL: ${{ vars.CORPUS_REMOTE_URL }}
        run: |
          set -euo pipefail
          # No committed pointer means no corpus — nothing to repair.
          if [ ! -f corpus/corpus.db.ref ]; then
            echo "no corpus pointer yet; skipping attribution repairs"; exit 0
          fi
          gh auth setup-git # persist-credentials is false on checkout
          # Both sweeps read committed ledger artifacts out of `data/` and
          # delete or rewrite beside them, and this checkout is only as fresh
          # as the previous step's rebase — read the remote tip first so the
          # skip guards see every collect PR merged in the gap. Fast-forward
          # only: if a sibling step's push retries were exhausted, its local
          # commit is unpushed while its corpus mutations survive in the
          # workspace DB, and a hard reset would publish that split — failing
          # closed here leaves the next window to reconverge instead.
          git fetch origin "$GITHUB_REF_NAME"
          git merge --ff-only FETCH_HEAD
          # Dry-run first, mirrored into the run summary so each sweep's
          # report — every removal, reopen, and skip with its reason — stays
          # answerable after step-log retention; then apply.
          uv run fedcourts remove-unmintable-events | tee -a "$GITHUB_STEP_SUMMARY"
          uv run fedcourts remove-unmintable-events --apply
          uv run fedcourts reopen-misattributed-outcomes | tee -a "$GITHUB_STEP_SUMMARY"
          uv run fedcourts reopen-misattributed-outcomes --apply
          # Blob before pointer commit, as everywhere. An apply that pushed the
          # blob but failed before the commit publishes nothing: readers
          # resolve the committed pointer, and the next window re-detects from
          # the still-committed ledger and reconverges.
          uv run fedcourts corpus-push
          # `git add data/` stages the deletions and rewrites along with the
          # pointer — one commit, so the ledger and the corpus it must match
          # land together or not at all. (The directory guard is inherited
          # from the add sweeps' shape; a repair with anything to stage always
          # has a `data/` tree.)
          git add corpus/corpus.db.ref
          if [ -d data ]; then
            git add data/
          fi
          if git diff --cached --quiet; then
            echo "Attribution already repaired; nothing to persist."
            exit 0
          fi
          git commit -m "seed: converge corpus (attribution repairs)"
          bash "${GITHUB_WORKSPACE}/.github/actions/commit-corpus-to-main/push_with_retry.sh" \
            "attribution-repair pointer"

      # The stored circuit slice still carries the bulk export's misjoined
      # cluster fields; the ingest projection withholds them from a re-served
      # bulk row, and this converges the rows nothing re-serves. Detection is
      # provable bulk provenance — fields the REST channel cannot supply —
      # so docket-derived judges/panel on discovery-onboarded rows survive.
      # The apply refuses above the command's blast-radius bound, sized just
      # over the measured slice: a widened predicate should fail loudly, not
      # null a channel the carve-out never covered. Corpus-only:
      # no ledger surface, so a pointer-only commit like the judgments sweep.
      # Idempotent — a scrubbed corpus matches nothing, so a converged
      # window's cost is the apply's own count scan, seconds over the cases
      # table.
      - name: Scrub the bulk slice's misjoined cluster fields
        if: github.event_name != 'schedule' || github.event.schedule == '31 2 * * *'
        continue-on-error: true
        # Bounded for the same reason as the sibling sweeps — a cap hit
        # cancels the whole run, which continue-on-error cannot absorb — and
        # tightly: one UPDATE against the pulled blob (the first
        # non-converged window rewrites ~1.36M rows in seconds), then the
        # blob push the walk pays on every window anyway.
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          CORPUS_REMOTE_URL: ${{ vars.CORPUS_REMOTE_URL }}
        run: |
          set -euo pipefail
          # No committed pointer means no corpus — nothing to scrub.
          if [ ! -f corpus/corpus.db.ref ]; then
            echo "no corpus pointer yet; skipping cluster scrub"; exit 0
          fi
          gh auth setup-git # persist-credentials is false on checkout
          # One apply, its count line mirrored into the run summary: a
          # separate dry run would repeat the same full-table count for a
          # one-line report the apply already prints.
          uv run fedcourts scrub-bulk-cluster-fields --apply | tee -a "$GITHUB_STEP_SUMMARY"
          # Blob before pointer commit, as everywhere.
          uv run fedcourts corpus-push
          git add corpus/corpus.db.ref
          if git diff --cached --quiet; then
            echo "Bulk cluster fields already scrubbed; nothing to persist."
            exit 0
          fi
          git commit -m "seed: converge corpus (bulk cluster scrub)"
          bash "${GITHUB_WORKSPACE}/.github/actions/commit-corpus-to-main/push_with_retry.sh" \
            "cluster-scrub pointer"

      # The pair below runs in this order for a reason: a label rewrite that
      # lands after a grade was taken leaves the grade stale, so labels move
      # first and the recompute follows in the same dispatch. Neither half
      # fires on the schedule — each acts on a ledger a maintainer has read,
      # and that reading only exists because a `dry-run` dispatch produced it.
      #
      # Unlike EVERY other writer step in this lane — the scheduled sweeps and
      # the two dispatch-only backfills alike — neither carries
      # continue-on-error, and the distinction is not "dispatch-only". It is
      # what a failure means here. Those steps fail by not converging, and the
      # next window retries for free. These fail by REFUSING: an apply without
      # its bound, a malformed cell id, a stamp the command declines. A
      # refusal is the answer the maintainer dispatched for, and absorbing it
      # would report work that never happened, so the step fails, the job
      # fails, and the guard job names the step in the pipeline-health issue.
      - name: Converge disposition labels (dispatch-only)
        # The event_name conjunct is load-bearing for the reason the
        # questions-presented sibling documents: on a schedule the inputs
        # context is empty and the `!= 'none'` comparison evaluates TRUE.
        # The dedupe conjunct is the sibling sweeps' reason too: this one
        # classifies dispositions off corpus rows, and an unmerged twin is a
        # second row for the same petition — the label must be read off the
        # merged one.
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.disposition_convergence != 'none' && steps.dedupe-live-rows.outcome == 'success' }}
        # The scan is local — committed outcome labels against corpus rows —
        # with the apply's writes under `data/`; sized like the ledger sweeps
        # above rather than the network-bound backfills.
        timeout-minutes: 15
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          CORPUS_REMOTE_URL: ${{ vars.CORPUS_REMOTE_URL }}
          DISPOSITION_MODE: ${{ inputs.disposition_convergence }}
          DISPOSITION_MAX_RELABELS: ${{ inputs.disposition_max_relabels }}
        run: |
          set -euo pipefail
          # Validate the bound before anything else, including the corpus
          # guard: a dispatch that cannot legally apply should say so in
          # seconds, not after a full scan. The command refuses an unbounded
          # apply on its own too; this refusal is the one with the maintainer's
          # procedure in it.
          if [ "${DISPOSITION_MODE}" = "apply" ] \
            && ! [[ "${DISPOSITION_MAX_RELABELS}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::disposition_convergence=apply needs disposition_max_relabels set to a positive integer — the relabel count read off a previous dry-run dispatch's ledger. Re-dispatch with that number."
            exit 1
          fi
          # No committed pointer means no corpus — nothing to converge against.
          if [ ! -f corpus/corpus.db.ref ]; then
            echo "no corpus pointer yet; skipping disposition convergence"; exit 0
          fi
          gh auth setup-git # persist-credentials is false on checkout
          # The sweep reads committed ledger artifacts out of `data/` and
          # rewrites beside them, so it needs the remote tip, not this
          # checkout's — the scored-cell holdback is keyed on grades that
          # arrive by collect PR. Fast-forward only, for the attribution
          # sibling's reason: a sibling step whose push retries were exhausted
          # holds an unpushed commit over live corpus mutations, and a reset
          # would publish that split.
          git fetch origin "$GITHUB_REF_NAME"
          git merge --ff-only FETCH_HEAD
          # Dry-run first, into the summary: the relabel ledger is the reading
          # the apply's bound comes from, and it must outlive the step log.
          # (On an apply this run is a receipt, not a reading — nobody reads it
          # before the rewrite.)
          uv run fedcourts converge-disposition-labels 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "${DISPOSITION_MODE}" != "apply" ]; then
            echo "dry-run only; nothing written."
            exit 0
          fi
          # No --include-scored: this dispatch converges the unscored
          # population only. Rewriting a graded cell's label here would move
          # what a published standing was computed from while the standing
          # itself sat still, so the scored cells are reported instead — the
          # dry-run ledger's scored-cell backlog is a maintainer's decision,
          # not this step's.
          uv run fedcourts converge-disposition-labels \
            --apply --max-relabels "${DISPOSITION_MAX_RELABELS}" 2>&1 \
            | tee -a "$GITHUB_STEP_SUMMARY"
          # Blob before pointer commit, as everywhere.
          uv run fedcourts corpus-push
          # The rewrites land in `data/` (`outcome.json`); stage them with the
          # pointer so the ledger and the corpus it must match move together
          # or not at all.
          git add corpus/corpus.db.ref
          if [ -d data ]; then
            git add data/
          fi
          if git diff --cached --quiet; then
            echo "Disposition labels already converged; nothing to persist."
            exit 0
          fi
          git commit -m "seed: converge corpus (disposition labels)"
          bash "${GITHUB_WORKSPACE}/.github/actions/commit-corpus-to-main/push_with_retry.sh" \
            "disposition-label pointer"

      # The recompute for cells whose outcome moved UNDER a committed grade —
      # by the label convergence above or by any of the lane's other ledger
      # sweeps, which rewrite and reopen outcomes without consulting who has
      # already graded them. Ledger-only: it recomputes graded fields under
      # the cell's original stamp and writes `evaluation.json`, touching no
      # corpus row, so this step commits `data/` alone with no blob push and
      # no pointer move.
      #
      # What the scoring surfaces make of the result is the command's
      # contract, not this step's: per `metrics/README.md`, a standing moves
      # honestly only through a grading the supersede-collapse counts, and a
      # bare re-stamp of an existing `evaluation.json` moves it with a trace
      # only in `data/`'s git history. This step names cells and invokes the
      # command; it cannot supply that property if the command does not.
      - name: Re-grade named cells (dispatch-only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.regrade_stale != 'none' }}
        # One local recompute per named cell over a maintainer-sized list.
        timeout-minutes: 15
        # No corpus remote and no `corpus.db.ref` guard, unlike every sibling
        # above: the recompute's inputs are the committed ledger artifacts the
        # sweeps just rewrote, and it neither pulls nor pushes the blob. That
        # is also why it needs no dedupe gate — an unmerged twin row cannot
        # change what a committed outcome already says.
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REGRADE_MODE: ${{ inputs.regrade_stale }}
          REGRADE_CELLS: ${{ inputs.regrade_cells }}
        run: |
          set -euo pipefail
          # `regrade_cells` is maintainer-typed free text entering a shell, so
          # it is handled as data throughout: expanded from the environment
          # (never interpolated into this script), split on whitespace, and
          # every line matched against the id grammar before a command sees
          # it. The grammar excludes `.` deliberately — with no dots no field
          # can be a `..` path segment, whatever the command does with it.
          pattern='^[a-z0-9-]+/[0-9]+/evt-[a-z0-9-]+/[0-9]{8}T[0-9]{6}Z/[a-z0-9-]+$'
          malformed=0
          cells=()
          # `printf '%s\n'`, not '%s': `read` returns non-zero on a final line
          # with no terminator, so an unterminated last cell would be dropped
          # by the loop — silently, and past the all-or-nothing check below.
          # The blank line this adds is absorbed by the emptiness guard.
          while IFS= read -r line; do
            [ -n "$line" ] || continue
            # Bash's own regex match: no pipeline, so no interaction with
            # pipefail and no per-line subprocess.
            if [[ "$line" =~ $pattern ]]; then
              cells+=("$line")
            else
              echo "::error::malformed regrade cell (want court/docket/event/run_id/actor, e.g. scotus/1119228/evt-petition-certiorari/20260624T103000Z/claude-judge): ${line}"
              malformed=1
            fi
          done < <(printf '%s\n' "${REGRADE_CELLS}" | tr -s ' \t\r' '\n')
          # All-or-nothing: a half-applied list is worse to reason about than a
          # refused one, and the fix is the same edit either way.
          if [ "$malformed" -ne 0 ]; then
            echo "::error::refusing the whole list — correct the lines above and re-dispatch."
            exit 1
          fi
          if [ "${#cells[@]}" -eq 0 ]; then
            echo "::error::regrade_stale=${REGRADE_MODE} names no cells — set regrade_cells."
            exit 1
          fi
          if [ "${REGRADE_MODE}" = "apply" ]; then
            gh auth setup-git # persist-credentials is false on checkout
            # Recompute on top of the remote tip, not this checkout's: the
            # evaluations being rewritten arrive by collect PR, and a re-grade
            # computed against a stale copy would commit a rewrite of a
            # superseded file. Fast-forward only, for the attribution
            # sibling's reason — an exhausted push retry upstream must fail
            # this step closed rather than be reset away.
            git fetch origin "$GITHUB_REF_NAME"
            git merge --ff-only FETCH_HEAD
          fi
          touched=()
          for cell in "${cells[@]}"; do
            IFS=/ read -r court docket event run actor <<<"$cell"
            if [ "${REGRADE_MODE}" != "apply" ]; then
              echo "would run: uv run fedcourts stamp-cell --regrade --court ${court} --docket ${docket} --event ${event} --run-id ${run} --role evaluator --actor ${actor}" \
                | tee -a "$GITHUB_STEP_SUMMARY"
              continue
            fi
            uv run fedcourts stamp-cell --regrade \
              --court "$court" --docket "$docket" --event "$event" \
              --run-id "$run" --role evaluator --actor "$actor" 2>&1 \
              | tee -a "$GITHUB_STEP_SUMMARY"
            touched+=("data/cases/${court}/${docket}/events/${event}/evaluations/${actor}")
          done
          if [ "${REGRADE_MODE}" != "apply" ]; then
            echo "dry-run only; nothing written."
            exit 0
          fi
          # Stage the named cells' evaluator directories, never a blanket
          # `git add data/`. Every sweep in this lane is continue-on-error, so
          # one that wrote `data/` and then failed before its own commit
          # leaves ledger writes in the tree; a blanket add would sweep that
          # residue into this pointer-free commit and publish a ledger half
          # whose corpus half never moved. The cells are enumerated and
          # grammar-checked, so the jail is exact.
          git add -- "${touched[@]}"
          if git diff --cached --quiet; then
            echo "Re-grade reproduced the stored grades; nothing to persist."
            exit 0
          fi
          git commit -m "seed: re-grade named cells"
          bash "${GITHUB_WORKSPACE}/.github/actions/commit-corpus-to-main/push_with_retry.sh" \
            "re-grade ledger"

      # Trailing, NON-BLOCKING data-validation, exactly as on run-pull's jobs:
      # produce the correctness verdict on the now-current corpus and publish it
      # for run-ops to present and escalate — loud-not-fatal by contract. Gated to
      # the same one-window/day cadence as the scope reconcile.
      - name: Produce + publish the corpus validation verdict
        if: github.event_name != 'schedule' || github.event.schedule == '31 2 * * *'
        continue-on-error: true
        uses: ./.github/actions/publish-corpus-verdict
        with:
          token: ${{ steps.app-token.outputs.token }}

  # Safety net for the walker. Its own summary step cannot run when the job is
  # cancelled — the hard timeout-minutes kill, an OOM, or a setup step that hangs
  # until the budget is gone — so a cancelled or failed run would otherwise pass
  # silently (it commits directly to main; there is no PR gate to redden). This
  # job DEPENDS on seed but is not cancelled with it, so it can read the result,
  # name the step that stopped the run, and raise ONE long-lived escalation issue
  # — clearing it when a later walk finishes clean. Mirrors run-ops' idiom.
  guard:
    needs: [seed]
    if: always()
    runs-on: ubuntu-latest
    # Sized to the retry worst case: 4 retried call groups x 3 bounded 30s
    # attempts plus 60s of backoff sleeps. Nothing downstream waits on this job.
    timeout-minutes: 10
    # This job reads the needs result plus the run's own step outcomes, and writes
    # a NON-triggering issue — no checkout, no corpus, no contents. Per
    # docs/security.md that is exactly the ambient-GITHUB_TOKEN case; the data App
    # token is reserved for the contents:write the walker's own steps need, and
    # deliberately does NOT carry issue-write.
    permissions:
      issues: write
      actions: read # this run's job list (repo-wide read; the guard runs no agent code)
    steps:
      - name: Escalate a cancelled or failed seed walk
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RESULT: ${{ needs.seed.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # Every call below goes to the GitHub API, and a transient 5xx on any
          # of them turns this watchdog's own bookkeeping into a red run over a
          # clean walk — or leaves a stale incident open over a healthy one. A
          # short bounded retry absorbs the blip; a sustained outage still
          # fails the step loudly, which is the right residue when the API
          # itself is down.
          # Each attempt is bounded: gh sets no client-side request timeout, so
          # a stalled connect against a degraded API would otherwise hang into
          # the job's own kill — leaving no issue written, the one outcome this
          # job exists to prevent. Capture-then-print keeps a failed attempt's
          # partial stdout out of command substitutions. Retrying a
          # deterministic 4xx costs only the 15s of sleeps, accepted here for
          # simplicity over push_with_retry.sh's transient/genuine split.
          retry() {
            local attempt out
            for attempt in 1 2 3; do
              if out=$(timeout 30 "$@"); then
                printf '%s' "$out"
                return 0
              fi
              if [ "$attempt" -lt 3 ]; then sleep $((attempt * 5)); fi
            done
            return 1
          }
          # `pipeline-health` is a NON-triggering label by design (no run:* workflow
          # keys on it). Create it idempotently, as run-ops does for its label.
          # Non-fatal after retries: in steady state the label exists, and if it
          # truly does not, the issue write below fails loudly on its own.
          retry gh label create pipeline-health --repo "$REPO" --force \
            --color b60205 --description "Long-lived corpus-writer failure" \
            || echo "::warning::pipeline-health label create failed after retries; continuing"
          num=$(retry gh issue list --repo "$REPO" --label pipeline-health --state open \
            --json number --jq '.[0].number')
          # Only 'success' clears; 'failure'/'cancelled' (or any non-skipped
          # not-clean result — this job's always() runs it regardless) escalate.
          if [ "$RESULT" = "success" ]; then
            if [ -n "$num" ]; then
              retry gh issue comment "$num" --repo "$REPO" \
                --body "✅ The seed walk finished cleanly again ($RUN_URL) — closing."
              retry gh issue close "$num" --repo "$REPO" --reason completed
            fi
            exit 0
          fi
          # Name the step that actually stopped the run. `cancelled` is ambiguous
          # on its own — it covers a walk that overran the job budget AND a job
          # killed while still in setup, which are different problems with
          # different fixes. The run's own job list distinguishes them, and
          # getting it wrong sends triage at the walker when the walk never ran.
          # Keyed on the job id `seed` (the job declares no `name:`); giving it
          # one would degrade this to the unnamed branch below, never break it.
          # A failed lookup only costs the step name, so it stays non-fatal — but
          # it is NOT silenced, so a 403/404 is in the log for whoever triages.
          step=$(retry gh api "repos/${REPO}/actions/runs/${GITHUB_RUN_ID}/jobs" \
            --jq '[.jobs[] | select(.name == "seed") | .steps[]
                   | select(.conclusion != "success" and .conclusion != "skipped")][0].name' \
            || true)
          if [ -n "$step" ] && [ "$step" != "null" ]; then
            where="stopped at step \`${step}\`"
          else
            where="stopped before any step reported"
          fi
          body="⚠️ The seed (historical) run ended \`${RESULT}\` — ${where}. It commits directly to main with no PR gate, so this needs a look: ${RUN_URL}"
          if [ -n "$num" ]; then
            retry gh issue comment "$num" --repo "$REPO" --body "$body"
          else
            retry gh issue create --repo "$REPO" --label pipeline-health \
              --title "Seed walk failing" --body "$body"
          fi
