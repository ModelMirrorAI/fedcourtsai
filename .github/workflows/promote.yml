name: promote

# Maintainer-dispatched driver for a staging→main promotion batch. Idempotent
# and level-triggered: dispatch it, read the step summary, do what it says,
# dispatch again — until every gate is green, at which point the summary hands
# back the `gh pr create` command for the promotion PR. This workflow itself
# performs no write. Of the two writes a promotion needs —
#
#   * the main→staging sync, normally landed by the scheduled `sync-staging`
#     workflow (a PR through the staging ruleset, not a bypass). Reaching the
#     sync gate here means that PR is open, conflicting, or has not run yet;
#     the summary prints the manual merge-and-push commands as the escape
#     hatch, which only the maintainer can use — the repository admin role is
#     the ruleset's sole bypass actor;
#   * the promotion PR: a PR created with a workflow's own GITHUB_TOKEN
#     triggers no `pull_request` workflows, so its required checks would never
#     report — the maintainer creating it is what makes the gate real.
#
# Its own workflow file rather than a mode on an existing dispatch surface:
# promotion is a release-shaped operational surface whose run history is the
# audit trail of every batch attempt, like integration-test's — not an
# analysis that answers a question about the data.
#
# One dispatch does, in order (every step is a no-op when already satisfied):
#   1. Quiescence gate — no predict/evaluate/backtest fan-out in flight
#      (scripts/promotion-gate.sh, the single gate definition ci.yml's
#      `promotion-gate` job shares).
#   2. Sync check: staging must already contain main, so the batch is tested
#      against main's current data commits without owning them — staging
#      carries code/config only; main is the pre-registration record. When it
#      does not, the summary prints the merge-and-push commands (run them,
#      resolving any conflict in the merge commit) and the run fails.
#   3. Freshness gate at the staging head: every required integration
#      scenario green at exactly that sha. After a sync moved staging this
#      fails by construction — the summary prints the scenario dispatch
#      commands (each runs from the staging branch, which is the gate), and
#      this workflow is re-dispatched after they land. The `skip_engine_smoke`
#      input narrows what this pre-flight asks for to the token-free
#      scenarios. It does not decide what the batch merges on: that is the
#      `promote:skip-engine-smoke` label on the promotion PR, a separate and
#      deliberate second act (ci.yml's `promotion-gate` job).

on:
  workflow_dispatch:
    inputs:
      skip_engine_smoke:
        description: >-
          Drop the three engine-smoke runs from THIS PRE-FLIGHT's freshness
          check, accepting a token-free `scenario=all-offline` run as
          whole-suite evidence. It answers "is anything else missing" without
          paying for the smokes. It does NOT narrow what the batch merges on:
          waiving the smokes at the merge gate is a separate act — the
          `promote:skip-engine-smoke` label on the promotion PR — so that
          setting this input can never quietly become the merge decision too.
          Reserve both for batches whose risk you judge not to be worth the
          smokes' tokens; a batch that cannot affect a cell — docs, analytics,
          non-cell code — is the clear case, and when in doubt run the full
          suite.
        type: boolean
        default: false

permissions: {}

# One promotion attempt at a time; a queued re-dispatch waits rather than
# interleaving its summary with a running attempt's.
concurrency:
  group: promote
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # checkout + ancestry check; this workflow never writes
      actions: read # fan-out + integration-test run state for the gates
      issues: read # open run:* trigger issues mean a matrix in flight
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Quiescence gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/promotion-gate.sh quiesce
      - name: Sync check — staging must contain main
        run: |
          set -euo pipefail
          if ! git rev-parse --verify -q origin/staging >/dev/null; then
            echo "::error::no 'staging' branch on origin — create it from main (docs/pipeline.md, 'Promotion: staging → main') before dispatching"
            exit 1
          fi
          if git merge-base --is-ancestor origin/main origin/staging; then
            echo "staging already contains main"
          else
            {
              echo "## Sync needed: staging is behind main's data commits"
              echo
              echo "The scheduled \`sync-staging\` workflow normally lands this on its own; reaching here means its PR is still open, conflicting, or the schedule has not run since main moved. Check for an open PR into \`staging\` first — dispatching \`sync-staging\` is the cheaper fix."
              echo
              echo "Otherwise run (as the staging ruleset's admin bypass; resolve any conflict in the merge commit), then re-dispatch this workflow:"
              echo
              echo '```'
              echo "git fetch origin"
              echo "git switch staging && git reset --hard origin/staging"
              echo "git merge --no-edit origin/main"
              echo "git push origin staging"
              echo '```'
            } >>"$GITHUB_STEP_SUMMARY"
            echo "::error::staging does not contain main — run the sync commands in the step summary, then re-dispatch"
            exit 1
          fi
      - name: Freshness gate at the staging head
        env:
          GH_TOKEN: ${{ github.token }}
          # The freshness stage is the only one that reads this; quiescence
          # above is unaffected by which scenarios are required. A truthiness
          # test, not a `!=` comparison: a false input and an absent one both
          # yield '' and leave the gate strict, so no non-dispatch event could
          # ever read as "skip" (the hazard a `!= 'none'` comparison carries:
          # against an empty inputs context it is TRUE).
          PROMOTION_SKIP_SMOKE: ${{ inputs.skip_engine_smoke && '1' || '' }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse origin/staging)
          # Keep the dispatch-command list below in step with the script's
          # REQUIRED_SCENARIOS default — the script is the gate; this list is
          # the help text for satisfying it. The `= 1` sentinel is likewise
          # the script's (scripts/promotion-gate.sh); the gate stays strict on
          # any drift, so the only cost of missing one would be help text
          # naming the wrong suite.
          if [ "${PROMOTION_SKIP_SMOKE:-}" = 1 ]; then
            suite=all-offline
            spend="spends nothing — this dispatch dropped the engine-smoke runs"
          else
            suite=all
            spend="spends three engine-smoke cells' worth of tokens"
          fi
          if scripts/promotion-gate.sh freshness "$sha"; then
            {
              if [ "$suite" = all-offline ]; then
                echo "## Pre-flight green at \`${sha}\` — engine-smoke skipped"
                echo
                echo "Green on the token-free suite alone, so this says nothing about the smokes. The promotion PR's own \`promotion-gate\` check demands them unless that PR carries the \`promote:skip-engine-smoke\` label, and \`main\`'s ruleset has no bypass for the check itself: either dispatch the three engine-smoke runs at this sha, or waive them on the PR and accept that the batch merges with no real-engine evidence."
              else
                echo "## Promotion gates green at \`${sha}\`"
              fi
              echo
              echo "Open (or refresh) the promotion PR — required checks run under your identity:"
              echo
              echo '```'
              echo "gh pr create --base main --head staging --title \"chore: promote staging to main\" --body \"Promotion batch; gates green at ${sha}.\""
              echo '```'
              echo
              echo "Merge with a **merge commit** (never squash — staging and main must share history), and re-run the promotion-gate check right before merging: quiescence is point-in-time."
            } >>"$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## Integration runs needed at \`${sha}\`"
              echo
              echo "One dispatch from the staging branch covers the whole required suite (${spend}); the workflow resolves the staging environment from the branch:"
              echo
              echo '```'
              echo "gh workflow run integration-test.yml --ref staging -f scenario=${suite}"
              echo '```'
              echo
              echo "A red whole-suite run earns no partial credit (the gate matches whole runs); \`gh run rerun <run-id> --failed\` turns it green in place. Or dispatch the scenarios individually:"
              echo
              echo '```'
              for s in ranged-reads corpus-service stub-cascade mcp-sidecar collect qp-topic; do
                echo "gh workflow run integration-test.yml --ref staging -f scenario=${s}"
              done
              # Only when they are still required: under the skip the point of
              # the batch is not to spend them.
              if [ "$suite" = all ]; then
                for e in claude-code codex gemini; do
                  echo "gh workflow run integration-test.yml --ref staging -f scenario=engine-smoke -f engine=${e}"
                done
              fi
              echo '```'
              echo
              echo "Then re-dispatch this workflow."
            } >>"$GITHUB_STEP_SUMMARY"
            exit 1
          fi
