name: run-pull

# Refresh tracked dockets — three writer jobs on one surface, at most one per
# run: two scheduled forward writers and one dispatch-only enrichment pass.
#
# - `pull` (the `17 *` crons or dispatch mode=pull):
#   targeted CourtListener *enrichment* for the tracked set —
#   not the primary freshness mechanism. CourtListener discovery is off (`pull.
#   discover_new_filings: false`): the live channel owns SCOTUS onboarding, and
#   circuit discovery onboarded cases outside the prediction scope.
# - `live` (the `47 *` crons or dispatch mode=live): the SCOTUS live channel
#   (docs/live-sources.md) — `fedcourts live-poll` probes supremecourt.gov
#   docket JSON for newly docketed petitions (persisted per-Term cursor) and
#   re-polls the pending watchlist. No CourtListener token, no API budget; the
#   same corpus-writer plumbing (corpus push, pointer commit, queue routing).
# - `enrich` (dispatch mode=enrich-opinions only, never scheduled): walks
#   granted SCOTUS rows to their published opinion cluster and lands the
#   reporter citations and the opinion body (`fedcourts enrich-opinions`,
#   docs/data-pipeline.md). Dispatch-only because the pass spends the shared
#   CourtListener budget (~4 requests/case against the same daily ceiling the
#   pull windows draw on) and keeps retrying opinion-less grants (GVR/DIG
#   residue) — rotated stalest-first behind the never-attempted, so the cap
#   reaches fresh candidates every run — and an operator sizes and times each
#   run deliberately, in a dead zone between pull windows.
#
# The historical Term walker (the backfill of past Terms) lives in its own
# workflow, run-seed.yml, so its schedule is independent of these forward
# windows; it shares this repo's `corpus-write` concurrency group, so it still
# serializes with these forward writers. See run-seed.yml for that job.
#
# Each scheduled run fires exactly one of the two (the cron minute is the mode
# switch), so the shared corpus-write lock serializes writers. The live and pull
# windows interleave every ~3h; a run-seed window sits in a dead zone between
# them and frees the lock before forward work needs it. Note GitHub keeps only
# the latest *pending* run per concurrency group: a queued scheduled window
# superseded by the next one just picks up where its rotation left off.
# Spreading the refresh over several windows lifts daily throughput toward the
# CourtListener tier's daily ceiling while each window stays under the hourly one.
# Deterministic (no agent): re-fetches tracked dockets
# and detects resolution of open events —
# writing `outcome.json` when the disposition is machine-readable — ingesting the
# raw facts (including each refresh's point-in-time snapshot) into the S3-hosted
# corpus (pulled from / pushed back to the remote via `fedcourts corpus-pull` /
# `corpus-push`). The new outcomes and the
# small corpus pointer are committed DIRECTLY to main (they are CourtListener
# facts, not agent output — see docs/data-pipeline.md). Neither tournament stage
# is triggered from here: this window routes the predict queue (stamping
# `predict_queued_at`) and counts the evaluate backlog, and run-predict and
# run-evaluate each derive their own fan-out from that committed state on their
# own schedule — so a changed case reaches a forecaster, and a resolved event a
# judge, by those lanes rather than by an issue filed here. A case that appears
# decided but whose outcome could not be recorded deterministically is surfaced
# on the window's Actions step summary for maintainer triage.
# Run logging creates nothing on the happy path: a window's own record is its
# Actions step summary and the run history behind it, and only a FAILING window
# opens (or reuses, same day) a `pull-log` / `live-log` issue left open for a
# human — so an open run-log issue means exactly "a window broke". The corpus
# commits use the GitHub App token so they reach `main` through the
# deterministic-writer bypass; the run-log issues ride the ambient GITHUB_TOKEN
# instead — they must trigger nothing, and no workflow in this repository keys
# on a label at all, so no logging issue can re-fire anything.
on:
  schedule:
    # Four pull windows/day, six hours apart (staggered off the hour from other
    # jobs). Spreading the work keeps each run under the hourly CourtListener
    # ceiling while the day's total approaches the daily one. The minute is the
    # job selector: `17 *` crons run `pull` and `47 *` run `live`. (The
    # historical walker's `31` windows live in run-seed.yml.)
    - cron: "17 1,7,13,19 * * *"
    # Four live windows/day, interleaved between the pull windows so the
    # corpus writers rarely even queue on the shared lock. Budget-free
    # (supremecourt.gov), so cadence is a freshness/politeness choice — the
    # conference watchlist will retune it around the cert calendar.
    - cron: "47 4,10,16,22 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Which refresh to run (the historical walker is dispatched via run-seed.yml)"
        type: choice
        options: [pull, live, enrich-opinions]
        default: pull
      max_cases:
        description: "enrich-opinions only: granted dockets to walk this run (~4 API requests each; ~75 exhausts the hourly tier ceiling)"
        type: string
        default: "50"

permissions: {}

# Every corpus writer — this file's three jobs, run-seed's historical walker
# and run-repair's maintenance passes —
# write the single corpus.db pointer, so they run under ONE lock
# to serialize corpus writers and prevent lost updates.
# cancel-in-progress is false so a queued run waits rather than being dropped.
# Every run of this workflow runs exactly one writer job, so every run belongs
# in the shared group — there is no event class here that spawns a run only to
# skip it.
concurrency:
  group: corpus-write
  cancel-in-progress: false

jobs:
  pull:
    # One writer job per run: the cron minute (17 = pull, 47 = live) or the
    # dispatch `mode` input selects the job.
    if: >-
      (github.event_name == 'schedule' && startsWith(github.event.schedule, '17 ')) ||
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'pull')
    runs-on: ubuntu-latest
    # A single window's refresh (≤ max_cases_per_run dockets ≈ a few dozen
    # CourtListener fetches + S3 corpus transfer) finishes well inside this; the cap
    # releases the shared corpus-write lock far sooner than GitHub's 6h default if
    # a network step hangs.
    timeout-minutes: 45
    environment: prod
    # This environment's whole corpus estate, as one base URL
    # (s3://<bucket>[/<prefix>]) resolved from the `prod` environment, falling
    # back to a repo/org variable of the same name. fedcourtsai.paths fixes
    # both halves beneath it — the index remote every corpus-pull/push
    # resolves the pointer against, and the per-case content store
    # (fedcourtsai.casestore) the payloads live in — so the two can never name
    # different environments, and the corpus-split mode follows from the
    # store's address rather than from a flag beside it: the writer leaves the
    # blob's payload columns empty and the corpus stays a small metadata
    # index. Writing needs the read-write S3 role to permit PutObject +
    # GetObject/HeadObject (the write-once existence check) on the store's
    # prefix.
    #
    # Neither fan-out is triggered from here: run-predict and run-evaluate each
    # derive their own backlog on their own schedule, so this window writes
    # queues and counts them and nothing else, and pausing a tournament stage is
    # that stage's workflow to hold.
    env:
      FEDCOURTS_CORPUS_BASE_URL: ${{ vars.CORPUS_BASE_URL }}
    permissions:
      contents: write
      issues: write # the failure run-log issue (non-triggering, ambient)
      id-token: write # assume the AWS role for the corpus S3 remote (read-write)
    steps:
      # No authorization gate here, and none is missing: this workflow carries
      # no trigger an outside actor can reach. A `schedule` fires only from the
      # DEFAULT branch, so it can run only what a maintainer-merged promotion
      # put on `main`; a `workflow_dispatch` is gated by GitHub on repository
      # write; and this job binds `prod`, whose deployment branches are
      # restricted to `main`, so a dispatch from any other ref is refused before
      # a step runs. So the job goes straight to the App-token mint and the
      # credentialed checkout, with no pre-flight checkout to pay for.
      - name: Mint app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.DATA_APP_CLIENT_ID }}
          private-key: ${{ secrets.DATA_APP_PRIVATE_KEY }}
          # Contents only, as the enrich job's mint already is. Every consumer of
          # this token is a contents write — the checkout, the pointer commit,
          # the verdict push; the issue write this job still makes (the failure
          # alarm) must trigger nothing and so rides the ambient GITHUB_TOKEN
          # instead, never the branch-protection-bypass credential.
          permission-contents: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Persist the App token so refreshed snapshots can be pushed back to main;
        # this job uploads no artifacts, so credential leakage is not a concern.
        with: # zizmor: ignore[artipacked]
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Sync the working tree to the current tip of the default branch
        # actions/checkout pins this run's frozen github.sha — the branch tip when
        # the run was CREATED, not when it starts. A run that queues behind another
        # corpus writer on the shared corpus-write lock therefore checks out a
        # stale base, so the corpus blob it pulls and mutates is built on an
        # obsolete pointer and the final commit cannot rebase onto the advanced tip
        # (an unmergeable corpus/corpus.db.ref conflict). Reset to the live tip
        # first, under the lock, so we always mutate the latest committed corpus —
        # the invariant docs/data-pipeline.md's corpus-writer coordination relies
        # on. The repo is public, so this read-only fetch needs no credentials.
        run: |
          set -euo pipefail
          git fetch origin "${GITHUB_REF_NAME}"
          git reset --hard FETCH_HEAD

      - uses: ./.github/actions/setup-python-env

      # Assume the read-write (append-only) IAM role via GitHub OIDC so pull can
      # push fresh forward facts into the corpus on the S3 remote. The role
      # grants get/put/list but no delete, so a run can add corpus objects but
      # never wipe them. No static keys; the role ARN and region come from the
      # `prod` environment.
      - name: Configure AWS credentials (corpus S3 remote, read-write)
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}
          # Bound the assume-role wall clock: unbounded, its 12 retries over a
          # multi-minute connect timeout outlast every job budget here (see the
          # workflow-traps list in docs/pipeline.md). Note the cost this buys —
          # the action does not clear its timer on the error path, so ANY failing
          # assume-role now burns the full 120s and ends on "Action timed out"
          # rather than its own message; the real cause is earlier in the log.
          action-timeout-s: 120

      # The estate's base URL comes from the job env above (out of band, never
      # committed; see SECURITY.md); boto3 picks up the OIDC-assumed
      # credentials from the environment.
      - name: Pull the current corpus from the remote
        run: |
          # Discovery and the rotation governor read prior corpus state (the
          # discovery watermark and per-case last_pulled), so it must be
          # restored. A first run has no committed pointer yet — warn and start
          # a fresh corpus. The pull is checksum-verified against the pointer.
          uv run fedcourts corpus-pull --missing-pointer warn

      - name: Refresh tracked dockets
        env:
          FEDCOURTS_COURTLISTENER_API_TOKEN: ${{ secrets.COURTLISTENER_API_TOKEN }}
          # CourtListener per-token rate limits the client throttles to
          # (config.py courtlistener_rpm/rph/rpd). The repo/environment variables
          # are the knob — set them to the active Free Law Project tier to retune
          # without a code change. The `|| '...'` fallbacks default to the pilot's
          # held tier (Tier 4 = 25/300/1400), so an unset variable lands on the
          # correct ceiling rather than silently throttling to the free tier (an
          # unset Actions variable renders as an empty string, which would also
          # fail int parsing — the fallback avoids that crash). Drop these to the
          # free-tier 5/50/125 if the membership ever lapses.
          FEDCOURTS_COURTLISTENER_RPM: ${{ vars.COURTLISTENER_RPM || '25' }}
          FEDCOURTS_COURTLISTENER_RPH: ${{ vars.COURTLISTENER_RPH || '300' }}
          FEDCOURTS_COURTLISTENER_RPD: ${{ vars.COURTLISTENER_RPD || '1400' }}
        run: |
          # No `--limit`: the per-run cap is `pull.max_cases_per_run` in
          # config/tracking.yaml, the single place the window is sized. A limit
          # here can only *lower* that cap, so a hard-coded value would
          # silently become the binding ceiling the moment the config cap is
          # raised past it.
          uv run fedcourts pull-all \
            --out predict-queue.json \
            --evaluate-out evaluate-queue.json \
            --unrecorded-out unrecorded-queue.json

      - name: Push the corpus blob to the remote
        run: |
          # pull-all wrote fresh facts, discovered filings, and bumped tracking
          # state in corpus/corpus.db. corpus-push uploads the blob to its
          # content-addressed key (add-only remote) and rewrites the pointer —
          # blob before pointer commit, so the committed pointer always
          # resolves against the remote.
          uv run fedcourts corpus-push

      - name: Configure git identity
        uses: ./.github/actions/configure-git-identity
        with:
          token: ${{ steps.app-token.outputs.token }}
          app-slug: ${{ steps.app-token.outputs.app-slug }}

      # Facts go straight to main: the corpus pointer + any detected outcomes. The
      # rebase-and-backoff retry (which outlasts a transient GitHub ref blip and
      # names the real failure cause) lives in the shared composite action so all
      # writer jobs push identically.
      - name: Commit outcomes and corpus pointer to main
        id: commit
        uses: ./.github/actions/commit-corpus-to-main
        with:
          message: "pull: refresh corpus + outcomes"
          label: outcomes + corpus pointer
          append-date: 'true'

      # Trailing, NON-BLOCKING data-validation: the corpus is already pulled here, so
      # produce the correctness verdict (corpus integrity + ledger referential checks)
      # and publish it to the ops-metrics branch for run-ops to present and escalate.
      # continue-on-error keeps a failing verdict (or a publish hiccup) from failing
      # the refresh — the verdict is loud-not-fatal by contract.
      - name: Produce + publish the corpus validation verdict
        continue-on-error: true
        uses: ./.github/actions/publish-corpus-verdict
        with:
          token: ${{ steps.app-token.outputs.token }}

      # Ops analytics: the window's counts in the Actions UI, no roll-up needed.
      # Success OR failure — a window that broke after writing its queues still
      # routed cases and still left unrecorded outcomes, and this summary is the
      # only place either is now recorded. Never on cancellation: a queued window
      # superseded on the shared lock has no reading to report. `count` renders a
      # blank for a file the run never reached, so a window that fell over early
      # still lands its row rather than failing this step on a missing file.
      - name: Roll the window up on the Actions summary
        if: success() || failure()
        env:
          COMMITTED: ${{ steps.commit.outputs.committed }}
        run: |
          set -euo pipefail
          count() {
            local n
            if [ -f "$1" ] && n=$(jq 'length' "$1" 2>/dev/null | head -n 1) && [ -n "$n" ]; then
              echo "$n"
            else
              echo "—"
            fi
          }
          predict=$(count predict-queue.json)
          # Both rows are readings, not handoffs. The predict row counts the
          # cases this window routed into the queue (stamping `predict_queued_at`
          # as it goes); the evaluate row counts the gradings committed state
          # owes, stamping none — a stamp would hold run-evaluate's own
          # derivation off exactly these cases. Each stage's own schedule is what
          # fans them out. Reported here because this window is where the numbers
          # move.
          evaluate=$(count evaluate-queue.json)
          unrecorded=$(count unrecorded-queue.json)
          if [ "${COMMITTED:-false}" = "true" ]; then
            snap="Committed the refreshed corpus pointer + new outcomes to the default branch."
          else
            snap="No outcome or corpus changes this window."
          fi
          {
            echo "## run-pull — $(date -u +%Y-%m-%d)"
            echo "$snap"
            echo ""
            echo "| Channel | Count |"
            echo "|---------|------:|"
            echo "| predict backlog cases queued | ${predict} |"
            echo "| evaluate backlog cases owed | ${evaluate} |"
            echo "| outcomes left unrecorded | ${unrecorded} |"
          } >> "$GITHUB_STEP_SUMMARY"
          # Name each unrecorded case, not just the count: the window records
          # nothing rather than guessing a disposition, so a human has to see
          # which docket was left and why. A corrupt queue file degrades to the
          # count above rather than failing the step.
          triage=$(jq -r '.[] | "- `\(.court)/\(.docket)` — \(.reason)"' \
            unrecorded-queue.json 2>/dev/null) || triage=''
          if [ -n "$triage" ]; then
            {
              echo ""
              echo "Unrecorded outcomes — decided-looking dockets whose outcome could"
              echo "not be recorded deterministically, for maintainer triage:"
              echo ""
              printf '%s\n' "$triage"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # Failure-only alarm: an open `pull-log` issue means exactly "a pull
      # window broke" — nothing is filed on the happy path, and nothing closes
      # this automatically; a human closes it once triaged. Inline (no
      # checkout needed) and on the ambient GITHUB_TOKEN (a non-triggering write
      # stays off the App token — the doctrine in docs/security.md), so it fires
      # for any broken window — including one whose App-token mint itself
      # failed, and one whose checkout or env sync broke: a window lost to
      # infrastructure is a broken window.
      # No suppression, because every trigger this workflow
      # carries is one the platform already authorized, so every failure here is
      # a real one. `cancelled()` is included because the shared lock never
      # cancels an in-flight run (cancel-in-progress is false; a superseded run
      # dies queued, before any step) — so an in-flight cancellation is the job
      # timeout or a human's stop, and both are windows that did not complete.
      - name: Open the failure run-log issue
        if: failure() || cancelled()
        # Three sequential `gh_retry` calls, up to 105s each against a degraded
        # API. This step already runs on a failed window, often one the job
        # timeout cancelled, so its retries get an explicit bound rather than
        # spending whatever grace is left before the runner is taken away.
        timeout-minutes: 6
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WINDOW: ${{ github.event_name == 'schedule' && github.event.schedule || github.event_name }}
          STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          # Inline copy of scripts/gh_retry.sh's gh_retry — this step must fire
          # even when the checkout or the App-token mint failed, so it cannot
          # source the file; the workflow-invariants test pins the copies
          # identical. Contract and rationale live in that script's header.
          gh_retry() {
            local attempt out what
            what="${1:-} ${2:-} ${3:-}"
            for attempt in 1 2 3; do
              if out=$(timeout 30 "$@"); then
                printf '%s\n' "$out"
                return 0
              fi
              if [ "$attempt" -lt 3 ]; then
                echo "::warning::${what} failed (attempt ${attempt}/3) — retrying" >&2
                sleep $((attempt * 5))
              fi
            done
            echo "::error::${what} failed after 3 attempts" >&2
            return 1
          }
          # `pull-log` triggers nothing, as every label in this repository does:
          # no workflow keys on `issues: labeled` at all, so labeling this issue
          # cannot re-fire a window in a loop. Create it idempotently so a fresh
          # repo's first failure does not fail on a missing label.
          gh_retry gh label create pull-log --repo "$REPO" --force \
            --color b60205 --description "A run-pull refresh window failed (open until a human triages)"
          today=$(date -u +%Y-%m-%d)
          # One issue per broken day: a day's repeated failures collapse into
          # one thread, while an older day's still-open issue is its own
          # record and is left alone. The retried listing lands in a variable and
          # jq filters *that*, rather than the call feeding a pipe: an exhausted
          # retry is then the assignment's own failure, which `set -e` above
          # stops on, instead of a pipeline status the shell has to be
          # configured to notice. What it would otherwise reach is the
          # find-or-create below, where an empty `num` reads as "no issue for
          # today" and opens a second thread for the same broken day.
          listing=$(gh_retry gh issue list --repo "$REPO" --label pull-log --state open \
            --limit 100 --json number,title)
          num=$(jq -r --arg d "$today" \
            '[.[] | select(.title | endswith($d))][0].number // empty' <<<"$listing")
          body=$(printf '### ❌ Pull refresh window did not complete\n\n- Run: %s\n- Window: `%s` at %s UTC — status: `%s`\n\nSee the run log for the failing step; the Actions run history carries the window history. Close this issue once triaged — an open `pull-log` issue means exactly "a pull window broke".\n' \
            "$RUN_URL" "$WINDOW" "$(date -u +%H:%M)" "$STATUS")
          if [ -z "$num" ]; then
            url=$(gh_retry gh issue create --repo "$REPO" \
              --title "pull: window failure — ${today}" \
              --label pull-log --body "$body")
            echo "Opened pull-log failure issue: ${url}"
          else
            gh_retry gh issue comment "$num" --repo "$REPO" --body "$body"
            echo "Reusing today's open pull-log issue #${num}"
          fi

  live:
    # The SCOTUS live channel (docs/live-sources.md): `fedcourts live-poll`
    # probes supremecourt.gov docket JSON for newly docketed petitions and
    # re-polls the pending watchlist — no CourtListener token, no API budget.
    # Same corpus-writer shape, privileges (App token + the read-write corpus
    # role) and trigger surface as `pull` — schedule and dispatch, both already
    # gated by the platform, so this job needs no authorization step either.
    if: >-
      (github.event_name == 'schedule' && startsWith(github.event.schedule, '47 ')) ||
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'live')
    runs-on: ubuntu-latest
    # The cycle re-polls the pending watchlist and onboards the frontier at ~1
    # req/s, plus document fetches on distribution transitions (which cluster at
    # the September long conference) and the S3 transfer. `live-poll` self-bounds
    # to a soft wall-clock budget (`--max-run-seconds` below), committing progress
    # so far and resuming next cycle, so a big watchlist can never overrun this
    # hard cap — which stays above the soft budget with margin for the fixed
    # setup (checkout + corpus-pull) before the poll and the push after it.
    timeout-minutes: 35
    environment: prod
    # This environment's corpus estate as one base URL (see the pull job): both
    # halves derive from it, and the store's address is the corpus-split mode.
    env:
      FEDCOURTS_CORPUS_BASE_URL: ${{ vars.CORPUS_BASE_URL }}
    # The ambient GITHUB_TOKEN carries exactly the non-triggering issue write
    # (the failure run-log issue — the doctrine in docs/security.md: issue
    # writes that must trigger nothing stay off the App token). Checkout and the
    # corpus push run on the App token, and there is no authorize-trigger step
    # to need a read.
    permissions:
      contents: read
      issues: write # the failure run-log issue (non-triggering, ambient)
      id-token: write # assume the AWS role for the corpus S3 remote (read-write)
    steps:
      - name: Mint app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.DATA_APP_CLIENT_ID }}
          private-key: ${{ secrets.DATA_APP_PRIVATE_KEY }}
          # Contents only, as the enrich job's mint already is. Every consumer of
          # this token is a contents write — the checkout, the pointer commit,
          # the verdict push; the issue write this job still makes (the failure
          # alarm) must trigger nothing and so rides the ambient GITHUB_TOKEN
          # instead, never the branch-protection-bypass credential.
          permission-contents: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Persist the App token so outcomes + the corpus pointer can be pushed
        # back to main; this job uploads no artifacts, so credential leakage is
        # not a concern.
        with: # zizmor: ignore[artipacked]
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Sync the working tree to the current tip of the default branch
        # actions/checkout pins this run's frozen github.sha — the branch tip when
        # the run was CREATED, not when it starts. A run that queues behind another
        # corpus writer on the shared corpus-write lock therefore checks out a
        # stale base, so the corpus blob it pulls and mutates is built on an
        # obsolete pointer and the final commit cannot rebase onto the advanced tip
        # (an unmergeable corpus/corpus.db.ref conflict). Reset to the live tip
        # first, under the lock, so we always mutate the latest committed corpus —
        # the invariant docs/data-pipeline.md's corpus-writer coordination relies
        # on. The repo is public, so this read-only fetch needs no credentials.
        run: |
          set -euo pipefail
          git fetch origin "${GITHUB_REF_NAME}"
          git reset --hard FETCH_HEAD

      - uses: ./.github/actions/setup-python-env

      # Same read-write (append-only) role as `pull`: the live poller adds
      # snapshots and rows to the corpus blob but can never wipe remote objects.
      - name: Configure AWS credentials (corpus S3 remote, read-write)
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}
          # Bound the assume-role wall clock: unbounded, its 12 retries over a
          # multi-minute connect timeout outlast every job budget here (see the
          # workflow-traps list in docs/pipeline.md). Note the cost this buys —
          # the action does not clear its timer on the error path, so ANY failing
          # assume-role now burns the full 120s and ends on "Action timed out"
          # rather than its own message; the real cause is earlier in the log.
          action-timeout-s: 120

      - name: Pull the current corpus from the remote
        run: |
          # The live rotation and the per-Term discovery cursors read prior
          # corpus state, so it must be restored; a first run has no committed
          # pointer yet — warn and start fresh. Checksum-verified.
          uv run fedcourts corpus-pull --missing-pointer warn

      - name: Poll the live channel
        # No token, no budget env: politeness (browser UA, ~1 req/s) is built
        # into the client; caps come from tracking.yaml's `live:` section.
        # --max-run-seconds is the soft wall-clock budget: the cycle stops
        # cleanly and commits progress so far when reached, so even a peak
        # watchlist stays under the job's 35 min timeout-minutes with room for
        # the fixed setup and the push (1500s = 25 min; the next cycle resumes
        # the rotation where it left off).
        run: |
          uv run fedcourts live-poll \
            --max-run-seconds 1500 \
            --out predict-queue.json \
            --evaluate-out evaluate-queue.json \
            --unrecorded-out unrecorded-queue.json

      - name: Push the corpus blob to the remote
        run: |
          # live-poll wrote fresh snapshots, rows, and cursors into
          # corpus/corpus.db. Blob before pointer commit (content-addressed,
          # add-only), so the committed pointer always resolves against the
          # remote.
          uv run fedcourts corpus-push

      - name: Configure git identity
        uses: ./.github/actions/configure-git-identity
        with:
          token: ${{ steps.app-token.outputs.token }}
          app-slug: ${{ steps.app-token.outputs.app-slug }}

      # Same shared commit-and-push as `pull` (the retry lives in the action).
      - name: Commit outcomes and corpus pointer to main
        id: commit
        uses: ./.github/actions/commit-corpus-to-main
        with:
          message: "live: refresh corpus + outcomes"
          label: outcomes + corpus pointer
          append-date: 'true'

      # Unrecorded outcomes are surfaced on the step summary below, exactly
      # as in `pull`: live resolution is machine-readable by construction (the
      # disposition orders ride in the proceedings text), so a non-empty
      # unrecorded queue signals a case shape worth manual triage.

      # Success or failure, never on cancellation — see the pull job's copy for
      # the gating and the blank-on-absence rationale.
      - name: Roll the window up on the Actions summary
        if: success() || failure()
        env:
          COMMITTED: ${{ steps.commit.outputs.committed }}
        run: |
          set -euo pipefail
          count() {
            local n
            if [ -f "$1" ] && n=$(jq 'length' "$1" 2>/dev/null | head -n 1) && [ -n "$n" ]; then
              echo "$n"
            else
              echo "—"
            fi
          }
          predict=$(count predict-queue.json)
          # Readings, not handoffs — see the pull job's copy.
          evaluate=$(count evaluate-queue.json)
          unrecorded=$(count unrecorded-queue.json)
          if [ "${COMMITTED:-false}" = "true" ]; then
            snap="Committed the refreshed corpus pointer + new outcomes to the default branch."
          else
            snap="No outcome or corpus changes this window."
          fi
          {
            echo "## run-pull (live) — $(date -u +%Y-%m-%d)"
            echo "$snap"
            echo ""
            echo "| Channel | Count |"
            echo "|---------|------:|"
            echo "| predict backlog cases queued | ${predict} |"
            echo "| evaluate backlog cases owed | ${evaluate} |"
            echo "| outcomes left unrecorded | ${unrecorded} |"
          } >> "$GITHUB_STEP_SUMMARY"
          # Per-case triage list — see the pull job's copy for the rationale.
          triage=$(jq -r '.[] | "- `\(.court)/\(.docket)` — \(.reason)"' \
            unrecorded-queue.json 2>/dev/null) || triage=''
          if [ -n "$triage" ]; then
            {
              echo ""
              echo "Unrecorded outcomes — decided-looking dockets whose outcome could"
              echo "not be recorded deterministically, for maintainer triage:"
              echo ""
              printf '%s\n' "$triage"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # Failure-only alarm, mirroring `pull` (see that job's step for the
      # `cancelled()` and ambient-token rationale; there is no authorize step
      # here to gate on): an open `live-log` issue means exactly "a live
      # window broke"; a human closes it once triaged.
      - name: Open the failure run-log issue
        if: failure() || cancelled()
        timeout-minutes: 6 # the retry bound; see `pull`'s copy of this step
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WINDOW: ${{ github.event_name == 'schedule' && github.event.schedule || github.event_name }}
          STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          # Inline copy of scripts/gh_retry.sh's gh_retry — this step must fire
          # even when the checkout or the App-token mint failed, so it cannot
          # source the file; the workflow-invariants test pins the copies
          # identical. Contract and rationale live in that script's header.
          gh_retry() {
            local attempt out what
            what="${1:-} ${2:-} ${3:-}"
            for attempt in 1 2 3; do
              if out=$(timeout 30 "$@"); then
                printf '%s\n' "$out"
                return 0
              fi
              if [ "$attempt" -lt 3 ]; then
                echo "::warning::${what} failed (attempt ${attempt}/3) — retrying" >&2
                sleep $((attempt * 5))
              fi
            done
            echo "::error::${what} failed after 3 attempts" >&2
            return 1
          }
          # `live-log` mirrors `pull-log`: a NON-triggering label, created
          # idempotently, filed only when a window fails.
          gh_retry gh label create live-log --repo "$REPO" --force \
            --color b60205 --description "A run-pull live-channel window failed (open until a human triages)"
          today=$(date -u +%Y-%m-%d)
          # One issue per broken day: a day's repeated failures collapse into
          # one thread; an older day's still-open issue is left alone. Listing
          # captured before filtering for the same reason as `pull` — see that
          # step.
          listing=$(gh_retry gh issue list --repo "$REPO" --label live-log --state open \
            --limit 100 --json number,title)
          num=$(jq -r --arg d "$today" \
            '[.[] | select(.title | endswith($d))][0].number // empty' <<<"$listing")
          body=$(printf '### ❌ Live poll window did not complete\n\n- Run: %s\n- Window: `%s` at %s UTC — status: `%s`\n\nSee the run log for the failing step; the Actions run history carries the window history. Close this issue once triaged — an open `live-log` issue means exactly "a live window broke".\n' \
            "$RUN_URL" "$WINDOW" "$(date -u +%H:%M)" "$STATUS")
          if [ -z "$num" ]; then
            url=$(gh_retry gh issue create --repo "$REPO" \
              --title "live: window failure — ${today}" \
              --label live-log --body "$body")
            echo "Opened live-log failure issue: ${url}"
          else
            gh_retry gh issue comment "$num" --repo "$REPO" --body "$body"
            echo "Reusing today's open live-log issue #${num}"
          fi

  enrich:
    # Dispatch-only writer: walk granted SCOTUS rows to their published opinion
    # cluster and land the reporter citations and the opinion body
    # (`fedcourts enrich-opinions`; scope and budget arithmetic in
    # docs/data-pipeline.md). Never scheduled — see the mode note in the header.
    #
    # A *queued* enrich run can be silently evicted: GitHub keeps only the
    # latest pending run per concurrency group, so a scheduled pull/live
    # window entering `corpus-write` behind this dispatch cancels it — and a
    # one-shot dispatch, unlike a rotation, does not "pick up where it left
    # off"; nothing alarms. Dispatching in a dead zone between the pull
    # windows avoids ever queuing.
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'enrich-opinions'
    runs-on: ubuntu-latest
    # <= max_cases dockets at ~3 CourtListener fetches each plus the corpus S3
    # round-trip finishes well inside this; the cap frees the shared
    # corpus-write lock if a network step hangs.
    timeout-minutes: 30
    environment: prod
    # This environment's corpus estate as one base URL (see the pull job): both
    # halves derive from it, and the store's address is the corpus-split mode.
    env:
      FEDCOURTS_CORPUS_BASE_URL: ${{ vars.CORPUS_BASE_URL }}
    permissions:
      # The pointer commit rides the App token persisted at checkout, so the
      # ambient GITHUB_TOKEN needs no write at all.
      contents: read
      id-token: write # assume the AWS role for the corpus S3 remote (read-write)
    steps:
      # Fail a malformed input before the token mint, the checkout, and the
      # corpus pull spend two minutes holding the shared corpus-write lock.
      - name: Validate the max_cases input
        env:
          MAX_CASES: ${{ inputs.max_cases }}
        run: |
          set -euo pipefail
          if ! [[ "$MAX_CASES" =~ ^[0-9]+$ ]]; then
            echo "::error::max_cases must be a non-negative integer, got '${MAX_CASES}'" >&2
            exit 1
          fi

      - name: Mint app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.DATA_APP_CLIENT_ID }}
          private-key: ${{ secrets.DATA_APP_PRIVATE_KEY }}
          permission-contents: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Persist the App token so the pointer commit can be pushed back to
        # main; this job uploads no artifacts, so credential leakage is not a
        # concern.
        with: # zizmor: ignore[artipacked]
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Sync the working tree to the current tip of the default branch
        # Same stale-base hazard as the pull job: a run queued behind another
        # corpus writer on the shared lock checked out a frozen sha, so reset
        # to the live tip before pulling the corpus (the invariant the
        # corpus-writer coordination in docs/data-pipeline.md relies on). The
        # repo is public, so this read-only fetch needs no credentials.
        run: |
          set -euo pipefail
          git fetch origin "${GITHUB_REF_NAME}"
          git reset --hard FETCH_HEAD

      - uses: ./.github/actions/setup-python-env

      - name: Configure AWS credentials (corpus S3 remote, read-write)
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}
          # Bounded for the same reason as the pull job (see the note there).
          action-timeout-s: 120

      - name: Pull the current corpus from the remote
        run: |
          # No committed pointer means no corpus and nothing to enrich, so the
          # default missing-pointer failure is the right outcome: a dispatch
          # against an empty corpus is an operator mistake to surface, not a
          # first run to tolerate.
          uv run fedcourts corpus-pull

      - name: Enrich granted dockets with opinion clusters
        env:
          FEDCOURTS_COURTLISTENER_API_TOKEN: ${{ secrets.COURTLISTENER_API_TOKEN }}
          # Same tier knobs and fallbacks as the pull job's refresh step (see
          # the note there for why the fallbacks are the held tier).
          FEDCOURTS_COURTLISTENER_RPM: ${{ vars.COURTLISTENER_RPM || '25' }}
          FEDCOURTS_COURTLISTENER_RPH: ${{ vars.COURTLISTENER_RPH || '300' }}
          FEDCOURTS_COURTLISTENER_RPD: ${{ vars.COURTLISTENER_RPD || '1400' }}
          MAX_CASES: ${{ inputs.max_cases }}
        run: |
          set -euo pipefail
          # The pass prints its per-case ledger (enriched / refused / spent);
          # land it on the summary as a fenced block so the plain-text lines
          # survive markdown and the operator reads the run without opening
          # the log. tee keeps it in the log too, and pipefail keeps a failing
          # pass failing the step.
          uv run fedcourts enrich-opinions --apply --max-cases "$MAX_CASES" \
            | tee enrich-ledger.txt
          {
            echo "## enrich-opinions — $(date -u +%Y-%m-%d)"
            echo '```'
            cat enrich-ledger.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Push the corpus blob to the remote
        run: |
          # Blob before pointer commit, so the committed pointer always
          # resolves against the remote.
          uv run fedcourts corpus-push

      - name: Configure git identity
        uses: ./.github/actions/configure-git-identity
        with:
          token: ${{ steps.app-token.outputs.token }}
          app-slug: ${{ steps.app-token.outputs.app-slug }}

      - name: Commit the corpus pointer to main
        uses: ./.github/actions/commit-corpus-to-main
        with:
          message: "enrich: opinion clusters (citations + bodies)"
          label: corpus pointer
          append-date: 'true'
