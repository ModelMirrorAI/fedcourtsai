name: run-repair

# The maintainer's repair bench: the dispatch-gated corpus and ledger
# maintenance passes, one per dispatch, dry-run first, never scheduled.
#
# Why these do not live beside the walk in run-seed: the two are different
# trigger classes with different failure postures. run-seed is production —
# four scheduled windows a day whose sweeps are non-blocking by contract,
# because a hiccup must converge next window rather than redden a walk nobody
# is watching. A repair pass is the opposite: it runs because a maintainer read
# a dry-run ledger and decided, it fails by REFUSING (an apply without its
# bound, a malformed cell id, a stamp the command declines), and a refusal is
# the answer the dispatch was for. Absorbing one would report work that never
# happened. Keeping them apart also keeps the passes' growth off the production
# workflow: every pass added here costs run-seed nothing — not a dispatch
# input, not a `LOOP_BUDGET_SECONDS` conjunct, not a step the walk must budget
# a tail for.
#
# One pass per dispatch is structural, not a convention: `repair` is a single
# choice, so no two passes can arm each other. That matches the documented
# procedure — `dry-run`, read the ledger the run summary carries, then `apply`
# with the count read off it. It also settles the sizing question a shared job
# would raise: two thirty-minute passes beside a walk do not fit one job cap.
#
# It is a corpus writer like run-pull's and run-seed's jobs, so its writer jobs
# join the repo-level `corpus-write` concurrency group: the corpus is a single
# blob (pull -> mutate -> push -> commit corpus/corpus.db.ref to main), so only
# one writer runs at a time regardless of workflow. The selector validation
# deliberately sits OUTSIDE that group, in its own credential-free job, so a
# malformed dispatch is refused in seconds rather than queuing behind a walk to
# be told about a typo.
#
# A *queued* repair run can be silently evicted, the hazard run-pull's enrich
# job documents: GitHub keeps only the latest pending run per concurrency
# group, so a scheduled window entering `corpus-write` behind this dispatch
# cancels it — and a one-shot dispatch, unlike a rotation, does not pick up
# where it left off. Dispatch in a dead zone between the scheduled windows
# (run-pull at `:17` and `:47`, run-seed at `:31`) to avoid ever queuing.
#
# No guard job, unlike run-seed: that one exists because a scheduled walk fails
# unwatched and commits to main with no PR gate, so a cancellation has to raise
# its own escalation. Every run here was started by hand a moment earlier by
# the one person who wants to read its ledger.
#
# The full pass inventory, with each pass's inputs, refusals and procedure, is
# in docs/data-pipeline.md, *Maintenance passes*.
on:
  workflow_dispatch:
    inputs:
      repair:
        description: "Which maintenance pass to run — one per dispatch; see docs/data-pipeline.md, Maintenance passes."
        required: false
        default: none
        type: choice
        options:
          - none
          - unlatch-overselected
          - qp-backfill
          - rederive-distribution-parse
          - normalize-docket-markings
          - response-backfill
          - ocr-recovery
          - document-backfill
          - mirror-stored-documents
          - arrival-backfill
          - merits-phantom-removal
          - disposition-convergence
          - moment-convergence
          - sampled-frame-weight-repair
          - amicus-rederive
          - regrade-stale
          - opinion-votes
          - order-votes
          - application-backfill
          - decision-record
          - opinion-record
      repair_mode:
        description: "dry-run prints the pass's ledger and writes nothing for the pass itself; apply writes and pushes; prerequisites apply either way — see docs/data-pipeline.md, Maintenance passes."
        required: false
        default: dry-run
        type: choice
        options:
          - dry-run
          - apply
      repair_bound:
        description: "Blast-radius bound: the positive integer read off the dry-run ledger, required on apply where the pass takes one — see docs/data-pipeline.md, Maintenance passes."
        required: false
        default: ""
        type: string
      repair_target:
        description: "The pass's named subject — a distribution parse label, the cell list to re-grade, or the Term to back-fill — see docs/data-pipeline.md, Maintenance passes."
        required: false
        default: ""
        type: string
      repair_options:
        description: "Space- or comma-separated switches from the selected pass's closed vocabulary — see docs/data-pipeline.md, Maintenance passes."
        required: false
        default: ""
        type: string

permissions: {}

jobs:
  # The selector gate. It holds no credential, takes no lock, checks out
  # nothing, and reaches no network: it reads the five dispatch inputs out of
  # the environment and refuses anything the selected pass cannot legally run.
  # Every writer job below `needs:` it, so a malformed dispatch is refused
  # before an App token is minted, before a role is assumed, and before the
  # corpus-write lock is taken.
  #
  # Every refusal here that a step can reach is ALSO enforced in the step that
  # acts on the input — those are the checks of record, because a step has to be
  # safe on whatever reaches it, and this job is a fail-fast duplicate rather
  # than a substitute. The containment is one-directional by design: the
  # refusals with no late twin (`none`, an unknown pass, a bound or target
  # offered to a pass that reads neither) are hygiene about the dispatch form,
  # and a step that never reads a field is already safe when it is set.
  # The two copies are kept word-for-word identical (the same grammar, the same
  # splitting, the same all-or-nothing refusal, the same `::error::` text), so
  # one mistake can never produce two differently worded refusals depending on
  # where it was caught. A test pins the pairing.
  validate:
    runs-on: ubuntu-latest
    # Seconds of bash over five environment variables.
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Validate the repair selector
        # The inputs are maintainer-typed free text entering a shell, so they
        # are handled as data here exactly as they are downstream: expanded
        # from the environment, never interpolated into this script.
        env:
          REPAIR: ${{ inputs.repair }}
          REPAIR_MODE: ${{ inputs.repair_mode }}
          REPAIR_BOUND: ${{ inputs.repair_bound }}
          REPAIR_TARGET: ${{ inputs.repair_target }}
          REPAIR_OPTIONS: ${{ inputs.repair_options }}
        run: |
          set -euo pipefail
          # A dispatch that names no pass asked for nothing. Refusing it is
          # what makes `none` a safe default on the choice: the form's initial
          # state cannot start a corpus write, and a mis-click costs a red run
          # in seconds rather than a pass nobody chose.
          if [ "${REPAIR}" = "none" ]; then
            echo "::error::repair names no pass — pick one from the list. A dispatch left on the default asked for nothing."
            exit 1
          fi
          # What each pass accepts. `bound`/`target` name the field the pass
          # reads and when it is required; `options` is its closed vocabulary.
          # A field the pass does not take is refused rather than ignored: a
          # number left over from the previous dispatch is exactly how a bound
          # meant for one pass silently reaches another.
          bound_flag=""
          bound_required_on_apply=0
          bound_read_on_dry_run=0
          target_kind=""
          accepted_options=""
          case "${REPAIR}" in
            unlatch-overselected) ;;
            qp-backfill) ;;
            rederive-distribution-parse)
              target_kind="parse" ;;
            normalize-docket-markings)
              bound_flag="--max-rewrites"; bound_required_on_apply=1 ;;
            response-backfill)
              bound_flag="--max-fills"; bound_required_on_apply=1 ;;
            ocr-recovery)
              bound_flag="--max-cases"; bound_required_on_apply=1 ;;
            document-backfill)
              bound_flag="--max-cases"; bound_required_on_apply=1
              bound_read_on_dry_run=1 ;;
            mirror-stored-documents)
              bound_flag="--max-cases"; bound_required_on_apply=1 ;;
            arrival-backfill)
              bound_flag="--max-fills"; bound_required_on_apply=1 ;;
            merits-phantom-removal)
              bound_flag="--max-removals"; bound_required_on_apply=1
              accepted_options="include-failed-attempts" ;;
            disposition-convergence)
              bound_flag="--max-relabels"; bound_required_on_apply=1
              accepted_options="include-scored" ;;
            moment-convergence)
              bound_flag="--max-rewrites"; bound_required_on_apply=1 ;;
            sampled-frame-weight-repair)
              bound_flag="--max-repairs"; bound_required_on_apply=1 ;;
            amicus-rederive)
              bound_flag="--max-changes"; bound_required_on_apply=1 ;;
            regrade-stale)
              target_kind="cells" ;;
            opinion-votes|order-votes)
              bound_flag="--max-stamps"; bound_required_on_apply=1
              accepted_options="replace-differing" ;;
            application-backfill)
              bound_flag="--max-rows"; bound_required_on_apply=1
              target_kind="term" ;;
            decision-record)
              bound_flag="--max-fills"; bound_required_on_apply=1 ;;
            opinion-record)
              bound_flag="--max-rows"; bound_required_on_apply=1 ;;
            *)
              echo "::error::unknown repair pass '${REPAIR}' — the selector and this validation have drifted apart; correct the workflow."
              exit 1 ;;
          esac
          # Parse the option list against the selected pass's closed
          # vocabulary, all-or-nothing: every unknown token is named, then the
          # whole list is refused. A silently ignored switch is the failure
          # this exists to prevent — the maintainer would read a ledger for one
          # population and apply against another.
          include_scored=0
          include_failed_attempts=0
          option_malformed=0
          # `printf '%s\n'`, not '%s': `read` returns non-zero on a final line
          # with no terminator, so an unterminated last token would be dropped
          # by the loop — silently, and past the all-or-nothing check below.
          while IFS= read -r option; do
            [ -n "$option" ] || continue
            case " ${accepted_options} " in
              *" ${option} "*) ;;
              *)
                echo "::error::repair=${REPAIR} does not accept the option '${option}' — it accepts: ${accepted_options:-none}."
                option_malformed=1
                continue ;;
            esac
            case "$option" in
              include-scored) include_scored=1 ;;
              include-failed-attempts) include_failed_attempts=1 ;;
            esac
          done < <(printf '%s\n' "${REPAIR_OPTIONS}" | tr -s ', \t\r' '\n')
          if [ "$option_malformed" -ne 0 ]; then
            echo "::error::refusing the whole option list — correct the switches above and re-dispatch."
            exit 1
          fi
          # A bound offered to a pass that takes none is refused, not dropped.
          if [ -z "${bound_flag}" ] && [ -n "${REPAIR_BOUND}" ]; then
            echo "::error::repair=${REPAIR} takes no repair_bound — its blast radius is fixed in code, or it has none. Clear the field and re-dispatch."
            exit 1
          fi
          # Same for a target: only the three passes that name a subject read it.
          if [ -z "${target_kind}" ] && [ -n "${REPAIR_TARGET}" ]; then
            echo "::error::repair=${REPAIR} takes no repair_target — only the distribution re-derivation (a parse label), the re-grade (a cell list) and the application back-fill (a Term) name a subject. Clear the field and re-dispatch."
            exit 1
          fi
          if [ "$bound_required_on_apply" -eq 1 ] && [ "${REPAIR_MODE}" = "apply" ] \
            && ! [[ "${REPAIR_BOUND}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::repair=${REPAIR} with repair_mode=apply needs repair_bound set to a positive integer — the count read off a previous dry-run dispatch's ledger. Re-dispatch with that number."
            exit 1
          fi
          # The one pass whose DRY RUN also consumes the bound, because its dry
          # run fetches a docket per candidate and the number is load-bearing in
          # both modes. A field a pass reads must satisfy the grammar wherever it
          # is set, not only on an apply: the CLI's own parse takes a negative
          # integer, and a slice of `candidates[:-5]` means "every candidate but
          # the last five" — a near-unbounded fetch campaign wearing a bound.
          # Refused here so a typo dies before an App token is minted and before
          # the dedupe prerequisite writes anything.
          if [ "$bound_read_on_dry_run" -eq 1 ] && [ -n "${REPAIR_BOUND}" ] \
            && ! [[ "${REPAIR_BOUND}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::repair=${REPAIR} reads repair_bound in BOTH modes, so it must be a positive integer wherever it is set — a bound its dry run would also spend. Clear the field or correct the number."
            exit 1
          fi
          # `include-scored` widens the disposition sweep onto events already
          # carrying predict/evaluate output and owes a re-grade for each
          # relabel, so it must carry the bound in EVERY mode — not the
          # apply-only rule above. A dry run that widens the ledger is where
          # the decision to take on that backlog is actually made, so the
          # number is stated there too; what the apply is checked against is
          # the widened dry-run's own relabel count, not the plain run's
          # held-back lines, which bound the population rather than count the
          # rewrites.
          if [ "$include_scored" -eq 1 ] \
            && ! [[ "${REPAIR_BOUND}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::the include-scored option needs repair_bound set to a positive integer — relabelling a graded cell takes on a re-grade backlog, so its size is stated up front in dry-run as much as in apply. Read the held-back lines off a plain dry-run dispatch's ledger."
            exit 1
          fi
          # `include-failed-attempts` deliberately does NOT inherit that
          # every-mode rule: that number states a decision to take on a
          # re-grade backlog, and this widening takes on none — what it grows
          # is the removal set, which the apply's own bound already sizes.
          if [ "$include_failed_attempts" -eq 1 ]; then
            echo "include-failed-attempts: the removal will include phantoms whose only committed output is attempt.json cell-failure records."
          fi
          # The parse label is required in BOTH running modes, not just apply:
          # the dry run's whole product is a plan attributable to one reading,
          # so a re-derivation with no reading named is not a cheaper dry run,
          # it is an unanswerable one. Whether the label is *registered* is the
          # command's refusal, not this one's — the registry lives in Python.
          if [ "${target_kind}" = "parse" ] \
            && ! [[ "${REPAIR_TARGET}" =~ ^[a-z][a-z0-9-]*$ ]]; then
            echo "::error::repair=rederive-distribution-parse needs repair_target set to a distribution parse label — lowercase, e.g. dist-v2. A re-derivation names its reading rather than inheriting the ingest default, so there is no default to fall back on. Re-dispatch with the label."
            exit 1
          fi
          # The back-fill's Term, required in both modes for the parse label's
          # reason: the ledger is a reading of one named Term, and the bound an
          # apply carries was read off that Term's ledger.
          if [ "${target_kind}" = "term" ] \
            && ! [[ "${REPAIR_TARGET}" =~ ^[0-9]{2}$ ]]; then
            echo "::error::repair=${REPAIR} needs repair_target set to a two-digit October Term, e.g. 24 — the back-fill reads one named Term per dispatch, so its ledger and the bound an apply carries answer for the same Term. Re-dispatch with the Term."
            exit 1
          fi
          if [ "${target_kind}" = "cells" ]; then
            # The grammar excludes `.` deliberately — with no dots no field can
            # be a `..` path segment, whatever the command does with it.
            pattern='^[a-z0-9-]+/[0-9]+/evt-[a-z0-9-]+/[0-9]{8}T[0-9]{6}Z/[a-z0-9-]+$'
            malformed=0
            cells=()
            # `printf '%s\n'`, not '%s': `read` returns non-zero on a final line
            # with no terminator, so an unterminated last cell would be dropped
            # by the loop — silently, and past the all-or-nothing check below.
            # The blank line this adds is absorbed by the emptiness guard.
            while IFS= read -r line; do
              [ -n "$line" ] || continue
              if [[ "$line" =~ $pattern ]]; then
                cells+=("$line")
              else
                echo "::error::malformed regrade cell (want court/docket/event/run_id/actor, e.g. scotus/1119228/evt-petition-certiorari/20260624T103000Z/claude-judge): ${line}"
                malformed=1
              fi
            done < <(printf '%s\n' "${REPAIR_TARGET}" | tr -s ' \t\r' '\n')
            if [ "$malformed" -ne 0 ]; then
              echo "::error::refusing the whole list — correct the lines above and re-dispatch."
              exit 1
            fi
            if [ "${#cells[@]}" -eq 0 ]; then
              echo "::error::repair=regrade-stale names no cells — set repair_target."
              exit 1
            fi
          fi
          # No separate "target is required" refusal: each target grammar above
          # already rejects the empty string — the parse label against its
          # regex, the Term against its two-digit grammar, the cell list
          # against the emptiness guard — so a missing
          # target is refused in the words of the pass that wanted it rather
          # than a generic second message that could never be reached.
          echo "repair=${REPAIR} mode=${REPAIR_MODE} accepted; the step of record re-checks every refusal above."

  # The corpus passes: every pass that pulls the blob, mutates it and pushes.
  # Structured like run-seed's writer job without the walk — same App token,
  # same read-write role, same `prod` environment, same pointer-commit shape.
  repair:
    needs: [validate]
    # Named as an allow-list, never as "everything but the re-grade": this job
    # is where the corpus role, `id-token: write` and the App token live, so a
    # pass reaches them only by being named here. A deny-list would hand every
    # future selector value the full writer credential set by default, which is
    # the wrong direction for a list that is expected to grow.
    if: ${{ contains(fromJSON('["unlatch-overselected","qp-backfill","rederive-distribution-parse","normalize-docket-markings","response-backfill","ocr-recovery","document-backfill","mirror-stored-documents","arrival-backfill","merits-phantom-removal","disposition-convergence","moment-convergence","sampled-frame-weight-repair","amicus-rederive"]'), inputs.repair) }}
    # Join the repo-wide corpus-writer lock: one writer at a time across
    # run-pull, run-seed and this bench. cancel-in-progress:false so a
    # dispatch queues behind a running window rather than cancelling it.
    #
    # A job the `if:` will skip is given a unique throwaway group instead, the
    # idiom run-pull uses at workflow level: the group is assigned without
    # waiting on the `if:`, so a shared name would let the skipped sibling take
    # the group's single pending slot and evict an in-flight writer — or this
    # run's own real pass — before ever being skipped. The condition is the
    # `if:` above, repeated because no context available here can hold it once.
    concurrency:
      group: ${{ contains(fromJSON('["unlatch-overselected","qp-backfill","rederive-distribution-parse","normalize-docket-markings","response-backfill","ocr-recovery","document-backfill","mirror-stored-documents","arrival-backfill","merits-phantom-removal","disposition-convergence","moment-convergence","sampled-frame-weight-repair","amicus-rederive"]'), inputs.repair) && 'corpus-write' || format('corpus-write-skip-{0}', github.run_id) }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    # Headroom over the longest chain of capped steps a dispatch can run, which
    # is the OCR recovery's: the dedupe prerequisite (10m), its own binary
    # install (5m), the fresh credential pair (the assume-role's own 120s
    # bound) and the pass (45m), leaving the setup, the corpus pull and the
    # trailing verdict inside the remainder. A hit here cancels the run,
    # which no failure handling absorbs. Every pass but the OCR one still runs
    # entirely inside the opening credentials' 1h lives; the OCR pass alone
    # sits too deep in the chain for that, so a fresh App token and AWS session
    # are minted right before it and the arithmetic here answers to this cap
    # only — the OCR slice deadline is derived from that 45-minute step cap,
    # so it moves with it.
    timeout-minutes: 72
    environment: prod
    # This environment's corpus estate as one base URL (see run-pull): the
    # index remote and the per-case content store are fixed segments beneath
    # it, and the store's address is the corpus-split mode. Job-wide, because
    # every pass below reads or writes the corpus — and the passes that read
    # stored snapshots or documents out of the content store (the
    # questions-presented backfill, the distribution re-derivation, the
    # response-signal backfill and the OCR recovery) answer empty without it.
    env:
      FEDCOURTS_CORPUS_BASE_URL: ${{ vars.CORPUS_BASE_URL }}
    # The ambient GITHUB_TOKEN reads only: the checkout uses it, which is what
    # `contents: read` is for. Every WRITE — the corpus push and every gh call —
    # runs on the App token instead, so the ambient one carries no write at all.
    permissions:
      contents: read
      id-token: write # assume the AWS role for the corpus S3 remote (read-write)
    steps:
      # One token up front: on every pass but the OCR recovery the whole run
      # stays inside its 1h life. The OCR pass and anything after it can end
      # past that hour, so a fresh token is minted just before that step and
      # the trailing verdict rides whichever mint is newest. Scoped to
      # contents:write only (the corpus pushes) — progress goes to the Actions
      # step summary, not an issue, so no issues:write is needed.
      - name: Mint app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.DATA_APP_CLIENT_ID }}
          private-key: ${{ secrets.DATA_APP_PRIVATE_KEY }}
          permission-contents: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Sync the working tree to the current tip of the default branch
        # actions/checkout pins this run's frozen github.sha — the branch tip when
        # the run was CREATED, not when it starts. A run that queues behind another
        # corpus writer on the shared corpus-write lock therefore checks out a
        # stale base, so the corpus blob it pulls and mutates is built on an
        # obsolete pointer and the final commit cannot rebase onto the advanced
        # tip (an unmergeable corpus/corpus.db.ref conflict). Reset to the live tip
        # first, under the lock, so we always mutate the latest committed corpus.
        # The repo is public, so this read-only fetch needs no credentials.
        run: |
          set -euo pipefail
          git fetch origin "${GITHUB_REF_NAME}"
          git reset --hard FETCH_HEAD

      - uses: ./.github/actions/setup-python-env

      - name: Configure git identity
        uses: ./.github/actions/configure-git-identity
        with:
          token: ${{ steps.app-token.outputs.token }}
          app-slug: ${{ steps.app-token.outputs.app-slug }}

      # Same read-write (append-only) role as run-pull's and run-seed's
      # writers: a pass adds and rewrites rows in the corpus blob but can never
      # wipe remote objects. The 1h session outlasts the whole run on every
      # pass but the OCR recovery, which re-assumes the role just before its
      # own step runs.
      - name: Configure AWS credentials (corpus S3 remote, read-write)
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}
          role-duration-seconds: 3600 # 1h
          # Bound the assume-role wall clock: unbounded, its 12 retries over a
          # multi-minute connect timeout outlast every job budget here (see the
          # workflow-traps list in docs/pipeline.md). Note the cost this buys —
          # the action does not clear its timer on the error path, so ANY failing
          # assume-role now burns the full 120s and ends on "Action timed out"
          # rather than its own message; the real cause is earlier in the log.
          action-timeout-s: 120

      - name: Pull the current corpus from the remote
        # Named so the trailing verdict can require it: `validate-corpus` is
        # graceful when no corpus is on disk and returns a *skipped* verdict,
        # which would otherwise be published over the last real one.
        id: corpus-pull
        run: |
          # Every pass reads prior corpus state; a repo with no committed
          # pointer yet has nothing to repair, and each pass's own guard says
          # so rather than the pull failing here. Checksum-verified.
          uv run fedcourts corpus-pull --missing-pointer warn

      # The standing prerequisite every corpus pass here is gated on. Merge and
      # drop the live-minted duplicate SCOTUS rows first: any docket-number
      # spelling that defeats the channels' identity join leaves a twin pair,
      # and a pass that reads a row's columns — a disposition, a grant, a
      # count, a latch — must read the merged row rather than one half of a
      # pair. `docs/salience.md`'s "run dedupe first" prerequisite, enforced
      # rather than merely ordered. Idempotent: a clean corpus finds nothing
      # and persists nothing, so on a converged corpus this costs seconds.
      #
      # NOT continue-on-error, unlike its twin on run-seed's schedule: there a
      # failed sweep converges next window, here it means the pass the
      # maintainer dispatched cannot be trusted to read the right rows, and a
      # green run that quietly did nothing is the worst outcome a repair bench
      # can produce. Failing hard is also what makes it fail-closed on the
      # ledger half: a dedupe that mutated the workspace blob and then failed
      # its push stops the job, so those uncommitted moves go to the scrapheap
      # with the runner rather than into a later pass's commit. The explicit
      # `steps.dedupe-live-rows.outcome == 'success'` conjunct each pass
      # carries is belt-and-braces rather than the thing supplying that
      # property — the implicit `success()` already skips them — and it states
      # the prerequisite where a reader of one pass will see it.
      #
      # It runs in `dry-run` dispatches too, and its apply is a write a dry-run
      # dispatch performs. That is deliberate: the ledger a maintainer reads
      # off a dry run is what they then apply on, so it has to describe the
      # same deduped population the apply will act on. The scope reconcile
      # below is the other one, on the pass that needs it.
      - name: Dedupe live-minted duplicate rows
        id: dedupe-live-rows
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          # No committed pointer means no corpus — nothing to dedupe.
          if [ ! -f corpus/corpus.db.ref ]; then
            echo "no corpus pointer yet; skipping dedupe"; exit 0
          fi
          gh auth setup-git # persist-credentials is false on checkout
          # The merge reads committed `data/` as a refusal guard (a twin whose
          # events carry committed cell output must not merge), so it needs the
          # remote tip, not this checkout's — a collect PR merging output under
          # the twin since the last sync must be visible. Fast-forward only,
          # for the passes' reason: an unpushed local commit upstream fails
          # this closed rather than publishing a split.
          git fetch origin "$GITHUB_REF_NAME"
          git merge --ff-only FETCH_HEAD
          # Dry-run first, into the summary: the merge moves ledger event
          # directories with the re-keyed rows, and the would-move ledger must
          # outlive the step log the way each pass's does.
          uv run fedcourts dedupe-live-rows 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          uv run fedcourts dedupe-live-rows --apply
          # Blob before pointer commit, as everywhere.
          uv run fedcourts corpus-push
          # The merge writes both halves: the re-keyed rows into the corpus and
          # the moved minted-event directories into `data/`. Stage them into the
          # one pointer commit so both land together on the push path.
          git add corpus/corpus.db.ref
          if [ -d data ]; then
            git add data/
          fi
          if git diff --cached --quiet; then
            echo "No duplicate pairs to persist."
            exit 0
          fi
          git commit -m "repair: dedupe live-minted duplicate rows (corpus + ledger)"
          bash "${GITHUB_WORKSPACE}/.github/actions/commit-corpus-to-main/push_with_retry.sh" \
            "dedupe pointer"

      # The overhang clear's second prerequisite, and the reason it is a step
      # rather than a note: the clear recomputes each pending cohort's
      # selection, so it must recompute over an in-scope corpus. run-seed's
      # daily window gave it that ordering for free by running the reconcile
      # ahead of it; here the pass that needs it brings it along. Runs for that
      # pass alone — no other pass reads the scope latch — and fails hard for
      # the dedupe prerequisite's reason.
      - name: Reconcile predict scope (latch out-of-scope cases)
        id: reconcile-scope
        if: ${{ inputs.repair == 'unlatch-overselected' && steps.dedupe-live-rows.outcome == 'success' }}
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          # No committed pointer means no corpus — nothing to reconcile.
          if [ ! -f corpus/corpus.db.ref ]; then
            echo "no corpus pointer yet; skipping scope reconcile"; exit 0
          fi
          gh auth setup-git # persist-credentials is false on checkout
          uv run fedcourts reconcile-scope --apply
          # Blob before pointer commit, as everywhere.
          uv run fedcourts corpus-push
          git add corpus/corpus.db.ref
          if git diff --cached --quiet; then
            echo "Scope latch already converged; nothing to persist."
            exit 0
          fi
          git commit -m "repair: latch out-of-scope cases"
          bash "${GITHUB_WORKSPACE}/.github/actions/commit-corpus-to-main/push_with_retry.sh" \
            "scope-latch pointer"

      # Clear the pre-resize `salience_selected` overhang. The sticky latch is
      # additive, so petitions latched under old capacity caps keep earning
      # cells the shipped envelope never budgeted; this recomputes each pending
      # cohort under the current config and clears the latch on pending
      # petitions a from-scratch selection would not pick. A committed
      # prediction on a cleared case stays committed and graded.
      #
      # The printed `SalienceUnlatchResult` (the cleared-id ledger + the
      # pre-apply pointer) is the record of the pre-resize sticky set the write
      # erases, so it goes to the run summary, which outlives the step log.
      - name: Clear the pre-resize salience overhang (unlatch-overselected)
        # Every pass gates on an EQUALITY against its own selector value, never
        # on `!= 'none'`: an equality is false under an empty inputs context,
        # so the gate stays fail-closed if this workflow ever grows a trigger
        # that carries no inputs. The job gates are the same shape — an
        # allow-list membership test, false for a value nobody named — so the
        # property holds at both levels; a test pins both.
        if: ${{ inputs.repair == 'unlatch-overselected' && steps.dedupe-live-rows.outcome == 'success' && steps.reconcile-scope.outcome == 'success' }}
        # Sized for an apply, which recomputes twice — the dry run that lands
        # the cleared-id ledger in the summary, then the write — over a
        # recompute the sibling scope reconcile does in ~8 min, plus the ~1GB
        # push. Generous so the write completes and commits its pointer rather
        # than being cancelled mid-flight (below that cost a cap leaves nothing
        # applied). Still bounded, so the step's worst case stays under the
        # job's own cap: a job-cap hit is a cancellation, which no failure
        # handling absorbs.
        timeout-minutes: 15
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPAIR_MODE: ${{ inputs.repair_mode }}
        run: |
          set -euo pipefail
          # No committed pointer means no corpus — nothing to reconcile.
          if [ ! -f corpus/corpus.db.ref ]; then
            echo "no corpus pointer yet; skipping unlatch-overselected"; exit 0
          fi
          gh auth setup-git # persist-credentials is false on checkout
          # Dry-run first, into the summary: the cleared-id ledger is the
          # reading the apply is decided on, and it must outlive the step log.
          uv run fedcourts unlatch-overselected 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "${REPAIR_MODE}" != "apply" ]; then
            echo "dry-run only; nothing written."
            exit 0
          fi
          uv run fedcourts unlatch-overselected --apply 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          # Blob before pointer commit, as everywhere.
          uv run fedcourts corpus-push
          git add corpus/corpus.db.ref
          if git diff --cached --quiet; then
            echo "No overhang to clear; nothing to persist."
            exit 0
          fi
          git commit -m "repair: clear pre-resize salience overhang"
          bash "${GITHUB_WORKSPACE}/.github/actions/commit-corpus-to-main/push_with_retry.sh" \
            "unlatch-overselected pointer"

      # Re-derive the stored questions-presented rows with the current
      # extractor. The refusal guard makes the apply non-destructive (a stored
      # full-length question the current extractor cannot re-derive is
      # reported, never emptied), and the apply verifies itself: under the
      # corpus split the durable write is the content store's per-case PUT —
      # best-effort, per-case failures logged not raised — and the blob and
      # pointer may not move at all, so convergence is witnessed by re-running
      # the dry-run and requiring zero remaining rewrites, not by the pointer.
      #
      # No fetch/ff-only here, unlike the ledger passes: the command reads
      # corpus rows and documents only — no `data/` guard — and commits only
      # the pointer.
      - name: Backfill questions presented
        if: ${{ inputs.repair == 'qp-backfill' && steps.dedupe-live-rows.outcome == 'success' }}
        # A guess sized above the local passes, not a measurement: the pass
        # reads stored petition text per live-slice SCOTUS row — under the
        # split mode one content-store GET each, twice on an apply, plus the
        # mirror PUTs. The first `dry-run` dispatch is what measures the real
        # cost; resize from its wall clock.
        timeout-minutes: 30
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPAIR_MODE: ${{ inputs.repair_mode }}
        run: |
          set -euo pipefail
          # No committed pointer means no corpus — nothing to re-derive.
          if [ ! -f corpus/corpus.db.ref ]; then
            echo "no corpus pointer yet; skipping questions-presented backfill"; exit 0
          fi
          gh auth setup-git # persist-credentials is false on checkout
          # Dry-run first, into the summary: the reason-class ledger is the
          # triage record, and it must outlive the step log either way.
          uv run fedcourts backfill-questions-presented 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "${REPAIR_MODE}" != "apply" ]; then
            echo "dry-run only; nothing written."
            exit 0
          fi
          uv run fedcourts backfill-questions-presented --apply 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          # Convergence check: the command is idempotent, so a clean apply
          # leaves the re-run with nothing to rewrite. This is the witness the
          # pointer cannot be under the split mode (see the step comment) —
          # and it is what catches a swallowed content-store write.
          uv run fedcourts backfill-questions-presented 2>&1 \
            | tee -a "$GITHUB_STEP_SUMMARY" | tee /tmp/qp-verify.txt
          if ! grep -q "would rewrite 0," /tmp/qp-verify.txt; then
            echo "::error::apply did not converge — the re-run still reports rewrites (a content-store write may have failed; see the warnings above)"
            exit 1
          fi
          # Blob before pointer commit, as everywhere. Under the split mode
          # the blob carries no document text, so an unmoved pointer here is
          # the normal converged outcome, not a missing write.
          uv run fedcourts corpus-push
          git add corpus/corpus.db.ref
          if git diff --cached --quiet; then
            echo "pointer unmoved — the durable write is the content store's, verified converged above."
            exit 0
          fi
          git commit -m "repair: converge corpus (questions presented)"
          bash "${GITHUB_WORKSPACE}/.github/actions/commit-corpus-to-main/push_with_retry.sh" \
            "questions-presented pointer"

      # Re-derive the corpus `distribution_count` column under a registered
      # distribution parse. The first of the three pieces of work that activate
      # a new parse (`docs/salience.md`), and the only one that touches stored
      # state: the write is a direct UPDATE that bypasses the column's max
      # latch, because a narrower reading routed through the upsert would be a
      # silent no-op. The guard the latch was providing is the command's own: a
      # row whose latest live-shaped snapshot discloses no proceedings is
      # counted and left untouched, never written to 0. The apply refuses above
      # the command's blast-radius bound — fixed in code, not a dispatch input,
      # because the population is finite and its delta was measured before the
      # surface existed; moving it is a code change with the new basis stated
      # beside it, which is why this pass refuses a `repair_bound`.
      #
      # **Dispatch the INCUMBENT parse first**, as a `dry-run` control: it must
      # report `changed = 0`, since the stored column is the incumbent reading
      # of those same snapshots, and anything it moves is stored-column drift
      # rather than the parse — until it is zero, a candidate's changed set is
      # a sum nothing can decompose.
      #
      # It does not belong in the same dispatch as the overhang clear, which the
      # selector makes structural: anything that weighed
      # incumbent-parse counts before this ran is stale afterwards, and while
      # the scope reconcile self-heals next window, the overhang clear does not
      # — its write erases the sticky set it recomputed. Clear the overhang
      # under the bands the re-derivation leaves behind, not before.
      - name: Re-derive the distribution counts
        if: ${{ inputs.repair == 'rederive-distribution-parse' && steps.dedupe-live-rows.outcome == 'success' }}
        # Network-bound like the questions-presented backfill rather than the
        # local passes: under the corpus split the pass reads one content-store
        # object per live-slice SCOTUS row (tens of thousands), pooled by the
        # shared prefetch, then pays the blob push. The first `dry-run`
        # dispatch is what re-sizes it.
        timeout-minutes: 30
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPAIR_MODE: ${{ inputs.repair_mode }}
          REPAIR_TARGET: ${{ inputs.repair_target }}
        run: |
          set -euo pipefail
          # Validate the label before anything else, including the corpus
          # guard: a dispatch that cannot legally run should say so in seconds,
          # not after a full-population read. `Validate the repair selector`
          # duplicates this word for word so a bad dispatch dies before any
          # credential is minted; this copy is the one of record, because the
          # step has to be safe on whatever reaches it.
          if ! [[ "${REPAIR_TARGET}" =~ ^[a-z][a-z0-9-]*$ ]]; then
            echo "::error::repair=rederive-distribution-parse needs repair_target set to a distribution parse label — lowercase, e.g. dist-v2. A re-derivation names its reading rather than inheriting the ingest default, so there is no default to fall back on. Re-dispatch with the label."
            exit 1
          fi
          # No committed pointer means no corpus — nothing to re-derive.
          if [ ! -f corpus/corpus.db.ref ]; then
            echo "no corpus pointer yet; skipping the distribution re-derivation"; exit 0
          fi
          gh auth setup-git # persist-credentials is false on checkout
          # One pass, whichever mode: the command's plan IS its write set, so an
          # apply prints the same report a dry run would and a separate dry run
          # ahead of it would only repeat a full-population read over the
          # content store. Declared outside the guard so the expansion is total
          # under `set -u`.
          apply_args=()
          if [ "${REPAIR_MODE}" = "apply" ]; then
            apply_args+=(--apply)
          fi
          uv run fedcourts rederive-distribution-counts --parse "${REPAIR_TARGET}" \
            "${apply_args[@]}" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "${REPAIR_MODE}" != "apply" ]; then
            echo "dry-run only; nothing written."
            exit 0
          fi
          # Blob before pointer commit, as everywhere.
          uv run fedcourts corpus-push
          git add corpus/corpus.db.ref
          if git diff --cached --quiet; then
            echo "Distribution counts already re-derived under this parse; nothing to persist."
            exit 0
          fi
          git commit -m "repair: converge corpus (distribution counts)"
          bash "${GITHUB_WORKSPACE}/.github/actions/commit-corpus-to-main/push_with_retry.sh" \
            "distribution-count pointer"

      # Converge stored docket numbers on their marking-free spelling, draining
      # the population the `docket_numbers_carry_no_capital_marking` corpus
      # check reports. The ingest write site stores the number with the Court's
      # capital-case marking removed and raises `capital_case` beside it, so a
      # stored row converges only when that site touches it again — which no
      # automatic channel does outside the live slice. This is the dedicated
      # pass that drains the backlog without a re-read.
      #
      # The rewrite can neither create nor resolve a duplicate pair: both
      # SCOTUS channels reconcile identity on a key that already strips the
      # marking by shape, so the marked and marking-free spellings compare
      # equal to the join before the rewrite as well as after, and rows that
      # already share a normalized identity are reported as the dedupe pass's
      # population rather than touched.
      #
      # Corpus-only: no ledger surface, so a pointer-only commit, and no
      # fetch/ff-only ahead of it — nothing here reads committed `data/`.
      - name: Converge stored docket markings
        if: ${{ inputs.repair == 'normalize-docket-markings' && steps.dedupe-live-rows.outcome == 'success' }}
        # Local: one scan of the cases table and a bounded UPDATE against the
        # pulled blob, plus the blob push.
        timeout-minutes: 8
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPAIR: ${{ inputs.repair }}
          REPAIR_MODE: ${{ inputs.repair_mode }}
          REPAIR_BOUND: ${{ inputs.repair_bound }}
        run: |
          set -euo pipefail
          # Validate the bound before anything else, including the corpus
          # guard: a dispatch that cannot legally apply should say so in
          # seconds, not after a full scan. The command refuses an unbounded
          # apply on its own too; this refusal is the one with the maintainer's
          # procedure in it. `Validate the repair selector` duplicates it word
          # for word so a bad dispatch dies before any credential is minted;
          # this copy is the one of record, because the step has to be safe on
          # whatever reaches it. The refusal names the pass through `${REPAIR}`
          # rather than a literal so the two copies are identical as text, not
          # merely equivalent once expanded.
          if [ "${REPAIR_MODE}" = "apply" ] \
            && ! [[ "${REPAIR_BOUND}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::repair=${REPAIR} with repair_mode=apply needs repair_bound set to a positive integer — the count read off a previous dry-run dispatch's ledger. Re-dispatch with that number."
            exit 1
          fi
          # No committed pointer means no corpus — nothing to converge.
          if [ ! -f corpus/corpus.db.ref ]; then
            echo "no corpus pointer yet; skipping the docket-marking convergence"; exit 0
          fi
          gh auth setup-git # persist-credentials is false on checkout
          # Dry-run first, into the summary: the per-row ledger — each old and
          # new spelling, and which rows already share a normalized identity —
          # is the reading the apply's bound comes from, and it must outlive
          # the step log. (On an apply this run is a receipt, not a reading:
          # nobody reads it before the rewrite.)
          uv run fedcourts normalize-docket-markings 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "${REPAIR_MODE}" != "apply" ]; then
            echo "dry-run only; nothing written."
            exit 0
          fi
          uv run fedcourts normalize-docket-markings --apply \
            --max-rewrites "${REPAIR_BOUND}" 2>&1 \
            | tee -a "$GITHUB_STEP_SUMMARY"
          # Blob before pointer commit, as everywhere.
          uv run fedcourts corpus-push
          git add corpus/corpus.db.ref
          if git diff --cached --quiet; then
            echo "Docket markings already converged; nothing to persist."
            exit 0
          fi
          git commit -m "repair: converge corpus (docket markings)"
          bash "${GITHUB_WORKSPACE}/.github/actions/commit-corpus-to-main/push_with_retry.sh" \
            "docket-marking pointer"

      # Re-derive the dated interim/merits signals — `response_requested_at`,
      # `response_filed_at`, `merits_brief_filed` — from each row's newest
      # stored live-shaped snapshot. The gaps are rows polled before those
      # columns existed, and no channel corrects them: the live poller serves
      # the undecided slice, so a decided row is never re-polled, and the
      # undated flag beside them is a max-latched boolean a later write cannot
      # turn back into a question. Recoverable from the corpus alone, since
      # that stored snapshot is the same payload the original ingest read.
      #
      # It reads those snapshots, which under the corpus split live in the
      # content store rather than the blob — so it depends on the job-level
      # base URL, whose store segment is where they live, and a row with no
      # stored snapshot is counted and
      # reported rather than failed. The three columns are fill-in only,
      # matching the latch family they sit in on the upsert path, so a stored
      # value is never overwritten and a degraded payload fills nothing rather
      # than asserting a date. Its write is a direct UPDATE of the index, so
      # the pointer IS the witness here and a plain pointer commit suffices; no
      # ledger surface, so no fetch/ff-only.
      - name: Backfill the dated response signals
        if: ${{ inputs.repair == 'response-backfill' && steps.dedupe-live-rows.outcome == 'success' }}
        # Network-bound like the questions-presented backfill rather than the
        # local passes: one content-store read per candidate row, pooled by the
        # shared prefetch. A guess, not a measurement, since the candidate set
        # is a subset of the live slice; the first `dry-run` dispatch re-sizes
        # it.
        timeout-minutes: 20
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPAIR: ${{ inputs.repair }}
          REPAIR_MODE: ${{ inputs.repair_mode }}
          REPAIR_BOUND: ${{ inputs.repair_bound }}
        run: |
          set -euo pipefail
          # Validate the bound before anything else, including the corpus
          # guard: a dispatch that cannot legally apply should say so in
          # seconds, not after a full-population read of the content store.
          # `Validate the repair selector` duplicates it word for word so a bad
          # dispatch dies before any credential is minted; this copy is the one
          # of record, because the step has to be safe on whatever reaches it.
          # The refusal names the pass through `${REPAIR}` rather than a literal
          # so the two copies are identical as text, not merely equivalent once
          # expanded.
          if [ "${REPAIR_MODE}" = "apply" ] \
            && ! [[ "${REPAIR_BOUND}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::repair=${REPAIR} with repair_mode=apply needs repair_bound set to a positive integer — the count read off a previous dry-run dispatch's ledger. Re-dispatch with that number."
            exit 1
          fi
          # No committed pointer means no corpus — nothing to re-derive.
          if [ ! -f corpus/corpus.db.ref ]; then
            echo "no corpus pointer yet; skipping the response-signal backfill"; exit 0
          fi
          gh auth setup-git # persist-credentials is false on checkout
          # Dry-run first, into the summary: the fill ledger — each row with the
          # dates it gains, beside the counts of rows read with nothing to fill,
          # with no stored snapshot, and whose snapshot discloses no proceedings
          # — is the reading the apply's bound comes from, and it must outlive
          # the step log. The bound is the rows actually FILLED, not the
          # `candidates` denominator printed beside it: that denominator is not
          # finite, since the granted arm admits every new cert grant that has
          # not yet drawn a respondent brief. (On an apply this run is a
          # receipt, not a reading.)
          uv run fedcourts backfill-response-fields 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "${REPAIR_MODE}" != "apply" ]; then
            echo "dry-run only; nothing written."
            exit 0
          fi
          uv run fedcourts backfill-response-fields --apply \
            --max-fills "${REPAIR_BOUND}" 2>&1 \
            | tee -a "$GITHUB_STEP_SUMMARY"
          # Blob before pointer commit, as everywhere.
          uv run fedcourts corpus-push
          git add corpus/corpus.db.ref
          if git diff --cached --quiet; then
            echo "Response signals already filled; nothing to persist."
            exit 0
          fi
          git commit -m "repair: converge corpus (dated response signals)"
          bash "${GITHUB_WORKSPACE}/.github/actions/commit-corpus-to-main/push_with_retry.sh" \
            "response-signal pointer"

      # The one binary dependency any pass here has, installed by the one pass
      # that needs it and gated on its selector so the other seven dispatches
      # never pay for it: the OCR recovery renders a page with `pdftoppm`
      # (poppler-utils) and reads it with `tesseract`. Deliberately not in the
      # devcontainer, the Python environment or a scheduled lane — the same
      # reason the extractor takes its OCR call as an injected seam rather than
      # importing one. From the runner image's own Ubuntu archive: no
      # third-party repository, no added signing key, nothing this workflow
      # trusts that it did not already trust. The resolved versions are echoed
      # into the summary rather than pinned in the argument list, because an
      # exact apt pin goes stale the week the runner image rolls and would fail
      # the pass for a reason that has nothing to do with the corpus; what a
      # recovered text was read by is then a fact the run records.
      # It runs on a `dry-run` dispatch too, where no binary is used: two
      # packages from the runner's own archive are seconds of work, and proving
      # the install and recording its versions on the run a maintainer *reads*
      # is worth more than the seconds, since the alternative is discovering a
      # broken install on the run that was going to spend a slice.
      - name: Install the OCR binaries
        if: ${{ inputs.repair == 'ocr-recovery' }}
        # Two packages, no third-party repository: a minute is generous. Kept
        # small deliberately — this step's cap is spent out of the same job
        # budget the pass below needs (see the job's `timeout-minutes`).
        timeout-minutes: 5
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends tesseract-ocr poppler-utils
          {
            echo "OCR binaries:"
            # Both write their version banner to stderr and neither guarantees a
            # zero exit for it, so the reads are made total rather than left to
            # fail a step whose real work has not started.
            tesseract --version 2>&1 | head -n 1 || true
            pdftoppm -v 2>&1 | head -n 1 || true
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # Fresh credentials for the OCR pass alone. Both opening grants live 1h
      # from job start, and this pass's step is the one whose worst case —
      # behind the dedupe's and the install's own caps — can still be running
      # (and committing) past that hour. Re-minting immediately before the
      # step means the pass starts each grant's clock at zero, so its 45-minute
      # cap fits with room to spare; every other pass keeps the opening pair.
      # Conditions mirror the pass step's own, so the grants are refreshed
      # exactly when they will be used.
      - name: Mint app token (OCR pass)
        if: ${{ inputs.repair == 'ocr-recovery' && steps.dedupe-live-rows.outcome == 'success' }}
        id: app-token-ocr
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.DATA_APP_CLIENT_ID }}
          private-key: ${{ secrets.DATA_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Configure AWS credentials (corpus S3 remote, read-write, OCR pass)
        if: ${{ inputs.repair == 'ocr-recovery' && steps.dedupe-live-rows.outcome == 'success' }}
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}
          role-duration-seconds: 3600 # 1h
          # See the opening credentials step for what this bound buys and costs.
          action-timeout-s: 120

      # Read the scanned filings off their page images. A filing submitted on
      # paper reaches the corpus with no text layer, so the extractor stored
      # nothing for it and every cell minted over that case reads it empty —
      # for as long as the docket keeps serving the same URL, since the poller
      # and the Term walker re-fetch a kind only when its link changes. No
      # fetching lane repairs it. The population is every stored kind a cell
      # reads that was fetched as a PDF — the petition, the application, the
      # brief in opposition and the four merits filings — whose text is empty,
      # whose page count is above zero (a zero-page row is a PDF that would not
      # open, which is not OCR's to repair) and whose stored URL is one link
      # (a multi-respondent opposition's URL is the canonical join of its
      # briefs, a set key rather than something to GET — and its per-brief
      # headings are text, so it is not empty by the coverage report's test
      # either and nothing sizes that residual); each is
      # re-fetched by its own stored URL on supremecourt.gov — free and
      # politeness-capped, so the pass spends none of the CourtListener budget —
      # and re-extracted with the OCR seam supplied, which reads a page off its
      # image only where that page's own extraction yielded nothing. Additive:
      # text is written only where the stored row held none, so the pass cannot
      # overwrite an extraction, and every recovered row carries `ocr_derived`.
      #
      # The bound is a slice size rather than a refusal threshold — each
      # candidate costs a fetch and a page-by-page recognition, and runner
      # minutes are the whole cost — so a backlog clears across dispatches. It
      # counts candidates rather than cases: a case holding both a scanned
      # petition and a scanned opposition spends two of it. It is the *spend*
      # cap; what holds the pass inside this step's wall clock is the slice
      # deadline the apply below is given, which stops the pass taking new
      # candidates while the writes and the witness still fit. It reads and writes
      # documents, which under the corpus split live in the content store rather
      # than the blob, so the pointer commit cannot witness the write: the
      # post-apply re-read below is what does, and it must find exactly the
      # class the apply's own ledger said it would leave behind.
      - name: Recover scanned filings by OCR
        if: ${{ inputs.repair == 'ocr-recovery' && steps.dedupe-live-rows.outcome == 'success' }}
        # Two full-population content-store walks on an apply — the pass's own,
        # and the witness re-read — plus the slice, which is the expensive half:
        # rendering and recognizing a page costs a couple of seconds, so a
        # 60-page filing is two or three minutes of it. What sizes that half
        # is the slice deadline below, not `repair_bound`: page counts across
        # the class vary several-fold, so no fixed number of candidates is both
        # safe against this cap and worth dispatching. This cap is the backstop
        # behind that deadline rather than the thing a heavy slice hits. It is
        # what the pass's fresh credentials above are sized against: 45 minutes
        # from a mint moments earlier sits well inside both grants' 1h lives.
        timeout-minutes: 45
        env:
          GH_TOKEN: ${{ steps.app-token-ocr.outputs.token }}
          REPAIR: ${{ inputs.repair }}
          REPAIR_MODE: ${{ inputs.repair_mode }}
          REPAIR_BOUND: ${{ inputs.repair_bound }}
        run: |
          set -euo pipefail
          # Validate the bound before anything else, including the corpus guard:
          # a dispatch that cannot legally apply should say so in seconds, not
          # after a full-population read of the content store. `Validate the
          # repair selector` duplicates it word for word so a bad dispatch dies
          # before any credential is minted; this copy is the one of record,
          # because the step has to be safe on whatever reaches it. The refusal
          # names the pass through `${REPAIR}` rather than a literal so the two
          # copies are identical as text, not merely equivalent once expanded.
          if [ "${REPAIR_MODE}" = "apply" ] \
            && ! [[ "${REPAIR_BOUND}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::repair=${REPAIR} with repair_mode=apply needs repair_bound set to a positive integer — the count read off a previous dry-run dispatch's ledger. Re-dispatch with that number."
            exit 1
          fi
          # No committed pointer means no corpus — nothing to recover from.
          if [ ! -f corpus/corpus.db.ref ]; then
            echo "no corpus pointer yet; skipping the OCR recovery"; exit 0
          fi
          gh auth setup-git # persist-credentials is false on checkout
          # The dry run IS the reading, and on an apply there is nothing for a
          # preceding one to add: this pass's own ledger states the class it
          # found before it wrote, so the receipt the other passes get from a
          # tee'd dry run is already inside the apply's output. Skipping it here
          # is the distribution re-derivation's reasoning — a separate dry run
          # would only repeat a full-population read of the content store — and
          # it buys the slice back a walk's worth of the step's budget. The dry
          # run also re-fetches a sample of the class through the writer's own
          # fetch path and reports each status, which is what says whether
          # supremecourt.gov serves a writer before a slice is spent finding out.
          if [ "${REPAIR_MODE}" != "apply" ]; then
            uv run fedcourts ocr-recover-petitions 2>&1 \
              | tee -a "$GITHUB_STEP_SUMMARY"
            echo "dry-run only; nothing written."
            exit 0
          fi
          # Both runs below are read back as data, so their stdout goes to a
          # file of its own rather than through `2>&1 | tee`: the ledger's last
          # line is JSON, and a merged stream can interleave a log line into it
          # once the untruncated recovery list runs past a pipe buffer. stderr
          # still reaches the step log, and the file is tee'd into the summary
          # after, so the reader loses nothing.
          #
          # The slice's wall clock, measured from the moment the command starts
          # so its own population walk is charged to it. The step has 45 minutes
          # (2700 s) and everything below still has to land inside them, so the
          # pass gets what is left after that tail is reserved:
          #
          #   witness re-read     300 s  one full-population content-store walk,
          #                              which measures 133-162 s and grows with
          #                              the population — reserved at roughly
          #                              twice the largest observed
          #   corpus-push          60 s  the blob comes back byte-identical on
          #                              this pass, so the push is seconds;
          #                              reserved for one that is not
          #   commit + push        60 s  the pointer commit and its retrying
          #                              push, reached only where the index
          #                              itself moved
          #   overshoot           240 s  the deadline is the last moment work may
          #                              BEGIN, and a started candidate can end
          #                              after it: the document budget is checked
          #                              between pages, so the page already
          #                              running when it fires still costs a
          #                              render and a recognition at their own
          #                              120 s ceilings, and a re-fetch that
          #                              times out and takes the client's one
          #                              retry costs a further minute or so over
          #                              what the estimate charges for it. About
          #                              335 s together, against this row plus
          #                              the walk reserve's own slack over the
          #                              133-162 s it measures
          #   ------------------------
          #   reserve             660 s  →  2700 - 660 = 2040
          #
          # A candidate is admitted only where what is left holds its whole
          # estimate, and no candidate estimates above the per-document
          # recognition budget plus the fixed per-candidate overhead (630 s), so even
          # against the walk's full reserve 2040 still admits the most expensive
          # filing the class can hold (2040 - 300 = 1740): the head of the class
          # cannot be starved by the deadline. Candidates it declines are
          # reported unreached — untouched, still in the class, and first next
          # dispatch.
          #
          # Two things this arithmetic does not cover, both of which the step's
          # own cap is the backstop for: a renderer or recognizer wedging on
          # every page of a document rather than one (a broken runner image, not
          # a heavy slice), and a stored page count that understates the filing
          # now served at that URL. Keeping those cases on the timeout, and the
          # heavy slice off it, is the point of the deadline.
          # The command name is this lane's invocation string; the population
          # it walks is every fetched kind, not petitions alone.
          uv run fedcourts ocr-recover-petitions --apply \
            --max-cases "${REPAIR_BOUND}" \
            --deadline-seconds 2040 > /tmp/ocr-apply.txt
          tee -a "$GITHUB_STEP_SUMMARY" < /tmp/ocr-apply.txt
          # The witness. The apply's ledger states the class it expects to leave
          # behind, and a re-read of the corpus must find exactly that: a
          # content-store write that failed would leave the recovered filings
          # in the class, which nothing in the pointer commit below would ever
          # notice. `--probe=0` because this run counts — the sample would
          # re-fetch what was just fetched.
          uv run fedcourts ocr-recover-petitions --probe=0 > /tmp/ocr-verify.txt
          tee -a "$GITHUB_STEP_SUMMARY" < /tmp/ocr-verify.txt
          # Read off the machine-readable ledger each run prints last, rather
          # than off the prose above it: the field name is passed as an argument
          # so nothing from a file is interpolated into the program.
          ledger_field() {
            grep -h '^{"applied"' "$1" | tail -n 1 \
              | uv run python -c 'import json,sys; print(json.load(sys.stdin)[sys.argv[1]])' "$2"
          }
          # The summary is capped: GitHub errors the file command past 1 MiB,
          # and this pass's ledgers name whole classes — the dry run's, the
          # largest, is exactly the one the apply's bound is read off. The head
          # reaches the summary; the full ledger is already in the step log
          # through the `cat` beside each call.
          summarize() {
            head -n 60 "$1" >> "$GITHUB_STEP_SUMMARY"
            local total
            total=$(wc -l < "$1")
            if [ "$total" -gt 60 ]; then
              echo "… $((total - 60)) more line(s) in the step log" >> "$GITHUB_STEP_SUMMARY"
            fi
          }
          expected="$(ledger_field /tmp/ocr-apply.txt remaining)"
          found="$(ledger_field /tmp/ocr-verify.txt candidates)"
          # A slice that started nothing converges, pushes nothing and exits
          # green, which is the one shape of this pass a reader can miss: the
          # deadline declined the head of the class, so the backlog is frozen
          # rather than draining. It means the population walk has grown into
          # the slice's budget, which is a sizing decision and not something a
          # re-dispatch fixes. Said as an annotation because the ledger's own
          # `attempted 0` sits in a summary nobody reads on a green run.
          if [ "$(ledger_field /tmp/ocr-apply.txt attempted)" = "0" ] \
            && [ "${expected}" != "0" ]; then
            echo "::warning::the slice deadline started no candidate at all — ${expected} left in the class and nothing recovered. The population walk now takes most of the slice's budget; re-read the deadline arithmetic beside the invocation rather than re-dispatching."
          fi
          if [ "${found}" != "${expected}" ]; then
            echo "::error::apply did not converge — the re-read finds ${found} scanned filing(s) where the apply's ledger left ${expected} (a content-store write may have failed; see the warnings above)"
            exit 1
          fi
          # Blob before pointer commit, as everywhere. Under the corpus split
          # the recovered text lands in the content store and the blob may come
          # back byte-identical, which is why the pointer is not the witness
          # here and an unchanged one is reported rather than failed.
          uv run fedcourts corpus-push
          git add corpus/corpus.db.ref
          if git diff --cached --quiet; then
            echo "Recovered text is in the content store; the index pointer is unchanged."
            exit 0
          fi
          git commit -m "repair: recover scanned filings (OCR)"
          bash "${GITHUB_WORKSPACE}/.github/actions/commit-corpus-to-main/push_with_retry.sh" \
            "OCR recovery pointer"

      # Provision the queued cases holding no primary document. A case reaches
      # prediction with the filing that opens it — the petition on a cert-form
      # docket, the application on an interim one — because provisioning runs at
      # the transition that queues it. A case whose provisioning ran before the
      # selector had an arm for its filing type kept nothing, and no fetching
      # lane repairs that: the poller re-fetches a kind only when its link
      # changes, and a kind never stored has no link to change, while the case
      # itself is decided by now on most of the class and the rotation has left
      # it. This applies the current selector to the cases already past their
      # trigger.
      #
      # The population is form-keyed and scoped to what can still mint a cell —
      # live-slice rows queued for prediction or salience-selected, measured
      # against their own docket form's primary document — not the wide
      # distributed stock, which is overwhelmingly legacy rows carrying no
      # document links at all. Each candidate costs paced round trips against
      # the Court's own host, so the bound is a slice size rather than a refusal
      # threshold and a backlog clears across dispatches, the `repair_bound`
      # exception the OCR recovery already occupies.
      #
      # Its writes are documents, which under the corpus split land in the
      # content store rather than the blob, so the pointer commit cannot witness
      # them and an unchanged pointer is reported rather than failed. The
      # witness is the walk-only re-read below.
      #
      # An apply writes one thing into the blob itself: the floor probe stamped
      # on each candidate whose docket posts nothing fetchable behind a kind it
      # is missing. Neither floor can be recovered, so without the stamp the
      # class would present the same paced docket GETs to every dispatch and the
      # candidates behind them would never be reached inside a slice. The stamp
      # holds a floored case out until its docket is polled again, so the index
      # DOES move on an applied slice that read any floor, and the pointer
      # commit below is the ordinary path rather than the reserved one.
      #
      # A stamp has no undo on this lane: the column is a fill-in latch, so no
      # writer clears it, and a docket that has left the live rotation is never
      # re-polled. The pass itself is what keeps a bad reading from being
      # banked — a floor its modern-docket alarm fired on is never stamped,
      # because that reading is about the selector rather than about the docket,
      # and it is the shape an upstream payload that changed or degraded would
      # take across a whole slice. Read the alarm before re-dispatching an apply.
      - name: Backfill missing primary documents
        if: ${{ inputs.repair == 'document-backfill' && steps.dedupe-live-rows.outcome == 'success' }}
        # The slice is the expensive half: a candidate is one paced docket GET
        # plus a GET, a download and a text extraction per filing the docket
        # nominates. What sizes it is the slice deadline below rather than
        # `repair_bound`, since what a candidate turns out to cost is what its
        # docket nominates and no fixed number of cases is both safe against
        # this cap and worth dispatching. This cap is the backstop behind that
        # deadline. It stays inside the job's so one App token covers the run.
        timeout-minutes: 30
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPAIR: ${{ inputs.repair }}
          REPAIR_MODE: ${{ inputs.repair_mode }}
          REPAIR_BOUND: ${{ inputs.repair_bound }}
        run: |
          set -euo pipefail
          # Validate the bound before anything else, including the corpus guard:
          # a dispatch that cannot legally apply should say so in seconds, not
          # after a full-population read of the content store. `Validate the
          # repair selector` duplicates it word for word so a bad dispatch dies
          # before any credential is minted; this copy is the one of record,
          # because the step has to be safe on whatever reaches it. The refusal
          # names the pass through `${REPAIR}` rather than a literal so the two
          # copies are identical as text, not merely equivalent once expanded.
          if [ "${REPAIR_MODE}" = "apply" ] \
            && ! [[ "${REPAIR_BOUND}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::repair=${REPAIR} with repair_mode=apply needs repair_bound set to a positive integer — the count read off a previous dry-run dispatch's ledger. Re-dispatch with that number."
            exit 1
          fi
          # And the every-mode half, because this pass's dry run spends the bound
          # too — a field it reads must satisfy the grammar wherever it is set,
          # or a negative integer reaches the slice as "every candidate but the
          # last five". Copied word for word from `Validate the repair selector`
          # like the refusal above it; this copy is the one of record.
          if [ -n "${REPAIR_BOUND}" ] \
            && ! [[ "${REPAIR_BOUND}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::repair=${REPAIR} reads repair_bound in BOTH modes, so it must be a positive integer wherever it is set — a bound its dry run would also spend. Clear the field or correct the number."
            exit 1
          fi
          # No committed pointer means no corpus — nothing to provision from.
          if [ ! -f corpus/corpus.db.ref ]; then
            echo "no corpus pointer yet; skipping the document backfill"; exit 0
          fi
          gh auth setup-git # persist-credentials is false on checkout
          # The dry run spends one paced docket GET per candidate — running
          # `select_documents` over a freshly served payload is the whole
          # diagnostic, and it is what separates a case with a link waiting for
          # it from one at a floor — so it is bounded on the same terms as the
          # apply. `repair_bound` is optional here and honored when set; the
          # deadline below is the bound that is always present, and it is what
          # holds either mode inside this step's wall clock.
          # Read off the machine-readable ledger each run prints last, rather
          # than off the prose above it: the field name is passed as an argument
          # so nothing from a file is interpolated into the program. Defined
          # ahead of both modes because the dry run reads its alarm this way too.
          ledger_field() {
            grep -h '^{"applied"' "$1" | tail -n 1 \
              | uv run python -c 'import json,sys; print(json.load(sys.stdin)[sys.argv[1]])' "$2"
          }
          # The summary is capped: GitHub errors the file command past 1 MiB,
          # and this pass's ledgers name whole classes — the dry run's, the
          # largest, is exactly the one the apply's bound is read off. The head
          # reaches the summary; the full ledger is already in the step log
          # through the `cat` beside each call.
          summarize() {
            head -n 60 "$1" >> "$GITHUB_STEP_SUMMARY"
            local total
            total=$(wc -l < "$1")
            if [ "$total" -gt 60 ]; then
              echo "… $((total - 60)) more line(s) in the step log" >> "$GITHUB_STEP_SUMMARY"
            fi
          }
          # A modern docket whose opening filing matched no entry is not a floor
          # but a selector regression — the class this pass exists to stop
          # producing rather than to absorb. Raised as an annotation in BOTH
          # modes: the dry run is the reading a maintainer does first and where
          # the decision to apply is actually made, so an alarm that fired only
          # on the apply would arrive a dispatch after it was wanted.
          alarm_on_regression() {
            modern="$(ledger_field "$1" no_entry_modern_cases)"
            if [ "${modern}" != "[]" ]; then
              echo "::warning::selector regression: ${modern} matched no opening entry on a modern docket. The selector has no arm for their filing type; widen it rather than re-dispatching this pass."
            fi
          }
          dry_args=()
          if [ -n "${REPAIR_BOUND}" ]; then
            dry_args+=(--max-cases "${REPAIR_BOUND}")
          fi
          if [ "${REPAIR_MODE}" != "apply" ]; then
            # 1800 s of step budget, of which the dry run pushes nothing and
            # commits nothing: only the tee and the trailing verdict follow it,
            # so the reserve is the overshoot of a candidate already started
            # (one docket GET, and the client's one retry on a transport
            # failure) rather than a write tail.
            #
            # Its stdout goes to a file for the reason the apply's does: the
            # ledger's last line is JSON read back as data, and a merged stream
            # can interleave a log line into it once the untruncated per-case
            # lists run past a pipe buffer.
            uv run fedcourts backfill-documents "${dry_args[@]}" \
              --deadline-seconds 1680 > /tmp/document-dry.txt
            tee -a "$GITHUB_STEP_SUMMARY" < /tmp/document-dry.txt
            alarm_on_regression /tmp/document-dry.txt
            echo "dry-run only; nothing written."
            exit 0
          fi
          # Both runs below are read back as data, so their stdout goes to a
          # file of its own rather than through `2>&1 | tee`: the ledger's last
          # line is JSON, and a merged stream can interleave a log line into it
          # once the untruncated per-case lists run past a pipe buffer. stderr
          # still reaches the step log, and the file is tee'd into the summary
          # after, so the reader loses nothing.
          #
          # The slice's wall clock, measured from the moment the command starts
          # so its own population walk is charged to it. The step has 30 minutes
          # (1800 s) and everything below still has to land inside them, so the
          # pass gets what is left after that tail is reserved:
          #
          #   witness re-walk     180 s  one walk of the predict-relevant
          #                              population's stored documents. A strict
          #                              subset of the OCR recovery's own walk —
          #                              the same live-slice row iteration, then
          #                              filtered to the queued-or-selected rows
          #                              — so it is bounded above by the 133-162 s
          #                              that one measures, and this is roughly
          #                              twice that ceiling
          #   corpus-push         120 s  the index moves on any applied slice
          #                              that read a floor — the probe stamps
          #                              are columns — so this is paid on the
          #                              ordinary run rather than reserved for
          #                              an unusual one. Twice the measured
          #                              digest-and-upload of a blob this size,
          #                              because the stamps are durable only
          #                              once it lands: the documents are
          #                              already banked per case in the content
          #                              store, the exclusions are not
          #   commit + push        60 s  the pointer commit and its retrying
          #                              push, reached on the same runs
          #   overshoot           240 s  the deadline is the last moment work may
          #                              BEGIN, and a started candidate can end
          #                              after it: a docket nominating more
          #                              filings than the estimate charges for —
          #                              one opposition brief per respondent —
          #                              runs past it, as does a download that
          #                              times out and takes the client's one
          #                              retry
          #   ------------------------
          #   reserve             600 s  →  1800 - 600 = 1200
          #
          # A candidate is admitted only where what is left holds its whole
          # estimate (65 s: the docket GET plus the filings it is charged for),
          # so even against the walk's full reserve the head of the class cannot
          # be starved by the deadline. Candidates it declines are reported
          # unreached — untouched, still in the class, and first next dispatch.
          #
          # Two things this arithmetic does not cover, both of which the step's
          # own cap is the backstop for: a docket nominating far more filings
          # than the estimate charges for (selection returns every distinct-URL
          # opposition brief with no per-case cap, so a many-respondent docket
          # can run several times the charge), and a run of downloads that each
          # time out and take the client's retry. Keeping those on the timeout,
          # and the ordinary heavy slice off it, is the point of the deadline.
          uv run fedcourts backfill-documents --apply \
            --max-cases "${REPAIR_BOUND}" \
            --deadline-seconds 1200 > /tmp/document-apply.txt
          tee -a "$GITHUB_STEP_SUMMARY" < /tmp/document-apply.txt
          # The witness. The apply's ledger states the class it expects to leave
          # behind, and a re-read of the corpus must find exactly that: a
          # content-store write that failed would leave the recovered cases in
          # the class, which nothing in the pointer commit below would ever
          # notice. `--max-cases 0` is the walk-only reading — it takes an empty
          # slice, so it fetches nothing and costs no upstream round trip at
          # all, and what it reports is the class as the corpus now holds it.
          # `remaining` nets out the floors this slice stamped as well as the
          # cases it recovered, because both left the class, so the equality
          # below is exact. It holds only while every stamp reads as standing on
          # the re-read (the probe date against the row's own live-poll stamp),
          # so a mismatch here can also be a clock rather than the content-store
          # failure the error names. `standing_floors` on the re-read is what
          # says how much of the class is held out rather than gone.
          uv run fedcourts backfill-documents --max-cases 0 > /tmp/document-verify.txt
          tee -a "$GITHUB_STEP_SUMMARY" < /tmp/document-verify.txt
          expected="$(ledger_field /tmp/document-apply.txt remaining)"
          found="$(ledger_field /tmp/document-verify.txt candidates)"
          # A slice that started nothing converges, pushes nothing and exits
          # green, which is the one shape of this pass a reader can miss: the
          # deadline declined the head of the class, so the backlog is frozen
          # rather than draining. It means the population walk has grown into
          # the slice's budget, which is a sizing decision and not something a
          # re-dispatch fixes. Said as an annotation because the ledger's own
          # `attempted 0` sits in a summary nobody reads on a green run.
          if [ "$(ledger_field /tmp/document-apply.txt attempted)" = "0" ] \
            && [ "${expected}" != "0" ]; then
            echo "::warning::the slice deadline started no candidate at all — ${expected} left addressable in the class, beside whatever a standing floor probe holds out, and nothing recovered. The population walk now takes most of the slice's budget; re-read the deadline arithmetic beside the invocation rather than re-dispatching."
          fi
          if [ "${found}" != "${expected}" ]; then
            echo "::error::apply did not converge — the re-read finds ${found} addressable candidate(s) in the gap class where the apply's ledger left ${expected} (a content-store write may have failed, or a floor probe this slice stamped did not read as standing on the re-read; see the warnings above)"
            exit 1
          fi
          alarm_on_regression /tmp/document-apply.txt
          # Blob before pointer commit, as everywhere. Under the corpus split
          # the recovered documents land in the content store, so the pointer is
          # not the witness here: a slice that read no floor at all moves nothing
          # in the index and an unchanged pointer is reported rather than failed.
          # A slice that read one does move it — the floor probes are index
          # columns — so this is the path most applies take.
          uv run fedcourts corpus-push
          git add corpus/corpus.db.ref
          if git diff --cached --quiet; then
            echo "Recovered documents are in the content store; the index pointer is unchanged."
            exit 0
          fi
          git commit -m "repair: provision missing primary documents"
          bash "${GITHUB_WORKSPACE}/.github/actions/commit-corpus-to-main/push_with_retry.sh" \
            "document backfill pointer"

      # Mirror to the content store the document text that reached only the blob.
      # Under the corpus split the per-case store is the system of record for
      # documents and every production read is served from it, so a case whose
      # text was written before the store existed has intact rows in the blob's
      # `documents` table and no objects under its store prefix: provisioning,
      # the questions-presented derivations and the QP-topic labeling pack all
      # serve nothing for it. No fetching lane
      # repairs that — the poller re-fetches a kind only when its link changes,
      # and these kinds are already stored — and the gap does not grow either,
      # since a document written under the split mirrors at upsert.
      #
      # Unlike the OCR recovery and the document back-fill this one reaches NO
      # upstream host at all: its inputs are the blob's own rows and its writes
      # are content-store PUTs, so it costs store round trips rather than paced
      # GETs against the Court. Its bound is a slice size all the same — a
      # manifest read and a PUT per document for every case in it — so the class
      # clears across dispatches. It is the one slice bound that is APPLY-ONLY:
      # the dry run has to enumerate the whole population, because that ledger is
      # what the bound is read off, and the command refuses a bound without an
      # apply rather than silently ignoring it.
      #
      # Its writes land in the content store and never in the blob, so the
      # pointer cannot witness them and an unchanged one is reported rather than
      # failed. Two witnesses instead: the pass re-probes every case it mirrors
      # (the store writer is best-effort and swallows its failures, so a slice
      # that wrote nothing would otherwise read exactly like one that worked),
      # and the walk-only re-read below requires the class the apply's ledger
      # said it would leave.
      - name: Mirror blob-only documents to the content store
        if: ${{ inputs.repair == 'mirror-stored-documents' && steps.dedupe-live-rows.outcome == 'success' }}
        # One store listing per case in the population, and on an apply TWO full
        # walks — the pass's own probe and the witness re-read below, which is an
        # entire second dry run — plus, per case in the slice, a manifest read,
        # a PUT per document, the manifest PUT, and the re-probe listing. No
        # upstream fetch and no politeness pacing, so the walks are the bulk of
        # it and the slice adds in proportion to the bound.
        #
        # Unlike both slice-bounded siblings this pass takes no
        # `--deadline-seconds`, because nothing it does is paced and a store
        # listing has no per-case cost to estimate: this cap is the only wall
        # clock, and the bound is what the maintainer sizes against it. A cap hit
        # keeps whatever the store already took — the PUTs are idempotent and an
        # unverified case stays at the head of the class — but loses the apply's
        # ledger, which is redirected to a file and tee'd only once the command
        # returns.
        timeout-minutes: 25
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPAIR: ${{ inputs.repair }}
          REPAIR_MODE: ${{ inputs.repair_mode }}
          REPAIR_BOUND: ${{ inputs.repair_bound }}
        run: |
          set -euo pipefail
          # Validate the bound before anything else, including the corpus guard:
          # a dispatch that cannot legally apply should say so in seconds, not
          # after a full-population probe of the content store. `Validate the
          # repair selector` duplicates it word for word so a bad dispatch dies
          # before any credential is minted; this copy is the one of record,
          # because the step has to be safe on whatever reaches it. The refusal
          # names the pass through `${REPAIR}` rather than a literal so the two
          # copies are identical as text, not merely equivalent once expanded.
          if [ "${REPAIR_MODE}" = "apply" ] \
            && ! [[ "${REPAIR_BOUND}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::repair=${REPAIR} with repair_mode=apply needs repair_bound set to a positive integer — the count read off a previous dry-run dispatch's ledger. Re-dispatch with that number."
            exit 1
          fi
          # No committed pointer means no corpus — nothing to mirror from.
          if [ ! -f corpus/corpus.db.ref ]; then
            echo "no corpus pointer yet; skipping the document mirror"; exit 0
          fi
          gh auth setup-git # persist-credentials is false on checkout
          # Read off the machine-readable ledger each run prints last, rather
          # than off the prose above it: the field name is passed as an argument
          # so nothing from a file is interpolated into the program.
          ledger_field() {
            grep -h '^{"applied"' "$1" | tail -n 1 \
              | uv run python -c 'import json,sys; print(json.load(sys.stdin)[sys.argv[1]])' "$2"
          }
          # The summary is capped: GitHub errors the file command past 1 MiB,
          # and this pass's ledgers name whole classes — the dry run's, the
          # largest, is exactly the one the apply's bound is read off. The head
          # reaches the summary; the full ledger is already in the step log
          # through the `cat` beside each call.
          summarize() {
            head -n 60 "$1" >> "$GITHUB_STEP_SUMMARY"
            local total
            total=$(wc -l < "$1")
            if [ "$total" -gt 60 ]; then
              echo "… $((total - 60)) more line(s) in the step log" >> "$GITHUB_STEP_SUMMARY"
            fi
          }
          # The dry run is unbounded by construction — it enumerates the whole
          # population, and that ledger is what the apply's bound is read off, so
          # `repair_bound` is not forwarded here and the command refuses it.
          #
          # Its stdout goes to a file for the reason the apply's does: the
          # ledger's last line is JSON read back as data, and a merged stream can
          # interleave a log line into it once the untruncated per-case list runs
          # past a pipe buffer.
          if [ "${REPAIR_MODE}" != "apply" ]; then
            uv run fedcourts mirror-stored-documents > /tmp/mirror-dry.txt
            cat /tmp/mirror-dry.txt
          summarize /tmp/mirror-dry.txt
            echo "dry-run only; nothing written."
            exit 0
          fi
          uv run fedcourts mirror-stored-documents --apply \
            --max-cases "${REPAIR_BOUND}" > /tmp/mirror-apply.txt
          cat /tmp/mirror-apply.txt
          summarize /tmp/mirror-apply.txt
          # A case the store did not take exits green: the pass reports it
          # `unverified`, subtracts it from nothing, and the convergence check
          # below still passes because the apply's own `remaining` already
          # counted it. That is the one shape of this pass a reader can miss, so
          # ANY unverified case is annotated — not only a slice that verified
          # nothing, which would stay silent on a run that lost half its writes.
          if [ "$(ledger_field /tmp/mirror-apply.txt unverified)" != "[]" ]; then
            echo "::warning::the slice mirrored cases the store then served nothing for: $(ledger_field /tmp/mirror-apply.txt unverified). The write was withheld, failed, or landed without its manifest. Check the store address and the role's write access rather than re-dispatching; those cases stay at the head of the class."
          fi
          # The witness. The apply's ledger states the class it expects to leave
          # behind, and a re-read must find exactly that: the store writer is
          # best-effort, so a failed PUT leaves the case in the class and nothing
          # in the pointer commit below would ever notice. The dry run IS the
          # walk-only reading here — it writes nothing and takes no slice.
          uv run fedcourts mirror-stored-documents > /tmp/mirror-verify.txt
          cat /tmp/mirror-verify.txt
          summarize /tmp/mirror-verify.txt
          expected="$(ledger_field /tmp/mirror-apply.txt remaining)"
          found="$(ledger_field /tmp/mirror-verify.txt absent)"
          if [ "${found}" != "${expected}" ]; then
            echo "::error::apply did not converge — the re-read finds ${found} case(s) with no stored documents where the apply's ledger left ${expected} (a content-store write may have failed; see the warnings above)"
            exit 1
          fi
          # Blob before pointer commit, as everywhere. This pass writes only to
          # the content store — the blob's own rows are read and never touched —
          # so the index comes back byte-identical on every ordinary run and an
          # unchanged pointer is reported rather than failed.
          uv run fedcourts corpus-push
          git add corpus/corpus.db.ref
          if git diff --cached --quiet; then
            echo "Mirrored documents are in the content store; the index pointer is unchanged."
            exit 0
          fi
          git commit -m "repair: mirror blob-only documents to the content store"
          bash "${GITHUB_WORKSPACE}/.github/actions/commit-corpus-to-main/push_with_retry.sh" \
            "document mirror pointer"

      # Re-derive the interim baseline's arrival stamp. An interim event's
      # `opened_at` is the moment it declares — the day the application was
      # submitted to a Justice — and it is where provisioning cuts, so what is
      # stamped there decides what a cell for that moment may see.
      #
      # The defect is a stamp rule correlated with the outcome. The live poller
      # serves the UNRESOLVED slice, so a decided application has left the
      # rotation and is never re-polled: an event last polled before the arrival
      # read existed keeps the docketing date or nothing at all, and resolution
      # status therefore decides which reading a row carries, and any
      # retrospective interim population drawn from these events inherits that
      # conditioning. A forward cell is unaffected ONCE ITS ROW HAS BEEN
      # RE-POLLED — not by construction: a queued row not polled since the
      # arrival read shipped still carries the docketing stamp and is moved by
      # this apply, so the boundary runs through the forward stratum too. The
      # pass is deliberately not predicated on resolution for the same reason:
      # repairing only the decided half would condition the class all over again.
      #
      # Recoverable from the corpus alone, since the stored live-shaped snapshot
      # is the same payload the original ingest read — so this re-parses it with
      # the same pure parsers rather than re-fetching, and reaches no network at
      # all. It reads those snapshots, which under the corpus split live in the
      # content store rather than the blob, so it depends on the job-level
      # base URL, whose store segment is where they live, and a row with no
      # stored snapshot is counted and
      # reported rather than failed.
      #
      # Its write is a direct UPDATE of the index, so the pointer IS the witness
      # here and a plain pointer commit suffices — but it also re-mirrors the
      # touched cases' events, because provisioning reads events back through the
      # content store and a stale events.json would hand a cell the very stamp
      # this pass replaced.
      - name: Backfill the interim arrival stamps
        if: ${{ inputs.repair == 'arrival-backfill' && steps.dedupe-live-rows.outcome == 'success' }}
        # Network-bound like the response-signal backfill rather than the local
        # passes: one content-store read per candidate row, pooled by the shared
        # prefetch, over a class in the thousands. No upstream fetch and no
        # per-row recognition, so the walk is the whole cost.
        timeout-minutes: 20
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPAIR: ${{ inputs.repair }}
          REPAIR_MODE: ${{ inputs.repair_mode }}
          REPAIR_BOUND: ${{ inputs.repair_bound }}
        run: |
          set -euo pipefail
          # Validate the bound before anything else, including the corpus
          # guard: a dispatch that cannot legally apply should say so in
          # seconds, not after a full-population read of the content store.
          # `Validate the repair selector` duplicates it word for word so a bad
          # dispatch dies before any credential is minted; this copy is the one
          # of record, because the step has to be safe on whatever reaches it.
          # The refusal names the pass through `${REPAIR}` rather than a literal
          # so the two copies are identical as text, not merely equivalent once
          # expanded.
          if [ "${REPAIR_MODE}" = "apply" ] \
            && ! [[ "${REPAIR_BOUND}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::repair=${REPAIR} with repair_mode=apply needs repair_bound set to a positive integer — the count read off a previous dry-run dispatch's ledger. Re-dispatch with that number."
            exit 1
          fi
          # No committed pointer means no corpus — nothing to re-derive.
          if [ ! -f corpus/corpus.db.ref ]; then
            echo "no corpus pointer yet; skipping the arrival-stamp backfill"; exit 0
          fi
          gh auth setup-git # persist-credentials is false on checkout
          # Dry-run first, into the summary: this pass's ledger is the reading
          # the apply's bound comes from, and it must outlive the step log. Four
          # things a maintainer weighs there beyond the count.
          #
          # The **forward-exposure** figures — the entries a cell provisioned
          # today under the pre-repair stamp would admit, and the rows whose own
          # disposition is among them. The move histogram beside them is only
          # the *window*: a one-day move on a docket disposed of that day is
          # worse than a month over a quiet one. These are counterfactuals over
          # the corpus at the ledger's `corpus_vintage`, read with no date
          # bound, so they bound what the rule still exposes rather than
          # measuring what a committed cell saw; the committed-output
          # intersection printed with them is the subset worth checking against
          # a grading.
          #
          # The **residue** measurement, which is where conditioning survives:
          # the unrepaired rows whose surviving stamp still admits their own
          # disposition. A claim scoped to the repaired rows says nothing here.
          #
          # The **resolution split**, which says whether the correlation was
          # removed or merely shrunk, and the matched/blind denominators beside
          # it, which say what fraction carries the defect and how much of the
          # population no dispatch of this pass can reach at all.
          #
          # And the per-row fill list, which after the apply is the only record
          # of what each repaired cell's cutoff had been derived from — the
          # corpus holds the new stamp, and `event.yaml` is rewritten with it
          # the next time any cell runs over that event. That record belongs in
          # the freeze-record entry the apply owes, not only in a run summary
          # that expires with the run: the CLI prints it LAST, after every
          # aggregate and the JSON ledger, precisely so the head-first
          # truncation below drops the enumeration rather than the figures.
          # (On an apply this run is a receipt, not a reading.)
          # Bounded into the summary rather than tee'd whole. GitHub caps a step
          # summary at 1 MiB and discards it ENTIRELY above that, warning only —
          # and this pass's per-row lines plus its JSON ledger run to megabytes
          # over a five-figure class, so an untruncated tee would drop the one
          # surface the ledger was meant to outlive the run on. The full output
          # stays in the step log either way.
          summarize() {
            head -c 900000 "$1" >> "$GITHUB_STEP_SUMMARY"
            cat "$1"
          }
          uv run fedcourts backfill-arrival-stamps > /tmp/arrival-dry.txt 2>&1
          summarize /tmp/arrival-dry.txt
          if [ "${REPAIR_MODE}" != "apply" ]; then
            echo "dry-run only; nothing written."
            exit 0
          fi
          uv run fedcourts backfill-arrival-stamps --apply \
            --max-fills "${REPAIR_BOUND}" > /tmp/arrival-apply.txt 2>&1
          summarize /tmp/arrival-apply.txt
          # Blob before pointer commit, as everywhere. The index is where
          # `events.opened_at` lives, so unlike the three document passes the
          # pointer moving IS the witness that the write landed.
          uv run fedcourts corpus-push
          git add corpus/corpus.db.ref
          if git diff --cached --quiet; then
            echo "Arrival stamps already converged; nothing to persist."
            exit 0
          fi
          git commit -m "repair: converge corpus (interim arrival stamps)"
          bash "${GITHUB_WORKSPACE}/.github/actions/commit-corpus-to-main/push_with_retry.sh" \
            "arrival-stamp pointer"

      # Drop open SCOTUS merits events whose docket carries no cert grant, in
      # both stores. A merits event is born from a grant — every mint path
      # routes through `opens_merits_proceeding`, which requires the row's
      # `date_cert_granted` — so an open merits-stage event on a row whose
      # grant column is NULL is one no re-ingest or convergence pass
      # reproduces, and one nothing ever closes: merits detection reads the
      # same grant-gated columns, so it parks forever on the
      # listed-unforecastable triage surface rather than resolving. The shape
      # is what a live re-poll leaves behind when it stops reading a grant out
      # of the proceedings and overwrites the stored date with NULL.
      #
      # It needs no ordering against run-seed's scheduled merits-event mint,
      # which is why that sweep did not have to come along: the two populations
      # are disjoint by construction — the mint writes only where
      # `date_cert_granted` is non-NULL, and this removes only where it is NULL
      # — so neither can create or destroy the other's population.
      #
      # The ledger half is what shapes the commit. This deletes committed event
      # directories under `data/` as well as the corpus row, so it reads the
      # remote tip first — the skip guards read committed predict/evaluate
      # output that arrives by collect PR — and stages `data/` with the pointer
      # in ONE commit: an uncommitted ledger half strands a directory under an
      # id the corpus no longer carries, and no later pass re-detects it. An
      # event carrying committed predict/evaluate output, or a committed
      # outcome the open corpus row contradicts, is skipped and reported.
      - name: Remove ungranted merits phantoms
        # The dedupe gate is sharpest here of all the passes: whether an event
        # is a phantom is read off its row's grant column, and an unmerged twin
        # is a second row for the same petition — so the judgment, and the
        # deletion that follows it, must be made on the merged row.
        if: ${{ inputs.repair == 'merits-phantom-removal' && steps.dedupe-live-rows.outcome == 'success' }}
        # Local: both scans are committed ledger artifacts against corpus rows,
        # with no external-service loop, plus the blob push.
        timeout-minutes: 8
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPAIR: ${{ inputs.repair }}
          REPAIR_MODE: ${{ inputs.repair_mode }}
          REPAIR_BOUND: ${{ inputs.repair_bound }}
          REPAIR_OPTIONS: ${{ inputs.repair_options }}
        run: |
          set -euo pipefail
          # Validate the bound and the option vocabulary before anything else,
          # including the corpus guard: a dispatch that cannot legally apply
          # should say so in seconds, not after a full scan. `Validate the
          # repair selector` duplicates both word for word so a bad dispatch
          # dies before any credential is minted; this copy is the one of
          # record, because the step has to be safe on whatever reaches it.
          # Both refusals name the pass and its vocabulary through variables
          # rather than literals, so the two copies are identical as text and
          # not merely equivalent once expanded.
          #
          # Stricter than the command, which carries a default bound: a
          # deletion spanning the corpus and the committed ledger states the
          # count it is approving rather than inheriting one.
          if [ "${REPAIR_MODE}" = "apply" ] \
            && ! [[ "${REPAIR_BOUND}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::repair=${REPAIR} with repair_mode=apply needs repair_bound set to a positive integer — the count read off a previous dry-run dispatch's ledger. Re-dispatch with that number."
            exit 1
          fi
          accepted_options="include-failed-attempts"
          include_failed_attempts=0
          option_malformed=0
          while IFS= read -r option; do
            [ -n "$option" ] || continue
            case " ${accepted_options} " in
              *" ${option} "*) ;;
              *)
                echo "::error::repair=${REPAIR} does not accept the option '${option}' — it accepts: ${accepted_options:-none}."
                option_malformed=1
                continue ;;
            esac
            case "$option" in
              include-failed-attempts) include_failed_attempts=1 ;;
            esac
          done < <(printf '%s\n' "${REPAIR_OPTIONS}" | tr -s ', \t\r' '\n')
          if [ "$option_malformed" -ne 0 ]; then
            echo "::error::refusing the whole option list — correct the switches above and re-dispatch."
            exit 1
          fi
          # No committed pointer means no corpus — nothing to remove.
          if [ ! -f corpus/corpus.db.ref ]; then
            echo "no corpus pointer yet; skipping the merits-phantom removal"; exit 0
          fi
          gh auth setup-git # persist-credentials is false on checkout
          # The pass reads committed ledger artifacts out of `data/` and
          # deletes beside them, and this checkout is only as fresh as the
          # sync — read the remote tip first so the skip guards see every
          # collect PR merged in the gap. Fast-forward only: if an earlier
          # step's push retries were exhausted, its local commit is unpushed
          # while its corpus mutations survive in the workspace DB, and a hard
          # reset would publish that split.
          git fetch origin "$GITHUB_REF_NAME"
          git merge --ff-only FETCH_HEAD
          # `--include-failed-attempts` rides both invocations below or
          # neither, so the ledger the maintainer reads and the removal that
          # follows describe the same population. It is a trade rather than a
          # tidy-up: those records document real spend on an event that names
          # nothing the docket supports, and removing them buys a ledger with
          # no dangling phantom paths at the cost of that failure history. The
          # condition stays strict either way: every file under `predictions/`
          # must be named `attempt.json` and there must be no `evaluations/`
          # directory, so a `usage.json` or `retrieval_log.json` the harness
          # left beside an attempt record keeps the event skipped. Declared
          # outside the guard so the expansion is total under `set -u`.
          attempt_args=()
          if [ "$include_failed_attempts" -eq 1 ]; then
            attempt_args+=(--include-failed-attempts)
          fi
          # Dry-run first, into the summary: the removal-and-skip ledger — every
          # event removed and every skip with its reason — is the reading the
          # apply's bound comes from, and a deletion's record must outlive the
          # step log. (On an apply this run is a receipt, not a reading.)
          uv run fedcourts remove-ungranted-merits-events "${attempt_args[@]}" 2>&1 \
            | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "${REPAIR_MODE}" != "apply" ]; then
            echo "dry-run only; nothing written."
            exit 0
          fi
          uv run fedcourts remove-ungranted-merits-events "${attempt_args[@]}" \
            --apply --max-removals "${REPAIR_BOUND}" 2>&1 \
            | tee -a "$GITHUB_STEP_SUMMARY"
          # Blob before pointer commit, as everywhere. An apply that pushed the
          # blob but failed before the commit publishes nothing: readers resolve
          # the committed pointer, and the next dispatch re-detects from the
          # still-committed ledger.
          uv run fedcourts corpus-push
          # `git add data/` stages the deleted event directories along with the
          # pointer — one commit, so the ledger and the corpus it must match
          # land together or not at all. The directory guard is the add passes'
          # shape (on a tip without `data/` an unguarded add fails under
          # `set -euo pipefail` AFTER the blob push), and it cannot fail open
          # here the way it could if this deleted the tree: what it removes is
          # individual event directories out of the whole case tree, so a
          # removal with anything to stage always leaves a `data/` behind it.
          git add corpus/corpus.db.ref
          if [ -d data ]; then
            git add data/
          fi
          if git diff --cached --quiet; then
            echo "No ungranted merits phantoms to remove; nothing to persist."
            exit 0
          fi
          git commit -m "repair: converge corpus (ungranted merits phantoms)"
          bash "${GITHUB_WORKSPACE}/.github/actions/commit-corpus-to-main/push_with_retry.sh" \
            "merits-phantom pointer"

      # Converge stored disposition labels against the current classifier.
      # Events carrying committed predict/evaluate output are held back:
      # relabelling under a scored evaluation would silently restate what was
      # graded, so the ledger names them and the sweep moves on. Reaching them
      # takes the `include-scored` option.
      #
      # The relabel is only half the repair. `regrade-stale` recomputes graded
      # fields under an outcome rather than moving one, so it is the
      # follow-through, not an alternative route: labels first, then a
      # `regrade-stale` dispatch naming the affected judge lines — three per
      # event rather than one per evaluation. One pass per dispatch means that
      # follow-through is a second dispatch rather than a second step, which is
      # what makes it visible: the re-grade backlog a relabel owes is the
      # maintainer's to schedule.
      - name: Converge disposition labels
        if: ${{ inputs.repair == 'disposition-convergence' && steps.dedupe-live-rows.outcome == 'success' }}
        # The scan is local — committed outcome labels against corpus rows —
        # with the apply's writes under `data/`.
        timeout-minutes: 15
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPAIR: ${{ inputs.repair }}
          REPAIR_MODE: ${{ inputs.repair_mode }}
          REPAIR_BOUND: ${{ inputs.repair_bound }}
          REPAIR_OPTIONS: ${{ inputs.repair_options }}
        run: |
          set -euo pipefail
          # Validate the bound and the option vocabulary before anything else,
          # including the corpus guard: a dispatch that cannot legally apply
          # should say so in seconds, not after a full scan. The command
          # refuses an unbounded apply on its own too; this refusal is the one
          # with the maintainer's procedure in it. `Validate the repair
          # selector` duplicates it word for word so a bad dispatch dies before
          # any credential is minted; this copy is the one of record, because
          # the step has to be safe on whatever reaches it. Both refusals name
          # the pass and its vocabulary through variables rather than literals,
          # so the two copies are identical as text and not merely equivalent
          # once expanded.
          if [ "${REPAIR_MODE}" = "apply" ] \
            && ! [[ "${REPAIR_BOUND}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::repair=${REPAIR} with repair_mode=apply needs repair_bound set to a positive integer — the count read off a previous dry-run dispatch's ledger. Re-dispatch with that number."
            exit 1
          fi
          accepted_options="include-scored"
          include_scored=0
          option_malformed=0
          while IFS= read -r option; do
            [ -n "$option" ] || continue
            case " ${accepted_options} " in
              *" ${option} "*) ;;
              *)
                echo "::error::repair=${REPAIR} does not accept the option '${option}' — it accepts: ${accepted_options:-none}."
                option_malformed=1
                continue ;;
            esac
            case "$option" in
              include-scored) include_scored=1 ;;
            esac
          done < <(printf '%s\n' "${REPAIR_OPTIONS}" | tr -s ', \t\r' '\n')
          if [ "$option_malformed" -ne 0 ]; then
            echo "::error::refusing the whole option list — correct the switches above and re-dispatch."
            exit 1
          fi
          # `include-scored` widens the sweep onto events already carrying
          # predict/evaluate output and owes a re-grade for each relabel, so it
          # must carry the bound in EVERY mode — not the apply-only rule above.
          # A dry run that widens the ledger is where the decision to take on
          # that backlog is actually made, so the number is stated there too;
          # what the apply is checked against is the widened dry-run's own
          # relabel count, not the plain run's held-back lines, which bound the
          # population rather than count the rewrites.
          if [ "$include_scored" -eq 1 ] \
            && ! [[ "${REPAIR_BOUND}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::the include-scored option needs repair_bound set to a positive integer — relabelling a graded cell takes on a re-grade backlog, so its size is stated up front in dry-run as much as in apply. Read the held-back lines off a plain dry-run dispatch's ledger."
            exit 1
          fi
          # No committed pointer means no corpus — nothing to converge against.
          if [ ! -f corpus/corpus.db.ref ]; then
            echo "no corpus pointer yet; skipping disposition convergence"; exit 0
          fi
          gh auth setup-git # persist-credentials is false on checkout
          # The sweep reads committed ledger artifacts out of `data/` and
          # rewrites beside them, so it needs the remote tip, not this
          # checkout's — the scored-cell holdback is keyed on grades that
          # arrive by collect PR. Fast-forward only, for the merits-phantom
          # pass's reason: an unpushed local commit over live corpus mutations
          # must fail this closed rather than be reset away.
          git fetch origin "$GITHUB_REF_NAME"
          git merge --ff-only FETCH_HEAD
          # `--include-scored` rides both invocations below or neither, so the
          # ledger the maintainer reads and the rewrite that follows describe
          # the same population. Without it the sweep converges only events
          # carrying no committed predict/evaluate output: rewriting a graded
          # cell's label would move what a published standing was computed from
          # while the standing itself sat still, so those events are reported
          # instead. With it they are in, which is a bounded decision the
          # validation above makes the maintainer state.
          scored_args=()
          if [ "$include_scored" -eq 1 ]; then
            scored_args+=(--include-scored)
          fi
          # Dry-run first, into the summary: the relabel ledger is the reading
          # the apply's bound comes from, and it must outlive the step log.
          # (On an apply this run is a receipt, not a reading — nobody reads it
          # before the rewrite.)
          uv run fedcourts converge-disposition-labels "${scored_args[@]}" 2>&1 \
            | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "${REPAIR_MODE}" != "apply" ]; then
            echo "dry-run only; nothing written."
            exit 0
          fi
          uv run fedcourts converge-disposition-labels "${scored_args[@]}" \
            --apply --max-relabels "${REPAIR_BOUND}" 2>&1 \
            | tee -a "$GITHUB_STEP_SUMMARY"
          # Blob before pointer commit, as everywhere.
          uv run fedcourts corpus-push
          # The rewrites land in `data/` (`outcome.json`); stage them with the
          # pointer so the ledger and the corpus it must match move together
          # or not at all.
          git add corpus/corpus.db.ref
          if [ -d data ]; then
            git add data/
          fi
          if git diff --cached --quiet; then
            echo "Disposition labels already converged; nothing to persist."
            exit 0
          fi
          git commit -m "repair: converge corpus (disposition labels)"
          bash "${GITHUB_WORKSPACE}/.github/actions/commit-corpus-to-main/push_with_retry.sh" \
            "disposition-label pointer"

      # Converge the stored moment of a declared-moment event onto the moment
      # its id declares. The id is the key and the declared-moments table the
      # authority, so a stored moment that disagrees is a stale copy — the shape
      # an application baseline carries when the application-baseline relabel
      # (`relabel-application-events`) moved it off the cert petition id with
      # the cert stage's `distribution` moment carried onto it. The relabel
      # re-derives the moment, so no write path produces the shape and the
      # population is a finite residue; a decided application has left the
      # live rotation, so no channel re-reads it and nothing else converges it.
      #
      # Two stores, one commit. The pass re-stamps the corpus row (a direct
      # UPDATE that re-mirrors the touched cases' events into the content
      # store) AND the ledger `event.yaml` written from it, scanning each store
      # on its own. The ledger half lands in `data/`, so it is staged with the
      # pointer: a ledger file left
      # uncommitted would disagree with the corpus it was just converged onto,
      # and the next dry run would find it again. An event carrying committed
      # predict/evaluate output is held back in both stores and reported —
      # moving its moment moves scored cells between moment strata — as are
      # entry-pinned rows and rows off the declared moment's stage; there is no
      # option that widens onto them.
      - name: Converge event moments
        if: ${{ inputs.repair == 'moment-convergence' && steps.dedupe-live-rows.outcome == 'success' }}
        # Local, like the disposition sweep: an indexed read of the events
        # table and a walk of committed `event.yaml` files, with the apply's
        # writes under `data/`, plus the blob push.
        timeout-minutes: 15
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPAIR: ${{ inputs.repair }}
          REPAIR_MODE: ${{ inputs.repair_mode }}
          REPAIR_BOUND: ${{ inputs.repair_bound }}
        run: |
          set -euo pipefail
          # Validate the bound before anything else, including the corpus
          # guard: a dispatch that cannot legally apply should say so in
          # seconds, not after a full scan. The command refuses an unbounded
          # apply on its own too; this refusal is the one with the maintainer's
          # procedure in it. `Validate the repair selector` duplicates it word
          # for word so a bad dispatch dies before any credential is minted;
          # this copy is the one of record, because the step has to be safe on
          # whatever reaches it. The refusal names the pass through `${REPAIR}`
          # rather than a literal so the two copies are identical as text, not
          # merely equivalent once expanded.
          if [ "${REPAIR_MODE}" = "apply" ] \
            && ! [[ "${REPAIR_BOUND}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::repair=${REPAIR} with repair_mode=apply needs repair_bound set to a positive integer — the count read off a previous dry-run dispatch's ledger. Re-dispatch with that number."
            exit 1
          fi
          # No committed pointer means no corpus — nothing to converge.
          if [ ! -f corpus/corpus.db.ref ]; then
            echo "no corpus pointer yet; skipping moment convergence"; exit 0
          fi
          gh auth setup-git # persist-credentials is false on checkout
          # The sweep reads committed ledger artifacts out of `data/` and
          # rewrites beside them, so it needs the remote tip, not this
          # checkout's — the scored-cell holdback is keyed on output that
          # arrives by collect PR. Fast-forward only, for the merits-phantom
          # pass's reason: an unpushed local commit over live corpus mutations
          # must fail this closed rather than be reset away.
          git fetch origin "$GITHUB_REF_NAME"
          git merge --ff-only FETCH_HEAD
          # Dry-run first, into the summary: the re-stamp ledger — corpus rows
          # and ledger files counted apart, each skip with its reason — is the
          # reading the apply's bound comes from, and it must outlive the step
          # log. The bound counts both stores together. (On an apply this run
          # is a receipt, not a reading.)
          uv run fedcourts converge-event-moments 2>&1 \
            | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "${REPAIR_MODE}" != "apply" ]; then
            echo "dry-run only; nothing written."
            exit 0
          fi
          uv run fedcourts converge-event-moments \
            --apply --max-rewrites "${REPAIR_BOUND}" 2>&1 \
            | tee -a "$GITHUB_STEP_SUMMARY"
          # Blob before pointer commit, as everywhere. An apply that pushed the
          # blob but failed before the commit publishes nothing: readers resolve
          # the committed pointer, and the next dispatch re-detects both halves —
          # the corpus rows from the old blob that pointer still names, the
          # ledger files from the still-committed `data/`. The one write the
          # pointer does not fence is the content-store events mirror the apply
          # already refreshed; it runs ahead of the pointer until that re-run
          # converges, as on the arrival back-fill.
          uv run fedcourts corpus-push
          # The ledger half lands in `data/` (`event.yaml`); stage it with the
          # pointer so the ledger and the corpus it must match move together
          # or not at all.
          git add corpus/corpus.db.ref
          if [ -d data ]; then
            git add data/
          fi
          if git diff --cached --quiet; then
            echo "Event moments already converged; nothing to persist."
            exit 0
          fi
          git commit -m "repair: converge corpus (event moments)"
          bash "${GITHUB_WORKSPACE}/.github/actions/commit-corpus-to-main/push_with_retry.sh" \
            "event-moment pointer"

      # Restore the derived sampling weight on the legacy denial-sampling frame's
      # latched-down rows: grid denials genuinely inside sampled ranges that a
      # channel writing with certainty min-latched to 1, so the nine petitions
      # each stands for are represented by nobody. The population and the
      # magnitudes it moves are pre-registered in `docs/freeze-record.md`, which
      # is what makes this a deliberate re-weighting of the frame rather than a
      # convergence sweep: it moves published weighted figures, so the dry-run
      # ledger is read by a maintainer against that entry before any write.
      #
      # The write is a direct UPDATE that bypasses the column's MIN latch — the
      # stored weight only ever latches downward, an inclusion probability only
      # ever learned toward certainty — so the same 1 -> 10 routed through the
      # upsert path would report success having changed nothing. The guard that replaces the latch is the command's own
      # and is narrower than it: a row whose block the corpus now stores row by
      # row derives 1 and is never selected, so the pass cannot invent a petition
      # the corpus already counts. Rows the rule reaches OUTSIDE the registered
      # cells are reported and left alone — a different population needs its own
      # entry — which is what makes a widened predicate visible in the ledger.
      #
      # Convergence is witnessed inside the command rather than by a grep here:
      # the apply re-runs its own selection and exits non-zero if anything
      # remains, so a write that reached fewer rows than the ledger named stops
      # the job before the blob is pushed. Corpus-only, so a pointer-only commit
      # and no fetch/ff-only — nothing here reads committed `data/`.
      - name: Repair the sampled-frame weights
        if: ${{ inputs.repair == 'sampled-frame-weight-repair' && steps.dedupe-live-rows.outcome == 'success' }}
        # Local, like the docket-marking convergence: an indexed read of the live
        # slice and a bounded UPDATE against the pulled blob, plus the blob push.
        # No content-store read at all — every column the rule reads is in the
        # index. Sized for an apply, which selects three times: the dry-run
        # ledger, the write's own selection, and the convergence witness after it.
        timeout-minutes: 8
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPAIR: ${{ inputs.repair }}
          REPAIR_MODE: ${{ inputs.repair_mode }}
          REPAIR_BOUND: ${{ inputs.repair_bound }}
        run: |
          set -euo pipefail
          # Validate the bound before anything else, including the corpus
          # guard: a dispatch that cannot legally apply should say so in
          # seconds, not after a full scan. The command refuses an unbounded
          # apply on its own too; this refusal is the one with the maintainer's
          # procedure in it. `Validate the repair selector` duplicates it word
          # for word so a bad dispatch dies before any credential is minted;
          # this copy is the one of record, because the step has to be safe on
          # whatever reaches it. The refusal names the pass through `${REPAIR}`
          # rather than a literal so the two copies are identical as text, not
          # merely equivalent once expanded.
          if [ "${REPAIR_MODE}" = "apply" ] \
            && ! [[ "${REPAIR_BOUND}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::repair=${REPAIR} with repair_mode=apply needs repair_bound set to a positive integer — the count read off a previous dry-run dispatch's ledger. Re-dispatch with that number."
            exit 1
          fi
          # No committed pointer means no corpus — nothing to repair.
          if [ ! -f corpus/corpus.db.ref ]; then
            echo "no corpus pointer yet; skipping the sampled-frame weight repair"; exit 0
          fi
          gh auth setup-git # persist-credentials is false on checkout
          # Dry-run first, into the summary: the per-row ledger — each case's
          # old and new weight, its walk cell and its block's occupancy, beside
          # any row the rule reaches outside the registered cells — is what the
          # apply is decided against, and it must outlive the step log. It is
          # also the record of a re-weighting that moves published figures, so
          # it is written down whichever mode ran. (On an apply this run is a
          # receipt, not a reading: nobody reads it before the write.)
          uv run fedcourts repair-sampled-frame-weights 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "${REPAIR_MODE}" != "apply" ]; then
            echo "dry-run only; nothing written."
            exit 0
          fi
          uv run fedcourts repair-sampled-frame-weights --apply \
            --max-repairs "${REPAIR_BOUND}" 2>&1 \
            | tee -a "$GITHUB_STEP_SUMMARY"
          # Blob before pointer commit, as everywhere.
          uv run fedcourts corpus-push
          git add corpus/corpus.db.ref
          if git diff --cached --quiet; then
            echo "Sampled-frame weights already repaired; nothing to persist."
            exit 0
          fi
          git commit -m "repair: converge corpus (sampled-frame weights)"
          bash "${GITHUB_WORKSPACE}/.github/actions/commit-corpus-to-main/push_with_retry.sh" \
            "sampled-frame-weight pointer"

      # Re-derive the interim `amicus_briefs` column under the widened
      # submitted-form reading with the end-of-day cut, and re-freeze the
      # committed interim outcomes that column was frozen onto. The retrospective
      # data motion the widened reading scoped out of itself, pre-registered in
      # `docs/freeze-record.md` (the 2026-09-10 interim-amicus-reading entry,
      # which pre-computes the affected set). The reading is live for every
      # application frozen after it merged; this pass corrects the rows frozen
      # under the old one, so it presupposes that reading is promoted — it rides
      # the same promotion batch.
      #
      # Two writes in one pass. The corpus write is a **direct UPDATE that
      # bypasses the max latch** (the sampled-frame-weight repair's shape): the
      # end-of-day cut lowers a resolved application's count, which the max latch
      # — built to stop a degraded payload lowering a stored count — would reject
      # as a silent no-op through the upsert path. Only resolved applications (a
      # readable disposition date) are touched; an open one is left to the live
      # channel, which polls it under the same reading. The re-freeze write lands
      # in committed `data/` (`outcome.json`), rewriting only
      # `interim_signals.amicus_briefs` and never a `prediction.json`
      # `context.amicus_briefs` — the prediction-time snapshot is frozen by
      # design. So this reads committed `data/` and needs the remote tip (fetch +
      # ff-only, the disposition-convergence pattern), and stages the pointer and
      # the ledger together so the corpus and the outcomes it must match move as
      # one commit.
      #
      # The control is idempotence: re-dispatch this pass in `dry-run` after the
      # apply and it reports `total_changes = 0` unless a new application
      # resolved. There is no incumbent-reading control to run, because the
      # reading is fixed in code rather than selected per dispatch.
      - name: Re-derive amicus counts and re-freeze the interim outcomes
        if: ${{ inputs.repair == 'amicus-rederive' && steps.dedupe-live-rows.outcome == 'success' }}
        # The scan is local — the interim application slice against the pulled
        # blob, one snapshot read per resolved application, and committed
        # `outcome.json` against the re-derived counts — with the apply's writes
        # to the corpus index and under `data/`.
        timeout-minutes: 15
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPAIR: ${{ inputs.repair }}
          REPAIR_MODE: ${{ inputs.repair_mode }}
          REPAIR_BOUND: ${{ inputs.repair_bound }}
        run: |
          set -euo pipefail
          # Validate the bound before anything else, including the corpus guard:
          # a dispatch that cannot legally apply should say so in seconds, not
          # after a full scan. The command refuses an unbounded apply on its own
          # too; this refusal is the one with the maintainer's procedure in it.
          # `Validate the repair selector` duplicates it word for word so a bad
          # dispatch dies before any credential is minted; this copy is the one
          # of record, because the step has to be safe on whatever reaches it.
          # The refusal names the pass through `${REPAIR}` rather than a literal
          # so the two copies are identical as text, not merely equivalent once
          # expanded.
          if [ "${REPAIR_MODE}" = "apply" ] \
            && ! [[ "${REPAIR_BOUND}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::repair=${REPAIR} with repair_mode=apply needs repair_bound set to a positive integer — the count read off a previous dry-run dispatch's ledger. Re-dispatch with that number."
            exit 1
          fi
          # No committed pointer means no corpus — nothing to re-derive.
          if [ ! -f corpus/corpus.db.ref ]; then
            echo "no corpus pointer yet; skipping the amicus re-derivation"; exit 0
          fi
          gh auth setup-git # persist-credentials is false on checkout
          # The re-freeze reads committed `outcome.json` out of `data/` and
          # rewrites beside them, so it needs the remote tip, not this checkout's
          # — an interim outcome minted by a collect PR since the last sync must
          # be visible. Fast-forward only, for the passes' reason: an unpushed
          # local commit over live corpus mutations fails this closed rather than
          # being reset away.
          git fetch origin "$GITHUB_REF_NAME"
          git merge --ff-only FETCH_HEAD
          # Dry-run first, into the summary: the ledger — each resolved
          # application whose count moves old->new, each re-frozen outcome, and
          # the frozen interim-amicus distribution across the committed worklist
          # (the shape the freeze-record entry pre-computes) — is the reading the
          # apply's bound comes from, and it must outlive the step log. It is
          # also the record of a re-derivation that moves a scored claim's
          # resolution end, so it is written down whichever mode ran. (On an
          # apply this run is a receipt, not a reading.) Both runs report the
          # distribution as FOUND, before their own writes, so the apply's copy
          # is the pre-apply shape rather than the converged one — the control
          # re-dispatch below is what shows the post-apply state.
          uv run fedcourts rederive-amicus-briefs 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "${REPAIR_MODE}" != "apply" ]; then
            echo "dry-run only; nothing written."
            exit 0
          fi
          uv run fedcourts rederive-amicus-briefs --apply \
            --max-changes "${REPAIR_BOUND}" 2>&1 \
            | tee -a "$GITHUB_STEP_SUMMARY"
          # Blob before pointer commit, as everywhere.
          uv run fedcourts corpus-push
          # The re-freeze lands in `data/` (`outcome.json`); stage it with the
          # pointer so the corpus and the outcomes it must match move together or
          # not at all.
          git add corpus/corpus.db.ref
          if [ -d data ]; then
            git add data/
          fi
          if git diff --cached --quiet; then
            echo "Amicus counts already re-derived and outcomes re-frozen; nothing to persist."
            exit 0
          fi
          git commit -m "repair: re-derive amicus counts and re-freeze interim outcomes"
          bash "${GITHUB_WORKSPACE}/.github/actions/commit-corpus-to-main/push_with_retry.sh" \
            "amicus-rederive pointer"

      # Trailing, NON-BLOCKING data-validation, as on run-pull's and run-seed's
      # writer jobs: produce the correctness verdict on the now-current corpus
      # and publish it for run-ops to present and escalate — loud-not-fatal by
      # contract.
      #
      # It matters more here than the cadence alone suggests, because a pass
      # can legitimately shrink the corpus: the merits-phantom removal deletes
      # rows, and the verdict this publishes is the next run's monotonic
      # row-count baseline. Republishing it after the pass is what keeps
      # run-seed's next verdict from reading a deliberate removal as a corpus
      # shrink.
      #
      # `continue-on-error` protects the step from its OWN failure; without a
      # status function the implicit `success()` still lets any unrelated
      # upstream failure skip it — so a refused pass would withhold the corpus
      # data-health reading, which is exactly when it is most wanted.
      # `!cancelled()` restores it — NOT `always()`, because a cancelled job
      # (the hard timeout-minutes kill, an OOM) is stopped mid-step, and a
      # verdict over that reports a corpus state nobody committed. The
      # corpus-pull gate is the same argument applied to the corpus on disk: a
      # run that failed before the pull has no corpus, and `validate-corpus` is
      # graceful about that — it returns a *skipped* verdict, which would
      # replace the last real reading with a blank one and leave the next run
      # no baseline.
      #
      # One case the gates do NOT cover, and deliberately: a pass that pushed
      # the blob and then failed before its pointer commit holds rows no commit
      # covers, and this step still publishes a verdict over them. That is more
      # reachable here than on run-seed, precisely because these passes fail
      # hard rather than absorbing — so read a verdict published by a red run
      # as describing the runner's blob, not the committed corpus. Closing it
      # means gating this step on every pass's outcome, which is a wider change
      # than this one.
      - name: Produce + publish the corpus validation verdict
        if: ${{ !cancelled() && steps.corpus-pull.outcome == 'success' }}
        continue-on-error: true
        uses: ./.github/actions/publish-corpus-verdict
        with:
          # On the OCR path this step can start past the opening token's 1h
          # life, and every failure mode below it is swallowed (the fetch, the
          # push retries, and this step's own continue-on-error) — an expired
          # token here publishes nothing and looks green. Ride the fresh OCR
          # mint where it exists; a skipped step's output is the empty string,
          # so every other pass falls through to the opening token.
          token: ${{ steps.app-token-ocr.outputs.token || steps.app-token.outputs.token }}

  # The vote writer passes, in their own job because their risk class is
  # neither of the other two: they READ the corpus (one column, each case's
  # docket number, which is how a ledger case is found in the Court's
  # documents), FETCH from supremecourt.gov, and WRITE only committed
  # `outcome.json` files. So the corpus comes through the read-only role, like
  # every corpus consumer's, and no step here holds a credential that can
  # write the corpus remote or the content store; the App token pushes the
  # `data/` commit, as on the re-grade.
  #
  # `opinion-votes` stamps merits outcomes from their opinion's syllabus
  # lineup (`fedcourts stamp-opinion-votes`); `order-votes` stamps cert and
  # interim outcomes from the notations and writing headers of the order that
  # disposed of them (`fedcourts stamp-order-votes`). Two selector values, not
  # one pass with a mode, because a dispatch reads one ledger and applies one
  # bound: the two sources' populations, fetches and record shapes share
  # nothing but the stamping.
  votes:
    needs: [validate]
    if: ${{ inputs.repair == 'opinion-votes' || inputs.repair == 'order-votes' }}
    # An apply commits to `main` on the same push path as the corpus writers,
    # so it joins their lock rather than racing their pointer commits. A dry
    # run writes nothing and pushes nothing, so it takes a throwaway group
    # instead: holding the shared lock for a read-only fetch campaign would
    # queue the scheduled windows behind it, and GitHub keeps only one pending
    # run per group, so a second arrival would evict a production window. A
    # skipped job takes the throwaway group too, for the corpus job's reason.
    concurrency:
      group: ${{ (inputs.repair == 'opinion-votes' || inputs.repair == 'order-votes') && inputs.repair_mode == 'apply' && 'corpus-write' || format('corpus-write-skip-{0}', github.run_id) }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    # The pass's own 45-minute cap plus setup, the read-only corpus pull and
    # the push.
    timeout-minutes: 60
    environment: prod
    permissions:
      contents: read
      id-token: write # assume the read-only AWS role to pull the corpus
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Sync the working tree to the current tip of the default branch
        # Same stale-base hazard as the corpus job: a run that queued behind a
        # writer on the shared lock checked out a frozen sha, and the outcomes
        # being stamped arrive by the writers' own commits. The repo is
        # public, so this read-only fetch needs no credentials.
        run: |
          set -euo pipefail
          git fetch origin "${GITHUB_REF_NAME}"
          git reset --hard FETCH_HEAD

      - uses: ./.github/actions/setup-python-env

      # The committed pointer's blob, read-only: the writer reads each case's
      # docket number from it and writes nothing back.
      - uses: ./.github/actions/corpus-readonly
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME_READONLY }}
          aws-region: ${{ vars.AWS_REGION }}
          corpus-base-url: ${{ vars.CORPUS_BASE_URL }}

      # Read each outcome's record off the Court's documents and stamp
      # `votes`, `vote_provenance` and `writing_roles` onto it. An outcome
      # carrying the same record is left alone, which makes a re-run the
      # control; one carrying a different record is held back and reported
      # unless `replace-differing` is set.
      #
      # One invocation per dispatch, not a dry run and then the apply: each
      # run fetches every listing and document it reads, so a leading dry run
      # would double the pass's traffic to the Court's site for a ledger the
      # apply prints anyway. The ledger the bound is read from is the previous
      # dispatch's dry run, as everywhere; an apply whose count exceeds it is
      # refused whole, and so is one whose listings could not all be read.
      #
      # No credential reaches this step. The stamper parses pages fetched from
      # the Court's site for up to 45 minutes, so the App token is not minted
      # until it has exited, and only on an apply: it rides only the commit
      # step's env. That separates the token from the stamper in time, not by
      # a process boundary — the two run as the same user on the same runner.
      # The read-only AWS session the corpus pull assumed is blanked here too,
      # and so is the OIDC request pair: the job holds `id-token: write` under
      # `prod`, whose trust the read-write corpus role also names, so a step
      # that could request a token could assume more than the session it was
      # given. The stamper opens the pulled local index and makes no S3 call,
      # and the step asserts both properties before it runs anything.
      - name: Stamp vote records
        timeout-minutes: 45
        env:
          AWS_ACCESS_KEY_ID: ""
          AWS_SECRET_ACCESS_KEY: ""
          AWS_SESSION_TOKEN: ""
          ACTIONS_ID_TOKEN_REQUEST_URL: ""
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
          REPAIR: ${{ inputs.repair }}
          REPAIR_MODE: ${{ inputs.repair_mode }}
          REPAIR_BOUND: ${{ inputs.repair_bound }}
          REPAIR_OPTIONS: ${{ inputs.repair_options }}
        run: |
          set -euo pipefail
          # The credential tripwire, as on the summarize generate job: no AWS
          # credential and no way to mint one may reach the stamper.
          if env | grep -E '^AWS_' | grep -E '=.+' | grep -qvE '^AWS_(REGION|DEFAULT_REGION)='; then
            echo "::error::AWS credential variables reached the vote stamper"
            exit 1
          fi
          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "::error::OIDC token minting is reachable from the vote stamper"
            exit 1
          fi
          # Validate the bound and the option vocabulary before anything else:
          # a dispatch that cannot legally apply should say so in seconds, not
          # after a fetch campaign. `Validate the repair selector` duplicates
          # both refusals word for word so a bad dispatch dies before any
          # credential is minted; these copies are the ones of record.
          if [ "${REPAIR_MODE}" = "apply" ] \
            && ! [[ "${REPAIR_BOUND}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::repair=${REPAIR} with repair_mode=apply needs repair_bound set to a positive integer — the count read off a previous dry-run dispatch's ledger. Re-dispatch with that number."
            exit 1
          fi
          accepted_options="replace-differing"
          replace_differing=0
          option_malformed=0
          while IFS= read -r option; do
            [ -n "$option" ] || continue
            case " ${accepted_options} " in
              *" ${option} "*) ;;
              *)
                echo "::error::repair=${REPAIR} does not accept the option '${option}' — it accepts: ${accepted_options:-none}."
                option_malformed=1
                continue ;;
            esac
            case "$option" in
              replace-differing) replace_differing=1 ;;
            esac
          done < <(printf '%s\n' "${REPAIR_OPTIONS}" | tr -s ', \t\r' '\n')
          if [ "$option_malformed" -ne 0 ]; then
            echo "::error::refusing the whole option list — correct the switches above and re-dispatch."
            exit 1
          fi
          # Stamp on top of the remote tip, not this checkout's: the outcomes
          # being stamped arrive by the writers' own commits. The repo is
          # public, so this read-only fetch needs no credentials. Fast-forward
          # only, so an unpushed local commit fails this closed.
          git fetch origin "$GITHUB_REF_NAME"
          git merge --ff-only FETCH_HEAD
          write_args=()
          if [ "${REPAIR_MODE}" = "apply" ]; then
            write_args+=(--apply --max-stamps "${REPAIR_BOUND}")
          fi
          if [ "$replace_differing" -eq 1 ]; then
            write_args+=(--replace-differing)
          fi
          if [ "${REPAIR}" = "opinion-votes" ]; then
            uv run fedcourts stamp-opinion-votes "${write_args[@]}" 2>&1 \
              | tee -a "$GITHUB_STEP_SUMMARY"
          else
            uv run fedcourts stamp-order-votes "${write_args[@]}" 2>&1 \
              | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          if [ "${REPAIR_MODE}" != "apply" ]; then
            echo "dry-run only; nothing written."
          fi

      # The write credential exists only on an apply, and only from here on,
      # after the stamper has exited: minted, handed to the git identity, and
      # held by the commit step, none of which parses anything fetched.
      - name: Mint app token
        if: ${{ inputs.repair_mode == 'apply' }}
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.DATA_APP_CLIENT_ID }}
          private-key: ${{ secrets.DATA_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Configure git identity
        if: ${{ inputs.repair_mode == 'apply' }}
        uses: ./.github/actions/configure-git-identity
        with:
          token: ${{ steps.app-token.outputs.token }}
          app-slug: ${{ steps.app-token.outputs.app-slug }}

      # The only step holding a credential that can write: it stages what the
      # stamp step wrote, commits it and pushes. It parses nothing fetched.
      - name: Commit the stamped outcomes
        if: ${{ inputs.repair_mode == 'apply' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPAIR: ${{ inputs.repair }}
        run: |
          set -euo pipefail
          gh auth setup-git # persist-credentials is false on checkout
          # Stage the stamped outcomes only, never a blanket `git add data/`:
          # this commit carries no corpus pointer, and the pass writes nothing
          # but `outcome.json`, so anything else changed under `data/` is not
          # this pass's to publish.
          git add -- ':(glob)data/cases/*/*/events/*/outcome.json'
          if git diff --cached --quiet; then
            echo "Every outcome already carries its record; nothing to persist."
            exit 0
          fi
          git commit -m "repair: stamp vote records (${REPAIR})"
          bash "${GITHUB_WORKSPACE}/.github/actions/commit-corpus-to-main/push_with_retry.sh" \
            "vote-record ledger"

  # The interim-docket back-fill (`fedcourts backfill-applications`): one
  # closed Term's application serials, enumerated upstream and landed through
  # the live channel's own ingest seam wherever the live channel does not
  # already own the row. A job of its own because its two modes carry different
  # risk classes. The dry run READS the corpus and FETCHES about a Term's worth
  # of docket JSON from supremecourt.gov, so it takes the read-only role, holds
  # no credential while it fetches, and takes no lock: holding `corpus-write`
  # for a read-only fetch campaign would queue the scheduled windows behind it,
  # and GitHub keeps one pending run per group, so a second arrival would evict
  # a production window. The apply WRITES the corpus index, the content-store
  # snapshots and any ledger outcome the ingest records, so it takes the lock
  # for the whole job, the read-write role for the write step, and the App
  # token only after that step has exited.
  #
  # No dedupe prerequisite, unlike the corpus job: this pass writes exactly as
  # the live channel's frontier discovery does, which runs without one, and the
  # identity join it shares picks the lowest docket id of any twin pair
  # deterministically. A twin with either half live-polled is live-owned and
  # never read.
  #
  # The apply moves the interim base-rate population (the landed rows join the
  # interim section's parsed counts), so it is pre-registered in
  # docs/freeze-record.md and waits until after the long-conference release;
  # see docs/data-pipeline.md.
  applications:
    needs: [validate]
    if: ${{ inputs.repair == 'application-backfill' }}
    concurrency:
      group: ${{ inputs.repair == 'application-backfill' && inputs.repair_mode == 'apply' && 'corpus-write' || format('corpus-write-skip-{0}', github.run_id) }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    # The pass step's 45-minute cap plus setup, the corpus pull and the commit.
    timeout-minutes: 70
    environment: prod
    permissions:
      contents: read
      id-token: write # the read-only role for the pull; on an apply, the read-write role for the write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Sync the working tree to the current tip of the default branch
        # Same stale-base hazard as the corpus job: an apply that queued behind
        # a writer on the shared lock checked out a frozen sha, and the corpus
        # pointer it builds on moves with every writer's commit. The repo is
        # public, so this read-only fetch needs no credentials.
        run: |
          set -euo pipefail
          git fetch origin "${GITHUB_REF_NAME}"
          git reset --hard FETCH_HEAD

      - uses: ./.github/actions/setup-python-env

      # The committed pointer's blob. On an apply the lock is already held, so
      # this is the blob the write builds on; the read-write role assumed
      # below writes it back.
      - uses: ./.github/actions/corpus-readonly
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME_READONLY }}
          aws-region: ${{ vars.AWS_REGION }}
          corpus-base-url: ${{ vars.CORPUS_BASE_URL }}

      # The dry run: the ledger the apply's bound is read from. No credential
      # reaches it, as on the vote stamper: the read-only session and the OIDC
      # request pair are blanked, and the step asserts both before it runs. It
      # reads the pulled local index and makes no S3 call. An apply does not
      # run it: the apply prints the same ledger from its own reading, and a
      # leading dry run would double the pass's traffic to the Court's site.
      - name: Read the application back-fill ledger
        if: ${{ inputs.repair_mode == 'dry-run' }}
        # The walk stops itself at 30 minutes (`--max-run-seconds`) and prints
        # what it read, well inside this cap, so a slow upstream still leaves a
        # ledger. The deadline is the apply's own, so a dry run that reaches the
        # Term's end predicts an apply whose walk fits too. A Term runs about
        # 1,000 to 1,500 paced fetches.
        timeout-minutes: 45
        env:
          AWS_ACCESS_KEY_ID: ""
          AWS_SECRET_ACCESS_KEY: ""
          AWS_SESSION_TOKEN: ""
          ACTIONS_ID_TOKEN_REQUEST_URL: ""
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
          REPAIR: ${{ inputs.repair }}
          REPAIR_TARGET: ${{ inputs.repair_target }}
        run: |
          set -euo pipefail
          if env | grep -E '^AWS_' | grep -E '=.+' | grep -qvE '^AWS_(REGION|DEFAULT_REGION)='; then
            echo "::error::AWS credential variables reached the back-fill dry run"
            exit 1
          fi
          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "::error::OIDC token minting is reachable from the back-fill dry run"
            exit 1
          fi
          # The step of record for the Term refusal; `Validate the repair
          # selector` duplicates it word for word.
          if ! [[ "${REPAIR_TARGET}" =~ ^[0-9]{2}$ ]]; then
            echo "::error::repair=${REPAIR} needs repair_target set to a two-digit October Term, e.g. 24 — the back-fill reads one named Term per dispatch, so its ledger and the bound an apply carries answer for the same Term. Re-dispatch with the Term."
            exit 1
          fi
          uv run fedcourts backfill-applications --term "${REPAIR_TARGET}" \
            --max-run-seconds 1800 2>&1 \
            | tee -a "$GITHUB_STEP_SUMMARY"
          echo "dry-run only; nothing written."

      # Same read-write (append-only) role as the corpus job's: the ingest adds
      # and rewrites rows and mirrors each snapshot to the content store, and
      # can never wipe a remote object.
      - name: Configure AWS credentials (corpus S3 remote, read-write)
        if: ${{ inputs.repair_mode == 'apply' }}
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}
          role-duration-seconds: 3600 # 1h
          # Bounded for the corpus job's reason (the workflow-traps list in
          # docs/pipeline.md).
          action-timeout-s: 120

      # The apply: fetch, land and push the blob, in one step holding the
      # read-write session — the posture of every live-channel writer, whose
      # ingest mirrors each snapshot as it lands. No GitHub write credential
      # exists yet.
      - name: Back-fill the applications
        if: ${{ inputs.repair_mode == 'apply' }}
        # The walk stops itself at 30 minutes, and the apply refuses a walk that
        # stopped short of the Term's end, so a cut-off reading lands nothing.
        # The remaining 15 minutes cover the ingest (about 30 seconds for
        # OT2024's 974 rows on a local blob, plus one content-store PUT per
        # snapshot here) and the blob push.
        timeout-minutes: 45
        env:
          # The corpus estate's base URL: the ingest mirrors each snapshot to
          # the content store beneath it, and the push writes the index there.
          FEDCOURTS_CORPUS_BASE_URL: ${{ vars.CORPUS_BASE_URL }}
          # The session is already assumed; nothing here needs to mint another,
          # so nothing running during the upstream parse can.
          ACTIONS_ID_TOKEN_REQUEST_URL: ""
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
          REPAIR: ${{ inputs.repair }}
          REPAIR_MODE: ${{ inputs.repair_mode }}
          REPAIR_BOUND: ${{ inputs.repair_bound }}
          REPAIR_TARGET: ${{ inputs.repair_target }}
        run: |
          set -euo pipefail
          # The steps of record for the bound and the Term; `Validate the repair
          # selector` duplicates both word for word.
          if [ "${REPAIR_MODE}" = "apply" ] \
            && ! [[ "${REPAIR_BOUND}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::repair=${REPAIR} with repair_mode=apply needs repair_bound set to a positive integer — the count read off a previous dry-run dispatch's ledger. Re-dispatch with that number."
            exit 1
          fi
          if ! [[ "${REPAIR_TARGET}" =~ ^[0-9]{2}$ ]]; then
            echo "::error::repair=${REPAIR} needs repair_target set to a two-digit October Term, e.g. 24 — the back-fill reads one named Term per dispatch, so its ledger and the bound an apply carries answer for the same Term. Re-dispatch with the Term."
            exit 1
          fi
          # The held-back guard reads committed predictions out of `data/`, so
          # it needs the remote tip. Fast-forward only: an unpushed local commit
          # fails this closed. The repo is public, so this read-only fetch
          # needs no credentials.
          git fetch origin "$GITHUB_REF_NAME"
          git merge --ff-only FETCH_HEAD
          uv run fedcourts backfill-applications --term "${REPAIR_TARGET}" \
            --apply --max-rows "${REPAIR_BOUND}" --max-run-seconds 1800 2>&1 \
            | tee -a "$GITHUB_STEP_SUMMARY"
          # Blob before pointer commit, as everywhere: an apply that pushed the
          # blob but failed before the commit publishes nothing, because readers
          # resolve the committed pointer, and the control dry run re-reads the
          # old blob that pointer still names. The snapshots mirrored ahead of
          # the pointer are content-store objects keyed by case and date, which
          # a re-apply rewrites identically.
          uv run fedcourts corpus-push

      # The GitHub write credential exists only on an apply, and only from here
      # on, after the step that parsed fetched JSON has exited.
      - name: Mint app token
        if: ${{ inputs.repair_mode == 'apply' }}
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.DATA_APP_CLIENT_ID }}
          private-key: ${{ secrets.DATA_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Configure git identity
        if: ${{ inputs.repair_mode == 'apply' }}
        uses: ./.github/actions/configure-git-identity
        with:
          token: ${{ steps.app-token.outputs.token }}
          app-slug: ${{ steps.app-token.outputs.app-slug }}

      # Stages the pointer the push moved and any outcome the ingest recorded
      # under `data/` (an event still open on a stub row resolves through the
      # shared seam), so the corpus and the ledger it must match land together.
      - name: Commit the back-filled corpus
        if: ${{ inputs.repair_mode == 'apply' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          gh auth setup-git # persist-credentials is false on checkout
          git add corpus/corpus.db.ref
          if [ -d data ]; then
            git add data/
          fi
          if git diff --cached --quiet; then
            echo "Every application already live-owned; nothing to persist."
            exit 0
          fi
          git commit -m "repair: back-fill interim applications (corpus + ledger)"
          bash "${GITHUB_WORKSPACE}/.github/actions/commit-corpus-to-main/push_with_retry.sh" \
            "application back-fill pointer"

  # The merits decision record back-fill (`fedcourts backfill-decision-record`):
  # `merits_argued` and `merits_decision_method` on each stored granted row
  # whose method is still null, re-read from the row's newest stored live
  # snapshot. A job of its own for the application back-fill's reason: its two
  # modes carry different risk classes. That is also why it is not a pass beside
  # the response-signal back-fill in the corpus job, which would hold
  # `corpus-write` and the App token through the dry run. The dry run READS the
  # index and the content-store snapshots and writes nothing, so it takes the
  # read-only role, mints no write credential and takes no lock: holding
  # `corpus-write` for a read would queue the scheduled windows behind it, and
  # GitHub keeps one pending run per group, so a second arrival would evict a
  # production window.
  # The apply WRITES two index columns by a direct `UPDATE` and pushes the blob,
  # so it takes the lock for the whole job, the read-write role for the write
  # step, and the App token only after that step has exited. It writes no
  # content-store object and nothing under `data/`, so its commit is the
  # pointer alone.
  #
  # Unlike the vote stamper and the application back-fill's dry run, neither
  # step can run with the AWS session blanked: the snapshots it reads live in
  # the content store, so a blanked session could not read them at all. What
  # is blanked is the OIDC request pair, so no step here can mint a session it
  # was not handed.
  #
  # No dedupe prerequisite, unlike the corpus job: both columns fill-in latch
  # on the upsert path the merge writes through, so a reading landed on either
  # half of a twin pair survives the merge, and no gate, mint or retrieval row
  # reads them, so a half-read pair misleads nothing in the meantime.
  decision-record:
    needs: [validate]
    if: ${{ inputs.repair == 'decision-record' }}
    concurrency:
      group: ${{ inputs.repair == 'decision-record' && inputs.repair_mode == 'apply' && 'corpus-write' || format('corpus-write-skip-{0}', github.run_id) }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    # The pass step's 25-minute cap plus setup, the corpus pull and the commit.
    timeout-minutes: 45
    environment: prod
    permissions:
      contents: read
      id-token: write # the read-only role for the pull and the read; on an apply, the read-write role for the write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Sync the working tree to the current tip of the default branch
        # Same stale-base hazard as the corpus job: an apply that queued behind
        # a writer on the shared lock checked out a frozen sha, and the corpus
        # pointer it builds on moves with every writer's commit. The repo is
        # public, so this read-only fetch needs no credentials.
        run: |
          set -euo pipefail
          git fetch origin "${GITHUB_REF_NAME}"
          git reset --hard FETCH_HEAD

      - uses: ./.github/actions/setup-python-env

      # The committed pointer's blob. On an apply the lock is already held, so
      # this is the blob the write builds on; the read-write role assumed
      # below writes it back.
      - uses: ./.github/actions/corpus-readonly
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME_READONLY }}
          aws-region: ${{ vars.AWS_REGION }}
          corpus-base-url: ${{ vars.CORPUS_BASE_URL }}

      # The dry run: the ledger the apply's bound is read from. It holds the
      # read-only session the pull assumed, which the snapshot reads need, and
      # nothing that writes; the OIDC request pair is blanked and the step
      # asserts it before it runs.
      - name: Read the decision-record ledger
        if: ${{ inputs.repair_mode == 'dry-run' }}
        # One content-store read per candidate, pooled by the shared prefetch,
        # over the granted rows still unclassified. A dev-checkout dry run read
        # about 1,200 candidates in under a minute, so the cap is headroom for
        # a slow store rather than a sizing.
        timeout-minutes: 20
        env:
          # The corpus estate's base URL: the snapshots live in the content
          # store beneath it.
          FEDCOURTS_CORPUS_BASE_URL: ${{ vars.CORPUS_BASE_URL }}
          ACTIONS_ID_TOKEN_REQUEST_URL: ""
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
        run: |
          set -euo pipefail
          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "::error::OIDC token minting is reachable from the decision-record dry run"
            exit 1
          fi
          # The fill ledger — the counts, the method distribution over the
          # fills and each filled row — goes to the summary, which outlives the
          # step log. The bound is the rows it would FILL, not the `candidates`
          # denominator: the pending docket stays a candidate until its
          # decision lands, so that count rises with the ordinary docket.
          uv run fedcourts backfill-decision-record 2>&1 \
            | tee -a "$GITHUB_STEP_SUMMARY"
          echo "dry-run only; nothing written."

      # Same read-write (append-only) role as the corpus job's: the write moves
      # index columns and pushes the blob, and can never wipe a remote object.
      - name: Configure AWS credentials (corpus S3 remote, read-write)
        if: ${{ inputs.repair_mode == 'apply' }}
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}
          role-duration-seconds: 3600 # 1h
          # Bounded for the corpus job's reason (the workflow-traps list in
          # docs/pipeline.md).
          action-timeout-s: 120

      # The apply: fill and push the blob, in one step holding the read-write
      # session. It prints the same ledger from its own reading, so no dry run
      # leads it. No GitHub write credential exists yet.
      - name: Fill the decision record
        if: ${{ inputs.repair_mode == 'apply' }}
        # The dry run's reads plus the index writes and the blob push.
        timeout-minutes: 25
        env:
          FEDCOURTS_CORPUS_BASE_URL: ${{ vars.CORPUS_BASE_URL }}
          # The session is already assumed; nothing here needs to mint another.
          ACTIONS_ID_TOKEN_REQUEST_URL: ""
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
          REPAIR: ${{ inputs.repair }}
          REPAIR_MODE: ${{ inputs.repair_mode }}
          REPAIR_BOUND: ${{ inputs.repair_bound }}
        run: |
          set -euo pipefail
          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "::error::OIDC token minting is reachable from the decision-record apply"
            exit 1
          fi
          # The step of record for the bound; `Validate the repair selector`
          # duplicates it word for word.
          if [ "${REPAIR_MODE}" = "apply" ] \
            && ! [[ "${REPAIR_BOUND}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::repair=${REPAIR} with repair_mode=apply needs repair_bound set to a positive integer — the count read off a previous dry-run dispatch's ledger. Re-dispatch with that number."
            exit 1
          fi
          uv run fedcourts backfill-decision-record --apply \
            --max-fills "${REPAIR_BOUND}" 2>&1 \
            | tee -a "$GITHUB_STEP_SUMMARY"
          # Blob before pointer commit, as everywhere: an apply that pushed the
          # blob but failed before the commit publishes nothing, because readers
          # resolve the committed pointer, and the control dry run re-reads the
          # old blob that pointer still names.
          uv run fedcourts corpus-push

      # The GitHub write credential exists only on an apply, and only from here
      # on, after the write step has exited.
      - name: Mint app token
        if: ${{ inputs.repair_mode == 'apply' }}
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.DATA_APP_CLIENT_ID }}
          private-key: ${{ secrets.DATA_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Configure git identity
        if: ${{ inputs.repair_mode == 'apply' }}
        uses: ./.github/actions/configure-git-identity
        with:
          token: ${{ steps.app-token.outputs.token }}
          app-slug: ${{ steps.app-token.outputs.app-slug }}

      # Stages the pointer alone: the pass writes nothing under `data/`, so
      # anything changed there is not this pass's to publish. The step that
      # holds the App token needs no AWS session and no OIDC token, so the
      # read-write session and the request pair are blanked here and the step
      # asserts both before it runs.
      - name: Commit the decision-record corpus pointer
        if: ${{ inputs.repair_mode == 'apply' }}
        env:
          AWS_ACCESS_KEY_ID: ""
          AWS_SECRET_ACCESS_KEY: ""
          AWS_SESSION_TOKEN: ""
          ACTIONS_ID_TOKEN_REQUEST_URL: ""
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          if env | grep -E '^AWS_' | grep -E '=.+' | grep -qvE '^AWS_(REGION|DEFAULT_REGION)='; then
            echo "::error::AWS credential variables reached the decision-record commit"
            exit 1
          fi
          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "::error::OIDC token minting is reachable from the decision-record commit"
            exit 1
          fi
          gh auth setup-git # persist-credentials is false on checkout
          git add corpus/corpus.db.ref
          if git diff --cached --quiet; then
            echo "Every candidate already classified or unreadable; nothing to persist."
            exit 0
          fi
          git commit -m "repair: converge corpus (merits decision record)"
          bash "${GITHUB_WORKSPACE}/.github/actions/commit-corpus-to-main/push_with_retry.sh" \
            "decision-record pointer"

  # The per-opinion record (`fedcourts backfill-opinion-record`): one row per
  # opinion in each document the Court's per-Term opinions listing links — its
  # kind, author, joiners and word count — inserted into the corpus `opinions`
  # table, fill-only and idempotent. A job of its own for the application
  # back-fill's reason: its two modes carry different risk classes. The dry run
  # READS the index and FETCHES and parses a few hundred opinion PDFs from
  # supremecourt.gov, writing nothing, so it takes the read-only role for the
  # pull, takes no lock and mints no write credential: holding `corpus-write`
  # for a read-only fetch campaign would queue the scheduled windows behind it,
  # and GitHub keeps one pending run per group, so a second arrival would evict
  # a production window. The apply WRITES the index's `opinions` table and
  # pushes the blob, so it takes the lock for the whole job.
  #
  # The command fetches, parses and inserts in one process: its apply refuses a
  # PDF cache, so a dry run cannot hand the apply what it read, and the parse
  # cannot be moved into a step of its own. What it can be separated from is
  # every credential, because the insert is a LOCAL write — the pass reads the
  # pulled index and the network and makes no S3 call, so the step running it
  # holds no AWS session, no way to mint one and no GitHub write token, in BOTH
  # modes. The read-write role is assumed only after that step has exited, by a
  # push step that parses nothing fetched, and the App token is minted only
  # after the push. That separates the parser from the credentials in time, not
  # by a process boundary: the steps run as one user on one runner, so a
  # compromised parse could still leave something on the runner (the uv
  # environment, an action's checked-out code) for ANY later step to run — the
  # read-write role's assumption, the push and the App-key mint among them. What
  # bounds it is what those steps hold: the two roles `prod` is trusted by (the
  # push's is the append-only one, which can never wipe a remote object) and the
  # data App's key. The vote stamper and the decision-record and application
  # back-fill applies carry the same residual.
  #
  # The apply holds `corpus-write` for the whole fetch campaign — every
  # unrecorded document of six Terms, at about four seconds a document — so a
  # scheduled window arriving meanwhile waits behind it, and a second arrival
  # evicts the first (a rotation picks up where it left off next window).
  #
  # No dedupe prerequisite, unlike the corpus job: the pass writes only its own
  # table, keyed by (Term, listing number, position) rather than by case row,
  # and nothing a gate, a mint or a retrieval row reads joins on it.
  opinion-record:
    needs: [validate]
    if: ${{ inputs.repair == 'opinion-record' }}
    concurrency:
      group: ${{ inputs.repair == 'opinion-record' && inputs.repair_mode == 'apply' && 'corpus-write' || format('corpus-write-skip-{0}', github.run_id) }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    # The build step's 60-minute cap, the push step's 15 and the setup, the
    # corpus pull (about a gigabyte) and the commit, so a build that runs to its
    # cap still fails in its own step rather than the job's.
    timeout-minutes: 100
    environment: prod
    permissions:
      contents: read
      id-token: write # the read-only role for the pull; on an apply, the read-write role for the push
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Sync the working tree to the current tip of the default branch
        # Same stale-base hazard as the corpus job: an apply that queued behind
        # a writer on the shared lock checked out a frozen sha, and the corpus
        # pointer it builds on moves with every writer's commit. The repo is
        # public, so this read-only fetch needs no credentials.
        run: |
          set -euo pipefail
          git fetch origin "${GITHUB_REF_NAME}"
          git reset --hard FETCH_HEAD

      - uses: ./.github/actions/setup-python-env

      # The committed pointer's blob. On an apply the lock is already held, so
      # this is the blob the insert builds on and the push writes back. The
      # read-only session is used for this pull alone.
      - uses: ./.github/actions/corpus-readonly
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME_READONLY }}
          aws-region: ${{ vars.AWS_REGION }}
          corpus-base-url: ${{ vars.CORPUS_BASE_URL }}

      # Fetch, parse and — on an apply — insert, into the LOCAL index only. One
      # step for both modes, like the vote stamper: the two differ only in the
      # `--apply --max-rows` pair, and both hold the same nothing.
      #
      # The Term range is pinned here rather than spent on a dispatch input:
      # the record's first phase is OT2020–OT2025, and OT2017–OT2019 are left
      # out by design, since every listing row there links into a whole
      # preliminary-print or bound volume and the pass would skip each one
      # unfetched. A dry run and the apply it bounds therefore always read the
      # same Terms, so the bound read off one answers for the other.
      #
      # No credential reaches this step. The read-only AWS session the pull
      # assumed is blanked, because the pass reads only the pulled index and
      # the network; the OIDC request pair is blanked, because the job holds
      # `id-token: write` under `prod`, whose trust the read-write role also
      # names; and no App token exists yet. The step asserts both before it
      # runs anything.
      - name: Build the opinion record
        # About four seconds a document on a dev checkout — the 1 req/s pacing
        # plus the PDF parse — over the roughly 380 documents the six Terms
        # list unfetched-and-unskipped: about 25 minutes, so the cap is
        # better than twice that for a slower runner or a slow site. A control
        # dry run after the apply fetches only the refused documents again.
        timeout-minutes: 60
        env:
          AWS_ACCESS_KEY_ID: ""
          AWS_SECRET_ACCESS_KEY: ""
          AWS_SESSION_TOKEN: ""
          ACTIONS_ID_TOKEN_REQUEST_URL: ""
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
          REPAIR: ${{ inputs.repair }}
          REPAIR_MODE: ${{ inputs.repair_mode }}
          REPAIR_BOUND: ${{ inputs.repair_bound }}
        run: |
          set -euo pipefail
          # The credential tripwire, as on the vote stamper: no AWS credential
          # and no way to mint one may reach the parse.
          if env | grep -E '^AWS_' | grep -E '=.+' | grep -qvE '^AWS_(REGION|DEFAULT_REGION)='; then
            echo "::error::AWS credential variables reached the opinion-record build"
            exit 1
          fi
          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "::error::OIDC token minting is reachable from the opinion-record build"
            exit 1
          fi
          # The step of record for the bound; `Validate the repair selector`
          # duplicates it word for word.
          if [ "${REPAIR_MODE}" = "apply" ] \
            && ! [[ "${REPAIR_BOUND}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::repair=${REPAIR} with repair_mode=apply needs repair_bound set to a positive integer — the count read off a previous dry-run dispatch's ledger. Re-dispatch with that number."
            exit 1
          fi
          write_args=()
          if [ "${REPAIR_MODE}" = "apply" ]; then
            write_args+=(--apply --max-rows "${REPAIR_BOUND}")
          fi
          # The readings — every document's opinions, and each refusal's reason
          # — are a JSON array on stdout of several hundred KB, near the
          # summary's 1 MiB step cap, so the swap sends them to the step log;
          # stderr is kept in a file as well. Only the command's own ledger
          # lines (the per-Term counts, the would-insert line the bound is read
          # off, a refusal) are copied to the summary, which outlives the log:
          # stderr also carries pypdf's warnings, which can quote text from a
          # fetched PDF. Workflow commands are suspended for the run for the
          # same reason, under a token nothing fetched can know.
          ledger="${RUNNER_TEMP}/opinion-record.stderr"
          stop_token="$(head -c 16 /dev/urandom | od -An -tx1 | tr -d ' \n')"
          echo "::stop-commands::${stop_token}"
          status=0
          uv run fedcourts backfill-opinion-record --first-term 2020 --last-term 2025 \
            "${write_args[@]}" 3>&1 1>&2 2>&3 3>&- | tee "$ledger" || status=$?
          echo "::${stop_token}::"
          grep -E '^(OT[0-9]{4}: |backfill-opinion-record)' "$ledger" \
            >> "$GITHUB_STEP_SUMMARY" || true
          if [ "$status" -ne 0 ]; then
            echo "::error::backfill-opinion-record exited ${status}; the step log has its output."
            exit "$status"
          fi
          if [ "${REPAIR_MODE}" != "apply" ]; then
            echo "dry-run only; nothing written."
          fi

      # Same read-write (append-only) role as the corpus job's, assumed only
      # now that the step parsing fetched documents has exited.
      - name: Configure AWS credentials (corpus S3 remote, read-write)
        if: ${{ inputs.repair_mode == 'apply' }}
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}
          role-duration-seconds: 3600 # 1h
          # Bounded for the corpus job's reason (the workflow-traps list in
          # docs/pipeline.md).
          action-timeout-s: 120

      # The push alone holds the read-write session: it digests the local
      # blob, uploads it to its content-addressed key and rewrites the pointer,
      # and parses nothing fetched. The session is already assumed, so the
      # OIDC request pair is blanked and asserted. No GitHub write credential
      # exists yet.
      - name: Push the opinion-record corpus
        if: ${{ inputs.repair_mode == 'apply' }}
        # One blob upload of about a gigabyte.
        timeout-minutes: 15
        env:
          # The corpus estate's base URL: the push writes the index beneath it.
          FEDCOURTS_CORPUS_BASE_URL: ${{ vars.CORPUS_BASE_URL }}
          ACTIONS_ID_TOKEN_REQUEST_URL: ""
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
        run: |
          set -euo pipefail
          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "::error::OIDC token minting is reachable from the opinion-record push"
            exit 1
          fi
          # Blob before pointer commit, as everywhere: an apply that pushed the
          # blob but failed before the commit publishes nothing, because readers
          # resolve the committed pointer, and the control dry run re-reads the
          # old blob that pointer still names.
          uv run fedcourts corpus-push

      # The GitHub write credential exists only on an apply, and only from here
      # on, after the push step has exited.
      - name: Mint app token
        if: ${{ inputs.repair_mode == 'apply' }}
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.DATA_APP_CLIENT_ID }}
          private-key: ${{ secrets.DATA_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Configure git identity
        if: ${{ inputs.repair_mode == 'apply' }}
        uses: ./.github/actions/configure-git-identity
        with:
          token: ${{ steps.app-token.outputs.token }}
          app-slug: ${{ steps.app-token.outputs.app-slug }}

      # Stages the pointer alone: the pass writes nothing under `data/`, so
      # anything changed there is not this pass's to publish. The step that
      # holds the App token needs no AWS session and no OIDC token, so the
      # read-write session and the request pair are blanked here and the step
      # asserts both before it runs.
      - name: Commit the opinion-record corpus pointer
        if: ${{ inputs.repair_mode == 'apply' }}
        env:
          AWS_ACCESS_KEY_ID: ""
          AWS_SECRET_ACCESS_KEY: ""
          AWS_SESSION_TOKEN: ""
          ACTIONS_ID_TOKEN_REQUEST_URL: ""
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          if env | grep -E '^AWS_' | grep -E '=.+' | grep -qvE '^AWS_(REGION|DEFAULT_REGION)='; then
            echo "::error::AWS credential variables reached the opinion-record commit"
            exit 1
          fi
          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "::error::OIDC token minting is reachable from the opinion-record commit"
            exit 1
          fi
          gh auth setup-git # persist-credentials is false on checkout
          git add corpus/corpus.db.ref
          if git diff --cached --quiet; then
            echo "Every listed document already recorded, refused or skipped; nothing to persist."
            exit 0
          fi
          git commit -m "repair: converge corpus (per-opinion record)"
          bash "${GITHUB_WORKSPACE}/.github/actions/commit-corpus-to-main/push_with_retry.sh" \
            "opinion-record pointer"

  # The ledger-only pass, in its own job because its credentials are a strict
  # subset: it recomputes graded fields out of committed artifacts and writes
  # `evaluation.json`, touching no corpus row. So no AWS role, no
  # `id-token: write`, no corpus remote, no content-store env — only the App
  # token that pushes the `data/` commit. A pass that cannot reach the corpus
  # should not hold the credentials that reach it.
  #
  # It needs no dedupe prerequisite either, for the same reason it needs no
  # corpus: an unmerged twin row cannot change what a committed outcome already
  # says.
  regrade:
    needs: [validate]
    if: ${{ inputs.repair == 'regrade-stale' }}
    # It commits to `main` on the same push path as the corpus writers, so it
    # joins their lock rather than racing their pointer commits — and takes the
    # throwaway group when it will be skipped, for the corpus job's reason.
    concurrency:
      group: ${{ inputs.repair == 'regrade-stale' && 'corpus-write' || format('corpus-write-skip-{0}', github.run_id) }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    # One local recompute per named cell over a maintainer-sized list, plus
    # setup.
    timeout-minutes: 25
    environment: prod
    permissions:
      contents: read
    steps:
      - name: Mint app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.DATA_APP_CLIENT_ID }}
          private-key: ${{ secrets.DATA_APP_PRIVATE_KEY }}
          permission-contents: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Sync the working tree to the current tip of the default branch
        # Same stale-base hazard as the corpus job: a run that queued behind a
        # writer on the shared lock checked out a frozen sha, and the
        # evaluations being rewritten arrive by collect PR. The repo is public,
        # so this read-only fetch needs no credentials.
        run: |
          set -euo pipefail
          git fetch origin "${GITHUB_REF_NAME}"
          git reset --hard FETCH_HEAD

      - uses: ./.github/actions/setup-python-env

      - name: Configure git identity
        uses: ./.github/actions/configure-git-identity
        with:
          token: ${{ steps.app-token.outputs.token }}
          app-slug: ${{ steps.app-token.outputs.app-slug }}

      # Recompute the graded fields of named evaluator cells under their
      # original stamp, for cells whose committed outcome moved after the grade
      # was taken — the corpus passes rewrite and reopen outcomes without
      # consulting who has already graded them.
      #
      # What the scoring surfaces make of the result is the command's contract,
      # not this step's: per `metrics/README.md`, a standing moves honestly only
      # through a grading the supersede-collapse counts, and a bare re-stamp of
      # an existing `evaluation.json` moves it with a trace only in `data/`'s
      # git history. This step names cells and invokes the command; it cannot
      # supply that property if the command does not.
      - name: Re-grade named cells
        # One re-grade per line, so a cell graded by three judges is three
        # lines — the list is explicit on purpose: a re-grade rewrites a
        # committed evaluation, and which judge's is not a thing to infer.
        timeout-minutes: 15
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPAIR_MODE: ${{ inputs.repair_mode }}
          REPAIR_TARGET: ${{ inputs.repair_target }}
        run: |
          set -euo pipefail
          # `repair_target` is maintainer-typed free text entering a shell, so
          # it is handled as data throughout: expanded from the environment
          # (never interpolated into this script), split on whitespace, and
          # every line matched against the id grammar before a command sees
          # it. The grammar excludes `.` deliberately — with no dots no field
          # can be a `..` path segment, whatever the command does with it.
          # `Validate the repair selector` duplicates this whole block word for
          # word so a bad list dies before any credential is minted; this copy
          # is the one of record, because the step has to be safe on whatever
          # reaches it.
          pattern='^[a-z0-9-]+/[0-9]+/evt-[a-z0-9-]+/[0-9]{8}T[0-9]{6}Z/[a-z0-9-]+$'
          malformed=0
          cells=()
          # `printf '%s\n'`, not '%s': `read` returns non-zero on a final line
          # with no terminator, so an unterminated last cell would be dropped
          # by the loop — silently, and past the all-or-nothing check below.
          # The blank line this adds is absorbed by the emptiness guard.
          while IFS= read -r line; do
            [ -n "$line" ] || continue
            # Bash's own regex match: no pipeline, so no interaction with
            # pipefail and no per-line subprocess.
            if [[ "$line" =~ $pattern ]]; then
              cells+=("$line")
            else
              echo "::error::malformed regrade cell (want court/docket/event/run_id/actor, e.g. scotus/1119228/evt-petition-certiorari/20260624T103000Z/claude-judge): ${line}"
              malformed=1
            fi
          done < <(printf '%s\n' "${REPAIR_TARGET}" | tr -s ' \t\r' '\n')
          # All-or-nothing: a half-applied list is worse to reason about than a
          # refused one, and the fix is the same edit either way.
          if [ "$malformed" -ne 0 ]; then
            echo "::error::refusing the whole list — correct the lines above and re-dispatch."
            exit 1
          fi
          if [ "${#cells[@]}" -eq 0 ]; then
            echo "::error::repair=regrade-stale names no cells — set repair_target."
            exit 1
          fi
          if [ "${REPAIR_MODE}" = "apply" ]; then
            gh auth setup-git # persist-credentials is false on checkout
            # Recompute on top of the remote tip, not this checkout's: the
            # evaluations being rewritten arrive by collect PR, and a re-grade
            # computed against a stale copy would commit a rewrite of a
            # superseded file. Fast-forward only, so an exhausted push retry
            # upstream fails this step closed rather than being reset away.
            git fetch origin "$GITHUB_REF_NAME"
            git merge --ff-only FETCH_HEAD
          fi
          touched=()
          for cell in "${cells[@]}"; do
            IFS=/ read -r court docket event run actor <<<"$cell"
            if [ "${REPAIR_MODE}" != "apply" ]; then
              echo "would run: uv run fedcourts stamp-cell --regrade --court ${court} --docket ${docket} --event ${event} --run-id ${run} --role evaluator --actor ${actor}" \
                | tee -a "$GITHUB_STEP_SUMMARY"
              continue
            fi
            uv run fedcourts stamp-cell --regrade \
              --court "$court" --docket "$docket" --event "$event" \
              --run-id "$run" --role evaluator --actor "$actor" 2>&1 \
              | tee -a "$GITHUB_STEP_SUMMARY"
            touched+=("data/cases/${court}/${docket}/events/${event}/evaluations/${actor}")
          done
          if [ "${REPAIR_MODE}" != "apply" ]; then
            echo "dry-run only; nothing written."
            exit 0
          fi
          # Stage the named cells' evaluator directories, never a blanket
          # `git add data/`. This commit carries no corpus pointer, so anything
          # it stages that the corpus half never moved for would publish a
          # ledger-only split; an enumerated, grammar-checked jail is what keeps
          # that impossible. The jail is the named actor's directory, one level
          # wider than the named run id — the re-grade rewrites in place, so
          # nothing else under that actor changes, and no other actor's path and
          # no traversal is reachable from the grammar.
          git add -- "${touched[@]}"
          if git diff --cached --quiet; then
            echo "Re-grade reproduced the stored grades; nothing to persist."
            exit 0
          fi
          git commit -m "repair: re-grade named cells"
          bash "${GITHUB_WORKSPACE}/.github/actions/commit-corpus-to-main/push_with_retry.sh" \
            "re-grade ledger"
