name: run-repair

# The maintainer's repair bench: the dispatch-gated corpus and ledger
# maintenance passes, one per dispatch, dry-run first, never scheduled.
#
# Why these do not live beside the walk in run-seed: the two are different
# trigger classes with different failure postures. run-seed is production —
# four scheduled windows a day whose sweeps are non-blocking by contract,
# because a hiccup must converge next window rather than redden a walk nobody
# is watching. A repair pass is the opposite: it runs because a maintainer read
# a dry-run ledger and decided, it fails by REFUSING (an apply without its
# bound, a malformed cell id, a stamp the command declines), and a refusal is
# the answer the dispatch was for. Absorbing one would report work that never
# happened. Keeping them apart also keeps the passes' growth off the production
# workflow: every pass added here costs run-seed nothing — not a dispatch
# input, not a `LOOP_BUDGET_SECONDS` conjunct, not a step the walk must budget
# a tail for.
#
# One pass per dispatch is structural, not a convention: `repair` is a single
# choice, so no two passes can arm each other. That matches the documented
# procedure — `dry-run`, read the ledger the run summary carries, then `apply`
# with the count read off it. It also settles the sizing question a shared job
# would raise: two thirty-minute passes beside a walk do not fit one job cap.
#
# It is a corpus writer like run-pull's and run-seed's jobs, so its writer jobs
# join the repo-level `corpus-write` concurrency group: the corpus is a single
# blob (pull -> mutate -> push -> commit corpus/corpus.db.ref to main), so only
# one writer runs at a time regardless of workflow. The selector validation
# deliberately sits OUTSIDE that group, in its own credential-free job, so a
# malformed dispatch is refused in seconds rather than queuing behind a walk to
# be told about a typo.
#
# A *queued* repair run can be silently evicted, the hazard run-pull's enrich
# job documents: GitHub keeps only the latest pending run per concurrency
# group, so a scheduled window entering `corpus-write` behind this dispatch
# cancels it — and a one-shot dispatch, unlike a rotation, does not pick up
# where it left off. Dispatch in a quiet slot between the scheduled windows
# to avoid ever queuing: run-pull's live windows open at `:47` every even hour
# and usually commit within ~20 minutes, its pull windows at `:17` past
# 01/07/13/19 and run-seed at `:31` past 02/08/14/20, so from about `:15` past
# 03, 05, 09, 11, 15, 17, 21 and 23 the lock is usually free until the next `:47`.
# The four passes split across a credential boundary (opinion-votes,
# order-votes, application-backfill, opinion-record) are the exception: their
# writer asks for the lock only once the projection and the parse have run, up
# to well over an hour after the dispatch, so the dispatch time does not choose
# when the lock is requested. An apply evicted there is re-run by re-running
# its cancelled writer job, which reads the same plan while the one-day artifact
# lasts, or by a fresh dispatch, which runs the whole chain again.
#
# No guard job, unlike run-seed: that one exists because a scheduled walk fails
# unwatched and commits to main with no PR gate, so a cancellation has to raise
# its own escalation. Every run here was started by hand a moment earlier by
# the one person who wants to read its ledger.
#
# The full pass inventory, with each pass's inputs, refusals and procedure, is
# in docs/data-pipeline.md, *Maintenance passes*.
on:
  workflow_dispatch:
    inputs:
      repair:
        description: "Maintenance pass to run, one per dispatch. Every input is described under Maintenance passes in docs/data-pipeline.md."
        required: false
        default: none
        type: choice
        options:
          - none
          - unlatch-overselected
          - qp-backfill
          - rederive-distribution-parse
          - normalize-docket-markings
          - response-backfill
          - ocr-recovery
          - document-backfill
          - recut
          - arrival-backfill
          - merits-phantom-removal
          - disposition-convergence
          - lost-outcomes
          - event-definition-backfill
          - amicus-rederive
          - cert-amicus-rederive
          - salience-cert-backfill
          - application-reread
          - regrade-stale
          - opinion-votes
          - order-votes
          - application-backfill
          - decision-record
          - opinion-record
      # A dry run still applies the pass's prerequisites, to the runner's copy
      # only; an apply runs the prerequisites and the pass, then pushes.
      repair_mode:
        description: "dry-run prints the ledger and writes nothing off the runner; apply runs the pass and pushes."
        required: false
        default: dry-run
        type: choice
        options:
          - dry-run
          - apply
      repair_bound:
        description: "apply: required where the pass takes one; the bound read off the dry-run ledger."
        required: false
        default: ""
        type: string
      repair_target:
        description: "The pass's subject: a distribution parse label, the cells to re-grade, or the Term to back-fill."
        required: false
        default: ""
        type: string
      repair_options:
        description: "Space- or comma-separated switches the pass accepts."
        required: false
        default: ""
        type: string

permissions: {}

jobs:
  # The run gate (src/fedcourtsai/run_gate.py): a dispatch, or a re-run of any
  # run, proceeds only for a login config/dispatchers.json names. No
  # environment, no secret, a read-only token, and no project code: a sparse
  # checkout of the gate and its allow-list alone, run by path with the
  # runner's Python in isolated mode. Every other job needs this one and checks
  # the attempt it judged, because re-running some jobs does not re-run this
  # one; `run-gate` below fails the run when that check refused.
  authorize:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      attempt: ${{ steps.decide.outputs.attempt }}
      rerunners: ${{ steps.decide.outputs.rerunners }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            src/fedcourtsai/run_gate.py
            config/dispatchers.json
          sparse-checkout-cone-mode: false
      - name: Authorize who started this run
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: >-
          python3 -I -S src/fedcourtsai/run_gate.py --workflow run-repair.yml
          --event-name "$EVENT_NAME" --actor "$ACTOR"
          --triggering-actor "$TRIGGERING_ACTOR" --run-attempt "$RUN_ATTEMPT"
          --github-output "$GITHUB_OUTPUT"

  # The selector gate. It holds no credential, takes no lock and reaches no
  # network: it reads the five dispatch inputs out of the environment and
  # refuses anything the selected pass cannot legally run, against the pass
  # table in src/fedcourtsai/repair_passes.py. Every writer job below `needs:`
  # it, so a malformed dispatch is refused before an App token is minted,
  # before a role is assumed, and before the corpus-write lock is taken. The
  # table is stdlib-only Python run by path from a sparse checkout of that one
  # file, under the runner's own interpreter: no install, no lockfile, no
  # package code.
  #
  # Every refusal here that a step can reach is ALSO enforced in the step that
  # acts on the input — those are the checks of record, because a step has to be
  # safe on whatever reaches it, and this job is a fail-fast duplicate rather
  # than a substitute. The containment is one-directional by design: the
  # refusals with no late twin (`none`, an unknown pass, a bound or target
  # offered to a pass that reads neither) are hygiene about the dispatch form,
  # and a step that never reads a field is already safe when it is set.
  # The table holds each refusal in the step's own shell words, so one mistake
  # can never produce two differently worded refusals depending on where it
  # was caught. A test pins the pairing.
  validate:
    needs: [authorize]
    if: >-
      ${{ needs.authorize.result == 'success'
      && (needs.authorize.outputs.attempt == github.run_attempt
      || contains(needs.authorize.outputs.rerunners, format(',{0},', github.triggering_actor))) }}
    runs-on: ubuntu-26.04
    # Seconds of Python over five environment variables.
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            src/fedcourtsai/repair_passes.py
          sparse-checkout-cone-mode: false
      - name: Validate the repair selector
        # The inputs are maintainer-typed free text, so they reach the gate
        # through the environment, never interpolated into a command line.
        env:
          REPAIR: ${{ inputs.repair }}
          REPAIR_MODE: ${{ inputs.repair_mode }}
          REPAIR_BOUND: ${{ inputs.repair_bound }}
          REPAIR_TARGET: ${{ inputs.repair_target }}
          REPAIR_OPTIONS: ${{ inputs.repair_options }}
        run: python3 -I -S src/fedcourtsai/repair_passes.py

  # The corpus passes: every pass that pulls the blob, mutates it and pushes.
  # Structured like run-seed's writer job without the walk — on an apply, the
  # same App token, read-write role, `corpus-write` environment and
  # pointer-commit shape; a dry run keeps the environment and holds the
  # read-only role alone (see the permissions below).
  repair:
    needs: [authorize, validate]
    # Named as an allow-list, never as "everything but the re-grade": this job
    # is where the corpus role, `id-token: write` and the App token live, so a
    # pass reaches them only by being named here. A deny-list would hand every
    # future selector value the full writer credential set by default, which is
    # the wrong direction for a list that is expected to grow.
    if: >-
      ${{ contains(fromJSON('["unlatch-overselected","qp-backfill","rederive-distribution-parse","normalize-docket-markings","response-backfill","arrival-backfill","merits-phantom-removal","disposition-convergence","lost-outcomes","event-definition-backfill","amicus-rederive","cert-amicus-rederive","salience-cert-backfill","application-reread"]'), inputs.repair)
      && needs.authorize.result == 'success'
      && (needs.authorize.outputs.attempt == github.run_attempt
      || contains(needs.authorize.outputs.rerunners, format(',{0},', github.triggering_actor))) }}
    # An apply joins the repo-wide corpus-writer lock: one writer at a time
    # across run-pull, run-seed and this bench. cancel-in-progress:false so a
    # dispatch queues behind a running window rather than cancelling it.
    #
    # A job the `if:` will skip is given a unique throwaway group instead, the
    # idiom run-pull uses at workflow level: the group is assigned without
    # waiting on the `if:`, so a shared name would let the skipped sibling take
    # the group's single pending slot and evict an in-flight writer — or this
    # run's own real pass — before ever being skipped. The condition is the
    # `if:` above, repeated because no context available here can hold it once.
    #
    # A dry run takes the throwaway group too: it pushes nothing, so it has no
    # pointer to race, and holding `corpus-write` for a read would queue the
    # scheduled writer windows behind it — GitHub keeps one pending run per
    # group, so a second arrival would evict a production window. Its pull may
    # overlap a writer's push; the blob is content-addressed, so it reads one
    # consistent version either way.
    concurrency:
      group: ${{ (needs.authorize.result == 'success' && (needs.authorize.outputs.attempt == github.run_attempt || contains(needs.authorize.outputs.rerunners, format(',{0},', github.triggering_actor)))) && contains(fromJSON('["unlatch-overselected","qp-backfill","rederive-distribution-parse","normalize-docket-markings","response-backfill","arrival-backfill","merits-phantom-removal","disposition-convergence","lost-outcomes","event-definition-backfill","amicus-rederive","cert-amicus-rederive","salience-cert-backfill","application-reread"]'), inputs.repair) && inputs.repair_mode == 'apply' && 'corpus-write' || format('corpus-write-skip-{0}', github.run_id) }}
      cancel-in-progress: false
    runs-on: ubuntu-26.04
    # Headroom over the longest chain of capped steps a dispatch can run: the
    # dedupe prerequisite (10m), a 30-minute pass (the questions-presented
    # back-fill's)
    # and the persist step (15m), leaving the setup, the
    # corpus pull and the trailing verdict inside the remainder. A hit here
    # cancels the run, which no failure handling absorbs. Every pass is meant
    # to run inside the opening credentials' 1h lives, and the pass caps still
    # carry the push they hand the persist step, so a run that reaches the
    # persist step has spent less than its caps. Should a credential lapse
    # anyway, the push it guards fails before the pointer is published, a red
    # run rather than a half-written corpus.
    timeout-minutes: 72
    environment: corpus-write
    # This environment's corpus estate as one base URL (see run-pull): the
    # index remote and the per-case content store are fixed segments beneath
    # it, and the store's address is the corpus-split mode. Job-wide, because
    # every pass below reads or writes the corpus — and the passes that read
    # stored snapshots or documents out of the content store (the
    # questions-presented backfill, the distribution re-derivation and the
    # response-signal backfill) answer empty without it.
    env:
      FEDCOURTS_CORPUS_BASE_URL: ${{ vars.CORPUS_BASE_URL }}
      # The one switch that lets this job write the remote corpus estate at
      # all: the content-store mirror and `corpus-push` (`remote_writes` in
      # fedcourtsai/config.py). Set by the corpus writer jobs alone, on their
      # own `env:`; any other job's corpus writes stay local whatever
      # credential it holds (tests/test_workflow_corpus_write.py). On for an
      # apply only: a dry run applies the dedupe prerequisite to this runner's
      # copy, and with the switch off those writes stay on the runner.
      FEDCOURTS_REMOTE_WRITES: ${{ inputs.repair_mode == 'apply' && 'true' || '' }}
    # The ambient GITHUB_TOKEN reads only: the checkout uses it, which is what
    # `contents: read` is for. Every WRITE — the corpus push and every gh call —
    # runs on the App token instead, so the ambient one carries no write at all.
    #
    # The two modes carry different risk, so they hold different credentials.
    # An apply holds the lock above, the read-write role and the App token. A
    # dry run holds the read-only role alone: it mints no token, takes no lock,
    # and writes only to this runner's copy of the corpus, which is what the
    # maintainer reads before deciding to apply.
    permissions:
      contents: read
      id-token: write # assume the AWS role for the corpus S3 remote (read-only on a dry run)
    steps:
      # An apply mints one token up front, and the whole run stays inside its
      # 1h life (the job's cap above says why). Scoped to
      # contents:write only (the corpus pushes) — progress goes to the Actions
      # step summary, not an issue, so no issues:write is needed.
      - name: Mint app token
        if: ${{ inputs.repair_mode == 'apply' }}
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.DATA_APP_CLIENT_ID }}
          private-key: ${{ secrets.DATA_APP_PRIVATE_KEY }}
          permission-contents: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Sync the working tree to the current tip of the default branch
        # actions/checkout pins this run's frozen github.sha — the branch tip when
        # the run was CREATED, not when it starts. A run that queues behind another
        # corpus writer on the shared corpus-write lock therefore checks out a
        # stale base, so the corpus blob it pulls and mutates is built on an
        # obsolete pointer and the final commit cannot rebase onto the advanced
        # tip (an unmergeable corpus/corpus.db.ref conflict). Reset to the live tip
        # first (under the lock, on an apply), so we always mutate the latest
        # committed corpus.
        # The repo is public, so this read-only fetch needs no credentials.
        run: |
          set -euo pipefail
          git fetch origin "${GITHUB_REF_NAME}"
          git reset --hard FETCH_HEAD

      - uses: ./.github/actions/setup-python-env
        with:
          restore-cache: "false"

      - name: Configure git identity
        if: ${{ inputs.repair_mode == 'apply' }}
        uses: ./.github/actions/configure-git-identity
        with:
          token: ${{ steps.app-token.outputs.token }}
          app-slug: ${{ steps.app-token.outputs.app-slug }}

      # Same read-write (append-only) role as run-pull's and run-seed's
      # writers: a pass adds and rewrites rows in the corpus blob but can never
      # wipe remote objects. The 1h session outlasts the whole run.
      - name: Configure AWS credentials (corpus S3 remote, read-write)
        if: ${{ inputs.repair_mode == 'apply' }}
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}
          role-duration-seconds: 3600 # 1h
          # Bound the assume-role wall clock: unbounded, its 12 retries over a
          # multi-minute connect timeout outlast every job budget here (see the
          # workflow-traps list in docs/pipeline.md). Note the cost this buys —
          # the action does not clear its timer on the error path, so ANY failing
          # assume-role now burns the full 120s and ends on "Action timed out"
          # rather than its own message; the real cause is earlier in the log.
          action-timeout-s: 120

      # A dry run reads the index and the content store and writes nothing
      # remote, so it takes the read-only role, for the same 1h session. Every
      # condition here is the apply's negation, so exactly one of the two
      # credential steps runs on any dispatch.
      - name: Configure AWS credentials (corpus S3 remote, read-only)
        if: ${{ inputs.repair_mode != 'apply' }}
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME_READONLY }}
          aws-region: ${{ vars.AWS_REGION }}
          role-duration-seconds: 3600 # 1h
          # Bounded for the read-write step's reason.
          action-timeout-s: 120

      - name: Pull the current corpus from the remote
        # Named so the trailing verdict can require it: `validate-corpus` is
        # graceful when no corpus is on disk and returns a *skipped* verdict,
        # which would otherwise be published over the last real one.
        id: corpus-pull
        run: |
          # Every pass reads prior corpus state; a repo with no committed
          # pointer yet has nothing to repair, and each pass's own guard says
          # so rather than the pull failing here. Checksum-verified.
          uv run fedcourts corpus-pull --missing-pointer warn

      # The standing prerequisite every corpus pass here is gated on. Merge and
      # drop the live-minted duplicate SCOTUS rows first: any docket-number
      # spelling that defeats the channels' identity join leaves a twin pair,
      # and a pass that reads a row's columns — a disposition, a grant, a
      # count, a latch — must read the merged row rather than one half of a
      # pair. `docs/salience.md`'s "run dedupe first" prerequisite, enforced
      # rather than merely ordered. Idempotent: a clean corpus finds nothing
      # and persists nothing, so on a converged corpus this costs seconds.
      #
      # NOT continue-on-error, unlike its twin on run-seed's schedule: there a
      # failed sweep converges next window, here it means the pass the
      # maintainer dispatched cannot be trusted to read the right rows, and a
      # green run that quietly did nothing is the worst outcome a repair bench
      # can produce. Failing hard is also what makes it fail-closed on the
      # ledger half: a dedupe that mutated the workspace blob and then failed
      # its push stops the job, so those uncommitted moves go to the scrapheap
      # with the runner rather than into a later pass's commit. The explicit
      # `steps.dedupe-live-rows.outcome == 'success'` conjunct each pass
      # carries is belt-and-braces rather than the thing supplying that
      # property — the implicit `success()` already skips them — and it states
      # the prerequisite where a reader of one pass will see it.
      #
      # It runs in `dry-run` dispatches too, and applies there — to this
      # runner's copy only. The ledger a maintainer reads off a dry run is
      # what they then apply on, so the pass must read the same deduped
      # population the apply will act on; a dry run gets that by merging
      # locally and stopping before the push, with the remote-writes switch
      # off and the read-only role, so nothing it merges leaves the runner.
      # Its ledger moves stay uncommitted on a dry run, so a later pass's
      # fast-forward to a tip that touched a moved path refuses and the dry
      # run fails closed; re-dispatch it.
      # The scope reconcile below does the same, on the pass that needs it.
      - name: Dedupe live-minted duplicate rows
        id: dedupe-live-rows
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPAIR_MODE: ${{ inputs.repair_mode }}
        run: |
          set -euo pipefail
          # No committed pointer means no corpus — nothing to dedupe.
          if [ ! -f corpus/corpus.db.ref ]; then
            echo "no corpus pointer yet; skipping dedupe"; exit 0
          fi
          # The merge reads committed `data/` as a refusal guard (a twin whose
          # events carry committed cell output must not merge), so it needs the
          # remote tip, not this checkout's — a collect PR merging output under
          # the twin since the last sync must be visible. Fast-forward only,
          # for the passes' reason: an unpushed local commit upstream fails
          # this closed rather than publishing a split.
          git fetch origin "$GITHUB_REF_NAME"
          git merge --ff-only FETCH_HEAD
          # Dry-run first, into the summary: the merge moves ledger event
          # directories with the re-keyed rows, and the would-move ledger must
          # outlive the step log the way each pass's does.
          uv run fedcourts dedupe-live-rows 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          uv run fedcourts dedupe-live-rows --apply
          if [ "${REPAIR_MODE}" != "apply" ]; then
            echo "dry-run: dedupe applied to this runner's copy only; nothing pushed."
            exit 0
          fi
          gh auth setup-git # persist-credentials is false on checkout
          # Blob before pointer commit, as everywhere.
          uv run fedcourts corpus-push
          # The merge writes both halves: the re-keyed rows into the corpus and
          # the moved minted-event directories into `data/`. Stage them into the
          # one pointer commit so both land together on the push path.
          git add corpus/corpus.db.ref
          if [ -d data ]; then
            git add data/
          fi
          if git diff --cached --quiet; then
            echo "No duplicate pairs to persist."
            exit 0
          fi
          git commit -m "repair: dedupe live-minted duplicate rows (corpus + ledger)"
          bash "${GITHUB_WORKSPACE}/.github/actions/commit-corpus-to-main/push_with_retry.sh" \
            "dedupe pointer"

      # The overhang clear's second prerequisite, and the reason it is a step
      # rather than a note: the clear recomputes each pending cohort's
      # selection, so it must recompute over an in-scope corpus. run-seed's
      # daily window gave it that ordering for free by running the reconcile
      # ahead of it; here the pass that needs it brings it along. Runs for that
      # pass alone — no other pass reads the scope latch — and fails hard for
      # the dedupe prerequisite's reason.
      - name: Reconcile predict scope (latch out-of-scope cases)
        id: reconcile-scope
        if: ${{ inputs.repair == 'unlatch-overselected' && steps.dedupe-live-rows.outcome == 'success' }}
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPAIR_MODE: ${{ inputs.repair_mode }}
        run: |
          set -euo pipefail
          # No committed pointer means no corpus — nothing to reconcile.
          if [ ! -f corpus/corpus.db.ref ]; then
            echo "no corpus pointer yet; skipping scope reconcile"; exit 0
          fi
          uv run fedcourts reconcile-scope --apply
          if [ "${REPAIR_MODE}" != "apply" ]; then
            echo "dry-run: scope latch applied to this runner's copy only; nothing pushed."
            exit 0
          fi
          gh auth setup-git # persist-credentials is false on checkout
          # Blob before pointer commit, as everywhere.
          uv run fedcourts corpus-push
          git add corpus/corpus.db.ref
          if git diff --cached --quiet; then
            echo "Scope latch already converged; nothing to persist."
            exit 0
          fi
          git commit -m "repair: latch out-of-scope cases"
          bash "${GITHUB_WORKSPACE}/.github/actions/commit-corpus-to-main/push_with_retry.sh" \
            "scope-latch pointer"

      # Clear the pre-resize `salience_selected` overhang. The sticky latch is
      # additive, so petitions latched under old capacity caps keep earning
      # cells the shipped envelope never budgeted; this recomputes each pending
      # cohort under the current config and clears the latch on pending
      # petitions a from-scratch selection would not pick. A committed
      # prediction on a cleared case stays committed and graded.
      #
      # The printed `SalienceUnlatchResult` (the cleared-id ledger + the
      # pre-apply pointer) is the record of the pre-resize sticky set the write
      # erases, so it goes to the run summary, which outlives the step log.
      - name: Clear the pre-resize salience overhang (unlatch-overselected)
        # Every pass gates on an EQUALITY against its own selector value, never
        # on `!= 'none'`: an equality is false under an empty inputs context,
        # so the gate stays fail-closed if this workflow ever grows a trigger
        # that carries no inputs. The job gates are the same shape — an
        # allow-list membership test, false for a value nobody named — so the
        # property holds at both levels; a test pins both.
        if: ${{ inputs.repair == 'unlatch-overselected' && steps.dedupe-live-rows.outcome == 'success' && steps.reconcile-scope.outcome == 'success' }}
        # Sized for an apply, which recomputes twice — the dry run that lands
        # the cleared-id ledger in the summary, then the write — over a
        # recompute the sibling scope reconcile does in ~8 min; the ~1GB push
        # is the persist step's. Generous so the write completes rather
        # than being cancelled mid-flight (below that cost a cap leaves nothing
        # applied). Still bounded, so the step's worst case stays under the
        # job's own cap: a job-cap hit is a cancellation, which no failure
        # handling absorbs.
        timeout-minutes: 15
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPAIR_MODE: ${{ inputs.repair_mode }}
        run: |
          set -euo pipefail
          # No committed pointer means no corpus — nothing to reconcile.
          if [ ! -f corpus/corpus.db.ref ]; then
            echo "no corpus pointer yet; skipping unlatch-overselected"; exit 0
          fi
          if [ "${REPAIR_MODE}" = "apply" ]; then
            gh auth setup-git # persist-credentials is false on checkout
          fi
          # Dry-run first, into the summary: the cleared-id ledger is the
          # reading the apply is decided on, and it must outlive the step log.
          uv run fedcourts unlatch-overselected 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "${REPAIR_MODE}" != "apply" ]; then
            echo "dry-run only; nothing written."
            exit 0
          fi
          uv run fedcourts unlatch-overselected --apply 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"

      # Re-derive the stored questions-presented rows with the current
      # extractor. The refusal guard makes the apply non-destructive (a stored
      # full-length question the current extractor cannot re-derive is
      # reported, never emptied), and the apply verifies itself: under the
      # corpus split the durable write is the content store's per-case PUT —
      # best-effort, per-case failures logged not raised — and the blob and
      # pointer may not move at all, so convergence is witnessed by re-running
      # the dry-run and requiring zero remaining rewrites, not by the pointer.
      #
      # No fetch/ff-only here, unlike the ledger passes: the command reads
      # corpus rows and documents only — no `data/` guard — and commits only
      # the pointer.
      - name: Backfill questions presented
        if: ${{ inputs.repair == 'qp-backfill' && steps.dedupe-live-rows.outcome == 'success' }}
        # A guess sized above the local passes, not a measurement: the pass
        # reads stored petition text per live-slice SCOTUS row — under the
        # split mode one content-store GET each, twice on an apply, plus the
        # mirror PUTs. The first `dry-run` dispatch is what measures the real
        # cost; resize from its wall clock.
        timeout-minutes: 30
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPAIR_MODE: ${{ inputs.repair_mode }}
        run: |
          set -euo pipefail
          # No committed pointer means no corpus — nothing to re-derive.
          if [ ! -f corpus/corpus.db.ref ]; then
            echo "no corpus pointer yet; skipping questions-presented backfill"; exit 0
          fi
          if [ "${REPAIR_MODE}" = "apply" ]; then
            gh auth setup-git # persist-credentials is false on checkout
          fi
          # Dry-run first, into the summary: the reason-class ledger is the
          # triage record, and it must outlive the step log either way.
          uv run fedcourts backfill-questions-presented 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "${REPAIR_MODE}" != "apply" ]; then
            echo "dry-run only; nothing written."
            exit 0
          fi
          uv run fedcourts backfill-questions-presented --apply 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          # Convergence check: the command is idempotent, so a clean apply
          # leaves the re-run with nothing to rewrite. This is the witness the
          # pointer cannot be under the split mode (see the step comment) —
          # and it is what catches a swallowed content-store write.
          uv run fedcourts backfill-questions-presented 2>&1 \
            | tee -a "$GITHUB_STEP_SUMMARY" | tee /tmp/qp-verify.txt
          if ! grep -q "would rewrite 0," /tmp/qp-verify.txt; then
            echo "::error::apply did not converge — the re-run still reports rewrites (a content-store write may have failed; see the warnings above)"
            exit 1
          fi

      # Re-derive the corpus `distribution_count` column under a registered
      # distribution parse. The first of the three pieces of work that activate
      # a new parse (`docs/salience.md`), and the only one that touches stored
      # state: the write is a direct UPDATE that bypasses the column's max
      # latch, because a narrower reading routed through the upsert would be a
      # silent no-op. The guard the latch was providing is the command's own: a
      # row whose latest live-shaped snapshot discloses no proceedings is
      # counted and left untouched, never written to 0. The apply refuses above
      # the command's blast-radius bound — fixed in code, not a dispatch input,
      # because the population is finite and its delta was measured before the
      # surface existed; moving it is a code change with the new basis stated
      # beside it, which is why this pass refuses a `repair_bound`.
      #
      # **Dispatch the INCUMBENT parse first**, as a `dry-run` control: it must
      # report `changed = 0`, since the stored column is the incumbent reading
      # of those same snapshots, and anything it moves is stored-column drift
      # rather than the parse — until it is zero, a candidate's changed set is
      # a sum nothing can decompose.
      #
      # It does not belong in the same dispatch as the overhang clear, which the
      # selector makes structural: anything that weighed
      # incumbent-parse counts before this ran is stale afterwards, and while
      # the scope reconcile self-heals next window, the overhang clear does not
      # — its write erases the sticky set it recomputed. Clear the overhang
      # under the bands the re-derivation leaves behind, not before.
      - name: Re-derive the distribution counts
        if: ${{ inputs.repair == 'rederive-distribution-parse' && steps.dedupe-live-rows.outcome == 'success' }}
        # Network-bound like the questions-presented backfill rather than the
        # local passes: under the corpus split the pass reads one content-store
        # object per live-slice SCOTUS row (tens of thousands), pooled by the
        # shared prefetch; the blob push is the persist step's. The first
        # `dry-run` dispatch is what re-sizes it.
        timeout-minutes: 30
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPAIR_MODE: ${{ inputs.repair_mode }}
          REPAIR_TARGET: ${{ inputs.repair_target }}
        run: |
          set -euo pipefail
          # Validate the label before anything else, including the corpus
          # guard: a dispatch that cannot legally run should say so in seconds,
          # not after a full-population read. `repair_passes.py`
          # duplicates this word for word so a bad dispatch dies before any
          # credential is minted; this copy is the one of record, because the
          # step has to be safe on whatever reaches it.
          if ! [[ "${REPAIR_TARGET}" =~ ^[a-z][a-z0-9-]*$ ]]; then
            echo "::error::repair=rederive-distribution-parse needs repair_target set to a distribution parse label — lowercase, e.g. dist-v2. A re-derivation names its reading rather than inheriting the ingest default, so there is no default to fall back on. Re-dispatch with the label."
            exit 1
          fi
          # No committed pointer means no corpus — nothing to re-derive.
          if [ ! -f corpus/corpus.db.ref ]; then
            echo "no corpus pointer yet; skipping the distribution re-derivation"; exit 0
          fi
          if [ "${REPAIR_MODE}" = "apply" ]; then
            gh auth setup-git # persist-credentials is false on checkout
          fi
          # One pass, whichever mode: the command's plan IS its write set, so an
          # apply prints the same report a dry run would and a separate dry run
          # ahead of it would only repeat a full-population read over the
          # content store. Declared outside the guard so the expansion is total
          # under `set -u`.
          apply_args=()
          if [ "${REPAIR_MODE}" = "apply" ]; then
            apply_args+=(--apply)
          fi
          uv run fedcourts rederive-distribution-counts --parse "${REPAIR_TARGET}" \
            "${apply_args[@]}" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "${REPAIR_MODE}" != "apply" ]; then
            echo "dry-run only; nothing written."
            exit 0
          fi

      # Converge stored docket numbers on their marking-free spelling, draining
      # the population the `docket_numbers_carry_no_capital_marking` corpus
      # check reports. The ingest write site stores the number with the Court's
      # capital-case marking removed and raises `capital_case` beside it, so a
      # stored row converges only when that site touches it again — which no
      # automatic channel does outside the live slice. This is the dedicated
      # pass that drains the backlog without a re-read.
      #
      # The rewrite can neither create nor resolve a duplicate pair: both
      # SCOTUS channels reconcile identity on a key that already strips the
      # marking by shape, so the marked and marking-free spellings compare
      # equal to the join before the rewrite as well as after, and rows that
      # already share a normalized identity are reported as the dedupe pass's
      # population rather than touched.
      #
      # Corpus-only: no ledger surface, so a pointer-only commit, and no
      # fetch/ff-only ahead of it — nothing here reads committed `data/`.
      - name: Converge stored docket markings
        if: ${{ inputs.repair == 'normalize-docket-markings' && steps.dedupe-live-rows.outcome == 'success' }}
        # Local: one scan of the cases table and a bounded UPDATE against the
        # pulled blob.
        timeout-minutes: 8
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPAIR: ${{ inputs.repair }}
          REPAIR_MODE: ${{ inputs.repair_mode }}
          REPAIR_BOUND: ${{ inputs.repair_bound }}
        run: |
          set -euo pipefail
          # Validate the bound before anything else, including the corpus
          # guard: a dispatch that cannot legally apply should say so in
          # seconds, not after a full scan. The command refuses an unbounded
          # apply on its own too; this refusal is the one with the maintainer's
          # procedure in it. `repair_passes.py` duplicates it word
          # for word so a bad dispatch dies before any credential is minted;
          # this copy is the one of record, because the step has to be safe on
          # whatever reaches it. The refusal names the pass through `${REPAIR}`
          # rather than a literal so the two copies are identical as text, not
          # merely equivalent once expanded.
          if [ "${REPAIR_MODE}" = "apply" ] \
            && ! [[ "${REPAIR_BOUND}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::repair=${REPAIR} with repair_mode=apply needs repair_bound set to a positive integer — the count read off a previous dry-run dispatch's ledger. Re-dispatch with that number."
            exit 1
          fi
          # No committed pointer means no corpus — nothing to converge.
          if [ ! -f corpus/corpus.db.ref ]; then
            echo "no corpus pointer yet; skipping the docket-marking convergence"; exit 0
          fi
          if [ "${REPAIR_MODE}" = "apply" ]; then
            gh auth setup-git # persist-credentials is false on checkout
          fi
          # Dry-run first, into the summary: the per-row ledger — each old and
          # new spelling, and which rows already share a normalized identity —
          # is the reading the apply's bound comes from, and it must outlive
          # the step log. (On an apply this run is a receipt, not a reading:
          # nobody reads it before the rewrite.)
          uv run fedcourts normalize-docket-markings 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "${REPAIR_MODE}" != "apply" ]; then
            echo "dry-run only; nothing written."
            exit 0
          fi
          uv run fedcourts normalize-docket-markings --apply \
            --max-rewrites "${REPAIR_BOUND}" 2>&1 \
            | tee -a "$GITHUB_STEP_SUMMARY"

      # Re-derive the dated interim/merits signals — `response_requested_at`,
      # `response_filed_at`, `merits_brief_filed` — from each row's newest
      # stored live-shaped snapshot. The gaps are rows polled before those
      # columns existed, and no channel corrects them: the live poller serves
      # the undecided slice, so a decided row is never re-polled, and the
      # undated flag beside them is a max-latched boolean a later write cannot
      # turn back into a question. Recoverable from the corpus alone, since
      # that stored snapshot is the same payload the original ingest read.
      #
      # It reads those snapshots, which under the corpus split live in the
      # content store rather than the blob — so it depends on the job-level
      # base URL, whose store segment is where they live, and a row with no
      # stored snapshot is counted and
      # reported rather than failed. The three columns are fill-in only,
      # matching the latch family they sit in on the upsert path, so a stored
      # value is never overwritten and a degraded payload fills nothing rather
      # than asserting a date. Its write is a direct UPDATE of the index, so
      # the pointer IS the witness here and a plain pointer commit suffices; no
      # ledger surface, so no fetch/ff-only.
      - name: Backfill the dated response signals
        if: ${{ inputs.repair == 'response-backfill' && steps.dedupe-live-rows.outcome == 'success' }}
        # Network-bound like the questions-presented backfill rather than the
        # local passes: one content-store read per candidate row, pooled by the
        # shared prefetch. A guess, not a measurement, since the candidate set
        # is a subset of the live slice; the first `dry-run` dispatch re-sizes
        # it.
        timeout-minutes: 20
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPAIR: ${{ inputs.repair }}
          REPAIR_MODE: ${{ inputs.repair_mode }}
          REPAIR_BOUND: ${{ inputs.repair_bound }}
        run: |
          set -euo pipefail
          # Validate the bound before anything else, including the corpus
          # guard: a dispatch that cannot legally apply should say so in
          # seconds, not after a full-population read of the content store.
          # `repair_passes.py` duplicates it word for word so a bad
          # dispatch dies before any credential is minted; this copy is the one
          # of record, because the step has to be safe on whatever reaches it.
          # The refusal names the pass through `${REPAIR}` rather than a literal
          # so the two copies are identical as text, not merely equivalent once
          # expanded.
          if [ "${REPAIR_MODE}" = "apply" ] \
            && ! [[ "${REPAIR_BOUND}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::repair=${REPAIR} with repair_mode=apply needs repair_bound set to a positive integer — the count read off a previous dry-run dispatch's ledger. Re-dispatch with that number."
            exit 1
          fi
          # No committed pointer means no corpus — nothing to re-derive.
          if [ ! -f corpus/corpus.db.ref ]; then
            echo "no corpus pointer yet; skipping the response-signal backfill"; exit 0
          fi
          if [ "${REPAIR_MODE}" = "apply" ]; then
            gh auth setup-git # persist-credentials is false on checkout
          fi
          # Dry-run first, into the summary: the fill ledger — each row with the
          # dates it gains, beside the counts of rows read with nothing to fill,
          # with no stored snapshot, and whose snapshot discloses no proceedings
          # — is the reading the apply's bound comes from, and it must outlive
          # the step log. The bound is the rows actually FILLED, not the
          # `candidates` denominator printed beside it: that denominator is not
          # finite, since the granted arm admits every new cert grant that has
          # not yet drawn a respondent brief. (On an apply this run is a
          # receipt, not a reading.)
          uv run fedcourts backfill-response-fields 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "${REPAIR_MODE}" != "apply" ]; then
            echo "dry-run only; nothing written."
            exit 0
          fi
          uv run fedcourts backfill-response-fields --apply \
            --max-fills "${REPAIR_BOUND}" 2>&1 \
            | tee -a "$GITHUB_STEP_SUMMARY"

      # Re-derive the interim baseline's arrival stamp. An interim event's
      # `opened_at` is the moment it declares — the day the application was
      # submitted to a Justice — and it is where provisioning cuts, so what is
      # stamped there decides what a cell for that moment may see.
      #
      # The defect is a stamp rule correlated with the outcome. The live poller
      # serves the UNRESOLVED slice, so a decided application has left the
      # rotation and is never re-polled: an event last polled before the arrival
      # read existed keeps the docketing date or nothing at all, and resolution
      # status therefore decides which reading a row carries, and any
      # retrospective interim population drawn from these events inherits that
      # conditioning. A forward cell is unaffected ONCE ITS ROW HAS BEEN
      # RE-POLLED — not by construction: a queued row not polled since the
      # arrival read shipped still carries the docketing stamp and is moved by
      # this apply, so the boundary runs through the forward stratum too. The
      # pass is deliberately not predicated on resolution for the same reason:
      # repairing only the decided half would condition the class all over again.
      #
      # Recoverable from the corpus alone, since the stored live-shaped snapshot
      # is the same payload the original ingest read — so this re-parses it with
      # the same pure parsers rather than re-fetching, and reaches no network at
      # all. It reads those snapshots, which under the corpus split live in the
      # content store rather than the blob, so it depends on the job-level
      # base URL, whose store segment is where they live, and a row with no
      # stored snapshot is counted and
      # reported rather than failed.
      #
      # Its write is a direct UPDATE of the index, so the pointer IS the witness
      # here and a plain pointer commit suffices — but it also re-mirrors the
      # touched cases' events, because provisioning reads events back through the
      # content store and a stale events.json would hand a cell the very stamp
      # this pass replaced.
      - name: Backfill the interim arrival stamps
        if: ${{ inputs.repair == 'arrival-backfill' && steps.dedupe-live-rows.outcome == 'success' }}
        # Network-bound like the response-signal backfill rather than the local
        # passes: one content-store read per candidate row, pooled by the shared
        # prefetch, over a class in the thousands. No upstream fetch and no
        # per-row recognition, so the walk is the whole cost.
        timeout-minutes: 20
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPAIR: ${{ inputs.repair }}
          REPAIR_MODE: ${{ inputs.repair_mode }}
          REPAIR_BOUND: ${{ inputs.repair_bound }}
        run: |
          set -euo pipefail
          # Validate the bound before anything else, including the corpus
          # guard: a dispatch that cannot legally apply should say so in
          # seconds, not after a full-population read of the content store.
          # `repair_passes.py` duplicates it word for word so a bad
          # dispatch dies before any credential is minted; this copy is the one
          # of record, because the step has to be safe on whatever reaches it.
          # The refusal names the pass through `${REPAIR}` rather than a literal
          # so the two copies are identical as text, not merely equivalent once
          # expanded.
          if [ "${REPAIR_MODE}" = "apply" ] \
            && ! [[ "${REPAIR_BOUND}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::repair=${REPAIR} with repair_mode=apply needs repair_bound set to a positive integer — the count read off a previous dry-run dispatch's ledger. Re-dispatch with that number."
            exit 1
          fi
          # No committed pointer means no corpus — nothing to re-derive.
          if [ ! -f corpus/corpus.db.ref ]; then
            echo "no corpus pointer yet; skipping the arrival-stamp backfill"; exit 0
          fi
          if [ "${REPAIR_MODE}" = "apply" ]; then
            gh auth setup-git # persist-credentials is false on checkout
          fi
          # Dry-run first, into the summary: this pass's ledger is the reading
          # the apply's bound comes from, and it must outlive the step log. Four
          # things a maintainer weighs there beyond the count.
          #
          # The **forward-exposure** figures — the entries a cell provisioned
          # today under the pre-repair stamp would admit, and the rows whose own
          # disposition is among them. The move histogram beside them is only
          # the *window*: a one-day move on a docket disposed of that day is
          # worse than a month over a quiet one. These are counterfactuals over
          # the corpus at the ledger's `corpus_vintage`, read with no date
          # bound, so they bound what the rule still exposes rather than
          # measuring what a committed cell saw; the committed-output
          # intersection printed with them is the subset worth checking against
          # a grading.
          #
          # The **residue** measurement, which is where conditioning survives:
          # the unrepaired rows whose surviving stamp still admits their own
          # disposition. A claim scoped to the repaired rows says nothing here.
          #
          # The **resolution split**, which says whether the correlation was
          # removed or merely shrunk, and the matched/blind denominators beside
          # it, which say what fraction carries the defect and how much of the
          # population no dispatch of this pass can reach at all.
          #
          # And the per-row fill list, which after the apply is the only record
          # of what each repaired cell's cutoff had been derived from — the
          # corpus holds the new stamp, and `event.yaml` is rewritten with it
          # the next time any cell runs over that event. That record belongs in
          # the freeze-record entry the apply owes, not only in a run summary
          # that expires with the run: the CLI prints it LAST, after every
          # aggregate and the JSON ledger, precisely so the head-first
          # truncation below drops the enumeration rather than the figures.
          # (On an apply this run is a receipt, not a reading.)
          # Bounded into the summary rather than tee'd whole. GitHub caps a step
          # summary at 1 MiB and discards it ENTIRELY above that, warning only —
          # and this pass's per-row lines plus its JSON ledger run to megabytes
          # over a five-figure class, so an untruncated tee would drop the one
          # surface the ledger was meant to outlive the run on. The full output
          # stays in the step log either way.
          summarize() {
            head -c 900000 "$1" >> "$GITHUB_STEP_SUMMARY"
            cat "$1"
          }
          uv run fedcourts backfill-arrival-stamps > /tmp/arrival-dry.txt 2>&1
          summarize /tmp/arrival-dry.txt
          if [ "${REPAIR_MODE}" != "apply" ]; then
            echo "dry-run only; nothing written."
            exit 0
          fi
          uv run fedcourts backfill-arrival-stamps --apply \
            --max-fills "${REPAIR_BOUND}" > /tmp/arrival-apply.txt 2>&1
          summarize /tmp/arrival-apply.txt

      # Drop open SCOTUS merits events whose docket carries no cert grant, in
      # both stores. A merits event is born from a grant — every mint path
      # routes through `opens_merits_proceeding`, which requires the row's
      # `date_cert_granted` — so an open merits-stage event on a row whose
      # grant column is NULL is one no re-ingest or convergence pass
      # reproduces, and one nothing ever closes: merits detection reads the
      # same grant-gated columns, so it parks forever on the
      # listed-unforecastable triage surface rather than resolving. The shape
      # is what a live re-poll leaves behind when it stops reading a grant out
      # of the proceedings and overwrites the stored date with NULL.
      #
      # It needs no ordering against run-seed's scheduled merits-event mint,
      # which is why that sweep did not have to come along: the two populations
      # are disjoint by construction — the mint writes only where
      # `date_cert_granted` is non-NULL, and this removes only where it is NULL
      # — so neither can create or destroy the other's population.
      #
      # The ledger half is what shapes the commit. This deletes committed event
      # directories under `data/` as well as the corpus row, so it reads the
      # remote tip first — the skip guards read committed predict/evaluate
      # output that arrives by collect PR — and stages `data/` with the pointer
      # in ONE commit: an uncommitted ledger half strands a directory under an
      # id the corpus no longer carries, and no later pass re-detects it. An
      # event carrying committed predict/evaluate output, or a committed
      # outcome the open corpus row contradicts, is skipped and reported.
      - name: Remove ungranted merits phantoms
        # The dedupe gate is sharpest here of all the passes: whether an event
        # is a phantom is read off its row's grant column, and an unmerged twin
        # is a second row for the same petition — so the judgment, and the
        # deletion that follows it, must be made on the merged row.
        if: ${{ inputs.repair == 'merits-phantom-removal' && steps.dedupe-live-rows.outcome == 'success' }}
        # Local: both scans are committed ledger artifacts against corpus rows,
        # with no external-service loop.
        timeout-minutes: 8
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPAIR: ${{ inputs.repair }}
          REPAIR_MODE: ${{ inputs.repair_mode }}
          REPAIR_BOUND: ${{ inputs.repair_bound }}
          REPAIR_OPTIONS: ${{ inputs.repair_options }}
        run: |
          set -euo pipefail
          # Validate the bound and the option vocabulary before anything else,
          # including the corpus guard: a dispatch that cannot legally apply
          # should say so in seconds, not after a full scan. `Validate the
          # repair selector` duplicates both word for word so a bad dispatch
          # dies before any credential is minted; this copy is the one of
          # record, because the step has to be safe on whatever reaches it.
          # Both refusals name the pass and its vocabulary through variables
          # rather than literals, so the two copies are identical as text and
          # not merely equivalent once expanded.
          #
          # Stricter than the command, which carries a default bound: a
          # deletion spanning the corpus and the committed ledger states the
          # count it is approving rather than inheriting one.
          if [ "${REPAIR_MODE}" = "apply" ] \
            && ! [[ "${REPAIR_BOUND}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::repair=${REPAIR} with repair_mode=apply needs repair_bound set to a positive integer — the count read off a previous dry-run dispatch's ledger. Re-dispatch with that number."
            exit 1
          fi
          accepted_options="include-failed-attempts"
          include_failed_attempts=0
          option_malformed=0
          while IFS= read -r option; do
            [ -n "$option" ] || continue
            case " ${accepted_options} " in
              *" ${option} "*) ;;
              *)
                echo "::error::repair=${REPAIR} does not accept the option '${option}' — it accepts: ${accepted_options:-none}."
                option_malformed=1
                continue ;;
            esac
            case "$option" in
              include-failed-attempts) include_failed_attempts=1 ;;
            esac
          done < <(printf '%s\n' "${REPAIR_OPTIONS}" | tr -s ', \t\r' '\n')
          if [ "$option_malformed" -ne 0 ]; then
            echo "::error::refusing the whole option list — correct the switches above and re-dispatch."
            exit 1
          fi
          # No committed pointer means no corpus — nothing to remove.
          if [ ! -f corpus/corpus.db.ref ]; then
            echo "no corpus pointer yet; skipping the merits-phantom removal"; exit 0
          fi
          if [ "${REPAIR_MODE}" = "apply" ]; then
            gh auth setup-git # persist-credentials is false on checkout
          fi
          # The pass reads committed ledger artifacts out of `data/` and
          # deletes beside them, and this checkout is only as fresh as the
          # sync — read the remote tip first so the skip guards see every
          # collect PR merged in the gap. Fast-forward only: if an earlier
          # step's push retries were exhausted, its local commit is unpushed
          # while its corpus mutations survive in the workspace DB, and a hard
          # reset would publish that split.
          git fetch origin "$GITHUB_REF_NAME"
          git merge --ff-only FETCH_HEAD
          # `--include-failed-attempts` rides both invocations below or
          # neither, so the ledger the maintainer reads and the removal that
          # follows describe the same population. It is a trade rather than a
          # tidy-up: those records document real spend on an event that names
          # nothing the docket supports, and removing them buys a ledger with
          # no dangling phantom paths at the cost of that failure history. The
          # condition stays strict either way: every file under `predictions/`
          # must be named `attempt.json` and there must be no `evaluations/`
          # directory, so a `usage.json` or `retrieval_log.json` the harness
          # left beside an attempt record keeps the event skipped. Declared
          # outside the guard so the expansion is total under `set -u`.
          attempt_args=()
          if [ "$include_failed_attempts" -eq 1 ]; then
            attempt_args+=(--include-failed-attempts)
          fi
          # Dry-run first, into the summary: the removal-and-skip ledger — every
          # event removed and every skip with its reason — is the reading the
          # apply's bound comes from, and a deletion's record must outlive the
          # step log. (On an apply this run is a receipt, not a reading.)
          uv run fedcourts remove-ungranted-merits-events "${attempt_args[@]}" 2>&1 \
            | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "${REPAIR_MODE}" != "apply" ]; then
            echo "dry-run only; nothing written."
            exit 0
          fi
          uv run fedcourts remove-ungranted-merits-events "${attempt_args[@]}" \
            --apply --max-removals "${REPAIR_BOUND}" 2>&1 \
            | tee -a "$GITHUB_STEP_SUMMARY"

      # Converge stored disposition labels against the current classifier.
      # Events carrying committed predict/evaluate output are held back:
      # relabelling under a scored evaluation would silently restate what was
      # graded, so the ledger names them and the sweep moves on. Reaching them
      # takes the `include-scored` option.
      #
      # The relabel is only half the repair. `regrade-stale` recomputes graded
      # fields under an outcome rather than moving one, so it is the
      # follow-through, not an alternative route: labels first, then a
      # `regrade-stale` dispatch naming the affected judge lines — three per
      # event rather than one per evaluation. One pass per dispatch means that
      # follow-through is a second dispatch rather than a second step, which is
      # what makes it visible: the re-grade backlog a relabel owes is the
      # maintainer's to schedule.
      - name: Converge disposition labels
        if: ${{ inputs.repair == 'disposition-convergence' && steps.dedupe-live-rows.outcome == 'success' }}
        # The scan is local — committed outcome labels against corpus rows —
        # with the apply's writes under `data/`.
        timeout-minutes: 15
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPAIR: ${{ inputs.repair }}
          REPAIR_MODE: ${{ inputs.repair_mode }}
          REPAIR_BOUND: ${{ inputs.repair_bound }}
          REPAIR_OPTIONS: ${{ inputs.repair_options }}
        run: |
          set -euo pipefail
          # Validate the bound and the option vocabulary before anything else,
          # including the corpus guard: a dispatch that cannot legally apply
          # should say so in seconds, not after a full scan. The command
          # refuses an unbounded apply on its own too; this refusal is the one
          # with the maintainer's procedure in it. `Validate the repair
          # selector` duplicates it word for word so a bad dispatch dies before
          # any credential is minted; this copy is the one of record, because
          # the step has to be safe on whatever reaches it. Both refusals name
          # the pass and its vocabulary through variables rather than literals,
          # so the two copies are identical as text and not merely equivalent
          # once expanded.
          if [ "${REPAIR_MODE}" = "apply" ] \
            && ! [[ "${REPAIR_BOUND}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::repair=${REPAIR} with repair_mode=apply needs repair_bound set to a positive integer — the count read off a previous dry-run dispatch's ledger. Re-dispatch with that number."
            exit 1
          fi
          accepted_options="include-scored"
          include_scored=0
          option_malformed=0
          while IFS= read -r option; do
            [ -n "$option" ] || continue
            case " ${accepted_options} " in
              *" ${option} "*) ;;
              *)
                echo "::error::repair=${REPAIR} does not accept the option '${option}' — it accepts: ${accepted_options:-none}."
                option_malformed=1
                continue ;;
            esac
            case "$option" in
              include-scored) include_scored=1 ;;
            esac
          done < <(printf '%s\n' "${REPAIR_OPTIONS}" | tr -s ', \t\r' '\n')
          if [ "$option_malformed" -ne 0 ]; then
            echo "::error::refusing the whole option list — correct the switches above and re-dispatch."
            exit 1
          fi
          # `include-scored` widens the sweep onto events already carrying
          # predict/evaluate output and owes a re-grade for each relabel, so it
          # must carry the bound in EVERY mode — not the apply-only rule above.
          # A dry run that widens the ledger is where the decision to take on
          # that backlog is actually made, so the number is stated there too;
          # what the apply is checked against is the widened dry-run's own
          # relabel count, not the plain run's held-back lines, which bound the
          # population rather than count the rewrites.
          if [ "$include_scored" -eq 1 ] \
            && ! [[ "${REPAIR_BOUND}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::the include-scored option needs repair_bound set to a positive integer — relabelling a graded cell takes on a re-grade backlog, so its size is stated up front in dry-run as much as in apply. Read the held-back lines off a plain dry-run dispatch's ledger."
            exit 1
          fi
          # No committed pointer means no corpus — nothing to converge against.
          if [ ! -f corpus/corpus.db.ref ]; then
            echo "no corpus pointer yet; skipping disposition convergence"; exit 0
          fi
          if [ "${REPAIR_MODE}" = "apply" ]; then
            gh auth setup-git # persist-credentials is false on checkout
          fi
          # The sweep reads committed ledger artifacts out of `data/` and
          # rewrites beside them, so it needs the remote tip, not this
          # checkout's — the scored-cell holdback is keyed on grades that
          # arrive by collect PR. Fast-forward only, for the merits-phantom
          # pass's reason: an unpushed local commit over live corpus mutations
          # must fail this closed rather than be reset away.
          git fetch origin "$GITHUB_REF_NAME"
          git merge --ff-only FETCH_HEAD
          # `--include-scored` rides both invocations below or neither, so the
          # ledger the maintainer reads and the rewrite that follows describe
          # the same population. Without it the sweep converges only events
          # carrying no committed predict/evaluate output: rewriting a graded
          # cell's label would move what a published standing was computed from
          # while the standing itself sat still, so those events are reported
          # instead. With it they are in, which is a bounded decision the
          # validation above makes the maintainer state.
          scored_args=()
          if [ "$include_scored" -eq 1 ]; then
            scored_args+=(--include-scored)
          fi
          # Dry-run first, into the summary: the relabel ledger is the reading
          # the apply's bound comes from, and it must outlive the step log.
          # (On an apply this run is a receipt, not a reading — nobody reads it
          # before the rewrite.)
          uv run fedcourts converge-disposition-labels "${scored_args[@]}" 2>&1 \
            | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "${REPAIR_MODE}" != "apply" ]; then
            echo "dry-run only; nothing written."
            exit 0
          fi
          uv run fedcourts converge-disposition-labels "${scored_args[@]}" \
            --apply --max-relabels "${REPAIR_BOUND}" 2>&1 \
            | tee -a "$GITHUB_STEP_SUMMARY"

      # Record the ledger outcome of every decided declared moment on a selected
      # row that has none, with no lookback: the live cycle's ledger-outcome
      # convergence reaches back 90 days, and this is the same detection and the
      # same writer over the whole population. What it cannot attribute and the
      # corpus already records resolved is marked `resolved_without_outcome`
      # with its reason, so it stays closed and visible; an open gap it cannot
      # attribute stays open. A case whose gap stage carries a committed
      # prediction is held back for the live convergence, which routes the
      # grade to evaluate — this pass has no evaluate queue. Outcomes already
      # recorded are outside the population, so nothing committed is rewritten.
      - name: Record the lost outcomes
        if: ${{ inputs.repair == 'lost-outcomes' && steps.dedupe-live-rows.outcome == 'success' }}
        # One snapshot read per due case, out of the content store under the
        # corpus-split mode, and the apply's writes under `data/`.
        timeout-minutes: 30
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPAIR: ${{ inputs.repair }}
          REPAIR_MODE: ${{ inputs.repair_mode }}
          REPAIR_BOUND: ${{ inputs.repair_bound }}
        run: |
          set -euo pipefail
          # The bound before anything else, as every bounded pass here: the
          # command refuses an unbounded apply on its own too; this refusal is
          # the one with the maintainer's procedure in it. `Validate the repair
          # selector` duplicates it word for word so a bad dispatch dies before
          # any credential is minted; this copy is the one of record.
          if [ "${REPAIR_MODE}" = "apply" ] \
            && ! [[ "${REPAIR_BOUND}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::repair=${REPAIR} with repair_mode=apply needs repair_bound set to a positive integer — the count read off a previous dry-run dispatch's ledger. Re-dispatch with that number."
            exit 1
          fi
          if [ ! -f corpus/corpus.db.ref ]; then
            echo "no corpus pointer yet; skipping the outcome pass"; exit 0
          fi
          if [ "${REPAIR_MODE}" = "apply" ]; then
            gh auth setup-git # persist-credentials is false on checkout
          fi
          # The pass reads committed ledger artifacts out of `data/` — which
          # moments already carry an outcome, which carry a prediction — and
          # writes beside them, so it needs the remote tip, not this checkout's.
          # Fast-forward only, for the merits-phantom pass's reason.
          git fetch origin "$GITHUB_REF_NAME"
          git merge --ff-only FETCH_HEAD
          # Dry-run first, into the summary: the case count it prints
          # (`cases_written=`) is the bound the apply carries.
          uv run fedcourts record-lost-outcomes 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "${REPAIR_MODE}" != "apply" ]; then
            echo "dry-run only; nothing written."
            exit 0
          fi
          uv run fedcourts record-lost-outcomes --apply --max-cases "${REPAIR_BOUND}" 2>&1 \
            | tee -a "$GITHUB_STEP_SUMMARY"

      # Back-fill `stage`, `moment` and `opened_at` onto committed `event.yaml`
      # from the corpus event row: the migration `materialize-event`'s drift
      # warning names, since a cell never rewrites a committed definition. It
      # reads the corpus and writes only under `data/`; `stage` and `moment`
      # are fill-only, and `opened_at` moves on resolved events of unscored
      # cases alone, so no cut and no graded figure moves (docs/pipeline.md).
      - name: Back-fill the committed event definitions
        if: ${{ inputs.repair == 'event-definition-backfill' && steps.dedupe-live-rows.outcome == 'success' }}
        # One scan of the events table against every committed event.yaml.
        timeout-minutes: 15
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPAIR: ${{ inputs.repair }}
          REPAIR_MODE: ${{ inputs.repair_mode }}
          REPAIR_BOUND: ${{ inputs.repair_bound }}
        run: |
          set -euo pipefail
          # The bound before anything else, as every bounded pass here: the
          # command refuses an unbounded apply on its own too; this refusal is
          # the one with the maintainer's procedure in it. `Validate the repair
          # selector` duplicates it word for word so a bad dispatch dies before
          # any credential is minted; this copy is the one of record.
          if [ "${REPAIR_MODE}" = "apply" ] \
            && ! [[ "${REPAIR_BOUND}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::repair=${REPAIR} with repair_mode=apply needs repair_bound set to a positive integer — the count read off a previous dry-run dispatch's ledger. Re-dispatch with that number."
            exit 1
          fi
          if [ ! -f corpus/corpus.db.ref ]; then
            echo "no corpus pointer yet; skipping the event-definition back-fill"; exit 0
          fi
          if [ "${REPAIR_MODE}" = "apply" ]; then
            gh auth setup-git # persist-credentials is false on checkout
          fi
          # The pass reads every committed event.yaml and which cases carry an
          # evaluation, and rewrites beside them, so it needs the remote tip,
          # not this checkout's. Fast-forward only, for the merits-phantom
          # pass's reason.
          git fetch origin "$GITHUB_REF_NAME"
          git merge --ff-only FETCH_HEAD
          # Dry-run first: the ledger (stdout) goes to the summary, and its
          # file count is the bound the apply carries. The per-file list is on
          # stderr, so it lands in the step log — thousands of lines, which a
          # step summary's size cap would not hold twice on an apply. (On an
          # apply this run is a receipt, not a reading.)
          uv run fedcourts backfill-event-definitions | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "${REPAIR_MODE}" != "apply" ]; then
            echo "dry-run only; nothing written."
            exit 0
          fi
          uv run fedcourts backfill-event-definitions --apply \
            --max-rewrites "${REPAIR_BOUND}" | tee -a "$GITHUB_STEP_SUMMARY"

      # Re-derive the interim `amicus_briefs` column under the widened
      # submitted-form reading with the end-of-day cut, and re-freeze the
      # committed interim outcomes that column was frozen onto. The retrospective
      # data motion the widened reading scoped out of itself, pre-registered in
      # `docs/freeze-record.md` (the 2026-09-10 interim-amicus-reading entry,
      # which pre-computes the affected set). The reading is live for every
      # application frozen after it merged; this pass corrects the rows frozen
      # under the old one, so it presupposes that reading is promoted — it rides
      # the same promotion batch.
      #
      # Two writes in one pass. The corpus write is a **direct UPDATE that
      # bypasses the max latch** (the distribution re-derivation's shape): the
      # end-of-day cut lowers a resolved application's count, which the max latch
      # — built to stop a degraded payload lowering a stored count — would reject
      # as a silent no-op through the upsert path. Only resolved applications (a
      # readable disposition date) are touched; an open one is left to the live
      # channel, which polls it under the same reading. The re-freeze write lands
      # in committed `data/` (`outcome.json`), rewriting only
      # `interim_signals.amicus_briefs` and never a `prediction.json`
      # `context.amicus_briefs` — the prediction-time snapshot is frozen by
      # design. So this reads committed `data/` and needs the remote tip (fetch +
      # ff-only, the disposition-convergence pattern), and stages the pointer and
      # the ledger together so the corpus and the outcomes it must match move as
      # one commit.
      #
      # The control is idempotence: re-dispatch this pass in `dry-run` after the
      # apply and it reports `total_changes = 0` unless a new application
      # resolved. There is no incumbent-reading control to run, because the
      # reading is fixed in code rather than selected per dispatch.
      - name: Re-derive amicus counts and re-freeze the interim outcomes
        if: ${{ inputs.repair == 'amicus-rederive' && steps.dedupe-live-rows.outcome == 'success' }}
        # The scan is local — the interim application slice against the pulled
        # blob, one snapshot read per resolved application, and committed
        # `outcome.json` against the re-derived counts — with the apply's writes
        # to the corpus index and under `data/`.
        timeout-minutes: 15
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPAIR: ${{ inputs.repair }}
          REPAIR_MODE: ${{ inputs.repair_mode }}
          REPAIR_BOUND: ${{ inputs.repair_bound }}
        run: |
          set -euo pipefail
          # Validate the bound before anything else, including the corpus guard:
          # a dispatch that cannot legally apply should say so in seconds, not
          # after a full scan. The command refuses an unbounded apply on its own
          # too; this refusal is the one with the maintainer's procedure in it.
          # `repair_passes.py` duplicates it word for word so a bad
          # dispatch dies before any credential is minted; this copy is the one
          # of record, because the step has to be safe on whatever reaches it.
          # The refusal names the pass through `${REPAIR}` rather than a literal
          # so the two copies are identical as text, not merely equivalent once
          # expanded.
          if [ "${REPAIR_MODE}" = "apply" ] \
            && ! [[ "${REPAIR_BOUND}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::repair=${REPAIR} with repair_mode=apply needs repair_bound set to a positive integer — the count read off a previous dry-run dispatch's ledger. Re-dispatch with that number."
            exit 1
          fi
          # No committed pointer means no corpus — nothing to re-derive.
          if [ ! -f corpus/corpus.db.ref ]; then
            echo "no corpus pointer yet; skipping the amicus re-derivation"; exit 0
          fi
          if [ "${REPAIR_MODE}" = "apply" ]; then
            gh auth setup-git # persist-credentials is false on checkout
          fi
          # The re-freeze reads committed `outcome.json` out of `data/` and
          # rewrites beside them, so it needs the remote tip, not this checkout's
          # — an interim outcome minted by a collect PR since the last sync must
          # be visible. Fast-forward only, for the passes' reason: an unpushed
          # local commit over live corpus mutations fails this closed rather than
          # being reset away.
          git fetch origin "$GITHUB_REF_NAME"
          git merge --ff-only FETCH_HEAD
          # Dry-run first, into the summary: the ledger — each resolved
          # application whose count moves old->new, each re-frozen outcome, and
          # the frozen interim-amicus distribution across the committed worklist
          # (the shape the freeze-record entry pre-computes) — is the reading the
          # apply's bound comes from, and it must outlive the step log. It is
          # also the record of a re-derivation that moves a scored claim's
          # resolution end, so it is written down whichever mode ran. (On an
          # apply this run is a receipt, not a reading.) Both runs report the
          # distribution as FOUND, before their own writes, so the apply's copy
          # is the pre-apply shape rather than the converged one — the control
          # re-dispatch below is what shows the post-apply state.
          uv run fedcourts rederive-amicus-briefs 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "${REPAIR_MODE}" != "apply" ]; then
            echo "dry-run only; nothing written."
            exit 0
          fi
          uv run fedcourts rederive-amicus-briefs --apply \
            --max-changes "${REPAIR_BOUND}" 2>&1 \
            | tee -a "$GITHUB_STEP_SUMMARY"

      # Back-fill the cert-stage `cert_amicus_briefs` column over the cert live
      # slice. The live poll writes the column only on rows it still polls, so
      # resolved history stays NULL until this runs. Each cert-form live-slice
      # row is recounted from its latest live-shaped snapshot exactly as ingest
      # counts it, open petitions included, and the write keeps the column's max
      # latch: a NULL is filled and a lower count raised, while a recount below
      # the stored value is reported and never written, since this column has
      # had one reading since its first write and a lower recount means a
      # snapshot that lost entries.
      #
      # Corpus-only: no committed artifact carries this count, so a
      # pointer-only commit, and no fetch/ff-only ahead of it — nothing here
      # reads committed `data/`. Re-dispatching in `dry-run` after the apply is
      # the control: it must report `total_changes = 0`, since a row the poll
      # reads in between is written with the same count.
      - name: Back-fill the cert amicus counts
        if: ${{ inputs.repair == 'cert-amicus-rederive' && steps.dedupe-live-rows.outcome == 'success' }}
        # Network-bound like the distribution re-derivation: under the corpus
        # split the pass reads one content-store object per cert-form live-slice
        # row (well over ten thousand), pooled by the shared prefetch; the blob
        # push is the persist step's. The distribution re-derivation reads a
        # larger population inside the same cap.
        timeout-minutes: 30
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPAIR: ${{ inputs.repair }}
          REPAIR_MODE: ${{ inputs.repair_mode }}
          REPAIR_BOUND: ${{ inputs.repair_bound }}
        run: |
          set -euo pipefail
          # The bound before anything else, as every bounded pass here: the
          # command refuses an unbounded apply on its own too; this refusal is
          # the one with the maintainer's procedure in it. `Validate the repair
          # selector` duplicates it word for word so a bad dispatch dies before
          # any credential is minted; this copy is the one of record.
          if [ "${REPAIR_MODE}" = "apply" ] \
            && ! [[ "${REPAIR_BOUND}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::repair=${REPAIR} with repair_mode=apply needs repair_bound set to a positive integer — the count read off a previous dry-run dispatch's ledger. Re-dispatch with that number."
            exit 1
          fi
          # No committed pointer means no corpus — nothing to back-fill.
          if [ ! -f corpus/corpus.db.ref ]; then
            echo "no corpus pointer yet; skipping the cert amicus back-fill"; exit 0
          fi
          if [ "${REPAIR_MODE}" = "apply" ]; then
            gh auth setup-git # persist-credentials is false on checkout
          fi
          # One pass, whichever mode, as the distribution re-derivation: the
          # command's plan IS its write set and an apply prints the same ledger
          # a dry run would, so a receipt run ahead of it would only repeat a
          # full read of the content store. Declared outside the guard so the
          # expansion is total under `set -u`.
          apply_args=()
          if [ "${REPAIR_MODE}" = "apply" ]; then
            apply_args+=(--apply --max-changes "${REPAIR_BOUND}")
          fi
          uv run fedcourts rederive-cert-amicus-briefs "${apply_args[@]}" 2>&1 \
            | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "${REPAIR_MODE}" != "apply" ]; then
            echo "dry-run only; nothing written."
            exit 0
          fi

      # Back-fill the three withheld cert columns sal-v5 reads —
      # `call_for_response_at`, `distributed_after_call`, `opening_writ` — on
      # the cert live slice the poll no longer reaches. Each row is re-parsed
      # from its newest live-shaped snapshot by the functions ingest calls, and
      # only a NULL is filled: a column already holding a value is never
      # written, which is stricter than the upsert (there a fresh reading
      # replaces the stored one). A count whose snapshot dates the call
      # differently from the stored call is reported, not filled.
      #
      # Corpus-only: no committed artifact carries these columns, so a
      # pointer-only commit, and no fetch/ff-only ahead of it. Re-dispatching in
      # `dry-run` after the apply is the control: it must report
      # `total_fills = 0`.
      - name: Back-fill the sal-v5 cert columns
        if: ${{ inputs.repair == 'salience-cert-backfill' && steps.dedupe-live-rows.outcome == 'success' }}
        # Network-bound like the cert amicus back-fill: one content-store read
        # per cert-form live-slice row still missing a column, pooled by the
        # shared prefetch; the blob push is the persist step's.
        timeout-minutes: 30
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPAIR: ${{ inputs.repair }}
          REPAIR_MODE: ${{ inputs.repair_mode }}
          REPAIR_BOUND: ${{ inputs.repair_bound }}
        run: |
          set -euo pipefail
          # The bound before anything else, as every bounded pass here.
          # `Validate the repair selector` duplicates it word for word so a bad
          # dispatch dies before any credential is minted; this copy is the one
          # of record.
          if [ "${REPAIR_MODE}" = "apply" ] \
            && ! [[ "${REPAIR_BOUND}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::repair=${REPAIR} with repair_mode=apply needs repair_bound set to a positive integer — the count read off a previous dry-run dispatch's ledger. Re-dispatch with that number."
            exit 1
          fi
          # No committed pointer means no corpus — nothing to back-fill.
          if [ ! -f corpus/corpus.db.ref ]; then
            echo "no corpus pointer yet; skipping the sal-v5 cert back-fill"; exit 0
          fi
          if [ "${REPAIR_MODE}" = "apply" ]; then
            gh auth setup-git # persist-credentials is false on checkout
          fi
          # One pass, whichever mode, as the cert amicus back-fill: the
          # command's plan IS its write set. Declared outside the guard so the
          # expansion is total under `set -u`.
          apply_args=()
          if [ "${REPAIR_MODE}" = "apply" ]; then
            apply_args+=(--apply --max-fills "${REPAIR_BOUND}")
          fi
          uv run fedcourts backfill-salience-cert-columns "${apply_args[@]}" 2>&1 \
            | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "${REPAIR_MODE}" != "apply" ]; then
            echo "dry-run only; nothing written."
            exit 0
          fi

      # Re-read the resolved interim applications and fill `interim_reading`,
      # the finer interim reading the live application branch stores beside the
      # registered `disposition` at ingest. The live rotation skips a resolved
      # application, so resolved history stays NULL until this runs, and the
      # statpack's finer pool refuses a rate over any Term left unread. Each
      # row is re-read from its latest live-shaped snapshot by the function
      # ingest calls; a NULL is filled, and a stored value that differs is
      # overwritten and listed in the ledger. The registered `disposition` is
      # never read into or written.
      #
      # Corpus-only: `outcome.json` is written once, at resolution, so no
      # committed artifact moves; a pointer-only commit, and no fetch/ff-only
      # ahead of it. Re-dispatching in `dry-run` after the apply is the
      # control: it must report `total_changes = 0`.
      - name: Re-read the resolved applications
        if: ${{ inputs.repair == 'application-reread' && steps.dedupe-live-rows.outcome == 'success' }}
        # Network-bound like the cert amicus back-fill: one content-store read
        # per resolved application row (about twelve thousand), pooled by the
        # shared prefetch; the blob push is the persist step's.
        timeout-minutes: 30
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPAIR: ${{ inputs.repair }}
          REPAIR_MODE: ${{ inputs.repair_mode }}
          REPAIR_BOUND: ${{ inputs.repair_bound }}
        run: |
          set -euo pipefail
          # The bound before anything else, as every bounded pass here.
          # `Validate the repair selector` duplicates it word for word so a bad
          # dispatch dies before any credential is minted; this copy is the one
          # of record.
          if [ "${REPAIR_MODE}" = "apply" ] \
            && ! [[ "${REPAIR_BOUND}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::repair=${REPAIR} with repair_mode=apply needs repair_bound set to a positive integer — the count read off a previous dry-run dispatch's ledger. Re-dispatch with that number."
            exit 1
          fi
          # No committed pointer means no corpus — nothing to re-read.
          if [ ! -f corpus/corpus.db.ref ]; then
            echo "no corpus pointer yet; skipping the application re-read"; exit 0
          fi
          if [ "${REPAIR_MODE}" = "apply" ]; then
            gh auth setup-git # persist-credentials is false on checkout
          fi
          # One pass, whichever mode, as the cert amicus back-fill: the
          # command's plan IS its write set. Declared outside the guard so the
          # expansion is total under `set -u`.
          apply_args=()
          if [ "${REPAIR_MODE}" = "apply" ]; then
            apply_args+=(--apply --max-changes "${REPAIR_BOUND}")
          fi
          uv run fedcourts reread-applications "${apply_args[@]}" 2>&1 \
            | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "${REPAIR_MODE}" != "apply" ]; then
            echo "dry-run only; nothing written."
            exit 0
          fi

      # Commit the pass's apply: one step for every pass in this job but the
      # three fetching passes, whose slice deadlines charge their own push and
      # commit to their own step and so keep them there. Blob before pointer
      # commit, as everywhere. What it stages, its commit message and what it
      # says when nothing moved are the pass's entry in the pass table
      # (src/fedcourtsai/repair_passes.py), run by path without importing the
      # package. That file is read from the working tree the sync step moved
      # to the default branch's tip, like every `uv run fedcourts` here, so a
      # pass's record and the workflow that ran it come from one commit only
      # while no commit lands mid-run. A pass step that failed or was cut
      # short stops the job before this step, so nothing it half-wrote is
      # committed.
      - name: Persist the pass's write
        if: ${{ inputs.repair_mode == 'apply' }}
        # The push of a ~1GB blob and a retrying pointer push.
        timeout-minutes: 15
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPAIR: ${{ inputs.repair }}
          REPAIR_MODE: ${{ inputs.repair_mode }}
        run: |
          set -euo pipefail
          # No committed pointer means no corpus — the pass skipped too.
          if [ ! -f corpus/corpus.db.ref ]; then
            echo "no corpus pointer yet; nothing to persist"; exit 0
          fi
          if [ "${REPAIR_MODE}" != "apply" ]; then
            echo "dry-run only; nothing written."
            exit 0
          fi
          python3 -I -S src/fedcourtsai/repair_passes.py persist \
            > "${RUNNER_TEMP}/persist-record"
          mapfile -t record < "${RUNNER_TEMP}/persist-record"
          if [ "${#record[@]}" -ne 4 ]; then
            echo "::error::the pass table's persist record for ${REPAIR} is not four lines"
            exit 1
          fi
          stage="${record[0]}"; message="${record[1]}"
          label="${record[2]}"; unchanged="${record[3]}"
          gh auth setup-git # persist-credentials is false on checkout
          uv run fedcourts corpus-push
          git add corpus/corpus.db.ref
          if [ "${stage}" = "pointer+data" ] && [ -d data ]; then
            git add data/
          fi
          if git diff --cached --quiet; then
            echo "${unchanged}"
            exit 0
          fi
          git commit -m "${message}"
          bash "${GITHUB_WORKSPACE}/.github/actions/commit-corpus-to-main/push_with_retry.sh" \
            "${label}"

      # Trailing, NON-BLOCKING data-validation, as on run-pull's and run-seed's
      # writer jobs: produce the correctness verdict on the now-current corpus
      # and publish it for run-ops to present and escalate — loud-not-fatal by
      # contract.
      #
      # It matters more here than the cadence alone suggests, because a pass
      # can legitimately shrink the corpus: the merits-phantom removal deletes
      # rows, and the verdict this publishes is the next run's monotonic
      # row-count baseline. Republishing it after the pass is what keeps
      # run-seed's next verdict from reading a deliberate removal as a corpus
      # shrink.
      #
      # `continue-on-error` protects the step from its OWN failure; without a
      # status function the implicit `success()` still lets any unrelated
      # upstream failure skip it — so a refused pass would withhold the corpus
      # data-health reading, which is exactly when it is most wanted.
      # `!cancelled()` restores it — NOT `always()`, because a cancelled job
      # (the hard timeout-minutes kill, an OOM) is stopped mid-step, and a
      # verdict over that reports a corpus state nobody committed. The
      # corpus-pull gate is the same argument applied to the corpus on disk: a
      # run that failed before the pull has no corpus, and `validate-corpus` is
      # graceful about that — it returns a *skipped* verdict, which would
      # replace the last real reading with a blank one and leave the next run
      # no baseline.
      #
      # One case the gates do NOT cover, and deliberately: an apply that pushed
      # the blob and then failed before its pointer commit (in the persist
      # step, or in a fetching pass's own) holds rows no commit
      # covers, and this step still publishes a verdict over them. That is more
      # reachable here than on run-seed, precisely because these passes fail
      # hard rather than absorbing — so read a verdict published by a red run
      # as describing the runner's blob, not the committed corpus. Closing it
      # means gating this step on every pass's outcome, which is a wider change
      # than this one.
      #
      # Apply only. A dry run holds no App token to publish with, and its blob
      # carries the dedupe it applied locally and never pushed, so a verdict
      # over it would describe a corpus nobody committed.
      - name: Produce + publish the corpus validation verdict
        if: ${{ !cancelled() && inputs.repair_mode == 'apply' && steps.corpus-pull.outcome == 'success' }}
        continue-on-error: true
        uses: ./.github/actions/publish-corpus-verdict
        with:
          token: ${{ steps.app-token.outputs.token }}

  # The credential split. Seven of the passes fetch and parse third-party
  # content — the Court's opinion and order PDFs, a Term's docket JSON, the
  # scanned filings OCR reads, the filings the re-cut re-reads, the dockets
  # and filings the document back-fill fetches — and a parser fed
  # attacker-shaped bytes is the step most likely to run code nobody wrote.
  # So for these seven the parse runs in a job of its own that holds NO
  # credential,
  # and the jobs on either side talk to it only through two small JSON files
  # with versioned, validated schemas:
  #
  #   handoff-projection  read-only role; pulls the corpus and writes the few
  #                       PUBLIC facts the parse needs (fedcourtsai/handoff.py)
  #   handoff-parse       no environment, no `id-token`, no secret; fetches
  #                       and parses, prints the dry-run ledger, writes the
  #                       plan, and on an apply uploads it
  #   votes / applications / opinion-record / documents
  #                       on an apply only: the writer, which takes the lock,
  #                       re-validates the plan whole as untrusted input and
  #                       applies it, fetching nothing
  #   documents-dry-run   the re-cut's dry run only: the read-only reader that
  #                       judges the plan against the stored text, writing
  #                       nothing
  #
  # Why a job boundary and not a blanked step env: in a job holding
  # `id-token: write` the runner hands every step the OIDC request pair at
  # run time, after the step's own `env:`, so a step cannot be put out of
  # reach of minting a token for any role its environment is trusted by.
  # A job without the permission has no pair at all, and its guard is true.
  #
  # The repository is public, so a run artifact is downloadable by any
  # signed-in user while it exists. Both files therefore carry public Court
  # data only — case ids, docket numbers, listing keys, docket JSON as the
  # Court serves it, facts read off the Court's own documents — never a corpus
  # row, a snapshot or a stored document; each model's docstring says why its
  # fields are public. One day of retention, and named per run. Four plans
  # carry what a self-represented filer's contact details sit in: the
  # application plan's served docket JSON, and the OCR, re-cut and document
  # back-fill plans' text read off the filings themselves. Each crosses under its own PII carve-out
  # in docs/data-sources.md (*PII stance*).
  handoff-projection:
    needs: [authorize, validate]
    if: >-
      ${{ (inputs.repair == 'opinion-votes' || inputs.repair == 'order-votes' || inputs.repair == 'application-backfill' || inputs.repair == 'opinion-record' || inputs.repair == 'ocr-recovery' || inputs.repair == 'recut' || inputs.repair == 'document-backfill')
      && needs.authorize.result == 'success'
      && (needs.authorize.outputs.attempt == github.run_attempt
      || contains(needs.authorize.outputs.rerunners, format(',{0},', github.triggering_actor))) }}
    runs-on: ubuntu-26.04
    # Setup and the read-only corpus pull (about a gigabyte); each projection
    # is one local query, but the OCR recovery's, the re-cut's and the
    # document back-fill's, which walk the live slice's documents in the
    # content store (their steps' own caps), the last behind its dedupe.
    timeout-minutes: 40
    environment: prod
    permissions:
      contents: read
      id-token: write # assume the read-only AWS role to pull the corpus
    outputs:
      # A writer that reads the projection back (the OCR recovery's, the
      # re-cut's and the document back-fill's bind their plans to it)
      # downloads this exact artifact by id:
      # the parse can replace an artifact by name, but cannot forge another
      # job's outputs.
      projection-artifact: ${{ steps.upload-projection.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Sync the working tree to the current tip of the default branch
        # The vote projection is keyed on the committed outcomes, which arrive
        # by the writers' own commits. The repo is public, so this read-only
        # fetch needs no credentials.
        run: |
          set -euo pipefail
          git fetch origin "${GITHUB_REF_NAME}"
          git reset --hard FETCH_HEAD

      - uses: ./.github/actions/setup-python-env
        with:
          restore-cache: "false"

      - uses: ./.github/actions/corpus-readonly
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME_READONLY }}
          aws-region: ${{ vars.AWS_REGION }}
          corpus-base-url: ${{ vars.CORPUS_BASE_URL }}

      # Each population case's docket number, keyed by its ledger case id.
      - name: Write the vote projection
        if: ${{ inputs.repair == 'opinion-votes' || inputs.repair == 'order-votes' }}
        env:
          REPAIR: ${{ inputs.repair }}
          HANDOFF_PROJECTION: ${{ runner.temp }}/handoff/projection.json
        run: |
          set -euo pipefail
          if [ "${REPAIR}" = "opinion-votes" ]; then
            uv run fedcourts stamp-opinion-votes --emit-corpus-projection "${HANDOFF_PROJECTION}"
          else
            uv run fedcourts stamp-order-votes --emit-corpus-projection "${HANDOFF_PROJECTION}"
          fi

      # The Term's highest stored serial and its live-owned serials.
      - name: Write the application back-fill projection
        if: ${{ inputs.repair == 'application-backfill' }}
        env:
          REPAIR: ${{ inputs.repair }}
          REPAIR_TARGET: ${{ inputs.repair_target }}
          HANDOFF_PROJECTION: ${{ runner.temp }}/handoff/projection.json
        run: |
          set -euo pipefail
          # A step of record for the Term refusal; `Validate the repair
          # selector` duplicates it word for word.
          if ! [[ "${REPAIR_TARGET}" =~ ^[0-9]{2}$ ]]; then
            echo "::error::repair=${REPAIR} needs repair_target set to a two-digit October Term, e.g. 24 — the back-fill reads one named Term per dispatch, so its ledger and the bound an apply carries answer for the same Term. Re-dispatch with the Term."
            exit 1
          fi
          uv run fedcourts backfill-applications --term "${REPAIR_TARGET}" \
            --emit-corpus-projection "${HANDOFF_PROJECTION}"

      # The (Term, listing number) of each document the table already records,
      # so the parse fetches only the rest. The Term range is the pass's, pinned
      # here and in the two jobs after this one.
      - name: Write the opinion-record projection
        if: ${{ inputs.repair == 'opinion-record' }}
        env:
          HANDOFF_PROJECTION: ${{ runner.temp }}/handoff/projection.json
        run: |
          set -euo pipefail
          uv run fedcourts backfill-opinion-record --first-term 2020 --last-term 2025 \
            --emit-corpus-projection "${HANDOFF_PROJECTION}"

      # The recovery class and the worklist the parse reads: on an apply the
      # first `repair_bound` candidates in class order, the slice the pass has
      # always taken; on a dry run a spread sample of the class, whose URLs the
      # parse probes. The class ledger it prints is the dry run's reading, the
      # one an apply's bound is read off; the probe's statuses follow in the
      # parse's summary. It fetches nothing.
      - name: Write the OCR worklist
        if: ${{ inputs.repair == 'ocr-recovery' }}
        # The class walk reads every live-slice case's stored documents from
        # the content store: 133-162 s on the blobs it has been timed on.
        timeout-minutes: 15
        env:
          # The class walk reads each case's documents from the content store.
          FEDCOURTS_CORPUS_BASE_URL: ${{ vars.CORPUS_BASE_URL }}
          REPAIR: ${{ inputs.repair }}
          REPAIR_MODE: ${{ inputs.repair_mode }}
          REPAIR_BOUND: ${{ inputs.repair_bound }}
          HANDOFF_PROJECTION: ${{ runner.temp }}/handoff/projection.json
        run: |
          set -euo pipefail
          # A step of record for the bound; `repair_passes.py` duplicates it
          # word for word.
          if [ "${REPAIR_MODE}" = "apply" ] \
            && ! [[ "${REPAIR_BOUND}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::repair=${REPAIR} with repair_mode=apply needs repair_bound set to a positive integer — the count read off a previous dry-run dispatch's ledger. Re-dispatch with that number."
            exit 1
          fi
          slice_args=()
          if [ "${REPAIR_MODE}" = "apply" ]; then
            slice_args+=(--max-cases "${REPAIR_BOUND}")
          fi
          # The summary is capped: GitHub errors the file command past 1 MiB,
          # and the dry run's ledger names the whole class. The head reaches
          # the summary; the full ledger is in the step log.
          uv run fedcourts ocr-recover-petitions --emit-worklist "${HANDOFF_PROJECTION}" \
            "${slice_args[@]}" > /tmp/ocr-projection.txt
          cat /tmp/ocr-projection.txt
          head -n 60 /tmp/ocr-projection.txt >> "$GITHUB_STEP_SUMMARY"

      # The re-cut class in scope and the slice the parse re-cuts: the first
      # `repair_bound` candidates in class order, in either mode — the dry run
      # spends the bound too, because what a candidate comes to is only known
      # from the served PDF — or, on a dry run with no bound, the whole class,
      # which the parse's deadline then bounds. The class is every stored
      # petition, application or appendix that is truncated, not OCR-derived
      # (an OCR-recovered row is head-cut by design), carries no `[pipeline
      # note:` line and has one Court URL, over the predict-relevant live-slice
      # rows, or the whole live slice with the `all-live` option. It fetches
      # nothing; the ledger it prints is the class reading.
      #
      # No dedupe prerequisite, unlike the corpus job's passes: that one exists
      # for the passes that read a row's columns, and this pass reads and
      # writes stored documents alone, each re-checked by case and kind. The
      # scope's predict-relevance does read a row's columns, but a live-minted
      # twin can only move which half of a pair a filing is walked under until
      # the dedupe merges it, and the merge fills documents in on the survivor,
      # so a re-cut written to either half is the row that survives or one the
      # merge drops — never a wrong text.
      - name: Write the re-cut worklist
        if: ${{ inputs.repair == 'recut' }}
        # The scope's walk reads its cases' stored documents from the content
        # store: the predict-relevant walk is a subset of the OCR recovery's
        # whole-live-slice walk (133-162 s), and `all-live` is that walk.
        timeout-minutes: 15
        env:
          # The class walk reads each case's documents from the content store.
          FEDCOURTS_CORPUS_BASE_URL: ${{ vars.CORPUS_BASE_URL }}
          REPAIR: ${{ inputs.repair }}
          REPAIR_MODE: ${{ inputs.repair_mode }}
          REPAIR_BOUND: ${{ inputs.repair_bound }}
          REPAIR_OPTIONS: ${{ inputs.repair_options }}
          HANDOFF_PROJECTION: ${{ runner.temp }}/handoff/projection.json
        run: |
          set -euo pipefail
          # Validate the bound and the option vocabulary before anything else.
          # `repair_passes.py` duplicates each refusal word for word so a bad
          # dispatch dies before any credential is minted; this copy is the one
          # of record, because the step has to be safe on whatever reaches it.
          if [ "${REPAIR_MODE}" = "apply" ] \
            && ! [[ "${REPAIR_BOUND}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::repair=${REPAIR} with repair_mode=apply needs repair_bound set to a positive integer — the count read off a previous dry-run dispatch's ledger. Re-dispatch with that number."
            exit 1
          fi
          if [ -n "${REPAIR_BOUND}" ] \
            && ! [[ "${REPAIR_BOUND}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::repair=${REPAIR} reads repair_bound in BOTH modes, so it must be a positive integer wherever it is set — a bound its dry run would also spend. Clear the field or correct the number."
            exit 1
          fi
          accepted_options="all-live"
          scope_args=()
          option_malformed=0
          while IFS= read -r option; do
            [ -n "$option" ] || continue
            case " ${accepted_options} " in
              *" ${option} "*) ;;
              *)
                echo "::error::repair=${REPAIR} does not accept the option '${option}' — it accepts: ${accepted_options:-none}."
                option_malformed=1
                continue ;;
            esac
            case "$option" in
              all-live) scope_args=(--all-live) ;;
            esac
          done < <(printf '%s\n' "${REPAIR_OPTIONS}" | tr -s ', \t\r' '\n')
          if [ "$option_malformed" -ne 0 ]; then
            echo "::error::refusing the whole option list — correct the switches above and re-dispatch."
            exit 1
          fi
          # The scope rides in the worklist from here on: the reader and the
          # writer read it off the projection's own file, and the witness off
          # the writer's ledger, so no later job re-reads the option.
          slice_args=()
          if [ -n "${REPAIR_BOUND}" ]; then
            slice_args+=(--max-cases "${REPAIR_BOUND}")
          fi
          # The summary is capped: GitHub errors the file command past 1 MiB.
          # The head reaches the summary; the full ledger is in the step log.
          uv run fedcourts recut-documents --emit-worklist "${HANDOFF_PROJECTION}" \
            "${scope_args[@]}" "${slice_args[@]}" > /tmp/recut-projection.txt
          cat /tmp/recut-projection.txt
          head -n 60 /tmp/recut-projection.txt >> "$GITHUB_STEP_SUMMARY"

      # The document back-fill reads a row's columns (predict-relevance, the
      # grant, the merits briefing date, the floor stamp), so it reads the
      # merged row of a live-minted twin pair, as the corpus job's passes do:
      # the dedupe prerequisite, applied to this runner's copy alone. The role
      # is read-only and the remote-writes switch is off, so nothing it merges
      # leaves the runner; the writer applies the same dedupe under the lock
      # before it walks. The two can still read a merged pair apart (this
      # copy's merge mirrors no moved payload, so the walk here may not see a
      # survivor's moved documents), and the writer then writes nothing for it:
      # a candidate whose gap differs from its worklist item is `left_class`.
      - name: Dedupe live-minted duplicate rows
        id: dedupe-live-rows
        if: ${{ inputs.repair == 'document-backfill' }}
        timeout-minutes: 10
        env:
          FEDCOURTS_CORPUS_BASE_URL: ${{ vars.CORPUS_BASE_URL }}
        run: |
          set -euo pipefail
          uv run fedcourts dedupe-live-rows 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          uv run fedcourts dedupe-live-rows --apply
          echo "dedupe applied to this runner's copy only; nothing pushed."

      - name: Write the document back-fill worklist
        if: ${{ inputs.repair == 'document-backfill' && steps.dedupe-live-rows.outcome == 'success' }}
        # One walk of the predict-relevant population's stored documents: a
        # strict subset of the OCR recovery's 133-162 s whole-live-slice walk.
        timeout-minutes: 15
        env:
          # The class walk reads each case's documents from the content store.
          FEDCOURTS_CORPUS_BASE_URL: ${{ vars.CORPUS_BASE_URL }}
          REPAIR: ${{ inputs.repair }}
          REPAIR_MODE: ${{ inputs.repair_mode }}
          REPAIR_BOUND: ${{ inputs.repair_bound }}
          HANDOFF_PROJECTION: ${{ runner.temp }}/handoff/projection.json
        run: |
          set -euo pipefail
          # Validate the bound before anything else. `repair_passes.py`
          # duplicates each refusal word for word so a bad dispatch dies before
          # any credential is minted; this copy is the one of record, because
          # the step has to be safe on whatever reaches it.
          if [ "${REPAIR_MODE}" = "apply" ] \
            && ! [[ "${REPAIR_BOUND}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::repair=${REPAIR} with repair_mode=apply needs repair_bound set to a positive integer — the count read off a previous dry-run dispatch's ledger. Re-dispatch with that number."
            exit 1
          fi
          # And the every-mode half, because this pass's dry run spends the
          # bound too: it fetches one paced docket per candidate.
          if [ -n "${REPAIR_BOUND}" ] \
            && ! [[ "${REPAIR_BOUND}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::repair=${REPAIR} reads repair_bound in BOTH modes, so it must be a positive integer wherever it is set — a bound its dry run would also spend. Clear the field or correct the number."
            exit 1
          fi
          slice_args=()
          if [ -n "${REPAIR_BOUND}" ]; then
            slice_args+=(--max-cases "${REPAIR_BOUND}")
          fi
          # The summary is capped: GitHub errors the file command past 1 MiB.
          # The head reaches the summary; the full ledger is in the step log.
          uv run fedcourts backfill-documents --emit-worklist "${HANDOFF_PROJECTION}" \
            "${slice_args[@]}" > /tmp/document-projection.txt
          cat /tmp/document-projection.txt
          head -n 60 /tmp/document-projection.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the projection
        id: upload-projection
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: repair-projection-${{ github.run_id }}
          path: ${{ runner.temp }}/handoff/projection.json
          if-no-files-found: error
          overwrite: true
          # Public Court identifiers only (see the job comment above); one day,
          # because it exists to hand one file to the next job.
          retention-days: 1

  # The parse: every fetch from the Court's site and every parse of what it
  # served happens here and nowhere else. No `environment:`, so no environment
  # secret or variable is in reach; no `id-token`, so no OIDC request pair; no
  # App token. The guard below asserts the two properties a job could still
  # be handed by mistake, and is true here because the permission is absent.
  #
  # What it does NOT remove: the steps run as one user on one runner, so a
  # parse that ran hostile code could alter what this job's later steps
  # execute (the upload action among them), which hold the job's own runtime
  # token for this run's artifacts and the Actions cache. A different plan file
  # is refused by the writer unless every row is one an honest parse could have
  # produced; the uv cache is never saved from here, and the remaining cache
  # path is stated in docs/security.md, *S3 / the private stores*.
  handoff-parse:
    needs: [authorize, validate, handoff-projection]
    if: >-
      ${{ (inputs.repair == 'opinion-votes' || inputs.repair == 'order-votes' || inputs.repair == 'application-backfill' || inputs.repair == 'opinion-record' || inputs.repair == 'ocr-recovery' || inputs.repair == 'recut' || inputs.repair == 'document-backfill')
      && needs.authorize.result == 'success'
      && (needs.authorize.outputs.attempt == github.run_attempt
      || contains(needs.authorize.outputs.rerunners, format(',{0},', github.triggering_actor))) }}
    runs-on: ubuntu-26.04
    # The longest pass step's 60-minute cap plus setup; the OCR recovery's
    # chain (its binaries' 5 minutes and its 45-minute read), the re-cut's
    # 30-minute read and the document back-fill's 30-minute fetch are shorter.
    timeout-minutes: 80
    permissions:
      contents: read
    outputs:
      # Read by a writer that downloads the plan by this id rather than by
      # name (the OCR recovery's, the re-cut's and the document back-fill's,
      # and the re-cut's dry-run reader), so no other job's upload can stand in
      # for it.
      plan-artifact: ${{ steps.upload-plan.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Sync the working tree to the current tip of the default branch
        # The vote passes read the committed outcomes they plan stamps for.
        # The repo is public, so this read-only fetch needs no credentials.
        run: |
          set -euo pipefail
          git fetch origin "${GITHUB_REF_NAME}"
          git reset --hard FETCH_HEAD

      # Restores the uv cache but never saves one: a cache written after a
      # parse ran would be built on a runner that parse could have altered.
      - uses: ./.github/actions/setup-python-env
        with:
          save-cache: "false"

      # The credential split's tripwire, as on summarize's generate job: no
      # AWS variable beyond the region and no OIDC request pair may exist here.
      # True by construction — the job has no `id-token` permission and no
      # environment — and a test pins that a job carrying this guard never
      # holds `id-token`, so the guard cannot be made false by a later
      # edit to the permissions.
      - name: Assert no credential reaches the parse
        run: |
          set -euo pipefail
          if env | grep -E '^AWS_' | grep -vE '^AWS_(REGION|DEFAULT_REGION)=' > /dev/null; then
            echo "::error::AWS credential variables reached the parse job"
            exit 1
          fi
          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "::error::OIDC token minting is reachable from the parse job"
            exit 1
          fi
          echo "no cloud credential in the parse job"

      # The two binaries the OCR recovery's recognition shells out to, and the
      # one binary dependency any pass here has: `pdftoppm` (poppler-utils)
      # renders a page and `tesseract` reads it. Installed in this job alone —
      # deliberately not in the devcontainer, the Python environment or any
      # job holding a credential, as on run-seed's OCR sweep parse — and gated
      # on the selector so the other passes never pay for them. From the
      # runner image's own Ubuntu archive: no third-party repository, no added
      # signing key, nothing this workflow trusts that it did not already
      # trust. The resolved versions are echoed into the summary rather than
      # pinned in the argument list, because an exact apt pin goes stale the
      # week the runner image rolls and would fail the pass for a reason that
      # has nothing to do with the corpus; what a recovered text was read by is
      # then a fact the run records. It runs on a dry run too, which probes and
      # reads nothing: two packages are seconds of work, and proving the
      # install on the run a maintainer reads is worth more than the seconds.
      - name: Install the OCR binaries
        if: ${{ inputs.repair == 'ocr-recovery' }}
        timeout-minutes: 5
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 update -qq
          sudo apt-get -o Acquire::Retries=3 install -y -qq --no-install-recommends \
            tesseract-ocr poppler-utils
          {
            echo "OCR binaries:"
            # Both write their version banner to stderr and neither guarantees a
            # zero exit for it, so the reads are made total rather than left to
            # fail a step whose real work has not started.
            tesseract --version 2>&1 | head -n 1 || true
            pdftoppm -v 2>&1 | head -n 1 || true
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Download the projection
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: repair-projection-${{ github.run_id }}
          path: ${{ runner.temp }}/handoff

      # Read each outcome's record off the Court's documents. An outcome
      # carrying the same record is planned as unchanged, which makes a re-run
      # the control; one carrying a different record is held back and reported
      # unless `replace-differing` is set. The ledger here is the one an
      # apply's bound is read from, as everywhere.
      - name: Read the vote records
        if: ${{ inputs.repair == 'opinion-votes' || inputs.repair == 'order-votes' }}
        timeout-minutes: 45
        env:
          REPAIR: ${{ inputs.repair }}
          REPAIR_OPTIONS: ${{ inputs.repair_options }}
          HANDOFF_PROJECTION: ${{ runner.temp }}/handoff/projection.json
          HANDOFF_PLAN: ${{ runner.temp }}/handoff/plan.json
        run: |
          set -euo pipefail
          # A step of record for the option vocabulary; `Validate the repair
          # selector` duplicates it word for word.
          accepted_options="replace-differing"
          replace_differing=0
          option_malformed=0
          while IFS= read -r option; do
            [ -n "$option" ] || continue
            case " ${accepted_options} " in
              *" ${option} "*) ;;
              *)
                echo "::error::repair=${REPAIR} does not accept the option '${option}' — it accepts: ${accepted_options:-none}."
                option_malformed=1
                continue ;;
            esac
            case "$option" in
              replace-differing) replace_differing=1 ;;
            esac
          done < <(printf '%s\n' "${REPAIR_OPTIONS}" | tr -s ', \t\r' '\n')
          if [ "$option_malformed" -ne 0 ]; then
            echo "::error::refusing the whole option list — correct the switches above and re-dispatch."
            exit 1
          fi
          parse_args=()
          if [ "$replace_differing" -eq 1 ]; then
            parse_args+=(--replace-differing)
          fi
          if [ "${REPAIR}" = "opinion-votes" ]; then
            uv run fedcourts stamp-opinion-votes --projection "${HANDOFF_PROJECTION}" \
              --plan-out "${HANDOFF_PLAN}" "${parse_args[@]}" 2>&1 \
              | tee -a "$GITHUB_STEP_SUMMARY"
          else
            uv run fedcourts stamp-order-votes --projection "${HANDOFF_PROJECTION}" \
              --plan-out "${HANDOFF_PLAN}" "${parse_args[@]}" 2>&1 \
              | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      # The walk: one Term's application serials from 1, against the stored
      # serials the projection carries, so a live-owned serial is never
      # fetched. Identity, the ownership re-read and the prediction guard need
      # the corpus, so they are the writer's; this ledger's count is an upper
      # bound on what an apply lands.
      - name: Walk the application back-fill
        if: ${{ inputs.repair == 'application-backfill' }}
        # The walk stops itself at 30 minutes (`--max-run-seconds`) and prints
        # what it read, well inside this cap, so a slow upstream still leaves a
        # ledger; the apply refuses a walk that stopped short of the Term's end.
        # A Term runs about 1,000 to 1,500 paced fetches.
        timeout-minutes: 45
        env:
          REPAIR: ${{ inputs.repair }}
          REPAIR_TARGET: ${{ inputs.repair_target }}
          HANDOFF_PROJECTION: ${{ runner.temp }}/handoff/projection.json
          HANDOFF_PLAN: ${{ runner.temp }}/handoff/plan.json
        run: |
          set -euo pipefail
          # A step of record for the Term refusal; `Validate the repair
          # selector` duplicates it word for word.
          if ! [[ "${REPAIR_TARGET}" =~ ^[0-9]{2}$ ]]; then
            echo "::error::repair=${REPAIR} needs repair_target set to a two-digit October Term, e.g. 24 — the back-fill reads one named Term per dispatch, so its ledger and the bound an apply carries answer for the same Term. Re-dispatch with the Term."
            exit 1
          fi
          uv run fedcourts backfill-applications --term "${REPAIR_TARGET}" \
            --projection "${HANDOFF_PROJECTION}" --plan-out "${HANDOFF_PLAN}" \
            --max-run-seconds 1800 2>&1 \
            | tee -a "$GITHUB_STEP_SUMMARY"

      # Fetch and read every listed document the projection does not record.
      #
      # The Term range is pinned rather than spent on a dispatch input: the
      # record's first phase is OT2020–OT2025, and OT2017–OT2019 are left out
      # by design, since every listing row there links into a whole
      # preliminary-print or bound volume and the pass would skip each one
      # unfetched. A dry run and the apply it bounds therefore always read the
      # same Terms, so the bound read off one answers for the other.
      - name: Read the opinion record
        if: ${{ inputs.repair == 'opinion-record' }}
        # About four seconds a document — the 1 req/s pacing plus the PDF
        # parse — over the roughly 380 documents the six Terms list
        # unfetched-and-unskipped: about 25 minutes, so the cap is better than
        # twice that for a slower runner or a slow site.
        timeout-minutes: 60
        env:
          HANDOFF_PROJECTION: ${{ runner.temp }}/handoff/projection.json
          HANDOFF_PLAN: ${{ runner.temp }}/handoff/plan.json
        run: |
          set -euo pipefail
          # The readings — every document's opinions, and each refusal's reason
          # — are a JSON array on stdout of several hundred KB, near the
          # summary's 1 MiB step cap, so the swap sends them to the step log;
          # stderr is kept in a file as well. Only the command's own ledger
          # lines (the per-Term counts, the would-insert line the bound is read
          # off, a refusal) are copied to the summary, which outlives the log:
          # stderr also carries pypdf's warnings, which can quote text from a
          # fetched PDF. Workflow commands are suspended for the run for the
          # same reason, under a token nothing fetched can know.
          ledger="${RUNNER_TEMP}/opinion-record.stderr"
          stop_token="$(head -c 16 /dev/urandom | od -An -tx1 | tr -d ' \n')"
          echo "::stop-commands::${stop_token}"
          status=0
          uv run fedcourts backfill-opinion-record --first-term 2020 --last-term 2025 \
            --projection "${HANDOFF_PROJECTION}" --plan-out "${HANDOFF_PLAN}" \
            3>&1 1>&2 2>&3 3>&- | tee "$ledger" || status=$?
          echo "::${stop_token}::"
          grep -E '^(OT[0-9]{4}: |backfill-opinion-record)' "$ledger" \
            >> "$GITHUB_STEP_SUMMARY" || true
          if [ "$status" -ne 0 ]; then
            echo "::error::backfill-opinion-record exited ${status}; the step log has its output."
            exit "$status"
          fi

      # Read the scanned filings off their page images. A filing submitted on
      # paper reaches the corpus with no text layer, so the extractor stored
      # nothing for it and every cell minted over that case reads it empty —
      # for as long as the docket keeps serving the same URL, since the poller
      # and the Term walker re-fetch a kind only when its link changes. Each
      # worklist item is re-fetched by its stored URL on supremecourt.gov —
      # free and politeness-capped, so the pass spends none of the
      # CourtListener budget — and re-extracted with the OCR seam supplied,
      # which reads a page off its image only where that page's own extraction
      # yielded nothing (the class and its contract: `fedcourts
      # ocr-recover-petitions --help`, and *Contract for the recovery pass* in
      # docs/live-sources.md).
      #
      # A dry run probes instead: it re-fetches the projection's spread sample
      # through the fetching lanes' own client and reports each status, which
      # is what says whether supremecourt.gov serves the pass before a slice is
      # spent finding out. It reads nothing out of the bodies.
      - name: Read the scanned filings
        if: ${{ inputs.repair == 'ocr-recovery' }}
        # Rendering and recognizing a page costs a couple of seconds, so a
        # 60-page filing is two or three minutes of it. What sizes the slice is
        # the deadline below, not `repair_bound`: page counts across the class
        # vary several-fold, so no fixed number of candidates is both safe
        # against this cap and worth dispatching. This cap is the backstop.
        timeout-minutes: 45
        env:
          REPAIR_MODE: ${{ inputs.repair_mode }}
          HANDOFF_PROJECTION: ${{ runner.temp }}/handoff/projection.json
          HANDOFF_PLAN: ${{ runner.temp }}/handoff/plan.json
        run: |
          set -euo pipefail
          # The extractor's warnings can quote a filing's own text, so stderr
          # stays in the log, under suspended workflow commands, and only the
          # command's ledger (counts and identifiers) reaches the summary.
          stop_token="$(head -c 16 /dev/urandom | od -An -tx1 | tr -d ' \n')"
          echo "::stop-commands::${stop_token}"
          if [ "${REPAIR_MODE}" != "apply" ]; then
            status=0
            uv run fedcourts ocr-recover-petitions --worklist "${HANDOFF_PROJECTION}" \
              --probe-only | tee -a "$GITHUB_STEP_SUMMARY" || status=$?
            echo "::${stop_token}::"
            exit "${status}"
          fi
          # The slice's wall clock, measured from the moment the command
          # starts. The step has 45 minutes (2700 s), and the class walk, the
          # write and the witness are the writer's, so all this step still
          # owes once the parse stops taking work is a started candidate's
          # overshoot and the plan write:
          #
          #   overshoot           240 s  the deadline is the last moment work may
          #                              BEGIN, and a started candidate can end
          #                              after it: the document budget is checked
          #                              between pages, so the page already
          #                              running when it fires still costs a
          #                              render and a recognition at their own
          #                              120 s ceilings, and a re-fetch that
          #                              times out and takes the client's one
          #                              retry costs a further minute or so
          #   plan write           60 s  serializing at most a slice of texts,
          #                              each under the document cap: seconds,
          #                              reserved at a minute
          #   ------------------------
          #   reserve             300 s  →  2700 - 300 = 2400
          #
          # No candidate estimates above the per-document recognition budget
          # plus the fixed per-candidate overhead (630 s), so the head of the
          # class cannot be starved by the deadline. Items it declines are
          # reported unreached — untouched, still in the class, and first next
          # dispatch. Two things this arithmetic does not cover, both of which
          # the step's cap is the backstop for: a renderer or recognizer wedging
          # on every page of a document rather than one (a broken runner image,
          # not a heavy slice), and a stored page count that understates the
          # filing now served at that URL.
          #
          # Counts and identifiers only reach the log: the plan's text is the
          # filings' own, and a self-represented filer's contact details are in it.
          status=0
          uv run fedcourts ocr-recover-petitions --worklist "${HANDOFF_PROJECTION}" \
            --plan-out "${HANDOFF_PLAN}" --deadline-seconds 2400 \
            | tee -a "$GITHUB_STEP_SUMMARY" || status=$?
          echo "::${stop_token}::"
          exit "${status}"

      # Re-cut the head-cut filings. Each worklist item is re-fetched by its
      # stored URL on supremecourt.gov — free and politeness-capped, so the
      # pass spends none of the CourtListener budget — and re-cut by the
      # fetching lanes' own extractor at the configured cap. What the served
      # PDF alone shows is settled here: a fetch that failed, bytes that do
      # not parse (`unreadable`), a page count other than the stored row's
      # (`pages-changed`, another filing at that link), an empty re-cut. Every
      # other item's re-cut crosses in the plan, in both modes, because the
      # rest of its outcome — another filing of the same length
      # (`head-changed`), the same text (`unchanged`), a petition's
      # re-derived questions — reads the stored text, which never leaves the
      # jobs holding the corpus. The contract: *Contract for the re-cut pass*
      # in docs/live-sources.md.
      - name: Re-cut the head-cut filings
        if: ${{ inputs.repair == 'recut' }}
        # The slice is the expensive half: a throttled GET of a filing that runs
        # to a few megabytes and a text-layer read of every page. What sizes it
        # is the slice deadline below; this cap is the backstop behind it.
        timeout-minutes: 30
        env:
          HANDOFF_PROJECTION: ${{ runner.temp }}/handoff/projection.json
          HANDOFF_PLAN: ${{ runner.temp }}/handoff/plan.json
        run: |
          set -euo pipefail
          # The slice's wall clock, measured from the moment the command
          # starts, the same in both modes: the dry run and the apply read the
          # same slice. The step has 30 minutes (1800 s), and the class walks,
          # the write, the witness and the push are the reader's and the
          # writer's, so all this step still owes once the parse stops taking
          # work is a started candidate's overshoot and the plan write:
          #
          #   overshoot           120 s  the deadline is the last moment work may
          #                              BEGIN: a started candidate's GET can time
          #                              out and take the client's one retry,
          #                              then its pages are read
          #   plan write           60 s  serializing the reached items' texts,
          #                              each under the document cap: seconds,
          #                              reserved at a minute
          #   ------------------------
          #   reserve             180 s  →  1800 - 180 = 1620
          #
          # Candidates the deadline declines are reported unreached — untouched,
          # still in the class, and first next dispatch.
          #
          # The extractor's warnings can quote a filing's own text, so stderr
          # stays in the log, under suspended workflow commands, and only the
          # command's ledger (counts and identifiers) reaches the summary.
          stop_token="$(head -c 16 /dev/urandom | od -An -tx1 | tr -d ' \n')"
          echo "::stop-commands::${stop_token}"
          status=0
          uv run fedcourts recut-documents --worklist "${HANDOFF_PROJECTION}" \
            --plan-out "${HANDOFF_PLAN}" --deadline-seconds 1620 > /tmp/recut-parse.txt \
            || status=$?
          cat /tmp/recut-parse.txt
          # Bounded into the summary: GitHub discards a step summary above
          # 1 MiB, and an unbounded dry run prints a line per reached item.
          head -c 300000 /tmp/recut-parse.txt >> "$GITHUB_STEP_SUMMARY"
          echo "::${stop_token}::"
          exit "${status}"

      - name: Fetch the missing documents
        if: ${{ inputs.repair == 'document-backfill' }}
        # The slice is the expensive half: a candidate is one paced docket GET
        # plus, on an apply, a GET, a download and a text extraction per filing
        # the docket nominates. What sizes it is the slice deadline below rather
        # than `repair_bound`, since what a candidate turns out to cost is what
        # its docket nominates; this cap is the backstop behind that deadline.
        timeout-minutes: 30
        env:
          REPAIR_MODE: ${{ inputs.repair_mode }}
          HANDOFF_PROJECTION: ${{ runner.temp }}/handoff/projection.json
          HANDOFF_PLAN: ${{ runner.temp }}/handoff/plan.json
        run: |
          set -euo pipefail
          # Read off the machine-readable ledger the dry run prints last; the
          # field name is passed as an argument so nothing from a file is
          # interpolated into the program.
          ledger_field() {
            grep -h '^{"applied"' "$1" | tail -n 1 \
              | uv run python -c 'import json,sys; print(json.load(sys.stdin)[sys.argv[1]])' "$2"
          }
          # The slice's wall clock, measured from the moment the command starts.
          # The step has 30 minutes (1800 s); the class walk is the
          # projection's, and the write, the witness, the push and the commit
          # are the writer's, so all this step still owes once the parse stops
          # taking work is a started candidate's overshoot and, on an apply, the
          # plan write:
          #
          #   dry run
          #   overshoot           120 s  the deadline is the last moment work may
          #                              BEGIN: a started candidate's docket GET
          #                              can time out and take the client's one
          #                              retry
          #   ------------------------
          #   reserve             120 s  →  1800 - 120 = 1680
          #
          #   apply
          #   overshoot           240 s  a started candidate's docket, then every
          #                              filing it nominates past the estimate's
          #                              charge (one opposition brief per
          #                              respondent), and a download that times
          #                              out and takes the client's one retry
          #   plan write           60 s  serializing the reached candidates'
          #                              documents, each under the document cap:
          #                              seconds, reserved at a minute
          #   ------------------------
          #   reserve             300 s  →  1800 - 300 = 1500
          #
          # A candidate is admitted only where what is left holds its whole
          # estimate; the ones it declines are reported unreached — untouched,
          # still in the class, and first next dispatch. A docket nominating far
          # more filings than the estimate charges for, and a run of downloads
          # that each take the retry, stay on this step's cap.
          #
          # The fetch's warnings can quote upstream's error text, so stderr
          # stays in the log, under suspended workflow commands, and only the
          # command's ledger (counts and identifiers) reaches the summary.
          stop_token="$(head -c 16 /dev/urandom | od -An -tx1 | tr -d ' \n')"
          echo "::stop-commands::${stop_token}"
          status=0
          if [ "${REPAIR_MODE}" = "apply" ]; then
            uv run fedcourts backfill-documents --worklist "${HANDOFF_PROJECTION}" \
              --plan-out "${HANDOFF_PLAN}" --deadline-seconds 1500 > /tmp/document-parse.txt \
              || status=$?
          else
            uv run fedcourts backfill-documents --worklist "${HANDOFF_PROJECTION}" \
              --deadline-seconds 1680 > /tmp/document-parse.txt || status=$?
          fi
          cat /tmp/document-parse.txt
          # Bounded into the summary: GitHub discards a step summary above
          # 1 MiB, and an unbounded dry run prints a line per reached item.
          head -c 300000 /tmp/document-parse.txt >> "$GITHUB_STEP_SUMMARY"
          echo "::${stop_token}::"
          if [ "${status}" -ne 0 ]; then
            exit "${status}"
          fi
          # A modern docket whose opening filing matched no entry is not a floor
          # but a selector regression. Raised on the dry run, the reading a
          # maintainer does first and where the decision to apply is made; the
          # writer raises it on an apply.
          if [ "${REPAIR_MODE}" != "apply" ]; then
            modern="$(ledger_field /tmp/document-parse.txt no_entry_modern_cases)"
            if [ "${modern}" != "[]" ]; then
              echo "::warning::selector regression: ${modern} matched no opening entry on a modern docket. The selector has no arm for their filing type; widen it rather than re-dispatching this pass."
            fi
          fi

      - name: Note the dry run
        if: ${{ inputs.repair_mode != 'apply' }}
        env:
          REPAIR: ${{ inputs.repair }}
        run: |
          if [ "$REPAIR" = recut ]; then
            echo "dry-run only; nothing written. The plan is read against the stored text by documents-dry-run." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "dry-run only; nothing written." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      # The plan crosses to the writer only on an apply; a dry run's ledger is
      # its whole product. The application back-fill's plan carries each served
      # docket JSON verbatim, party contact blocks included (a self-represented
      # applicant's address, telephone and prisoner number among them), which
      # crosses only under the narrow carve-out docs/data-sources.md (*PII
      # stance*) records: this one artifact, one day, consumed by the
      # applications writer in this run, never committed and never printed —
      # the summary above carries the ledger's counts and parsed fields only,
      # and the walk (before writing it) and the writer both refuse a plan not
      # shaped as served docket JSON plus the fields parsed from it.
      # The OCR plan carries the text read off each filing, which for a
      # self-represented filer holds contact details, and crosses under the
      # OCR plan's own carve-out in docs/data-sources.md on the same terms, as
      # the document back-fill's plan does under the same one.
      # The re-cut's plan carries the same kind of text and crosses in BOTH
      # modes, the one exception to "an apply only": its dry run's ledger is
      # judged against the stored text by the read-only reader, which is the
      # only way the dry run reads as the apply it bounds. Its carve-out in
      # docs/data-sources.md names both.
      - name: Upload the plan
        id: upload-plan
        if: ${{ (inputs.repair_mode == 'apply' && (inputs.repair == 'opinion-votes' || inputs.repair == 'order-votes' || inputs.repair == 'application-backfill' || inputs.repair == 'opinion-record' || inputs.repair == 'ocr-recovery' || inputs.repair == 'document-backfill')) || inputs.repair == 'recut' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: repair-plan-${{ github.run_id }}
          path: ${{ runner.temp }}/handoff/plan.json
          if-no-files-found: error
          overwrite: true
          # The Court's own public record only (see the credential-split comment
          # above the projection job; the application plan under its carve-out);
          # one day, because it exists to hand one file to the writer job, and
          # the carve-out is bounded to this artifact. Deleting it once the
          # writer has read it was weighed and declined: that needs `actions:
          # write` in a job already holding `id-token` and the App token.
          retention-days: 1

  # The vote writer, on an apply only. It holds no AWS role and no
  # `id-token` — the stamps land in committed `outcome.json` files, and the
  # one corpus fact the parse needed crossed in the projection — so the only
  # credential in the job is the App token that pushes the `data/` commit, as
  # on the re-grade.
  #
  # `opinion-votes` stamps merits outcomes from their opinion's syllabus
  # lineup (`fedcourts stamp-opinion-votes`); `order-votes` stamps cert and
  # interim outcomes from the notations and writing headers of the order that
  # disposed of them (`fedcourts stamp-order-votes`). Two selector values, not
  # one pass with a mode, because a dispatch reads one ledger and applies one
  # bound: the two sources' populations, fetches and record shapes share
  # nothing but the stamping.
  votes:
    needs: [authorize, validate, handoff-parse]
    if: >-
      ${{ ((inputs.repair == 'opinion-votes' || inputs.repair == 'order-votes') && inputs.repair_mode == 'apply')
      && needs.authorize.result == 'success'
      && (needs.authorize.outputs.attempt == github.run_attempt
      || contains(needs.authorize.outputs.rerunners, format(',{0},', github.triggering_actor))) }}
    # It commits to `main` on the same push path as the corpus writers, so it
    # joins their lock rather than racing their pointer commits. The lock is
    # taken only once the parse has finished, so the fetch campaign never
    # holds it. A skipped job takes a throwaway group, for the corpus job's
    # reason.
    concurrency:
      group: ${{ (needs.authorize.result == 'success' && (needs.authorize.outputs.attempt == github.run_attempt || contains(needs.authorize.outputs.rerunners, format(',{0},', github.triggering_actor)))) && (inputs.repair == 'opinion-votes' || inputs.repair == 'order-votes') && inputs.repair_mode == 'apply' && 'corpus-write' || format('corpus-write-skip-{0}', github.run_id) }}
      cancel-in-progress: false
    runs-on: ubuntu-26.04
    # Setup, a local re-validation and write per planned stamp, and the push.
    timeout-minutes: 20
    environment: prod
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Sync the working tree to the current tip of the default branch
        # Under the lock: the outcomes being stamped arrive by the writers' own
        # commits. The repo is public, so this read-only fetch needs no
        # credentials.
        run: |
          set -euo pipefail
          git fetch origin "${GITHUB_REF_NAME}"
          git reset --hard FETCH_HEAD

      - uses: ./.github/actions/setup-python-env
        with:
          restore-cache: "false"

      - name: Download the plan
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: repair-plan-${{ github.run_id }}
          path: ${{ runner.temp }}/handoff

      # The artifact was uploaded by a job that ran a parse, so what it unpacked
      # is checked before anything reads it: exactly one regular file, the plan,
      # and no tracked or untracked file in the checkout changed (gitignored
      # paths are not seen here; the download action itself refuses a path that
      # escapes its target).
      - name: Check the downloaded plan
        run: |
          set -euo pipefail
          found="$(find "${RUNNER_TEMP}/handoff" -mindepth 1 -printf '%y %P\n')"
          if [ "${found}" != "f plan.json" ]; then
            echo "::error::the plan artifact holds something other than one plan.json file"
            exit 1
          fi
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::the plan artifact changed the checkout"
            exit 1
          fi

      # Re-validate every planned record against the ledger as it stands and
      # stamp it. The plan is untrusted input: a row naming no outcome in the
      # pass's population, a record of the wrong source or shape, or one the
      # ledger's own vote check refuses refuses the whole plan before anything
      # is written; a plan read from a partial fetch, or over the bound, is
      # refused as a one-process apply is. No credential exists yet.
      - name: Stamp the planned vote records
        env:
          REPAIR: ${{ inputs.repair }}
          REPAIR_MODE: ${{ inputs.repair_mode }}
          REPAIR_BOUND: ${{ inputs.repair_bound }}
          REPAIR_OPTIONS: ${{ inputs.repair_options }}
          HANDOFF_PLAN: ${{ runner.temp }}/handoff/plan.json
        run: |
          set -euo pipefail
          # The steps of record for the bound and the option vocabulary;
          # `repair_passes.py` duplicates both word for word.
          if [ "${REPAIR_MODE}" = "apply" ] \
            && ! [[ "${REPAIR_BOUND}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::repair=${REPAIR} with repair_mode=apply needs repair_bound set to a positive integer — the count read off a previous dry-run dispatch's ledger. Re-dispatch with that number."
            exit 1
          fi
          accepted_options="replace-differing"
          replace_differing=0
          option_malformed=0
          while IFS= read -r option; do
            [ -n "$option" ] || continue
            case " ${accepted_options} " in
              *" ${option} "*) ;;
              *)
                echo "::error::repair=${REPAIR} does not accept the option '${option}' — it accepts: ${accepted_options:-none}."
                option_malformed=1
                continue ;;
            esac
            case "$option" in
              replace-differing) replace_differing=1 ;;
            esac
          done < <(printf '%s\n' "${REPAIR_OPTIONS}" | tr -s ', \t\r' '\n')
          if [ "$option_malformed" -ne 0 ]; then
            echo "::error::refusing the whole option list — correct the switches above and re-dispatch."
            exit 1
          fi
          write_args=(--apply --max-stamps "${REPAIR_BOUND}")
          if [ "$replace_differing" -eq 1 ]; then
            write_args+=(--replace-differing)
          fi
          # The ledger echoes text the plan carries, so workflow commands are
          # suspended for the run under a token nothing in the plan can know.
          stop_token="$(head -c 16 /dev/urandom | od -An -tx1 | tr -d ' \n')"
          echo "::stop-commands::${stop_token}"
          status=0
          if [ "${REPAIR}" = "opinion-votes" ]; then
            uv run fedcourts stamp-opinion-votes --from-plan "${HANDOFF_PLAN}" \
              "${write_args[@]}" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || status=$?
          else
            uv run fedcourts stamp-order-votes --from-plan "${HANDOFF_PLAN}" \
              "${write_args[@]}" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || status=$?
          fi
          echo "::${stop_token}::"
          exit "$status"

      # Fail closed before any write credential exists: the stamp step may have
      # changed committed outcome files and nothing else. A path in any other
      # shape — an untracked file, a renamed or quoted path — refuses the run.
      - name: Check the stamp wrote only outcome files
        run: |
          set -euo pipefail
          stray="$(git status --porcelain --untracked-files=all \
            | grep -cvE '^ M data/cases/[^/]+/[^/]+/events/[^/]+/outcome\.json$' || true)"
          if [ "${stray}" != "0" ]; then
            echo "::error::the stamp step changed ${stray} path(s) other than committed outcome.json files"
            exit 1
          fi

      # The write credential exists only from here on, after the plan has been
      # re-validated and applied: minted, handed to the git identity, and held
      # by the commit step, none of which parses anything.
      - name: Mint app token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.DATA_APP_CLIENT_ID }}
          private-key: ${{ secrets.DATA_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Configure git identity
        uses: ./.github/actions/configure-git-identity
        with:
          token: ${{ steps.app-token.outputs.token }}
          app-slug: ${{ steps.app-token.outputs.app-slug }}

      # The only step holding a credential that can write: it stages what the
      # stamp step wrote, commits it and pushes.
      - name: Commit the stamped outcomes
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPAIR: ${{ inputs.repair }}
        run: |
          set -euo pipefail
          gh auth setup-git # persist-credentials is false on checkout
          # Stage the stamped outcomes only, never a blanket `git add data/`:
          # this commit carries no corpus pointer, and the pass writes nothing
          # but `outcome.json`, so anything else changed under `data/` is not
          # this pass's to publish.
          git add -- ':(glob)data/cases/*/*/events/*/outcome.json'
          if git diff --cached --quiet; then
            echo "Every outcome already carries its record; nothing to persist."
            exit 0
          fi
          git commit -m "repair: stamp vote records (${REPAIR})"
          bash "${GITHUB_WORKSPACE}/.github/actions/commit-corpus-to-main/push_with_retry.sh" \
            "vote-record ledger"

  # The interim-docket back-fill's writer (`fedcourts backfill-applications
  # --from-plan`), on an apply only: one closed Term's served application
  # dockets, landed through the live channel's own ingest seam wherever the
  # live channel does not own the row. It takes the lock for the whole job and
  # pulls the corpus FRESH under it with the read-write role, so the ownership
  # re-read, the identity join and the prediction guard all answer for the
  # blob this job pushes — nothing pulled before the lock is ever written
  # back. It fetches nothing: the served records are the plan's, re-checked
  # whole first. The App token is minted only after the push.
  #
  # Every step here can still request an OIDC token for either corpus role
  # `corpus-write` is trusted by — the job needs `id-token: write` for its own
  # read-write session, and the runner hands the request pair to every step.
  # What stands between the plan and that is the plan's validation: the job parses no
  # fetched PDF and runs the same JSON mapping the live channel's own writers
  # run.
  #
  # No dedupe prerequisite, unlike the corpus job: this pass writes exactly as
  # the live channel's frontier discovery does, which runs without one, and the
  # identity join it shares picks the lowest docket id of any twin pair
  # deterministically. A twin with either half live-polled is live-owned and
  # never read.
  #
  # The apply moves the interim base-rate population (the landed rows join the
  # interim section's parsed counts), so it is pre-registered in
  # docs/freeze-record.md and waits until after the long-conference release;
  # see docs/data-pipeline.md.
  applications:
    needs: [authorize, validate, handoff-parse]
    if: >-
      ${{ inputs.repair == 'application-backfill' && inputs.repair_mode == 'apply'
      && needs.authorize.result == 'success'
      && (needs.authorize.outputs.attempt == github.run_attempt
      || contains(needs.authorize.outputs.rerunners, format(',{0},', github.triggering_actor))) }}
    concurrency:
      group: ${{ (needs.authorize.result == 'success' && (needs.authorize.outputs.attempt == github.run_attempt || contains(needs.authorize.outputs.rerunners, format(',{0},', github.triggering_actor)))) && inputs.repair == 'application-backfill' && inputs.repair_mode == 'apply' && 'corpus-write' || format('corpus-write-skip-{0}', github.run_id) }}
      cancel-in-progress: false
    runs-on: ubuntu-26.04
    # Setup, the corpus pull, the land step's 30 minutes and the commit.
    timeout-minutes: 50
    environment: corpus-write
    env:
      # Lets this job write the remote corpus estate (see the `repair` job).
      FEDCOURTS_REMOTE_WRITES: "true"
    permissions:
      contents: read
      id-token: write # the read-write role for the fresh pull, the ingest and the push
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Sync the working tree to the current tip of the default branch
        # Under the lock: the corpus pointer this job builds on moves with every
        # writer's commit. The repo is public, so this read-only fetch needs no
        # credentials.
        run: |
          set -euo pipefail
          git fetch origin "${GITHUB_REF_NAME}"
          git reset --hard FETCH_HEAD

      - uses: ./.github/actions/setup-python-env
        with:
          restore-cache: "false"

      - name: Download the plan
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: repair-plan-${{ github.run_id }}
          path: ${{ runner.temp }}/handoff

      # The artifact was uploaded by a job that ran a parse, so what it unpacked
      # is checked before anything reads it: exactly one regular file, the plan,
      # and no tracked or untracked file in the checkout changed (gitignored
      # paths are not seen here; the download action itself refuses a path that
      # escapes its target).
      - name: Check the downloaded plan
        run: |
          set -euo pipefail
          found="$(find "${RUNNER_TEMP}/handoff" -mindepth 1 -printf '%y %P\n')"
          if [ "${found}" != "f plan.json" ]; then
            echo "::error::the plan artifact holds something other than one plan.json file"
            exit 1
          fi
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::the plan artifact changed the checkout"
            exit 1
          fi

      # Same read-write (append-only) role as the corpus job's: the ingest adds
      # and rewrites rows and mirrors each snapshot to the content store, and
      # can never wipe a remote object.
      - name: Configure AWS credentials (corpus S3 remote, read-write)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}
          role-duration-seconds: 3600 # 1h
          # Bounded for the corpus job's reason (the workflow-traps list in
          # docs/pipeline.md).
          action-timeout-s: 120

      # The blob the write builds on, pulled inside the lock.
      - name: Pull the current corpus from the remote
        env:
          FEDCOURTS_CORPUS_BASE_URL: ${{ vars.CORPUS_BASE_URL }}
        run: |
          set -euo pipefail
          uv run fedcourts corpus-pull

      # Re-check the plan, classify each served record against this corpus,
      # land the rows and push the blob. No GitHub write credential exists yet.
      - name: Land the planned applications
        # About 30 seconds for OT2024's 974 rows on a local blob, plus one
        # content-store PUT per snapshot and the blob push.
        timeout-minutes: 30
        env:
          # The corpus estate's base URL: the ingest mirrors each snapshot to
          # the content store beneath it, and the push writes the index there.
          FEDCOURTS_CORPUS_BASE_URL: ${{ vars.CORPUS_BASE_URL }}
          REPAIR: ${{ inputs.repair }}
          REPAIR_MODE: ${{ inputs.repair_mode }}
          REPAIR_BOUND: ${{ inputs.repair_bound }}
          REPAIR_TARGET: ${{ inputs.repair_target }}
          HANDOFF_PLAN: ${{ runner.temp }}/handoff/plan.json
        run: |
          set -euo pipefail
          # The steps of record for the bound and the Term; `Validate the repair
          # selector` duplicates both word for word.
          if [ "${REPAIR_MODE}" = "apply" ] \
            && ! [[ "${REPAIR_BOUND}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::repair=${REPAIR} with repair_mode=apply needs repair_bound set to a positive integer — the count read off a previous dry-run dispatch's ledger. Re-dispatch with that number."
            exit 1
          fi
          if ! [[ "${REPAIR_TARGET}" =~ ^[0-9]{2}$ ]]; then
            echo "::error::repair=${REPAIR} needs repair_target set to a two-digit October Term, e.g. 24 — the back-fill reads one named Term per dispatch, so its ledger and the bound an apply carries answer for the same Term. Re-dispatch with the Term."
            exit 1
          fi
          # The held-back guard reads committed predictions out of `data/`, so
          # it needs the remote tip. Fast-forward only: an unpushed local commit
          # fails this closed.
          git fetch origin "$GITHUB_REF_NAME"
          git merge --ff-only FETCH_HEAD
          # The ledger echoes upstream text the plan carries, so workflow
          # commands are suspended for the run under a token nothing in the
          # plan can know.
          stop_token="$(head -c 16 /dev/urandom | od -An -tx1 | tr -d ' \n')"
          echo "::stop-commands::${stop_token}"
          status=0
          uv run fedcourts backfill-applications --term "${REPAIR_TARGET}" \
            --from-plan "${HANDOFF_PLAN}" --apply --max-rows "${REPAIR_BOUND}" 2>&1 \
            | tee -a "$GITHUB_STEP_SUMMARY" || status=$?
          echo "::${stop_token}::"
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          # Blob before pointer commit, as everywhere: an apply that pushed the
          # blob but failed before the commit publishes nothing, because readers
          # resolve the committed pointer. The snapshots mirrored ahead of the
          # pointer are content-store objects keyed by case and date, which a
          # re-apply rewrites identically.
          uv run fedcourts corpus-push

      - name: Mint app token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.DATA_APP_CLIENT_ID }}
          private-key: ${{ secrets.DATA_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Configure git identity
        uses: ./.github/actions/configure-git-identity
        with:
          token: ${{ steps.app-token.outputs.token }}
          app-slug: ${{ steps.app-token.outputs.app-slug }}

      # Stages the pointer the push moved and any outcome the ingest recorded
      # under `data/` (an event still open on a stub row resolves through the
      # shared seam), so the corpus and the ledger it must match land together.
      # The step holding the App token needs no AWS session, so the read-write
      # session's variables are blanked: a step's `env:` does override what the
      # credentials action exported, which is not true of the OIDC request pair.
      - name: Commit the back-filled corpus
        env:
          AWS_ACCESS_KEY_ID: ""
          AWS_SECRET_ACCESS_KEY: ""
          AWS_SESSION_TOKEN: ""
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          if env | grep -E '^AWS_' | grep -E '=.+' | grep -vE '^AWS_(REGION|DEFAULT_REGION)=' > /dev/null; then
            echo "::error::AWS credential variables reached the application back-fill commit"
            exit 1
          fi
          gh auth setup-git # persist-credentials is false on checkout
          git add corpus/corpus.db.ref
          if [ -d data ]; then
            git add data/
          fi
          if git diff --cached --quiet; then
            echo "Every application already live-owned; nothing to persist."
            exit 0
          fi
          git commit -m "repair: back-fill interim applications (corpus + ledger)"
          bash "${GITHUB_WORKSPACE}/.github/actions/commit-corpus-to-main/push_with_retry.sh" \
            "application back-fill pointer"

  # The merits decision record back-fill (`fedcourts backfill-decision-record`):
  # `merits_argued` and `merits_decision_method` on each stored granted row
  # whose method is still null, re-read from the row's newest stored live
  # snapshot. A job of its own for the application back-fill's reason: its two
  # modes carry different risk classes. That is also why it is not a pass beside
  # the response-signal back-fill in the corpus job, which would hold
  # `corpus-write` and the App token through the dry run. The dry run READS the
  # index and the content-store snapshots and writes nothing, so it takes the
  # read-only role, mints no write credential and takes no lock: holding
  # `corpus-write` for a read would queue the scheduled windows behind it, and
  # GitHub keeps one pending run per group, so a second arrival would evict a
  # production window.
  # The apply WRITES two index columns by a direct `UPDATE` and pushes the blob,
  # so it takes the lock for the whole job, the read-write role for the write
  # step, and the App token only after that step has exited. It writes no
  # content-store object and nothing under `data/`, so its commit is the
  # pointer alone.
  #
  # One job, not the credential split the fetching passes use: it fetches
  # nothing and parses only snapshots already in the access-gated store, and
  # those snapshots may not leave the private estate as a public run artifact,
  # so no parse could be handed to a credential-free job anyway. Its posture,
  # plainly: the job holds `id-token: write` under `corpus-write` — on a dry
  # run too, the one job serving both modes, which is why the read-only role's
  # trust is to name `corpus-write` too — and the
  # runner hands every step the OIDC request pair, so every step here can mint
  # a token for either corpus role `corpus-write` is trusted by. What the job
  # blanks — and its
  # commit step asserts — is the AWS session's variables on the step holding
  # the App token, which a step's `env:` does override.
  #
  # No dedupe prerequisite, unlike the corpus job: both columns fill-in latch
  # on the upsert path the merge writes through, so a reading landed on either
  # half of a twin pair survives the merge, and no gate, mint or retrieval row
  # reads them, so a half-read pair misleads nothing in the meantime.
  decision-record:
    needs: [authorize, validate]
    if: >-
      ${{ inputs.repair == 'decision-record'
      && needs.authorize.result == 'success'
      && (needs.authorize.outputs.attempt == github.run_attempt
      || contains(needs.authorize.outputs.rerunners, format(',{0},', github.triggering_actor))) }}
    concurrency:
      group: ${{ (needs.authorize.result == 'success' && (needs.authorize.outputs.attempt == github.run_attempt || contains(needs.authorize.outputs.rerunners, format(',{0},', github.triggering_actor)))) && inputs.repair == 'decision-record' && inputs.repair_mode == 'apply' && 'corpus-write' || format('corpus-write-skip-{0}', github.run_id) }}
      cancel-in-progress: false
    runs-on: ubuntu-26.04
    # The pass step's 25-minute cap plus setup, the corpus pull and the commit.
    timeout-minutes: 45
    environment: corpus-write
    env:
      # Lets this job write the remote corpus estate (see the `repair` job).
      FEDCOURTS_REMOTE_WRITES: "true"
    permissions:
      contents: read
      id-token: write # the read-only role for the pull and the read; on an apply, the read-write role for the write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Sync the working tree to the current tip of the default branch
        # Same stale-base hazard as the corpus job: an apply that queued behind
        # a writer on the shared lock checked out a frozen sha, and the corpus
        # pointer it builds on moves with every writer's commit. The repo is
        # public, so this read-only fetch needs no credentials.
        run: |
          set -euo pipefail
          git fetch origin "${GITHUB_REF_NAME}"
          git reset --hard FETCH_HEAD

      - uses: ./.github/actions/setup-python-env
        with:
          restore-cache: "false"

      # The committed pointer's blob. On an apply the lock is already held, so
      # this is the blob the write builds on; the read-write role assumed
      # below writes it back.
      - uses: ./.github/actions/corpus-readonly
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME_READONLY }}
          aws-region: ${{ vars.AWS_REGION }}
          corpus-base-url: ${{ vars.CORPUS_BASE_URL }}

      # The dry run: the ledger the apply's bound is read from. It holds the
      # read-only session the pull assumed, which the snapshot reads need.
      - name: Read the decision-record ledger
        if: ${{ inputs.repair_mode == 'dry-run' }}
        # One content-store read per candidate, pooled by the shared prefetch,
        # over the granted rows still unclassified. A dev-checkout dry run read
        # about 1,200 candidates in under a minute, so the cap is headroom for
        # a slow store rather than a sizing.
        timeout-minutes: 20
        env:
          # The corpus estate's base URL: the snapshots live in the content
          # store beneath it.
          FEDCOURTS_CORPUS_BASE_URL: ${{ vars.CORPUS_BASE_URL }}
        run: |
          set -euo pipefail
          # The fill ledger — the counts, the method distribution over the
          # fills and each filled row — goes to the summary, which outlives the
          # step log. The bound is the rows it would FILL, not the `candidates`
          # denominator: the pending docket stays a candidate until its
          # decision lands, so that count rises with the ordinary docket.
          uv run fedcourts backfill-decision-record 2>&1 \
            | tee -a "$GITHUB_STEP_SUMMARY"
          echo "dry-run only; nothing written."

      # Same read-write (append-only) role as the corpus job's: the write moves
      # index columns and pushes the blob, and can never wipe a remote object.
      - name: Configure AWS credentials (corpus S3 remote, read-write)
        if: ${{ inputs.repair_mode == 'apply' }}
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}
          role-duration-seconds: 3600 # 1h
          # Bounded for the corpus job's reason (the workflow-traps list in
          # docs/pipeline.md).
          action-timeout-s: 120

      # The apply: fill and push the blob, in one step holding the read-write
      # session. It prints the same ledger from its own reading, so no dry run
      # leads it. No GitHub write credential exists yet.
      - name: Fill the decision record
        if: ${{ inputs.repair_mode == 'apply' }}
        # The dry run's reads plus the index writes and the blob push.
        timeout-minutes: 25
        env:
          FEDCOURTS_CORPUS_BASE_URL: ${{ vars.CORPUS_BASE_URL }}
          REPAIR: ${{ inputs.repair }}
          REPAIR_MODE: ${{ inputs.repair_mode }}
          REPAIR_BOUND: ${{ inputs.repair_bound }}
        run: |
          set -euo pipefail
          # The step of record for the bound; `repair_passes.py`
          # duplicates it word for word.
          if [ "${REPAIR_MODE}" = "apply" ] \
            && ! [[ "${REPAIR_BOUND}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::repair=${REPAIR} with repair_mode=apply needs repair_bound set to a positive integer — the count read off a previous dry-run dispatch's ledger. Re-dispatch with that number."
            exit 1
          fi
          uv run fedcourts backfill-decision-record --apply \
            --max-fills "${REPAIR_BOUND}" 2>&1 \
            | tee -a "$GITHUB_STEP_SUMMARY"
          # Blob before pointer commit, as everywhere: an apply that pushed the
          # blob but failed before the commit publishes nothing, because readers
          # resolve the committed pointer, and the control dry run re-reads the
          # old blob that pointer still names.
          uv run fedcourts corpus-push

      # The GitHub write credential exists only on an apply, and only from here
      # on, after the write step has exited.
      - name: Mint app token
        if: ${{ inputs.repair_mode == 'apply' }}
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.DATA_APP_CLIENT_ID }}
          private-key: ${{ secrets.DATA_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Configure git identity
        if: ${{ inputs.repair_mode == 'apply' }}
        uses: ./.github/actions/configure-git-identity
        with:
          token: ${{ steps.app-token.outputs.token }}
          app-slug: ${{ steps.app-token.outputs.app-slug }}

      # Stages the pointer alone: the pass writes nothing under `data/`, so
      # anything changed there is not this pass's to publish. The step that
      # holds the App token needs no AWS session, so the read-write session's
      # variables are blanked here and the step asserts it before it runs.
      - name: Commit the decision-record corpus pointer
        if: ${{ inputs.repair_mode == 'apply' }}
        env:
          AWS_ACCESS_KEY_ID: ""
          AWS_SECRET_ACCESS_KEY: ""
          AWS_SESSION_TOKEN: ""
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          if env | grep -E '^AWS_' | grep -E '=.+' | grep -vE '^AWS_(REGION|DEFAULT_REGION)=' > /dev/null; then
            echo "::error::AWS credential variables reached the decision-record commit"
            exit 1
          fi
          gh auth setup-git # persist-credentials is false on checkout
          git add corpus/corpus.db.ref
          if git diff --cached --quiet; then
            echo "Every candidate already classified or unreadable; nothing to persist."
            exit 0
          fi
          git commit -m "repair: converge corpus (merits decision record)"
          bash "${GITHUB_WORKSPACE}/.github/actions/commit-corpus-to-main/push_with_retry.sh" \
            "decision-record pointer"

  # The per-opinion record's writer (`fedcourts backfill-opinion-record
  # --from-plan`), on an apply only: one row per opinion in each document the
  # Court's per-Term opinions listing links — its kind, author, joiners and
  # word count — inserted into the corpus `opinions` table, fill-only and
  # idempotent. It takes the lock for the whole job and pulls the corpus FRESH
  # under it with the read-write role, so a document another apply recorded
  # meanwhile is counted as recorded and the push carries only what this job
  # inserted onto the newest blob. It fetches and parses no PDF: the readings
  # are the plan's, re-validated whole first. The App token is minted only
  # after the push.
  #
  # Every step here can still request an OIDC token for either corpus role
  # `corpus-write` is trusted by — the job needs `id-token: write` for its own
  # read-write session, and the runner hands the request pair to every step.
  # What stands between the parse and that is the job boundary: the plan is the only thing
  # that crosses, and it is checked against the reader's own invariants before
  # a row is inserted.
  #
  # No dedupe prerequisite, unlike the corpus job: the pass writes only its own
  # table, keyed by (Term, listing number, position) rather than by case row,
  # and nothing a gate, a mint or a retrieval row reads joins on it.
  opinion-record:
    needs: [authorize, validate, handoff-parse]
    if: >-
      ${{ inputs.repair == 'opinion-record' && inputs.repair_mode == 'apply'
      && needs.authorize.result == 'success'
      && (needs.authorize.outputs.attempt == github.run_attempt
      || contains(needs.authorize.outputs.rerunners, format(',{0},', github.triggering_actor))) }}
    concurrency:
      group: ${{ (needs.authorize.result == 'success' && (needs.authorize.outputs.attempt == github.run_attempt || contains(needs.authorize.outputs.rerunners, format(',{0},', github.triggering_actor)))) && inputs.repair == 'opinion-record' && inputs.repair_mode == 'apply' && 'corpus-write' || format('corpus-write-skip-{0}', github.run_id) }}
      cancel-in-progress: false
    runs-on: ubuntu-26.04
    # Setup, the corpus pull (about a gigabyte), the insert step's 25 minutes
    # (a local insert plus the blob push) and the commit.
    timeout-minutes: 50
    environment: corpus-write
    env:
      # Lets this job write the remote corpus estate (see the `repair` job).
      FEDCOURTS_REMOTE_WRITES: "true"
    permissions:
      contents: read
      id-token: write # the read-write role for the fresh pull and the push
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Sync the working tree to the current tip of the default branch
        # Under the lock: the corpus pointer this job builds on moves with every
        # writer's commit. The repo is public, so this read-only fetch needs no
        # credentials.
        run: |
          set -euo pipefail
          git fetch origin "${GITHUB_REF_NAME}"
          git reset --hard FETCH_HEAD

      - uses: ./.github/actions/setup-python-env
        with:
          restore-cache: "false"

      - name: Download the plan
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: repair-plan-${{ github.run_id }}
          path: ${{ runner.temp }}/handoff

      # The artifact was uploaded by a job that ran a parse, so what it unpacked
      # is checked before anything reads it: exactly one regular file, the plan,
      # and no tracked or untracked file in the checkout changed (gitignored
      # paths are not seen here; the download action itself refuses a path that
      # escapes its target).
      - name: Check the downloaded plan
        run: |
          set -euo pipefail
          found="$(find "${RUNNER_TEMP}/handoff" -mindepth 1 -printf '%y %P\n')"
          if [ "${found}" != "f plan.json" ]; then
            echo "::error::the plan artifact holds something other than one plan.json file"
            exit 1
          fi
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::the plan artifact changed the checkout"
            exit 1
          fi

      # Same read-write (append-only) role as the corpus job's.
      - name: Configure AWS credentials (corpus S3 remote, read-write)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}
          role-duration-seconds: 3600 # 1h
          # Bounded for the corpus job's reason (the workflow-traps list in
          # docs/pipeline.md).
          action-timeout-s: 120

      # The blob the insert builds on, pulled inside the lock.
      - name: Pull the current corpus from the remote
        env:
          FEDCOURTS_CORPUS_BASE_URL: ${{ vars.CORPUS_BASE_URL }}
        run: |
          set -euo pipefail
          uv run fedcourts corpus-pull

      # Re-validate the plan, resolve each case id from this corpus, insert
      # fill-only within the bound, and push the blob. No GitHub write
      # credential exists yet.
      - name: Insert the planned opinion record
        timeout-minutes: 25
        env:
          # The corpus estate's base URL: the push writes the index beneath it.
          FEDCOURTS_CORPUS_BASE_URL: ${{ vars.CORPUS_BASE_URL }}
          REPAIR: ${{ inputs.repair }}
          REPAIR_MODE: ${{ inputs.repair_mode }}
          REPAIR_BOUND: ${{ inputs.repair_bound }}
          HANDOFF_PLAN: ${{ runner.temp }}/handoff/plan.json
        run: |
          set -euo pipefail
          # The step of record for the bound; `repair_passes.py`
          # duplicates it word for word.
          if [ "${REPAIR_MODE}" = "apply" ] \
            && ! [[ "${REPAIR_BOUND}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::repair=${REPAIR} with repair_mode=apply needs repair_bound set to a positive integer — the count read off a previous dry-run dispatch's ledger. Re-dispatch with that number."
            exit 1
          fi
          # The command prints the plan's readings — text read off fetched
          # PDFs — so the parse step's handling holds here too: the readings go
          # to the step log, only the ledger lines reach the summary, and
          # workflow commands are suspended for the run under a token nothing
          # in the plan can know.
          ledger="${RUNNER_TEMP}/opinion-record.stderr"
          stop_token="$(head -c 16 /dev/urandom | od -An -tx1 | tr -d ' \n')"
          echo "::stop-commands::${stop_token}"
          status=0
          uv run fedcourts backfill-opinion-record --first-term 2020 --last-term 2025 \
            --from-plan "${HANDOFF_PLAN}" --apply --max-rows "${REPAIR_BOUND}" \
            3>&1 1>&2 2>&3 3>&- | tee "$ledger" || status=$?
          echo "::${stop_token}::"
          grep -E '^(OT[0-9]{4}: |backfill-opinion-record)' "$ledger" \
            >> "$GITHUB_STEP_SUMMARY" || true
          if [ "$status" -ne 0 ]; then
            echo "::error::backfill-opinion-record exited ${status}; the step log has its output."
            exit "$status"
          fi
          # Blob before pointer commit, as everywhere: an apply that pushed the
          # blob but failed before the commit publishes nothing, because readers
          # resolve the committed pointer.
          uv run fedcourts corpus-push

      - name: Mint app token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.DATA_APP_CLIENT_ID }}
          private-key: ${{ secrets.DATA_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Configure git identity
        uses: ./.github/actions/configure-git-identity
        with:
          token: ${{ steps.app-token.outputs.token }}
          app-slug: ${{ steps.app-token.outputs.app-slug }}

      # Stages the pointer alone: the pass writes nothing under `data/`, so
      # anything changed there is not this pass's to publish. The step holding
      # the App token needs no AWS session, so the read-write session's
      # variables are blanked here and the step asserts it before it runs.
      - name: Commit the opinion-record corpus pointer
        env:
          AWS_ACCESS_KEY_ID: ""
          AWS_SECRET_ACCESS_KEY: ""
          AWS_SESSION_TOKEN: ""
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          if env | grep -E '^AWS_' | grep -E '=.+' | grep -vE '^AWS_(REGION|DEFAULT_REGION)=' > /dev/null; then
            echo "::error::AWS credential variables reached the opinion-record commit"
            exit 1
          fi
          gh auth setup-git # persist-credentials is false on checkout
          git add corpus/corpus.db.ref
          if git diff --cached --quiet; then
            echo "Every listed document already recorded, refused or skipped; nothing to persist."
            exit 0
          fi
          git commit -m "repair: converge corpus (per-opinion record)"
          bash "${GITHUB_WORKSPACE}/.github/actions/commit-corpus-to-main/push_with_retry.sh" \
            "opinion-record pointer"

  # The re-cut's dry-run reader (`fedcourts recut-documents --from-plan`
  # without `--apply`). The rest of a re-cut's outcome reads the stored text —
  # another filing of the same length, the same text, a petition's re-derived
  # questions — which never crosses into a public artifact, so a dry run that
  # reads as the apply it bounds needs a job holding the corpus after the
  # parse. This one holds the read-only role alone: no lock (it pushes
  # nothing, and holding `corpus-write` for a read would queue the scheduled
  # writer windows behind it), no remote-writes switch, no App token. It
  # fetches and parses no PDF; it checks the plan whole against the
  # projection's own worklist, both downloaded by artifact id, walks the
  # class, and prints the pass's ledger, writing nothing.
  documents-dry-run:
    needs: [authorize, validate, handoff-projection, handoff-parse]
    if: >-
      ${{ inputs.repair == 'recut' && inputs.repair_mode != 'apply'
      && needs.handoff-parse.outputs.plan-artifact != ''
      && needs.handoff-projection.outputs.projection-artifact != ''
      && needs.authorize.result == 'success'
      && (needs.authorize.outputs.attempt == github.run_attempt
      || contains(needs.authorize.outputs.rerunners, format(',{0},', github.triggering_actor))) }}
    runs-on: ubuntu-26.04
    # Setup, the read-only corpus pull (about a gigabyte) and the reading
    # step's 15 minutes (one class walk over the scope, no fetch).
    timeout-minutes: 30
    environment: prod
    permissions:
      contents: read
      id-token: write # assume the read-only AWS role to pull the corpus
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Sync the working tree to the current tip of the default branch
        # The repo is public, so this read-only fetch needs no credentials.
        run: |
          set -euo pipefail
          git fetch origin "${GITHUB_REF_NAME}"
          git reset --hard FETCH_HEAD

      - uses: ./.github/actions/setup-python-env
        with:
          restore-cache: "false"

      # Both files by artifact id, as on the writer below.
      - name: Download the plan
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.handoff-parse.outputs.plan-artifact }}
          merge-multiple: true
          path: ${{ runner.temp }}/handoff/plan

      - name: Download the worklist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.handoff-projection.outputs.projection-artifact }}
          merge-multiple: true
          path: ${{ runner.temp }}/handoff/worklist

      - name: Check the downloaded plan
        run: |
          set -euo pipefail
          found="$(find "${RUNNER_TEMP}/handoff" -mindepth 1 -printf '%y %P\n' | sort)"
          expected="$(printf '%s\n' 'd plan' 'd worklist' 'f plan/plan.json' 'f worklist/projection.json')"
          if [ "${found}" != "${expected}" ]; then
            echo "::error::the downloaded artifacts hold something other than one plan.json and one projection.json"
            exit 1
          fi
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::the plan artifact changed the checkout"
            exit 1
          fi

      - uses: ./.github/actions/corpus-readonly
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME_READONLY }}
          aws-region: ${{ vars.AWS_REGION }}
          corpus-base-url: ${{ vars.CORPUS_BASE_URL }}

      - name: Read the re-cut plan against the stored filings
        # One walk of the scope's stored documents (the predict-relevant walk is
        # a subset of the OCR recovery's 133-162 s whole-live-slice walk), and
        # no fetch: the slice was spent in the parse.
        timeout-minutes: 15
        env:
          FEDCOURTS_CORPUS_BASE_URL: ${{ vars.CORPUS_BASE_URL }}
          REPAIR: ${{ inputs.repair }}
          REPAIR_BOUND: ${{ inputs.repair_bound }}
          HANDOFF_PLAN: ${{ runner.temp }}/handoff/plan/plan.json
          HANDOFF_WORKLIST: ${{ runner.temp }}/handoff/worklist/projection.json
        run: |
          set -euo pipefail
          # The step of record for the bound in this job; `repair_passes.py`
          # duplicates it word for word.
          if [ -n "${REPAIR_BOUND}" ] \
            && ! [[ "${REPAIR_BOUND}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::repair=${REPAIR} reads repair_bound in BOTH modes, so it must be a positive integer wherever it is set — a bound its dry run would also spend. Clear the field or correct the number."
            exit 1
          fi
          slice_args=()
          if [ -n "${REPAIR_BOUND}" ]; then
            slice_args+=(--max-cases "${REPAIR_BOUND}")
          fi
          # The ledger echoes the identifiers the plan carries, so workflow
          # commands are suspended under a token nothing in the plan can know
          # until it has been printed; a refusal is announced after the resume.
          stop_token="$(head -c 16 /dev/urandom | od -An -tx1 | tr -d ' \n')"
          echo "::stop-commands::${stop_token}"
          status=0
          uv run fedcourts recut-documents --from-plan "${HANDOFF_PLAN}" \
            --bind-worklist "${HANDOFF_WORKLIST}" "${slice_args[@]}" > /tmp/recut-dry.txt \
            || status=$?
          cat /tmp/recut-dry.txt
          # Bounded into the summary: GitHub discards a step summary above
          # 1 MiB, and an unbounded dry run prints a line per reached item.
          head -c 300000 /tmp/recut-dry.txt >> "$GITHUB_STEP_SUMMARY"
          echo "::${stop_token}::"
          if [ "$status" -ne 0 ]; then
            echo "::error::recut-documents read nothing (exit ${status}): a refused plan — the step log has the reason."
            exit "$status"
          fi
          echo "dry-run only; nothing written."

  # The writer of the split passes that land stored documents, on an apply
  # only: the OCR recovery's (`fedcourts ocr-recover-petitions --from-plan`),
  # the re-cut's (`fedcourts recut-documents --from-plan --apply`) and the
  # document back-fill's (`fedcourts backfill-documents --from-plan --apply`). It
  # takes the lock for the whole job and pulls the corpus FRESH under it with
  # the read-write role, so the class it re-checks the plan against is the
  # one it pushes onto. It fetches and parses no PDF: the readings are the
  # plan's, checked whole first against the projection's own worklist
  # (downloaded by artifact id, so the parse cannot stand another in for it),
  # and each row again against the stored document it would replace — for
  # the OCR recovery, still a scan whose text is empty at the URL the
  # projection read; for the re-cut, still in the class at that URL and page
  # count, then judged against the stored text as the pass in one job judged
  # it; for the document back-fill, still in the class. Each writes what its
  # pass in one job wrote: the OCR recovery the text, the extractor's
  # `ocr_derived` and `truncated` readings and the re-served page count; the
  # re-cut the re-cut text, page count and truncation flag; both a petition's
  # re-derived questions-presented row; the document back-fill each fetched
  # document as the poller stores it, and the floor probe on a candidate read
  # at a floor.
  # The App token is minted only after the push, and the commit is the pass
  # table's record (`repair_passes.PERSIST`), the one the corpus job's
  # persist step reads.
  #
  # Every step here can still request an OIDC token for either corpus role
  # `corpus-write` is trusted by — the job needs `id-token: write` for its own
  # read-write session, and the runner hands the request pair to every step.
  # What stands between the parse and that is the job boundary: the plan is
  # the only thing that crosses, and it is checked before a row is written.
  #
  # The OCR recovery and the re-cut take no dedupe prerequisite: that
  # prerequisite exists for the passes that read a row's columns — a
  # disposition, a grant, a latch — and these read and write stored documents
  # alone, each re-checked by case and kind, as on run-seed's OCR sweep writer
  # (the re-cut's projection says why its scope does not change that). The
  # document back-fill's class is read off a row's columns, so it takes the
  # dedupe here as the corpus job's passes do, in its own step.
  documents:
    needs: [authorize, validate, handoff-projection, handoff-parse]
    if: >-
      ${{ (inputs.repair == 'ocr-recovery' || inputs.repair == 'recut' || inputs.repair == 'document-backfill') && inputs.repair_mode == 'apply'
      && needs.handoff-parse.outputs.plan-artifact != ''
      && needs.handoff-projection.outputs.projection-artifact != ''
      && needs.authorize.result == 'success'
      && (needs.authorize.outputs.attempt == github.run_attempt
      || contains(needs.authorize.outputs.rerunners, format(',{0},', github.triggering_actor))) }}
    concurrency:
      group: ${{ (needs.authorize.result == 'success' && (needs.authorize.outputs.attempt == github.run_attempt || contains(needs.authorize.outputs.rerunners, format(',{0},', github.triggering_actor)))) && (inputs.repair == 'ocr-recovery' || inputs.repair == 'recut' || inputs.repair == 'document-backfill') && inputs.repair_mode == 'apply' && 'corpus-write' || format('corpus-write-skip-{0}', github.run_id) }}
      cancel-in-progress: false
    runs-on: ubuntu-26.04
    # Setup, the corpus pull (about a gigabyte), the document back-fill's
    # 10-minute dedupe, the landing step's 20 minutes (two class walks, the
    # write and the blob push) and the commit; one landing step runs per
    # dispatch.
    timeout-minutes: 55
    environment: corpus-write
    env:
      # Lets this job write the remote corpus estate (see the `repair` job).
      FEDCOURTS_REMOTE_WRITES: "true"
    permissions:
      contents: read
      id-token: write # the read-write role for the fresh pull, the write and the push
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Sync the working tree to the current tip of the default branch
        # Under the lock: the corpus pointer this job builds on moves with every
        # writer's commit. The repo is public, so this read-only fetch needs no
        # credentials.
        run: |
          set -euo pipefail
          git fetch origin "${GITHUB_REF_NAME}"
          git reset --hard FETCH_HEAD

      - uses: ./.github/actions/setup-python-env
        with:
          restore-cache: "false"

      # Both files by artifact id, from the job outputs of the jobs that wrote
      # them: the plan from the parse, the worklist from the projection. A job
      # of this run that ran a parse can replace an artifact by name; it cannot
      # change another job's outputs, and a replaced artifact gets a new id, so
      # a substitution fails the download.
      - name: Download the plan
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.handoff-parse.outputs.plan-artifact }}
          merge-multiple: true
          path: ${{ runner.temp }}/handoff/plan

      - name: Download the worklist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.handoff-projection.outputs.projection-artifact }}
          merge-multiple: true
          path: ${{ runner.temp }}/handoff/worklist

      # The plan was uploaded by a job that ran a parse, so what was unpacked
      # is checked before anything reads it: exactly the two files, and
      # nothing in the checkout changed.
      - name: Check the downloaded plan
        run: |
          set -euo pipefail
          found="$(find "${RUNNER_TEMP}/handoff" -mindepth 1 -printf '%y %P\n' | sort)"
          expected="$(printf '%s\n' 'd plan' 'd worklist' 'f plan/plan.json' 'f worklist/projection.json')"
          if [ "${found}" != "${expected}" ]; then
            echo "::error::the downloaded artifacts hold something other than one plan.json and one projection.json"
            exit 1
          fi
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::the plan artifact changed the checkout"
            exit 1
          fi

      # Same read-write (append-only) role as the corpus job's: the write
      # replaces stored document rows in the content store and the index, and
      # can never wipe a remote object.
      - name: Configure AWS credentials (corpus S3 remote, read-write)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}
          role-duration-seconds: 3600 # 1h
          # Bounded for the corpus job's reason (the workflow-traps list in
          # docs/pipeline.md).
          action-timeout-s: 120

      # The blob the write builds on, pulled inside the lock.
      - name: Pull the current corpus from the remote
        env:
          FEDCOURTS_CORPUS_BASE_URL: ${{ vars.CORPUS_BASE_URL }}
        run: |
          set -euo pipefail
          uv run fedcourts corpus-pull

      # Land the plan, witness the write and push the blob. No GitHub write
      # credential exists yet.
      #
      # The writes are documents, which under the corpus split live in the
      # content store rather than the blob, so the pointer commit cannot
      # witness them: the re-read below does. The writer walks the class before
      # it writes, so its ledger's `remaining` is that class less what this
      # write recovered, and the re-read must find exactly that many. The
      # witness stays in the writer rather than resting on the plan's own
      # count, because what it catches is a content-store write that failed,
      # which only a read of the store can see.
      - name: Write the recovered filings
        if: ${{ inputs.repair == 'ocr-recovery' }}
        # Two full-population content-store walks — the writer's own and the
        # witness re-read, each measured at 133-162 s — the write, and the blob
        # push. No fetch and no recognition: the slice was spent in the parse.
        timeout-minutes: 20
        env:
          FEDCOURTS_CORPUS_BASE_URL: ${{ vars.CORPUS_BASE_URL }}
          REPAIR: ${{ inputs.repair }}
          REPAIR_MODE: ${{ inputs.repair_mode }}
          REPAIR_BOUND: ${{ inputs.repair_bound }}
          HANDOFF_PLAN: ${{ runner.temp }}/handoff/plan/plan.json
          HANDOFF_WORKLIST: ${{ runner.temp }}/handoff/worklist/projection.json
        run: |
          set -euo pipefail
          # The step of record for the bound; `repair_passes.py` duplicates it
          # word for word.
          if [ "${REPAIR_MODE}" = "apply" ] \
            && ! [[ "${REPAIR_BOUND}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::repair=${REPAIR} with repair_mode=apply needs repair_bound set to a positive integer — the count read off a previous dry-run dispatch's ledger. Re-dispatch with that number."
            exit 1
          fi
          # Read off the machine-readable ledger each run prints last, rather
          # than off the prose above it: the field name is passed as an argument
          # so nothing from a file is interpolated into the program.
          ledger_field() {
            grep -h '^{"applied"' "$1" | tail -n 1 \
              | uv run python -c 'import json,sys; print(json.load(sys.stdin)[sys.argv[1]])' "$2"
          }
          # The summary is capped: GitHub errors the file command past 1 MiB,
          # and the re-read's ledger names the whole class. The head reaches the
          # summary; the full ledger is in the step log.
          summarize() {
            cat "$1"
            head -n 60 "$1" >> "$GITHUB_STEP_SUMMARY"
            local total
            total=$(wc -l < "$1")
            if [ "$total" -gt 60 ]; then
              echo "… $((total - 60)) more line(s) in the step log" >> "$GITHUB_STEP_SUMMARY"
            fi
          }
          # The ledger echoes the identifiers the plan carries, so workflow
          # commands are suspended for the run under a token nothing in the
          # plan can know, until its ledger has been printed. A refusal is
          # announced after the resume. Its stdout
          # goes to a file of its own because the ledger's last line is JSON
          # read back as data.
          stop_token="$(head -c 16 /dev/urandom | od -An -tx1 | tr -d ' \n')"
          echo "::stop-commands::${stop_token}"
          status=0
          uv run fedcourts ocr-recover-petitions --from-plan "${HANDOFF_PLAN}" \
            --bind-worklist "${HANDOFF_WORKLIST}" --max-cases "${REPAIR_BOUND}" \
            --apply > /tmp/ocr-apply.txt || status=$?
          if [ "$status" -eq 0 ]; then
            summarize /tmp/ocr-apply.txt
          fi
          echo "::${stop_token}::"
          if [ "$status" -ne 0 ]; then
            echo "::error::ocr-recover-petitions wrote nothing (exit ${status}): a refused plan — the step log has the reason."
            exit "$status"
          fi
          # The witness. `--probe=0` because this run counts and fetches
          # nothing: a content-store write that failed would leave a recovered
          # filing in the class, which nothing in the pointer commit would ever
          # notice.
          uv run fedcourts ocr-recover-petitions --probe=0 > /tmp/ocr-verify.txt
          summarize /tmp/ocr-verify.txt
          expected="$(ledger_field /tmp/ocr-apply.txt remaining)"
          found="$(ledger_field /tmp/ocr-verify.txt candidates)"
          # A slice the parse started nothing of writes nothing, pushes nothing
          # and exits green, which is the one shape of this pass a reader can
          # miss. The parse walks no class, so its deadline cannot decline the
          # head on its own; a slice that started nothing means the parse's own
          # step log has the reason. Said as an annotation because the ledger's
          # `attempted 0` sits in a summary nobody reads on a green run.
          if [ "$(ledger_field /tmp/ocr-apply.txt attempted)" = "0" ] \
            && [ "${expected}" != "0" ]; then
            echo "::warning::the parse started no candidate of the slice — ${expected} left in the class and nothing recovered. Read the parse's step log rather than re-dispatching."
          fi
          if [ "${found}" != "${expected}" ]; then
            echo "::error::apply did not converge — the re-read finds ${found} scanned filing(s) where the apply's ledger left ${expected} (a content-store write may have failed; see the warnings above)"
            exit 1
          fi
          # Blob before pointer commit, as everywhere: readers resolve the
          # committed pointer, so a push without its commit publishes nothing.
          uv run fedcourts corpus-push

      # Land the re-cut plan, witness the write and push the blob, as above:
      # the writer walks the class over the worklist's own scope before it
      # writes, so its ledger's `remaining` is that class less the re-cuts
      # that left it, and the re-read must find exactly that many.
      - name: Write the re-cut filings
        if: ${{ inputs.repair == 'recut' }}
        # Two walks of the scope's stored documents — the writer's own and the
        # witness re-read; the predict-relevant walk is a subset of the OCR
        # recovery's 133-162 s whole-live-slice walk, and `all-live` is that
        # walk — the write, and the blob push.
        timeout-minutes: 20
        env:
          FEDCOURTS_CORPUS_BASE_URL: ${{ vars.CORPUS_BASE_URL }}
          REPAIR: ${{ inputs.repair }}
          REPAIR_MODE: ${{ inputs.repair_mode }}
          REPAIR_BOUND: ${{ inputs.repair_bound }}
          HANDOFF_PLAN: ${{ runner.temp }}/handoff/plan/plan.json
          HANDOFF_WORKLIST: ${{ runner.temp }}/handoff/worklist/projection.json
        run: |
          set -euo pipefail
          # The step of record for the bound in this job; `repair_passes.py`
          # duplicates it word for word.
          if [ "${REPAIR_MODE}" = "apply" ] \
            && ! [[ "${REPAIR_BOUND}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::repair=${REPAIR} with repair_mode=apply needs repair_bound set to a positive integer — the count read off a previous dry-run dispatch's ledger. Re-dispatch with that number."
            exit 1
          fi
          ledger_field() {
            grep -h '^{"applied"' "$1" | tail -n 1 \
              | uv run python -c 'import json,sys; print(json.load(sys.stdin)[sys.argv[1]])' "$2"
          }
          # Bounded into the summary rather than tee'd whole: GitHub discards a
          # step summary above 1 MiB entirely. The full output stays in the
          # step log.
          summarize() {
            cat "$1"
            head -c 300000 "$1" >> "$GITHUB_STEP_SUMMARY"
          }
          stop_token="$(head -c 16 /dev/urandom | od -An -tx1 | tr -d ' \n')"
          echo "::stop-commands::${stop_token}"
          status=0
          uv run fedcourts recut-documents --from-plan "${HANDOFF_PLAN}" \
            --bind-worklist "${HANDOFF_WORKLIST}" --max-cases "${REPAIR_BOUND}" \
            --apply > /tmp/recut-apply.txt || status=$?
          if [ "$status" -eq 0 ]; then
            summarize /tmp/recut-apply.txt
          fi
          echo "::${stop_token}::"
          if [ "$status" -ne 0 ]; then
            echo "::error::recut-documents wrote nothing (exit ${status}): a refused plan — the step log has the reason."
            exit "$status"
          fi
          # The witness walks the scope the writer's ledger names, which it read
          # off the projection's own worklist: a re-read over another scope
          # would compare two different classes.
          scope_args=()
          if [ "$(ledger_field /tmp/recut-apply.txt scope)" = "all-live" ]; then
            scope_args+=(--all-live)
          fi
          # `--max-cases 0` takes an empty slice, so it fetches nothing, and
          # what it reports is the class as the corpus now holds it: a
          # content-store write that failed would leave a re-cut row in the
          # class, which nothing in the pointer commit would notice.
          uv run fedcourts recut-documents "${scope_args[@]}" --max-cases 0 > /tmp/recut-verify.txt
          summarize /tmp/recut-verify.txt
          expected="$(ledger_field /tmp/recut-apply.txt remaining)"
          found="$(ledger_field /tmp/recut-verify.txt candidates)"
          if [ "$(ledger_field /tmp/recut-apply.txt attempted)" = "0" ] \
            && [ "${expected}" != "0" ]; then
            echo "::warning::the parse started no candidate of the slice — ${expected} left in the class and nothing re-cut. Read the parse's step log rather than re-dispatching."
          fi
          if [ "${found}" != "${expected}" ]; then
            echo "::error::apply did not converge — the re-read finds ${found} head-cut filing(s) where the apply's ledger left ${expected} (a content-store write may have failed; see the warnings above)"
            exit 1
          fi
          uv run fedcourts corpus-push

      # The document back-fill's dedupe prerequisite, as the corpus job runs
      # it ahead of its passes and the projection ran it on its own copy: the
      # pass reads a row's columns, so it must read the merged row of a twin
      # pair, and the writer must walk the class the projection cut the
      # worklist from. Applied here under the lock; the merge's re-keyed rows
      # ride the blob push below and its moved minted-event directories the
      # commit step's `data/`, so nothing lands until both do. The merge reads
      # committed `data/` as a refusal guard (a twin whose events carry
      # committed cell output must not merge), so it fast-forwards to the
      # remote tip first, as the corpus job's dedupe does: a collect PR, which
      # takes no corpus-write lock, can land output since the sync step. One
      # landing after this step is the commit step's refusal.
      - name: Dedupe live-minted duplicate rows
        id: dedupe-live-rows
        if: ${{ inputs.repair == 'document-backfill' }}
        timeout-minutes: 10
        env:
          FEDCOURTS_CORPUS_BASE_URL: ${{ vars.CORPUS_BASE_URL }}
        run: |
          set -euo pipefail
          # The repo is public, so this read-only fetch needs no credentials.
          git fetch origin "${GITHUB_REF_NAME}"
          git merge --ff-only FETCH_HEAD
          # Dry-run first, into the summary: the merge moves ledger event
          # directories with the re-keyed rows, and the would-move ledger must
          # outlive the step log.
          uv run fedcourts dedupe-live-rows 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          uv run fedcourts dedupe-live-rows --apply

      # Land the back-fill plan, witness the write and push the blob, as above.
      # The writer walks the class before it writes, so its ledger's
      # `remaining` is that class less what this write recovered and the
      # floors it stamped, and the re-read must find exactly that many. The
      # floor stamps are index columns, so an applied slice that read a floor
      # moves the pointer; the documents land in the content store, which only
      # the re-read can witness.
      #
      # A stamp has no undo on this lane: the column is a fill-in latch, so no
      # writer clears it, and a docket that has left the live rotation is never
      # re-polled. The pass itself is what keeps a bad reading from being
      # banked — a floor its modern-docket alarm fired on is never stamped,
      # because that reading is about the selector rather than about the
      # docket. Read the alarm before re-dispatching an apply.
      - name: Write the back-filled documents
        if: ${{ inputs.repair == 'document-backfill' && steps.dedupe-live-rows.outcome == 'success' }}
        # Two walks of the predict-relevant population's stored documents —
        # the writer's own and the witness re-read, each a subset of the OCR
        # recovery's 133-162 s whole-live-slice walk — the write, and the blob
        # push. No fetch: the slice was spent in the parse.
        timeout-minutes: 20
        env:
          FEDCOURTS_CORPUS_BASE_URL: ${{ vars.CORPUS_BASE_URL }}
          REPAIR: ${{ inputs.repair }}
          REPAIR_MODE: ${{ inputs.repair_mode }}
          REPAIR_BOUND: ${{ inputs.repair_bound }}
          HANDOFF_PLAN: ${{ runner.temp }}/handoff/plan/plan.json
          HANDOFF_WORKLIST: ${{ runner.temp }}/handoff/worklist/projection.json
        run: |
          set -euo pipefail
          # The step of record for the bound in this job; `repair_passes.py`
          # duplicates it word for word.
          if [ "${REPAIR_MODE}" = "apply" ] \
            && ! [[ "${REPAIR_BOUND}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::repair=${REPAIR} with repair_mode=apply needs repair_bound set to a positive integer — the count read off a previous dry-run dispatch's ledger. Re-dispatch with that number."
            exit 1
          fi
          ledger_field() {
            grep -h '^{"applied"' "$1" | tail -n 1 \
              | uv run python -c 'import json,sys; print(json.load(sys.stdin)[sys.argv[1]])' "$2"
          }
          # Bounded into the summary rather than tee'd whole: GitHub discards a
          # step summary above 1 MiB entirely. The full output stays in the
          # step log.
          summarize() {
            cat "$1"
            head -c 300000 "$1" >> "$GITHUB_STEP_SUMMARY"
          }
          stop_token="$(head -c 16 /dev/urandom | od -An -tx1 | tr -d ' \n')"
          echo "::stop-commands::${stop_token}"
          status=0
          uv run fedcourts backfill-documents --from-plan "${HANDOFF_PLAN}" \
            --bind-worklist "${HANDOFF_WORKLIST}" --max-cases "${REPAIR_BOUND}" \
            --apply > /tmp/document-apply.txt || status=$?
          if [ "$status" -eq 0 ]; then
            summarize /tmp/document-apply.txt
          fi
          echo "::${stop_token}::"
          if [ "$status" -ne 0 ]; then
            echo "::error::backfill-documents wrote nothing (exit ${status}): a refused plan — the step log has the reason."
            exit "$status"
          fi
          modern="$(ledger_field /tmp/document-apply.txt no_entry_modern_cases)"
          if [ "${modern}" != "[]" ]; then
            echo "::warning::selector regression: ${modern} matched no opening entry on a modern docket. The selector has no arm for their filing type; widen it rather than re-dispatching this pass."
          fi
          # The witness. `--max-cases 0` is the walk-only reading — it takes an
          # empty slice, so it fetches nothing, and what it reports is the class
          # as the corpus now holds it. `remaining` nets out the floors this
          # slice stamped as well as the cases it recovered, because both left
          # the class, so the equality below is exact. It holds only while every
          # stamp reads as standing on the re-read (the probe date against the
          # row's own live-poll stamp), so a mismatch here can also be a clock
          # rather than the content-store failure the error names.
          uv run fedcourts backfill-documents --max-cases 0 > /tmp/document-verify.txt
          summarize /tmp/document-verify.txt
          expected="$(ledger_field /tmp/document-apply.txt remaining)"
          found="$(ledger_field /tmp/document-verify.txt candidates)"
          if [ "$(ledger_field /tmp/document-apply.txt attempted)" = "0" ] \
            && [ "${expected}" != "0" ]; then
            echo "::warning::the parse started no candidate of the slice — ${expected} left addressable in the class and nothing recovered. Read the parse's step log rather than re-dispatching."
          fi
          if [ "${found}" != "${expected}" ]; then
            echo "::error::apply did not converge — the re-read finds ${found} addressable candidate(s) in the gap class where the apply's ledger left ${expected} (a content-store write may have failed, or a floor probe this slice stamped did not read as standing on the re-read; see the warnings above)"
            exit 1
          fi
          uv run fedcourts corpus-push

      - name: Mint app token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.DATA_APP_CLIENT_ID }}
          private-key: ${{ secrets.DATA_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Configure git identity
        uses: ./.github/actions/configure-git-identity
        with:
          token: ${{ steps.app-token.outputs.token }}
          app-slug: ${{ steps.app-token.outputs.app-slug }}

      # The pointer, under the pass table's commit record, and `data/` where
      # the record stages it: the document back-fill's dedupe moves
      # minted-event directories with the rows it merges, and no pass here
      # writes a ledger path itself. Under the corpus split the written text
      # lands in the content store and the blob may come back byte-identical,
      # which is why the pointer is not the witness and an unchanged one is
      # reported rather than failed. The step holding the App token needs no AWS
      # session, so the read-write session's variables are blanked: a step's
      # `env:` does override what the credentials action exported, which is
      # not true of the OIDC request pair.
      - name: Commit the documents pointer
        env:
          AWS_ACCESS_KEY_ID: ""
          AWS_SECRET_ACCESS_KEY: ""
          AWS_SESSION_TOKEN: ""
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPAIR: ${{ inputs.repair }}
        run: |
          set -euo pipefail
          if env | grep -E '^AWS_' | grep -E '=.+' | grep -vE '^AWS_(REGION|DEFAULT_REGION)=' > /dev/null; then
            echo "::error::AWS credential variables reached the documents commit"
            exit 1
          fi
          python3 -I -S src/fedcourtsai/repair_passes.py persist \
            > "${RUNNER_TEMP}/persist-record"
          mapfile -t record < "${RUNNER_TEMP}/persist-record"
          if [ "${#record[@]}" -ne 4 ]; then
            echo "::error::the pass table's persist record for ${REPAIR} is not four lines"
            exit 1
          fi
          stage="${record[0]}"; message="${record[1]}"
          label="${record[2]}"; unchanged="${record[3]}"
          gh auth setup-git # persist-credentials is false on checkout
          git add corpus/corpus.db.ref
          if [ "${stage}" = "pointer+data" ] && [ -d data ]; then
            git add data/
            # The dedupe's guard read `data/` as it stood when it ran. A case
            # directory it moved away from that has gained committed output on
            # the default branch since would land that output under a row the
            # merge removed, and the push's rebase would not conflict on it, so
            # it is refused here; the next dispatch's dedupe reads it.
            git fetch origin "${GITHUB_REF_NAME}"
            moved="$(git diff --cached --no-renames --name-only --diff-filter=D HEAD -- data/cases \
              | cut -d/ -f1-4 | sort -u)"
            arrived="$(git diff --name-only HEAD FETCH_HEAD -- data/cases \
              | cut -d/ -f1-4 | sort -u)"
            if [ -n "${moved}" ] && [ -n "${arrived}" ] \
              && [ -n "$(comm -12 <(printf '%s\n' "${moved}") <(printf '%s\n' "${arrived}"))" ]; then
              echo "::error::the default branch gained output under a case the dedupe merged away since it ran; nothing committed. Re-dispatch the pass."
              exit 1
            fi
          fi
          if git diff --cached --quiet; then
            echo "${unchanged}"
            exit 0
          fi
          git commit -m "${message}"
          bash "${GITHUB_WORKSPACE}/.github/actions/commit-corpus-to-main/push_with_retry.sh" \
            "${label}"

  # The ledger-only pass, in its own job because its credentials are a strict
  # subset: it recomputes graded fields out of committed artifacts and writes
  # `evaluation.json`, touching no corpus row. So no AWS role, no
  # `id-token: write`, no corpus remote, no content-store env — only the App
  # token that pushes the `data/` commit. A pass that cannot reach the corpus
  # should not hold the credentials that reach it.
  #
  # It needs no dedupe prerequisite either, for the same reason it needs no
  # corpus: an unmerged twin row cannot change what a committed outcome already
  # says.
  regrade:
    needs: [authorize, validate]
    if: >-
      ${{ inputs.repair == 'regrade-stale'
      && needs.authorize.result == 'success'
      && (needs.authorize.outputs.attempt == github.run_attempt
      || contains(needs.authorize.outputs.rerunners, format(',{0},', github.triggering_actor))) }}
    # It commits to `main` on the same push path as the corpus writers, so it
    # joins their lock rather than racing their pointer commits — and takes the
    # throwaway group when it will be skipped, for the corpus job's reason.
    concurrency:
      group: ${{ (needs.authorize.result == 'success' && (needs.authorize.outputs.attempt == github.run_attempt || contains(needs.authorize.outputs.rerunners, format(',{0},', github.triggering_actor)))) && inputs.repair == 'regrade-stale' && 'corpus-write' || format('corpus-write-skip-{0}', github.run_id) }}
      cancel-in-progress: false
    runs-on: ubuntu-26.04
    # One local recompute per named cell over a maintainer-sized list, plus
    # setup.
    timeout-minutes: 25
    environment: prod
    permissions:
      contents: read
    steps:
      - name: Mint app token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.DATA_APP_CLIENT_ID }}
          private-key: ${{ secrets.DATA_APP_PRIVATE_KEY }}
          permission-contents: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Sync the working tree to the current tip of the default branch
        # Same stale-base hazard as the corpus job: a run that queued behind a
        # writer on the shared lock checked out a frozen sha, and the
        # evaluations being rewritten arrive by collect PR. The repo is public,
        # so this read-only fetch needs no credentials.
        run: |
          set -euo pipefail
          git fetch origin "${GITHUB_REF_NAME}"
          git reset --hard FETCH_HEAD

      - uses: ./.github/actions/setup-python-env
        with:
          restore-cache: "false"

      - name: Configure git identity
        uses: ./.github/actions/configure-git-identity
        with:
          token: ${{ steps.app-token.outputs.token }}
          app-slug: ${{ steps.app-token.outputs.app-slug }}

      # Recompute the graded fields of named evaluator cells under their
      # original stamp, for cells whose committed outcome moved after the grade
      # was taken — the corpus passes rewrite and reopen outcomes without
      # consulting who has already graded them.
      #
      # What the scoring surfaces make of the result is the command's contract,
      # not this step's: per `metrics/README.md`, a standing moves honestly only
      # through a grading the supersede-collapse counts, and a bare re-stamp of
      # an existing `evaluation.json` moves it with a trace only in `data/`'s
      # git history. This step names cells and invokes the command; it cannot
      # supply that property if the command does not.
      - name: Re-grade named cells
        # One re-grade per line, so a cell graded by three judges is three
        # lines — the list is explicit on purpose: a re-grade rewrites a
        # committed evaluation, and which judge's is not a thing to infer.
        timeout-minutes: 15
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPAIR_MODE: ${{ inputs.repair_mode }}
          REPAIR_TARGET: ${{ inputs.repair_target }}
        run: |
          set -euo pipefail
          # `repair_target` is maintainer-typed free text entering a shell, so
          # it is handled as data throughout: expanded from the environment
          # (never interpolated into this script), split on whitespace, and
          # every line matched against the id grammar before a command sees
          # it. The grammar excludes `.` deliberately — with no dots no field
          # can be a `..` path segment, whatever the command does with it.
          # `repair_passes.py` duplicates this block's grammar and refusals word for
          # word so a bad list dies before any credential is minted; this copy
          # is the one of record, because the step has to be safe on whatever
          # reaches it.
          pattern='^[a-z0-9-]+/[0-9]+/evt-[a-z0-9-]+/[0-9]{8}T[0-9]{6}Z/[a-z0-9-]+$'
          malformed=0
          cells=()
          # `printf '%s\n'`, not '%s': `read` returns non-zero on a final line
          # with no terminator, so an unterminated last cell would be dropped
          # by the loop — silently, and past the all-or-nothing check below.
          # The blank line this adds is absorbed by the emptiness guard.
          while IFS= read -r line; do
            [ -n "$line" ] || continue
            # Bash's own regex match: no pipeline, so no interaction with
            # pipefail and no per-line subprocess.
            if [[ "$line" =~ $pattern ]]; then
              cells+=("$line")
            else
              echo "::error::malformed regrade cell (want court/docket/event/run_id/actor, e.g. scotus/1119228/evt-petition-certiorari/20260624T103000Z/claude-judge): ${line}"
              malformed=1
            fi
          done < <(printf '%s\n' "${REPAIR_TARGET}" | tr -s ' \t\r' '\n')
          # All-or-nothing: a half-applied list is worse to reason about than a
          # refused one, and the fix is the same edit either way.
          if [ "$malformed" -ne 0 ]; then
            echo "::error::refusing the whole list — correct the lines above and re-dispatch."
            exit 1
          fi
          if [ "${#cells[@]}" -eq 0 ]; then
            echo "::error::repair=regrade-stale names no cells — set repair_target."
            exit 1
          fi
          if [ "${REPAIR_MODE}" = "apply" ]; then
            gh auth setup-git # persist-credentials is false on checkout
            # Recompute on top of the remote tip, not this checkout's: the
            # evaluations being rewritten arrive by collect PR, and a re-grade
            # computed against a stale copy would commit a rewrite of a
            # superseded file. Fast-forward only, so an exhausted push retry
            # upstream fails this step closed rather than being reset away.
            git fetch origin "$GITHUB_REF_NAME"
            git merge --ff-only FETCH_HEAD
          fi
          touched=()
          for cell in "${cells[@]}"; do
            IFS=/ read -r court docket event run actor <<<"$cell"
            if [ "${REPAIR_MODE}" != "apply" ]; then
              echo "would run: uv run fedcourts stamp-cell --regrade --court ${court} --docket ${docket} --event ${event} --run-id ${run} --role evaluator --actor ${actor}" \
                | tee -a "$GITHUB_STEP_SUMMARY"
              continue
            fi
            uv run fedcourts stamp-cell --regrade \
              --court "$court" --docket "$docket" --event "$event" \
              --run-id "$run" --role evaluator --actor "$actor" 2>&1 \
              | tee -a "$GITHUB_STEP_SUMMARY"
            touched+=("data/cases/${court}/${docket}/events/${event}/evaluations/${actor}")
          done
          if [ "${REPAIR_MODE}" != "apply" ]; then
            echo "dry-run only; nothing written."
            exit 0
          fi
          # Stage the named cells' evaluator directories, never a blanket
          # `git add data/`. This commit carries no corpus pointer, so anything
          # it stages that the corpus half never moved for would publish a
          # ledger-only split; an enumerated, grammar-checked jail is what keeps
          # that impossible. The jail is the named actor's directory, one level
          # wider than the named run id — the re-grade rewrites in place, so
          # nothing else under that actor changes, and no other actor's path and
          # no traversal is reachable from the grammar.
          git add -- "${touched[@]}"
          if git diff --cached --quiet; then
            echo "Re-grade reproduced the stored grades; nothing to persist."
            exit 0
          fi
          git commit -m "repair: re-grade named cells"
          bash "${GITHUB_WORKSPACE}/.github/actions/commit-corpus-to-main/push_with_retry.sh" \
            "re-grade ledger"

  # The run gate's verdict on the run as a whole. A refused partial re-run
  # skips every job it re-runs, which alone would leave the earlier attempt's
  # successes standing and the run concluding `success`. This job needs every
  # other job, so any re-run re-runs it, and it fails the run when the gate did
  # not pass or this attempt is neither the one the gate judged nor a re-run by
  # a login the gate published. No checkout, no token, no environment.
  run-gate:
    needs: [authorize, validate, repair, handoff-projection, handoff-parse, votes, applications, decision-record, opinion-record, documents-dry-run, documents, regrade]
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Fail a run the gate refused
        if: >-
          ${{ needs.authorize.result != 'success'
          || (needs.authorize.outputs.attempt != github.run_attempt
          && !contains(needs.authorize.outputs.rerunners, format(',{0},', github.triggering_actor))) }}
        env:
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: |
          echo "::error::The run gate refused this run or re-run (started by ${TRIGGERING_ACTOR}): see the authorize job's log, or config/dispatchers.json for who may re-run."
          exit 1
