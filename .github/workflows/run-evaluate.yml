name: run-evaluate

# The evaluate stage's own lane. Fans out over every enabled evaluator x resolved
# event and runs the matching coding agent. Each evaluator scores every
# predictor's prediction for the event internally, so predictors are not a
# matrix dimension. The agent only writes files; each cell uploads its output as
# an artifact and the `collect` job aggregates the whole run into one auto-merged
# PR (plus a draft PR for any partial output). Mirrors run-predict.yml.
#
# One way in, and it names no cases: the **schedule** (and its on-demand
# `workflow_dispatch` twin) derives its own fan-out from the corpus-level
# evaluate backlog — the gradings committed state still owes. Level-triggered by
# construction: the scan reads committed ledger state, so a round that failed,
# was declined, or never ran is simply re-derived next cycle, and no trigger has
# to be re-filed for it.
#
# The trigger decides only *when* a round derives; it never names its cases. What
# decides whether it spends is the `review` hold: every run renders its plan
# report and waits on that environment's required reviewers before a cell spends
# a token.
on:
  schedule:
    # Daily at 15:39 UTC. The backlog only moves when a pull window resolves
    # events, so the slot sits after one has finished and committed, in the first
    # stretch of the day with no corpus writer possibly still running: run-pull's
    # 13:17 pull window is capped at 45 minutes (to 14:02) and run-seed's 14:31
    # walk at 55 (to 15:26), so by :39 the day's resolutions are in the ledger and
    # the writers are done — the next scheduled job is run-pull's 16:47 live
    # window, 68 minutes out. This job only ever *reads* the corpus and takes no
    # `corpus-write` lock, so an overlap would cost nothing but a staler read;
    # the slot avoids one anyway, so the round sees the day's full ledger. The
    # minute is off every other workflow's (:00, :13, :17, :27, :30, :31, :41,
    # :47) so the repo's offset grid stays legible.
    #
    # Once a day, not once per pull window. Two things size the lane and neither
    # is the cron: `backlog_cases_per_cycle` caps the cases a cycle takes, and the
    # serializing group below means a round still holding the review hold would
    # queue the next one behind it — so a faster cadence buys drain rate only
    # while a human is releasing holds at the same rate.
    #
    # GitHub delivers `schedule` events best-effort: a slot can be delayed or
    # dropped with no record, and a newly registered cron sometimes never
    # indexes until the file changes again on the default branch. A missed slot
    # costs a day's drain, nothing else (the backlog is level-triggered); the
    # input-less dispatch below is the manual twin that drains it on demand.
    - cron: "39 15 * * *"
  # The same derivation, on demand — for a backlog that should drain now rather
  # than at the next window. Deliberately input-less: the backlog is the only
  # case list this workflow has, and a run that wants to spend on hand-picked
  # cases is an `evaluate-plan` reading plus a maintainer's judgement, not a
  # trigger input that would reintroduce an unauthenticated case list.
  workflow_dispatch:

permissions: {}

# One evaluate round at a time, across both triggers — a per-workflow group,
# because neither a schedule nor a dispatch carries anything to key on.
#
# Serializing is load-bearing, not tidiness: two concurrent rounds would derive
# overlapping backlogs. The already-graded gate that makes the fan-out idempotent
# reads *committed* state, so it cannot see a round whose collect PR has not
# merged yet, and this group — not that gate — is what keeps a second derivation
# out of that window.
#
# `cancel-in-progress: false` protects the *running* round, not the queue behind
# it: GitHub holds at most one pending run per group, and a third arrival
# supersedes the one that was waiting. Read that against the review hold, which
# can park a round for days — every round here is level-triggered and loses
# nothing when its successor replaces it in the queue, since the backlog it
# would have drained is re-derived by whichever round does run.
concurrency:
  group: run-evaluate
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    # The job pulls the whole corpus and scans every resolved event, unattended,
    # and holds the serializing group while it does — so a hung pull would
    # otherwise burn the six-hour job default *and* block the next round behind
    # it. 30 minutes is well clear of a pull plus the scan (seconds once local)
    # and inside the read-only role's default one-hour credential, so the cap
    # trips before the credential expires and the failure names the right cause.
    timeout-minutes: 30
    environment: prod
    # Corpus-split read side for the matrix scope backstop: the bare-opinion-
    # import exclusion fetches the case's latest snapshot, which under
    # FEDCOURTS_CORPUS_SPLIT=1 lives only in the per-case content store (the
    # pulled index carries no snapshots). Unset variable -> '0' -> off.
    env:
      FEDCOURTS_CASESTORE_URL: ${{ vars.CASESTORE_URL }}
      FEDCOURTS_CORPUS_SPLIT: ${{ vars.FEDCOURTS_CORPUS_SPLIT || '0' }}
    permissions:
      contents: read
      id-token: write # assume the AWS role for the corpus pull (read-only)
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_jobs: ${{ steps.plan.outputs.has_jobs }}
    steps:
      # No authorization gate here, and none is missing: this workflow carries no
      # trigger an outside actor can reach. A `schedule` fires only from the
      # DEFAULT branch, so it can run only what a maintainer-merged promotion put
      # on `main`; a `workflow_dispatch` is gated by GitHub on repository write;
      # and this job binds `prod`, whose deployment branches are restricted to
      # `main`, so a dispatch from any other ref is refused before a step runs.
      # The `review` hold still stands between this plan and any spend, on both
      # triggers alike. (SECURITY.md -> *Trigger surface* carries the same
      # reasoning for every lane.)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python-env

      # The backlog derivation is a whole-court read shape — one pass over every
      # resolved event plus a row per candidate case, tens of thousands of them —
      # which a pulled corpus serves in seconds and a read-in-place backend would
      # serve as a range-request storm. So pull the whole index. The default role
      # duration is right: this job reads the pulled file locally, so nothing
      # outlives the credential except the pull itself. `evaluate-matrix` refuses
      # a non-local backend for this scan rather than performing it slowly, so
      # getting this step wrong fails the plan loudly instead of quietly costing
      # an hour. (The cell jobs below read ranged, through their own sidecar:
      # point lookups for one case are the opposite shape.)
      - uses: ./.github/actions/corpus-readonly
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME_READONLY }}
          aws-region: ${{ vars.AWS_REGION }}
          corpus-remote-url: ${{ vars.CORPUS_REMOTE_URL }}

      - name: Build evaluator x case x event matrix
        id: plan
        run: |
          set -euo pipefail
          run_id=$(date -u +%Y%m%dT%H%M%SZ)
          # No case list is passed, and that is the request: given no --body-file
          # and no --court/--docket, `evaluate-matrix` derives the cases from the
          # corpus-level evaluate backlog itself. The report step below passes
          # none either — both invocations must select the same cases, or the plan
          # a maintainer approves is not the fan-out.
          matrix=$(uv run fedcourts evaluate-matrix --run-id "$run_id")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          # The report step re-derives the plan under this same id: the run id
          # is the join key between the approval record and the committed
          # evaluation paths, so the two invocations must not mint their own.
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          count=$(echo "$matrix" | jq '.include | length')
          if [ "$count" -gt 0 ]; then
            echo "has_jobs=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_jobs=false" >> "$GITHUB_OUTPUT"
          fi
          # Ops analytics: record the planned fan-out in the Actions UI.
          echo "## run-evaluate — queued ${count} evaluation job(s)" >> "$GITHUB_STEP_SUMMARY"
          # The step summary is the whole record — there is no trigger issue to
          # close with a note — so say what an empty matrix means rather than
          # leaving a bare zero. A drained backlog is the ordinary resting state
          # of a healthy lane, not a fault, and the run ends cleanly on it: the
          # `evaluate` and `collect` jobs are skipped (`needs` + `has_jobs`) and
          # nothing spends.
          if [ "$count" -eq 0 ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "The evaluate backlog is drained: no resolved event with a committed prediction is missing an enabled evaluator's grading (within this cycle's cap). Nothing to run; no spend — the run ends cleanly here." >> "$GITHUB_STEP_SUMMARY"
          fi

      # The plan report the approval below is judged on: the tested plan
      # command re-derives the same fan-out the matrix step just minted (same
      # helpers, zero spend) and renders per-step counts, the would-grade
      # cell list, and the spend estimate — whose basis the report itself
      # caveats, the evaluate side being a scaled pre-freeze anchor until an
      # evaluate fan-out under the currently blessed grading digests measures
      # the cert stage. Written to the step summary BEFORE the hold, so the
      # record of what was approved exists whether or not the release ever
      # comes — the pending deployment review links this run, so the summary is
      # the page an approver lands on. Unlike predict's twin there is no
      # stranded-run census to attach — the evaluate plan carries no stranded
      # guard — so the call is the bare report form.
      #
      # This step runs on EVERY round that queued jobs. The report is what the
      # review hold is judged on, so a round that skipped it would ask a
      # maintainer to release a spend with nothing to read.
      - name: Report the plan for approval
        if: ${{ steps.plan.outputs.has_jobs == 'true' }}
        # A second full walk of the backlog on top of the render, so bound the
        # step rather than leaving it to the six-hour default; the job cap above
        # is what stops a genuinely slow round.
        timeout-minutes: 10
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PLAN_RUN_ID: ${{ steps.plan.outputs.run_id }}
        run: |
          set -euo pipefail
          # No case list, exactly as the matrix step above passed none: the plan
          # must re-derive the fan-out that was actually minted, or the plan a
          # maintainer approves is not the run. Read-only either way.
          uv run fedcourts evaluate-plan \
            --run-id "$PLAN_RUN_ID" \
            --approval-report plan-report.md \
            --approval-report-run-url "$RUN_URL" >plan.json 2>plan-stderr.txt \
            || { cat plan-stderr.txt; exit 1; }
          cat plan-report.md >> "$GITHUB_STEP_SUMMARY"
          {
            echo ''
            echo '<details><summary>full plan document</summary>'
            echo ''
            echo '```json'
            jq . plan.json
            echo '```'
            echo ''
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

  # The hold. This job carries no code, no token, and no permissions — its one
  # purpose is the deployment environment: the `review` environment's required
  # reviewers gate it, so every downstream job that spends (the matrix and the
  # collect writer behind it) waits on an explicit, audit-logged release. The
  # wait happens before the job is scheduled, so timeout-minutes bounds only
  # the no-op itself. The same `review` environment gates the predict hold —
  # one environment serves every spend hold, which is what the plan report's
  # closing line and the promotion gate's reviewer check both assume.
  approval:
    needs: plan
    if: needs.plan.outputs.has_jobs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: review
    permissions: {}
    steps:
      - name: Release the held fan-out
        run: echo "the review hold released — the matrix may spend."

  # A hold that did not release still has to leave a durable record of what was
  # declined, and the record is this job's step summary — rendered onto the same
  # run page as the plan report the decision was made on, so the two read
  # together. `!= 'success'` covers the whole class: the Reject button (a failed
  # deployment), a cancelled or expired wait, and a plan job that died after
  # minting the matrix (approval then skipped). No token and no permissions,
  # because a step summary needs neither — which also means no API call to
  # retry and nothing that can half-succeed. Best-effort during a run
  # cancellation, like any always() job.
  #
  # A decline strands nothing: no request is left open anywhere, the plan report
  # is already on this run, and the backlog this round declined to grade is
  # re-derived on the next cycle by construction — so a decline costs a cycle
  # and nothing else.
  rejected:
    needs: [plan, approval]
    if: ${{ always() && needs.plan.outputs.has_jobs == 'true' && needs.approval.result != 'success' }}
    runs-on: ubuntu-latest
    # Nothing here but the summary write; the cap is the runner's own setup
    # with room.
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Record that the hold did not release
        env:
          RESULT: ${{ needs.approval.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          {
            echo "## run-evaluate — the review hold did not release"
            echo ""
            echo "The \`review\` hold ended as \`${RESULT}\` — rejected, cancelled, expired, or the plan failed before the hold — so no cell ran and nothing was spent."
            echo ""
            echo "The plan report on the \`plan\` job of this run is the record of what was declined; if no report appears there, the plan failed before rendering one: ${RUN_URL}"
            echo ""
            echo "Nothing has to be re-filed: the gradings this round would have produced are still missing from committed state, so the next scheduled round derives them again. A \`workflow_dispatch\` runs one now."
          } >> "$GITHUB_STEP_SUMMARY"

  evaluate:
    needs: [plan, approval]
    if: needs.plan.outputs.has_jobs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: prod
    permissions:
      # The cell no longer commits or opens a PR — it only reads the repo and
      # uploads an artifact; the collect job does the git/PR with its own token.
      contents: read
      id-token: write # assume the AWS role for the corpus S3 remote (read-only)
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - name: Mint agent comment token
        id: agent-token
        # Only the Claude step consumes this token (Codex never took one, and
        # Gemini's CLI strips non-allowlisted env vars from agent shells in CI): don't
        # mint a live credential in cells that cannot use it.
        if: matrix.engine == 'claude-code'
        # The least-privilege credential claude-code-action requires. No round
        # here has a triggering issue or PR to comment on, so the issue and
        # pull-request scopes buy the agent nothing it can reach; what matters is
        # the absence of contents:write — the agent only writes files locally,
        # which ride to the collect job as an artifact, and that job (its own
        # token) does the commit/PR, so a prompt injection in docket text cannot
        # push code here.
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.DEV_APP_CLIENT_ID }}
          private-key: ${{ secrets.DEV_APP_PRIVATE_KEY }}
          permission-contents: read
          permission-issues: write
          permission-pull-requests: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: ./.github/actions/setup-python-env

      # Read-only corpus access (OIDC role; no static keys — a compromised
      # evaluate runner cannot write or delete corpus objects). No pull: corpus
      # bytes move only as the KBs each ranged lookup touches. The credentials
      # are scoped to the sidecar action's own steps — the agent steps below
      # inherit none; they reach the corpus through the localhost sidecar via
      # the `service` backend, and the deterministic provisioning steps take
      # the credentials from this action's outputs as step-scoped env.
      - uses: ./.github/actions/corpus-sidecar
        id: corpus
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME_READONLY }}
          aws-region: ${{ vars.AWS_REGION }}
          corpus-remote-url: ${{ vars.CORPUS_REMOTE_URL }}
          # Corpus-split read side for the sidecar process itself: under the
          # split, `full` query bodies hydrate from the per-case content
          # store server-side, and the sidecar is the credentialed process —
          # without these the sidecar silently serves bodiless rows while
          # every other read stays green. Inert while the flag is off.
          casestore-url: ${{ vars.CASESTORE_URL }}
          corpus-split: ${{ vars.FEDCOURTS_CORPUS_SPLIT || '0' }}

      # Point-in-time snapshots are raw facts in the access-gated corpus, not git:
      # materialize this case's latest snapshot (a ranged point lookup, KB-scale)
      # to the gitignored record/ path the evaluator reads (never committed).
      # Best-effort — a missing snapshot must not abort the run; the agent notes
      # it per prompt.
      - name: Provision the case snapshot from the corpus
        continue-on-error: true
        env:
          COURT_ID: ${{ matrix.court }}
          DOCKET_ID: ${{ matrix.docket }}
          # Trusted repo code running before the agent: read-only credentials
          # ride this step's env only (from the sidecar action's outputs),
          # never the job env, so no agent step inherits them.
          AWS_ACCESS_KEY_ID: ${{ steps.corpus.outputs.aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.corpus.outputs.aws-secret-access-key }}
          AWS_SESSION_TOKEN: ${{ steps.corpus.outputs.aws-session-token }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          CORPUS_REMOTE_URL: ${{ vars.CORPUS_REMOTE_URL }}
          FEDCOURTS_CORPUS_BACKEND: ranged
          # Corpus-split read side: under FEDCOURTS_CORPUS_SPLIT=1 (the clean-slate
          # cutover switch; unset variable -> '0' -> off) provisioning defaults to
          # the per-case content store, which needs its URL. Inert while the flag
          # is off -- the corpus/ranged path is unchanged.
          FEDCOURTS_CASESTORE_URL: ${{ vars.CASESTORE_URL }}
          FEDCOURTS_CORPUS_SPLIT: ${{ vars.FEDCOURTS_CORPUS_SPLIT || '0' }}
        run: uv run fedcourts provision-snapshot --court "$COURT_ID" --docket "$DOCKET_ID"

      # A predictable event is a corpus fact, not a committed file. Project it into
      # the event's ledger directory so the evaluation PR carries its event.yaml and
      # the offline `validate` gate can confirm the judgment references a real event
      # without the corpus. Runs before the agent so a genuinely missing event fails
      # the job before any model tokens are spent.
      - name: Materialize the event definition for the ledger
        env:
          COURT_ID: ${{ matrix.court }}
          DOCKET_ID: ${{ matrix.docket }}
          EVENT_ID: ${{ matrix.event_id }}
          # Step-scoped read-only credentials, same rationale as the
          # provisioning step above.
          AWS_ACCESS_KEY_ID: ${{ steps.corpus.outputs.aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.corpus.outputs.aws-secret-access-key }}
          AWS_SESSION_TOKEN: ${{ steps.corpus.outputs.aws-session-token }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          CORPUS_REMOTE_URL: ${{ vars.CORPUS_REMOTE_URL }}
          FEDCOURTS_CORPUS_BACKEND: ranged
          # Corpus-split read side: under FEDCOURTS_CORPUS_SPLIT=1 (the clean-slate
          # cutover switch; unset variable -> '0' -> off) provisioning defaults to
          # the per-case content store, which needs its URL. Inert while the flag
          # is off -- the corpus/ranged path is unchanged.
          FEDCOURTS_CASESTORE_URL: ${{ vars.CASESTORE_URL }}
          FEDCOURTS_CORPUS_SPLIT: ${{ vars.FEDCOURTS_CORPUS_SPLIT || '0' }}
        run: uv run fedcourts materialize-event --court "$COURT_ID" --docket "$DOCKET_ID" --event "$EVENT_ID"

      # Blind grading: stage each predictor's latest prediction under an opaque
      # alias so the grade is formed without the candidate's identity in view
      # (docs/outcome-decomposition.md). The map that undoes the aliasing goes to
      # the runner temp dir, never the checkout the agent browses.
      - name: Stage the blinded candidates
        env:
          COURT_ID: ${{ matrix.court }}
          DOCKET_ID: ${{ matrix.docket }}
          EVENT_ID: ${{ matrix.event_id }}
          RUN_ID: ${{ matrix.run_id }}
        run: |
          set -euo pipefail
          uv run fedcourts provision-blinded-predictions \
            --court "$COURT_ID" --docket "$DOCKET_ID" --event "$EVENT_ID" \
            --run-id "$RUN_ID" --map-dir "$RUNNER_TEMP/blinding"

      # Tokenless HTTP sidecar for the cell's CourtListener MCP retrieval; the
      # composite carries the launch/health rationale (token in its launch
      # step env only; warn-only health so a degraded upstream never blocks
      # the cell, which runs on corpus tooling and provisioned inputs — the
      # prompt contract says so). Mirrors the corpus sidecar above.
      - uses: ./.github/actions/mcp-sidecar
        with:
          role: evaluator
          actor: ${{ matrix.evaluator_id }}
          courtlistener-api-token: ${{ secrets.COURTLISTENER_API_TOKEN }}

      # Configure the cell's MCP retrieval from the evaluator registry's
      # tool manifest (config/evaluators.yaml `mcp_servers:`) — evaluators get
      # the same retrieval as predictors so a judge can check a cited authority
      # rather than take it on faith. Same posture as run-predict: the tested
      # `mcp-config` command emits each engine's client format, and each
      # config names only the sidecar's localhost URL — no token (the
      # sidecar's launch step holds it; unset, CL tool calls error and the
      # cell degrades to corpus tooling rather than failing).
      - name: Configure agent retrieval (MCP)
        env:
          ENGINE: ${{ matrix.engine }}
          EVALUATOR_ID: ${{ matrix.evaluator_id }}
        run: |
          set -euo pipefail
          case "$ENGINE" in
            claude-code)
              uv run fedcourts mcp-config --engine claude-code \
                --role evaluator --actor "$EVALUATOR_ID" \
                --http-url courtlistener=http://127.0.0.1:8378/mcp > mcp-servers.json
              ;;
            codex)
              mkdir -p .codex
              uv run fedcourts mcp-config --engine codex \
                --role evaluator --actor "$EVALUATOR_ID" \
                --http-url courtlistener=http://127.0.0.1:8378/mcp > .codex/config.toml
              ;;
            gemini)
              # Written whole here (telemetry block included) so the install
              # step below stays a plain npm invocation with nothing to merge.
              # logPrompts:true so tool_call telemetry carries `function_args`,
              # populating retrieval_log.json's query slice (Claude/Codex already
              # capture args). The raw telemetry.log is gitignored and not
              # uploaded; this step and the Gemini agent step are both token-free
              # (the token lives in the MCP sidecar's launch step only), and the
              # CLI strips custom env from agent
              # shell commands except the non-secret identifiers allowlisted below,
              # so a captured arg is a query, not a secret. See run-predict.yml for
              # the fuller rationale.
              # security.environmentVariableRedaction.allowed: without it gemini's
              # strict-mode sanitizer (on whenever GITHUB_SHA is set) strips the
              # cell env contract, so `$COURT_ID` expands empty in the agent's
              # shell and it cannot resolve its own cell's paths — the same env
              # contract claude and codex get for free. Keys are `allowed` /
              # `blocked` / `enabled` under `security.environmentVariableRedaction`;
              # a wrong namespace is a silent no-op. Secrets can never be
              # allowlisted (the CLI hard-filters /TOKEN|SECRET|KEY|AUTH|.../i).
              mkdir -p .gemini
              # FEDCOURTS_CORPUS_BACKEND / FEDCOURTS_CORPUS_SERVICE_URL are the
              # corpus sidecar's cell contract: a backend name and a localhost
              # URL, non-secret by construction (and structurally so — the
              # names clear the CLI's credential-name refusal regex). This is
              # what gives this engine corpus retrieval parity: the sanitizer
              # could never allowlist AWS credentials, but it accepts these.
              printf '%s\n' '{"telemetry":{"enabled":true,"target":"local","outfile":".gemini/telemetry.log","logPrompts":true},"security":{"environmentVariableRedaction":{"allowed":["COURT_ID","DOCKET_ID","EVENT_ID","PREDICTOR_ID","EVALUATOR_ID","RUN_ID","MODEL_ID","DECIDED_BEFORE","FEDCOURTS_CORPUS_BACKEND","FEDCOURTS_CORPUS_SERVICE_URL"]}}}' > .gemini/settings.json
              uv run fedcourts mcp-config --engine gemini \
                --role evaluator --actor "$EVALUATOR_ID" \
                --base-settings .gemini/settings.json \
                --http-url courtlistener=http://127.0.0.1:8378/mcp > .gemini/settings.json.new
              mv .gemini/settings.json.new .gemini/settings.json
              ;;
          esac

      # The regression tripwire for the whole sidecar design: the agent steps
      # below must inherit no cloud credential from the job env. The sidecar
      # action keeps the assumed role's credentials out of $GITHUB_ENV
      # (step outputs only); this proves it stays that way.
      - name: Assert the agent env is credential-free
        run: |
          set -euo pipefail
          # Any AWS_* variable except the region names is treated as
          # credential-conferring (static keys, session tokens, and the
          # role-ARN/web-identity pair alike).
          if env | grep -E '^AWS_' | grep -qvE '^AWS_(REGION|DEFAULT_REGION)='; then
            echo "::error::AWS credential variables leaked into the job env"
            exit 1
          fi
          echo "agent env is credential-free"

      # Two surfaces the agent must not read, both taken out of its working tree
      # rather than left to instruction alone. Deliberate access through git
      # history stays covered by the prompt prohibition and the logged-tool-call
      # audit. Neither the deletion nor the move can propagate to the run PR:
      # the collect job unions each cell's data/ onto a freshly fetched clean
      # origin/main checkout, and `assert-paths` rejects any non-addition.
      #
      # 1. data/qp-topics membership encodes cert outcomes (docs/qp-topic.md),
      #    so the prompts forbid cells from reading it.
      # 2. The committed predictions/ and evaluations/ trees name every
      #    predictor, one directory above the aliased staging area the judge is
      #    sent to read — so a routine `ls` de-blinds the cell before it has
      #    read the contract that forbids that tree. The judge grades from
      #    record/blinded and needs neither tree. Runs after the staging step
      #    above, which reads the committed predictions to build the candidates;
      #    the trees come back the moment the agent stops.
      - name: Remove the de-blinding surfaces from the agent's tree
        run: |
          set -euo pipefail
          rm -rf data/qp-topics
          uv run fedcourts hide-cell-record --stash-dir "$RUNNER_TEMP/hidden-record"

      - name: Evaluate with Claude Code
        id: evaluate_claude
        if: matrix.engine == 'claude-code'
        # Bound the agent below the job timeout so a runaway run trips this *step*
        # (leaving the finalize step to salvage its work) instead of the job-level
        # timeout, which would cancel the runner and discard everything.
        timeout-minutes: 50
        uses: anthropics/claude-code-action@a874e9ecd7bb36efdad65429c6b35815f5a08f10 # v1.0.210
        env:
          COURT_ID: ${{ matrix.court }}
          DOCKET_ID: ${{ matrix.docket }}
          EVENT_ID: ${{ matrix.event_id }}
          EVALUATOR_ID: ${{ matrix.evaluator_id }}
          RUN_ID: ${{ matrix.run_id }}
          MODEL_ID: ${{ matrix.model }}
          # Corpus queries go through the localhost sidecar (the URL arrived
          # job-wide from its launch step): the identical `fedcourts query`
          # surface, no cloud credential in this shell.
          FEDCOURTS_CORPUS_BACKEND: service
        with:
          # claude-code-action runs its own actor check and refuses a bot by
          # default. This workflow's rounds are unattended, so their actor is not
          # a requester at all — it is whatever GitHub attributes the cron to,
          # which on a repo whose deterministic writers push to the default
          # branch can be the pipeline App's own login. Allow exactly that one
          # login (never `*`) so a round cannot die on an attribution it does not
          # control; what gates the spend is the `review` hold, not this setting.
          allowed_bots: "fedcourtsai-data[bot]"
          # Auth is the Anthropic API key (pay-per-token): automated pipeline
          # inference is API-metered by design (see docs/budget.md), and per
          # Anthropic policy the Max subscription OAuth token is for interactive
          # Claude Code / claude.ai, not CI. For a local/interactive fallback,
          # swap this for `claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}`.
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ steps.agent-token.outputs.token }}
          # Prompt caching is automatic: the stable prefix (AGENTS.md + the
          # prompt template + schema) is cached across the run's tool-use turns.
          # The API key's default cache TTL is only 5 minutes, which would expire
          # mid-run, so ENABLE_PROMPT_CACHING_1H below pins the 1-hour TTL (and the
          # cache-read discount priced in fedcourtsai.pricing).
          settings: |
            {
              "env": {
                "ENABLE_PROMPT_CACHING_1H": "1"
              }
            }
          # The kickoff prompt is identical across the three engines and carries
          # the cell identifiers inline: some engines sanitize the shell
          # environment in CI (Gemini strips every custom env var except the
          # allowlisted cell contract), so the
          # prompt text — not the env — is the contract's delivery channel.
          prompt: |
            Read ${{ matrix.prompt }} and AGENTS.md, then score every predictor's
            prediction for this cell against its outcome.json:

            COURT_ID=${{ matrix.court }}
            DOCKET_ID=${{ matrix.docket }}
            EVENT_ID=${{ matrix.event_id }}
            EVALUATOR_ID=${{ matrix.evaluator_id }}
            RUN_ID=${{ matrix.run_id }}
            MODEL_ID=${{ matrix.model }}

            These values are authoritative; the same identifiers are exported as
            environment variables on engines that pass them through, but if
            `$COURT_ID` expands empty in your shell, use the literals above.
            Write only the output files the prompt contract names for your cell.
            Do not commit, push, or open a PR — the workflow handles git. You run
            headless with no interactive input; if you are blocked, record it in
            flags.json and explain it in evaluation.md, then finish — do not wait
            for a reply.
          # The model comes from the plan job's matrix (registry override or the
          # engine's predict/evaluate default in fedcourtsai.pricing) — repo
          # config, not user input.
          claude_args: |
            --model ${{ matrix.model }}
            --max-turns 120
            --permission-mode bypassPermissions
            --mcp-config mcp-servers.json

      # The codex step's own `timeout-minutes` is not enough on its own: a
      # wedged engine has held the step `in_progress` past it until the JOB cap
      # cancelled the runner, and a cancelled job runs none of the capture tail
      # below and has its logs dropped by GitHub — so the hang erases its own
      # evidence and spends the whole budget. The pinned action carries no
      # timeout input, so the bound is this runner-level watchdog: it captures
      # the runner's own state (shapes and metadata only — the bundle is
      # published), then kills the engine, which fails the STEP and leaves the
      # tail to salvage the cell. Same shape and rationale as the predict
      # cell's arm step, which carries them in full.
      - name: Arm the codex watchdog
        if: matrix.engine == 'codex'
        env:
          CODEX_HOME: ${{ github.workspace }}/.codex
          WATCHDOG_DIR: ${{ runner.temp }}/codex-watchdog
          # 40 minutes. The cell job is capped at 60 and reaches this step
          # inside its first minute (measured: +46s on a healthy cell), so
          # firing at +40 ends the engine ~41 minutes into the job and leaves
          # ~19 for the `if: !cancelled()` tail, which measures in single-digit
          # minutes. It also lands 10 minutes inside the step's own
          # `timeout-minutes: 50`, which stays as the backstop: a
          # process-level watchdog is a guess about which process to kill, and
          # the runner's own cap is not.
          WATCHDOG_DEADLINE_S: "2400"
        run: |
          set -euo pipefail
          mkdir -p "$WATCHDOG_DIR"
          # The watchdog and its evidence both live outside the workspace: that
          # tree belongs to the agent for the next 40 minutes, and bash reads a
          # script file as it executes it. The disarm step brings the bundle
          # back for the artifact.
          cp scripts/codex-watchdog.sh "$RUNNER_TEMP/codex-watchdog.sh"
          nohup bash "$RUNNER_TEMP/codex-watchdog.sh" \
            > "$WATCHDOG_DIR/watchdog.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/codex-watchdog.pid"

      - name: Evaluate with Codex
        id: evaluate_codex
        if: matrix.engine == 'codex'
        # Same buffer as the Claude step: trip this step, not the job, on overrun.
        # The watchdog armed above is the bound that actually bites a wedged
        # engine; this stays as the backstop for an overrun the runner can end.
        timeout-minutes: 50
        uses: openai/codex-action@86365089eb2b84e0a8fb0717b304f8bdcb13b20e # v1.12
        env:
          COURT_ID: ${{ matrix.court }}
          DOCKET_ID: ${{ matrix.docket }}
          EVENT_ID: ${{ matrix.event_id }}
          EVALUATOR_ID: ${{ matrix.evaluator_id }}
          RUN_ID: ${{ matrix.run_id }}
          MODEL_ID: ${{ matrix.model }}
          # Corpus queries go through the localhost sidecar (see the Claude
          # step): same surface, no cloud credential in this shell.
          FEDCOURTS_CORPUS_BACKEND: service
          # Pin the session log to a known dir so the usage-capture step can read it.
          CODEX_HOME: ${{ github.workspace }}/.codex
        with:
          # As with the Claude step: let a round GitHub attributes to the
          # pipeline App's login (`fedcourtsai-data[bot]`) past codex-action's
          # write-access check, which a bot installation fails.
          allow-bot-users: "fedcourtsai-data[bot]"
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          # The same kickoff prompt as the Claude and Gemini steps (identifiers
          # inline — the engines' methodology stays comparable, and the contract
          # never depends on env passthrough); the agent reads the template
          # itself, as the other engines do.
          prompt: |
            Read ${{ matrix.prompt }} and AGENTS.md, then score every predictor's
            prediction for this cell against its outcome.json:

            COURT_ID=${{ matrix.court }}
            DOCKET_ID=${{ matrix.docket }}
            EVENT_ID=${{ matrix.event_id }}
            EVALUATOR_ID=${{ matrix.evaluator_id }}
            RUN_ID=${{ matrix.run_id }}
            MODEL_ID=${{ matrix.model }}

            These values are authoritative; the same identifiers are exported as
            environment variables on engines that pass them through, but if
            `$COURT_ID` expands empty in your shell, use the literals above.
            Write only the output files the prompt contract names for your cell.
            Do not commit, push, or open a PR — the workflow handles git. You run
            headless with no interactive input; if you are blocked, record it in
            flags.json and explain it in evaluation.md, then finish — do not wait
            for a reply.
          model: ${{ matrix.model }}
          effort: high
          safety-strategy: drop-sudo
          # Workspace writes plus subprocess network for spawned commands (the
          # localhost corpus service) through the `fedcourts-cell` permission
          # profile in the emitted `$CODEX_HOME/config.toml`, live web search to
          # match the other engines' reach, and a pinned CLI — the same grants
          # and rationale as the predict cell's codex step, which carries them
          # in full.
          permission-profile: fedcourts-cell
          codex-version: "0.144.1"
          codex-args: '["-c","web_search=live"]'

      # Stand the watchdog down the moment the engine step is over, however it
      # ended, so it can never fire late and kill something in the tail.
      # `always()` and not the arm step's gate: a failed cell must disarm too,
      # and where the arm step never ran there is simply no pid file to read.
      - name: Disarm the codex watchdog
        if: ${{ always() && matrix.engine == 'codex' }}
        env:
          COURT_ID: ${{ matrix.court }}
          DOCKET_ID: ${{ matrix.docket }}
          EVENT_ID: ${{ matrix.event_id }}
          CODEX_HOME: ${{ github.workspace }}/.codex
        run: |
          set -euo pipefail
          # The pid file sits on the runner's temp path, which the agent could
          # also write, so signal only a pid that is a number and is this
          # script's own watchdog — never whatever the file happens to name.
          pid_file="$RUNNER_TEMP/codex-watchdog.pid"
          if [ -f "$pid_file" ]; then
            pid=$(cat "$pid_file")
            if [[ "$pid" =~ ^[0-9]+$ ]] && grep -qa codex-watchdog.sh "/proc/$pid/cmdline" 2>/dev/null; then
              kill "$pid" 2>/dev/null || true
            fi
            rm -f "$pid_file"
          fi
          # Bring the bundle into the workspace, which is what the cell
          # artifact uploads. Regular files only: `upload-artifact` follows
          # symlinks, so copying the directory wholesale would let a planted
          # link publish an unrelated readable file.
          if [ -d "$RUNNER_TEMP/codex-watchdog" ]; then
            rm -rf codex-watchdog
            mkdir -p codex-watchdog
            find "$RUNNER_TEMP/codex-watchdog" -maxdepth 1 -type f \
              -exec cp -p {} codex-watchdog/ \;
          fi
          # The rollout itself never leaves the runner — it carries retrieved
          # documents verbatim, and a cell artifact is downloadable by anyone
          # with a GitHub account for its retention window. Its distilled item
          # shapes say what the engine was doing without republishing what it
          # read, so they are what a deadline that passed hands the bundle.
          if [ -f codex-watchdog/FIRED ] || [ -f codex-watchdog/STOOD_DOWN ]; then
            uv run fedcourts codex-item-shapes \
              --sessions-dir "$CODEX_HOME/sessions" \
              --out codex-watchdog/session-shapes.json \
              || echo "::warning::no codex item shapes distilled for ${EVENT_ID}"
          fi
          # A watchdog that reached its deadline is a cell-level fact whichever
          # way it went, so say it where the run is read; the bundle itself
          # rides the cell artifact uploaded below. The marker is truncated on
          # the way into the summary — the bundle directory is runner-writable,
          # and a summary is rendered markdown.
          for marker in FIRED STOOD_DOWN; do
            [ -f "codex-watchdog/$marker" ] || continue
            case "$marker" in
              FIRED) note="the engine was killed at its deadline" ;;
              *) note="the deadline passed with no engine process matched — check the watchdog still names the action's invocation" ;;
            esac
            echo "::warning::codex watchdog (${COURT_ID}/${DOCKET_ID} ${EVENT_ID}): ${note}"
            {
              echo "## codex watchdog — ${COURT_ID}/${DOCKET_ID} ${EVENT_ID}"
              echo "${note}; diagnostics ride in this cell's artifact under \`codex-watchdog/\`."
              echo '```'
              head -c 500 "codex-watchdog/$marker"
              echo
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          done

      # Install the Gemini CLI in its own SECRET-FREE step: only the top-level
      # version is exactly pinned (transitive dependencies resolve fresh at every
      # install), so npm lifecycle scripts must never see credentials —
      # --ignore-scripts skips them outright (verified: the CLI needs none) and
      # this step's env carries nothing. The workspace settings file is written
      # here too; its telemetry log feeds the usage-capture step.
      - name: Install the Gemini CLI
        if: matrix.engine == 'gemini'
        # zizmor: ignore[adhoc-packages] — top-level exact-version pin, scripts
        # disabled, and a secret-free environment are the practical controls for
        # a single global CLI; a lockfile is not expressible for `npm i -g`.
        run: |
          set -euo pipefail
          npm install --silent --no-audit --ignore-scripts --global @google/gemini-cli@0.49.0
          gemini --version
          # .gemini/settings.json (telemetry + mcpServers) is written by the
          # "Configure agent retrieval" step above: it needs the CourtListener token in
          # its env, and this npm step must stay secret-free.

      # Gemini runs through its CLI directly, not the upstream run-gemini-cli
      # action: that action internally `uses:` unpinned actions
      # (google-github-actions/auth@v3, actions/upload-artifact@v6), which the
      # org's require-SHA-pinning policy rejects at job setup — and because
      # action resolution happens before `if:` gating, its mere presence failed
      # every cell in the job, claude and codex included. The CLI invocation
      # reproduces what the action ran: an exact-version npm install, env-var
      # auth, the same workspace settings file (telemetry preserved for the
      # usage-capture step), and the same headless `--yolo` prompt call.
      - name: Evaluate with Gemini
        id: evaluate_gemini
        if: matrix.engine == 'gemini'
        # Same buffer as the Claude step: trip this step, not the job, on overrun.
        timeout-minutes: 50
        env:
          COURT_ID: ${{ matrix.court }}
          DOCKET_ID: ${{ matrix.docket }}
          EVENT_ID: ${{ matrix.event_id }}
          EVALUATOR_ID: ${{ matrix.evaluator_id }}
          RUN_ID: ${{ matrix.run_id }}
          MODEL_ID: ${{ matrix.model }}
          # Corpus queries go through the localhost sidecar (see the Claude
          # step). For this engine that is the parity fix, not just posture:
          # its sanitizer could never allowlist AWS credentials, so ranged
          # queries were impossible — a backend name and a localhost URL are
          # allowlistable (both named in the settings written above).
          FEDCOURTS_CORPUS_BACKEND: service
          # No GITHUB_TOKEN here: it is simply absent from this step's env, so a
          # comment token could never be used — flags.json is this engine's
          # blocked-channel. Belt and braces: a token could not reach the agent's
          # shell even if it were here, because the CLI hard-filters
          # /TOKEN|SECRET|KEY|AUTH|.../i out of the settings allowlist itself, and
          # unlisted vars are stripped under strict mode (on whenever GITHUB_SHA
          # is set). Re-check on a CLI version bump.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Headless runs need the workspace trusted explicitly (the CLI exits 55
          # otherwise); the runner workspace is a fresh clone of this repo.
          GEMINI_CLI_TRUST_WORKSPACE: "true"
          # The same kickoff prompt as the Claude and Codex steps. The inline
          # identifiers stay authoritative and are the belt-and-braces channel;
          # the env vars above now also reach the agent's shell, because the
          # settings step allowlists the cell contract past the CLI's strict-mode
          # sanitizer (a harness run with no .gemini/settings.json still has only
          # the inline channel).
          PROMPT: |
            Read ${{ matrix.prompt }} and AGENTS.md, then score every predictor's
            prediction for this cell against its outcome.json:

            COURT_ID=${{ matrix.court }}
            DOCKET_ID=${{ matrix.docket }}
            EVENT_ID=${{ matrix.event_id }}
            EVALUATOR_ID=${{ matrix.evaluator_id }}
            RUN_ID=${{ matrix.run_id }}
            MODEL_ID=${{ matrix.model }}

            These values are authoritative; the same identifiers are exported as
            environment variables on engines that pass them through, but if
            `$COURT_ID` expands empty in your shell, use the literals above.
            Write only the output files the prompt contract names for your cell.
            Do not commit, push, or open a PR — the workflow handles git. You run
            headless with no interactive input; if you are blocked, record it in
            flags.json and explain it in evaluation.md, then finish — do not wait
            for a reply.
        run: |
          set -euo pipefail
          gemini --yolo --model "$MODEL_ID" --prompt "$PROMPT" --output-format json

      # Put the hidden predictions/evaluations trees back the moment the agent
      # stops — first of the post-agent steps, so the workspace is whole for all
      # of them and the invariant is one line rather than a per-consumer audit.
      # Two of them need it for more than tidiness: the usage and retrieval
      # capture *write into* evaluations/<evaluator>/, i.e. into a hidden tree's
      # own path, so capturing first would manufacture the collisions the
      # restore refuses. The rest read the committed trees — the un-aliasing,
      # the stamp's prediction join, and `validate`'s evaluation-target check.
      # It restores file by file and refuses to overwrite, because the agent
      # writes its own evaluations/ output where a hidden tree stood.
      # `!cancelled()` on the same terms as the un-aliasing step below: a failed
      # or timed-out agent still has its cell recorded, and that recording reads
      # the committed trees — and deliberately no `success()` gate on the hide
      # step, since a skipped restore behind a green-looking job is the failure
      # this exists to prevent; where the hide never ran this fails loudly
      # behind an already-failed cell, which is the cheaper side.
      # No failure here can lose committed data: the collect job unions each
      # cell's data/ onto a freshly fetched clean origin/main checkout with
      # `cp -a` and never syncs, and `assert-paths` rejects any non-addition —
      # so a tree missing from a cell's artifact is a no-op, never a deletion.
      - name: Restore the committed cell record
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          uv run fedcourts restore-cell-record --stash-dir "$RUNNER_TEMP/hidden-record"

      # Record measured token usage + estimated cost next to the evaluation so a
      # maintainer can sum it into a real $/run (docs/budget.md). Best-effort: the
      # engine logs are read here, never the agent's word, and a miss must not
      # fail the evaluation — hence continue-on-error.
      # The explicit `!cancelled()` is what keeps the agent-conclusion test the
      # *only* gate: without it GitHub ANDs an implicit success(), and a failed
      # restore above would silently drop the usage record of a cell that had
      # already spent its whole agent budget. A skipped agent step's conclusion
      # is `skipped`, so the broadened guard still cannot fire on a cell whose
      # engine never ran. Same shape as the retrieval capture below.
      - name: Capture model usage
        if: ${{ !cancelled() && (steps.evaluate_claude.conclusion == 'success' || steps.evaluate_codex.conclusion == 'success' || steps.evaluate_gemini.conclusion == 'success') }}
        continue-on-error: true
        env:
          COURT_ID: ${{ matrix.court }}
          DOCKET_ID: ${{ matrix.docket }}
          EVENT_ID: ${{ matrix.event_id }}
          EVALUATOR_ID: ${{ matrix.evaluator_id }}
          RUN_ID: ${{ matrix.run_id }}
          ENGINE: ${{ matrix.engine }}
          MODEL: ${{ matrix.model }}
          CLAUDE_EXECUTION_FILE: ${{ steps.evaluate_claude.outputs.execution_file }}
          CODEX_HOME: ${{ github.workspace }}/.codex
          GEMINI_TELEMETRY_FILE: ${{ github.workspace }}/.gemini/telemetry.log
        run: |
          args=(record-usage
            --court "$COURT_ID" --docket "$DOCKET_ID" --event "$EVENT_ID"
            --run-id "$RUN_ID" --engine "$ENGINE"
            --role evaluator --actor "$EVALUATOR_ID")
          if [ -n "$MODEL" ]; then args+=(--model "$MODEL"); fi
          if [ "$ENGINE" = "claude-code" ]; then
            args+=(--claude-execution-file "$CLAUDE_EXECUTION_FILE")
          elif [ "$ENGINE" = "gemini" ]; then
            args+=(--gemini-telemetry-file "$GEMINI_TELEMETRY_FILE")
          else
            args+=(--codex-sessions-dir "$CODEX_HOME/sessions")
          fi
          # Surface the measured tokens + estimated $ in the Actions UI. The
          # command already prints `usage: <actor> <N> tok ~$<cost> -> <path>`; keep
          # all but the path. A miss just warns (best-effort, like the step itself).
          if out=$(uv run fedcourts "${args[@]}"); then
            echo "$out"
            {
              echo "## evaluate usage — ${COURT_ID}/${DOCKET_ID} ${EVENT_ID} (${ENGINE})"
              echo "${out%% -> *}"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::no model usage captured for ${EVENT_ID}"
          fi

      # Harvest the cell's tool-call transcript to retrieval_log.json —
      # from the engine's own log, never the agent's word — the same posture as
      # run-predict. Runs even when the agent failed (a partial transcript is
      # still evidence); best-effort, so a parse miss warns rather than fails.
      - name: Capture retrieval log
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          COURT_ID: ${{ matrix.court }}
          DOCKET_ID: ${{ matrix.docket }}
          EVENT_ID: ${{ matrix.event_id }}
          EVALUATOR_ID: ${{ matrix.evaluator_id }}
          RUN_ID: ${{ matrix.run_id }}
          ENGINE: ${{ matrix.engine }}
          CLAUDE_EXECUTION_FILE: ${{ steps.evaluate_claude.outputs.execution_file }}
          CODEX_HOME: ${{ github.workspace }}/.codex
          GEMINI_TELEMETRY_FILE: ${{ github.workspace }}/.gemini/telemetry.log
        run: |
          set -euo pipefail
          args=(record-retrieval
            --court "$COURT_ID" --docket "$DOCKET_ID" --event "$EVENT_ID"
            --run-id "$RUN_ID" --engine "$ENGINE"
            --role evaluator --actor "$EVALUATOR_ID")
          if [ "$ENGINE" = "claude-code" ] && [ -n "$CLAUDE_EXECUTION_FILE" ]; then
            args+=(--claude-execution-file "$CLAUDE_EXECUTION_FILE")
          elif [ "$ENGINE" = "gemini" ]; then
            args+=(--gemini-telemetry-file "$GEMINI_TELEMETRY_FILE")
          elif [ "$ENGINE" = "codex" ]; then
            args+=(--codex-sessions-dir "$CODEX_HOME/sessions")
          fi
          uv run fedcourts "${args[@]}" \
            || echo "::warning::no retrieval log captured for ${EVENT_ID}"

      # Un-alias between the retrieval capture and the stamp — both edges matter.
      # After the capture, because the un-aliasing also resolves aliases inside
      # this cell's retrieval_log.json, which the capture step writes; run first
      # and alias strings would ship in the log. Before the stamp, because
      # `stamp-cell --role evaluator` joins each evaluation to the prediction it
      # scored on `predictor_id`, and under an alias that join misses: it drops
      # claim_scores silently, while a `risk_set` base rate left with no
      # salience version fails the stamp step itself. `validate` in
      # "Record cell status" is the backstop for the silent half.
      # No success() guard on the provisioning step by design: gating this on
      # step 1 would let a skipped un-aliasing pass quietly, which is the
      # failure this whole design exists to prevent. When step 1 never ran
      # there is no map and this fails loudly behind an already-failed cell.
      # Not continue-on-error: the rename is deterministic over a map this same
      # job wrote, and a silent skip is the failure this design exists to prevent.
      - name: Un-alias the blinded evaluations
        if: ${{ !cancelled() }}
        env:
          COURT_ID: ${{ matrix.court }}
          DOCKET_ID: ${{ matrix.docket }}
          EVENT_ID: ${{ matrix.event_id }}
          EVALUATOR_ID: ${{ matrix.evaluator_id }}
          RUN_ID: ${{ matrix.run_id }}
        run: |
          set -euo pipefail
          uv run fedcourts unblind-evaluations \
            --court "$COURT_ID" --docket "$DOCKET_ID" --event "$EVENT_ID" \
            --evaluator "$EVALUATOR_ID" --run-id "$RUN_ID" \
            --map-dir "$RUNNER_TEMP/blinding"

      # Stamp every evaluation.json this cell wrote with the evaluator's process
      # version (see the predict workflow's step for the rationale). One evaluate
      # cell scores every predictor, so `stamp-cell --role evaluator` stamps all
      # of this evaluator+event+run's evaluation.json files. Runs before "Record
      # cell status" (validate); not continue-on-error — stamping is deterministic.
      - name: Stamp the process version
        if: ${{ !cancelled() }}
        env:
          COURT_ID: ${{ matrix.court }}
          DOCKET_ID: ${{ matrix.docket }}
          EVENT_ID: ${{ matrix.event_id }}
          EVALUATOR_ID: ${{ matrix.evaluator_id }}
          RUN_ID: ${{ matrix.run_id }}
        run: |
          set -euo pipefail
          uv run fedcourts stamp-cell \
            --court "$COURT_ID" --docket "$DOCKET_ID" --event "$EVENT_ID" \
            --run-id "$RUN_ID" --role evaluator --actor "$EVALUATOR_ID"

      # Finalize even when the agent step failed or timed out (`!cancelled()`), so a
      # run stopped by max-turns or the step timeout still hands its partial output
      # to a maintainer instead of vanishing with the runner.
      # The cell no longer opens a PR. Even when the agent failed or timed out
      # (`!cancelled()`), record what it produced and hand its output to the
      # collect job; that job aggregates the whole run into one PR. The decisions
      # (produced? validated?) use the same tested commands the old finalize step
      # did — this step only records them into a status file the collect job reads.
      - name: Record cell status
        if: ${{ !cancelled() }}
        env:
          COURT_ID: ${{ matrix.court }}
          DOCKET_ID: ${{ matrix.docket }}
          EVENT_ID: ${{ matrix.event_id }}
          EVALUATOR_ID: ${{ matrix.evaluator_id }}
          RUN_ID: ${{ matrix.run_id }}
          # Did the agent finish cleanly? On max-turns or a step timeout the engine
          # step fails; its partial output still rides to the collect job, which
          # routes it to a draft PR a maintainer completes — never the ready one.
          AGENT_OK: ${{ (matrix.engine == 'claude-code' && steps.evaluate_claude.outcome == 'success') || (matrix.engine == 'codex' && steps.evaluate_codex.outcome == 'success') || (matrix.engine == 'gemini' && steps.evaluate_gemini.outcome == 'success') }}
        run: |
          set -euo pipefail
          # The event.yaml is materialized before the agent runs, so a staged change
          # is not proof of an evaluation. `finalize-produced` checks for this
          # evaluator's own evaluation.json; only a produced cell is validated, and
          # the collect job commits only produced cells (a no-output cell is warned).
          produced=$(uv run fedcourts finalize-produced --role evaluate \
            --court "$COURT_ID" --docket "$DOCKET_ID" --event "$EVENT_ID" \
            --actor "$EVALUATOR_ID" --run-id "$RUN_ID")
          validated=false
          if [ "$produced" = "true" ] && uv run fedcourts validate data; then
            validated=true
          fi
          jq -n \
            --arg court "$COURT_ID" --argjson docket "$DOCKET_ID" \
            --arg event_id "$EVENT_ID" --arg actor "$EVALUATOR_ID" --arg run_id "$RUN_ID" \
            --argjson produced "$produced" --argjson validated "$validated" \
            --argjson agent_ok "$AGENT_OK" \
            '{court:$court,docket:$docket,event_id:$event_id,actor:$actor,run_id:$run_id,produced:$produced,validated:$validated,agent_ok:$agent_ok}' \
            > status.json

      # One artifact per cell: its status.json plus its data/ subtree, and — on a
      # codex cell — the watchdog's directory, which carries its own log always
      # and the diagnostics bundle when it fired — shapes and metadata only,
      # because a cell artifact is downloadable by anyone with a GitHub account
      # for its retention window. The collect job copies only `data/` into the
      # run's commit, so the bundle never reaches the ledger. The name is
      # unique per evaluator x case x event so concurrent cells never collide, and
      # the collect job keys the download on the `evaluate-` prefix.
      - name: Upload cell output
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: evaluate-${{ matrix.evaluator_id }}-${{ matrix.court }}-${{ matrix.docket }}-${{ matrix.event_id }}
          path: |
            status.json
            data
            codex-watchdog
          if-no-files-found: error
          retention-days: 7

      # The sidecars' logs carry their startup lines and per-request records
      # (server noise, no secrets — GitHub masks the credentials regardless):
      # surface them in the job log so a mid-run sidecar death or a failed
      # lookup is diagnosable without re-running the cell.
      - name: Show the sidecar logs
        if: ${{ always() }}
        continue-on-error: true
        run: |
          set -euo pipefail
          # Indent every replayed line: the logs are agent-adjacent bytes, and
          # a line starting with ::<command>:: would otherwise be parsed as a
          # workflow command by the runner.
          for log in corpus-sidecar.log cl-mcp-sidecar.log; do
            if [ -f "$log" ]; then
              echo "--- $log"
              tail -n 100 "$log" | sed 's/^/  /'
            fi
          done

  collect:
    # Defence in depth only. Both attempts of a re-run share `run_id`, so this
    # groups them — but GitHub refuses to re-run a run that is still in
    # progress, and the workflow-level group already serializes every round.
    # Note the run PR's branch is keyed on the *plan-time* run id from the
    # cells' status.json, not `github.run_id`, so this group does not itself
    # guard the branch; it is cheap insurance behind those two, not the thing
    # that prevents a force-push clobber.
    concurrency:
      group: collect-${{ github.workflow }}-${{ github.run_id }}
      cancel-in-progress: false
    needs: [plan, approval, evaluate]
    # Run after the whole fan-out even if some cells failed, as long as the plan
    # queued jobs AND the hold released. Without the approval clause, always()
    # would fire this writer on a rejected hold (evaluate merely skipped) and
    # spin up the collect machinery over a run that spent nothing. This is the
    # only writer: it unions the cells' artifacts into one
    # PR per run (auto-merged when green) plus, if any cell left salvageable
    # partial output, one draft PR a maintainer finishes.
    if: ${{ always() && needs.plan.outputs.has_jobs == 'true' && needs.approval.result == 'success' }}
    runs-on: ubuntu-latest
    # The collect action downloads cell artifacts per artifact with bounded
    # parallelism (4 workers; each download is its own degradation boundary —
    # see the download step's comment), with up to 3 attempts and backoff per
    # artifact. A clean full-width pass (102 cells — three actors over a
    # 34-event trigger — at 5-10s per download) spends 3-5 minutes before
    # aggregation begins, an all-retry pass approaches 20, and the
    # aggregation after it was still running at 30 minutes on the first
    # post-freeze full-width run with every cell green. The cap's ceiling is
    # the App token's one-hour life, minted at job start and spent at the
    # very end — the push, the PR, the auto-merge — so a job outliving the
    # hour trades a clean timeout-cancel for a 401 mid-push; 50 buys the
    # measured aggregation while keeping the credentialed tail inside the
    # hour. A cap kill either side of the push — mid-aggregation, or after a
    # push and before its PR — costs a maintainer round trip while the
    # artifacts live (rerunning collect is the documented idempotent
    # recovery). If 50 proves short, the durable fixes are re-minting the
    # token between download and aggregation, or scoping the per-kind
    # validate to the run's changed paths — not a bigger number.
    timeout-minutes: 50
    environment: prod
    permissions:
      contents: write # commit the run's evaluations to a branch
      pull-requests: write # open the run PR and enable auto-merge
      issues: write # GITHUB_TOKEN posts flags to the agent-feedback issue (not the App token)
      actions: read # fetch this run's cell artifacts (repo-wide read; collect runs no agent code)
    steps:
      # The collect job opens the PR with the dev App token. The dev App is *not* a
      # branch-protection bypass actor (see docs/security.md), so its auto-merge is
      # bound by the required `gate` + `paths` checks rather than skipping them.
      - name: Mint app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.DEV_APP_CLIENT_ID }}
          private-key: ${{ secrets.DEV_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: ./.github/actions/setup-python-env

      - name: Configure git identity
        uses: ./.github/actions/configure-git-identity
        with:
          token: ${{ steps.app-token.outputs.token }}
          app-slug: ${{ steps.app-token.outputs.app-slug }}

      - name: Collect the run into one PR
        uses: ./.github/actions/collect-run
        with:
          role: evaluate
          token: ${{ steps.app-token.outputs.token }}
          repo: ${{ github.repository }}
          issue: ${{ github.event.issue.number }}
          matrix: ${{ needs.plan.outputs.matrix }}
          github-token: ${{ github.token }}
          courtlistener-token: ${{ secrets.COURTLISTENER_API_TOKEN }}

      - name: Flag a stalled run
        # A run that produced no output opens no PR, so nothing would close — or
        # even mention — the trigger issue; it would sit silently orphaned open.
        # Post the tested stall comment (rendered by the aggregate step) with the
        # ambient GITHUB_TOKEN: commenting triggers nothing, so the contents-write
        # App token stays out of it. Runs even if the aggregate step failed; the
        # file is absent whenever the run produced output.
        # A round with no trigger issue has nothing to orphan, but the stall
        # itself still has to be visible, so the report falls back to the step
        # summary rather than being skipped — a silent stall is exactly what this
        # step exists to stop. Every round takes that branch: no lane in this
        # repository has an issue trigger, so the issue number is always empty.
        # The issue arm is kept because `collect-run`'s contract still admits an
        # issue number and this job is held structurally identical to
        # run-predict's — not because a round here can supply one.
        if: ${{ always() }}
        # Two retried gh calls inside the deduped issue-comment command,
        # each worth up to 105s against a degraded API — bounded per step so a
        # degraded API at one report cannot spend the collect job's cap that
        # the later always()-gated report steps still need.
        timeout-minutes: 5
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          [ -s stall-comment.md ] || exit 0
          if [ -z "$ISSUE" ]; then
            # No issue to comment on, so the run's own summary is the report.
            # The rendered comment reads correctly there: it addresses the round
            # rather than a request, and its retry line is the lane's next
            # derivation, which needs nothing filed.
            {
              echo '## stalled run'
              echo ''
              cat stall-comment.md
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Marker-deduped: this step reruns whenever collect does, and rerunning
          # collect is the documented recovery for a transfer failure, so a plain
          # comment would stack a copy per attempt and bury the warning.
          uv run fedcourts post-issue-comment --issue "$ISSUE" --repo "$REPO" \
            --marker "<!-- collect-stall: ${GITHUB_RUN_ID} -->" \
            --body-file stall-comment.md

      - name: Flag a secret-scan hit
        # A withheld branch opens no PR, so without this the scan hit would be
        # visible only in the Actions log. Same ambient-token posture as the
        # stall step above; the file is absent whenever the scan came back
        # clean.
        # Falls back to the step summary on an issue-less round, like the stall
        # step — with more at stake: a security report that is skipped because
        # the round had no issue is a security report deduped into silence.
        if: ${{ always() }}
        # Same bound as the stall step above, for the same reason.
        timeout-minutes: 5
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          [ -s secret-scan-issue.md ] || exit 0
          if [ -z "$ISSUE" ]; then
            {
              echo '## secret-scan hit (branch withheld)'
              cat secret-scan-issue.md
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Marker-deduped: this step reruns whenever collect does, and rerunning
          # collect is the documented recovery for a transfer failure, so a plain
          # comment would stack a copy per attempt and bury the warning.
          #
          # Keyed on the report's *content*, not just the run, unlike the stall
          # comment above. A later attempt can collect a different artifact set
          # and so hit a different file; a run-only key would suppress that
          # second, distinct redacted report and the trigger issue would never
          # learn about it. A security report must never be deduped into silence.
          digest=$(sha256sum secret-scan-issue.md | cut -c1-16)
          uv run fedcourts post-issue-comment --issue "$ISSUE" --repo "$REPO" \
            --marker "<!-- collect-secret-scan: ${GITHUB_RUN_ID}-${digest} -->" \
            --body-file secret-scan-issue.md

      - name: Latch run flags onto the agent-feedback issue
        # Post with the ambient GITHUB_TOKEN (job-scoped `issues: write`), NOT the dev
        # App token: latching needs no cross-workflow trigger (`agent-feedback` is a
        # non-triggering label), so issue-write stays off this job's contents-write
        # token. The find-or-create and once-only idempotency are the tested
        # `post-agent-feedback` command (agent_feedback.py); this only invokes it.
        # The file is empty/absent when the run raised no flags — and also when
        # the aggregate step aborted mid-loop or the run's secret scan did not
        # pass, since the roll-up is written (scanned) at that step's end: the
        # latch is best-effort, deliberately fail-closed on agent free text.
        if: ${{ always() }}
        # Up to five retried gh calls behind the find-or-create (the label
        # ensure, the listing, the issue create on first use, the marker read,
        # the comment), each worth up to 105s against a degraded API — 525s
        # worst case, plus margin for the env spin-up.
        timeout-minutes: 12
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          [ -s feedback-comment.md ] || exit 0
          uv run fedcourts post-agent-feedback --repo "$REPO" --body-file feedback-comment.md
