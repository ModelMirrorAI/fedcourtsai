name: run-analytics

# The run list must tell a staging rehearsal from a production run of the
# same mode at a glance, or a rehearsal reads as production history. Both
# components are server-validated vocabulary: `mode` is a closed choice, and
# the environment half is the same branch resolution the jobs bind.
run-name: "run-analytics: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || (startsWith(github.event.schedule, '41 ') && 'metrics-refresh (schedule)' || startsWith(github.event.schedule, '59 ') && 'public-updates (schedule)' || startsWith(github.event.schedule, '8 ') && 'qp-topic-label (schedule)' || startsWith(github.event.schedule, '4 ') && 'qp-topic-label-applications (schedule)' || startsWith(github.event.schedule, '14 ') && 'alignment-side-code (schedule)' || 'big-cases (schedule)') }} @ ${{ github.ref_name == 'main' && 'prod' || github.ref_name }}"

# Corpus analysis & derived metrics. One surface for every task that reads the
# corpus and answers a question or refreshes a derived artifact, selected by
# `mode` (dispatch) or the weekly schedule:
#
#   - corpus-stats:    aggregate disposition base-rates over the packed corpus
#                      (`fedcourts stats`) — the "what's the grant rate for X"
#                      question. Reads the corpus read-only via a full pull.
#   - text-coverage:   enumerate document text coverage over the content store
#                      (`fedcourts corpus-info --text-coverage`) — which stored
#                      documents carry no text and which queued cases hold no
#                      primary document for their docket form, with the
#                      untruncated case-id
#                      ledgers the OCR pass and the document backfill work
#                      from. Read-only like corpus-stats, but much longer: the
#                      walk is a store round trip per live-slice case.
#   - metrics-refresh: regenerate the committed deterministic artifacts
#                      (leaderboard / claim scores / backtest / statpack / the
#                      docket pack / the big-case board, plus the scope
#                      manifest) and land any
#                      change as a **reviewed** PR — never a direct commit to
#                      main, never auto-merged. Also the weekly cron's job.
#   - big-cases:       regenerate the case-centric big-case board alone
#                      (`fedcourts big-cases`) — which cases the predictors think
#                      matter, and where they disagree — and land any change as an
#                      **unattended** PR. Reads `data/` only, like tool-usage, so
#                      it needs no corpus and no cloud credential; it is the daily
#                      cron's job, because a website renders this board off `main`
#                      and a weekly cadence would publish a stale one six days in
#                      seven. The unattended merge is argued at the job.
#   - public-updates:  add each missing week's public update to the site's
#                      running history under `metrics/updates/` (`fedcourts
#                      archive-public-updates`) and land it as an **unattended**
#                      PR. Reads `data/` only, like big-cases. It is the Monday
#                      cron's job, just after post-public-update drafts the
#                      week's email. The unattended merge is argued at the job.
#   - tool-usage:      roll the committed retrieval logs into an offered-vs-called
#                      report (`fedcourts tool-usage`) — which configured MCP
#                      tools cells actually call. Reads `data/` only, so unlike
#                      its siblings it needs no corpus and no credential at all.
#   - qp-topic-label:  run the `qp-topic-v0` topic labeler over the next batch
#                      of the questions-presented frame the pulled corpus
#                      carries (`docs/qp-topic.md`) and land the measured
#                      per-case labels file as a **reviewed** PR — never
#                      auto-merged. Also a weekly cron's job. The only mode that
#                      runs an agent, so it is split into jobs: `qp-topic-extract`
#                      holds the S3 role, produces the extract and prices the
#                      round; the round then waits on the `review` hold
#                      (`qp-topic-approval`, auto-released only within
#                      `config/review-hold.yaml`'s caps); `qp-topic-label` runs
#                      the agent with no cloud credential in the job env at all
#                      and records the run's spend whatever the gate decides;
#                      `qp-topic-publish` lands the labels with the spend record
#                      beside them, or the spend record alone for a run that
#                      published nothing. A scheduled run on a frame with nothing
#                      new to label stands down at the extract.
#   - qp-topic-label-applications: the same two jobs and publish job over the
#                      application frame under `qp-topic-v1` (`qp-corpus
#                      --frame applications`), measured against the application
#                      reference block and landed as its own labels file,
#                      `data/qp-topics/qp-topics-applications.json`. A mode value
#                      rather than a dispatch input, since the inputs are near
#                      the cap, with a weekly cron of its own. The
#                      `qp-topic-resolve` job reads the mode (or the cron) once,
#                      and its frame and labels-name outputs are the only places
#                      the two frames differ.
#   - qp-topic-replicate / qp-topic-replicate-applications: a reference-only
#                      replicate of the petition or application labeler
#                      (`docs/qp-topic.md`). Dispatch only, no cron. The same
#                      jobs, hold and spend ledger, with two differences the
#                      resolve job's `replicate` output carries: the extract is
#                      the frame's reference rows alone (`qp-corpus
#                      --reference-only`), and the measure step records the run
#                      (`qp-topics --replicate-out`) instead of writing a labels
#                      file, so the publish job lands the run's spend record
#                      alone, outcome `replicate`. The labeler reads the same
#                      prompt and is not told it is a replicate. Each dispatch is
#                      one replicate; `fedcourts qp-topic-replicates` pools them.
#   - alignment-side-code: the labeling lane's third frame, `alignment-sides`:
#                      the merits side coder (`docs/merits-alignment-baseline.md`,
#                      `.github/prompts/alignment-side-code.md`) codes each
#                      uncoded merits grant's conservative side and score from
#                      its grant-time text (`fedcourts alignment-side-extract`).
#                      The same jobs, hold and spend ledger as the topic frames,
#                      with no reference gate: a run that codes every row is
#                      stamped into the append-only
#                      `data/merits-alignment/alignment-side-codes.json`
#                      (`fedcourts alignment-side-codes`) and lands as a
#                      reviewed PR on its own fixed branch. Each row's mode
#                      (replay or forward) crosses in a sidecar the coding job
#                      downloads only after its agent has exited. A weekly cron
#                      of its own, so a new grant is coded inside the clean
#                      check's lag.
#   - order-scan:      search CourtListener's RECAP index for district orders
#                      against federal executive action (`fedcourts
#                      order-scan`, `config/order-scan.yaml`) — the candidate
#                      generation the adverse-order pool is hand-coded from,
#                      with its recall against the traced immigration dockets.
#                      The one analysis mode that reads CourtListener rather
#                      than the corpus: it holds the CourtListener token and
#                      no cloud role, spends a capped slice of the account's
#                      REST budget, and leaves its report as a run artifact.
#   - decision-below:  dry-run the decision-below fill over the next 25 cases
#                      of its rotation (`fedcourts enrich-decision-below
#                      --max-cases 25`): what a writer window would store, and
#                      the match rate on the petitions the pipeline forecasts.
#                      It reads both the corpus (the rotation, via a full pull)
#                      and CourtListener (the read-only role and the token),
#                      writes nothing, buys nothing (no RECAP Fetch), and
#                      leaves its report as a run artifact.
#
# The read-only analysis modes (corpus-stats, text-coverage, tool-usage, order-scan, decision-below) write neither the
# corpus, `data/`, the corpus remote, nor git, open no PR, and file no issue — every
# result goes to the Actions step summary and the run log, and text-coverage's ledgers
# additionally to a run artifact, because a worklist has to outlive the summary page
# it is read beside — as do order-scan's and decision-below's reports. The five committing modes write only under their own
# paths — metrics-refresh under `metrics/` + `data/scope/`, big-cases under
# `metrics/big-cases.*`, public-updates under `metrics/updates/`, qp-topic-label
# under `data/qp-topics/` (the labels file and the run's spend record under
# `data/qp-topics/spend/`), alignment-side-code under `data/merits-alignment/`
# (its spend record in the same `data/qp-topics/spend/` ledger) — and land the change as a PR to `main`, reviewed
# except for the board's and the update history's (argued at those jobs).
# GitHub scopes permissions and tokens per **job**, so each mode runs as its own
# least-privilege job gated on `mode` and none is ever granted another's credential:
# corpus-stats, text-coverage and qp-topic-extract hold only the read-only S3
# role; decision-below holds that role and the CourtListener token, on its one
# measuring step; metrics-refresh holds that role *and* mints the dev App token (contents + PR
# write) for its review PR; qp-topic-label, big-cases and public-updates mint the
# same token but assume no role at all — the first because it is the one job here
# that runs an agent, the other two because they read nothing but the committed
# ledger; and
# tool-usage binds no environment and assumes no role, having no PR to open.
#
# Every environment-binding job resolves its environment from the dispatching
# branch — the resolution integration-test.yml states in full: `main` (and the
# schedule, which runs only there) binds `prod`; `staging` binds the staging
# environment, whose read-only-role trust and corpus variables point the same
# jobs at the staging corpus pair — each corpus job forwards the out-of-band
# index pointer off `main` for this, because the committed corpus pointer
# names the production blob, which the staging remote does not hold; any
# other branch resolves its own name, which names no configured environment
# and so binds no role variables and no keys — fail-closed. A staging-ref
# dispatch is therefore a **rehearsal**: it runs a mode as far as the staging
# pair's contents support — for the labeling mode that includes the extract's
# reference-coverage floor, which refuses a slice not carrying the reference
# texts before the labeler ever starts (and with it, via `needs`, the labeler
# job), itself a rehearsal observation — and never publication, which is a
# production act. The four publishing jobs fence their App-token mint,
# git-identity and review-PR steps to runs on the `main` branch ref exactly
# (`github.ref`, not `github.ref_name`, which a tag named `main` also
# satisfies — the prod deployment-branch policy is the real gate; the fence
# states the property without leaning on it), because the dev App's
# credentials live on the prod environment alone and a rehearsal must report
# that the fence held rather than fail a mint. A rehearsal states that
# boundary in the step summary instead of opening a PR. A new mode's first
# run belongs on a staging ref.
on:
  schedule:
    # Six crons, and every scheduled job gates on **which** one fired
    # (`github.event.schedule`): an `event_name == 'schedule'` gate is fail-open
    # on any cron it does not name, so a second entry would otherwise run the
    # weekly refresh daily. The mode-gated jobs stay skipped either way — a
    # schedule event carries no inputs — and the labeling lane reads its mode
    # off the cron through `qp-topic-resolve`.
    #
    # Weekly metrics refresh (Mon 05:41 UTC) — a quiet slot after run-pull's
    # 04:47 live window (40-minute cap) has committed and before its 06:47 live
    # window, so the refresh sees a settled corpus.
    - cron: "41 5 * * 1"
    # Daily big-case board (04:36 UTC). It reads the committed ledger and no
    # corpus, so it waits on no pull window; the slot is its own minute on the
    # repo's schedule grid, which keeps two workflows off one runner queue tick.
    - cron: "36 4 * * *"
    # Weekly update history (Mon 12:59 UTC), two minutes after
    # post-public-update drafts the week's email at 12:57, so both usually
    # render the same `main`; its own minute keeps the two off one runner
    # queue tick, and a dropped tick is caught up the next Monday.
    - cron: "59 12 * * 1"
    # Weekly topic labeling, one cron per frame: the petition frame Tue 09:08
    # UTC and the application frame Wed 09:04 UTC, the day after the Monday
    # metrics refresh and clear of every pull window (08:47 live, 10:47 live)
    # and of run-predict's 14:12. Each is its own minute on the repo's grid.
    # A run prices its batch and waits on the review hold unless it
    # auto-releases (`config/review-hold.yaml`), and a frame with nothing new
    # to label stands down at the extract, as does one whose open labels PR
    # still holds an unmerged batch. A refused batch is not retried on its own:
    # the next week's batch is cut deterministically from committed state
    # against the same reference set, so unless the frame has grown it is
    # largely the same rows scored the same way, and it waits on a maintainer
    # while the frame's last gated run stands refused — releasing it calls for
    # a stated change.
    - cron: "8 9 * * 2"
    - cron: "4 9 * * 3"
    # Weekly merits side coding (Thu 09:14 UTC), the labeling lane's third
    # frame (`docs/merits-alignment-baseline.md`): each week's new merits grants
    # are coded within days of the grant, inside the clean check's lag, so the
    # codes the clean check reads are grant-time ones. Its own minute on the
    # grid, clear of the 08:47 and 10:47 live windows; a week with no new grant
    # stands down at the extract.
    - cron: "14 9 * * 4"
  workflow_dispatch:
    inputs:
      mode:
        description: Which analysis or refresh to run.
        type: choice
        options:
          - corpus-stats
          - text-coverage
          - metrics-refresh
          - big-cases
          - public-updates
          - tool-usage
          - qp-topic-label
          - qp-topic-label-applications
          - qp-topic-replicate
          - qp-topic-replicate-applications
          - alignment-side-code
          - order-scan
          - decision-below
        default: corpus-stats
      label_model:
        description: "Labeling modes only (qp-topic-label, qp-topic-label-applications, the two qp-topic-replicate modes, alignment-side-code): the agent's model."
        # The scheduled runs use this default too, through `qp-topic-resolve`,
        # which carries the same literal and refuses any other value.
        # A choice, not a free string: the value is spliced into the agent's own
        # `claude_args` block, where a newline would append flags the mode's
        # contract withholds (an `--mcp-config` line would hand a text-only
        # labeler a retrieval surface). It is also recorded as the labels
        # artifact's provenance, so a closed set keeps that field well-formed.
        type: choice
        options:
          - claude-fable-5
          - claude-opus-5-5
        default: claude-opus-5-5
      # corpus-stats inputs (ignored by every other mode). All are optional; an
      # empty value means "no filter" / "no grouping".
      court:
        description: "corpus-stats: restrict to one court id (e.g. scotus). Empty = all courts."
        type: string
        default: ""
      topic:
        description: "corpus-stats: restrict to one exact topic (nature of suit). Empty = all."
        type: string
        default: ""
      disposition:
        description: "corpus-stats: restrict to one outcome label (e.g. granted). Empty = all."
        type: string
        default: ""
      group_by:
        description: "corpus-stats: group base rates by court, topic, judge, term_year, disposition, originating_court, era, relist_bucket, cvsg, fee_class, capital_case or salience_band. Empty = overall."
        type: string
        default: ""
      term:
        description: "corpus-stats: restrict to one October Term (e.g. 2024). Empty = all."
        type: string
        default: ""

# Least privilege by default; each job widens only to what its mode needs.
permissions: {}

# Concurrency is per-job (not workflow-level): corpus-stats cancels a superseded
# run of itself, while a metrics refresh or a labeling run must never be
# cancelled mid-PR (or mid-agent) by an unrelated analysis dispatch. Text-coverage
# and order-scan each take their own never-cancelled group: a
# cancelled job runs no upload step, and the artifact is what those modes exist
# to produce. The corpus analysis jobs are read-only, so their overlap costs
# nothing; order-scan's costs CourtListener requests on the one account every
# environment's token belongs to, which its job's own note covers.
# The labeling mode's two jobs take separate groups: they are already sequenced
# by `needs`, and a shared group would let a second dispatch's extract slip
# between the first dispatch's extract and its labeler.
# Every group carries the dispatching ref, because the environments do too: a
# staging rehearsal and a prod run of the same mode are different environments
# (for the corpus modes, reading different corpus pairs), and one must never
# cancel — or queue behind — the other.

jobs:
  # The run gate (src/fedcourtsai/run_gate.py): a dispatch, or a re-run of any
  # run, proceeds only for a login config/dispatchers.json names. No
  # environment, no secret, a read-only token, and no project code: a sparse
  # checkout of the gate and its allow-list alone, run by path with the
  # runner's Python in isolated mode. Every other job needs this one and checks
  # the attempt it judged, because re-running some jobs does not re-run this
  # one; `run-gate` below fails the run when that check refused.
  authorize:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      attempt: ${{ steps.decide.outputs.attempt }}
      rerunners: ${{ steps.decide.outputs.rerunners }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            src/fedcourtsai/run_gate.py
            config/dispatchers.json
          sparse-checkout-cone-mode: false
      - name: Authorize who started this run
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: >-
          python3 -I -S src/fedcourtsai/run_gate.py --workflow run-analytics.yml
          --event-name "$EVENT_NAME" --actor "$ACTOR"
          --triggering-actor "$TRIGGERING_ACTOR" --run-attempt "$RUN_ATTEMPT"
          --github-output "$GITHUB_OUTPUT"

  corpus-stats:
    needs: [authorize]
    if: >-
      ${{ inputs.mode == 'corpus-stats'
      && needs.authorize.result == 'success'
      && (needs.authorize.outputs.attempt == github.run_attempt
      || contains(needs.authorize.outputs.rerunners, format(',{0},', github.triggering_actor))) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    environment: ${{ github.ref_name == 'main' && 'prod' || github.ref_name }}
    concurrency:
      group: run-analytics-analysis-${{ github.ref_name }}
      cancel-in-progress: true
    permissions:
      contents: read
      id-token: write # assume the read-only AWS role to pull the corpus
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-python-env
        with:
          restore-cache: "false"

      # The base-rates read the corpus (the real rows), so it must be on disk.
      # No contents:write, no App token: this job cannot touch git or the corpus.
      - uses: ./.github/actions/corpus-readonly
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME_READONLY }}
          aws-region: ${{ vars.AWS_REGION }}
          corpus-base-url: ${{ vars.CORPUS_BASE_URL }}
          # The out-of-band staging index pointer, forwarded only off `main`:
          # a staging-bound pull must resolve the staging pair's own digest —
          # the committed corpus/corpus.db.ref names the production blob,
          # which the staging remote does not hold — while a prod-bound run
          # stays on the committed pointer even if the variable ever appears
          # at repository scope. `ref_name`, the environment expression's own
          # key, so the fence is its exact complement: whatever binds `prod`
          # forwards nothing. (The publish fences use the stricter exact-ref
          # spelling instead — under-inclusion is safe there, not here.)
          corpus-pointer: ${{ github.ref_name != 'main' && vars.FEDCOURTS_CORPUS_POINTER || '' }}

      - name: Aggregate corpus base-rates
        env:
          # Every filter is passed through the environment (never interpolated into the
          # shell) so a maintainer-supplied value cannot inject commands; the CLI reads
          # each as one argument and treats an empty value as "no filter" / "no grouping".
          COURT: ${{ inputs.court }}
          TOPIC: ${{ inputs.topic }}
          DISPOSITION: ${{ inputs.disposition }}
          GROUP_BY: ${{ inputs.group_by }}
          # Not `TERM`: that name is the standard terminal-type variable, which
          # every subprocess consults — an avoidable namespace collision.
          TERM_YEAR: ${{ inputs.term }}
          # The corpus estate's base URL: the pulled corpus.db is a payload-free
          # index and payload reads come from the per-case content store the
          # same base derives (addressing the store is the split mode). The
          # base-rates aggregate row columns, so the store is inert for today's
          # groupings — it is addressed because this job's read path is the
          # shared corpus reader, and a grouping that reaches a payload must not
          # be the thing that discovers the store was never wired here.
          FEDCOURTS_CORPUS_BASE_URL: ${{ vars.CORPUS_BASE_URL }}
        run: |
          set -euo pipefail
          # Prints the machine AnalyticsReport JSON to stdout (the run log) and appends
          # the Markdown summary to the step summary. Writes nothing else.
          uv run fedcourts stats \
            --court "$COURT" \
            --topic "$TOPIC" \
            --disposition "$DISPOSITION" \
            --group-by "$GROUP_BY" \
            --term "$TERM_YEAR" \
            --summary-out "$GITHUB_STEP_SUMMARY"

  tool-usage:
    needs: [authorize]
    # Which configured MCP tools cells actually call. Reads `data/` only — no
    # corpus, no network, no credentials — so unlike the sibling jobs it binds
    # no environment and assumes no role: there is nothing for it to reach.
    if: >-
      ${{ inputs.mode == 'tool-usage'
      && needs.authorize.result == 'success'
      && (needs.authorize.outputs.attempt == github.run_attempt
      || contains(needs.authorize.outputs.rerunners, format(',{0},', github.triggering_actor))) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    concurrency:
      group: run-analytics-tool-usage-${{ github.ref_name }}
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-python-env

      - name: Roll up offered-vs-called tool usage
        run: |
          set -euo pipefail
          # Markdown to the step summary and to the run log. Writes nothing to
          # git: this is a read of the committed ledger, not an artifact.
          uv run fedcourts tool-usage --markdown-out "$GITHUB_STEP_SUMMARY"

  text-coverage:
    needs: [authorize]
    # Where the document text actually lives, and for which cases it is missing
    # — the store-configured enumeration a dev checkout cannot perform. The two
    # untruncated case-id ledgers (`empty text`; `no petition, queued`) are the
    # per-case worklists the OCR recovery pass and the document backfill are
    # designed from, and under the corpus-split mode the counts are honest only
    # where the per-case content store is wired — which is this job's read
    # path. Read-only on exactly corpus-stats's terms: the read-only role, no
    # contents:write, no App token, nothing written to git or the corpus.
    if: >-
      ${{ inputs.mode == 'text-coverage'
      && needs.authorize.result == 'success'
      && (needs.authorize.outputs.attempt == github.run_attempt
      || contains(needs.authorize.outputs.rerunners, format(',{0},', github.triggering_actor))) }}
    runs-on: ubuntu-26.04
    # What bounds this job is the credential clock, not the wall clock: the walk reads the
    # documents of every live-slice case — under the split a content-store
    # manifest round trip per case plus a text body per stored document, on the
    # CLI's own bounded reader pool — so the session must outlast the step cap
    # and a too-long walk must fail at the step cap, legibly, inside the
    # session, never mid-walk on ExpiredToken.
    timeout-minutes: 125
    environment: ${{ github.ref_name == 'main' && 'prod' || github.ref_name }}
    # Its own group, never cancelled: a cancelled walk uploads no ledgers, and
    # the ledgers are what the mode exists to produce. Read-only, so overlap
    # with a sibling mode is harmless.
    concurrency:
      group: run-analytics-text-coverage-${{ github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # assume the read-only AWS role to pull the corpus
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-python-env
        with:
          restore-cache: "false"

      # The coverage counts stored documents, so the corpus must be on disk. No
      # contents:write, no App token: this job cannot touch git or the corpus.
      - uses: ./.github/actions/corpus-readonly
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME_READONLY }}
          aws-region: ${{ vars.AWS_REGION }}
          corpus-base-url: ${{ vars.CORPUS_BASE_URL }}
          # The out-of-band staging index pointer, forwarded only off `main`:
          # a staging-bound pull must resolve the staging pair's own digest —
          # the committed corpus/corpus.db.ref names the production blob,
          # which the staging remote does not hold — while a prod-bound run
          # stays on the committed pointer even if the variable ever appears
          # at repository scope. `ref_name`, the environment expression's own
          # key, so the fence is its exact complement: whatever binds `prod`
          # forwards nothing. (The publish fences use the stricter exact-ref
          # spelling instead — under-inclusion is safe there, not here.)
          corpus-pointer: ${{ github.ref_name != 'main' && vars.FEDCOURTS_CORPUS_POINTER || '' }}
          # Covers the walk's cap below plus everything before it — checkout,
          # env sync, up to 120s of assume-role retry, and the composite's own
          # uncapped corpus pull — so the step cap, not the credential clock,
          # is what a too-long walk hits. Needs the read-only role's IAM
          # maximum session duration to allow it; an excess request fails at
          # the assume step inside its 120s action timeout (the STS reason is
          # in the retry lines, the terminal error is the timeout), not at the
          # hour mark.
          role-duration-seconds: "8100"

      - name: Enumerate document text coverage
        timeout-minutes: 110
        env:
          # The corpus estate's base URL: the pulled corpus.db is a payload-free
          # index and every document read comes from the per-case content store
          # the same base derives. Load-bearing here, not defensive: the report
          # leads with a `text source:` line naming which side served it
          # precisely because an unaddressed store counts every document in a
          # payload-free blob as absent — a coverage report that is silently
          # wrong rather than one that fails.
          FEDCOURTS_CORPUS_BASE_URL: ${{ vars.CORPUS_BASE_URL }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/text-coverage.txt"
          # The report is line-oriented: the four self-limiting header lines
          # and the kind x segment cuts, then the three untruncated case-id
          # ledgers. The whole of it is the artifact — the ledgers are the
          # worklists, and the artifact outlives the run page. The step summary gets only the part above the
          # ledgers, which on a large corpus would overflow the page.
          #
          # EVERY ledger header belongs in the sentinel, not just the first: a
          # ledger prints only when it is non-empty, so a run whose earlier
          # ledgers have drained would carry a later one onto the page if its
          # header were missing here.
          uv run fedcourts corpus-info --text-coverage > "$out"
          summary="$RUNNER_TEMP/text-coverage-summary.txt"
          awk '/^empty text \(|^no petition, queued \(|^no application, queued \(/{exit} {print}' "$out" > "$summary"
          # Fail closed on the page: the summary is readable without login,
          # the artifact is not, so the ledgers must never land here. The
          # header block is a few KB; anything larger means the truncation did
          # not engage (a renamed ledger header), and the page gets a pointer
          # instead of the ids. A test pins the header spellings against the
          # CLI so the sentinel cannot silently drift.
          if [ "$(wc -c < "$summary")" -gt 16384 ]; then
            echo "(report too large for the page — read the text-coverage artifact)" > "$summary"
          fi
          {
            echo "### Document text coverage"
            echo
            echo '```'
            cat "$summary"
            echo '```'
            echo
            echo "The case-id ledgers are in the run's \`text-coverage\` artifact."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish the coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: text-coverage
          path: ${{ runner.temp }}/text-coverage.txt
          if-no-files-found: error
          # The one-day window every analytics run artifact rides: this
          # repository is public, so the artifact is downloadable by any
          # logged-in user for as long as it exists, and the ledgers name
          # queued dockets — the compilation-extent inventory in
          # docs/security.md bounds them all the same way. Re-reading after
          # the day is a re-dispatch: the report is deterministic over the
          # blob its own `text source:` line names.
          retention-days: 1

  metrics-refresh:
    needs: [authorize]
    # Runs on the weekly cron, or on dispatch with mode=metrics-refresh — both
    # trusted surfaces (dispatch is write-gated by GitHub, and the run gate
    # above admits only a listed dispatcher), so no sender check is needed
    # here. It gates on **which** cron fired
    # rather than on the event class: a bare `event_name == 'schedule'` is
    # fail-open on every other entry in the schedule block, which would run this
    # weekly job on the daily board's tick too.
    if: >-
      ${{ ((github.event_name == 'schedule' && startsWith(github.event.schedule, '41 ')) ||
      inputs.mode == 'metrics-refresh')
      && needs.authorize.result == 'success'
      && (needs.authorize.outputs.attempt == github.run_attempt
      || contains(needs.authorize.outputs.rerunners, format(',{0},', github.triggering_actor))) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    environment: ${{ github.ref_name == 'main' && 'prod' || github.ref_name }}
    concurrency:
      group: run-analytics-metrics-refresh-${{ github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # assume the read-only AWS role to pull the corpus
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: ./.github/actions/setup-python-env
        with:
          restore-cache: "false"

      # The refresh PR is opened with the dev App token. The dev App bypasses
      # no required check, so the PR still faces the required `gate` check,
      # and it is never auto-merged; a maintainer merging it is what keeps it
      # read. The read-only
      # analysis modes above hold no write token at all; the only other job that
      # does is qp-topic-label, for the same reason and on the same terms.
      # Minted on `main`-ref runs only: the dev App's credentials live on the
      # prod environment alone, and a rehearsal publishes nothing — it
      # regenerates and reports the diff instead (the fenced step at the end).
      - name: Mint app token
        if: ${{ github.ref == 'refs/heads/main' }}
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.DEV_APP_CLIENT_ID }}
          private-key: ${{ secrets.DEV_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Configure git identity
        if: ${{ github.ref == 'refs/heads/main' }}
        uses: ./.github/actions/configure-git-identity
        with:
          token: ${{ steps.app-token.outputs.token }}
          app-slug: ${{ steps.app-token.outputs.app-slug }}

      # backtest and statpack read the corpus, so it must be on disk; a missing
      # pointer only warns (the leaderboard reads the committed pack, not the
      # corpus), but a failed pull
      # of an existing pointer fails the job — regenerating against a missing
      # corpus would regress those artifacts to the empty pack.
      - uses: ./.github/actions/corpus-readonly
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME_READONLY }}
          aws-region: ${{ vars.AWS_REGION }}
          corpus-base-url: ${{ vars.CORPUS_BASE_URL }}
          # The out-of-band staging index pointer, forwarded only off `main`:
          # a staging-bound pull must resolve the staging pair's own digest —
          # the committed corpus/corpus.db.ref names the production blob,
          # which the staging remote does not hold — while a prod-bound run
          # stays on the committed pointer even if the variable ever appears
          # at repository scope. `ref_name`, the environment expression's own
          # key, so the fence is its exact complement: whatever binds `prod`
          # forwards nothing. (The publish fences use the stricter exact-ref
          # spelling instead — under-inclusion is safe there, not here.)
          corpus-pointer: ${{ github.ref_name != 'main' && vars.FEDCOURTS_CORPUS_POINTER || '' }}
          missing-pointer: warn

      # The tested stage commands, run directly; each is deterministic, so an
      # unchanged input
      # reproduces the committed artifact byte for byte. The corpus-dependent
      # pair runs only when the corpus is on disk — regenerating without it
      # would replace real metrics with the empty pack. (The backtest's
      # prior-vote baseline retrieves against a prebuilt index, so a full
      # replay costs a couple of resolved-slice scans, not a query per case.)
      - name: Regenerate the metrics artifacts
        id: regenerate
        run: |
          set -euo pipefail
          if [ -f corpus/corpus.db ]; then
            uv run fedcourts backtest
            uv run fedcourts statpack
            # The docket pack, beside the statpack it shares a corpus with. Its
            # topic cut reads the committed labels artifact at its default
            # path, which the weekly labeling runs grow, so regenerating it
            # here keeps the cut on the labels `main` publishes. Corpus-gated
            # with the others: without one it writes the empty pack.
            uv run fedcourts docket
            # The scope manifest is the same kind of artifact — deterministic,
            # offline, git-tracked, a pure function of the corpus plus the
            # committed case tree. It publishes the salience decision for the
            # public set, so when it drifts a claim in README.md stops being true,
            # which is worse than a stale number. Corpus-gated with the others:
            # without one it writes an empty `skipped` manifest, which would
            # replace the real record.
            uv run fedcourts scope-manifest
          fi
          # Last, and outside the corpus gate: neither needs a corpus, but the
          # board scores its realized-Term skill column against the committed
          # statpack, so running it before the pack would commit a board keyed
          # on the pack it replaces — and a rerun on the merged tree would
          # diff. The claim-score board reads only the ledger, and sits here so
          # the two evaluation-derived artifacts refresh from one tree state.
          uv run fedcourts leaderboard
          uv run fedcourts claim-scores
          # The big-case board reads only the ledger too. The daily `big-cases`
          # job below keeps it current between weekly ticks; regenerating it here
          # as well is what keeps one refresh a self-consistent tree state rather
          # than one artifact a week behind its siblings. Both lanes rewrite the
          # same two files, so a refresh PR left open while the daily lane merges
          # goes un-mergeable on them rather than reverting the newer board —
          # GitHub refuses the conflict rather than taking the older copy. The
          # remedy is a `mode=metrics-refresh` dispatch, which force-pushes the
          # branch from the current `main` and clears it; waiting for the next
          # weekly tick does the same up to seven days later.
          uv run fedcourts big-cases

      # The branch name and PR prose come from the tested `metrics-refresh-plan`
      # (null pr = nothing changed); this step only runs git and gh, mirroring
      # a direct commit. The fixed branch is force-pushed so an unmerged refresh PR
      # updates in place rather than stacking.
      - name: Open or update the review PR
        if: ${{ github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh auth setup-git
          # Stage first, then diff the index: a plain `git diff` sees only tracked
          # files, so a future brand-new artifact under metrics/ would be missed.
          git add -A metrics/ data/scope/
          git diff --cached --name-only -- metrics/ data/scope/ > changed.txt
          plan=$(uv run fedcourts metrics-refresh-plan --changed-file changed.txt \
            --run-id "$GITHUB_RUN_ID")
          if [ "$(jq -r '.pr' <<<"$plan")" = "null" ]; then
            echo "Metrics are up to date; nothing to refresh." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          branch=$(jq -r '.pr.branch' <<<"$plan")
          git checkout -q -b "$branch"
          jq -r '.pr.body' <<<"$plan" > pr-body.md
          git commit -q -m "$(jq -r '.pr.commit_message' <<<"$plan")"
          # Push with the app (write) token; blank any ambient extraheader so it
          # authenticates. Force: the fixed branch supersedes any unmerged refresh.
          git -c http.extraHeader= -c "http.https://github.com/.extraHeader=" \
            push --force "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" \
            "HEAD:refs/heads/${branch}"
          # Reuse the open PR for this branch when one exists (the force-push above
          # already updated its contents); otherwise open a fresh one.
          existing=$(gh pr list --repo "$REPO" --head "$branch" --state open \
            --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --repo "$REPO" \
              --title "$(jq -r '.pr.title' <<<"$plan")" --body-file pr-body.md
            echo "Updated review PR #${existing} in place." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            url=$(gh pr create --base main --head "$branch" \
              --title "$(jq -r '.pr.title' <<<"$plan")" --body-file pr-body.md)
            echo "Opened review PR: ${url}" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      # The rehearsal's record, on every outcome the runner survives — a
      # regenerate that failed is an informative rehearsal result, and it
      # must still leave the statement that publication was fenced, not
      # attempted. On success the record adds what a prod run would have
      # offered for review: the staged diff, as a stat, since the artifacts
      # regenerate from this ref's corpus pair and the numbers themselves
      # are not the point. (The staged index is deliberate residue: this is
      # the job's last step, and nothing after it reads the tree.)
      - name: Report the rehearsal record (publish fenced off this ref)
        if: ${{ !cancelled() && github.ref != 'refs/heads/main' }}
        env:
          REGENERATED: ${{ steps.regenerate.outcome }}
        run: |
          set -euo pipefail
          {
            echo "### metrics-refresh rehearsal — publish fenced to main-branch runs"
            echo
            echo "The review-PR mint did not run; nothing published from this dispatch."
            if [ "$REGENERATED" = "success" ]; then
              git add -A metrics/ data/scope/
              echo '```'
              git diff --cached --stat -- metrics/ data/scope/
              echo '```'
            else
              echo "The regenerate step did not succeed (outcome: ${REGENERATED}); no diff to report."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  big-cases:
    needs: [authorize]
    # The case-centric big-case board (`fedcourts big-cases`) — which cases the
    # predictors think matter, and where they disagree, as `metrics/big-cases.{json,md}`.
    # The website's showcase renders the JSON off `main`, so the board is refreshed
    # **daily** rather than on the weekly slot: a published surface that lags the
    # ledger by up to a week is a published surface that is wrong for most of it.
    #
    # It reads `data/` only — no corpus, no network, no cloud credential — so it
    # assumes no role and pulls nothing; the App token below is for the PR and
    # nothing else. That is also why it can run daily at no cost and outside the
    # corpus-settled window the weekly refresh waits for.
    #
    # It is one of the two PR lanes here that **merge unattended** (with
    # public-updates), and the reason is the artifact rather than the schedule. The board is a byte-stable pure function
    # of the committed ledger, so a day that changed nothing opens nothing, and a
    # day that changed something re-rolls committed cells by a command whose own
    # tests the required `gate` check re-runs on the PR — there is no judgement in
    # the diff for a reviewer to exercise, while a queue of unread daily PRs is
    # exactly how a published surface goes stale. What bounds the diff is the
    # required `paths` check, which runs the tested `assert-board-paths` jail on
    # this branch: the board's two files, written, and nothing else. The
    # gate still decides: the dev App bypasses no required check (only
    # `main`'s approval rule), so the job's own merge waits on the same
    # required checks a reviewed PR would. Where the merge does not land, the PR
    # stays open, auto-merge armed, for a manual merge rather than failing the
    # run.
    if: >-
      ${{ ((github.event_name == 'schedule' && startsWith(github.event.schedule, '36 ')) ||
      inputs.mode == 'big-cases')
      && needs.authorize.result == 'success'
      && (needs.authorize.outputs.attempt == github.run_attempt
      || contains(needs.authorize.outputs.rerunners, format(',{0},', github.triggering_actor))) }}
    runs-on: ubuntu-26.04
    # The regeneration takes a few minutes; the rest is the merge's wait for
    # the PR's required checks, which the merge script bounds at 20.
    timeout-minutes: 35
    environment: ${{ github.ref_name == 'main' && 'prod' || github.ref_name }}
    concurrency:
      group: run-analytics-big-cases-${{ github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: read
      checks: read # the merge lists the board PR's check runs (GITHUB_TOKEN)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: ./.github/actions/setup-python-env
        with:
          restore-cache: "false"

      - name: Regenerate the big-case board
        id: regenerate
        run: |
          set -euo pipefail
          uv run fedcourts big-cases

      # Minted on `main`-ref runs only, on the same terms as the metrics refresh:
      # the dev App's credentials live on the prod environment alone, and a
      # rehearsal publishes nothing — it regenerates and reports the diff instead
      # (the fenced step at the end).
      - name: Mint app token
        if: ${{ github.ref == 'refs/heads/main' }}
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.DEV_APP_CLIENT_ID }}
          private-key: ${{ secrets.DEV_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Configure git identity
        if: ${{ github.ref == 'refs/heads/main' }}
        uses: ./.github/actions/configure-git-identity
        with:
          token: ${{ steps.app-token.outputs.token }}
          app-slug: ${{ steps.app-token.outputs.app-slug }}

      # Mirrors the metrics-refresh PR step: a fixed, force-pushed branch so an
      # unmerged board PR updates in place rather than stacking one a day.
      #
      # It runs no secret scan, and the reason is not the one the labeling job
      # gives. That job's argument is that no agent-authored string can reach its
      # artifact; the board republishes `big_case_rationale`, which is agent
      # prose, so that test fails here. The argument that does hold is upstream:
      # the collect jobs scan every changed file under `data/` before the branch
      # is pushed, and a hit withholds it — so a rationale is scanned before it
      # can enter the ledger, and by the time this job reads one the bytes are
      # already public git. This lane copies already-scanned, already-published
      # bytes and opens no new channel. A new string added to the board has to
      # re-answer that. The title and body themselves carry only jq-extracted
      # integers and fixed prose.
      - name: Open or update the board PR
        if: ${{ github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          # Checks read for the merge's check-run listing, so the dev App needs
          # none.
          CHECKS_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: metrics/big-cases
        run: |
          set -euo pipefail
          gh auth setup-git
          git add -A metrics/big-cases.json metrics/big-cases.md
          if git diff --cached --quiet; then
            echo "Big-case board is current; nothing to publish." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # The same jail the required `paths` check runs on this branch, run here
          # first. The data lanes hold both halves for the same reason: an
          # auto-merged PR should be refused by the job that built it, not only by
          # the check that reads it afterwards.
          git diff --cached --name-status > board-changes.txt
          uv run fedcourts assert-board-paths --name-status-file board-changes.txt
          # `numbers` with `-e` so a shape change exits non-zero rather than
          # splicing raw JSON into the title and the commit message.
          cases=$(jq -er '.cases | numbers' metrics/big-cases.json)
          reads=$(jq -er '.scored_reads | numbers' metrics/big-cases.json)
          total=$(jq -er '.current_reads | numbers' metrics/big-cases.json)
          title="metrics: refresh the big-case board (${cases} case(s), ${reads} scored stakes read(s))"
          # Denominators only, and no case name: a PR title is quoted out of
          # context more than any other line here, and a case beside a number
          # reads as a finding about that case — which a stakes read cannot
          # support. The body says the same in full.
          {
            printf '%s\n\n' "Deterministic re-roll of \`metrics/big-cases.{json,md}\` from the committed ledger by \`fedcourts big-cases\`: ${cases} case(s) ranked over ${reads} scored stakes read(s) of ${total}; the rest carry no score and are excluded from every mean rather than imputed."
            printf '%s\n\n' "**Not a performance surface.** A stakes read is neither scored nor ranked: it resolves against nothing, so no figure in this diff is a forecast, an accuracy or a skill number, and the mean says nothing about how likely a case is to be granted. The board reads the ledger directly and applies neither the forward-claim nor the leakage exclusion — a wider population than the scored boards. The artifact's own provenance block and \`metrics/README.md\` carry the reading rules."
            printf '%s\n\n' "The board is a byte-stable pure function of \`data/\`, so this PR exists only because the ledger moved; a day that changed nothing opens nothing. It merges unattended once the same required checks a reviewed PR faces pass."
            printf '%s\n' "Run: ${GITHUB_SERVER_URL}/${REPO}/actions/runs/${GITHUB_RUN_ID}"
          } > pr-body.md
          git checkout -q -b "$BRANCH"
          git commit -q -m "$title"
          # Push with the app (write) token; blank any ambient extraheader so it
          # authenticates. Force: the fixed branch supersedes any unmerged board PR.
          git -c http.extraHeader= -c "http.https://github.com/.extraHeader=" \
            push --force "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" \
            "HEAD:refs/heads/${BRANCH}"
          # `--base main` as well as `--head`: this lane arms auto-merge on what
          # it finds, and it has no business adopting a PR from this head into
          # some other base that it did not open.
          existing=$(gh pr list --repo "$REPO" --head "$BRANCH" --base main --state open \
            --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --repo "$REPO" --title "$title" --body-file pr-body.md
            url=$(gh pr view "$existing" --repo "$REPO" --json url --jq '.url')
            echo "Updated board PR #${existing} in place." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            url=$(gh pr create --base main --head "$BRANCH" \
              --title "$title" --body-file pr-body.md)
            echo "Opened board PR: ${url}" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          # Best-effort, as the collect action arms it: a refusal (auto-merge
          # disabled on the repo, or the ruleset declining it) leaves the PR open
          # for a manual merge rather than failing a run whose artifact is
          # already pushed.
          gh pr merge --auto --merge --subject "${title} (#${url##*/})" "$url" || {
            echo "::warning::could not enable auto-merge on ${url}; merge it by hand"
            # Also to the summary: a refused arm leaves the PR open and the
            # published board standing still, and an annotation alone expires
            # with the run that raised it.
            echo "Auto-merge could not be enabled on ${url}; merge it by hand." \
              >> "$GITHUB_STEP_SUMMARY"
          }
          # Then land it. Armed auto-merge never exercises the dev App's
          # approval bypass on `main` — it waits for an approval like any other
          # PR — so this job merges the PR itself once the platform accepts it,
          # pinned to the commit just pushed. The bypass covers the approval rule
          # alone: `main: require PR`'s required `gate` and `paths` checks still
          # refuse the merge until they pass. The script is read from this job's
          # own commit, as the collect jobs read it.
          script="${RUNNER_TEMP}/merge-when-green.sh"
          git show "${GITHUB_SHA}:scripts/merge-when-green.sh" > "$script"
          bash "$script" "${url##*/}" "$(git rev-parse HEAD)" < /dev/null

      # The rehearsal's boundary, stated where the operator reads, and on every
      # outcome the runner survives rather than only success.
      - name: Report the rehearsal record (publish fenced off this ref)
        if: ${{ !cancelled() && github.ref != 'refs/heads/main' }}
        env:
          REGENERATED: ${{ steps.regenerate.outcome }}
        run: |
          set -euo pipefail
          {
            echo "### big-cases rehearsal — publish fenced to main-branch runs"
            echo
            echo "The board PR mint did not run; nothing published from this dispatch."
            if [ "$REGENERATED" = "success" ]; then
              git add -A metrics/big-cases.json metrics/big-cases.md
              echo '```'
              git diff --cached --stat -- metrics/
              echo '```'
            else
              echo "The regenerate step did not succeed (outcome: ${REGENERATED}); no diff to report."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  public-updates:
    needs: [authorize]
    # The site's running history of weekly public updates (`fedcourts
    # archive-public-updates`): one `metrics/updates/<YYYY-Www>.md` per week the
    # email list was offered, which the website renders off `main` as its
    # updates page. Each file is the `fedcourts public-update` render the email
    # draft carries, with its title as a heading rather than a subject, rendered
    # from the ledger as it stands when the file is first written.
    #
    # It reads `data/` only — no corpus, no network, no cloud credential — so,
    # like big-cases, it assumes no role and the App token is for the PR alone.
    # It does not bind `website`: the Buttondown key stays with the one job that
    # drafts the email.
    #
    # It merges **unattended**, on the board's argument and a narrower bound. The
    # file is a byte-stable pure function of the committed ledger, the history is
    # write-once once merged (a week on `main` is never re-rendered; a week whose
    # PR has not merged is rendered again by the next run), and a week with
    # nothing to show gets no file — so a run adds the missing weeks' files or
    # opens nothing. The required `paths` check runs the tested
    # `assert-update-paths` jail on this branch: added `metrics/updates/` week
    # files and nothing else, no modify and no delete. What it publishes is the
    # ledger the site already shows, in the email's words; a draft the
    # maintainer edits or never sends is still archived as rendered. A published
    # week does not follow a later void or set-aside: correcting one is a
    # reviewed PR, which this jail refuses by design.
    if: >-
      ${{ ((github.event_name == 'schedule' && startsWith(github.event.schedule, '59 ')) ||
      inputs.mode == 'public-updates')
      && needs.authorize.result == 'success'
      && (needs.authorize.outputs.attempt == github.run_attempt
      || contains(needs.authorize.outputs.rerunners, format(',{0},', github.triggering_actor))) }}
    runs-on: ubuntu-26.04
    # The render takes seconds; the rest is the merge's wait for the PR's
    # required checks, which the merge script bounds at 20.
    timeout-minutes: 30
    environment: ${{ github.ref_name == 'main' && 'prod' || github.ref_name }}
    concurrency:
      group: run-analytics-public-updates-${{ github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: read
      checks: read # the merge lists the history PR's check runs (GITHUB_TOKEN)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: ./.github/actions/setup-python-env
        with:
          restore-cache: "false"

      - name: Add the missing weeks to the update history
        id: archive
        run: |
          set -euo pipefail
          uv run fedcourts archive-public-updates | tee -a "$GITHUB_STEP_SUMMARY"

      # Minted on `main`-ref runs only, on the board's terms: the dev App's
      # credentials live on the prod environment alone, and a rehearsal
      # publishes nothing.
      - name: Mint app token
        if: ${{ github.ref == 'refs/heads/main' }}
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.DEV_APP_CLIENT_ID }}
          private-key: ${{ secrets.DEV_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Configure git identity
        if: ${{ github.ref == 'refs/heads/main' }}
        uses: ./.github/actions/configure-git-identity
        with:
          token: ${{ steps.app-token.outputs.token }}
          app-slug: ${{ steps.app-token.outputs.app-slug }}

      # The board's PR step, on a fixed force-pushed branch. No secret scan:
      # every string in an update is already public on `main` — captions from
      # the deterministic writers' committed event records, predictor ids,
      # probabilities and run paths from collect-scanned cells — plus fixed
      # prose, so this lane opens no new channel.
      # The title and body carry only the week count and fixed prose.
      - name: Open or update the history PR
        if: ${{ github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          CHECKS_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: metrics/public-updates
        run: |
          set -euo pipefail
          gh auth setup-git
          # The directory is absent until a week has something to show.
          if [ -d metrics/updates ]; then git add -A metrics/updates; fi
          if git diff --cached --quiet; then
            echo "Update history is current; nothing to publish." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # The required `paths` check's jail, run here first, as the board does.
          git diff --cached --name-status > update-changes.txt
          uv run fedcourts assert-update-paths --name-status-file update-changes.txt
          weeks=$(grep -c . update-changes.txt)
          title="metrics: add ${weeks} week(s) to the public update history"
          {
            printf '%s\n\n' "Adds ${weeks} week(s) to \`metrics/updates/\`, rendered from the committed ledger by \`fedcourts archive-public-updates\` — the same render the week's email draft carries. The history is write-once, so this PR only adds files."
            printf '%s\n\n' "**Not a performance surface.** An update states forecasts and outcomes side by side and computes no score (\`metrics/README.md\`). It merges unattended once the same required checks a reviewed PR faces pass."
            printf '%s\n' "Run: ${GITHUB_SERVER_URL}/${REPO}/actions/runs/${GITHUB_RUN_ID}"
          } > pr-body.md
          git checkout -q -b "$BRANCH"
          git commit -q -m "$title"
          git -c http.extraHeader= -c "http.https://github.com/.extraHeader=" \
            push --force "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" \
            "HEAD:refs/heads/${BRANCH}"
          existing=$(gh pr list --repo "$REPO" --head "$BRANCH" --base main --state open \
            --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --repo "$REPO" --title "$title" --body-file pr-body.md
            url=$(gh pr view "$existing" --repo "$REPO" --json url --jq '.url')
            echo "Updated history PR #${existing} in place." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            url=$(gh pr create --base main --head "$BRANCH" \
              --title "$title" --body-file pr-body.md)
            echo "Opened history PR: ${url}" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          gh pr merge --auto --merge --subject "${title} (#${url##*/})" "$url" || {
            echo "::warning::could not enable auto-merge on ${url}; merge it by hand"
            echo "Auto-merge could not be enabled on ${url}; merge it by hand." \
              >> "$GITHUB_STEP_SUMMARY"
          }
          # Landed by the job itself, as the board is: armed auto-merge waits for
          # an approval the dev App's bypass covers only on a direct merge.
          script="${RUNNER_TEMP}/merge-when-green.sh"
          git show "${GITHUB_SHA}:scripts/merge-when-green.sh" > "$script"
          bash "$script" "${url##*/}" "$(git rev-parse HEAD)" < /dev/null

      - name: Report the rehearsal record (publish fenced off this ref)
        if: ${{ !cancelled() && github.ref != 'refs/heads/main' }}
        env:
          ARCHIVED: ${{ steps.archive.outcome }}
        run: |
          set -euo pipefail
          {
            echo "### public-updates rehearsal — publish fenced to main-branch runs"
            echo
            echo "The history PR mint did not run; nothing published from this dispatch."
            if [ "$ARCHIVED" = "success" ]; then
              if [ -d metrics/updates ]; then git add -A metrics/updates; fi
              echo '```'
              git diff --cached --stat -- metrics/
              echo '```'
            else
              echo "The archive step did not succeed (outcome: ${ARCHIVED}); no diff to report."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # The labeling lane's one reading of which run this is. A dispatch names its
  # mode; a schedule carries no inputs, so the cron that fired names the frame
  # and the model is the dispatch input's default. Every later labeling job
  # reads the frame, the labels file, the model and whether the run was
  # scheduled from these outputs and nowhere else, so the extract, the
  # measurement, the hold and the PR can never name different frames. No
  # checkout, no token, no environment: the step reads three context values
  # through its environment and refuses anything outside the closed sets.
  qp-topic-resolve:
    needs: [authorize]
    if: >-
      ${{ ((github.event_name == 'schedule' && (startsWith(github.event.schedule, '8 ')
      || startsWith(github.event.schedule, '4 ') || startsWith(github.event.schedule, '14 ')))
      || inputs.mode == 'qp-topic-label' || inputs.mode == 'qp-topic-label-applications'
      || inputs.mode == 'qp-topic-replicate' || inputs.mode == 'qp-topic-replicate-applications'
      || inputs.mode == 'alignment-side-code')
      && needs.authorize.result == 'success'
      && (needs.authorize.outputs.attempt == github.run_attempt
      || contains(needs.authorize.outputs.rerunners, format(',{0},', github.triggering_actor))) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions: {}
    outputs:
      mode: ${{ steps.resolve.outputs.mode }}
      frame: ${{ steps.resolve.outputs.frame }}
      labels-name: ${{ steps.resolve.outputs.labels-name }}
      # The directory the frame's artifact lives in, and the prompt its agent
      # reads: the topic frames' `data/qp-topics/` and labeling prompt, or the
      # side coder's `data/merits-alignment/` and coding prompt.
      labels-dir: ${{ steps.resolve.outputs.labels-dir }}
      prompt: ${{ steps.resolve.outputs.prompt }}
      model: ${{ steps.resolve.outputs.model }}
      scheduled: ${{ steps.resolve.outputs.scheduled }}
      # `true` for a reference-only replicate: the extract cuts the reference
      # rows alone and the measure step records the run without writing labels.
      replicate: ${{ steps.resolve.outputs.replicate }}
    steps:
      - name: Resolve the labeling mode, frame and model
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          MODE: ${{ inputs.mode }}
          MODEL: ${{ inputs.label_model }}
        run: |
          set -euo pipefail
          scheduled=false
          replicate=false
          case "${EVENT_NAME}:${SCHEDULE}" in
            "schedule:8 9 * * 2") mode=qp-topic-label; scheduled=true ;;
            "schedule:4 9 * * 3") mode=qp-topic-label-applications; scheduled=true ;;
            "schedule:14 9 * * 4") mode=alignment-side-code; scheduled=true ;;
            workflow_dispatch:*) mode="$MODE" ;;
            *) echo "::error::no labeling mode for a ${EVENT_NAME} event"; exit 1 ;;
          esac
          case "$mode" in
            qp-topic-label) frame=petitions; labels=qp-topics.json ;;
            qp-topic-label-applications) frame=applications; labels=qp-topics-applications.json ;;
            qp-topic-replicate) frame=petitions; labels=qp-topics.json; replicate=true ;;
            qp-topic-replicate-applications) frame=applications; labels=qp-topics-applications.json; replicate=true ;;
            alignment-side-code) frame=alignment-sides; labels=alignment-side-codes.json ;;
            *) echo "::error::not a labeling mode: ${mode}"; exit 1 ;;
          esac
          case "$frame" in
            alignment-sides) dir=data/merits-alignment; prompt=.github/prompts/alignment-side-code.md ;;
            *) dir=data/qp-topics; prompt=.github/prompts/qp-topic-label.md ;;
          esac
          # The dispatch input's default, which a schedule cannot read; the
          # closed set is the input's own choice list, because the value is
          # spliced into the agent's `claude_args` block.
          model="${MODEL:-claude-opus-5-5}"
          case "$model" in
            claude-fable-5|claude-opus-5-5) ;;
            *) echo "::error::not a labeler model: ${model}"; exit 1 ;;
          esac
          {
            echo "mode=$mode"
            echo "frame=$frame"
            echo "labels-name=$labels"
            echo "labels-dir=$dir"
            echo "prompt=$prompt"
            echo "model=$model"
            echo "scheduled=$scheduled"
            echo "replicate=$replicate"
          } >> "$GITHUB_OUTPUT"
          echo "labeling run: ${mode} (${frame} frame) by ${model}, scheduled=${scheduled}, replicate=${replicate}"

  qp-topic-extract:
    needs: [authorize, qp-topic-resolve]
    # First half of the labeling mode, and the only half that holds a cloud
    # credential. `corpus-readonly` exports the assumed role's credentials
    # job-wide, and the second job runs an agent — so the extract is split into
    # its own job rather than sharing an environment with the labeler. What
    # crosses the boundary is one artifact: the texts, and nothing else. It
    # also prices the round and, on `main`, decides whether it skips the hold.
    if: >-
      ${{ needs.qp-topic-resolve.outputs.mode != ''
      && needs.authorize.result == 'success'
      && (needs.authorize.outputs.attempt == github.run_attempt
      || contains(needs.authorize.outputs.rerunners, format(',{0},', github.triggering_actor))) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    environment: ${{ github.ref_name == 'main' && 'prod' || github.ref_name }}
    concurrency:
      group: run-analytics-qp-topic-extract-${{ needs.qp-topic-resolve.outputs.frame }}-${{ github.ref_name }}
      cancel-in-progress: false
    outputs:
      # One of the numbers that cross to the labeling job besides the extract
      # itself: how many QP-bearing rows the frame this batch was cut from
      # holds. A plain integer, so it carries none of the draw's shape — which
      # is why the sidecar it is read from stays here (see the extract step).
      frame-rows: ${{ steps.extract.outputs.frame-rows }}
      # The batch's own size — how many texts this extract holds — read from
      # the same sidecar, on the same terms, and carrying no more shape than
      # the frame count does: it is the row count of a file the labeler reads
      # in full and could tally itself. It crosses because the labeling job's
      # publication gate is "the labeler wrote one line per extract row", and
      # the denominator of that comparison must not be a number the labeler
      # could edit — `qp-texts.json` lands inside the one directory the agent
      # holds a Write grant over, so a locally counted batch size would let a
      # shrunken extract make a partial run look complete. A job output is
      # fixed before the agent starts.
      batch-rows: ${{ steps.extract.outputs.batch-rows }}
      # The extract's digest, fixed before any agent starts. The extract lands
      # in the one directory the agent may write, and the side coder's publish
      # step stamps each code's grant date from it, so that step refuses an
      # extract whose bytes are not the ones this job cut.
      extract-sha256: ${{ steps.extract.outputs.extract-sha256 }}
      # Whether the frame owes a batch at all. A scheduled run on a frame with
      # nothing new to label stands down at the extract (`--converged-ok`),
      # and every later labeling job skips on this.
      owed: ${{ steps.extract.outputs.owed }}
      # The hold decision: `review-auto` when this round's plan auto-released
      # it, `review` otherwise (`qp-topic-approval`).
      auto-release: ${{ steps.hold.outputs.auto_release }}
    env:
      # Which frame this run labels, and the labels file it accrues. Both
      # are read off `qp-topic-resolve` alone, so the extract, the measurement
      # and the PR can never name different frames. This job reads QP_FRAME
      # (and LABELS_NAME for the open PR's branch); all three jobs carry the
      # same pair, which a workflow test pins equal.
      QP_FRAME: ${{ needs.qp-topic-resolve.outputs.frame }}
      LABELS_NAME: ${{ needs.qp-topic-resolve.outputs.labels-name }}
      LABELS_DIR: ${{ needs.qp-topic-resolve.outputs.labels-dir }}
    permissions:
      contents: read
      id-token: write # assume the read-only AWS role to pull the corpus
      # Whether the frame's fixed PR branch has an open, unmerged PR, whose
      # spend records count toward the measured spend and the refusal rule
      # (PR metadata only).
      pull-requests: read
      # Count the rounds auto-released in the trailing 24 hours, across the
      # lanes: each one left a deployment to the `review-auto` environment. Read
      # only; the job creates no deployment.
      deployments: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history: carrying the open PR's spend records diffs its branch
          # against the merge base with this checkout.
          fetch-depth: 0

      - uses: ./.github/actions/setup-python-env
        with:
          restore-cache: "false"

      # The open, unmerged PR on this frame's fixed branch carries the spend
      # records of runs that have not reached `main`, a refused run's and a
      # published batch's among them. Carried into this checkout's `data/` so
      # the hold's measured spend counts them, the refusal rule sees a refusal
      # still awaiting review, and a batch still awaiting review is not cut and
      # paid for again: the next batch is derived from `main`'s labels file, so
      # while that PR holds a published batch a scheduled run stands down and a
      # dispatched one waits on the hold (`fedcourts qp-topic-pending`). Only
      # spend records are carried, only files the branch adds, only from this
      # repository's own branch (the owner-qualified head), and only from
      # commits authored under a GitHub App's bot identity, which is what the
      # publish job commits as — an attribution filter, not an authentication
      # (SECURITY.md). A record dated after this run is refused by the hold
      # itself. On main only — a rehearsal plans against its own ref and never
      # reaches the auto-release.
      - name: Count the open labels PR's spend records
        id: carry
        if: ${{ github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          BRANCH: >-
            ${{ needs.qp-topic-resolve.outputs.frame == 'alignment-sides'
            && 'merits-alignment/side-codes'
            || needs.qp-topic-resolve.outputs.frame == 'applications'
            && 'qp-topics/applications-refresh' || 'qp-topics/refresh' }}
        run: |
          set -euo pipefail
          : > "$RUNNER_TEMP/carried-spend.txt"
          open=$(gh api "repos/${REPO}/pulls?state=open&base=main&head=${OWNER}:${BRANCH}" \
            --jq 'length')
          if [ "$open" = "0" ]; then
            echo "no open ${BRANCH} PR; deciding against main alone"
            echo "pending=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags -q origin "$BRANCH"
          git diff --name-only --diff-filter=A HEAD...FETCH_HEAD -- data/qp-topics/spend/ \
            > "$RUNNER_TEMP/added-spend.txt"
          skipped=0
          while IFS= read -r path; do
            case "$path" in
              data/qp-topics/spend/*.json) ;;
              *) continue ;;
            esac
            author=$(git log -1 --diff-filter=A --format=%ae HEAD..FETCH_HEAD -- "$path")
            case "$author" in
              *"[bot]@users.noreply.github.com")
                git checkout FETCH_HEAD -- "$path"
                echo "$path" >> "$RUNNER_TEMP/carried-spend.txt"
                ;;
              *) skipped=$((skipped + 1)) ;;
            esac
          done < "$RUNNER_TEMP/added-spend.txt"
          echo "carried $(wc -l < "$RUNNER_TEMP/carried-spend.txt") spend record(s) from the open ${BRANCH} PR; skipped ${skipped} not authored by an App"
          pending=$(uv run fedcourts qp-topic-pending --frame "$QP_FRAME" \
            --carried-file "$RUNNER_TEMP/carried-spend.txt")
          echo "pending=${pending}" >> "$GITHUB_OUTPUT"

      # The extract reads the stored document text, so the corpus must be on
      # disk. No contents:write, no App token: this job cannot touch git.
      - uses: ./.github/actions/corpus-readonly
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME_READONLY }}
          aws-region: ${{ vars.AWS_REGION }}
          corpus-base-url: ${{ vars.CORPUS_BASE_URL }}
          # The out-of-band staging index pointer, forwarded only off `main`:
          # a staging-bound pull must resolve the staging pair's own digest —
          # the committed corpus/corpus.db.ref names the production blob,
          # which the staging remote does not hold — while a prod-bound run
          # stays on the committed pointer even if the variable ever appears
          # at repository scope. `ref_name`, the environment expression's own
          # key, so the fence is its exact complement: whatever binds `prod`
          # forwards nothing. (The publish fences use the stricter exact-ref
          # spelling instead — under-inclusion is safe there, not here.)
          corpus-pointer: ${{ github.ref_name != 'main' && vars.FEDCOURTS_CORPUS_POINTER || '' }}

      - name: Extract the stored questions-presented texts
        id: extract
        env:
          # The corpus estate's base URL, in the same spelling every
          # corpus-reading step in this file declares. Inert for this step:
          # `qp-corpus` opens the pulled blob directly rather than through the
          # shared payload reader, so on a payload-free blob it finds no
          # document text and exits non-zero either way — a labeling run that
          # cannot read its input says so rather than handing the labeler an
          # empty extract. It is here so one spelling covers every step in this
          # file that reads case payloads, and none of them is silently the
          # exception. (The metrics refresh is not one: its artifacts are a pure
          # function of the pulled index and the committed trees, so that job
          # declares no corpus address at all.)
          FEDCOURTS_CORPUS_BASE_URL: ${{ vars.CORPUS_BASE_URL }}
          SCHEDULED: ${{ needs.qp-topic-resolve.outputs.scheduled }}
          PENDING: ${{ steps.carry.outputs.pending }}
          REPLICATE: ${{ needs.qp-topic-resolve.outputs.replicate }}
        run: |
          set -euo pipefail
          # A scheduled run stands down while the frame's open labels PR holds
          # an unmerged published batch: this batch would be cut from main's
          # labels file and label those rows again.
          if [ "$SCHEDULED" = true ] && [ "$PENDING" = true ]; then
            echo "owed=false" >> "$GITHUB_OUTPUT"
            echo "The open ${QP_FRAME} labels PR holds an unmerged batch; this scheduled run stands down until it merges." \
              | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # A scheduled run stands down cleanly on a frame with nothing new to
          # label — converged, or a batch the reference set fills alone — and
          # writes no extract; a dispatch keeps the refusal, so an operator who
          # asked for a batch hears why there is none.
          cut_args=()
          if [ "$SCHEDULED" = true ]; then
            cut_args=(--converged-ok)
          fi
          # A replicate cuts the frame's reference rows alone: the labeler reads
          # identical inputs on every replicate, and nothing it labels is owed.
          if [ "$REPLICATE" = true ]; then
            cut_args+=(--reference-only)
          fi
          # Under $RUNNER_TEMP, never the work tree: the extract republishes
          # stored petition text and enumerates the ingested corpus, so
          # `qp-corpus` refuses an --out anywhere inside the checkout (one
          # `git add -A` from being committed).
          #
          # The batch arithmetic goes to stderr, which is captured here and
          # copied into the step summary: the frame is not committed, so how this
          # batch was cut is not re-derivable once the runner is gone, and the
          # summary is the durable channel. It carries counts and stratum keys
          # only — no case id, no petition text — the same shape the sidecar
          # holds. That sidecar stays on the runner deliberately: the upload
          # below names the extract by file, so the selection rule never reaches
          # the labeling job.
          # Captured to a file rather than through a tee subprocess, so the
          # summary is written from a complete file rather than racing a
          # background writer. A refusal's message is the most valuable thing
          # here, so the capture runs on both outcomes and the exit status is
          # replayed afterwards.
          status=0
          if [ "$QP_FRAME" = alignment-sides ]; then
            # The side coder's extract: every uncoded merits grant's grant-time
            # text, with each row's mode in a sidecar the coder never reads
            # (the modes upload below hands it to the coding job's publish
            # step, after the agent has exited). An empty frame writes nothing
            # and stands down on either trigger: it has no batch to refuse.
            uv run fedcourts alignment-side-extract --out "$RUNNER_TEMP/qp-texts.json" \
              --modes-out "$RUNNER_TEMP/alignment-modes.json" \
              2> "$RUNNER_TEMP/qp-batch.txt" || status=$?
          else
            uv run fedcourts qp-corpus --frame "$QP_FRAME" --out "$RUNNER_TEMP/qp-texts.json" \
              "${cut_args[@]+"${cut_args[@]}"}" 2> "$RUNNER_TEMP/qp-batch.txt" || status=$?
          fi
          cat "$RUNNER_TEMP/qp-batch.txt" >&2
          {
            echo '### qp-topic extract'
            echo '```'
            cat "$RUNNER_TEMP/qp-batch.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          if [ ! -f "$RUNNER_TEMP/qp-texts.json" ]; then
            echo "owed=false" >> "$GITHUB_OUTPUT"
            echo "Nothing owed in the ${QP_FRAME} frame; this scheduled run stands down." \
              | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "owed=true" >> "$GITHUB_OUTPUT"
          # The frame size, and nothing else, travels on to the measure step —
          # as a VALUE, read out of the sidecar here rather than by handing the
          # sidecar over. `qp-topics` records it on this batch's ledger entry,
          # which is what lets the docket pack publish the labeled share of the
          # QP-bearing frame as a measurement instead of an upper bound over
          # every in-scope row (docs/qp-topic.md). An integer carries no Term or
          # fee-class counts and reaches the labeling job's *measure* step, not
          # its agent, so the fence the sidecar exists behind is untouched.
          # `|| frame=''` so the guard below owns the diagnosis: `jq -e` exits
          # non-zero and prints nothing when `.frame` is absent or not a number,
          # which under `set -e` would otherwise end the step with a bare exit
          # code and no annotation. The digit check is also what sanitizes the
          # value: only digits reach $GITHUB_OUTPUT. A zero is refused here
          # rather than at `qp-topics --frame-rows`, which takes 1 or more —
          # a frame that small cannot clear the extract's coverage floor anyway,
          # so this is the two contracts agreeing on the page.
          frame="$(jq -er '.frame | numbers | floor' \
            "$RUNNER_TEMP/qp-texts.batch.json")" || frame=''
          case "$frame" in
            ''|0|*[!0-9]*)
              echo "::error::qp-corpus wrote no usable frame count; refusing to pass one on"
              exit 1
              ;;
          esac
          echo "frame-rows=$frame" >> "$GITHUB_OUTPUT"
          # The batch's row count travels beside it, through the same guard and
          # for the same reason it is a value rather than a file: the labeling
          # job's measure gate compares it against the label lines the run left
          # behind. `rows` is the sidecar's word for the batch's size; the
          # ledger's `batch` is an index, which is why the sidecar spells them
          # apart. A zero is refused here too — an empty extract is nothing for
          # a labeler to finish, and it would make "wrote every row" vacuous.
          rows="$(jq -er '.rows | numbers | floor' \
            "$RUNNER_TEMP/qp-texts.batch.json")" || rows=''
          case "$rows" in
            ''|0|*[!0-9]*)
              echo "::error::qp-corpus wrote no usable batch row count; refusing to pass one on"
              exit 1
              ;;
          esac
          echo "batch-rows=$rows" >> "$GITHUB_OUTPUT"
          echo "extract-sha256=$(sha256sum "$RUNNER_TEMP/qp-texts.json" | cut -d' ' -f1)" \
            >> "$GITHUB_OUTPUT"

      # The round's price, from the batch's size and the labeler's per-row
      # planning rate (`fedcourts qp-label-plan`, src/fedcourtsai/planning_rates.py):
      # the plan document the review hold judges the round on, rendered into
      # the step summary where the maintainer releasing it reads it.
      - name: Price the label round
        if: ${{ steps.extract.outputs.owed == 'true' }}
        env:
          ROWS: ${{ steps.extract.outputs.batch-rows }}
          MODEL: ${{ needs.qp-topic-resolve.outputs.model }}
        run: |
          set -euo pipefail
          uv run fedcourts qp-label-plan --rows "$ROWS" --model "$MODEL" --frame "$QP_FRAME" \
            --out "$RUNNER_TEMP/label-plan.json" --report "$RUNNER_TEMP/label-plan.md"
          cat "$RUNNER_TEMP/label-plan.md" >> "$GITHUB_STEP_SUMMARY"

      # Whether this round waits on the hold: `fedcourts hold-decision --seam
      # label` over the plan above (priced at its upper estimate — a label
      # round has no matrix), `config/review-hold.yaml`'s caps and trailing
      # budget, and the committed spend ledger in this checkout's `data/` (the
      # open PR's carried spend records included). A label round also holds
      # when its frame's newest gated run was refused at the reference gate,
      # and while the open PR holds an unmerged published batch. It
      # fails closed: with any knob at 0, an unreadable ledger, or a 24-hour
      # count this step cannot read, the round waits on the `review` hold. The
      # count is the summarize lane's, read the same two ways. On `main` only:
      # `review-auto`'s branch policy admits no other ref, so a rehearsal
      # always holds.
      - name: Decide the hold
        id: hold
        if: ${{ steps.extract.outputs.owed == 'true' && github.ref == 'refs/heads/main' }}
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          since=$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          count_args=()
          # One page, newest first: a full page whose oldest entry is still
          # inside the window may be truncated, so it prints no number and the
          # round holds rather than under-counting.
          if released=$(gh api "repos/${REPO}/deployments?environment=review-auto&per_page=100" \
                --jq "if length == 100 and (.[-1].created_at >= \"${since}\") then \"truncated\" else ([.[] | select(.created_at >= \"${since}\")] | length) end" 2>"$RUNNER_TEMP/deploy-read.err") \
             && [[ "$released" =~ ^[0-9]+$ ]]; then
            count_args+=(--deployments-released "$released")
          else
            echo "::warning::could not count review-auto deployments in the last 24h ($(head -c 300 "$RUNNER_TEMP/deploy-read.err" | tr -s '\n:' '  ')); this run waits on the hold"
          fi
          if gh api --paginate "repos/${REPO}/commits?sha=main&since=${since}&per_page=100" \
                --jq '.[].commit.message | split("\n")[0]' > "$RUNNER_TEMP/main-subjects.txt" 2>"$RUNNER_TEMP/subjects-read.err"; then
            count_args+=(--main-subjects-file "$RUNNER_TEMP/main-subjects.txt")
          else
            echo "::warning::could not read main's commits from the last 24h ($(head -c 300 "$RUNNER_TEMP/subjects-read.err" | tr -s '\n:' '  ')); this run waits on the hold"
          fi
          carried_args=()
          if [ -f "$RUNNER_TEMP/carried-spend.txt" ]; then
            carried_args+=(--carried-file "$RUNNER_TEMP/carried-spend.txt")
          fi
          decision=$(uv run fedcourts hold-decision --seam label \
            --plan-file "$RUNNER_TEMP/label-plan.json" \
            --summary-file "$GITHUB_STEP_SUMMARY" "${count_args[@]}" \
            "${carried_args[@]+"${carried_args[@]}"}")
          echo "auto_release=$(jq -r '.auto_release' <<<"$decision")" >> "$GITHUB_OUTPUT"

      - name: Upload the extract
        if: ${{ steps.extract.outputs.owed == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qp-texts
          path: ${{ runner.temp }}/qp-texts.json
          if-no-files-found: error
          # One day, deliberately: the extract republishes stored petition text
          # and enumerates the ingested corpus — the two things no committed
          # surface does — so it exists to hand one file to the next job and
          # must not outlive the run pipeline as a downloadable artifact.
          # Retention bounds the window, not the audience: this repository is
          # public, so a run artifact is downloadable by any logged-in user for
          # as long as it exists (the same residual SECURITY.md records for the
          # cell artifacts). That is why the window is the shortest GitHub
          # offers, and why the disclosure is argued out loud in
          # docs/qp-topic.md rather than treated as an implementation detail.
          retention-days: 1

      # The side coder's modes sidecar: which extract rows carried a merits
      # judgment when the extract was cut. It travels as its own artifact, never
      # beside the extract, and the coding job downloads it only after its agent
      # has exited, so the coder cannot read which of its cases are decided. One
      # day, as for the extract; it holds case ids and a mode, no text.
      - name: Upload the side-coding modes sidecar
        if: ${{ steps.extract.outputs.owed == 'true' && env.QP_FRAME == 'alignment-sides' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: alignment-modes
          path: ${{ runner.temp }}/alignment-modes.json
          if-no-files-found: error
          retention-days: 1

  # The hold: no code, no token, no permissions — the `review` environment's
  # required reviewers gate it, so the labeler spends nothing until a named
  # reviewer releases this round's plan. A round the extract job auto-released
  # binds the reviewer-less `review-auto` instead, as summarize's rounds do;
  # its deployment is one of the two records every lane's next plan counts
  # against the daily cap. A dispatch takes the same hold as a schedule: the
  # dispatcher releases it, and the decision is the same tested rule either
  # way.
  qp-topic-approval:
    needs: [authorize, qp-topic-resolve, qp-topic-extract]
    if: >-
      ${{ needs.qp-topic-extract.outputs.owed == 'true'
      && needs.authorize.result == 'success'
      && (needs.authorize.outputs.attempt == github.run_attempt
      || contains(needs.authorize.outputs.rerunners, format(',{0},', github.triggering_actor))) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    environment: ${{ needs.qp-topic-extract.outputs.auto-release == 'true' && 'review-auto' || 'review' }}
    permissions: {}
    steps:
      - name: Release the held label round
        run: echo "the review hold released — the planned labeling round may spend."

  # A hold that did not release leaves its record on the same run page as the
  # plan it was judged on. No token and no permissions.
  qp-topic-rejected:
    needs: [authorize, qp-topic-resolve, qp-topic-extract, qp-topic-approval]
    if: >-
      ${{ (always() && needs.qp-topic-extract.result == 'success'
      && needs.qp-topic-extract.outputs.owed == 'true'
      && needs.qp-topic-approval.result != 'success')
      && needs.authorize.result == 'success'
      && (needs.authorize.outputs.attempt == github.run_attempt
      || contains(needs.authorize.outputs.rerunners, format(',{0},', github.triggering_actor))) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Record that the hold did not release
        env:
          RESULT: ${{ needs.qp-topic-approval.result }}
        run: |
          set -euo pipefail
          {
            echo "## qp-topic labeling — the review hold did not release"
            echo ""
            echo "The \`review\` hold ended as \`${RESULT}\`, so the labeler did not run and nothing was spent. The plan report on the \`qp-topic-extract\` job is the record of what was declined. The batch is still owed: the next run cuts it again from committed state."
          } >> "$GITHUB_STEP_SUMMARY"

  qp-topic-label:
    # Second half: the agent labels every text from the extract alone, then the
    # deterministic `qp-topics` command measures it against the hand reference
    # set and writes the artifact. No `id-token: write` and no `corpus-readonly`
    # here — that is the point of the split, and the assertion step below is its
    # tripwire.
    needs: [authorize, qp-topic-resolve, qp-topic-extract, qp-topic-approval]
    if: >-
      ${{ needs.qp-topic-approval.result == 'success'
      && needs.authorize.result == 'success'
      && (needs.authorize.outputs.attempt == github.run_attempt
      || contains(needs.authorize.outputs.rerunners, format(',{0},', github.triggering_actor))) }}
    runs-on: ubuntu-26.04
    # The step caps have to fit inside this one or the run loses its artifact
    # to the job clock: the 40-minute labeler, the 5-minute CLI install, the
    # three post-agent transcript steps at 5 each, the 3-minute labels scan
    # and the 3-minute spend record come to 66, and everything else here
    # carries no cap of its own — the
    # `fetch-depth: 0` checkout, apt, the artifact download, the label-line
    # count, the scanner path clear, the two artifact uploads, the short-batch
    # refusal, the record move and its restore, the measure
    # composite (which also revalidates the data root) or, on the side-coding
    # frame in its place, the modes download and the side-code stamp, and the
    # hand-off staging and upload. Twelve minutes for that set is headroom for the one
    # thing worth naming: the measure composite, which runs the labels through
    # `qp-topics` and then revalidates the whole data root. The PR itself is
    # opened by `qp-topic-publish`, on its own clock. The diagnostic steps
    # deliberately run before measure, so their worst case is charged first —
    # a run that publishes nothing must still be readable, and a run that
    # publishes must not lose its hand-off to a clock the diagnostics spent.
    timeout-minutes: 78
    environment: ${{ github.ref_name == 'main' && 'prod' || github.ref_name }}
    concurrency:
      group: run-analytics-qp-topic-label-${{ needs.qp-topic-resolve.outputs.frame }}-${{ github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: read
    outputs:
      # Whether anything was handed off — the measured artifact, the run's
      # spend record, or both; `qp-topic-publish` runs on this alone, so the
      # labeling step's own verdict never reaches it.
      publish: ${{ steps.publish_upload.outcome }}
    env:
      # The actor string recorded on the labels artifact, and the model the
      # agent step runs. Both come from the one resolved model so the recorded
      # labeler can never drift from what actually ran. Passed through the
      # environment rather than interpolated into a shell line, as with the
      # corpus-stats filters above.
      LABELER: claude-code/${{ needs.qp-topic-resolve.outputs.model }}
      # Which frame this run labels, and the labels file it accrues. Both
      # are read off `qp-topic-resolve` alone, so the extract, the measurement
      # and the PR can never name different frames.
      QP_FRAME: ${{ needs.qp-topic-resolve.outputs.frame }}
      LABELS_NAME: ${{ needs.qp-topic-resolve.outputs.labels-name }}
      LABELS_DIR: ${{ needs.qp-topic-resolve.outputs.labels-dir }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: ./.github/actions/setup-python-env
        with:
          restore-cache: "false"

      # Recorded before the agent runs, because `setup-uv` installs into a
      # runner-user-writable directory and `$GITHUB_PATH` is appendable from
      # any step — the labeling step's subprocesses included — with the runner
      # applying those writes to every step that follows. Both halves matter:
      # the path says *which* binary the scanner install below runs, and the
      # digest says it is the same bytes. A step output is the right place for
      # them because the runner consumes and discards the file that carries it
      # while this step is still the current one.
      - name: Record the uv binary and its digest
        id: uv-bin
        run: |
          set -euo pipefail
          path=$(command -v uv)
          test -n "$path"
          echo "path=$path" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$path" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Download the extract
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: qp-texts
          # Under $RUNNER_TEMP for the same reason the extract job wrote it
          # there: petition text never lands inside the checkout. The `qp-io`
          # subdirectory is the labeler's ONE granted path outside the checkout
          # (`--add-dir` below) — it holds exactly the extract and the output
          # slot, and never the oracle, which sits beside it in $RUNNER_TEMP
          # where the grant does not reach.
          path: ${{ runner.temp }}/qp-io

      # The regression tripwire for the split above: the agent step must inherit
      # no cloud credential from the job env. This job assumes no role at all, so
      # this proves the labeling half stays that way even if a future edit adds a
      # corpus step to it. Named for what it checks: the agent's env necessarily
      # carries the engine's own API key, and this asserts nothing about that.
      - name: Assert no cloud credential in the agent env
        run: |
          set -euo pipefail
          # Any AWS_* variable except the region names is treated as
          # credential-conferring (static keys, session tokens, and the
          # role-ARN/web-identity pair alike). The OIDC pair is checked too:
          # granting this job `id-token: write` would let the agent mint its own
          # web identity and assume the role with no AWS_* variable in sight.
          if env | grep -E '^AWS_' | grep -vE '^AWS_(REGION|DEFAULT_REGION)=' > /dev/null; then
            echo "::error::AWS credential variables leaked into the job env"
            exit 1
          fi
          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "::error::OIDC token minting is reachable from the agent env"
            exit 1
          fi
          echo "no cloud credential in the agent env"

      # The same structural prohibition the cell workflows apply, adapted to the
      # one agent that legitimately needs the directory back: `data/qp-topics/`
      # holds the hand reference set this run is measured against, and reading
      # it while labeling does not improve the labels — it destroys the
      # measurement, because agreement with a file you copied from is agreement
      # with nothing. A cell can simply delete it; this job has to restore it
      # for the measure step, so move it aside instead. Restoring under `git
      # checkout` (not a copy back) means the pristine-tree assertion below is
      # checking bytes from the commit, not bytes the agent could have written.
      - name: Move the reference set out of the labeler's tree
        run: |
          set -euo pipefail
          mv data/qp-topics "$RUNNER_TEMP/qp-topics-oracle"
          # The policy-area hand labels are the application frame's second
          # measurement set, and they ship inside the package, so they leave
          # the tree the same way.
          mv src/fedcourtsai/policy_areas.json "$RUNNER_TEMP/policy-areas-oracle.json"

      # The rest of the committed record leaves the agent's tree too: the
      # docket records, the outcomes and gradings under `data/`, and the
      # published figures under `metrics/`. No labeling frame reads them — each
      # agent codes from its extract alone — and for the merits side coder they
      # are outcome leakage outright, since a grant it codes may already carry
      # a committed outcome. Moved aside rather than deleted, and restored from
      # the commit by the pristine assertion below, for the same reason as the
      # reference set.
      - name: Move the committed record out of the labeler's tree
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/record-aside"
          mv data "$RUNNER_TEMP/record-aside/data"
          mv metrics "$RUNNER_TEMP/record-aside/metrics"

      # AGENTS.md, CLAUDE.md and .claude/ (the reviewer subagents) are the
      # repository's instructions for development sessions, which Claude Code
      # and Codex load from the tree on their own. No process digest hashes them, so they leave the agent's
      # tree and the prompt template is its whole contract. Marked
      # skip-worktree first, so `git status` stays clean and an agent tidying
      # its checkout cannot write them back; nothing after the agent reads them.
      - name: Remove the development instructions from the agent's tree
        run: |
          set -euo pipefail
          git ls-files -z -- AGENTS.md CLAUDE.md .claude | git update-index -z --skip-worktree --stdin
          rm -f AGENTS.md CLAUDE.md
          rm -rf .claude

      # The labeler runs with CLAUDE_CODE_SUBPROCESS_ENV_SCRUB=1 (its tool
      # subprocesses must not inherit the engine API key), and the scrub's
      # isolation backend is bubblewrap, which the runner image does not
      # carry — without it the CLI refuses to start rather than degrade.
      # socat is the CLI's other sandbox dependency: absent, the sandbox
      # fails to initialize ("Sandbox dependencies not available"). The
      # labeler holds no shell at all — Bash is denied in the invocation
      # block below — but the CLI stands its sandbox up at startup
      # regardless, so both packages stay load-bearing.
      - name: Install bubblewrap and socat for the labeler's sandbox
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap socat

      # The action's bundled install left the CLI's native binary missing on
      # this job ("claude native binary not installed", while the action still
      # exited `is_error: false` with no output). Install the pinned CLI here
      # instead — the engine-cli action every claude cell uses, reading the one
      # pin in `.github/engines/<engine>/` — and hand the action the
      # executable, which skips its own install path entirely. The pin must stay
      # at or above the floor the newest `label_model` choice needs (an older
      # CLI refuses the model id).
      - name: Install the pinned Claude Code CLI for the labeler
        id: claude-cli
        timeout-minutes: 5
        # The pin `.github/engines/claude-code/` holds for every claude cell.
        uses: ./.github/actions/engine-cli
        with:
          engine: claude-code

      # Without the userns relaxation, bubblewrap's uid-map setup is refused
      # under the runner image's AppArmor policy and every scrubbed subprocess
      # dies ("bwrap: setting up uid map: Permission denied") — the same
      # probe-then-set the codex sandbox uses in integration-test.yml.
      - name: Enable unprivileged user namespaces for the subprocess scrub
        run: |
          set -euo pipefail
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          if sysctl -n kernel.unprivileged_userns_clone >/dev/null 2>&1; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi

      - name: Label the questions presented with Claude Code
        # Bound the agent below the job timeout so a runaway run trips this
        # *step* instead of the job-level timeout, which would cancel the runner
        # and leave nothing to report.
        id: label
        timeout-minutes: 40
        uses: anthropics/claude-code-action@925afb53776cf1a2b738c6bdbed37b4d4000ef13 # v1.0.262
        env:
          QP_TEXTS: ${{ runner.temp }}/qp-io/qp-texts.json
          LABELS_OUT: ${{ runner.temp }}/qp-io/qp-labels.jsonl
        with:
          # Auth is the Anthropic API key (pay-per-token), as for every automated
          # cell: see docs/budget.md.
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # The pinned, pre-installed CLI (see the install step above) — the
          # action skips its own installer, whose skipped postinstall left the
          # native binary missing.
          path_to_claude_code_executable: ${{ steps.claude-cli.outputs.path }}
          # The action refuses to start without a GitHub token, and both
          # alternatives are worse: its no-input fallback is an OIDC exchange
          # that mints an App installation token defaulting to
          # contents/issues/pull-requests *write*, and granting the
          # `id-token: write` that exchange needs would fail the no-OIDC guard
          # step above. So hand it the job's own token: the permissions block
          # above caps it at `contents: read`, and the labeler still comments
          # on nothing and opens nothing — carrying the labels off the runner
          # belongs to the steps below.
          github_token: ${{ github.token }}
          # Prompt caching is automatic; the API key's default 5-minute cache TTL
          # would expire mid-run over ~1,200 texts, so pin the 1-hour TTL.
          settings: |
            {
              "env": {
                "ENABLE_PROMPT_CACHING_1H": "1",
                "CLAUDE_CODE_SUBPROCESS_ENV_SCRUB": "1"
              }
            }
          # The kickoff prompt carries the variable contract inline: the agent
          # holds no shell to read the env mapping above with, so the prompt
          # text is the contract's only delivery channel. The mapping stays
          # because it names this job's two io paths where a reader of the
          # step expects to find them; a workflow-shape test pins both to the
          # granted directory, here and on the measure step.
          prompt: |
            Read ${{ needs.qp-topic-resolve.outputs.prompt }}, then label every
            row in the extract:

            QP_TEXTS=${{ runner.temp }}/qp-io/qp-texts.json
            LABELS_OUT=${{ runner.temp }}/qp-io/qp-labels.jsonl
            LABELER=claude-code/${{ needs.qp-topic-resolve.outputs.model }}
            QP_FRAME=${{ env.QP_FRAME }}

            These values are authoritative and literal: this run grants you no
            shell, so there is nothing to expand — use the paths as written.
            Write only $LABELS_OUT. Do not commit, push, or open a PR — the
            workflow handles git. You run headless with no interactive input; if
            you are blocked, say so plainly in your final message and stop — do
            not wait for a reply.
          # No `--mcp-config`: on every frame the extract is the agent's
          # entire evidentiary input (`qp-topic-v0` is text-only, and a
          # `qp-topic-v1` application row is read from its row alone).
          # Withholding the config closes the MCP half of that; the built-in
          # retrieval tools are closed on the denial flag below, since a grant
          # list leaves them reachable.
          # The permission posture is the scrub's: with
          # CLAUDE_CODE_SUBPROCESS_ENV_SCRUB set, the CLI hardens the
          # permission mode to `default` whatever the flag says and honors
          # explicit whole-tool grants alone — path-scoped rules are not
          # matched under the hardening — so the mode is declared as
          # what actually runs, and Write and Edit are granted outright.
          # That grant is strictly narrower than the bypass this lane's
          # fences were built to contain. What that grant does *not* do is
          # withhold anything: `--allowedTools` pre-approves, and delegation,
          # reads and a sandboxed shell command are not permission-gated at
          # all, so every tool this contract rules out is reachable until it
          # is named on `--disallowedTools` — which is why the rules the
          # labeling prompt states are listed there too, in three groups.
          # Delegation (Agent, and Explore, which searches through a subagent)
          # because the labeling run is a single headless session that nothing
          # it delegates can finish: a spawned subagent dies with the session,
          # its rows never reach the labels file, and the measure step refuses
          # the partial. The shell (Bash) because the contract needs reads —
          # free in default mode, with the io directory reachable through the
          # --add-dir grant — and one written file, and because a command is
          # what would let a script produce labels the labeler never read.
          # Retrieval (WebFetch, WebSearch) because the extract is the whole
          # evidentiary input: a label is defined by what its question asks,
          # so anything fetched is either redundant or later than the
          # petition, and the later kind is what docs/qp-topic.md keeps out of
          # a label to hold it replay-safe. `Task` is the delegation tool's older
          # name, carried so the denial survives a CLI generation that still
          # uses it — a denied name the running CLI does not carry costs
          # nothing, and every name here is denied whether or not this
          # generation advertises it.
          # `--max-turns` is sized to leave the 40-minute step cap the binding
          # bound, because the step cap is the one the ceiling is derived from
          # (docs/qp-topic.md) and the one whose expiry still leaves the rows
          # the run wrote on disk. A turn cap does not: the action fails the
          # step *after the fact* when a successful result used more turns than
          # the cap allows, so the complaint lands once every label line is
          # already written, and a cap inside the pace buys nothing and costs a
          # finished batch. The two complete ceiling-sized batches at the
          # finishing tier took 76 and 128 turns, so 200 sits clear of the
          # measured range — and the measure step below keys on the label-line
          # count rather than on this step's verdict in any case.
          claude_args: |
            --model ${{ needs.qp-topic-resolve.outputs.model }}
            --max-turns 200
            --permission-mode default
            --allowedTools Write,Edit
            --disallowedTools Agent,Task,Explore,Bash,WebFetch,WebSearch
            --add-dir ${{ runner.temp }}/qp-io

      # The progress record, and the one that costs nothing to keep. The
      # labeling prompt tells the labeler to land each slice in $LABELS_OUT as
      # it finishes, so the line count *is* how far the run got — and it is the
      # only number that separates a slow labeler from a stuck one when the
      # step hits its cap, which is the path that leaves no execution file to
      # read (the action writes that at exit). Runs first among the post-agent
      # steps and on every outcome the runner survives, because everything
      # below it can withhold: the scanner build reaches the network and the
      # scan can hit. A count, never a byte of the file — this line goes to a
      # public step summary with no scan ahead of it, so it carries arithmetic
      # only. The count is taken the way `read_label_lines` reads the file —
      # non-blank lines, final newline or not — because the measure step gates
      # on it equalling the extract's batch size, and `wc -l`'s newline count
      # differs from that in both directions: it drops a complete last line
      # that was written without a trailing newline (refusing a finished
      # batch) and counts a stray blank one.
      - name: Count the label lines the run left behind
        id: label_lines
        if: ${{ !cancelled() }}
        env:
          LABELS_OUT: ${{ runner.temp }}/qp-io/qp-labels.jsonl
          # `awk` comes off PATH like every other tool a verdict rests on, and
          # `$GITHUB_PATH` — appendable from the labeling step's subprocesses —
          # prepends ahead of everything for every later step. A shimmed `awk`
          # is a stuck run reporting a healthy count — and, since the measure
          # step gates on this number, a partial run reporting a full batch.
          # PATH is pinned to the root-owned directories exactly as the
          # scanner steps below pin it.
          PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        run: |
          set -euo pipefail
          if [ -f "$LABELS_OUT" ]; then
            lines=$(awk 'NF{n++} END{print n+0}' "$LABELS_OUT")
            present=true
          else
            lines=0
            present=false
          fi
          echo "present=$present" >> "$GITHUB_OUTPUT"
          # The count itself, not just its presence: the measure step gates on
          # it equalling the extract's batch size, so this number — arithmetic
          # off a PATH the agent cannot shim — is what decides whether the run
          # publishes.
          echo "lines=$lines" >> "$GITHUB_OUTPUT"
          echo "The labeling step left ${lines} label line(s) on the runner." \
            >> "$GITHUB_STEP_SUMMARY"
          echo "label lines written: ${lines}"

      # The labeler's only declared output is $LABELS_OUT, in the granted
      # `qp-io` directory under $RUNNER_TEMP — the checkout is read-only
      # territory by contract — so
      # a modified work tree is a contract violation. The reference set is out of
      # reach above; the gate itself is not, because `setup-python-env` installs
      # the project editable and `uv run fedcourts qp-topics` therefore executes
      # `fedcourtsai.pipeline.qp_topics` from this checkout — a one-line edit to
      # AGREEMENT_GATE would pass the measure step and then be erased by the PR
      # step's branch cut, leaving a reviewer a clean diff over a rigged number.
      - name: Restore the reference set and assert the tree is pristine
        id: pristine
        # `!cancelled()` so this runs — and records a real success/failure
        # outcome — even when the labeling step failed: a run that both failed
        # and tampered should say which, and a skipped assertion says nothing.
        # Idempotent on every early-exit path (the rm tolerates a missing dir;
        # the checkout is a no-op when the move step never ran), and its
        # success never revives the job. The measure and PR steps below key on
        # the label-line count rather than on the default `success()` gate, and
        # a named `if:` drops the implicit `success()` — so this assertion is
        # named in their conditions explicitly. That gating is this
        # assertion's whole job: it is about a *rigged number*, since the
        # measure step does run this checkout's `fedcourts qp-topics`.
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/qp-topics-oracle" "$RUNNER_TEMP/record-aside" \
            "$RUNNER_TEMP/policy-areas-oracle.json"
          rm -f src/fedcourtsai/policy_areas.json
          git checkout -- src/fedcourtsai/policy_areas.json
          # From the commit, not from the copy: whatever the agent did to the
          # tree, the files the gate measures against are the reviewed ones.
          # The rm before the checkout is load-bearing for the accrual base:
          # `git checkout --` restores tracked files only, and the measure
          # step reads the committed labels artifact from this path — an
          # untracked file the agent planted there would survive a bare
          # restore, ride into the union as carried rows, and publish. Wipe
          # the directory, restore the tracked truth, and refuse any
          # untracked residue the porcelain still shows.
          # The whole committed record first, by the same rule: the moved-aside
          # `data/` and `metrics/` are discarded and restored from the commit,
          # so the side coder's publish step accrues onto the reviewed codes
          # file and the measure step revalidates reviewed records.
          rm -rf data metrics
          git checkout -- data metrics
          rm -rf data/qp-topics
          git checkout -- data/qp-topics
          if ! git diff --quiet || ! git diff --cached --quiet; then
            echo "::error::the labeler modified tracked files; refusing to measure"
            git status --porcelain
            exit 1
          fi
          if [ -n "$(git status --porcelain -- data/qp-topics)" ]; then
            echo "::error::untracked content under data/qp-topics after the restore; refusing to measure"
            git status --porcelain -- data/qp-topics
            exit 1
          fi
          if [ -n "$(git status --porcelain -- data metrics)" ]; then
            echo "::error::untracked content under data/ or metrics/ after the restore; refusing to measure"
            git status --porcelain -- data metrics
            exit 1
          fi
          echo "work tree pristine"

      # The scan below runs Python with the engine API key in its environment,
      # so every byte it imports has to be a byte the labeler could not have
      # written. `setup-python-env` installs this project *editable*, which
      # puts the workspace tree and its gitignored `.venv` on the import path
      # — and the labeler holds an unscoped Write grant in that workspace. The
      # assertion above does not close this: it compares *tracked* files, so an
      # untracked module, or a `.pth` dropped into the venv, is invisible to
      # it. Nor would a venv built before the agent ran, wherever it sat: the
      # agent writes to any path on this runner by naming it.
      # What it cannot reach is a source tree that does not exist while it
      # runs and is fetched over the network once it is gone. So the scanner
      # comes from a second checkout of this run's own commit, taken here,
      # into its own path, with the scanner installed from it into a venv
      # inside that same fresh tree, resolved through a package cache inside
      # it too. (Under the workspace, because `checkout` forces `path` there —
      # but nothing in it comes from the labeler's tree, its venv, its object
      # store, or uv's cache in the runner user's home.)
      # The import path does not end at the tree, so neither does the
      # isolation: the venv is built on a *managed* interpreter downloaded
      # into the same fresh path (uv's default install dir sits in the runner
      # user's home, and a `sitecustomize.py` there is on every venv's
      # `sys.path`), git reads no global or system config for the clone
      # (`core.hooksPath` and `init.templateDir` are code, and both fire during
      # a checkout), and the steps run with the interpreter's own environment
      # levers unset — the runner applies `$GITHUB_ENV` and `$GITHUB_PATH`
      # writes from *earlier* steps to later ones, and the labeling step's
      # subprocesses can append to those files.
      # What stays trusted, named rather than implied: the action bundles the
      # runner unpacked before this job's first step — `actions/checkout`'s own
      # JavaScript and the node that runs it sit in a runner-user-writable
      # path and are pinned by identity, not by bytes; the runner image's files
      # behind the passwordless sudo the runner user holds (which is where
      # PATH-pinning puts `git` and `sha256sum`); and anything a process the
      # agent left behind does between these steps. What is removed is the
      # drop-a-file class on the scanner's *Python import path* and on the
      # toolchain that builds it — the class the assertion above cannot see,
      # and the one an editable install hands over for free.
      # Built for either agent-written surface this job can publish — the
      # transcript and the partial labels file — so the gate is "there is
      # something to scan", not "there is a transcript": the capped run has no
      # execution file and is exactly the run whose labels must still travel.
      - name: Clear the isolated scanner path
        id: scanner_clear
        if: >-
          ${{ !cancelled() && (steps.label.outputs.execution_file != ''
          || steps.label_lines.outputs.present == 'true') }}
        # A `.git` the agent planted at this path would be *reused* by the
        # checkout below rather than replaced, and its hooks would run during
        # the checkout. Remove the path so the clone is a clone — and the
        # checkout is gated on this succeeding, because a swallowed `rm`
        # failure is precisely the case that hands the checkout that `.git`.
        # The empty config file is where git's `--global` writes go for the two
        # steps below (`actions/checkout` records a `safe.directory` there);
        # created here, after the agent, so it holds only what they put in it.
        continue-on-error: true
        env:
          # `rm` comes off PATH like everything else, and a shimmed one that
          # exits 0 without removing anything is this step reporting success
          # over the `.git` it was meant to delete. Root-owned directories only,
          # here and on the two steps below.
          PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        run: |
          set -euo pipefail
          rm -rf "${GITHUB_WORKSPACE:?}/.transcript-scanner"
          : > "${RUNNER_TEMP:?}/scanner-gitconfig"

      - name: Check out the scanner afresh from GitHub
        id: scanner_src
        if: ${{ !cancelled() && steps.scanner_clear.outcome == 'success' }}
        # This step and the install below carry the scan's own posture, for the
        # scan's own reason: this run's artifact is the labels `qp-topics`
        # publishes, and a network blip on a diagnostic surface must never cost
        # them — not the transcript's, and not the partial labels file's, which
        # is uploaded through the same chain and withheld with it. A scanner that
        # failed to build leaves the scan with no executable, which is the
        # fail-closed path it already has — withhold, do not fail. The timeout
        # bounds the clock too: `continue-on-error` bounds only the outcome.
        continue-on-error: true
        timeout-minutes: 5
        env:
          GIT_CONFIG_GLOBAL: ${{ runner.temp }}/scanner-gitconfig
          GIT_CONFIG_NOSYSTEM: "1"
          # The action finds `git` on PATH, and `$GITHUB_PATH` prepends ahead
          # of everything — so a shim would be the thing doing this "fresh
          # clone". Pinning PATH puts `git` in the same class as the rest of
          # the runner image: behind sudo.
          PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This run's own commit — the bytes the workflow itself was read
          # from — fetched from the remote. Stated rather than defaulted,
          # because the property that matters is that it is resolved against
          # GitHub and never out of the workspace's object store, which the
          # agent could have rewritten as freely as the work tree.
          ref: ${{ github.sha }}
          path: .transcript-scanner
          persist-credentials: false

      - name: Install the scanner into its own venv
        id: scanner_install
        if: ${{ !cancelled() && steps.scanner_src.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 5
        env:
          # A package cache the labeler can write is on the import path just as
          # surely as a venv it can write, and uv's default cache and managed
          # interpreters both sit under the runner user's home. Resolve through
          # a cache and an interpreter inside the fresh tree instead: every
          # dependency is fetched now and checked against the freshly
          # checked-out lockfile's hashes, and uv checksums the interpreter.
          UV_CACHE_DIR: ${{ github.workspace }}/.transcript-scanner/.uv-cache
          UV_PYTHON_INSTALL_DIR: ${{ github.workspace }}/.transcript-scanner/.uv-python
          UV_BIN: ${{ steps.uv-bin.outputs.path }}
          UV_SHA256: ${{ steps.uv-bin.outputs.sha256 }}
          GIT_CONFIG_GLOBAL: ${{ runner.temp }}/scanner-gitconfig
          GIT_CONFIG_NOSYSTEM: "1"
          # Same reason as the checkout above: `git` and `sha256sum` are found
          # on PATH, and `$GITHUB_PATH` prepends ahead of everything.
          PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        run: |
          set -euo pipefail
          # Every lever that puts a caller's code inside a process it starts,
          # and every one of them is settable from an earlier step's
          # `$GITHUB_ENV`. Unset for the whole block: it builds the scanner.
          unset PYTHONPATH PYTHONHOME PYTHONSTARTUP PYTHONUSERBASE
          unset LD_PRELOAD LD_AUDIT LD_LIBRARY_PATH
          # `uv` lives where `setup-uv` put it, which the runner user can
          # rewrite without sudo — so the pre-agent digest, not just the path.
          echo "${UV_SHA256}  ${UV_BIN}" | sha256sum --check --status || {
            echo "::error::the uv binary changed while the labeler ran; refusing to scan"
            exit 1
          }
          cd "${GITHUB_WORKSPACE}/.transcript-scanner"
          # This tree must be this commit and nothing else. A `.git` that
          # survived the clear step would have been reused rather than cloned,
          # and anything its hooks wrote during the checkout shows up here.
          # `--ignored` because the one thing a hook would plant — a `.venv`
          # that `uv sync` then reuses, `.pth` files and all — is a path
          # `.gitignore` hides. Checked before the sync, which adds ignored
          # paths of its own.
          if [ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]; then
            echo "::error::the scanner checkout is not this run's commit; refusing to scan"
            exit 1
          fi
          if [ -n "$(git status --porcelain --untracked-files=all --ignored)" ]; then
            echo "::error::the scanner checkout is not a clean clone; refusing to scan"
            exit 1
          fi
          # Runtime dependencies only — the scanner is one CLI command, and the
          # dev group is a wider supply chain to admit for no gain here.
          # `--no-config` skips the user-level `uv.toml` (agent-writable, and
          # nothing this install needs is in one); `--python 3.12` pins the
          # managed interpreter to the project's floor rather than letting the
          # newest one uv can fetch decide what the scanner runs on.
          "$UV_BIN" sync --locked --no-default-groups --no-config \
            --managed-python --python 3.12
          # Fail here rather than inside the scan if the scanner is unusable.
          ./.venv/bin/python -E -s -P -m fedcourtsai.cli scan-diff-for-secrets --help >/dev/null

      # The transcript is the only record of *how* the labeler failed: the
      # action reports a summary block and discards the turn-by-turn log with
      # the runner, so a success-that-wrote-nothing run (the shape this job
      # can produce) is undiagnosable without a paid re-run. Which is why the
      # tree's state is not among the things the scan is gated on: a tampered
      # tree is a run that badly needs diagnosing, and with the scanner
      # installed out of the labeler's reach above, running it there costs
      # nothing. What it *is* gated on is that install having happened. Scan
      # before publishing — the transcript is agent-authored bytes no other
      # scan sees — and withhold on a hit rather than fail the job, mirroring
      # the collect job's withhold-and-continue posture (minus its
      # trigger-issue report: a dispatch mode has none, so the warning and the
      # step summary are the record). The one credential reachable from the
      # labeler's env is the engine's own API key, so the scan searches for
      # that value literally, exactly as the collect job's scan holds its
      # reachable credential: the agent process is gone by this step, which
      # parses bytes with tested Python and executes none of them. On this
      # surface the generic entropy rule is off (see the run block below), so
      # the literal containment plus the structured credential shapes are the
      # whole gate — which is exactly why the scan failing closed on an unset
      # variable is load-bearing here.
      - name: Scan the transcript before publishing it
        id: transcript_scan
        # Gated on the scanner having been built, not merely on a transcript
        # existing: `$SCANNER` names a path inside the workspace, so a step
        # that ran without the install having run would execute whatever is
        # sitting there. The bash-127 route reaches the same withheld artifact,
        # but only by way of a path this step would have already taken.
        if: >-
          ${{ !cancelled() && steps.scanner_install.outcome == 'success'
          && steps.label.outputs.execution_file != '' }}
        continue-on-error: true
        timeout-minutes: 5
        # Runs inside the fresh tree, not the workspace: `python -m` puts the
        # working directory first on `sys.path`, and the workspace is the tree
        # the labeler wrote to. `-P` below is the direct fix; this is the same
        # answer from the other side, so neither alone is load-bearing.
        working-directory: ${{ github.workspace }}/.transcript-scanner
        env:
          TRANSCRIPT: ${{ steps.label.outputs.execution_file }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # The isolated install above, by absolute path: a bare `uv run` would
          # resolve the project out of the workspace the labeler just wrote to.
          SCANNER: ${{ github.workspace }}/.transcript-scanner/.venv/bin/python
        run: |
          set -euo pipefail
          # This is the one step that holds the key, so it is the one an
          # injected environment variable is worth aiming at: the runner
          # applies every earlier step's `$GITHUB_ENV` writes here, and the
          # labeling step's subprocesses can append to that file. A planted
          # `PYTHONPATH` or `LD_PRELOAD` would put agent code inside this
          # process whatever the import path says. `-E -s -P` below covers the
          # PYTHON* family and the implicit cwd entry exhaustively; the unset
          # covers the loader's.
          unset PYTHONPATH PYTHONHOME PYTHONSTARTUP PYTHONUSERBASE
          unset LD_PRELOAD LD_AUDIT LD_LIBRARY_PATH
          # Named here rather than left to the scanner's own exit 2, because
          # the working directory above is not the workspace: a transcript path
          # that is workspace-relative resolves to nothing from here, and a
          # withheld artifact whose only record is "exit 2" is the diagnostic
          # dying in the diagnostic.
          if [ ! -r "$TRANSCRIPT" ]; then
            echo "::warning::no readable transcript at ${TRANSCRIPT}; withholding the artifact"
            echo "transcript withheld: execution file not readable" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          status=0
          # The transcript surface flag, not the generic extra-file suite: the
          # transcript's own tool and request ids are high-entropy by format,
          # so the generic heuristic convicts every real file and the artifact
          # would only ever publish empty — the surface is gated by containment
          # of the one reachable credential and the credential shapes instead.
          "$SCANNER" -E -s -P -m fedcourtsai.cli scan-diff-for-secrets --name-status-file /dev/null \
            --known-secret-env ANTHROPIC_API_KEY \
            --transcript-file "$TRANSCRIPT" \
            --run-url "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            || status=$?
          if [ "$status" -eq 1 ]; then
            echo "::warning::transcript scan hit; withholding the qp-label-transcript artifact"
            echo "transcript withheld: secret scan hit" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          elif [ "$status" -ne 0 ]; then
            echo "::warning::transcript scan could not run (exit ${status}); withholding the artifact"
            echo "transcript withheld: scan did not run (exit ${status})" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Upload the transcript
        # Gated on the scan, not on the labeling step's outcome: a
        # gate-refusing run (sub-80% agreement) is as diagnostic as a
        # no-output one. `!cancelled()` covers every path the action survives;
        # the hard step-timeout kill is the one path with no execution file to
        # capture, and the step below says so.
        if: ${{ !cancelled() && steps.transcript_scan.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qp-label-transcript
          path: ${{ steps.label.outputs.execution_file }}
          if-no-files-found: warn
          # One day, for the same reason as the extract above, stated there in
          # full: the transcript necessarily embeds the QP text the agent read
          # from $QP_TEXTS, so it is the same disclosure class as `qp-texts`
          # and gets the same shortest-offered window — retention bounds the
          # window, not the audience, and docs/qp-topic.md argues the
          # disclosure out loud.
          retention-days: 1

      - name: Note a run with no transcript to capture
        if: ${{ !cancelled() && steps.label.outputs.execution_file == '' }}
        run: |
          echo "::warning::the labeling step reported no execution file; no transcript artifact this run"

      # The labels file goes off the runner on the same terms as the
      # transcript, and for the same reason: it is agent-written bytes, and a
      # run artifact on a public repository is downloadable by any logged-in
      # user. The file the *measure* step publishes is a different object — the
      # `qp-topics` command reads every row against the vocabulary and the
      # extract's keys before writing `data/qp-topics/qp-topics.json`, so the
      # published surface is gated by a validator. This one is not: it is
      # whatever the labeler wrote, uploaded before the validator runs and so
      # on the refused runs and the accepted ones alike — which is the point,
      # since the refused runs are the ones with no other record.
      # Unvalidated agent bytes are the transcript's own
      # class, so they take the transcript's control — the scanner built out of
      # the labeler's reach above, invoked here on the same terms, withholding
      # on a hit rather than failing the job. The generic surface, not
      # `--transcript-file`: a labels line is case ids, docket numbers and
      # vocabulary words, none of them high-entropy by format, so the entropy
      # heuristic that convicts every real transcript has no quarrel with this
      # file and there is no reason to switch it off.
      # Three minutes, where the transcript gets five: this is at most a
      # ceiling's worth of short JSON lines, and the job's post-agent budget is
      # counted in the timeout comment at the top of the job.
      - name: Scan the partial labels before publishing them
        id: labels_scan
        if: >-
          ${{ !cancelled() && steps.scanner_install.outcome == 'success'
          && steps.label_lines.outputs.present == 'true' }}
        continue-on-error: true
        timeout-minutes: 3
        working-directory: ${{ github.workspace }}/.transcript-scanner
        env:
          LABELS_OUT: ${{ runner.temp }}/qp-io/qp-labels.jsonl
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SCANNER: ${{ github.workspace }}/.transcript-scanner/.venv/bin/python
        run: |
          set -euo pipefail
          # This step holds the key, so it strips the levers that would put
          # agent code inside it — the transcript scan's reasoning, verbatim.
          unset PYTHONPATH PYTHONHOME PYTHONSTARTUP PYTHONUSERBASE
          unset LD_PRELOAD LD_AUDIT LD_LIBRARY_PATH
          # Named here rather than left to the scanner's exit 2, for the
          # transcript step's reason: the file was probed minutes ago, and a
          # withheld artifact whose only record is "exit 2" is the diagnostic
          # dying in the diagnostic.
          if [ ! -r "$LABELS_OUT" ]; then
            echo "::warning::no readable labels file at ${LABELS_OUT}; withholding the artifact"
            echo "partial labels withheld: file not readable" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          status=0
          "$SCANNER" -E -s -P -m fedcourtsai.cli scan-diff-for-secrets --name-status-file /dev/null \
            --known-secret-env ANTHROPIC_API_KEY \
            --extra-file "$LABELS_OUT" \
            --run-url "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            || status=$?
          if [ "$status" -eq 1 ]; then
            echo "::warning::labels scan hit; withholding the qp-labels artifact"
            echo "partial labels withheld: secret scan hit" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          elif [ "$status" -ne 0 ]; then
            echo "::warning::labels scan could not run (exit ${status}); withholding the artifact"
            echo "partial labels withheld: scan did not run (exit ${status})" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Upload the partial labels
        # Every path the runner survives, the capped one above all: the measure
        # step refuses a file short of one line per extract row, and this is
        # what it refused. The count line above says how far the run got; this
        # says which rows they were, which is what re-deriving the lane's
        # ceiling from a measured pace needs.
        if: ${{ !cancelled() && steps.labels_scan.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qp-labels
          path: ${{ runner.temp }}/qp-io/qp-labels.jsonl
          if-no-files-found: warn
          # One day, as for the extract and the transcript: the labels carry the
          # case ids of the ingested corpus, which no committed surface
          # enumerates until the measure step publishes them — and the runs
          # this artifact exists for are the ones where it never does.
          retention-days: 1

      # Where a wasted run gets its redness. The gate below skips a short run
      # rather than letting `qp-topics` refuse it, and a skip is silent: a
      # labeler that ended its turn cleanly having written half the batch would
      # otherwise leave a green run and a summary line nobody reads — the
      # `is_error: false` abort the measure composite's no-output assertion was
      # written for is exactly that shape. So the count is checked out loud, on
      # every outcome the runner survives. A run whose labeling step failed
      # is already red and this adds a second, more specific reason; a complete
      # run skips it. Nothing downstream is gated on this step: the measure
      # step and the hand-off carry their own conditions, so failing here
      # cannot cost a complete batch its PR.
      - name: Refuse a labels file short of the batch
        if: >-
          ${{ !cancelled()
          && steps.label_lines.outputs.lines != needs.qp-topic-extract.outputs.batch-rows }}
        env:
          WRITTEN: ${{ steps.label_lines.outputs.lines }}
          EXPECTED: ${{ needs.qp-topic-extract.outputs.batch-rows }}
        run: |
          set -euo pipefail
          echo "::error::the labeler wrote ${WRITTEN:-no} label line(s) for a ${EXPECTED}-row" \
            "extract; qp-topics publishes only a complete file, so this run measured and" \
            "published nothing. The qp-labels artifact holds the rows it did write."
          exit 1

      # The post-label half — assert the labeler wrote its declared output,
      # measure against the reference set, publish-or-refuse, re-validate —
      # lives in the shared composite so the token-free `qp-topic`
      # integration-test scenario exercises the exact steps this paid run
      # depends on. Placed after the tree-pristine check, so a run that both
      # tampered and wrote nothing reports the higher-signal tamper first.
      - name: Measure the run against the reference set
        id: measure
        # Publication keys on what the labeler *wrote*, never on the action's
        # verdict. `claude-code-action` fails the step after the fact when a
        # successful result used more turns than `--max-turns` allows, and that
        # verdict arrives after the last label line is already on disk — so a
        # complete, gate-clearing batch would otherwise lose its measurement
        # and its PR to a bookkeeping complaint. The gate is instead the count
        # step's number against the extract job's batch size: equal means one
        # label line per extract row, which is exactly what `qp-topics` refuses
        # to publish without. A short file therefore never reaches this step —
        # the refusal above is what makes that run red — and the labeling
        # step's own exit stays its own, so a turn overrun still fails the job.
        #
        # `!cancelled()` rather than `always()`: a cancelled run must publish
        # nothing. And the tree-pristine assertion is named here because a
        # named `if:` carries no implicit `success()` — this command runs
        # `fedcourts qp-topics` out of the checkout the
        # labeler held a Write grant over, and measuring a rigged tree is the
        # one thing that gate exists to stop. The diagnostic chain between them
        # (scanner build, scans, uploads) is deliberately absent: those steps
        # withhold rather than fail by design, and a diagnostic must not cost
        # the labels. Everything ahead of the agent — the no-cloud-credential
        # tripwire and the oracle move above all — is covered by the count
        # rather than by name: each of them failing skips the labeling step, so
        # the file is empty and no non-zero batch size can equal zero.
        if: >-
          ${{ !cancelled() && steps.pristine.outcome == 'success'
          && env.QP_FRAME != 'alignment-sides'
          && steps.label_lines.outputs.lines != ''
          && steps.label_lines.outputs.lines == needs.qp-topic-extract.outputs.batch-rows }}
        uses: ./.github/actions/qp-topic-measure
        with:
          labels: ${{ runner.temp }}/qp-io/qp-labels.jsonl
          texts: ${{ runner.temp }}/qp-io/qp-texts.json
          labeler: ${{ env.LABELER }}
          # The extract job's count of the QP-bearing frame this batch was cut
          # from, as a value. It reaches the deterministic measure step only —
          # the agent has long finished by here — and lands on the batch's
          # ledger entry, where the docket pack reads it.
          frame-rows: ${{ needs.qp-topic-extract.outputs.frame-rows }}
          frame: ${{ env.QP_FRAME }}
          # The gate figures on either side of the gate, for the run's spend
          # record below: a refused run writes no labels file, so this is the
          # only place its measurement survives the runner.
          agreement-out: ${{ runner.temp }}/qp-agreement.json
          # A replicate records the run here and writes no labels file.
          replicate-out: >-
            ${{ needs.qp-topic-resolve.outputs.replicate == 'true'
            && format('{0}/qp-replicate.json', runner.temp) || '' }}
          # The prompt the labeler read, restored from the commit by the
          # pristine step; a replicate record carries its digest.
          prompt-file: ${{ needs.qp-topic-resolve.outputs.prompt }}
          transcript-hint: >-
            The qp-label-transcript run artifact carries the turn-by-turn
            transcript to diagnose from (absent only when the scan withheld it
            or the action died before writing it — see the labeling step's
            log), and the qp-labels artifact carries the rows the run did
            write, whose count the step summary states either way.

      # What the run cost, recorded whatever the gate decided: a refused or
      # short batch spends as much as one that publishes, and writes no labels
      # file to carry it. The engine's execution file is read and priced by
      # the rule every cell's usage.json is (`fedcourts qp-topic-spend`), from
      # the scanner's install — the one this job built out of the labeler's
      # reach — with no credential in the step's environment, so the record is
      # computed by code the labeler could not have written. The outcome comes
      # from the measure step's own result and the gate figures it wrote.
      # Withheld rather than failed: a missing record is a gap in the spend
      # ledger the summary names, and must not cost a complete batch its PR.
      # A run whose engine left no execution file (the step-cap kill) has
      # nothing to record, and the note below says so.
      # The side coder's frame has no reference set, so no measurement: this
      # step stamps the codes into the committed, append-only codes file
      # (`fedcourts alignment-side-codes`), on the same conditions the measure
      # step runs on — a pristine tree and one line per extract row — and its
      # success is the frame's publication gate. The modes sidecar is
      # downloaded here, after the agent step, and outside the `qp-io` grant,
      # so the coder never reads which of its cases are decided. What this
      # step writes is a gate and a preview, not what lands: it runs on a
      # runner the agent held, whose `uv` and gitignored `.venv` the pristine
      # assertion cannot vouch for, so `qp-topic-publish` re-stamps the codes
      # from the coder's lines alone on a runner no agent held, and publishes
      # that file and that report.
      - name: Download the side-coding modes sidecar
        id: modes
        if: >-
          ${{ !cancelled() && env.QP_FRAME == 'alignment-sides'
          && steps.pristine.outcome == 'success' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: alignment-modes
          path: ${{ runner.temp }}/alignment-modes

      - name: Stamp the side codes into the codes file
        id: side_codes
        if: >-
          ${{ !cancelled() && env.QP_FRAME == 'alignment-sides'
          && steps.pristine.outcome == 'success' && steps.modes.outcome == 'success'
          && steps.label_lines.outputs.lines != ''
          && steps.label_lines.outputs.lines == needs.qp-topic-extract.outputs.batch-rows }}
        env:
          MODEL: ${{ needs.qp-topic-resolve.outputs.model }}
          EXTRACT_SHA256: ${{ needs.qp-topic-extract.outputs.extract-sha256 }}
        run: |
          set -euo pipefail
          # A gate and a preview only (see above): the publish job repeats this
          # check and the stamp on a runner no agent held. The absolute path
          # keeps a `$GITHUB_PATH` shim from passing any file here.
          if [ -z "$EXTRACT_SHA256" ] || ! echo "${EXTRACT_SHA256}  ${RUNNER_TEMP}/qp-io/qp-texts.json" \
              | /usr/bin/sha256sum --check --status; then
            echo "::error::the extract is not the one the extract job cut; refusing to stamp codes from it"
            exit 1
          fi
          uv run fedcourts alignment-side-codes \
            --extract "$RUNNER_TEMP/qp-io/qp-texts.json" \
            --modes "$RUNNER_TEMP/alignment-modes/alignment-modes.json" \
            --codes "$RUNNER_TEMP/qp-io/qp-labels.jsonl" \
            --model "$MODEL" --run-id "$GITHUB_RUN_ID" \
            --report "$RUNNER_TEMP/side-codes-report.txt"
          uv run fedcourts validate "$LABELS_DIR"
          {
            echo '### side codes'
            echo '```'
            cat "$RUNNER_TEMP/side-codes-report.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "measured-file=$RUNNER_TEMP/side-codes-report.txt" >> "$GITHUB_OUTPUT"

      - name: Record the run's spend
        id: spend
        if: >-
          ${{ !cancelled() && steps.scanner_install.outcome == 'success'
          && steps.label.outputs.execution_file != '' }}
        continue-on-error: true
        timeout-minutes: 3
        working-directory: ${{ github.workspace }}/.transcript-scanner
        env:
          TRANSCRIPT: ${{ steps.label.outputs.execution_file }}
          SCANNER: ${{ github.workspace }}/.transcript-scanner/.venv/bin/python
          MODEL: ${{ needs.qp-topic-resolve.outputs.model }}
          BATCH_ROWS: ${{ needs.qp-topic-extract.outputs.batch-rows }}
          LABEL_LINES: ${{ steps.label_lines.outputs.lines }}
          REPLICATE: ${{ needs.qp-topic-resolve.outputs.replicate }}
          # A replicate's measure step succeeds without writing labels, so it
          # never counts as a published measurement.
          MEASURED: >-
            ${{ ((steps.measure.outcome == 'success'
            && needs.qp-topic-resolve.outputs.replicate != 'true')
            || steps.side_codes.outcome == 'success')
            && 'success' || 'unpublished' }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          unset PYTHONPATH PYTHONHOME PYTHONSTARTUP PYTHONUSERBASE
          unset LD_PRELOAD LD_AUDIT LD_LIBRARY_PATH
          published=--not-published
          if [ "$MEASURED" = success ]; then
            published=--published
          fi
          # A topic frame's gate figures only: the side coder has no gate, and
          # a file the agent planted at that path must not cost its frame the
          # spend record.
          agreement=()
          if [ "$QP_FRAME" != alignment-sides ]; then
            agreement=(--agreement-file "$RUNNER_TEMP/qp-agreement.json")
          fi
          if [ "$REPLICATE" = true ]; then
            agreement+=(--replicate-file "$RUNNER_TEMP/qp-replicate.json")
          fi
          status=0
          "$SCANNER" -E -s -P -m fedcourtsai.cli qp-topic-spend \
            --execution-file "$TRANSCRIPT" --frame "$QP_FRAME" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$RUN_ATTEMPT" --model "$MODEL" \
            --batch-rows "${BATCH_ROWS:-0}" --label-lines "${LABEL_LINES:-0}" "$published" \
            "${agreement[@]}" \
            --out "$RUNNER_TEMP/qp-spend.json" || status=$?
          if [ "$status" -ne 0 ]; then
            echo "::warning::the run's spend could not be recorded (exit ${status}); the spend ledger misses this run"
            echo "spend record: not written (exit ${status})" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          cost=$(jq -er '.estimated_cost_usd' "$RUNNER_TEMP/qp-spend.json")
          outcome=$(jq -er '.outcome' "$RUNNER_TEMP/qp-spend.json")
          echo "spend record: ${outcome} run, ~\$${cost} at the rate table" >> "$GITHUB_STEP_SUMMARY"

      - name: Note a run with no spend to record
        if: ${{ !cancelled() && steps.label.outputs.execution_file == '' }}
        run: |
          echo "::warning::the labeling step left no execution file, so this run's spend is not recorded"
          echo "spend record: none — the labeling step left no execution file to read" >> "$GITHUB_STEP_SUMMARY"

      # The PR is opened by `qp-topic-publish`, never here. This job ran an
      # agent with a Write grant over the checkout, and a process it leaves
      # behind lives until the job ends, long enough to read any later step's
      # environment out of /proc. The dev App token that opens the PR also
      # carries the App's bypass of `main`'s approval rule, so it is never
      # minted on a runner an agent has held. What crosses is the measured
      # artifact and the sanitized measured block, the two files the PR is
      # built from, copied out of the measure step's own outputs, plus the
      # run's spend record. The labels travel only where the measure step
      # succeeded: a named `if:` carries no implicit `success()`, and the
      # labeling step's post-hoc turn complaint is precisely the failure the
      # hand-off must survive. The outcome is the narrower gate anyway — it
      # holds only where the measure step's own condition held (pristine
      # tree, a full batch on disk) *and* the publication gate then passed.
      # The spend record travels on every outcome it was written on, with the
      # measured block of a refused run beside it for the PR body, so a run
      # that published nothing still lands what it cost.
      - name: Stage the measured artifact for the publish job
        id: stage_publish
        if: >-
          ${{ !cancelled() && ((steps.measure.outcome == 'success'
          && needs.qp-topic-resolve.outputs.replicate != 'true')
          || steps.side_codes.outcome == 'success' || steps.spend.outcome == 'success') }}
        env:
          # The composite's declared output, not a path convention: where the
          # sanitized measured block lands is the measure step's contract.
          MEASURED_FILE: >-
            ${{ steps.measure.outputs.measured-file || steps.side_codes.outputs.measured-file }}
          # A replicate's measure step succeeds without writing labels, so it
          # never counts as a published measurement.
          MEASURED: >-
            ${{ ((steps.measure.outcome == 'success'
            && needs.qp-topic-resolve.outputs.replicate != 'true')
            || steps.side_codes.outcome == 'success')
            && 'success' || 'unpublished' }}
          SPENT: ${{ steps.spend.outcome }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/qp-publish"
          # A symlink planted at any path would ship whatever it points at.
          regular() {
            if [ -L "$1" ] || [ ! -f "$1" ]; then
              echo "::error::${1} is not a regular file; refusing to hand it off"
              exit 1
            fi
          }
          if [ "$MEASURED" = success ]; then
            regular "${LABELS_DIR}/${LABELS_NAME}"
            regular "$MEASURED_FILE"
            cp "${LABELS_DIR}/${LABELS_NAME}" "$RUNNER_TEMP/qp-publish/${LABELS_NAME}"
            cp "$MEASURED_FILE" "$RUNNER_TEMP/qp-publish/measured.txt"
            # The side coder's own lines too: the publish job re-stamps the
            # codes from them on a runner no agent held, and publishes that.
            if [ "$QP_FRAME" = alignment-sides ]; then
              regular "$RUNNER_TEMP/qp-io/qp-labels.jsonl"
              cp "$RUNNER_TEMP/qp-io/qp-labels.jsonl" "$RUNNER_TEMP/qp-publish/codes.jsonl"
            fi
          elif [ -n "$MEASURED_FILE" ] && [ -e "$MEASURED_FILE" ]; then
            # A refused run's measured block, for the spend record's PR body.
            regular "$MEASURED_FILE"
            cp "$MEASURED_FILE" "$RUNNER_TEMP/qp-publish/measured.txt"
          fi
          if [ "$SPENT" = success ]; then
            regular "$RUNNER_TEMP/qp-spend.json"
            cp "$RUNNER_TEMP/qp-spend.json" "$RUNNER_TEMP/qp-publish/spend.json"
          fi

      # One day, as for the extract and the transcript: the publish job reads
      # it within minutes, and the PR is the record.
      - name: Hand the measured artifact to the publish job
        id: publish_upload
        if: ${{ !cancelled() && steps.stage_publish.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qp-publish
          path: ${{ runner.temp }}/qp-publish
          if-no-files-found: error
          retention-days: 1

      # The rehearsal's boundary, stated where the operator reads — and on
      # every outcome the runner survives, not only success: a measure-gate
      # refusal is the single most informative rehearsal result, and it must
      # not be the one that leaves the operator inferring whether publication
      # was fenced or attempted.
      - name: Note the rehearsal boundary (publish fenced off this ref)
        if: ${{ !cancelled() && github.ref != 'refs/heads/main' }}
        run: |
          echo "qp-topic labeling rehearsal (${QP_FRAME} frame): whatever ran above, the labels PR is fenced to main-branch runs — nothing published from this dispatch." \
            | tee -a "$GITHUB_STEP_SUMMARY"

  # The labels PR, opened from a runner no agent has held. This is the token
  # holder: the one job of the labeling lane that mints the dev App token, and
  # it runs no engine, installs no agent CLI and assumes no role
  # (tests/test_workflow_token_holder.py). It takes the measured artifact and
  # the measured block from the label job as data, and runs only git, jq and
  # gh over them. The dev App's bypass covers `main`'s approval rule, and this
  # job opens a PR and never merges one; a maintainer merging it is what
  # keeps it read.
  qp-topic-publish:
    needs: [authorize, qp-topic-resolve, qp-topic-extract, qp-topic-label]
    # `!cancelled()` so a labeling step that failed after the fact (a turn
    # overrun on a complete batch) does not cost the batch its PR: the label
    # job's `publish` output is the measure step's gate, carried across.
    if: >-
      ${{ !cancelled() && needs.qp-topic-label.outputs.publish == 'success'
      && needs.authorize.result == 'success'
      && (needs.authorize.outputs.attempt == github.run_attempt
      || contains(needs.authorize.outputs.rerunners, format(',{0},', github.triggering_actor))) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    environment: ${{ github.ref_name == 'main' && 'prod' || github.ref_name }}
    concurrency:
      group: run-analytics-qp-topic-publish-${{ needs.qp-topic-resolve.outputs.frame }}-${{ github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      # The labeler string the PR title names, from the same resolved model
      # the label job recorded on the artifact.
      LABELER: claude-code/${{ needs.qp-topic-resolve.outputs.model }}
      # Which frame this run labels, and the labels file it accrues. Both
      # are read off `qp-topic-resolve` alone, so the extract, the measurement
      # and the PR can never name different frames.
      QP_FRAME: ${{ needs.qp-topic-resolve.outputs.frame }}
      LABELS_NAME: ${{ needs.qp-topic-resolve.outputs.labels-name }}
      LABELS_DIR: ${{ needs.qp-topic-resolve.outputs.labels-dir }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: ./.github/actions/setup-python-env
        with:
          restore-cache: "false"

      - name: Download the measured artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: qp-publish
          path: ${{ runner.temp }}/qp-publish

      # The side coder's harness fields — each code's grant date, mode and
      # contamination flag — are the clean check's leakage control, and the
      # labeling job stamped them on a runner its agent held. So they are
      # stamped again here, where no agent ran, from three inputs none of
      # which that runner could alter: the extract (checked against the digest
      # the extract job recorded before any agent started), the modes sidecar
      # (uploaded by the extract job and never downloaded by the agent's job
      # before its agent exited), and the coder's own lines. The re-stamped
      # file and its counts block replace the handed-off ones, so the PR
      # carries nothing the labeling runner computed but the coder's lines and
      # the spend record.
      - name: Download the side-coding extract for the re-stamp
        if: ${{ env.QP_FRAME == 'alignment-sides' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: qp-texts
          path: ${{ runner.temp }}/restamp-texts

      - name: Download the side-coding modes sidecar for the re-stamp
        if: ${{ env.QP_FRAME == 'alignment-sides' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: alignment-modes
          path: ${{ runner.temp }}/restamp-modes

      - name: Re-stamp the side codes from the coder's lines
        id: restamp
        if: ${{ env.QP_FRAME == 'alignment-sides' }}
        env:
          MODEL: ${{ needs.qp-topic-resolve.outputs.model }}
          EXTRACT_SHA256: ${{ needs.qp-topic-extract.outputs.extract-sha256 }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/qp-publish"
          lines="$dir/codes.jsonl"
          if [ ! -e "$lines" ] && [ ! -L "$lines" ]; then
            # A spend-record-only hand-off carries no codes, and must not.
            if [ -e "$dir/${LABELS_NAME}" ] || [ -L "$dir/${LABELS_NAME}" ]; then
              echo "::error::the side codes crossed without the coder's lines; refusing to publish them"
              exit 1
            fi
            echo "no side codes in the hand-off; nothing to re-stamp"
            exit 0
          fi
          if [ -L "$lines" ] || [ ! -f "$lines" ]; then
            echo "::error::the coder's lines are not a regular file"
            exit 1
          fi
          if [ -z "$EXTRACT_SHA256" ] || ! echo "${EXTRACT_SHA256}  ${RUNNER_TEMP}/restamp-texts/qp-texts.json" \
              | sha256sum --check --status; then
            echo "::error::the extract is not the one the extract job cut; refusing to stamp codes from it"
            exit 1
          fi
          uv run fedcourts alignment-side-codes \
            --extract "$RUNNER_TEMP/restamp-texts/qp-texts.json" \
            --modes "$RUNNER_TEMP/restamp-modes/alignment-modes.json" \
            --codes "$lines" \
            --model "$MODEL" --run-id "$GITHUB_RUN_ID" \
            --report "$RUNNER_TEMP/restamp-report.txt"
          cp "${LABELS_DIR}/${LABELS_NAME}" "$dir/${LABELS_NAME}"
          cp "$RUNNER_TEMP/restamp-report.txt" "$dir/measured.txt"
          rm -f "$lines"
          echo "re-stamped the side codes on the publish runner"

      # Every file crossed from a runner the labeler held, after the measure
      # and spend steps wrote them, so each is checked again here before any
      # token exists, on every ref so a rehearsal exercises it. The hand-off
      # holds the labels file and the measured block together or not at all,
      # the spend record, or both — nothing else, as regular files, with the
      # measured block no larger than a measured block runs (a refused run's
      # block may travel beside its spend record alone). The labels file is
      # held to this checkout's strict model — every field a copied key, a
      # vocabulary enum, a bool, or a stamp the builder assigns — and so is the
      # spend record, under the name its own run id and attempt spell, which
      # must be this run's. Every file is scanned for secrets, since the block
      # lands in a public PR body and was not re-derived here. A false positive
      # costs the batch its PR; a leaked key in that body costs more. The PR
      # step copies the same bytes from $RUNNER_TEMP, and the checkout's tree
      # is discarded there.
      - name: Re-validate the measured artifact
        id: revalidate
        env:
          REPO: ${{ github.repository }}
          REPLICATE: ${{ needs.qp-topic-resolve.outputs.replicate }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/qp-publish"
          extra=$(find "$dir" -mindepth 1 ! -path "$dir/${LABELS_NAME}" ! -path "$dir/measured.txt" \
            ! -path "$dir/spend.json")
          present=()
          for f in "$dir/${LABELS_NAME}" "$dir/measured.txt" "$dir/spend.json"; do
            if [ -e "$f" ] || [ -L "$f" ]; then
              if [ -L "$f" ] || [ ! -f "$f" ]; then extra="${extra} ${f}"; fi
              present+=("$f")
            fi
          done
          if [ -n "$extra" ]; then
            echo "::error::the hand-off may hold ${LABELS_NAME}, measured.txt and spend.json alone, as regular files"
            exit 1
          fi
          labels=false
          if [ -f "$dir/${LABELS_NAME}" ]; then
            # Checked here, on the runner no agent held, as well as by the stage
            # step on the labeling runner: a replicate publishes nothing.
            if [ "$REPLICATE" = true ]; then
              echo "::error::a replicate's hand-off carries a labels file; refusing to publish it"
              exit 1
            fi
            labels=true
            if [ ! -f "$dir/measured.txt" ]; then
              echo "::error::the labels file crossed without its measured block"
              exit 1
            fi
          elif [ ! -f "$dir/spend.json" ]; then
            echo "::error::the hand-off holds neither labels nor a spend record"
            exit 1
          fi
          if [ -f "$dir/measured.txt" ] && [ "$(wc -c < "$dir/measured.txt")" -gt 65536 ]; then
            echo "::error::the measured block is over 64 KiB; refusing to put it in a PR body"
            exit 1
          fi
          if [ "$labels" = true ]; then
            mkdir -p "$LABELS_DIR"
            cp "$dir/${LABELS_NAME}" "${LABELS_DIR}/${LABELS_NAME}"
          fi
          spend_name=''
          if [ -f "$dir/spend.json" ]; then
            # The name is read from the record and held to this run before the
            # validator holds the record to the name, so a record cannot land
            # under another run's slot.
            run_id=$(jq -er '.run_id | strings' "$dir/spend.json") || run_id=''
            attempt=$(jq -er '.run_attempt | numbers' "$dir/spend.json") || attempt=''
            frame=$(jq -er '.frame | strings' "$dir/spend.json") || frame=''
            if [ "$run_id" != "$GITHUB_RUN_ID" ] || [ "$frame" != "$QP_FRAME" ]; then
              echo "::error::the spend record is not this run's ${QP_FRAME} record"
              exit 1
            fi
            case "$attempt" in
              ''|0|*[!0-9]*) echo "::error::the spend record carries no usable run attempt"; exit 1 ;;
            esac
            spend_name="${run_id}-${attempt}.json"
            mkdir -p data/qp-topics/spend
            cp "$dir/spend.json" "data/qp-topics/spend/${spend_name}"
          fi
          uv run fedcourts validate data/qp-topics
          if [ "$LABELS_DIR" != data/qp-topics ]; then
            uv run fedcourts validate "$LABELS_DIR"
          fi
          scan=()
          for f in "${present[@]}"; do scan+=(--extra-file "$f"); done
          if ! uv run fedcourts scan-diff-for-secrets --name-status-file /dev/null \
              "${scan[@]}" \
              --run-url "https://github.com/${REPO}/actions/runs/${GITHUB_RUN_ID}"; then
            echo "::error::secret scan did not pass; withholding the labels PR"
            exit 1
          fi
          echo "labels=$labels" >> "$GITHUB_OUTPUT"
          echo "spend-name=$spend_name" >> "$GITHUB_OUTPUT"

      # Minted after the hand-off is on this runner, and on `main`-ref runs
      # only: the dev App's credentials live on the prod environment alone, and
      # a rehearsal's labels stay off any branch — the measured block in the
      # label job's step summary and the transcript artifact are its record,
      # and the fenced note below states the boundary. The dev App bypasses no
      # required check, so the PR still faces the required `gate` check, and it
      # is never auto-merged.
      - name: Mint app token
        if: ${{ github.ref == 'refs/heads/main' }}
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.DEV_APP_CLIENT_ID }}
          private-key: ${{ secrets.DEV_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Configure git identity
        if: ${{ github.ref == 'refs/heads/main' }}
        uses: ./.github/actions/configure-git-identity
        with:
          token: ${{ steps.app-token.outputs.token }}
          app-slug: ${{ steps.app-token.outputs.app-slug }}

      # Mirrors the metrics-refresh PR step: a fixed, force-pushed branch so an
      # unmerged labeling PR updates in place rather than stacking, opened
      # against `main` and never auto-merged.
      - name: Open or update the review PR
        if: ${{ github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          # One fixed branch per frame, so an unmerged application run never
          # replaces an unmerged petition run's PR.
          BRANCH: >-
            ${{ needs.qp-topic-resolve.outputs.frame == 'alignment-sides'
            && 'merits-alignment/side-codes'
            || needs.qp-topic-resolve.outputs.frame == 'applications'
            && 'qp-topics/applications-refresh' || 'qp-topics/refresh' }}
          # The sanitized measured block, as the label job staged it from the
          # measure composite's declared output.
          MEASURED_FILE: ${{ runner.temp }}/qp-publish/measured.txt
          SPEND_FILE: ${{ runner.temp }}/qp-publish/spend.json
          LABELS: ${{ steps.revalidate.outputs.labels }}
          SPEND_NAME: ${{ steps.revalidate.outputs.spend-name }}
          # The hold's decision, for the auto-released mark the daily count
          # reads off `main`'s subjects.
          AUTO_RELEASED: ${{ needs.qp-topic-extract.outputs.auto-release }}
          OWNER: ${{ github.repository_owner }}
          REPLICATE: ${{ needs.qp-topic-resolve.outputs.replicate }}
        run: |
          set -euo pipefail
          gh auth setup-git
          mark=''
          if [ "$AUTO_RELEASED" = true ]; then
            mark=' [auto-released]'
          fi
          open=$(gh pr list --repo "$REPO" --head "$BRANCH" --state open \
            --json number --jq '.[0].number // empty')
          spend_line=''
          if [ -n "$SPEND_NAME" ]; then
            cost=$(jq -er '.estimated_cost_usd' "$SPEND_FILE")
            outcome=$(jq -er '.outcome' "$SPEND_FILE")
            spend_line="This run's spend, recorded at \`data/qp-topics/spend/${SPEND_NAME}\`: ~\$${cost} at the pricing rate table (outcome \`${outcome}\`)."
          fi
          # A run that published nothing lands its spend record alone. Onto the
          # open PR's branch where one is open, so a pending labels batch and the
          # spend records already on it are kept and the reviewer reads the
          # refusal there; on a branch of its own cut from main otherwise. The
          # title says plainly it is a spend record, so it is never read as a
          # labels batch, and like the labels PR it is never auto-merged.
          if [ "$LABELS" != true ]; then
            case "$QP_FRAME" in
              applications) frame_word=application ;;
              alignment-sides) frame_word=side-coding ;;
              *) frame_word=petition ;;
            esac
            title="data(qp-topics): spend record of a ${outcome} ${frame_word} labeling run, no labels published (run ${GITHUB_RUN_ID})${mark}"
            {
              if [ "$REPLICATE" = true ] && [ "$outcome" != replicate ]; then
                printf '%s\n\n' "A reference-only replicate of the \`${QP_FRAME}\` labeler \`${LABELER}\` that was never measured as one (outcome \`${outcome}\`): it published nothing, and its record neither clears nor sets the hold's refusal. ${spend_line} **Merge this PR; do not close it.** It touches only \`data/qp-topics/spend/\`, and closing it drops the run's spend from the measured total."
              elif [ "$REPLICATE" = true ]; then
                printf '%s\n\n' "A reference-only replicate of the \`${QP_FRAME}\` labeler \`${LABELER}\`: it labeled the frame's reference rows alone and published nothing by design. ${spend_line} The record carries the run's agreement and which reference rows it matched, so \`fedcourts qp-topic-replicates\` can pool it with the frame's other replicates to separate run-to-run spread from item-level noise (\`docs/qp-topic.md\`). A replicate neither clears nor sets the hold's refusal. **Merge this PR; do not close it.** It touches only \`data/qp-topics/spend/\`, and closing it drops the run's spend from the measured total and its measurement from the pool."
              else
                printf '%s\n\n' "A \`${QP_FRAME}\` labeling run by \`${LABELER}\` that published no labels: outcome \`${outcome}\`. ${spend_line} A refused or short run spends as much as one that publishes, so its spend is recorded and counted toward the measured spend total all the same (\`docs/qp-topic.md\`). The batch is not retried on its own: the next run's batch is cut deterministically from the same committed state against the same reference set, so unless the frame has grown it is largely the same rows scored the same way, and while this frame's last gated run stands refused that run waits on a maintainer's release, which calls for a stated change. **Merge this PR; do not close it.** It touches only \`data/qp-topics/spend/\`, and closing it drops the run's spend from the measured total and, for a refused run, the refusal the hold reads."
              fi
              if [ -f "$MEASURED_FILE" ]; then
                printf '%s\n' "The gate figures, as the measure step rendered them:"
                printf '%s\n' '```'
                cat "$MEASURED_FILE"
                printf '%s\n' '```'
              else
                printf '%s\n' "The run was never measured (a labels file short of the batch, or a check ahead of the measurement failed); see the run's step summary."
              fi
              printf '\n%s\n' "Run: ${GITHUB_SERVER_URL}/${REPO}/actions/runs/${GITHUB_RUN_ID}"
            } > pr-body.md
            git fetch --no-tags -q origin main
            if [ -n "$open" ]; then
              git fetch --no-tags -q origin "$BRANCH"
              git checkout -q -f -B "$BRANCH" FETCH_HEAD
            else
              git checkout -q -f -B "$BRANCH" origin/main
            fi
            mkdir -p data/qp-topics/spend
            cp "$SPEND_FILE" "data/qp-topics/spend/${SPEND_NAME}"
            git add "data/qp-topics/spend/${SPEND_NAME}"
            if git diff --cached --quiet; then
              echo "Spend record already on ${BRANCH}; nothing to push." | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            git commit -q -m "$title"
            git -c http.extraHeader= -c "http.https://github.com/.extraHeader=" \
              push --force "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" \
              "HEAD:refs/heads/${BRANCH}"
            if [ -n "$open" ]; then
              gh pr comment "$open" --repo "$REPO" --body-file pr-body.md
              echo "Added the spend record to review PR #${open}." | tee -a "$GITHUB_STEP_SUMMARY"
            else
              url=$(gh pr create --base main --head "$BRANCH" \
                --title "$title" --body-file pr-body.md)
              echo "Opened spend-record PR: ${url}" | tee -a "$GITHUB_STEP_SUMMARY"
            fi
            exit 0
          fi
          # The artifact arrived under $RUNNER_TEMP, out of the work tree. The
          # branch is cut from a freshly fetched origin/main, not from this
          # job's checkout, so the push pack is this one data file and nothing
          # the deterministic writers landed (or this dispatch's ref carried)
          # while the agent ran. -f discards the local tree, which is safe
          # because everything this step needs is already under $RUNNER_TEMP.
          #
          # The cut also decides which prior this file supersedes, and the
          # artifact accrues: `qp-topics` built it by accruing onto the *dispatch
          # ref's* committed copy, while the push replaces main's. Dispatch this
          # mode from the ref carrying the newest artifact — on a ref that lags
          # main, the pushed file would drop or rewrite rows main already
          # publishes. The guard below refuses that push mechanically (ledger
          # extension + row containment); the reviewed, never-auto-merged PR
          # stays the human backstop behind it.
          cp "$RUNNER_TEMP/qp-publish/${LABELS_NAME}" "$RUNNER_TEMP/qp-topics.json"
          git fetch --no-tags -q origin main
          git checkout -q -f -B "$BRANCH" origin/main
          # Accrual makes the cut a supersession, so check it is one — on the
          # ROWS, not the ledger counts. A run exactly one batch behind lands a
          # ledger of the same length with the same {batch, labeler, published}
          # tuples (every batch is ceiling-sized), so a tuple-prefix check
          # passes in precisely the stale case it exists for; only row content
          # separates the two. The rule the artifact registers is that a
          # labeler-published row is immutable once landed (reference rows are
          # legitimately superseded by a hand relabel), so the mechanical form
          # is containment: every labeler-sourced row main publishes must
          # appear byte-identically in the incoming file, and the ledger must
          # extend main's.
          # Main's copy is read from the fetched ref, never from the work tree:
          # `checkout -f` replaces tracked files only, so while main does not
          # yet carry the artifact the run's own untracked file survives the
          # switch, and a tree read would compare the artifact against itself
          # and refuse the one batch that has no prior at all.
          # The side codes file has no batch ledger: every entry is a code made
          # once and never revised, so its "ledger" is the set of coded cases,
          # which must strictly grow, and its rows are every entry.
          if [ "$QP_FRAME" = alignment-sides ]; then
            ledger_q='[.entries[] | .case_id]'
            rows_q='[.entries[]]'
            extends='. as [$a, $b] | (($a - $b) | length == 0) and (($b | length) > ($a | length))'
          else
            ledger_q='[.batches[] | {batch, labeler, published}]'
            # An application row's policy area is accrued apart from its
            # topic label and lands on rows already published, so the topic
            # containment reads each row without its policy fields, and the
            # policy check below holds every labeler-sourced area main
            # publishes immutable in turn.
            rows_q='[.entries[] | select(.source == "labeler") | del(.policy_area, .policy_source, .policy_batch)]'
            extends='. as [$a, $b] | ($b[:($a | length)] == $a) and (($b | length) > ($a | length))'
          fi
          areas_q='[.entries[] | select(.policy_source == "labeler") | {case_id, policy_area, policy_source, policy_batch}]'
          if git cat-file -e "origin/main:${LABELS_DIR}/${LABELS_NAME}" 2>/dev/null; then
            git show "origin/main:${LABELS_DIR}/${LABELS_NAME}" > "$RUNNER_TEMP/landed.json"
            jq -cS "$ledger_q" "$RUNNER_TEMP/landed.json" > "$RUNNER_TEMP/landed-ledger.json"
            jq -cS "$rows_q" "$RUNNER_TEMP/landed.json" > "$RUNNER_TEMP/landed-rows.json"
            jq -cS "$areas_q" "$RUNNER_TEMP/landed.json" > "$RUNNER_TEMP/landed-areas.json"
          else
            echo '[]' > "$RUNNER_TEMP/landed-ledger.json"
            echo '[]' > "$RUNNER_TEMP/landed-rows.json"
            echo '[]' > "$RUNNER_TEMP/landed-areas.json"
          fi
          jq -cS "$ledger_q" "$RUNNER_TEMP/qp-topics.json" > "$RUNNER_TEMP/incoming-ledger.json"
          jq -cS "$rows_q" "$RUNNER_TEMP/qp-topics.json" > "$RUNNER_TEMP/incoming-rows.json"
          jq -cS "$areas_q" "$RUNNER_TEMP/qp-topics.json" > "$RUNNER_TEMP/incoming-areas.json"
          # Both checks read their operands from files, never from the
          # argument list. The row arrays are the artifact's whole
          # labeler-sourced content — hundreds of kilobytes from the second
          # batch on — and the kernel caps one argv string at 128 KiB, so an
          # `--argjson` carrying them never starts jq. `-se` reads them as
          # files instead, slurped into `[$a, $b]`, and makes jq's exit the
          # verdict: 0 is true, 1 is false, anything higher is a check that
          # could not run. Only 0 lets the push through, and a check that
          # could not run refuses on its own message rather than on the one
          # for the condition it never tested.
          guard() {
            local label="$1" rc=0
            jq -se "$2" "$3" "$4" > /dev/null || rc=$?
            if [ "$rc" -gt 1 ]; then
              echo "::error::the push guard could not evaluate its ${label} check (jq exit ${rc}); refusing the push"
              exit "$rc"
            fi
            return "$rc"
          }
          if ! guard ledger "$extends" \
                 "$RUNNER_TEMP/landed-ledger.json" "$RUNNER_TEMP/incoming-ledger.json"; then
            echo "::error::this run's batch ledger does not strictly extend main's —" \
              "the run accrued onto a stale artifact, or published nothing new." \
              "Dispatch this mode from the ref carrying the newest ${LABELS_DIR}/${LABELS_NAME}."
            exit 1
          fi
          if ! guard rows '. as [$a, $b] | ($a - $b) | length == 0' \
                 "$RUNNER_TEMP/landed-rows.json" "$RUNNER_TEMP/incoming-rows.json"; then
            echo "::error::rows main already publishes are missing or changed in this run's" \
              "artifact — pushing would rewrite published labels. The run accrued onto a" \
              "stale or divergent artifact; dispatch from the ref carrying main's newest copy."
            exit 1
          fi
          if ! guard areas '. as [$a, $b] | ($a - $b) | length == 0' \
                 "$RUNNER_TEMP/landed-areas.json" "$RUNNER_TEMP/incoming-areas.json"; then
            echo "::error::policy areas main already publishes are missing or changed in this" \
              "run's artifact — an area is set once. The run accrued onto a stale or" \
              "divergent artifact; dispatch from the ref carrying main's newest copy."
            exit 1
          fi
          mkdir -p data/qp-topics/spend "$LABELS_DIR"
          cp "$RUNNER_TEMP/qp-topics.json" "${LABELS_DIR}/${LABELS_NAME}"
          git add "${LABELS_DIR}/${LABELS_NAME}"
          # The spend records an open, unmerged PR on this branch carries are
          # spend that happened — a refused run's above all — so the branch,
          # cut afresh from main, carries them forward rather than dropping
          # them with the superseded labels. Re-validated after the carry.
          if [ -n "$open" ]; then
            git fetch --no-tags -q origin "$BRANCH"
            git diff --name-only --diff-filter=A origin/main...FETCH_HEAD -- data/qp-topics/spend/ \
              > "$RUNNER_TEMP/carried-spend.txt"
            while IFS= read -r path; do
              case "$path" in
                data/qp-topics/spend/*.json) git checkout FETCH_HEAD -- "$path" ;;
              esac
            done < "$RUNNER_TEMP/carried-spend.txt"
          fi
          if [ -n "$SPEND_NAME" ]; then
            cp "$SPEND_FILE" "data/qp-topics/spend/${SPEND_NAME}"
            git add "data/qp-topics/spend/${SPEND_NAME}"
          fi
          uv run fedcourts validate data/qp-topics
          if [ "$LABELS_DIR" != data/qp-topics ]; then
            uv run fedcourts validate "$LABELS_DIR"
          fi
          if git diff --cached --quiet; then
            echo "Labels identical to main; nothing to open." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # The artifact accrues one batch a run, so the title counts what *this*
          # run added and the total separately: attributing the whole file to
          # this labeler would credit it with every earlier batch's rows. It
          # counts `labeler_rows`, not `published` — on the first batch the
          # reference rows are newly published too, and those carry the hand
          # set's adjudicated labels, which no labeler assigned. `-e` so a shape
          # change fails the step instead of titling the PR `null`.
          if [ "$QP_FRAME" = alignment-sides ]; then
            total=$(jq -er '.entries | length' "${LABELS_DIR}/${LABELS_NAME}")
            added=$(jq -er --arg run "$GITHUB_RUN_ID" \
              '[.entries[] | select(.run_id == $run)] | length' "${LABELS_DIR}/${LABELS_NAME}")
            title="data(merits-alignment): ${added} new alignment-side-v1 side code(s) by ${LABELER} (${total} total) (run ${GITHUB_RUN_ID})${mark}"
            # The codes file carries the coder's one-sentence notes, which no
            # strict enum bounds: each is capped at 400 characters by the
            # schema, scanned for secrets with the file above, and read in
            # this reviewed, never-auto-merged PR's diff. The body carries
            # counts only.
            {
              printf '%s\n\n' "Side codes from \`${LABELER}\` for ${added} merits grant(s), from each case's grant-time text alone (\`.github/prompts/alignment-side-code.md\`), bringing \`${LABELS_DIR}/${LABELS_NAME}\` to ${total}. The file is append-only: every code main already holds is carried unchanged, and a code is never revised. A \`replay\` code was made after its case was decided and carries the contamination-risk flag; only \`forward\` codes made within the clean lag of their grant enter the clean check (\`docs/merits-alignment-baseline.md\`). There is no reference gate: review the notes in the diff for a side the guide does not support."
              printf '%s\n' '```'
              cat "$MEASURED_FILE"
              printf '%s\n' '```'
              if [ -n "$spend_line" ]; then
                printf '\n%s\n' "$spend_line"
                printf '\n%s\n' "This PR also carries the run's spend record under \`data/qp-topics/spend/\`, the labeling lane's shared ledger. Closing it rather than merging drops it from the measured spend total."
              fi
              printf '\n%s\n' "Run: ${GITHUB_SERVER_URL}/${REPO}/actions/runs/${GITHUB_RUN_ID}"
            } > pr-body.md
          else
            cases=$(jq -er '.cases' "data/qp-topics/${LABELS_NAME}")
            batch=$(jq -er '.batches[-1].batch' "data/qp-topics/${LABELS_NAME}")
            labeled=$(jq -er '.batches[-1].labeler_rows' "data/qp-topics/${LABELS_NAME}")
            if [ "$QP_FRAME" = applications ]; then
              title="data(qp-topics): application batch ${batch} — ${labeled} new qp-topic-v1 label(s) by ${LABELER} (${cases} total) (run ${GITHUB_RUN_ID})${mark}"
              lead="Batch ${batch} of the \`qp-topic-v1\` application frame, by \`${LABELER}\` from the \`application-extract-v1\` rows (caption, court below, pre-disposition docket entries, and the stored application text where there is one): ${labeled} new label(s), bringing the application artifact to ${cases}."
              meaning="The figures are agreement with the application reference block's adjudicated labels, **not** accuracy, and they are in-sample: the labeler applies register rules that were fitted to this same block, and the block's labels are the majority of three blind raters that are instances of the labeler's own model, so their errors and the labeler's are correlated. Do not quote them as an agreement rate until an independent rater has checked them. The pooled rate over-weights \`application-text\` rows against the frame, so the block above splits it by \`input_kind\`. The *Applications* section of \`docs/qp-topic.md\` has the rest."
            else
              title="data(qp-topics): batch ${batch} — ${labeled} new qp-topic-v0 label(s) by ${LABELER} (${cases} total) (run ${GITHUB_RUN_ID})${mark}"
              lead="Batch ${batch} of the \`qp-topic-v0\` labeling frame, by \`${LABELER}\` from the stored questions-presented text alone: ${labeled} new label(s), bringing the artifact to ${cases}."
              meaning="What the numbers mean — agreement with a single v0 reference rater, **not** accuracy; a grant-enriched frame that certifies the grant stream only; per-label rates suppressed under the support floor — is in \`docs/qp-topic.md\`."
            fi
            # The committed artifact carries no agent prose and no petition text:
            # `QpTopicPublishedEntry` is a strict pydantic model whose every field
            # is a copied key, a vocabulary enum, a bool, or a stamp the builder
            # assigns, joined to the extract on both keys, and the re-validation
            # step above holds this file to it. The body's measured block is the
            # measure composite's sanitized rendering of numbers and vocabulary
            # labels, carried across as a file and not re-derived here, so a
            # process the labeler left behind could have rewritten it before the
            # hand-off: the same step caps its size and scans it, with the labels
            # file, for secrets, and the reviewed, never-auto-merged PR is the
            # backstop for the rest.
            {
              printf '%s\n\n' "${lead} The artifact accrues one batch a run, so the block below is this batch's measurement and not the file's — the rest of what this batch read is the hand reference set, re-graded every run for that measurement and published from its own adjudicated labels rather than the labeler's. Prior batches' rows are carried forward unchanged."
              printf '%s\n\n' "The command enforces the publication gate, so this PR exists only because the run cleared it. ${meaning}"
              printf '%s\n' '```'
              cat "$MEASURED_FILE"
              printf '%s\n' '```'
              if [ -n "$spend_line" ]; then
                printf '\n%s\n' "$spend_line"
                printf '\n%s\n' "This PR also carries the labeling runs' spend records under \`data/qp-topics/spend/\`. Closing it rather than merging drops them from the measured spend total, and any refusal among them from the hold."
              fi
              printf '\n%s\n' "Run: ${GITHUB_SERVER_URL}/${REPO}/actions/runs/${GITHUB_RUN_ID}"
            } > pr-body.md
          fi
          git commit -q -m "$title"
          # Push with the app (write) token; blank any ambient extraheader so it
          # authenticates. Force: the fixed branch supersedes any unmerged run.
          git -c http.extraHeader= -c "http.https://github.com/.extraHeader=" \
            push --force "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" \
            "HEAD:refs/heads/${BRANCH}"
          if [ -n "$open" ]; then
            gh pr edit "$open" --repo "$REPO" --title "$title" --body-file pr-body.md
            echo "Updated review PR #${open} in place." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            url=$(gh pr create --base main --head "$BRANCH" \
              --title "$title" --body-file pr-body.md)
            echo "Opened review PR: ${url}" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      # This job runs on a rehearsal too, so the hand-off is exercised off
      # `main`; the label job's own note covers the runs that never reach here.
      - name: Note the rehearsal boundary (publish fenced off this ref)
        if: ${{ github.ref != 'refs/heads/main' }}
        run: |
          echo "qp-topic-publish rehearsal: the measured artifact reached the publish job; the labels PR is fenced to main-branch runs — nothing published from this dispatch." \
            | tee -a "$GITHUB_STEP_SUMMARY"

  order-scan:
    needs: [authorize]
    # The adverse-order candidate scan: a bounded RECAP search over the
    # configured queries and entry-date windows, reported as JSON (identifiers,
    # dates and order readings; no caption or entry text). It reads
    # CourtListener's REST API and nothing else — no corpus, no cloud role, no
    # App token — so the CourtListener token is the job's one secret, scoped to
    # the scan step.
    #
    # A scan outgrows one run's cap, so each run carries the previous run's
    # report forward: the newest unexpired `order-scan` artifact a dispatch of
    # this workflow on this ref uploaded, read with the job's `actions: read`.
    # The report artifact's one-day retention is therefore the longest gap
    # between a scan's runs; a longer gap starts a fresh scan.
    #
    # Its spend is the account's, shared with run-pull's windows: the rate
    # governor counts per process, so the run's own cap
    # (`config/order-scan.yaml`) is sized to fit beside a pull window and a live
    # window's enrichment step inside the hourly ceiling, and a dispatch belongs
    # in the quiet odd hours run-pull's enrich job names. A staging rehearsal
    # spends on the same account as a production run: the staging
    # environment's token, where it holds one, is a credential for that one
    # account too, and without one the scan refuses before any request.
    if: >-
      ${{ inputs.mode == 'order-scan'
      && needs.authorize.result == 'success'
      && (needs.authorize.outputs.attempt == github.run_attempt
      || contains(needs.authorize.outputs.rerunners, format(',{0},', github.triggering_actor))) }}
    runs-on: ubuntu-26.04
    # At most 150 requests at the scan's per-minute pace (8) is about nineteen
    # minutes, plus setup; the cap frees the runner if a request hangs.
    timeout-minutes: 40
    environment: ${{ github.ref_name == 'main' && 'prod' || github.ref_name }}
    # Its own group, never cancelled: a cancelled scan uploads no report, and
    # the requests it already spent are gone either way. The group keeps two
    # scans of one ref from overlapping, not from sharing an hour: a second
    # dispatch queues and starts when the first ends, so spacing scans an hour
    # apart is the dispatcher's job. It carries the ref as every group here
    # does, so nothing stops a staging and a production scan, which spend the
    # same account, from overlapping either; do not dispatch the two in the
    # same hour.
    concurrency:
      group: run-analytics-order-scan-${{ github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read # the previous run's report artifact, which this run resumes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-python-env
        with:
          restore-cache: "false"

      - name: Fetch the previous run's report
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          prior="$RUNNER_TEMP/order-scan-prior.json"
          # This workflow's own dispatches on this ref, newest first, from the
          # last day (the artifact retention, so nothing older can resume).
          # The API filters by workflow, ref and event, so an artifact from a
          # pull request, a fork or another workflow is never a candidate. A
          # scan resumes from the newest of them that uploaded a live report.
          # Any failure on the way degrades to a fresh scan, which spends more
          # requests but reads nothing it should not.
          since=$(date -u -d '1 day ago' +%Y-%m-%dT%H:%M:%SZ)
          if ! runs=$(gh api -X GET "repos/${REPO}/actions/workflows/run-analytics.yml/runs" \
              -f branch="$REF" -f event=workflow_dispatch -f created=">=${since}" \
              -F per_page=100 --jq '.workflow_runs[].id'); then
            echo "::warning::Could not list this workflow's runs: this run starts a fresh scan."
            exit 0
          fi
          artifact=""
          for run in $runs; do
            if [ "$run" = "$GITHUB_RUN_ID" ]; then
              continue
            fi
            artifact=$(gh api "repos/${REPO}/actions/runs/${run}/artifacts?name=order-scan" \
              --jq '[.artifacts[] | select(.expired | not) | .id] | first // empty') || artifact=""
            if [ -n "$artifact" ]; then
              break
            fi
          done
          if [ -z "$artifact" ]; then
            echo "No order-scan report on ${REF} in the last day: this run starts a fresh scan."
            exit 0
          fi
          # Extract the one member by name, never by the archive's own paths,
          # then check it parses as a report: an unreadable one is not resumed,
          # so it cannot fail every run after it.
          if ! gh api "repos/${REPO}/actions/artifacts/${artifact}/zip" > "$RUNNER_TEMP/order-scan-prior.zip" \
            || ! python3 -I -c '
          import sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as z, open(sys.argv[2], "wb") as out:
              out.write(z.read("order-scan.json"))
          ' "$RUNNER_TEMP/order-scan-prior.zip" "$prior" \
            || ! uv run --no-sync python -I -c '
          import pathlib, sys
          from fedcourtsai.pipeline.order_scan import OrderScanReport
          OrderScanReport.model_validate_json(pathlib.Path(sys.argv[1]).read_bytes())
          ' "$prior"; then
            rm -f "$prior"
            echo "::warning::Run ${run}'s report could not be read: this run starts a fresh scan."
            exit 0
          fi
          echo "Resuming from run ${run}'s report."

      - name: Scan for adverse orders
        timeout-minutes: 25
        env:
          FEDCOURTS_COURTLISTENER_API_TOKEN: ${{ secrets.COURTLISTENER_API_TOKEN }}
          # The per-day window is the account's tier, as run-pull reads it
          # (the fallback is the held tier's; see run-pull's refresh step).
          # The other two are the scan's own. Upstream throttles its search
          # endpoint below the tier's per-minute rate (a 429 at about 23 a
          # minute), so the scan paces itself at 8. The hourly window is the
          # run cap (`max_requests_per_run` in config/order-scan.yaml), so the
          # governor counts every request this process sends, retries
          # included, and stops the scan cleanly at the cap; the job finishes
          # inside the hour, so that window bounds the whole run.
          FEDCOURTS_COURTLISTENER_RPM: "8"
          FEDCOURTS_COURTLISTENER_RPH: "150"
          FEDCOURTS_COURTLISTENER_RPD: ${{ vars.COURTLISTENER_RPD || '1400' }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/order-scan.json"
          summary="$RUNNER_TEMP/order-scan-summary.txt"
          # The report JSON to the artifact file, the plain-text summary
          # (counts, spend, gold recall and the missed gold dockets) to stderr;
          # the summary goes on the page as a fenced block. A run that fails
          # (a refused credential, every search failed) still prints its
          # report, so the summary is written either way and the step then
          # fails with the scan's own status.
          prior="$RUNNER_TEMP/order-scan-prior.json"
          resume=()
          if [ -f "$prior" ]; then
            resume=(--resume "$prior")
          fi
          uv run fedcourts order-scan "${resume[@]}" > "$out" 2> "$summary" || status=$?
          # A refusal before the scan prints no report; leave no empty file
          # for the upload to carry forward.
          if [ ! -s "$out" ]; then
            rm -f "$out"
          fi
          {
            echo "## order-scan — $(date -u +%Y-%m-%d)"
            echo '```'
            cat "$summary"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$summary"
          exit "${status:-0}"

      - name: Upload the scan report
        # A failed scan's report is uploaded too: it says why it failed. A run
        # that wrote no report (an argument or config refusal) uploads nothing,
        # with a warning, so the next run resumes from the last good report
        # rather than from nothing.
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: order-scan
          path: ${{ runner.temp }}/order-scan.json
          if-no-files-found: warn
          # The report names district dockets by court and number — public
          # court records CourtListener already serves, none of them in the
          # corpus — with entry numbers and dates, and no caption, entry text
          # or nature of suit.
          # It rides the one-day window of the other analytics run artifacts
          # (docs/security.md). Each run's report describes the whole scan so
          # far, so the hand coding downloads the last run's, and the next run
          # resumes from it inside the same day.
          retention-days: 1

  decision-below:
    needs: [authorize]
    # The decision-below fill's dry run: for the next 25 cases of its rotation
    # (cert petitions from a federal court of appeals, the ledger's predicted
    # cases and the salience selection first), whether CourtListener holds the
    # lower court's docket and the opinion on the judgment date, what its
    # entries say about rehearing en banc, and which rows an applied window
    # would store (`fedcourts enrich-decision-below`,
    # `pipeline/decision_below.py`). A dry run, not a store: nothing is written
    # to the corpus, the content store, `data/` or git, nothing reaches a cell,
    # and no request buys anything (no RECAP Fetch, so no PACER charge). It is
    # the bounded reading a maintainer takes before the writer step applies.
    # The rotation is chosen from the pulled index and each case's newest
    # snapshot is read from the content store, so the job holds the read-only
    # role; the token rides the dry-run step alone.
    #
    # Its spend is the account's, shared with run-pull's windows: about four
    # REST requests a case, sixteen at worst. The run's governor is capped
    # below at order-scan's 150, the run cap that fits beside a pull window and
    # a live window's enrichment inside the account's hourly ceiling
    # (`config/order-scan.yaml`); a request past it stops the walk with the
    # rest reported deferred, which the summary says. A dispatch belongs in the
    # quiet odd hours run-pull's enrich job names. A staging rehearsal spends on the
    # same account, and without a token the command refuses before any request.
    if: >-
      ${{ inputs.mode == 'decision-below'
      && needs.authorize.result == 'success'
      && (needs.authorize.outputs.attempt == github.run_attempt
      || contains(needs.authorize.outputs.rerunners, format(',{0},', github.triggering_actor))) }}
    runs-on: ubuntu-26.04
    # The pull, then at most 150 requests at 10 a minute (15 minutes), with
    # room; the cap frees the runner if a request hangs.
    timeout-minutes: 45
    environment: ${{ github.ref_name == 'main' && 'prod' || github.ref_name }}
    # Its own group, never cancelled: a cancelled run uploads no report, and
    # the requests it already spent are gone either way.
    concurrency:
      group: run-analytics-decision-below-${{ github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # assume the read-only AWS role to pull the corpus
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-python-env
        with:
          restore-cache: "false"

      # The sample walks every SCOTUS row of the index for its lower court,
      # which a pulled index serves locally. No contents:write, no App token.
      - uses: ./.github/actions/corpus-readonly
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME_READONLY }}
          aws-region: ${{ vars.AWS_REGION }}
          corpus-base-url: ${{ vars.CORPUS_BASE_URL }}
          # Forwarded only off `main`, as corpus-stats states.
          corpus-pointer: ${{ github.ref_name != 'main' && vars.FEDCOURTS_CORPUS_POINTER || '' }}

      - name: Dry-run the decision-below fill
        timeout-minutes: 35
        env:
          FEDCOURTS_COURTLISTENER_API_TOKEN: ${{ secrets.COURTLISTENER_API_TOKEN }}
          # The per-day window is the account's tier, as run-pull reads it.
          # The hourly window is this run's cap: the governor counts every
          # request this process sends, retries included, and the job ends
          # inside the hour, so that window bounds the whole run. The walk
          # is sized to it: 25 typical cases spend about 100.
          FEDCOURTS_COURTLISTENER_RPM: "10"
          FEDCOURTS_COURTLISTENER_RPH: "150"
          FEDCOURTS_COURTLISTENER_RPD: ${{ vars.COURTLISTENER_RPD || '1400' }}
          FEDCOURTS_CORPUS_BASE_URL: ${{ vars.CORPUS_BASE_URL }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/decision-below.json"
          summary="$RUNNER_TEMP/decision-below-summary.txt"
          # The report JSON to the artifact file, the counts (and why a walk
          # stopped early) to stderr, which goes on the page.
          uv run fedcourts enrich-decision-below --max-cases 25 > "$out" 2> "$summary" || status=$?
          if [ ! -s "$out" ]; then
            rm -f "$out"
          fi
          {
            echo "## decision-below — $(date -u +%Y-%m-%d)"
            echo '```'
            cat "$summary"
            echo '```'
            if [ -s "$out" ]; then
              echo ''
              echo '| status | cases |'
              echo '| --- | --- |'
              jq -r '.counts | to_entries[] | "| \(.key) | \(.value) |"' "$out"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$summary"
          # A refused credential stops the walk at its first request and the
          # command still exits 0, reporting it; the run must not read green.
          if [ -s "$out" ] && jq -e '(.stopped // "") | test("HTTP 401")' "$out" > /dev/null; then
            echo "::error::CourtListener refused the credential; nothing was measured."
            exit 1
          fi
          exit "${status:-0}"

      - name: Upload the report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: decision-below
          path: ${{ runner.temp }}/decision-below.json
          if-no-files-found: warn
          # Public court-record identifiers (dockets, clusters, opinion ids,
          # panel names, docket entry numbers and dates) and no opinion text;
          # the one-day window of the other analytics run artifacts
          # (docs/security.md). The counts themselves are on the summary page.
          retention-days: 1

  # The run gate's verdict on the run as a whole. A refused partial re-run
  # skips every job it re-runs, which alone would leave the earlier attempt's
  # successes standing and the run concluding `success`. This job needs every
  # other job, so any re-run re-runs it, and it fails the run when the gate did
  # not pass or this attempt is neither the one the gate judged nor a re-run by
  # a login the gate published. No checkout, no token, no environment.
  run-gate:
    needs: [authorize, corpus-stats, tool-usage, text-coverage, metrics-refresh, big-cases, public-updates, qp-topic-resolve, qp-topic-extract, qp-topic-approval, qp-topic-rejected, qp-topic-label, qp-topic-publish, order-scan, decision-below]
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Fail a run the gate refused
        if: >-
          ${{ needs.authorize.result != 'success'
          || (needs.authorize.outputs.attempt != github.run_attempt
          && !contains(needs.authorize.outputs.rerunners, format(',{0},', github.triggering_actor))) }}
        env:
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: |
          echo "::error::The run gate refused this run or re-run (started by ${TRIGGERING_ACTOR}): see the authorize job's log, or config/dispatchers.json for who may re-run."
          exit 1
