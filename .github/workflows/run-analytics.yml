name: run-analytics

# Corpus analysis & derived metrics. One surface for every task that reads the
# corpus and answers a question or refreshes a derived artifact, selected by
# `mode` (dispatch) or the weekly schedule:
#
#   - corpus-stats:    aggregate disposition base-rates over the packed corpus
#                      (`fedcourts stats`) — the "what's the grant rate for X"
#                      question. Reads the corpus read-only via a full pull.
#   - census:          the distribution-parse census (`fedcourts
#                      distribution-census`) — what re-reading the DISTRIBUTED
#                      phrase would move, case by case and band by band
#                      (`docs/salience.md`). Read-only like corpus-stats, but
#                      its JSON is the review of record a version pinning a new
#                      parse is read from, so it is uploaded as a run artifact
#                      as well as summarised, and it walks the whole live slice
#                      one snapshot at a time — much the longest of the
#                      read-only modes.
#   - metrics-refresh: regenerate the committed deterministic artifacts
#                      (leaderboard / claim scores / backtest / statpack, plus
#                      the scope manifest) and land any change as a **reviewed**
#                      PR — never a direct commit to main, never auto-merged.
#                      Also the schedule's job (weekly).
#   - tool-usage:      roll the committed retrieval logs into an offered-vs-called
#                      report (`fedcourts tool-usage`) — which configured MCP
#                      tools cells actually call. Reads `data/` only, so unlike
#                      its siblings it needs no corpus and no credential at all.
#   - qp-topic-label:  run the `qp-topic-v0` topic labeler over every
#                      questions-presented text the pulled corpus carries
#                      (`docs/qp-topic.md`) and land the
#                      measured per-case labels file as a **reviewed** PR — never
#                      auto-merged. The only mode that runs an agent, so it is
#                      split into two jobs: `qp-topic-extract` holds the S3 role
#                      and produces the extract, `qp-topic-label` runs the agent
#                      with no cloud credential in the job env at all.
#
# The read-only analysis modes (corpus-stats, census, tool-usage) write neither the
# corpus, `data/`, the corpus remote, nor git, open no PR, and file no issue — every
# result goes to the Actions step summary and the run log, and the census's machine
# JSON additionally to a run artifact, because a review of record has to outlive the
# summary page it is read beside. The two artifact modes write only under their own
# paths — metrics-refresh under `metrics/` + `data/scope/`, qp-topic-label under
# `data/qp-topics/` — and land the change as a reviewed PR to `main`.
# GitHub scopes permissions and tokens per **job**, so each mode runs as its own
# least-privilege job gated on `mode` and none is ever granted another's credential:
# corpus-stats, distribution-census and qp-topic-extract hold only the read-only S3
# role; metrics-refresh holds that role *and* mints the dev App token (contents + PR
# write) for its review PR; qp-topic-label mints the same token but assumes no role
# at all, because it is the one job here that runs an agent; and tool-usage binds no
# environment and assumes no role — there is nothing for it to reach.
on:
  schedule:
    # Weekly metrics refresh (Mon 05:41 UTC) — a quiet slot after run-pull's
    # 02:31 historical and 04:47 live windows, before its 07:17 pull window, so
    # the refresh sees a settled corpus. Runs only the metrics-refresh job (a
    # schedule event carries no inputs, so the mode-gated jobs stay skipped).
    - cron: "41 5 * * 1"
  workflow_dispatch:
    inputs:
      mode:
        description: Which analysis or refresh to run.
        type: choice
        options:
          - corpus-stats
          - census
          - metrics-refresh
          - tool-usage
          - qp-topic-label
        default: corpus-stats
      label_model:
        description: "qp-topic-label: the model the Claude Code labeler runs (ignored by the other modes)."
        # A choice, not a free string: the value is spliced into the agent's own
        # `claude_args` block, where a newline would append flags the mode's
        # contract withholds (an `--mcp-config` line would hand a text-only
        # labeler a retrieval surface). It is also recorded as the labels
        # artifact's provenance, so a closed set keeps that field well-formed.
        type: choice
        options:
          - claude-haiku-4-5-20251001
          - claude-sonnet-4-6
          - claude-fable-5
        default: claude-haiku-4-5-20251001
      # corpus-stats inputs (ignored by every other mode). All are optional; an
      # empty value means "no filter" / "no grouping".
      court:
        description: "corpus-stats: restrict to one court id (e.g. scotus). Empty = all courts."
        type: string
        default: ""
      topic:
        description: "corpus-stats: restrict to one exact nature-of-suit / topic. Empty = all."
        type: string
        default: ""
      disposition:
        description: "corpus-stats: restrict to one realized outcome label (e.g. granted). Empty = all."
        type: string
        default: ""
      group_by:
        description: "corpus-stats: break base-rates down by court / topic / judge / term_year / disposition / originating_court / era / relist_bucket / cvsg / fee_class / salience_band. Empty = overall only."
        type: string
        default: ""
      term:
        description: "corpus-stats: restrict to one SCOTUS October-Term year, e.g. 2024. Empty = all Terms."
        type: string
        default: ""
      # census inputs (ignored by every other mode). Both name a distribution
      # parse registered in `pipeline.cert_signals.DISTRIBUTION_PARSES`; an
      # unregistered label fails the command with the registered set printed,
      # so a typo costs a run rather than producing a mislabelled census. The
      # salience version whose band function bands both counts is not exposed:
      # the census is read against the active one, and dispatching a different
      # version is a code change (registering it), not a run-time choice.
      census_baseline_parse:
        description: "census: the registered distribution parse counted as the incumbent."
        type: string
        default: dist-v1
      census_candidate_parse:
        description: "census: the registered distribution parse counted against the incumbent."
        type: string
        default: dist-v2

# Least privilege by default; each job widens only to what its mode needs.
permissions: {}

# Concurrency is per-job (not workflow-level): the corpus-reading analysis modes
# share one group and cancel a superseded run of it, while a metrics refresh or a
# labeling run must never be cancelled mid-PR (or mid-agent) by an unrelated
# analysis dispatch. corpus-stats and the census share the group, so a second
# analysis dispatch cancels the first outright — and a cancelled job runs no
# upload step, so a superseded census loses the artifact it exists to produce.
# Dispatch a census into a quiet window and leave it alone until it lands.
# The labeling mode's two jobs take separate groups: they are already sequenced
# by `needs`, and a shared group would let a second dispatch's extract slip
# between the first dispatch's extract and its labeler.

jobs:
  corpus-stats:
    if: ${{ inputs.mode == 'corpus-stats' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: prod
    concurrency:
      group: run-analytics-analysis
      cancel-in-progress: true
    permissions:
      contents: read
      id-token: write # assume the read-only AWS role to pull the corpus
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-python-env

      # The base-rates read the corpus (the real rows), so it must be on disk.
      # No contents:write, no App token: this job cannot touch git or the corpus.
      - uses: ./.github/actions/corpus-readonly
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME_READONLY }}
          aws-region: ${{ vars.AWS_REGION }}
          corpus-remote-url: ${{ vars.CORPUS_REMOTE_URL }}

      - name: Aggregate corpus base-rates
        env:
          # Every filter is passed through the environment (never interpolated into the
          # shell) so a maintainer-supplied value cannot inject commands; the CLI reads
          # each as one argument and treats an empty value as "no filter" / "no grouping".
          COURT: ${{ inputs.court }}
          TOPIC: ${{ inputs.topic }}
          DISPOSITION: ${{ inputs.disposition }}
          GROUP_BY: ${{ inputs.group_by }}
          # Not `TERM`: that name is the standard terminal-type variable, which
          # every subprocess consults — an avoidable namespace collision.
          TERM_YEAR: ${{ inputs.term }}
          # Corpus-split read side: under FEDCOURTS_CORPUS_SPLIT=1 (the
          # clean-slate cutover switch; unset variable -> '0' -> off) the pulled
          # corpus.db is a payload-free index and payload reads come from the
          # per-case content store instead. The base-rates aggregate row columns,
          # so the pair is inert for today's groupings — it is set because this
          # job's read path is the shared corpus reader, and a grouping that
          # reaches a payload must not be the thing that discovers the store was
          # never wired here.
          FEDCOURTS_CASESTORE_URL: ${{ vars.CASESTORE_URL }}
          FEDCOURTS_CORPUS_SPLIT: ${{ vars.FEDCOURTS_CORPUS_SPLIT || '0' }}
        run: |
          set -euo pipefail
          # Prints the machine AnalyticsReport JSON to stdout (the run log) and appends
          # the Markdown summary to the step summary. Writes nothing else.
          uv run fedcourts stats \
            --court "$COURT" \
            --topic "$TOPIC" \
            --disposition "$DISPOSITION" \
            --group-by "$GROUP_BY" \
            --term "$TERM_YEAR" \
            --summary-out "$GITHUB_STEP_SUMMARY"

  distribution-census:
    # What re-reading the DISTRIBUTED phrase would move, case by case and band by
    # band — the input-level cut a statistical review reads before any salience
    # version pins a new parse (docs/salience.md). Read-only on exactly
    # corpus-stats's terms: the read-only role, no contents:write, no App token,
    # nothing written to git or to the corpus remote. What it adds is durability
    # — the JSON *is* the review, so it leaves the runner as an artifact rather
    # than living only on a summary page.
    if: ${{ inputs.mode == 'census' }}
    runs-on: ubuntu-latest
    # What bounds this job is the credential clock, not the wall clock. The
    # census walks the gate's scored segment and, with the corpus-split mode on,
    # takes a latest-snapshot read per frame case — one `snapshots/` listing plus
    # a get per snapshot walked past to reach the newest live-shaped one, so two
    # round trips is the floor and not the term — serially, because no bounded
    # prefetch serves this loop.
    # Against corpus-stats's 20-minute budget for the same pull and the same scan
    # with no per-case fetch, that is the dominant term by far. But
    # `corpus-readonly` assumes the read-only role for the OIDC default hour and
    # exports static credentials boto3 cannot refresh, so a scan still reading
    # the content store at the hour mark dies on an expired token — after the
    # whole walk, with no artifact, on an error that names the wrong cause. So
    # the scan step is capped at 50 minutes and the job at 65: the step fails
    # first, legibly, inside the session it was granted. Raising the ceiling is a
    # `role-duration-seconds` on the composite, not a bigger number here.
    timeout-minutes: 65
    environment: prod
    # Its own group, never cancelled: a cancelled census runs no upload step,
    # so the artifact the mode exists to produce is lost to a sibling
    # corpus-stats dispatch. Both jobs are read-only, so overlap is harmless.
    concurrency:
      group: run-analytics-census
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # assume the read-only AWS role to pull the corpus
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-python-env

      # The census counts real snapshots, so the corpus must be on disk. No
      # contents:write, no App token: this job cannot touch git or the corpus.
      - uses: ./.github/actions/corpus-readonly
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME_READONLY }}
          aws-region: ${{ vars.AWS_REGION }}
          corpus-remote-url: ${{ vars.CORPUS_REMOTE_URL }}

      - name: Census the distribution parses
        timeout-minutes: 50
        env:
          # Both parse labels pass through the environment rather than the shell
          # line, as the corpus-stats filters do, so a maintainer-supplied value
          # cannot inject commands; an unregistered label exits 2 with the
          # registered set printed.
          BASELINE_PARSE: ${{ inputs.census_baseline_parse }}
          CANDIDATE_PARSE: ${{ inputs.census_candidate_parse }}
          # Corpus-split read side: under FEDCOURTS_CORPUS_SPLIT=1 (the
          # clean-slate cutover switch; unset variable -> '0' -> off) the pulled
          # corpus.db is a payload-free index and each case's latest live
          # snapshot comes from the per-case content store instead. This pair is
          # load-bearing here, not defensive: the census reads a snapshot per
          # case, so a split-blind read of a payload-free blob finds no snapshot
          # anywhere and reports the whole frame `unobservable` — a census that
          # is silently empty rather than one that fails.
          FEDCOURTS_CASESTORE_URL: ${{ vars.CASESTORE_URL }}
          FEDCOURTS_CORPUS_SPLIT: ${{ vars.FEDCOURTS_CORPUS_SPLIT || '0' }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/distribution-census.json"
          # The machine DistributionCensus JSON goes to stdout, the headline and
          # the occupied band transitions to stderr (the run log). Capture stdout
          # to the file the upload step publishes, and summarise from that file
          # so the page and the artifact can never disagree.
          uv run fedcourts distribution-census \
            --baseline-parse "$BASELINE_PARSE" \
            --candidate-parse "$CANDIDATE_PARSE" \
            > "$out"
          {
            echo "### Distribution-parse census"
            echo
            jq -r '
              "| field | value |",
              "| --- | --- |",
              "| baseline parse | `\(.baseline_parse)` |",
              "| candidate parse | `\(.candidate_parse)` |",
              "| salience version | `\(.salience_version)` |",
              "| corpus sha256 | `\(.corpus_sha256)` |",
              "| frame cases (observable) | \(.cases) |",
              "| unobservable | \(.unobservable) |",
              "| count changed | \(.count_changed) |",
              "| band changed | \(.band_changed) |"
            ' "$out"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          # The whole JSON belongs on the page too, but the step summary is
          # capped at 1 MiB and the census carries a complete case-id list per
          # changed set — deliberately, since the review checks the shifted
          # dockets one by one. So a large census is pointed at the artifact
          # instead of truncating the page or failing the summary write.
          size=$(wc -c < "$out")
          if [ "$size" -le 524288 ]; then
            {
              echo '```json'
              cat "$out"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Census JSON is ${size} bytes — over the step-summary budget; read it from the \`distribution-census\` run artifact." \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload the census
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distribution-census
          path: ${{ runner.temp }}/distribution-census.json
          if-no-files-found: error
          # The review of record for a parse pinning has to outlive the run page
          # it is first read beside — a statistical review and the follow-up it
          # provokes do not fit in the extract's single day — and the file
          # carries the `corpus_sha256` that says which corpus state it is
          # re-derivable against.
          #
          # What the window costs is a disclosure, and it is not the extract's:
          # this republishes no stored document text, only counts, band labels,
          # and the changed cases' ids. Those ids name ingested dockets by
          # public docket number — the compilation-extent boundary
          # `docs/security.md` bounds with a one-day window on the other
          # analytics run artifacts — so this artifact rides the same one-day
          # window, named in that inventory. The census is deterministic over
          # the blob (the JSON carries its corpus_sha256), so the re-read path
          # after the day is a re-dispatch, not a longer window; this
          # repository is public, and a run artifact is downloadable by any
          # logged-in user for as long as it exists.
          retention-days: 1

  tool-usage:
    # Which configured MCP tools cells actually call. Reads `data/` only — no
    # corpus, no network, no credentials — so unlike the sibling jobs it binds
    # no environment and assumes no role: there is nothing for it to reach.
    if: ${{ inputs.mode == 'tool-usage' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: run-analytics-tool-usage
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-python-env

      - name: Roll up offered-vs-called tool usage
        run: |
          set -euo pipefail
          # Markdown to the step summary and to the run log. Writes nothing to
          # git: this is a read of the committed ledger, not an artifact.
          uv run fedcourts tool-usage --markdown-out "$GITHUB_STEP_SUMMARY"

  metrics-refresh:
    # Runs on the weekly schedule, or on dispatch with mode=metrics-refresh —
    # both trusted surfaces (dispatch is write-gated by GitHub), so no
    # authorize-trigger gate is needed here.
    if: ${{ github.event_name == 'schedule' || inputs.mode == 'metrics-refresh' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: prod
    concurrency:
      group: run-analytics-metrics-refresh
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # assume the read-only AWS role to pull the corpus
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: ./.github/actions/setup-python-env

      # The refresh PR is opened with the dev App token. The dev App is not a
      # branch-protection bypass actor, so the PR still faces the required `gate`
      # check, and it is never auto-merged — review is mandatory. The read-only
      # analysis modes above hold no write token at all; the only other job that
      # does is qp-topic-label, for the same reason and on the same terms.
      - name: Mint app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.DEV_APP_CLIENT_ID }}
          private-key: ${{ secrets.DEV_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Configure git identity
        uses: ./.github/actions/configure-git-identity
        with:
          token: ${{ steps.app-token.outputs.token }}
          app-slug: ${{ steps.app-token.outputs.app-slug }}

      # backtest and statpack read the corpus, so it must be on disk; a missing
      # pointer only warns (the leaderboard reads the committed pack, not the
      # corpus), but a failed pull
      # of an existing pointer fails the job — regenerating against a missing
      # corpus would regress those artifacts to the empty pack.
      - uses: ./.github/actions/corpus-readonly
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME_READONLY }}
          aws-region: ${{ vars.AWS_REGION }}
          corpus-remote-url: ${{ vars.CORPUS_REMOTE_URL }}
          missing-pointer: warn

      # The tested stage commands, run directly; each is deterministic, so an
      # unchanged input
      # reproduces the committed artifact byte for byte. The corpus-dependent
      # pair runs only when the corpus is on disk — regenerating without it
      # would replace real metrics with the empty pack. (The backtest's
      # prior-vote baseline retrieves against a prebuilt index, so a full
      # replay costs a couple of resolved-slice scans, not a query per case.)
      - name: Regenerate the metrics artifacts
        run: |
          set -euo pipefail
          if [ -f corpus/corpus.db ]; then
            uv run fedcourts backtest
            uv run fedcourts statpack
            # The scope manifest is the same kind of artifact — deterministic,
            # offline, git-tracked, a pure function of the corpus plus the
            # committed case tree. It publishes the salience decision for the
            # public set, so when it drifts a claim in README.md stops being true,
            # which is worse than a stale number. Corpus-gated with the others:
            # without one it writes an empty `skipped` manifest, which would
            # replace the real record.
            uv run fedcourts scope-manifest
          fi
          # Last, and outside the corpus gate: neither needs a corpus, but the
          # board scores its realized-Term skill column against the committed
          # statpack, so running it before the pack would commit a board keyed
          # on the pack it replaces — and a rerun on the merged tree would
          # diff. The claim-score board reads only the ledger, and sits here so
          # the two evaluation-derived artifacts refresh from one tree state.
          uv run fedcourts leaderboard
          uv run fedcourts claim-scores

      # The branch name and PR prose come from the tested `metrics-refresh-plan`
      # (null pr = nothing changed); this step only runs git and gh, mirroring
      # a direct commit. The fixed branch is force-pushed so an unmerged refresh PR
      # updates in place rather than stacking.
      - name: Open or update the review PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh auth setup-git
          # Stage first, then diff the index: a plain `git diff` sees only tracked
          # files, so a future brand-new artifact under metrics/ would be missed.
          git add -A metrics/ data/scope/
          git diff --cached --name-only -- metrics/ data/scope/ > changed.txt
          plan=$(uv run fedcourts metrics-refresh-plan --changed-file changed.txt \
            --run-id "$GITHUB_RUN_ID")
          if [ "$(jq -r '.pr' <<<"$plan")" = "null" ]; then
            echo "Metrics are up to date; nothing to refresh." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          branch=$(jq -r '.pr.branch' <<<"$plan")
          git checkout -q -b "$branch"
          jq -r '.pr.body' <<<"$plan" > pr-body.md
          git commit -q -m "$(jq -r '.pr.commit_message' <<<"$plan")"
          # Push with the app (write) token; blank any ambient extraheader so it
          # authenticates. Force: the fixed branch supersedes any unmerged refresh.
          git -c http.extraHeader= -c "http.https://github.com/.extraHeader=" \
            push --force "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" \
            "HEAD:refs/heads/${branch}"
          # Reuse the open PR for this branch when one exists (the force-push above
          # already updated its contents); otherwise open a fresh one.
          existing=$(gh pr list --repo "$REPO" --head "$branch" --state open \
            --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --repo "$REPO" \
              --title "$(jq -r '.pr.title' <<<"$plan")" --body-file pr-body.md
            echo "Updated review PR #${existing} in place." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            url=$(gh pr create --base main --head "$branch" \
              --title "$(jq -r '.pr.title' <<<"$plan")" --body-file pr-body.md)
            echo "Opened review PR: ${url}" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

  qp-topic-extract:
    # First half of the labeling mode, and the only half that holds a cloud
    # credential. `corpus-readonly` exports the assumed role's credentials
    # job-wide, and the second job runs an agent — so the extract is split into
    # its own job rather than sharing an environment with the labeler. What
    # crosses the boundary is one artifact: the texts, and nothing else.
    if: ${{ inputs.mode == 'qp-topic-label' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: prod
    concurrency:
      group: run-analytics-qp-topic-extract
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # assume the read-only AWS role to pull the corpus
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-python-env

      # The extract reads the stored document text, so the corpus must be on
      # disk. No contents:write, no App token: this job cannot touch git.
      - uses: ./.github/actions/corpus-readonly
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME_READONLY }}
          aws-region: ${{ vars.AWS_REGION }}
          corpus-remote-url: ${{ vars.CORPUS_REMOTE_URL }}

      - name: Extract the stored questions-presented texts
        env:
          # Corpus-split read side, the same pair and the same spelling every
          # corpus-reading step in this file declares (FEDCOURTS_CORPUS_SPLIT=1 is
          # the clean-slate cutover switch; unset variable -> '0' -> off). Inert
          # for this step: `qp-corpus` opens the pulled blob directly rather than
          # through the shared payload reader, so on a split blob it finds no
          # document text and exits non-zero either way — a labeling run that
          # cannot read its input says so rather than handing the labeler an
          # empty extract. The pair is here so one spelling covers every step
          # that reads the corpus, and no step is silently the exception.
          FEDCOURTS_CASESTORE_URL: ${{ vars.CASESTORE_URL }}
          FEDCOURTS_CORPUS_SPLIT: ${{ vars.FEDCOURTS_CORPUS_SPLIT || '0' }}
        run: |
          set -euo pipefail
          # Under $RUNNER_TEMP, never the work tree: the extract republishes
          # stored petition text and enumerates the ingested corpus, so
          # `qp-corpus` refuses an --out anywhere inside the checkout (one
          # `git add -A` from being committed).
          uv run fedcourts qp-corpus --out "$RUNNER_TEMP/qp-texts.json"

      - name: Upload the extract
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qp-texts
          path: ${{ runner.temp }}/qp-texts.json
          if-no-files-found: error
          # One day, deliberately: the extract republishes stored petition text
          # and enumerates the ingested corpus — the two things no committed
          # surface does — so it exists to hand one file to the next job and
          # must not outlive the run pipeline as a downloadable artifact.
          # Retention bounds the window, not the audience: this repository is
          # public, so a run artifact is downloadable by any logged-in user for
          # as long as it exists (the same residual SECURITY.md records for the
          # cell artifacts). That is why the window is the shortest GitHub
          # offers, and why the disclosure is argued out loud in
          # docs/qp-topic.md rather than treated as an implementation detail.
          retention-days: 1

  qp-topic-label:
    # Second half: the agent labels every text from the extract alone, then the
    # deterministic `qp-topics` command measures it against the hand reference
    # set and writes the artifact. No `id-token: write` and no `corpus-readonly`
    # here — that is the point of the split, and the assertion step below is its
    # tripwire.
    needs: qp-topic-extract
    if: ${{ inputs.mode == 'qp-topic-label' }}
    runs-on: ubuntu-latest
    # The step caps have to fit inside this one or the run loses its artifact
    # to the job clock: the 40-minute labeler, the 5-minute CLI install and the
    # three post-agent transcript steps at 5 each come to 60, and the steps
    # around them carry no cap of their own — the `fetch-depth: 0` checkout,
    # apt, the artifact download, the measure composite (which also revalidates
    # the data root), the App token, and the PR step's fetch and push. Fifteen
    # minutes for that set is headroom, not a race, and the race is the one
    # that matters: the transcript steps deliberately run before measure, so
    # their worst case is charged before the labels artifact exists.
    timeout-minutes: 75
    environment: prod
    concurrency:
      group: run-analytics-qp-topic-label
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      # The actor string recorded on the labels artifact, and the model the
      # agent step runs. Both come from the one dispatch input so the recorded
      # labeler can never drift from what actually ran. Passed through the
      # environment rather than interpolated into a shell line, as with the
      # corpus-stats filters above.
      LABELER: claude-code/${{ inputs.label_model }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: ./.github/actions/setup-python-env

      # Recorded before the agent runs, because `setup-uv` installs into a
      # runner-user-writable directory and `$GITHUB_PATH` is appendable from
      # any step — the labeling step's subprocesses included — with the runner
      # applying those writes to every step that follows. Both halves matter:
      # the path says *which* binary the scanner install below runs, and the
      # digest says it is the same bytes. A step output is the right place for
      # them because the runner consumes and discards the file that carries it
      # while this step is still the current one.
      - name: Record the uv binary and its digest
        id: uv-bin
        run: |
          set -euo pipefail
          path=$(command -v uv)
          test -n "$path"
          echo "path=$path" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$path" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Download the extract
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: qp-texts
          # Under $RUNNER_TEMP for the same reason the extract job wrote it
          # there: petition text never lands inside the checkout. The `qp-io`
          # subdirectory is the labeler's ONE granted path outside the checkout
          # (`--add-dir` below) — it holds exactly the extract and the output
          # slot, and never the oracle, which sits beside it in $RUNNER_TEMP
          # where the grant does not reach.
          path: ${{ runner.temp }}/qp-io

      # The regression tripwire for the split above: the agent step must inherit
      # no cloud credential from the job env. This job assumes no role at all, so
      # this proves the labeling half stays that way even if a future edit adds a
      # corpus step to it. Named for what it checks: the agent's env necessarily
      # carries the engine's own API key, and this asserts nothing about that.
      - name: Assert no cloud credential in the agent env
        run: |
          set -euo pipefail
          # Any AWS_* variable except the region names is treated as
          # credential-conferring (static keys, session tokens, and the
          # role-ARN/web-identity pair alike). The OIDC pair is checked too:
          # granting this job `id-token: write` would let the agent mint its own
          # web identity and assume the role with no AWS_* variable in sight.
          if env | grep -E '^AWS_' | grep -qvE '^AWS_(REGION|DEFAULT_REGION)='; then
            echo "::error::AWS credential variables leaked into the job env"
            exit 1
          fi
          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "::error::OIDC token minting is reachable from the agent env"
            exit 1
          fi
          echo "no cloud credential in the agent env"

      # The same structural prohibition the cell workflows apply, adapted to the
      # one agent that legitimately needs the directory back: `data/qp-topics/`
      # holds the hand reference set this run is measured against, and reading
      # it while labeling does not improve the labels — it destroys the
      # measurement, because agreement with a file you copied from is agreement
      # with nothing. A cell can simply delete it; this job has to restore it
      # for the measure step, so move it aside instead. Restoring under `git
      # checkout` (not a copy back) means the pristine-tree assertion below is
      # checking bytes from the commit, not bytes the agent could have written.
      - name: Move the reference set out of the labeler's tree
        run: |
          set -euo pipefail
          mv data/qp-topics "$RUNNER_TEMP/qp-topics-oracle"

      # The labeler runs with CLAUDE_CODE_SUBPROCESS_ENV_SCRUB=1 (its tool
      # subprocesses must not inherit the engine API key), and the scrub's
      # isolation backend is bubblewrap, which the runner image does not
      # carry — without it the CLI refuses to start rather than degrade.
      # socat is the CLI's other sandbox dependency: absent, the Bash sandbox
      # fails to initialize ("Sandbox dependencies not available") and every
      # shell command the labeler issues is refused.
      - name: Install bubblewrap and socat for the labeler's sandbox
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap socat

      # The action's bundled install left the CLI's native binary missing on
      # this job ("claude native binary not installed", while the action still
      # exited `is_error: false` with no output). Install the pinned CLI here
      # instead — the same npm pattern run-backtest.yml and integration-test.yml
      # prove on these runners, kept in version step with both — and hand the
      # action the executable, which skips its own install path entirely. The
      # action bundles a slightly newer CLI for the cells it installs itself;
      # if the labeler ever misbehaves under this pin, matching the bundled
      # version is the first lever.
      - name: Install the pinned Claude Code CLI for the labeler
        id: claude-cli
        timeout-minutes: 5
        # zizmor: ignore[adhoc-packages] — top-level exact-version pin,
        # transitive scripts disabled, and a credential-free step environment
        # are the practical controls for a global CLI; a lockfile is not
        # expressible for `npm i -g`. The one script run on purpose is the
        # pinned claude package's own installer, which fetches the native
        # binary from the vendor's release endpoint — the same vendor trust
        # executing the agent itself carries.
        run: |
          set -euo pipefail
          npm install --silent --no-audit --ignore-scripts --global @anthropic-ai/claude-code@2.1.207
          # Claude's native binary is placed by its postinstall, which
          # --ignore-scripts suppresses; run the pinned package's own
          # installer explicitly.
          node "$(npm root -g)/@anthropic-ai/claude-code/install.cjs"
          claude --version
          # Fail closed: an empty path would make the action fall back to its
          # own installer with no signal.
          path=$(command -v claude)
          test -n "$path"
          echo "path=$path" >> "$GITHUB_OUTPUT"

      # Without the userns relaxation, bubblewrap's uid-map setup is refused
      # under the runner image's AppArmor policy and every scrubbed subprocess
      # dies ("bwrap: setting up uid map: Permission denied") — the same
      # probe-then-set the codex sandbox uses in integration-test.yml.
      - name: Enable unprivileged user namespaces for the subprocess scrub
        run: |
          set -euo pipefail
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          if sysctl -n kernel.unprivileged_userns_clone >/dev/null 2>&1; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi

      - name: Label the questions presented with Claude Code
        # Bound the agent below the job timeout so a runaway run trips this
        # *step* instead of the job-level timeout, which would cancel the runner
        # and leave nothing to report.
        id: label
        timeout-minutes: 40
        uses: anthropics/claude-code-action@e5ad3c7725bc2459721893f88879fef9dbcf97b0 # v1.0.202
        env:
          QP_TEXTS: ${{ runner.temp }}/qp-io/qp-texts.json
          LABELS_OUT: ${{ runner.temp }}/qp-io/qp-labels.jsonl
        with:
          # Auth is the Anthropic API key (pay-per-token), as for every automated
          # cell: see docs/budget.md.
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # The pinned, pre-installed CLI (see the install step above) — the
          # action skips its own installer, whose skipped postinstall left the
          # native binary missing.
          path_to_claude_code_executable: ${{ steps.claude-cli.outputs.path }}
          # The action refuses to start without a GitHub token, and both
          # alternatives are worse: its no-input fallback is an OIDC exchange
          # that mints an App installation token defaulting to
          # contents/issues/pull-requests *write*, and granting the
          # `id-token: write` that exchange needs would fail the no-OIDC guard
          # step above. So hand it the job's own token: the permissions block
          # above caps it at `contents: read`, and the labeler still comments
          # on nothing and opens nothing — carrying the labels off the runner
          # belongs to the steps below.
          github_token: ${{ github.token }}
          # Prompt caching is automatic; the API key's default 5-minute cache TTL
          # would expire mid-run over ~1,200 texts, so pin the 1-hour TTL.
          settings: |
            {
              "env": {
                "ENABLE_PROMPT_CACHING_1H": "1",
                "CLAUDE_CODE_SUBPROCESS_ENV_SCRUB": "1"
              }
            }
          # The kickoff prompt carries the variable contract inline: some engines
          # sanitize the shell environment in CI, so the prompt text — not the
          # env above — is the contract's delivery channel.
          prompt: |
            Read .github/prompts/qp-topic-label.md and AGENTS.md, then label every
            questions-presented text in the extract:

            QP_TEXTS=${{ runner.temp }}/qp-io/qp-texts.json
            LABELS_OUT=${{ runner.temp }}/qp-io/qp-labels.jsonl
            LABELER=claude-code/${{ inputs.label_model }}

            These values are authoritative; the same identifiers are exported as
            environment variables on engines that pass them through, but if
            `$QP_TEXTS` expands empty in your shell, use the literals above.
            Write only $LABELS_OUT. Do not commit, push, or open a PR — the
            workflow handles git. You run headless with no interactive input; if
            you are blocked, say so plainly in your final message and stop — do
            not wait for a reply.
          # No `--mcp-config`: `qp-topic-v0` is a text-only vocabulary, so the
          # extract is the agent's entire evidentiary input and every retrieval
          # surface is off limits by contract.
          claude_args: |
            --model ${{ inputs.label_model }}
            --max-turns 120
            --permission-mode bypassPermissions
            --add-dir ${{ runner.temp }}/qp-io

      # The labeler's only declared output is $LABELS_OUT, in the granted
      # `qp-io` directory under $RUNNER_TEMP — the checkout is read-only
      # territory by contract — so
      # a modified work tree is a contract violation. The reference set is out of
      # reach above; the gate itself is not, because `setup-python-env` installs
      # the project editable and `uv run fedcourts qp-topics` therefore executes
      # `fedcourtsai.pipeline.qp_topics` from this checkout — a one-line edit to
      # AGREEMENT_GATE would pass the measure step and then be erased by the PR
      # step's branch cut, leaving a reviewer a clean diff over a rigged number.
      - name: Restore the reference set and assert the tree is pristine
        id: pristine
        # `!cancelled()` so this runs — and records a real success/failure
        # outcome — even when the labeling step failed: a run that both failed
        # and tampered should say which, and a skipped assertion says nothing.
        # Idempotent on every early-exit path (the rm tolerates a missing dir;
        # the checkout is a no-op when the move step never ran), and its
        # success never revives the job — the measure and PR steps carry no
        # `if:` of their own, so they stay on the default `success()` gate that
        # a failed assertion has already turned red. That gating is this
        # assertion's whole job: it is about a *rigged number*, since the
        # measure step does run this checkout's `fedcourts qp-topics`.
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/qp-topics-oracle"
          # From the commit, not from the copy: whatever the agent did to the
          # tree, the file the gate measures against is the reviewed one.
          git checkout -- data/qp-topics
          if ! git diff --quiet || ! git diff --cached --quiet; then
            echo "::error::the labeler modified tracked files; refusing to measure"
            git status --porcelain
            exit 1
          fi
          echo "work tree pristine"

      # The scan below runs Python with the engine API key in its environment,
      # so every byte it imports has to be a byte the labeler could not have
      # written. `setup-python-env` installs this project *editable*, which
      # puts the workspace tree and its gitignored `.venv` on the import path
      # — and the labeler runs `bypassPermissions` in that workspace. The
      # assertion above does not close this: it compares *tracked* files, so an
      # untracked module, or a `.pth` dropped into the venv, is invisible to
      # it. Nor would a venv built before the agent ran, wherever it sat: the
      # agent writes to any path on this runner by naming it.
      # What it cannot reach is a source tree that does not exist while it
      # runs and is fetched over the network once it is gone. So the scanner
      # comes from a second checkout of this run's own commit, taken here,
      # into its own path, with the scanner installed from it into a venv
      # inside that same fresh tree, resolved through a package cache inside
      # it too. (Under the workspace, because `checkout` forces `path` there —
      # but nothing in it comes from the labeler's tree, its venv, its object
      # store, or uv's cache in the runner user's home.)
      # The import path does not end at the tree, so neither does the
      # isolation: the venv is built on a *managed* interpreter downloaded
      # into the same fresh path (uv's default install dir sits in the runner
      # user's home, and a `sitecustomize.py` there is on every venv's
      # `sys.path`), git reads no global or system config for the clone
      # (`core.hooksPath` and `init.templateDir` are code, and both fire during
      # a checkout), and the steps run with the interpreter's own environment
      # levers unset — the runner applies `$GITHUB_ENV` and `$GITHUB_PATH`
      # writes from *earlier* steps to later ones, and the labeling step's
      # subprocesses can append to those files.
      # What stays trusted, named rather than implied: the action bundles the
      # runner unpacked before this job's first step — `actions/checkout`'s own
      # JavaScript and the node that runs it sit in a runner-user-writable
      # path and are pinned by identity, not by bytes; the runner image's files
      # behind the passwordless sudo the runner user holds (which is where
      # PATH-pinning puts `git` and `sha256sum`); and anything a process the
      # agent left behind does between these steps. What is removed is the
      # drop-a-file class on the scanner's *Python import path* and on the
      # toolchain that builds it — the class the assertion above cannot see,
      # and the one an editable install hands over for free.
      - name: Clear the isolated scanner path
        id: scanner_clear
        if: ${{ !cancelled() && steps.label.outputs.execution_file != '' }}
        # A `.git` the agent planted at this path would be *reused* by the
        # checkout below rather than replaced, and its hooks would run during
        # the checkout. Remove the path so the clone is a clone — and the
        # checkout is gated on this succeeding, because a swallowed `rm`
        # failure is precisely the case that hands the checkout that `.git`.
        # The empty config file is where git's `--global` writes go for the two
        # steps below (`actions/checkout` records a `safe.directory` there);
        # created here, after the agent, so it holds only what they put in it.
        continue-on-error: true
        env:
          # `rm` comes off PATH like everything else, and a shimmed one that
          # exits 0 without removing anything is this step reporting success
          # over the `.git` it was meant to delete. Root-owned directories only,
          # here and on the two steps below.
          PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        run: |
          set -euo pipefail
          rm -rf "${GITHUB_WORKSPACE:?}/.transcript-scanner"
          : > "${RUNNER_TEMP:?}/scanner-gitconfig"

      - name: Check out the scanner afresh from GitHub
        id: scanner_src
        if: ${{ !cancelled() && steps.scanner_clear.outcome == 'success' }}
        # This step and the install below carry the scan's own posture, for the
        # scan's own reason: this run's artifact is the labels, and a network
        # blip on the transcript surface must never cost them. A scanner that
        # failed to build leaves the scan with no executable, which is the
        # fail-closed path it already has — withhold, do not fail. The timeout
        # bounds the clock too: `continue-on-error` bounds only the outcome.
        continue-on-error: true
        timeout-minutes: 5
        env:
          GIT_CONFIG_GLOBAL: ${{ runner.temp }}/scanner-gitconfig
          GIT_CONFIG_NOSYSTEM: "1"
          # The action finds `git` on PATH, and `$GITHUB_PATH` prepends ahead
          # of everything — so a shim would be the thing doing this "fresh
          # clone". Pinning PATH puts `git` in the same class as the rest of
          # the runner image: behind sudo.
          PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This run's own commit — the bytes the workflow itself was read
          # from — fetched from the remote. Stated rather than defaulted,
          # because the property that matters is that it is resolved against
          # GitHub and never out of the workspace's object store, which the
          # agent could have rewritten as freely as the work tree.
          ref: ${{ github.sha }}
          path: .transcript-scanner
          persist-credentials: false

      - name: Install the scanner into its own venv
        id: scanner_install
        if: ${{ !cancelled() && steps.scanner_src.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 5
        env:
          # A package cache the labeler can write is on the import path just as
          # surely as a venv it can write, and uv's default cache and managed
          # interpreters both sit under the runner user's home. Resolve through
          # a cache and an interpreter inside the fresh tree instead: every
          # dependency is fetched now and checked against the freshly
          # checked-out lockfile's hashes, and uv checksums the interpreter.
          UV_CACHE_DIR: ${{ github.workspace }}/.transcript-scanner/.uv-cache
          UV_PYTHON_INSTALL_DIR: ${{ github.workspace }}/.transcript-scanner/.uv-python
          UV_BIN: ${{ steps.uv-bin.outputs.path }}
          UV_SHA256: ${{ steps.uv-bin.outputs.sha256 }}
          GIT_CONFIG_GLOBAL: ${{ runner.temp }}/scanner-gitconfig
          GIT_CONFIG_NOSYSTEM: "1"
          # Same reason as the checkout above: `git` and `sha256sum` are found
          # on PATH, and `$GITHUB_PATH` prepends ahead of everything.
          PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        run: |
          set -euo pipefail
          # Every lever that puts a caller's code inside a process it starts,
          # and every one of them is settable from an earlier step's
          # `$GITHUB_ENV`. Unset for the whole block: it builds the scanner.
          unset PYTHONPATH PYTHONHOME PYTHONSTARTUP PYTHONUSERBASE
          unset LD_PRELOAD LD_AUDIT LD_LIBRARY_PATH
          # `uv` lives where `setup-uv` put it, which the runner user can
          # rewrite without sudo — so the pre-agent digest, not just the path.
          echo "${UV_SHA256}  ${UV_BIN}" | sha256sum --check --status || {
            echo "::error::the uv binary changed while the labeler ran; refusing to scan"
            exit 1
          }
          cd "${GITHUB_WORKSPACE}/.transcript-scanner"
          # This tree must be this commit and nothing else. A `.git` that
          # survived the clear step would have been reused rather than cloned,
          # and anything its hooks wrote during the checkout shows up here.
          # `--ignored` because the one thing a hook would plant — a `.venv`
          # that `uv sync` then reuses, `.pth` files and all — is a path
          # `.gitignore` hides. Checked before the sync, which adds ignored
          # paths of its own.
          if [ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]; then
            echo "::error::the scanner checkout is not this run's commit; refusing to scan"
            exit 1
          fi
          if [ -n "$(git status --porcelain --untracked-files=all --ignored)" ]; then
            echo "::error::the scanner checkout is not a clean clone; refusing to scan"
            exit 1
          fi
          # Runtime dependencies only — the scanner is one CLI command, and the
          # dev group is a wider supply chain to admit for no gain here.
          # `--no-config` skips the user-level `uv.toml` (agent-writable, and
          # nothing this install needs is in one); `--python 3.12` pins the
          # managed interpreter to the project's floor rather than letting the
          # newest one uv can fetch decide what the scanner runs on.
          "$UV_BIN" sync --locked --no-default-groups --no-config \
            --managed-python --python 3.12
          # Fail here rather than inside the scan if the scanner is unusable.
          ./.venv/bin/python -E -s -P -m fedcourtsai.cli scan-diff-for-secrets --help >/dev/null

      # The transcript is the only record of *how* the labeler failed: the
      # action reports a summary block and discards the turn-by-turn log with
      # the runner, so a success-that-wrote-nothing run (the shape this job
      # can produce) is undiagnosable without a paid re-run. Which is why the
      # tree's state is not among the things the scan is gated on: a tampered
      # tree is a run that badly needs diagnosing, and with the scanner
      # installed out of the labeler's reach above, running it there costs
      # nothing. What it *is* gated on is that install having happened. Scan
      # before publishing — the transcript is agent-authored bytes no other
      # scan sees — and withhold on a hit rather than fail the job, mirroring
      # the collect job's withhold-and-continue posture (minus its
      # trigger-issue report: a dispatch mode has none, so the warning and the
      # step summary are the record). The one credential reachable from the
      # labeler's env is the engine's own API key, so the scan searches for
      # that value literally, exactly as the collect job's scan holds its
      # reachable credential: the agent process is gone by this step, which
      # parses bytes with tested Python and executes none of them. On this
      # surface the generic entropy rule is off (see the run block below), so
      # the literal containment plus the structured credential shapes are the
      # whole gate — which is exactly why the scan failing closed on an unset
      # variable is load-bearing here.
      - name: Scan the transcript before publishing it
        id: transcript_scan
        # Gated on the scanner having been built, not merely on a transcript
        # existing: `$SCANNER` names a path inside the workspace, so a step
        # that ran without the install having run would execute whatever is
        # sitting there. The bash-127 route reaches the same withheld artifact,
        # but only by way of a path this step would have already taken.
        if: >-
          ${{ !cancelled() && steps.scanner_install.outcome == 'success'
          && steps.label.outputs.execution_file != '' }}
        continue-on-error: true
        timeout-minutes: 5
        # Runs inside the fresh tree, not the workspace: `python -m` puts the
        # working directory first on `sys.path`, and the workspace is the tree
        # the labeler wrote to. `-P` below is the direct fix; this is the same
        # answer from the other side, so neither alone is load-bearing.
        working-directory: ${{ github.workspace }}/.transcript-scanner
        env:
          TRANSCRIPT: ${{ steps.label.outputs.execution_file }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # The isolated install above, by absolute path: a bare `uv run` would
          # resolve the project out of the workspace the labeler just wrote to.
          SCANNER: ${{ github.workspace }}/.transcript-scanner/.venv/bin/python
        run: |
          set -euo pipefail
          # This is the one step that holds the key, so it is the one an
          # injected environment variable is worth aiming at: the runner
          # applies every earlier step's `$GITHUB_ENV` writes here, and the
          # labeling step's subprocesses can append to that file. A planted
          # `PYTHONPATH` or `LD_PRELOAD` would put agent code inside this
          # process whatever the import path says. `-E -s -P` below covers the
          # PYTHON* family and the implicit cwd entry exhaustively; the unset
          # covers the loader's.
          unset PYTHONPATH PYTHONHOME PYTHONSTARTUP PYTHONUSERBASE
          unset LD_PRELOAD LD_AUDIT LD_LIBRARY_PATH
          # Named here rather than left to the scanner's own exit 2, because
          # the working directory above is not the workspace: a transcript path
          # that is workspace-relative resolves to nothing from here, and a
          # withheld artifact whose only record is "exit 2" is the diagnostic
          # dying in the diagnostic.
          if [ ! -r "$TRANSCRIPT" ]; then
            echo "::warning::no readable transcript at ${TRANSCRIPT}; withholding the artifact"
            echo "transcript withheld: execution file not readable" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          status=0
          # The transcript surface flag, not the generic extra-file suite: the
          # transcript's own tool and request ids are high-entropy by format,
          # so the generic heuristic convicts every real file and the artifact
          # would only ever publish empty — the surface is gated by containment
          # of the one reachable credential and the credential shapes instead.
          "$SCANNER" -E -s -P -m fedcourtsai.cli scan-diff-for-secrets --name-status-file /dev/null \
            --known-secret-env ANTHROPIC_API_KEY \
            --transcript-file "$TRANSCRIPT" \
            --run-url "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            || status=$?
          if [ "$status" -eq 1 ]; then
            echo "::warning::transcript scan hit; withholding the qp-label-transcript artifact"
            echo "transcript withheld: secret scan hit" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          elif [ "$status" -ne 0 ]; then
            echo "::warning::transcript scan could not run (exit ${status}); withholding the artifact"
            echo "transcript withheld: scan did not run (exit ${status})" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Upload the transcript
        # Gated on the scan, not on the labeling step's outcome: a
        # gate-refusing run (sub-80% agreement) is as diagnostic as a
        # no-output one. `!cancelled()` covers every path the action survives;
        # the hard step-timeout kill is the one path with no execution file to
        # capture, and the step below says so.
        if: ${{ !cancelled() && steps.transcript_scan.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qp-label-transcript
          path: ${{ steps.label.outputs.execution_file }}
          if-no-files-found: warn
          # One day, for the same reason as the extract above, stated there in
          # full: the transcript necessarily embeds the QP text the agent read
          # from $QP_TEXTS, so it is the same disclosure class as `qp-texts`
          # and gets the same shortest-offered window — retention bounds the
          # window, not the audience, and docs/qp-topic.md argues the
          # disclosure out loud.
          retention-days: 1

      - name: Note a run with no transcript to capture
        if: ${{ !cancelled() && steps.label.outputs.execution_file == '' }}
        run: |
          echo "::warning::the labeling step reported no execution file; no transcript artifact this run"

      # The post-label half — assert the labeler wrote its declared output,
      # measure against the reference set, publish-or-refuse, re-validate —
      # lives in the shared composite so the token-free `qp-topic`
      # integration-test scenario exercises the exact steps this paid run
      # depends on. Placed after the tree-pristine check, so a run that both
      # tampered and wrote nothing reports the higher-signal tamper first.
      - name: Measure the run against the reference set
        id: measure
        uses: ./.github/actions/qp-topic-measure
        with:
          labels: ${{ runner.temp }}/qp-io/qp-labels.jsonl
          texts: ${{ runner.temp }}/qp-io/qp-texts.json
          labeler: ${{ env.LABELER }}
          transcript-hint: >-
            The qp-label-transcript run artifact carries the turn-by-turn
            transcript to diagnose from (absent only when the scan withheld it
            or the action died before writing it — see the labeling step's
            log).

      # Minted only after the agent has finished and the gate has passed, as
      # run-backtest does: a write-capable installation token has no business
      # existing while an agent runs unattended on the same runner, and a token
      # minted at the top of a 75-minute job would spend its whole 1-hour life
      # waiting for a step that may never run — and be dead by the time it
      # does. The dev App is not a
      # branch-protection bypass actor, so the PR still faces the required
      # `gate` check and is never auto-merged.
      - name: Mint app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.DEV_APP_CLIENT_ID }}
          private-key: ${{ secrets.DEV_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Configure git identity
        uses: ./.github/actions/configure-git-identity
        with:
          token: ${{ steps.app-token.outputs.token }}
          app-slug: ${{ steps.app-token.outputs.app-slug }}

      # Mirrors the metrics-refresh PR step: a fixed, force-pushed branch so an
      # unmerged labeling PR updates in place rather than stacking, opened
      # against `main` and never auto-merged.
      - name: Open or update the review PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          BRANCH: qp-topics/refresh
          # The composite's declared output, not a path convention: where the
          # sanitized measured block lands is the measure step's contract.
          MEASURED_FILE: ${{ steps.measure.outputs.measured-file }}
        run: |
          set -euo pipefail
          gh auth setup-git
          # Carry the artifact out of the work tree before switching branches:
          # the branch is cut from a freshly fetched origin/main, not from this
          # job's checkout, so the push pack is this one data file and nothing
          # the deterministic writers landed (or this dispatch's ref carried)
          # while the agent ran. -f discards the local tree, which is safe
          # because everything this step needs is already under $RUNNER_TEMP.
          cp data/qp-topics/qp-topics.json "$RUNNER_TEMP/qp-topics.json"
          git fetch --no-tags -q origin main
          git checkout -q -f -B "$BRANCH" origin/main
          mkdir -p data/qp-topics
          cp "$RUNNER_TEMP/qp-topics.json" data/qp-topics/qp-topics.json
          git add data/qp-topics/qp-topics.json
          if git diff --cached --quiet; then
            echo "Labels identical to main; nothing to open." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          cases=$(jq -r '.cases' data/qp-topics/qp-topics.json)
          title="data(qp-topics): ${cases} qp-topic-v0 label(s) by ${LABELER}"
          # The body carries only CLI-rendered numbers and vocabulary labels —
          # no agent prose and no petition text — and so does the committed
          # artifact: `QpTopicLabelEntry` is a strict pydantic model whose every
          # field is a copied key, a vocabulary enum, or a bool, joined to the
          # extract on both keys, so no agent-authored string can reach either.
          # That mechanism, not reviewer attention, is why this step runs no
          # secret scan where `collect-run` does.
          {
            printf '%s\n\n' "One \`qp-topic-v0\` labeling run: primary labels for ${cases} stored questions-presented text(s), assigned by \`${LABELER}\` from the text alone and measured against the hand reference set by \`fedcourts qp-topics\`."
            printf '%s\n\n' "The command enforces the publication gate, so this PR exists only because the run cleared it. What the numbers mean — agreement with a single v0 reference rater, **not** accuracy; a grant-enriched frame that certifies the grant stream only; per-label rates suppressed under the support floor — is in \`docs/qp-topic.md\`."
            printf '%s\n' '```'
            cat "$MEASURED_FILE"
            printf '%s\n' '```'
            printf '\n%s\n' "Run: ${GITHUB_SERVER_URL}/${REPO}/actions/runs/${GITHUB_RUN_ID}"
          } > pr-body.md
          git commit -q -m "$title"
          # Push with the app (write) token; blank any ambient extraheader so it
          # authenticates. Force: the fixed branch supersedes any unmerged run.
          git -c http.extraHeader= -c "http.https://github.com/.extraHeader=" \
            push --force "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" \
            "HEAD:refs/heads/${BRANCH}"
          existing=$(gh pr list --repo "$REPO" --head "$BRANCH" --state open \
            --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --repo "$REPO" --title "$title" --body-file pr-body.md
            echo "Updated review PR #${existing} in place." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            url=$(gh pr create --base main --head "$BRANCH" \
              --title "$title" --body-file pr-body.md)
            echo "Opened review PR: ${url}" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
