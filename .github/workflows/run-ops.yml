name: run-ops

# Operational analytics. A read-only DAILY roll-up of authoritative
# sources — pipeline health (the GitHub Actions run history), substance (scored
# cells, replay calibration, live-frontier readiness — the committed ledger,
# metrics artifacts, and the published live-frontier snapshot), and model +
# Actions spend (the usage ledger + run durations) — rendered by
# `fedcourts ops-report`.
#
# It reports the PROMOTED state, deliberately. Scheduled runs check out the
# default branch, so this executes the `fedcourts ops-report` that has reached
# `main` and reads the tree that is actually running the pipeline — not the newer
# one staged for the next batch. A report describing code that is not yet
# executing would be the wrong artifact: `main` is the pre-registration record,
# and "is the machine producing" is a question about what is live. The lag is
# narrower than it looks, because the substance and spend sections read `data/`
# and `metrics/`, which the writers commit to `main` directly and which are
# therefore current either way; only what reflects code or config trails a batch.
# An ops-report change consequently shows up here only after promotion.
#
# Persistence is FULLY in GitHub and never touches the default branch: each run
# renders the current view onto its own Actions run summary and appends the JSON
# snapshot to a dedicated `ops-metrics` branch (an orphan time-series, never
# merged to main — a week-old snapshot backs the substance section's deltas). So
# `main` stays clean and the corpus-write path is untouched. The same push carries
# `status.json`, the public status page's daily snapshot (lane health against each
# workflow's declared schedule, production, coverage, back-test headlines): the
# public site reads it from that branch at its daily build, after this job's tick.
#
# Every run also appends the **weekly performance digest** to its run summary —
# the cells and measured spend produced over the week, the trailing month and
# the Term to date, and the back-test results, every metrics figure carrying its
# artifact's vintage. Its public counterpart is the status page, which carries
# the same windows without spend. A second job opens the reading surface, a
# digest the maintainer closes rather than a standing body this job edits in
# place: an unread digest is an open issue, so the backlog is visible without a
# reading-state store. That job opens the **daily prediction-reading digest**:
# one predicted event with every predictor side by side, on its own
# `daily-digest` issue — unless the maintainer's standing pause variable parks
# it (see the job). That job shares nothing with the `ops` job but the
# schedule — narrower permissions, no corpus, no branch write — which is why it
# is a job rather than another step.
#
# Failure signaling is a separate channel from those digests, and stays one:
# GitHub's own workflow-failure notifications plus the issue-as-alarm labels
# (this job's `data-validation` and `pipeline-health` escalations, and
# run-pull's `pull-log` / `live-log`) carry a break. An open issue under an ALARM label therefore means exactly
# "something is wrong"; an open digest means only "unread". Nothing here files
# an alarm on the happy path, and nothing rewrites a standing body — each
# escalation edits its own issue, and only its own, so a recurring failure
# latches onto one thread instead of spamming new ones.
on:
  schedule:
    - cron: "0 8 * * *" # after run-pull (06:47 live, 07:17 pull) so the day's runs are visible
  workflow_dispatch:

permissions: {}

concurrency:
  group: run-ops
  cancel-in-progress: true

jobs:
  ops:
    runs-on: ubuntu-26.04
    # Setup + report is a couple of minutes; the cap is sized for the degraded
    # API this job's retries exist to survive. Eleven retryable shell calls
    # across its four retried steps, each worth up to 105s when every attempt
    # times out (3 × `timeout 30` plus 5s + 10s of backoff), and the run
    # listing up to 285s on its 90s bound: ~22 min of retry
    # alone. The off-ledger spend sweep makes a retried call per page and per
    # artifact, so it carries its own 10 min cap and gives up quietly rather
    # than eat the escalation's share, and the scheduled-run listing its own
    # 6 min cap the same way: ~38 min in all. Under a 15 min cap the
    # job would be killed mid-recovery, after the ops-metrics snapshot but
    # before the two escalations. This job
    # holds no corpus lock, so a wider cap costs only runner minutes on a day
    # the API is already broken.
    timeout-minutes: 44
    permissions:
      contents: write # read the ledger + push the snapshot to the ops-metrics branch
      actions: read # read the workflow run history for the health section
      issues: write # the data-validation and discovery frontier escalations
    steps:
      # Persist the built-in token so git can fetch/push the ops-metrics branch.
      # This job uploads no artifacts, so credential leakage is not a concern.
      # Full history, because the weekly digest reads each committed metrics
      # artifact's vintage out of the commit that last wrote it: on a depth-1
      # clone the single grafted commit matches every path, so every board
      # would be stamped with today's date. (The renderer refuses to read a
      # shallow history at all and reports the vintage as unknown, so this
      # buys the real dates rather than preventing a wrong one.)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: # zizmor: ignore[artipacked]
          persist-credentials: true
          fetch-depth: 0

      - uses: ./.github/actions/setup-python-env
        with:
          restore-cache: "false"

      - name: Collect recent workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091  # resolved on the runner; actionlint lints this block out of tree
          source "${GITHUB_WORKSPACE}/scripts/gh_retry.sh"
          # The health section groups these by workflow and reads the newest
          # 200 runs of the ordinary workflows — a few weeks across the daily
          # pipelines — plus a day of each polling one (`ops.window_runs`).
          # The listing is wider than that window because corpus-check polls
          # every 30 minutes and would otherwise fill it in days.
          # `headBranch` lets the status snapshot judge the production lanes on
          # `main` runs alone, so a staging rehearsal never reads as one.
          # Twelve pages of 100 take ~35s on a healthy API, past gh_retry's
          # 30s per-request default, so this call gets its own bound.
          GH_RETRY_TIMEOUT=90 gh_retry gh run list --repo "$REPO" --limit 1200 \
            --json workflowName,status,conclusion,createdAt,startedAt,updatedAt,headBranch \
            > runs.json

      # Best-effort and bounded: the schedule-delivery section is a record, so a
      # slow or failing listing drops it rather than delaying the snapshot and
      # the escalation behind it. One listing per scheduled workflow, because
      # the run-list API returns at most 1,000 runs for a filtered query and a
      # week of every workflow's ticks is more than that.
      - name: Collect scheduled runs
        continue-on-error: true
        timeout-minutes: 6
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091  # resolved on the runner; actionlint lints this block out of tree
          source "${GITHUB_WORKSPACE}/scripts/gh_retry.sh"
          since=$(date -u -d '8 days ago' +%Y-%m-%dT%H:%M:%SZ)
          : > schedule-runs.pages
          for file in .github/workflows/*.yml; do
            grep -q -- '- cron:' "$file" || continue
            GH_RETRY_TIMEOUT=60 gh_retry gh api --paginate --slurp \
              "repos/${REPO}/actions/workflows/$(basename "$file")/runs?event=schedule&created=%3E%3D${since}&per_page=100" \
              >> schedule-runs.pages
          done
          jq -s 'add' schedule-runs.pages > schedule-runs.json

      - name: Collect issues wearing a stale fan-out label
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091  # resolved on the runner; actionlint lints this block out of tree
          source "${GITHUB_WORKSPACE}/scripts/gh_retry.sh"
          # An open issue wearing a run:* fan-out label is a marker somebody left
          # behind: nothing keys on those labels, so it is queued work to no one
          # and the report says so rather than letting it read as a round in
          # flight. One gh call per label, merged; the tested
          # `summarize_trigger_issues` does the filtering/ordering.
          for label in run:predict run:evaluate; do
            gh_retry gh issue list --repo "$REPO" --label "$label" --state open --limit 100 \
              --json number,title,labels,createdAt
          done | jq -s 'add | unique_by(.number)' > trigger-issues.json

      - name: Build the ops report
        run: |
          set -euo pipefail
          # Pull the latest corpus verdict + live-frontier snapshot and a prior ops
          # snapshot off the ops-metrics branch (if any). The verdict and frontier
          # are produced by the corpus-writer path — see publish-corpus-verdict —
          # and feed the data-health / substance sections; the prior snapshot backs
          # the substance deltas (the week-old dated file when present, else the
          # newest). All best-effort: absent on the first ever run, which simply
          # drops those fields. run-ops itself never pulls the corpus — it only
          # reads these published artifacts.
          git fetch origin '+refs/heads/ops-metrics:refs/remotes/origin/ops-metrics' 2>/dev/null || true
          prev_args=()
          if git rev-parse --verify --quiet refs/remotes/origin/ops-metrics >/dev/null; then
            if git show origin/ops-metrics:corpus-validation.json > corpus-validation.json 2>/dev/null; then
              prev_args+=(--corpus-validation corpus-validation.json)
            fi
            if git show origin/ops-metrics:live-frontier.json > live-frontier.json 2>/dev/null; then
              prev_args+=(--live-frontier live-frontier.json)
            fi
            week_ago=$(date -u -d '7 days ago' +%Y-%m-%d)
            if git show "origin/ops-metrics:ops-${week_ago}.json" > prev-ops.json 2>/dev/null \
              || git show origin/ops-metrics:latest.json > prev-ops.json 2>/dev/null; then
              prev_args+=(--previous prev-ops.json)
            fi
          fi
          # The weekly performance digest is rendered every run and appended to
          # this run's summary — it is cheap, and this step stays read-only, so
          # nothing here can fail the run before the snapshot and the
          # data-validation escalation have landed.
          # ops-report runs the git-only `validate` over data/ itself for the data-health
          # section, catching anything that reached the default branch without the gate.
          # `--status-out` is the public status page's snapshot (`PublicStatus`),
          # published beside the ops snapshot below for the site to read.
          # The schedule-delivery feed is read only when its step wrote it whole.
          if [ -f schedule-runs.json ]; then
            prev_args+=(--schedule-runs schedule-runs.json)
          fi
          uv run fedcourts ops-report --runs runs.json --trigger-issues trigger-issues.json \
            "${prev_args[@]}" --json new-ops.json --data-health-out data-health.md \
            --discovery-frontier-out discovery-frontier.md \
            --digest-out digest.md --status-out status.json > ops.md
          cat ops.md >> "$GITHUB_STEP_SUMMARY"
          if [ -f digest.md ]; then
            cat digest.md >> "$GITHUB_STEP_SUMMARY"
          fi

      # Test and staging spend: the integration suite, the promotion gate,
      # staging rehearsals and the replay and pilot rounds commit nothing to
      # `data/`, so each spending leg leaves an `off-ledger-spend-*` artifact
      # (the off-ledger-spend composite) and this sweep keeps them on the
      # ops-metrics branch, where they outlive the artifacts' retention, then
      # reports them. Reported apart and counted in no budget: nothing that
      # gates spend reads this branch.
      #
      # Only artifacts uploaded by a run of one of the five recording
      # workflows, from this repository, on `main`, `staging` or `promote/*`
      # are read — the branches that take reviewed code only — so a fork PR's
      # run, which can upload artifacts here too, cannot write a figure. The
      # producing run is looked up per artifact, and each record must name
      # that run, workflow and branch (`off-ledger-spend-ingest`). The files
      # are data: unzipped into an empty directory of their own and parsed,
      # never executed. Best-effort throughout: a fortnight's listing is
      # re-read every day, so an artifact missed today is kept tomorrow, and
      # nothing here can fail the run before the snapshot and the escalation.
      - name: Sweep the off-ledger spend records
        continue-on-error: true
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091  # resolved on the runner; actionlint lints this block out of tree
          source "${GITHUB_WORKSPACE}/scripts/gh_retry.sh"
          base="$RUNNER_TEMP/off-ledger"
          store="$base/off-ledger-spend"
          rm -rf "$base"
          mkdir -p "$store"
          # The records already kept, so the sweep only adds and the report
          # reads the whole series.
          if git rev-parse --verify --quiet refs/remotes/origin/ops-metrics >/dev/null \
            && git cat-file -e origin/ops-metrics:off-ledger-spend 2>/dev/null; then
            git archive origin/ops-metrics off-ledger-spend | tar -x -C "$base"
          fi
          cutoff=$(date -u -d '14 days ago' +%Y-%m-%dT%H:%M:%SZ)
          # The listing is every artifact in the repository, newest first, so
          # the page cap bounds the whole fortnight's uploads, not only these:
          # a heavier fortnight drops its oldest pages, which a daily sweep has
          # already read.
          : > "$base/candidates.tsv"
          for page in $(seq 1 30); do
            listing=$(gh_retry gh api "repos/${REPO}/actions/artifacts?per_page=100&page=${page}")
            count=$(jq '.artifacts | length' <<< "$listing")
            jq -r --arg cutoff "$cutoff" '.artifacts[]
              | select(.name | startswith("off-ledger-spend-"))
              | select(.expired | not)
              | select(.created_at >= $cutoff)
              | [.id, .name, .workflow_run.id] | @tsv' <<< "$listing" >> "$base/candidates.tsv"
            oldest=$(jq -r '[.artifacts[].created_at] | min // ""' <<< "$listing")
            if [ "$count" -lt 100 ] || [[ "$oldest" < "$cutoff" ]]; then
              break
            fi
          done
          while IFS=$'\t' read -r artifact name run; do
            [ -n "$artifact" ] || continue
            # Already kept: the artifact is `off-ledger-spend-<leg>-<attempt>`
            # and its record `<run>-<attempt>-<leg>.json`, so skip the lookups.
            suffix="${name#off-ledger-spend-}"
            if [ -f "$store/${run}-${suffix##*-}-${suffix%-*}.json" ]; then
              continue
            fi
            meta=$(gh_retry gh api "repos/${REPO}/actions/runs/${run}" \
              --jq '[.path, .head_branch, .head_repository.full_name] | @tsv') || continue
            IFS=$'\t' read -r path branch head_repo <<< "$meta"
            [ "$head_repo" = "$REPO" ] || continue
            case "$branch" in main | staging | promote/*) ;; *) continue ;; esac
            case "$path" in
              .github/workflows/integration-test.yml | .github/workflows/run-analytics.yml \
                | .github/workflows/summarize.yml | .github/workflows/run-backtest.yml \
                | .github/workflows/run-evaluate.yml) ;;
              *) continue ;;
            esac
            workflow=$(basename "$path" .yml)
            dir="$base/artifact-${artifact}"
            mkdir -p "$dir"
            if ! gh_retry gh run download "$run" --repo "$REPO" --name "$name" --dir "$dir" >/dev/null; then
              echo "::warning::off-ledger spend artifact ${artifact} (run ${run}) did not download; the next sweep retries it"
              continue
            fi
            uv run fedcourts off-ledger-spend-ingest --from "$dir" --run-id "$run" \
              --workflow "$workflow" --ref "$branch" --store "$store"
          done < "$base/candidates.tsv"
          uv run fedcourts off-ledger-spend-report --store "$store" >> "$GITHUB_STEP_SUMMARY"

      - name: Append the snapshot to the ops-metrics branch
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "fedcourts-bot"
          git config user.email "bot@users.noreply.github.com"
          stamp=$(date -u +%Y-%m-%dT%H%M%SZ)
          day=$(date -u +%Y-%m-%d)
          tree=$(mktemp -d)
          # Build on the existing orphan branch, or start one with no main history.
          if git rev-parse --verify --quiet refs/remotes/origin/ops-metrics >/dev/null; then
            git worktree add "$tree" origin/ops-metrics
            git -C "$tree" checkout -B ops-metrics
          else
            git worktree add --detach "$tree"
            git -C "$tree" checkout --orphan ops-metrics
            git -C "$tree" rm -rf . >/dev/null 2>&1 || true
          fi
          cp new-ops.json "$tree/ops-${day}.json" # dated history (last write of the day wins)
          cp new-ops.json "$tree/latest.json"     # the fallback prior snapshot for the deltas
          # The swept off-ledger spend records (see the sweep step), when it ran.
          if [ -d "$RUNNER_TEMP/off-ledger/off-ledger-spend" ]; then
            mkdir -p "$tree/off-ledger-spend"
            cp "$RUNNER_TEMP/off-ledger/off-ledger-spend/"*.json "$tree/off-ledger-spend/" 2>/dev/null || true
          fi
          # The public status page reads status.json, so only a run on `main` (the
          # promoted tree and its data) writes it, and only when it was rendered.
          if [ "$REF_NAME" = "main" ] && [ -f status.json ]; then
            cp status.json "$tree/status.json"
          fi
          git -C "$tree" add -A
          if git -C "$tree" diff --cached --quiet; then
            echo "No ops change to persist."
          else
            git -C "$tree" commit -m "ops: snapshot ${stamp}"
            # A push fails for one of two reasons: the validate writer advanced
            # the branch (its files never overlap these, so a rebase absorbs
            # it), or a transient GitHub error such as `remote: fatal error in
            # commit_refs` that only needs outlasting. Rebase and retry with a
            # doubling backoff, then fail loudly once the attempts run out.
            # A rebase conflict is never transient and fails the step at once,
            # with an error naming it.
            attempts=5
            backoff=5
            pushed=false
            for attempt in $(seq 1 "$attempts"); do
              if git -C "$tree" push origin ops-metrics; then
                pushed=true
                break
              fi
              if [ "$attempt" -lt "$attempts" ]; then
                echo "::warning::ops-metrics push failed (attempt ${attempt}/${attempts}); rebasing and retrying in ${backoff}s"
                sleep "$backoff"
                backoff=$((backoff * 2))
                git -C "$tree" fetch origin '+refs/heads/ops-metrics:refs/remotes/origin/ops-metrics' || true
                if ! git -C "$tree" rebase origin/ops-metrics; then
                  git -C "$tree" rebase --abort || true
                  echo "::error::rebase conflict on ops-metrics; another writer touched the ops snapshot's files"
                  exit 1
                fi
              fi
            done
            if [ "$pushed" != true ]; then
              echo "::error::could not push the ops snapshot to ops-metrics after ${attempts} attempts"
              exit 1
            fi
          fi
          git worktree remove --force "$tree"

      - name: Escalate a failing data-validation verdict
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091  # resolved on the runner; actionlint lints this block out of tree
          source "${GITHUB_WORKSPACE}/scripts/gh_retry.sh"
          # Loud-but-non-blocking escalation: on a failing data-health verdict, open
          # OR update ONE long-lived data-validation issue (reuse, don't spam — the
          # same find-or-create idiom as run-pull's pull-log alarm); when it goes
          # green again, close that issue. `data-validation` is a NON-triggering label by
          # design (no workflow keys on `issues: labeled`). Create it idempotently.
          gh_retry gh label create data-validation --repo "$REPO" --force \
            --color b60205 --description "Long-lived data-validation failure (run-ops escalation)"
          ok=$(jq -r '.data_health.ok' new-ops.json)
          # This step's own alarm only: the open issue it files, titled "Data
          # validation failing" and authored by the ambient token's bot. A green
          # verdict closes what this matches, so matching on the label alone
          # would close any other open issue that carries `data-validation`.
          # The retried listing lands in a variable before jq filters it, so an
          # exhausted retry fails the assignment rather than reading as "no
          # issue".
          listing=$(gh_retry gh api "repos/${REPO}/issues?labels=data-validation&state=open&per_page=100")
          num=$(jq -r '[.[] | select(.title == "Data validation failing"
                          and .user.login == "github-actions[bot]"
                          and (has("pull_request") | not))][0].number // empty' <<<"$listing")
          if [ "$ok" = "false" ]; then
            if [ -z "$num" ]; then
              gh_retry gh issue create --repo "$REPO" --title "Data validation failing" \
                --label data-validation --body-file data-health.md
            else
              # Refresh the single open issue in place with the latest failing checks.
              gh_retry gh issue edit "$num" --repo "$REPO" --body-file data-health.md
            fi
          elif [ -n "$num" ]; then
            # Resolved: data validation is green again, so close the escalation issue.
            gh_retry gh issue comment "$num" --repo "$REPO" \
              --body "✅ Data validation is green again as of the latest ops run — closing."
            gh_retry gh issue close "$num" --repo "$REPO" --reason completed
          fi

      - name: Escalate a discovery frontier that is behind
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091  # resolved on the runner; actionlint lints this block out of tree
          source "${GITHUB_WORKSPACE}/scripts/gh_retry.sh"
          # The discovery frontier check's verdict rides the live-frontier
          # snapshot the corpus-writer path publishes (fedcourts live-frontier):
          # whether each numbering stream of the current Term reached the
          # Court's real frontier. This step latches it the way the
          # data-validation escalation above latches its verdict: open OR
          # refresh ONE long-lived issue while an alarm stands, close it when
          # the check is clean. No published verdict (the check is off, or no
          # snapshot has landed) is neither: the step leaves any open issue as
          # it is rather than closing it on missing evidence.
          ok=$(jq -r '.substance.live_frontier.discovery.ok | if . == null then "unknown" else tostring end' new-ops.json)
          if [ "$ok" = "unknown" ]; then
            echo "No discovery frontier verdict in the published snapshot; nothing to latch."
            exit 0
          fi
          if [ ! -s discovery-frontier.md ]; then
            echo "::warning::discovery frontier verdict read but its alarm body is missing; nothing latched"
            exit 0
          fi
          # `pipeline-health` is a NON-triggering label by design (no workflow
          # keys on it), shared with run-seed's guard and created with the same
          # color and description so neither `--force` rewrites the other's.
          gh_retry gh label create pipeline-health --repo "$REPO" --force \
            --color b60205 --description "Long-lived corpus-writer failure"
          # Match this alarm's own title AND the workflow bot as author, since
          # the label is shared: closing whichever issue wears it would close
          # another alarm's. The listing is captured in a variable first so a
          # failed read fails the step instead of reading as "none open".
          listing=$(gh_retry gh api "repos/${REPO}/issues?labels=pipeline-health&state=open&per_page=100")
          num=$(jq -r '[.[] | select(.title == "Discovery frontier behind"
                          and .user.login == "github-actions[bot]"
                          and (has("pull_request") | not))][0].number // empty' <<<"$listing")
          if [ "$ok" = "false" ]; then
            if [ -z "$num" ]; then
              gh_retry gh issue create --repo "$REPO" --title "Discovery frontier behind" \
                --label pipeline-health --body-file discovery-frontier.md
            else
              # Refresh the single open issue in place with the standing alarms.
              gh_retry gh issue edit "$num" --repo "$REPO" --body-file discovery-frontier.md
            fi
          elif [ -n "$num" ]; then
            gh_retry gh issue comment "$num" --repo "$REPO" \
              --body "✅ No discovery frontier alarm stands as of the latest ops run — closing."
            gh_retry gh issue close "$num" --repo "$REPO" --reason completed
          fi

  # The prediction-reading habit: one predicted event with every predictor side
  # by side, opened as a fresh `daily-digest` issue the maintainer reads and
  # closes — so the open issues under that label ARE the unread backlog and no
  # reading-state store has to exist. Its own job rather than a step on `ops`
  # because permissions are per-job and this one's needs are strictly narrower:
  # it reads the committed ledger and writes issues, and never touches the
  # ops-metrics branch, the run history, or the corpus.
  daily-digest:
    # Gated on one thing only: the maintainer's standing pause. The repository
    # variable DAILY_DIGEST_PAUSED set to `true` parks this job — the code, the
    # command and the label all stay, and clearing the variable resumes it on
    # the next tick — while the `ops` job, which shares only this workflow's
    # schedule, keeps running. Unset or any other value runs the job, so an
    # absent variable is the live state, never a silent pause. The website's per-case board carries the same reading, which is
    # what makes a daily issue optional. A manual dispatch does not bypass the
    # pause: a dispatch is the recovery handle for the ops report, and it must
    # not post a digest the maintainer parked — to force one, clear the
    # variable, dispatch, and set it again, a visible act rather than an
    # override.
    #
    # Not gated on the schedule: it runs on every trigger this workflow has,
    # and the command's own DAY marker makes it once-a-day rather than
    # once-a-run. A schedule filter here would be fail-open (true for every
    # cron string it does not name), and a dispatch after a failed or missed
    # run makes up the day while posting nothing on a day already digested.
    if: ${{ vars.DAILY_DIGEST_PAUSED != 'true' }}
    runs-on: ubuntu-26.04
    # Setup plus a read of `data/`; the headroom is for the four bounded `gh`
    # calls the command can make (two listings, the label, the create), each
    # worth up to 105s against a degraded API.
    timeout-minutes: 15
    permissions:
      contents: read # read the committed ledger under data/
      issues: write # open the digest issue under the non-triggering label
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # this job pushes nothing

      - uses: ./.github/actions/setup-python-env
        with:
          restore-cache: "false"

      - name: Open the daily prediction-reading digest
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          # The ref this job checked out, so the digest's links point at the tree
          # it actually read — the default branch on a schedule, the dispatcher's
          # branch on a manual run. Bound through the environment rather than
          # interpolated into the script.
          REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # `daily-digest` is a NON-triggering label by design (no run:* workflow
          # keys on it, and it must never become one — an issue opened under a
          # trigger label would start a spending run from a reporting job). The
          # command creates it idempotently.
          #
          # Selection, rendering, the marker idempotency, and the bounded gh
          # retry all live in tested Python (`fedcourts daily-digest`), so this
          # step stays a thin wrapper with no `gh` of its own. It reads the
          # committed ledger only: no corpus credential, no model call.
          uv run fedcourts daily-digest --repo "$REPO" --ref "$REF" --post \
            --out daily-digest.md
          # An empty ledger writes no body; the digest still reports what it did
          # on stderr, which the job log carries.
          if [ -f daily-digest.md ]; then
            cat daily-digest.md >> "$GITHUB_STEP_SUMMARY"
          fi
