name: run-backtest

# Cert back-test: replay the enabled predictors over decided modern
# discretionary-cert petitions — a salted-hash random draw on the cron, the most
# recently decided by default (outcomes hidden — redacted snapshots in a
# scratch tree, never data/, and the committed ledger removed from the working
# tree for the replay so no outcome sits beside the cells) and land the
# refreshed `metrics/cert-backtest.json` as a **reviewed** PR — never a direct
# commit, never auto-merged. Retrospective by construction: iteration signal,
# never claimable performance (see metrics/README.md).
#
# Replaying agentic engines SPENDS MODEL TOKENS (~one cell per predictor per
# petition), so no run spends without an explicit maintainer decision. There are
# two ways in and neither spends on its own. **The schedule asks; the hold
# spends**: the fortnightly cron derives its plan under pinned parameters and
# then waits on the `review` environment's required reviewers, so a released run
# is a maintainer's opt-in and an unreleased one is a skipped fortnight that cost
# nothing. A **`workflow_dispatch`** is gated by GitHub on repository write and
# keeps its free parameters, its `engine` input defaulting to the free offline
# `stub` so an accidental dispatch spends nothing; pick `auto` deliberately to
# route each predictor through its real engine. The cadence is standing, the
# spend is not: no tokens move without a human.
#
# Dispatch also selects WHAT is replayed: `replay: cert` (the default) replays
# the predictors; `replay: salience-gate` replays the deterministic salience
# gate over past Terms instead (`fedcourts salience-replay` into
# `metrics/salience-replay.json`) — offline over the pulled corpus, no model
# tokens, no engine credential, no agent CLI — landing its report through the
# same reviewed-PR path. `replay: merits` replays the predictors over decided
# argued merits cases instead, at the grant and briefed moments
# (`fedcourts merits-backtest` into `metrics/merits-backtest.json`): dispatch
# only, never on the cron, spending two cells per predictor per case under
# `engine: auto`, and uploading each cell's prediction files (never its record)
# as a run artifact for the forecast-document grading pilot.
on:
  schedule:
    # 06:23 UTC on Saturdays. The slot is chosen for the runway behind it, not
    # for the corpus in front of it: a released fortnight has to derive its
    # plan, wait however long the hold takes, run up to its 330-minute cap (the
    # pinned ten petitions' cells come to ~40-60 minutes at the measured serial
    # rates, not yet measured as lanes), and then land a
    # **reviewed** PR while the weekend is still running — roughly 50 hours
    # before the working week, which no weekday slot leaves. It opens after
    # run-pull's 04:47 live window (40-minute cap) has committed and before the
    # 06:47 live window; the replay only ever reads the corpus
    # and takes no `corpus-write` lock, so an overlap would cost a staler read
    # and nothing else. The minute is off every other workflow's (:00, :12, :13,
    # :17, :19, :26, :27, :30, :31, :32, :36, :39, :41, :43, :47, :49, :53, :57)
    # so the repo's offset grid
    # stays legible.
    #
    # The **effective cadence is biweekly**, and the cron cannot say so: GitHub
    # cron has no fortnight, and `0 6 */14 * *` is a day-of-month stride that
    # resets every month rather than a two-week one. So the cron fires weekly
    # and the `cadence` job below drops the odd ISO weeks — a guard in a step,
    # because expressions carry no date function and a job-level `if` therefore
    # cannot compute a week number at all. An odd week is a cheap successful
    # no-op (the run gate's read-only job, then one runner with no checkout, no
    # corpus and no credential), never a failure.
    #
    # GitHub delivers `schedule` events best-effort: a slot can be delayed or
    # dropped with no record, and a newly registered cron sometimes never
    # indexes until the file changes again on the default branch. A missed
    # fortnight costs a fortnight — this lane is a sampled measurement, not a
    # level-triggered backlog that re-derives — and the digest states the
    # standing report's vintage either way.
    - cron: "23 6 * * 6"
  workflow_dispatch:
    inputs:
      replay:
        description: "cert = predictors over decided petitions; merits = predictors over decided argued cases at two moments; salience-gate = the salience gate over past Terms (token-free). cert and merits spend per `engine`."
        type: choice
        options: [cert, merits, salience-gate]
        default: cert
      engine:
        description: "cert and merits: stub = free offline dry run; auto = each predictor's real engine (SPENDS TOKENS)."
        type: choice
        options: [stub, auto]
        default: stub
      # cert takes the N most recently decided petitions, or a random draw
      # under `spread`. merits caps at 20 because a larger draw outlasts the job.
      limit:
        description: "cert: N petitions, one cell per predictor each. merits: N random cases, 1 to 20, two cells per predictor each. Spend scales with N."
        type: string
        default: "25"
      terms:
        description: "salience-gate and merits: comma-separated October Terms (merits: the argued Terms)."
        type: string
        default: "2022,2023,2024"
      skip_engines:
        description: "Comma-separated engines to leave out (e.g. gemini). Empty runs all three."
        type: string
        default: ""
      scope:
        description: "cert population: all = every modern-cert petition; paid = no IFP; selected = the salience gate's live-comparable core."
        type: choice
        options: [all, paid, selected]
        default: all
      spread:
        description: "cert: draw a random sample instead of the most recently decided N."
        type: boolean
        default: false

permissions: {}

# What the run replays. Resolved once, at workflow level, so the plan a
# maintainer releases and the command that then runs read the SAME values: the
# cron path PINS its parameters and a dispatch keeps its own free ones. On a
# `schedule` the `inputs` context is empty, so nothing below may read `inputs.*`
# directly — an unresolved `inputs.limit` would pass an empty `--limit`.
#
# The pins are the standing measurement — 10 petitions, all three real engines,
# the paid modern-cert population, drawn at random by the salted-hash rule —
# and what a fortnight costs is whatever the replay's off-ledger spend record
# measures against exactly them (its cells reach no ledger; see the record
# step below).
#
# `--scope paid` is the pin, not the wider `all`, because the population has to
# carry signal at this sample size: the paid class resolves grant-or-GVR at
# ~5.6-7.9% a Term against ~2.3-3.3% over the whole modern-cert population
# (metrics/statpack.json), so ten paid petitions hold roughly 2.3x the
# grant-family mass ten unfiltered ones do. The two failure modes an unfiltered
# draw invites are different ones: the lift reads off all ten petitions but
# against an always-deny floor that denial purity pins at or near 1.00, which
# makes it uninformative rather than empty; the per-band breakdown goes
# genuinely empty, since it scores paid rows only and would drop about seven of
# the ten. `paid` is a corpus
# fact (modern cert, fee class) with no config knob behind it, unlike
# `selected`, whose meaning moves with the salience floor — so consecutive
# fortnights stay samples of one population without a second thing to hold
# still.
#
# `skip_engines` needs no ternary: unset IS the pin (no engine opted out). The
# `x && y || z` idiom could not express it anyway — '' is falsy, so the true
# branch would fall through to the false one.
env:
  BT_REPLAY: ${{ github.event_name == 'schedule' && 'cert' || inputs.replay }}
  BT_ENGINE: ${{ github.event_name == 'schedule' && 'auto' || inputs.engine }}
  BT_LIMIT: ${{ github.event_name == 'schedule' && '10' || inputs.limit }}
  BT_SCOPE: ${{ github.event_name == 'schedule' && 'paid' || inputs.scope }}
  BT_SPREAD: ${{ github.event_name == 'schedule' && 'true' || inputs.spread }}
  BT_SKIP_ENGINES: ${{ inputs.skip_engines }}
  BT_TERMS: ${{ inputs.terms }}

jobs:
  # The run gate (src/fedcourtsai/run_gate.py): a dispatch, or a re-run of any
  # run, proceeds only for a login config/dispatchers.json names. No
  # environment, no secret, a read-only token, and no project code: a sparse
  # checkout of the gate and its allow-list alone, run by path with the
  # runner's Python in isolated mode. Every other job needs this one and checks
  # the attempt it judged, because re-running some jobs does not re-run this
  # one; `run-gate` below fails the run when that check refused.
  authorize:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      attempt: ${{ steps.decide.outputs.attempt }}
      rerunners: ${{ steps.decide.outputs.rerunners }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            src/fedcourtsai/run_gate.py
            config/dispatchers.json
          sparse-checkout-cone-mode: false
      - name: Authorize who started this run
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: >-
          python3 -I -S src/fedcourtsai/run_gate.py --workflow run-backtest.yml
          --event-name "$EVENT_NAME" --actor "$ACTOR"
          --triggering-actor "$TRIGGERING_ACTOR" --run-attempt "$RUN_ATTEMPT"
          --github-output "$GITHUB_OUTPUT"

  # The fortnight gate, and, beside the run gate's read-only job, the whole cost
  # of a fortnight that does not run: one runner, no checkout, no corpus, no
  # credential, no token. Cron-only — a
  # dispatch is already a human choosing parameters, and neither guard below has
  # anything to add to that.
  cadence:
    needs: [authorize]
    if: >-
      ${{ github.event_name == 'schedule'
      && needs.authorize.result == 'success'
      && (needs.authorize.outputs.attempt == github.run_attempt
      || contains(needs.authorize.outputs.rerunners, format(',{0},', github.triggering_actor))) }}
    runs-on: ubuntu-26.04
    # Two short checks; the cap is the runner's own setup with room.
    timeout-minutes: 5
    permissions:
      # This workflow's own run history, for the overlap guard. Repo-wide read
      # of run metadata; this job runs no agent code and downloads no artifact.
      actions: read
    outputs:
      # `false` whenever either guard withheld the fortnight, and `''` never:
      # a skipped `overlap` step leaves an empty output, which compares false.
      proceed: ${{ steps.parity.outputs.run == 'true' && steps.overlap.outputs.clear == 'true' }}
    steps:
      # Biweekly, expressed where a fortnight can actually be computed. ISO week
      # parity is the rule: even weeks run, odd weeks do not. `date +%V` is the
      # ISO 8601 week, so the parity is a property of the calendar rather than
      # of when this workflow was last edited — a rebuilt runner, a missed slot,
      # or a re-registered cron all land on the same fortnights.
      #
      # The seam, stated: an ISO year with 53 weeks puts two odd weeks back to
      # back (…52, 53, then week 01), so once every five or six years the gap
      # between released Saturdays is three weeks rather than two. Accepted —
      # the cadence is a spend bound, not a measurement clock. Every gap, this
      # one included, is a fortnight with no new sample; the standing report is
      # unchanged and the digest renders its vintage.
      - name: Hold every other ISO week
        id: parity
        run: |
          set -euo pipefail
          iso=$(date -u +%G-W%V)
          # 10# forces base 10: weeks 08 and 09 are not octal.
          if [ $((10#$(date -u +%V) % 2)) -eq 0 ]; then run=true; else run=false; fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          {
            echo "## run-backtest — fortnight parity"
            echo ""
            if [ "$run" = true ]; then
              echo "\`${iso}\` is an even ISO week: this fortnight's replay derives its plan below."
            else
              echo "\`${iso}\` is an odd ISO week: the cron fires weekly and this lane runs biweekly, so this run stops here having spent nothing. The next even week derives one."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # The skip-if-still-running guard, and what serializes the *asks*. The
      # concurrency group sits on the replay job alone, so it serializes spends
      # and nothing else: two crons can otherwise both derive a plan and both
      # ask for a release while a fortnight is stuck against the 330-minute cap
      # or parked on the hold for days. A run that was queued while an earlier
      # one was still going is that twin, and it skips rather than replaying the
      # same population hours later.
      #
      # Fail-open on an API error, and deliberately: the `review` hold, not this
      # guard, is what stands between a plan and a spend, so the worst an
      # unreadable run history can buy is a maintainer asked to release a
      # fortnight they may decline. The reverse — a fortnight lost to a
      # transient 5xx — costs a sample nobody sees go missing. Two more paths
      # fail open the same way and for the same reason: a predecessor pushed
      # past the 20-run window this reads, and a `gh` call that hangs, which the
      # `timeout` below turns into that same warning rather than into a job that
      # burns the cap and fails. What counts as a predecessor is any earlier run
      # of this workflow, the token-free `salience-gate` mode included — a
      # skipped fortnight is cheap, and mode-matching would be a second thing to
      # keep true.
      - name: Skip a fortnight queued behind a run still going
        id: overlap
        if: steps.parity.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          clear=true
          blocking=""
          if runs=$(timeout 30 gh api "repos/${REPO}/actions/workflows/run-backtest.yml/runs?per_page=20"); then
            # This run's own queue time, read from the same payload rather than
            # from a second call. Empty if the listing did not carry it, which
            # makes every comparison below false — fail-open, as above.
            self=$(jq -r --arg id "$GITHUB_RUN_ID" \
              '.workflow_runs[] | select((.id|tostring) == $id) | .created_at' <<<"$runs")
            # An older run is blocking when it is still not `completed`, or when
            # it was last touched after this run was queued — which is how a run
            # that finished while this one waited in the concurrency queue names
            # itself.
            blocking=$(jq -r --arg id "$GITHUB_RUN_ID" --arg t "$self" '
              [ .workflow_runs[]
                | select((.id|tostring) != $id and .created_at < $t)
                | select(.status != "completed" or .updated_at > $t)
                | "\(.id) [\(.status)]" ] | join(", ")' <<<"$runs")
            if [ -n "$blocking" ]; then clear=false; fi
          else
            echo "::warning::could not read this workflow's run history; proceeding — the review hold is the spend gate" >&2
          fi
          echo "clear=$clear" >> "$GITHUB_OUTPUT"
          if [ "$clear" != true ]; then
            {
              echo ""
              echo "This fortnight was queued behind a back-test that was still going (${blocking}), so it would replay the same population hours after it. Skipped, having spent nothing; the next even ISO week derives a fresh plan."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  # The plan the hold is judged on. Costs a corpus pull and no tokens: it states
  # the pinned parameters the release would spend under, the vintage of the blob
  # the population is drawn from, and the predictors that would be routed — so a
  # maintainer is never asked to release a spend with nothing to read. It also
  # fails a corpus-less fortnight here, before the ask, rather than after it.
  #
  # The vintage is the plan's, not the run's: the release may come hours later
  # and the replay job pulls its own corpus, so this line bounds the population
  # described here rather than certifying the one that runs.
  plan:
    needs: [authorize, cadence]
    if: >-
      ${{ needs.cadence.outputs.proceed == 'true'
      && needs.authorize.result == 'success'
      && (needs.authorize.outputs.attempt == github.run_attempt
      || contains(needs.authorize.outputs.rerunners, format(',{0},', github.triggering_actor))) }}
    runs-on: ubuntu-26.04
    # A corpus pull plus two local reads. Bounded so a wedged pull names itself
    # rather than running out the runner's six-hour default: this job takes no
    # lock, but a run stuck here counts as an in-flight back-test for the
    # promotion gate's quiescence check and parks a hold that never arrives.
    timeout-minutes: 30
    environment: prod
    permissions:
      contents: read
      id-token: write # assume the read-only AWS role to pull the corpus
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-python-env
        with:
          restore-cache: "false"

      - uses: ./.github/actions/corpus-readonly
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME_READONLY }}
          aws-region: ${{ vars.AWS_REGION }}
          corpus-base-url: ${{ vars.CORPUS_BASE_URL }}
          missing-pointer: warn
          # The default duration: this job pulls the index and then reads it
          # locally, so nothing needs the credential after the pull returns.

      - name: Report the plan for release
        env:
          # The corpus estate's base URL, exactly as the replay job wires it.
          FEDCOURTS_CORPUS_BASE_URL: ${{ vars.CORPUS_BASE_URL }}
        run: |
          set -euo pipefail
          if [ ! -f corpus/corpus.db ]; then
            echo "::error::no corpus on disk; nothing to back-test" >&2
            exit 1
          fi
          {
            echo "## run-backtest — the fortnight's plan"
            echo ""
            # The pins are read from the same workflow env the replay command
            # reads, never retyped: a plan that restated them would be the one
            # document able to describe a spend the run does not make.
            printf 'Pinned on the cron path: `--engine %s` (each predictor through its own real engine), `--limit %s`, `--scope %s`, salted-hash random draw (`--spread`): `%s`. Replay mode `%s`; engines opted out: none.\n' \
              "$BT_ENGINE" "$BT_LIMIT" "$BT_SCOPE" "$BT_SPREAD" "$BT_REPLAY"
            echo ""
            echo 'The draw ranks every petition in the population by a salted hash of its case id keyed by the corpus vintage, and walks that order passing over any petition holding no replayable snapshot, so the set is a random sample of the replayable population and the report'"'"'s `provenance.draw` records the rule, its key and how many were passed over. The same blob draws the same set; a newer blob draws afresh. The report'"'"'s own `events_scored` is what was measured.'
            echo ""
            echo 'Corpus the population is drawn from — the vintage of the blob this plan read, not of the one a released run pulls:'
            echo '```'
            uv run fedcourts corpus-info
            echo '```'
            echo 'Predictors the replay would route, one cert cell each per petition:'
            echo '```'
            uv run fedcourts predictors
            echo '```'
            # The per-engine predict rates are pinned in the CLI rate table
            # (fedcourtsai.cli._PLANNING_RATES_USD_PER_CELL). They are restated
            # here because neither command this step runs prices a fan-out, and
            # a maintainer judging the hold needs the number in front of them; a
            # re-anchor of that table moves this line too.
            bt_cost=$(awk -v n="$BT_LIMIT" 'BEGIN { printf "%.0f", n * 6.79 }')
            printf 'Nothing has spent yet. Releasing the `review` hold below is what spends: up to the limit above x the routable predictors, one cert cell each. At the shipped predict rates as pinned in the CLI rate table ($4.27 claude-code + $1.88 codex + $0.64 gemini, about $6.79 an event across the three engines), %s petitions is on the order of $%s; the off-ledger spend record this run leaves (`fedcourts off-ledger-spend-report`) measures what it actually spent. Declining the hold, or letting it expire, is a skipped fortnight — a first-class outcome of this lane, and the digest states the standing vintage either way.\n' \
              "$BT_LIMIT" "$bt_cost"
            echo ""
            echo 'One operational consequence of leaving this pending: a run waiting on a hold counts as an in-flight back-test for the promotion gate'"'"'s quiescence check, so a parked fortnight blocks promotions until it is released or declined.'
          } >> "$GITHUB_STEP_SUMMARY"

  # The hold. This job carries no code, no token and no permissions — its one
  # purpose is the deployment environment: the `review` environment's required
  # reviewers gate it, so the replay behind it waits on an explicit,
  # audit-logged release. Strictly manual by design: there is no wait timer to
  # auto-approve it, because the registered rationale is that no tokens move
  # without a human. The wait happens before the job is scheduled, so
  # timeout-minutes bounds only the no-op itself. The environment must exist
  # WITH required reviewers configured before this reaches main: GitHub
  # auto-creates a referenced environment unprotected, and an unprotected
  # environment is no gate at all.
  #
  # It composes with the replay job's `environment: prod` rather than replacing
  # it: `prod` is the ref gate (its deployment branches are restricted to
  # `main`, which is what refuses a dispatch from an arbitrary ref), `review` is
  # the spend gate. Two environments, two questions — which ref may run this,
  # and may this particular run spend — so the replay job keeps `prod` and
  # gains a `needs` on this one.
  approval:
    needs: [authorize, plan]
    if: >-
      ${{ needs.authorize.result == 'success'
      && (needs.authorize.outputs.attempt == github.run_attempt
      || contains(needs.authorize.outputs.rerunners, format(',{0},', github.triggering_actor))) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    environment: review
    permissions: {}
    steps:
      - name: Release the fortnight's replay
        run: echo "the review hold released — the replay may spend."

  # A hold that did not release still has to leave a durable record, and the
  # record is this job's step summary — rendered onto the same run page as the
  # plan the decision was made on, so the two read together. `!= 'success'`
  # covers the whole class: the Reject button (a failed deployment), a cancelled
  # or expired wait, and a plan job that died before the hold (approval then
  # skipped). No token and no permissions, because a step summary needs neither.
  rejected:
    needs: [authorize, cadence, plan, approval]
    if: >-
      ${{ always() && needs.cadence.outputs.proceed == 'true' && needs.approval.result != 'success'
      && needs.authorize.result == 'success'
      && (needs.authorize.outputs.attempt == github.run_attempt
      || contains(needs.authorize.outputs.rerunners, format(',{0},', github.triggering_actor))) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Record the fortnight that did not spend
        env:
          RESULT: ${{ needs.approval.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          {
            echo "## run-backtest — the review hold did not release"
            echo ""
            echo "The \`review\` hold ended as \`${RESULT}\` — rejected, cancelled, expired, or the plan failed before the hold — so no cell ran and nothing was spent. A skipped fortnight is a first-class outcome of this lane, not a failure of it."
            echo ""
            echo "The plan on the \`plan\` job of this run is the record of what was declined; if none appears there, the plan failed before rendering one: ${RUN_URL}"
            echo ""
            echo "Nothing is stranded and nothing has to be re-filed: the standing \`metrics/cert-backtest.json\` is untouched and the digest renders its vintage honestly, the next even ISO week derives a fresh plan, and a \`workflow_dispatch\` runs one now. A hold left pending counts as an in-flight run for the promotion gate's quiescence check, so decline it rather than parking it when a promotion is waiting."
          } >> "$GITHUB_STEP_SUMMARY"

  backtest:
    needs: [authorize, cadence, plan, approval]
    # A dispatch reaches this job directly — `cadence`, `plan` and `approval`
    # all skip, and the dispatcher's own parameter choice (with `engine`
    # defaulting to the free stub) is the deliberate decision. The cron path
    # reaches it only on an even ISO week, clear of a still-running twin, with a
    # plan that derived, and a hold that a human released.
    if: >-
      ${{ (!cancelled()
          && (github.event_name != 'schedule'
              || (needs.cadence.outputs.proceed == 'true'
                  && needs.plan.result == 'success'
                  && needs.approval.result == 'success')))
      && needs.authorize.result == 'success'
      && (needs.authorize.outputs.attempt == github.run_attempt
      || contains(needs.authorize.outputs.rerunners, format(',{0},', github.triggering_actor))) }}
    runs-on: ubuntu-26.04
    # One back-test at a time, and the lock sits on the job that does the work
    # rather than on the workflow: a group is assigned before any job condition
    # runs, so a workflow-level group would let the ~26 odd-week no-ops a year
    # take the lock and evict a maintainer's dispatch from the group's single
    # pending slot. `cadence` and `plan` are read-only and need no lock.
    #
    # `cancel-in-progress: false` protects the *running* replay, not the queue
    # behind it: a superseded parameter choice is the maintainer's to cancel,
    # never silently dropped. A run parked on the hold does not hold this lock —
    # only a replay that is actually spending does — so a dispatch is never
    # queued behind a fortnight nobody has released yet. The mirror case is the
    # one to know: a dispatch running when a fortnight is released queues that
    # replay behind it, and a second dispatch arriving before the first ends
    # supersedes the queued one — a release granted and then not spent, which
    # `rejected` does not report because the hold succeeded. Two dispatches
    # inside one hold is what it takes; check the released run started before
    # dispatching again.
    concurrency:
      group: run-backtest
      cancel-in-progress: false
    outputs:
      # Whether the arm's report was handed off; `publish` runs on it.
      report: ${{ steps.report.outputs.present }}
    # Sized as headroom for ~25 petitions x 3 routable predictors of real agent
    # cells (claude-code, codex, gemini) plus the corpus pull (~75 cells at the
    # dispatch default); the cap is what keeps a hung engine from burning six
    # billable hours. The cells run in one lane per engine: each engine's cells
    # in series, the three lanes at once (`fedcourts cert-backtest`), so the
    # replay's wall clock is the slowest lane's, not the sum. Measured serial
    # rates: the first 25-petition campaign (all 75 cells in series, 300
    # minutes) — codex a median 2.3 min/cell, each gemini cell with the claude
    # cell after it ~9, claude ~3 of that; the 2026-09-21 validation dispatch,
    # with gemini's file tools admitted to the work root — gemini 15 cells in 57
    # minutes, ~3.8/cell. So the gemini lane sets it: ~95 minutes at 25
    # petitions and ~40 at the cron's pinned 10 on that one 15-cell dispatch,
    # or ~150 and ~60 if gemini runs at the ~6/cell the first campaign implies,
    # before whatever three engines sharing one runner cost each and any
    # retry backoff a lane absorbs. The cap is deliberately not lowered to that:
    # a cap that killed a legitimately-running replay would waste the spend it
    # had already made, and a slow or retrying engine stretches only its own
    # lane — though a hung one still holds the report, which waits on every
    # lane, until this cap ends the job. This 330-minute cap is the hard ceiling
    # the cadence guard and the cron slot's runway are both written against.
    timeout-minutes: 330
    environment: prod
    permissions:
      contents: read
      id-token: write # assume the read-only AWS role to pull the corpus
    steps:
      # No authorization gate here, and none is missing: this workflow carries
      # no trigger an outside actor can reach. A `schedule` fires only from the
      # DEFAULT branch, so a cron can run only what a maintainer-approved
      # promotion put on `main`; a `workflow_dispatch` is gated by GitHub on
      # repository write; and this job binds `prod`, whose deployment branches
      # are restricted to `main`, so a dispatch from any other ref is refused
      # before a step runs. On the dispatch path the spend is the dispatcher's
      # own deliberate parameter choice, `engine` defaulting to the free stub;
      # on the cron path it is the `review` hold this job waits on.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: ./.github/actions/setup-python-env
        with:
          restore-cache: "false"

      # The real-engine replay shells out to the agent CLIs through the tested
      # runner seam — the same binaries the devcontainer ships. Installed only
      # when a real engine will run; the stub backend needs nothing. All three
      # engines are routable (each has a registered runner), so all three CLIs
      # are installed at the versions `.github/engines/<engine>/` pins for
      # every cell — and the report names what actually ran. A
      # `--skip-engines` opt-out (or a missing binary, dropped loudly at run
      # time) is what leaves an engine out. These steps deliberately run BEFORE
      # the corpus composite assumes the read-only role: the one script they
      # execute on purpose must see a credential-free environment.
      - name: Install the pinned Claude Code CLI
        if: env.BT_ENGINE == 'auto' && env.BT_REPLAY != 'salience-gate'
        uses: ./.github/actions/engine-cli
        with:
          engine: claude-code
      - name: Install the pinned Codex CLI
        if: env.BT_ENGINE == 'auto' && env.BT_REPLAY != 'salience-gate'
        uses: ./.github/actions/engine-cli
        with:
          engine: codex
          install-codex: "true"
      - name: Install the pinned Gemini CLI
        if: env.BT_ENGINE == 'auto' && env.BT_REPLAY != 'salience-gate'
        uses: ./.github/actions/engine-cli
        with:
          engine: gemini

      # data/qp-topics membership encodes cert outcomes (docs/qp-topic.md), so
      # the prompts forbid cells from reading it. Replay cells are the ones the
      # oracle would actually inform, and they inherit this checkout as their
      # working directory; deleting it leaves them nothing to read. Deliberate
      # access through git history is covered by the prompt prohibition and by
      # nothing else here: this job writes no retrieval log and uploads no
      # transcript, so the agent's own stdout in the expiring run log is the
      # only record a tool call leaves. Nothing here commits data/, so the
      # deletion never propagates.
      - name: Remove the labeling-measurement oracle from the agent's tree
        run: rm -rf data/qp-topics

      # AGENTS.md, CLAUDE.md and .claude/ (the reviewer subagents) are the
      # repository's instructions for development sessions, which Claude Code
      # and Codex load from the tree on their own. No process digest hashes them, so they leave the agent's
      # tree and the prompt template is its whole contract. Marked
      # skip-worktree first, so `git status` stays clean and an agent tidying
      # its checkout cannot write them back; nothing after the agent reads them.
      - name: Remove the development instructions from the agent's tree
        run: |
          set -euo pipefail
          git ls-files -z -- AGENTS.md CLAUDE.md .claude | git update-index -z --skip-worktree --stdin
          rm -f AGENTS.md CLAUDE.md
          rm -rf .claude

      # The committed ledger is the other oracle this checkout carries, and the
      # larger one: a replayed petition is decided, so
      # `data/cases/<court>/<docket>/events/` can hold the very
      # `evt-petition-disposition/outcome.json` the cell is being asked to
      # forecast, or a merits event whose existence alone discloses the grant.
      # The three engines read that tree on unequal terms — claude runs
      # `bypassPermissions`, gemini's workspace is this checkout, codex's
      # `workspace-write` sandbox is rooted here — and the harness probes only
      # for stray *writes*, so nothing at run time would see the read. The
      # replay needs none of it: `fedcourts cert-backtest` draws its population,
      # its snapshots and the outcomes it scores against from the corpus, and
      # provisions every cell under `--work-dir`. So the tree goes away for the
      # duration, and the step below puts it back from the commit — the one
      # source whose bytes no cell could have touched.
      #
      # The residual, stated: this checkout is full-depth, so the ledger stays
      # one `git show HEAD:data/cases/...` away, and a tidy agent running `git
      # checkout -- data/cases` would undo the fence unnoticed. The removal is
      # therefore structural against an *incidental* read — a cell that opens
      # what is in front of it. A deliberate one is covered by the kickoff's
      # own prohibition ("do not read or write under the repository's data/
      # directory at all", `_output_root_block` in pipeline/runner.py) and by
      # nothing else at run time, for the same reason the qp-topics fence above
      # names: no retrieval log, no transcript artifact, only an expiring run
      # log. The misplaced-write probe is unaffected either way — an engine
      # that follows the prompt template's `data/cases/...` path recreates the
      # directory the probe looks for.
      - name: Remove the committed ledger from the replay's tree
        run: rm -rf data/cases

      # The big-case board names decided petitions beside their outcomes
      # outside data/, and its decided cases are among the petitions the
      # replay can draw: each resolved event in the JSON carries
      # `actual_disposition`, and in both files a case's moment column names
      # its newest predicted event, where a merits moment discloses the grant
      # the way a merits event in the ledger does. (The standing cert
      # back-test report, another such file under `metrics/`, is held out by
      # `cert-backtest` itself.) The weekly public update history,
      # `metrics/updates/`, is a third: each week's resolved section prints
      # decided events beside their outcome words, so it leaves the tree with
      # the board, on the same terms, and comes back with it. So both halves of the board leave the tree
      # with the ledger, on the same terms and with the same residuals — a
      # fence against an incidental read, the committed copy one `git show`
      # away — plus one more: the board is published, and a cell's web tools
      # can reach the public repository. Nothing the replay runs reads either
      # file: the board is a render target of `fedcourts big-cases` and the
      # metrics refresh, neither of which runs in this job. The salience-gate
      # arm writes under `metrics/` in this checkout after the cells, so the
      # restore below puts the files back from the commit before it runs.
      - name: Remove the big-case board from the replay's tree
        run: rm -f metrics/big-cases.json metrics/big-cases.md

      - name: Remove the update history from the replay's tree
        run: rm -rf metrics/updates

      # The replay provisions redacted snapshots from the corpus, so it must be
      # on disk; without a pointer there is nothing to back-test.
      - uses: ./.github/actions/corpus-readonly
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME_READONLY }}
          aws-region: ${{ vars.AWS_REGION }}
          corpus-base-url: ${{ vars.CORPUS_BASE_URL }}
          missing-pointer: warn
          # With the corpus split on, the replay's snapshot provisioning reads
          # the per-case content store for the whole run, so the static
          # credentials must cover the job's own 330-minute cap — six hours,
          # which the read-only role's IAM maximum session duration must allow
          # (an excess request fails at the assume step inside its 120s action
          # timeout, not at the hour mark). Cost, stated: this is the one
          # composite caller that also runs agents in the same job env, so the
          # six hours also extend how long a compromised agent could use the
          # read-only credential — accepted because the role reads only what
          # the replay has already pulled beside it.
          role-duration-seconds: "21600"

      # Gemini's replay cells read the same cell env contract as a live predict
      # cell (COURT_ID/DOCKET_ID/... from `_cell_env`), plus both halves of the
      # replay clock: DECIDED_BEFORE, the case's own October Term, on every
      # replay cell, and REPLAY_CUTOFF, the provisioned cutoff day, on the dated
      # ones. Gemini's sanitizer runs strict whenever GITHUB_SHA is set
      # and strips every custom var from the agent's shell — so `$COURT_ID`
      # expands empty and the cell cannot resolve its own provisioned snapshot,
      # silently degrading gemini's replay while claude and codex read the same
      # files fine. The allowlist restores the identical contract (run-predict.yml
      # carries the fuller rationale). Workspace-level, so it covers every replay
      # cell in this run; only non-secret identifiers, and the CLI hard-refuses to
      # allowlist anything matching /TOKEN|SECRET|KEY|AUTH|.../i regardless. No
      # MCP or telemetry block here: unlike the live workflows, the back-test
      # configures no MCP servers, and a telemetry log in this shared checkout
      # would put one engine's responses where another engine's cells on the
      # same case could read them — so gemini's replay spend goes unrecorded.
      # The clock's env is its only channel on every engine — the kickoff
      # inlines the six identifiers but not the clock, since the frozen prompt
      # spells `--decided-before "$DECIDED_BEFORE"` — which is why the
      # allowlist test pins the whole `_cell_env` contract. `fedcourts query`
      # reads REPLAY_CUTOFF from the environment rather than from a flag, so a
      # stripped variable is silent: the query falls back to the Term-only
      # mask, the blind arm's own — the replayed case's outcome still never
      # clears its own Term, but priors that had not resolved by the cutoff
      # are readmitted. Claude and codex take the same contract straight from
      # `_cell_env` through the subprocess environment and need no allowlist.
      - name: Configure the Gemini cell env allowlist
        if: env.BT_ENGINE == 'auto' && env.BT_REPLAY != 'salience-gate'
        run: |
          set -euo pipefail
          mkdir -p .gemini
          printf '%s\n' '{"tools":{"truncateToolOutputThreshold":200000},"security":{"environmentVariableRedaction":{"allowed":["COURT_ID","DOCKET_ID","EVENT_ID","PREDICTOR_ID","EVALUATOR_ID","RUN_ID","MODEL_ID","DECIDED_BEFORE","REPLAY_CUTOFF"]}}}' > .gemini/settings.json

      # The codex replay sandbox (bubblewrap) needs unprivileged user
      # namespaces, which the Ubuntu runner images restrict via AppArmor: without
      # this, every command a codex replay cell runs — and even its file
      # writes — dies with `bwrap: setting up uid map: Permission denied`
      # and the cell finishes blocked. The same prerequisite codex-action
      # applies for the live cells before dropping sudo — which this job
      # does not do; the acceptance is stated in docs/security.md's back-test
      # paragraph. Harmless when codex is skipped. Each knob is probed
      # before writing, as upstream does: a kernel without the knob has
      # nothing to loosen.
      - name: Enable unprivileged user namespaces for the codex sandbox
        if: env.BT_ENGINE == 'auto' && env.BT_REPLAY != 'salience-gate'
        run: |
          set -euo pipefail
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          if sysctl -n kernel.unprivileged_userns_clone >/dev/null 2>&1; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi

      - name: Run the cert back-test
        if: env.BT_REPLAY == 'cert'
        env:
          # Engine credentials for the replay cells; unused by the stub backend.
          # One per routable engine — claude, codex, gemini — so `auto` runs the
          # full three-engine comparison (GEMINI_CLI_TRUST_WORKSPACE is set by the
          # GeminiRunner seam in pipeline/runner.py, not here).
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # The corpus estate's base URL: the pulled corpus.db is a payload-free
          # index, and the replay's snapshot reads come from the per-case
          # content store the same base derives.
          FEDCOURTS_CORPUS_BASE_URL: ${{ vars.CORPUS_BASE_URL }}
          # A cell's `uv run fedcourts …` tooling needs a cache it can write.
          # uv's default cache sits in the runner user's cache dir, which codex's
          # workspace-write sandbox cannot reach (its writable roots are the
          # checkout cwd, /tmp and $TMPDIR), so a codex cell either burns turns
          # on a read-only cache or loses its corpus tooling. A cold cache under
          # /tmp for this one step is the accepted cost.
          UV_CACHE_DIR: /tmp/fedcourts-backtest-uv-cache
        run: |
          set -euo pipefail
          if [ ! -f corpus/corpus.db ]; then
            echo "::error::no corpus on disk; nothing to back-test" >&2
            exit 1
          fi
          # The backend and the set size come from the job env above: a
          # dispatcher's choice, or the cron's pins. `--limit` IS the set-size
          # cap (there is no higher ceiling to lower), so a large value is a
          # deliberate, write-gated spend decision — the PR body echoes what ran.
          # An empty `--skip-engines` runs every engine, and an unknown engine
          # name simply matches no predictor.
          if [ "$BT_SPREAD" = "true" ]; then SPREAD_FLAG=--spread; else SPREAD_FLAG=--no-spread; fi
          # The work root must sit inside every engine's writable roots, or be
          # admitted into them. codex runs `exec --sandbox workspace-write` from
          # the checkout, whose roots are the cwd, /tmp and $TMPDIR (a codex
          # default; re-check on any codex-version bump) — $RUNNER_TEMP is a
          # sibling of the checkout and is not one, so a cell told to write
          # there could not. claude, unsandboxed, writes anywhere it is told.
          # gemini does not: its file tools are bounded to the launch directory
          # (the checkout) and its own per-project temp dir, so the runner
          # passes the cell's own case tree under its root to the CLI as an
          # extra workspace directory (`GeminiRunner.build_command`,
          # `--include-directories`; re-check on any gemini-cli bump) and a
          # gemini cell reaches it with write_file rather than only the shell.
          # Each engine's lane runs under its own sub-root of this one
          # (`<work_dir>/<engine>/`), provisioned with the same inputs, so the
          # case tree gemini is given, inside its own sub-root, holds gemini's
          # cells alone.
          # A fresh mktemp directory keeps the path
          # unpredictable and unshared across runs on a non-ephemeral runner;
          # run_id is inside every cell path anyway, so a stale cell could never
          # be collected. The output root is what the kickoff names absolutely
          # for every engine — the prompt's own path is relative to the working
          # directory, which here is the checkout, not the work root. The
          # sub-roots are placement, not isolation: they are siblings, claude
          # reads anywhere and codex's sandbox bounds writes rather than reads,
          # so an engine that looks outside its own lane can still read another
          # engine's cells. For gemini the admitted case tree is a `GEMINI.md`
          # context-file discovery root too (read at startup, and again whenever
          # a file tool touches a path under it), which is why only the cell's
          # own case tree is admitted: a context file planted elsewhere in the
          # lane is outside every other case's root. Gemini cells for other
          # events of the same case share that tree, and the checkout is a
          # discovery root for every gemini cell already — accepted on the same
          # terms as the shared tree itself: the back-test's cross-engine
          # integrity rests on the first-party engine configs and the committed
          # prompts.
          work_dir="$(mktemp -d /tmp/fedcourts-backtest-cells.XXXXXXXX)"
          uv run fedcourts cert-backtest \
            --engine "$BT_ENGINE" --limit "$BT_LIMIT" --skip-engines "$BT_SKIP_ENGINES" \
            --scope "$BT_SCOPE" "$SPREAD_FLAG" \
            --work-dir "$work_dir"

      # The merits replay: the same engines, credentials, cell env and work-root
      # placement as the cert step above (its comments hold for every line
      # repeated here), over decided argued cases at the merits grant and
      # briefed moments. `merits-backtest` provisions and runs one moment at a
      # time, so a grant cell never has its case's briefed record on disk, and
      # writes each cell's forecast files to `--keep-cells`, outside the work
      # root, only once both moments have run, so a briefed cell never has a
      # grant forecast on disk either. The draw is capped: this dispatch path
      # has no `review` hold, and at 20 cases the slowest lane's 40 cells fit
      # inside the job's timeout, where a capped-out job lands neither the
      # report nor the forecasts.
      - name: Run the merits back-test
        if: env.BT_REPLAY == 'merits'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FEDCOURTS_CORPUS_BASE_URL: ${{ vars.CORPUS_BASE_URL }}
          UV_CACHE_DIR: /tmp/fedcourts-backtest-uv-cache
        run: |
          set -euo pipefail
          if [ ! -f corpus/corpus.db ]; then
            echo "::error::no corpus on disk; nothing to back-test" >&2
            exit 1
          fi
          if ! [[ "$BT_LIMIT" =~ ^[0-9]+$ ]] || [ "$BT_LIMIT" -lt 1 ] || [ "$BT_LIMIT" -gt 20 ]; then
            echo "::error::a merits replay draws 1 to 20 cases; got limit '$BT_LIMIT'" >&2
            exit 1
          fi
          work_dir="$(mktemp -d /tmp/fedcourts-backtest-cells.XXXXXXXX)"
          uv run fedcourts merits-backtest \
            --terms "$BT_TERMS" --limit "$BT_LIMIT" \
            --engine "$BT_ENGINE" --skip-engines "$BT_SKIP_ENGINES" \
            --work-dir "$work_dir" --keep-cells "$RUNNER_TEMP/merits-cells"

      # What the grading pilot reads off a replayed cell is its forecast, so
      # that is all that leaves the runner: `--keep-cells` holds, per cell, only
      # the allowlisted forecast files of this run and the event definition
      # (`merits_backtest.kept_forecasts`), never the provisioned `record/` or
      # anything else a cell wrote, under whatever name. The rule is about
      # paths, not content: a forecast that quotes a filing carries the quote.
      # A cell ran with the engine keys in its environment and wrote free text,
      # so every kept file is scanned for the keys and for credential shapes
      # before anything uploads, with this run's own ledger paths exempt from
      # the entropy rule only (`--run-id`). A hit, a misconfigured scan, a
      # non-regular entry, or any other fault here withholds the forecasts and
      # leaves the report to land (`continue-on-error`), since the report is
      # the run's measurement and the forecasts only the pilot's input. The
      # repository is public, so the artifact is readable by any signed-in
      # GitHub user until its retention expires. The scanner runs from the
      # tree the cells held, with the keys in its environment: a cell could
      # rig that import path, but anything it could reach that way it already
      # held while it ran (SECURITY.md).
      - name: Collect and scan the merits replay's forecasts
        if: ${{ !cancelled() && env.BT_REPLAY == 'merits' }}
        id: forecasts
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          kept="$RUNNER_TEMP/merits-cells"
          withhold() {
            echo "::warning::$1; withholding the merits forecasts"
            printf '### Merits forecasts withheld\n\n%s. The report still lands; no `merits-forecasts` artifact was uploaded.\n' "$1" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }
          if [ ! -f "$kept/run-id" ]; then
            exit 0
          fi
          if [ -n "$(find "$kept" ! -type f ! -type d -print -quit)" ]; then
            withhold "the kept tree holds an entry that is not a regular file or directory"
          fi
          run_id="$(cat "$kept/run-id")"
          if ! [[ "$run_id" =~ ^[0-9]{8}T[0-9]{6}Z$ ]]; then
            withhold "the kept tree's run id is not a run id"
          fi
          # The harness's allowlist again, here, over every file the tree holds:
          # anything else in it was written by something other than the harness
          # (a cell can reach this path), so the whole artifact is withheld
          # rather than filtered. The files that pass are copied into a fresh
          # directory, and that is what is scanned and uploaded.
          seg='[^/]+'
          shape="^${seg}/(grant|briefed)/cases/${seg}/${seg}/events/${seg}/(event\.yaml|predictions/${seg}/${run_id}/(prediction\.json|predicted_reasoning\.md|reasoning\.md|flags\.json))$"
          out="$(mktemp -d "$RUNNER_TEMP/merits-forecasts.XXXXXXXX")"
          args=()
          while IFS= read -r -d '' rel; do
            rel="${rel#./}"
            if [ "$rel" = run-id ]; then
              continue
            fi
            if ! [[ "$rel" =~ $shape ]]; then
              withhold "the kept tree holds a file outside the forecast allowlist"
            fi
            mkdir -p "$out/$(dirname "$rel")"
            cp -P -- "$kept/$rel" "$out/$rel"
            if [ -L "$out/$rel" ] || [ ! -f "$out/$rel" ]; then
              withhold "a kept file changed into a link while it was copied"
            fi
            args+=(--extra-file "$out/$rel")
          done < <(cd "$kept" && find . -type f -print0)
          if [ "${#args[@]}" -eq 0 ]; then
            exit 0
          fi
          cp -- "$kept/run-id" "$out/run-id"
          : > "$RUNNER_TEMP/no-changes.txt"
          if ! uv run fedcourts scan-diff-for-secrets \
              --name-status-file "$RUNNER_TEMP/no-changes.txt" \
              --known-secret-env ANTHROPIC_API_KEY \
              --known-secret-env OPENAI_API_KEY \
              --known-secret-env GEMINI_API_KEY \
              --run-id "$run_id" \
              "${args[@]}" \
              --run-url "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"; then
            withhold "the secret scan did not pass over the kept forecasts (its findings are in this step's log, redacted)"
          fi
          {
            echo "present=true"
            echo "dir=$out"
          } >> "$GITHUB_OUTPUT"

      # The upload reads the tree the scan passed. A process a cell left behind
      # lives until the job ends and runs as the same user, so it could still
      # swap a scanned file between the two steps; the residual is stated in
      # SECURITY.md. A stub round's forecasts take their own name, so a free
      # rehearsal never shadows a real round's for run-evaluate's merits pilot,
      # which reads only `merits-forecasts`.
      - name: Upload the merits replay's forecasts
        if: ${{ !cancelled() && steps.forecasts.outputs.present == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.BT_ENGINE == 'stub' && 'merits-forecasts-stub' || 'merits-forecasts' }}
          path: ${{ steps.forecasts.outputs.dir }}
          if-no-files-found: error
          retention-days: 30

      # Put the ledger back before anything downstream runs in this checkout —
      # the salience-gate arm and the report hand-off both do. From the commit,
      # which is the whole point: whatever a replay cell did while the agents
      # held this tree, the bytes the rest of the job sees are the reviewed
      # ones. The wipe before the checkout is what makes that cover untracked
      # files — `git checkout --` restores tracked paths only, so a cell that
      # wrote its own directory under data/cases would otherwise survive the
      # restore — and the porcelain check refuses any residue left over.
      - name: Restore the committed ledger and assert it is pristine
        # `!cancelled()` so this runs, and records a real success/failure
        # outcome, even when the replay failed: a run that both failed and
        # wrote into the ledger should say which, and a skipped assertion says
        # nothing. Idempotent and harmless on every early-exit path, not free:
        # the rm tolerates a missing directory and the checkout always rewrites
        # the tracked tree, whether or not the removal step ran.
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          rm -rf data/cases
          git checkout -- data/cases
          if [ -n "$(git status --porcelain -- data/cases)" ]; then
            echo "::error::data/cases is not pristine after the restore"
            git status --porcelain -- data/cases
            exit 1
          fi
          echo "committed ledger restored pristine"

      # Put the big-case board back from the commit before the salience-gate
      # arm, which writes under `metrics/` in this checkout, and before the
      # report hand-off. `HEAD` rather than the index: a cell that staged its
      # own bytes for the paths would otherwise have them restored, and the
      # porcelain check refuses anything left differing from the commit.
      - name: Restore the big-case board and the update history and assert both are pristine
        # `!cancelled()` for the same reason as the ledger restore above: the
        # steps after it read this checkout whether or not the replay failed.
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          git checkout HEAD -- metrics/big-cases.json metrics/big-cases.md
          # The history directory exists on the commit only once its first week
          # has merged; before that there is nothing to restore.
          if [ -n "$(git ls-tree -d --name-only HEAD metrics/updates)" ]; then
            git checkout HEAD -- metrics/updates
          fi
          if [ -n "$(git status --porcelain -- metrics/big-cases.json metrics/big-cases.md)" ] \
            || [ -n "$(git status --porcelain -- metrics/updates)" ]; then
            echo "::error::the big-case board or the update history is not pristine after the restore"
            git status --porcelain -- metrics/big-cases.json metrics/big-cases.md metrics/updates
            exit 1
          fi
          echo "big-case board and update history restored pristine"

      # A real-engine replay spends tokens and its cells commit nothing, so
      # its spend is in no measured total. It leaves one priced off-ledger
      # record, failed replays included, which run-ops sweeps onto the
      # ops-metrics branch and reports apart; no budget counts it. The logs
      # are each engine's own: the Claude CLI's session transcripts, the codex
      # sessions under the home the runner chose for the run's codex cells
      # (`fedcourts-codex-home-<pid>` in the temp dir, one per replay
      # process). Gemini's replay cells write no log to read (see the settings
      # step above), so their spend is the one part not recorded. After the
      # restores, as the job's other post-replay `fedcourts` steps are.
      - name: Find the replay's codex sessions
        id: codex_home
        if: ${{ always() && env.BT_ENGINE == 'auto' && env.BT_REPLAY != 'salience-gate' }}
        run: |
          set -euo pipefail
          home=$(find /tmp -maxdepth 1 -type d -name 'fedcourts-codex-home-*' -print -quit)
          echo "sessions=${home:+$home/sessions}" >> "$GITHUB_OUTPUT"

      - name: Record the replay's model spend
        if: ${{ always() && env.BT_ENGINE == 'auto' && env.BT_REPLAY != 'salience-gate' }}
        uses: ./.github/actions/off-ledger-spend
        with:
          workflow: run-backtest
          lane: ${{ format('{0}-replay', env.BT_REPLAY) }}
          leg: ${{ format('{0}-replay', env.BT_REPLAY) }}
          selection: ${{ env.BT_REPLAY }}
          conclusion: ${{ job.status }}
          claude-transcripts-dir: "~/.claude/projects"
          codex-sessions-dir: ${{ steps.codex_home.outputs.sessions }}

      # The salience-gate mode replays the deterministic gate, not the
      # predictors: `fedcourts salience-replay` runs offline over the pulled
      # corpus (and, under the split mode, the per-case content store the
      # corpus-readonly role already reaches), spends no model tokens, and
      # needs no engine credential or agent CLI — so this step's environment
      # carries none, and the CLI-install/sandbox steps above are skipped for
      # this mode.
      - name: Run the salience-gate replay
        if: env.BT_REPLAY == 'salience-gate'
        env:
          # The corpus estate's base URL, exactly as the cert step wires it: the
          # pulled corpus.db is a payload-free index and the snapshot reads come
          # from the content store the same base derives.
          FEDCOURTS_CORPUS_BASE_URL: ${{ vars.CORPUS_BASE_URL }}
        run: |
          set -euo pipefail
          if [ ! -f corpus/corpus.db ]; then
            echo "::error::no corpus on disk; nothing to replay" >&2
            exit 1
          fi
          uv run fedcourts salience-replay --terms "$BT_TERMS"

      # The report leaves this job as an artifact, and nothing else does: the
      # review PR is opened by `publish` below, on a fresh runner. This job
      # runs agents unattended, and a process a replay cell leaves behind lives
      # until the job ends, long enough to read any later step's environment
      # out of /proc. The dev App token that opens the PR also carries the
      # App's bypass of `main`'s approval rule, so it is never minted on a
      # runner an agent has held. Only the one report the arm writes crosses,
      # as a regular file: a symlink planted at the path would ship whatever
      # it points at. No report is a quiet no-op, as it always was.
      - name: Stage the report for the publish job
        id: report
        run: |
          set -euo pipefail
          case "$BT_REPLAY" in
            salience-gate) report=salience-replay.json ;;
            merits) report=merits-backtest.json ;;
            *) report=cert-backtest.json ;;
          esac
          if [ -L "metrics/$report" ]; then
            echo "::error::metrics/${report} is a symlink; refusing to hand it off"
            exit 1
          fi
          if [ ! -f "metrics/$report" ]; then
            echo "No replay report produced; nothing to land." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "present=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/backtest-report"
          # `-P` copies a link as a link, so a path swapped for one after the
          # check above lands as a link and is refused below.
          cp -P "metrics/$report" "$RUNNER_TEMP/backtest-report/$report"
          if [ -L "$RUNNER_TEMP/backtest-report/$report" ] \
              || [ ! -f "$RUNNER_TEMP/backtest-report/$report" ]; then
            echo "::error::metrics/${report} changed under the copy; refusing to hand it off"
            exit 1
          fi
          echo "present=true" >> "$GITHUB_OUTPUT"

      # One day, the shortest window offered: the PR is the record, and the
      # artifact is only the hand-off to it.
      - name: Hand the report to the publish job
        if: steps.report.outputs.present == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backtest-report
          path: ${{ runner.temp }}/backtest-report
          if-no-files-found: error
          retention-days: 1

  # The review PR, opened from a runner no agent has held. This is the token
  # holder: the one job in this workflow that mints the dev App token, and it
  # runs no engine, installs no agent CLI and assumes no role
  # (tests/test_workflow_token_holder.py). It checks out the run's own commit
  # and takes only the arm's one report from the replay, as data: the PR plan
  # is rendered by this checkout's code from that file, and the staged change
  # is checked and scanned before any token exists. The dev App's bypass
  # covers `main`'s approval rule, and this job opens a PR and never merges
  # one; a maintainer merging it is what keeps the report read.
  publish:
    needs: [authorize, backtest]
    # `!cancelled()` because the dispatch path skips `cadence`, `plan` and
    # `approval`, and a skipped ancestor would otherwise skip this job too.
    if: >-
      ${{ !cancelled() && needs.backtest.result == 'success'
      && needs.backtest.outputs.report == 'true'
      && needs.authorize.result == 'success'
      && (needs.authorize.outputs.attempt == github.run_attempt
      || contains(needs.authorize.outputs.rerunners, format(',{0},', github.triggering_actor))) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    # Two runs' publish jobs force-push the same fixed branch, so one at a
    # time. A pending one that a newer run supersedes is dropped, which costs
    # nothing: the newer run force-pushes the same branch with a newer report.
    concurrency:
      group: run-backtest-publish
      cancel-in-progress: false
    # The dev App's credentials live on `prod`, whose branch policy admits
    # `main` alone.
    environment: prod
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: ./.github/actions/setup-python-env
        with:
          restore-cache: "false"

      - name: Download the report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: backtest-report
          path: ${{ runner.temp }}/backtest-report

      # Everything that reads the replay's bytes runs here, before the mint:
      # the artifact must hold the arm's one report and nothing else, as a
      # regular file; it overlays the committed copy; the tree must then differ
      # from the commit at that path alone; the PR prose is rendered by the
      # tested `cert-backtest-plan` (null pr = no report), or composed inline
      # for the salience-gate arm, whose report is the reviewable content; and
      # the change and the prose are scanned for secrets, as `collect` scans a
      # run's. The steps after the mint only commit, push and open the PR.
      - name: Stage and check the report
        id: stage
        env:
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          case "$BT_REPLAY" in
            salience-gate) report=salience-replay.json ;;
            merits) report=merits-backtest.json ;;
            *) report=cert-backtest.json ;;
          esac
          dir="$RUNNER_TEMP/backtest-report"
          extra=$(find "$dir" -mindepth 1 ! -path "$dir/$report")
          if [ -n "$extra" ] || [ -L "$dir/$report" ] || [ ! -f "$dir/$report" ]; then
            echo "::error::the hand-off must hold metrics/${report} alone, as a regular file"
            exit 1
          fi
          cp "$dir/$report" "metrics/$report"
          changed=$(git status --porcelain --untracked-files=all)
          if [ -z "$changed" ]; then
            echo "Replay report unchanged; nothing to land." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "land=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A modified report, or the first one of its kind, and nothing else.
          if [ "$changed" != " M metrics/${report}" ] && [ "$changed" != "?? metrics/${report}" ]; then
            echo "::error::the tree differs from the commit outside metrics/${report}"
            git status --porcelain --untracked-files=all
            exit 1
          fi
          pr="$RUNNER_TEMP/pr"
          mkdir -p "$pr"
          if [ "$BT_REPLAY" = "salience-gate" ]; then
            # The prose stays minimal on purpose — the command line it echoes
            # is the whole parameterization, and the refreshed report is the
            # reviewable content; anything more would restate CLI defaults
            # that would go silently stale here.
            printf '%s' "metrics/salience-replay" > "$pr/branch"
            printf '%s' "metrics(salience): gate replay over Terms ${BT_TERMS}" > "$pr/title"
            printf '%s' "metrics(salience): salience-gate replay (run ${GITHUB_RUN_ID})" > "$pr/commit"
            {
              printf 'Deterministic salience-gate replay: `fedcourts salience-replay --terms %s`.\n\n' "$BT_TERMS"
              printf 'Refreshes `metrics/salience-replay.json`. No model ran and no tokens were spent. '
              printf 'What the numbers may and may not be read as: `metrics/README.md`.\n'
            } > "$pr/body.md"
          elif [ "$BT_REPLAY" = "merits" ]; then
            # Minimal for the same reason as the salience arm: the command line
            # is the parameterization and the report is the content.
            printf '%s' "metrics/merits-backtest" > "$pr/branch"
            printf '%s' "metrics(merits): back-test over Terms ${BT_TERMS} (engine ${BT_ENGINE})" > "$pr/title"
            printf '%s' "metrics(merits): merits back-test (run ${GITHUB_RUN_ID})" > "$pr/commit"
            {
              printf 'Merits back-test: `fedcourts merits-backtest --terms %s --limit %s --engine %s --skip-engines "%s"`.\n\n' \
                "$BT_TERMS" "$BT_LIMIT" "$BT_ENGINE" "$BT_SKIP_ENGINES"
              printf 'Refreshes `metrics/merits-backtest.json`. Retrospective: every judgment replayed was public before the run, so no figure here is a claimable forecast. '
              printf 'The cells'"'"' forecasts are the `merits-forecasts` artifact of run %s. ' "$GITHUB_RUN_ID"
              printf 'What the numbers may and may not be read as: `metrics/README.md`.\n'
            } > "$pr/body.md"
          else
            plan=$(uv run fedcourts cert-backtest-plan --run-id "$GITHUB_RUN_ID" \
              --limit "$BT_LIMIT" --engine "$BT_ENGINE")
            if [ "$(jq -r '.pr' <<<"$plan")" = "null" ]; then
              echo "No back-test report produced; nothing to land." | tee -a "$GITHUB_STEP_SUMMARY"
              echo "land=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            jq -j '.pr.branch' <<<"$plan" > "$pr/branch"
            jq -j '.pr.title' <<<"$plan" > "$pr/title"
            jq -j '.pr.commit_message' <<<"$plan" > "$pr/commit"
            jq -r '.pr.body' <<<"$plan" > "$pr/body.md"
          fi
          git add "metrics/$report"
          git diff --cached --name-status > "$pr/changes.txt"
          if ! uv run fedcourts scan-diff-for-secrets --name-status-file "$pr/changes.txt" \
              --extra-file "metrics/$report" \
              --extra-file "$pr/body.md" \
              --run-url "https://github.com/${REPO}/actions/runs/${GITHUB_RUN_ID}"; then
            echo "::error::secret scan did not pass; withholding the review PR"
            exit 1
          fi
          echo "land=true" >> "$GITHUB_OUTPUT"

      # The review PR is opened with the dev App token, exactly like the
      # metrics refresh: the dev App bypasses no required check, so the PR
      # still faces the required `gate` check, and it is never auto-merged.
      # Minted only once there is a checked change to land.
      - name: Mint app token
        if: steps.stage.outputs.land == 'true'
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.DEV_APP_CLIENT_ID }}
          private-key: ${{ secrets.DEV_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Configure git identity
        if: steps.stage.outputs.land == 'true'
        uses: ./.github/actions/configure-git-identity
        with:
          token: ${{ steps.app-token.outputs.token }}
          app-slug: ${{ steps.app-token.outputs.app-slug }}

      # Git and gh only, over what the step above staged and rendered. The
      # fixed branch is force-pushed so an unmerged PR updates in place rather
      # than stacking.
      - name: Open or update the review PR
        if: steps.stage.outputs.land == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          pr="$RUNNER_TEMP/pr"
          branch=$(cat "$pr/branch")
          title=$(cat "$pr/title")
          gh auth setup-git
          git commit -F "$pr/commit"
          git push --force origin "HEAD:refs/heads/${branch}"
          # Reuse an open PR for the fixed branch (the force-push updated it);
          # otherwise open a fresh one.
          existing=$(gh pr list --repo "$REPO" --state open --head "$branch" \
            --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --repo "$REPO" --title "$title" --body-file "$pr/body.md"
            echo "Updated the open back-test PR." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            gh pr create --repo "$REPO" --base main --head "$branch" \
              --title "$title" --body-file "$pr/body.md"
          fi
          cat "$pr/body.md" >> "$GITHUB_STEP_SUMMARY"

  # The run gate's verdict on the run as a whole. A refused partial re-run
  # skips every job it re-runs, which alone would leave the earlier attempt's
  # successes standing and the run concluding `success`. This job needs every
  # other job, so any re-run re-runs it, and it fails the run when the gate did
  # not pass or this attempt is neither the one the gate judged nor a re-run by
  # a login the gate published. No checkout, no token, no environment.
  run-gate:
    needs: [authorize, cadence, plan, approval, rejected, backtest, publish]
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Fail a run the gate refused
        if: >-
          ${{ needs.authorize.result != 'success'
          || (needs.authorize.outputs.attempt != github.run_attempt
          && !contains(needs.authorize.outputs.rerunners, format(',{0},', github.triggering_actor))) }}
        env:
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: |
          echo "::error::The run gate refused this run or re-run (started by ${TRIGGERING_ACTOR}): see the authorize job's log, or config/dispatchers.json for who may re-run."
          exit 1
