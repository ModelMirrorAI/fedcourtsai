name: promotion-record

# Records each staging→main promotion on `main` itself: the annotated
# `promotion/<UTC date>` tag on the merge (and `prereg/<label>` where the merge
# added a label), the `<FILL:>` placeholders the merge added that a closed key
# set fills, and the pending process registrations the merge added, stamped
# with its SHA and committer time. What is written is decided by the tested
# `fedcourts promotion-record` plan and checked by its jail
# (`assert-promotion-record-diff`); this workflow orders them, under the writer
# requirements docs/process-version.md lists.
#
# Its own workflow, not a job on `promote`: promote is read-only and
# dispatch-only, while this pushes to `main` on the data App — the one identity
# that bypasses `main: require PR` — after a merge. A different trigger class
# and a different risk class.
#
# Three jobs, three trust levels:
#   classify — no secret, read-only token: is the pushed commit a promotion
#              merge? Every other push to main (data commits, this workflow's
#              own commit) stops here, green.
#   write    — the `prod` environment. Plans, tags, applies, commits and jails
#              holding no write credential; mints the data App token only after
#              the jail passes, and uses it only to push.
#   report   — the ambient token only: surfaces what the plan left for a
#              maintainer (free-text placeholders, stale rows and placeholders)
#              on the promotion PR, latches a failure issue, and checks main
#              holds no pending registration a merge already carried.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      merge:
        description: "Recovery: the promotion merge commit (40-hex SHA) to record again. It must pass the same promotion-merge checks."
        required: true
        type: string

permissions: {}

jobs:
  # The run gate (src/fedcourtsai/run_gate.py): a dispatch, or a re-run of any
  # run, proceeds only for a login config/dispatchers.json names. No
  # environment, no secret, a read-only token, and no project code: a sparse
  # checkout of the gate and its allow-list alone, run by path with the
  # runner's Python in isolated mode. Every other job needs this one and checks
  # the attempt it judged, because re-running some jobs does not re-run this
  # one; `run-gate` below fails the run when that check refused.
  authorize:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      attempt: ${{ steps.decide.outputs.attempt }}
      rerunners: ${{ steps.decide.outputs.rerunners }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            src/fedcourtsai/run_gate.py
            config/dispatchers.json
          sparse-checkout-cone-mode: false
      - name: Authorize who started this run
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: >-
          python3 -I src/fedcourtsai/run_gate.py --workflow promotion-record.yml
          --event-name "$EVENT_NAME" --actor "$ACTOR"
          --triggering-actor "$TRIGGERING_ACTOR" --run-attempt "$RUN_ATTEMPT"
          --github-output "$GITHUB_OUTPUT"

  classify:
    needs: [authorize]
    if: >-
      ${{ needs.authorize.result == 'success'
      && (needs.authorize.outputs.attempt == github.run_attempt
      || contains(needs.authorize.outputs.rerunners, format(',{0},', github.triggering_actor))) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read # read the commit's parents
      pull-requests: read # find the merged promotion PR the commit closed
    outputs:
      promotion: ${{ steps.classify.outputs.promotion }}
      merge: ${{ steps.classify.outputs.merge }}
      pr: ${{ steps.classify.outputs.pr }}
    steps:
      - name: Classify the pushed commit
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PUSHED: ${{ github.sha }}
          BEFORE: ${{ github.event.before }}
          DISPATCHED: ${{ inputs.merge }}
        run: |
          set -euo pipefail
          not_a_promotion() {
            echo "not a promotion merge: $1"
            echo "promotion=false" >>"$GITHUB_OUTPUT"
            exit 0
          }
          if [ "$EVENT" = "workflow_dispatch" ]; then
            sha="$DISPATCHED"
          else
            sha="$PUSHED"
          fi
          # A dispatch input is untrusted text until it is a full SHA.
          if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::not a 40-hex commit SHA"
            exit 1
          fi
          parents=$(gh api "repos/${REPO}/commits/${sha}" --jq '[.parents[].sha] | join(" ")')
          read -r -a parent_list <<<"$parents"
          if [ "${#parent_list[@]}" -ne 2 ]; then
            not_a_promotion "${sha} has ${#parent_list[@]} parent(s)"
          fi
          # A push is a promotion only when it moved main by exactly that merge.
          if [ "$EVENT" = "push" ] && [ "${parent_list[0]}" != "$BEFORE" ]; then
            not_a_promotion "${sha}'s first parent is not the tip it replaced"
          fi
          pr=$(gh api "repos/${REPO}/commits/${sha}/pulls" --jq "[.[] | select(
              .merged_at != null and .base.ref == \"main\" and .head.ref == \"staging\"
              and .head.repo.full_name == \"${REPO}\" and .merge_commit_sha == \"${sha}\"
            ) | .number] | if length == 1 then .[0] else empty end")
          if [ -z "$pr" ]; then
            not_a_promotion "${sha} is not the merge commit of a merged staging→main PR"
          fi
          echo "${sha} is the merge of promotion PR #${pr}"
          {
            echo "promotion=true"
            echo "merge=${sha}"
            echo "pr=${pr}"
          } >>"$GITHUB_OUTPUT"

  write:
    needs: [authorize, classify]
    if: >-
      ${{ needs.classify.outputs.promotion == 'true'
      && needs.authorize.result == 'success'
      && (needs.authorize.outputs.attempt == github.run_attempt
      || contains(needs.authorize.outputs.rerunners, format(',{0},', github.triggering_actor))) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # The data App's credentials live on `prod`, whose deployment-branch policy
    # is `main`-only, so a dispatch from any other ref is refused here.
    environment: prod
    # Two writers never race: the second waits for the first's push, then
    # plans against the tip that push left. A group holds one running and one
    # pending run; a third arrival cancels the pending one. A cancelled write
    # still reaches `report`, which opens the failure issue, and a re-dispatch
    # with the merge SHA recovers it.
    concurrency:
      group: promotion-record
      cancel-in-progress: false
    permissions:
      contents: read # the trusted checkout of main; the push rides the App token
    steps:
      # Main's own code is what runs, never the PR's: the merge is already on
      # main, and the checkout is main's tip, detached again after each fetch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 0

      - uses: ./.github/actions/setup-python-env
        with:
          restore-cache: "false"

      # The committer and tagger identity is the data App's bot user, resolved
      # before any write token exists: the lookup is public and rides the
      # read-only ambient token. (configure-git-identity takes a minted token
      # and its app-slug, which would mean minting before the plan, so it is
      # not reused here.) Each push step re-checks that its minted token is
      # that App's.
      - name: Set the data App's git identity
        env:
          GH_TOKEN: ${{ github.token }}
          LOGIN: fedcourtsai-data[bot]
        run: |
          set -euo pipefail
          user_id=$(gh api "/users/${LOGIN}" --jq .id)
          git config --global user.name "$LOGIN"
          git config --global user.email "${user_id}+${LOGIN}@users.noreply.github.com"

      # Attempt 1. Each attempt is four steps: prepare (fetch, plan, tag, apply,
      # commit, jail) and validate holding no credential; then the data App
      # token, minted only after the jail; then the push, the only step that
      # reads it. The push never re-plans: where `main` advanced it records
      # `rejected`, and the next attempt starts over from a fresh fetch.
      - name: Plan, tag, apply, commit and jail (attempt 1)
        id: prepare1
        env:
          MERGE: ${{ needs.classify.outputs.merge }}
        run: bash .github/actions/promotion-record/write.sh prepare "$MERGE"

      - name: Validate the prepared record (attempt 1)
        id: validate1
        run: bash .github/actions/promotion-record/write.sh validate

      - name: Mint the data App token (attempt 1)
        id: app-token-1
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.DATA_APP_CLIENT_ID }}
          private-key: ${{ secrets.DATA_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Push the tags, then the record commit (attempt 1)
        id: push1
        env:
          WRITE_TOKEN: ${{ steps.app-token-1.outputs.token }}
          APP_SLUG: ${{ steps.app-token-1.outputs.app-slug }}
          BASE: ${{ steps.validate1.outputs.base }}
          HEAD_SHA: ${{ steps.validate1.outputs.head }}
        run: |
          set -euo pipefail
          if [ "$APP_SLUG" != "fedcourtsai-data" ]; then
            echo "::error::the minted token is ${APP_SLUG}'s, not the data App's"
            exit 1
          fi
          status=0
          bash .github/actions/promotion-record/write.sh push || status=$?
          if [ "$status" -eq 3 ]; then
            echo "rejected=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          exit "$status"

      # Attempt 2: `main` advanced under attempt 1's push. Its token is
      # revoked before anything plans again, and this attempt prepares from the
      # new tip holding no credential, exactly as the first did.
      - name: Revoke the attempt-1 token
        if: steps.push1.outputs.rejected == 'true'
        env:
          TOKEN: ${{ steps.app-token-1.outputs.token }}
        run: |
          set -euo pipefail
          curl -fsS -X DELETE -H "Authorization: Bearer ${TOKEN}" \
            -H "Accept: application/vnd.github+json" https://api.github.com/installation/token

      - name: Plan, tag, apply, commit and jail (attempt 2)
        id: prepare2
        if: steps.push1.outputs.rejected == 'true'
        env:
          MERGE: ${{ needs.classify.outputs.merge }}
        run: bash .github/actions/promotion-record/write.sh prepare "$MERGE"

      - name: Validate the prepared record (attempt 2)
        id: validate2
        if: steps.push1.outputs.rejected == 'true'
        run: bash .github/actions/promotion-record/write.sh validate

      - name: Mint the data App token (attempt 2)
        id: app-token-2
        if: steps.push1.outputs.rejected == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.DATA_APP_CLIENT_ID }}
          private-key: ${{ secrets.DATA_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Push the tags, then the record commit (attempt 2)
        id: push2
        if: steps.push1.outputs.rejected == 'true'
        env:
          WRITE_TOKEN: ${{ steps.app-token-2.outputs.token }}
          APP_SLUG: ${{ steps.app-token-2.outputs.app-slug }}
          BASE: ${{ steps.validate2.outputs.base }}
          HEAD_SHA: ${{ steps.validate2.outputs.head }}
        run: |
          set -euo pipefail
          if [ "$APP_SLUG" != "fedcourtsai-data" ]; then
            echo "::error::the minted token is ${APP_SLUG}'s, not the data App's"
            exit 1
          fi
          status=0
          bash .github/actions/promotion-record/write.sh push || status=$?
          if [ "$status" -eq 3 ]; then
            echo "rejected=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          exit "$status"

      # Attempt 3: `main` advanced under attempt 2's push. Its token is
      # revoked before anything plans again, and this attempt prepares from the
      # new tip holding no credential, exactly as the first did.
      - name: Revoke the attempt-2 token
        if: steps.push2.outputs.rejected == 'true'
        env:
          TOKEN: ${{ steps.app-token-2.outputs.token }}
        run: |
          set -euo pipefail
          curl -fsS -X DELETE -H "Authorization: Bearer ${TOKEN}" \
            -H "Accept: application/vnd.github+json" https://api.github.com/installation/token

      - name: Plan, tag, apply, commit and jail (attempt 3)
        id: prepare3
        if: steps.push2.outputs.rejected == 'true'
        env:
          MERGE: ${{ needs.classify.outputs.merge }}
        run: bash .github/actions/promotion-record/write.sh prepare "$MERGE"

      - name: Validate the prepared record (attempt 3)
        id: validate3
        if: steps.push2.outputs.rejected == 'true'
        run: bash .github/actions/promotion-record/write.sh validate

      - name: Mint the data App token (attempt 3)
        id: app-token-3
        if: steps.push2.outputs.rejected == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.DATA_APP_CLIENT_ID }}
          private-key: ${{ secrets.DATA_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Push the tags, then the record commit (attempt 3)
        id: push3
        if: steps.push2.outputs.rejected == 'true'
        env:
          WRITE_TOKEN: ${{ steps.app-token-3.outputs.token }}
          APP_SLUG: ${{ steps.app-token-3.outputs.app-slug }}
          BASE: ${{ steps.validate3.outputs.base }}
          HEAD_SHA: ${{ steps.validate3.outputs.head }}
        run: |
          set -euo pipefail
          if [ "$APP_SLUG" != "fedcourtsai-data" ]; then
            echo "::error::the minted token is ${APP_SLUG}'s, not the data App's"
            exit 1
          fi
          status=0
          bash .github/actions/promotion-record/write.sh push || status=$?
          if [ "$status" -eq 3 ]; then
            echo "rejected=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          exit "$status"

      # Every token an attempt minted and no later attempt already revoked is
      # revoked here, whatever happened, so no repo code runs in this job while
      # a write token is live.
      - name: Revoke the remaining tokens
        if: always()
        env:
          TOKEN_1: ${{ steps.app-token-1.outputs.token }}
          TOKEN_2: ${{ steps.app-token-2.outputs.token }}
          TOKEN_3: ${{ steps.app-token-3.outputs.token }}
          REVOKED_1: ${{ steps.push1.outputs.rejected }}
          REVOKED_2: ${{ steps.push2.outputs.rejected }}
        run: |
          set -euo pipefail
          revoke() {
            curl -fsS -X DELETE -H "Authorization: Bearer $1" \
              -H "Accept: application/vnd.github+json" https://api.github.com/installation/token \
              || echo "::warning::could not revoke the attempt-$2 token; it expires within the hour"
          }
          if [ -n "$TOKEN_1" ] && [ "$REVOKED_1" != "true" ]; then revoke "$TOKEN_1" 1; fi
          if [ -n "$TOKEN_2" ] && [ "$REVOKED_2" != "true" ]; then revoke "$TOKEN_2" 2; fi
          if [ -n "$TOKEN_3" ]; then revoke "$TOKEN_3" 3; fi

      - name: Refuse a record main kept outrunning
        if: steps.push3.outputs.rejected == 'true'
        run: |
          echo "::error::main advanced under all three attempts; the record was not pushed — re-dispatch with the merge SHA"
          exit 1

      # Uploaded after the last attempt, whatever happened, so the report
      # describes the plan the final attempt pushed (or failed on).
      - name: Upload the plan
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: promotion-record-plan-${{ github.run_id }}
          path: ${{ runner.temp }}/promotion-record/plan.json
          retention-days: 7
          if-no-files-found: warn


  report:
    needs: [authorize, classify, write]
    if: >-
      ${{ always() && needs.classify.outputs.promotion == 'true'
      && needs.authorize.result == 'success'
      && (needs.authorize.outputs.attempt == github.run_attempt
      || contains(needs.authorize.outputs.rerunners, format(',{0},', github.triggering_actor))) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write # the failure issue (ambient, triggers nothing)
      pull-requests: write # the comment on the promotion PR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 0

      - uses: ./.github/actions/setup-python-env
        with:
          restore-cache: "false"

      - name: Download the plan
        if: needs.write.result != 'skipped'
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: promotion-record-plan-${{ github.run_id }}
          path: ${{ runner.temp }}/plan

      - name: Surface what the plan left for a maintainer
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ needs.classify.outputs.pr }}
          MERGE: ${{ needs.classify.outputs.merge }}
          WRITE_RESULT: ${{ needs.write.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PLAN: ${{ runner.temp }}/plan/plan.json
        run: |
          set -euo pipefail
          source "${GITHUB_WORKSPACE}/scripts/gh_retry.sh"
          summary=$(mktemp)
          {
            echo "### promotion-record — ${MERGE:0:9} (#${PR}): ${WRITE_RESULT}"
            echo
            echo "Run: ${RUN_URL}"
          } >"$summary"
          if [ -f "$PLAN" ]; then
            jq -r '
              "- tag: `\(.promotion_tag.name)`" + (if .prereg_tag then ", `\(.prereg_tag.name)`" else "" end),
              "- filled: \(.fills | length) placeholder(s); stamped: \(.stamps | length) registration(s)",
              (if (.free_text | length) > 0 then
                "- **left for a maintainer** (free-text, never filled by the writer):",
                (.free_text[] | "  - line \(.line): `\(.key)`")
              else empty end),
              (if (.stale_placeholders | length) > 0 then
                "- **stale placeholders** an earlier merge carried (not filled):",
                (.stale_placeholders[] | "  - line \(.line): `\(.key)`")
              else empty end),
              (if (.stale_pending | length) > 0 then
                "- **stale pending registrations** an earlier merge carried (not stamped):",
                (.stale_pending[] | "  - \(.kind) `\(.ident)`")
              else empty end)
            ' "$PLAN" >>"$summary"
          else
            echo "- no plan was produced; see the run log" >>"$summary"
          fi
          cat "$summary" >>"$GITHUB_STEP_SUMMARY"
          gh_retry gh pr comment "$PR" --repo "$REPO" --body-file "$summary"
          if [ "$WRITE_RESULT" != "success" ]; then
            # `promotion-record-log` triggers nothing (no workflow keys on a
            # label); one open issue per broken promotion merge.
            gh_retry gh label create promotion-record-log --repo "$REPO" --force \
              --color b60205 --description "A promotion merge was not recorded (open until a human triages)"
            gh_retry gh issue create --repo "$REPO" --label promotion-record-log \
              --title "promotion-record: ${MERGE:0:9} (#${PR}) not recorded" --body-file "$summary"
          fi

      # A stamp that never landed is a hole in the scored population: name any
      # pending row main still holds once the writer is done, in this job,
      # which holds no data App credential. The promotion gate's `registry`
      # stage runs the same check before every promotion.
      - name: Check main holds no pending registration
        run: |
          set -euo pipefail
          git fetch --quiet --force "https://github.com/${GITHUB_REPOSITORY}.git" \
            "+refs/heads/main:refs/remotes/origin/main"
          uv run --locked fedcourts promotion-record --check-main origin/main

  # The run gate's verdict on the run as a whole. A refused partial re-run
  # skips every job it re-runs, which alone would leave the earlier attempt's
  # successes standing and the run concluding `success`. This job needs every
  # other job, so any re-run re-runs it, and it fails the run when the gate did
  # not pass or this attempt is neither the one the gate judged nor a re-run by
  # a login the gate published. No checkout, no token, no environment.
  run-gate:
    needs: [authorize, classify, write, report]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Fail a run the gate refused
        if: >-
          ${{ needs.authorize.result != 'success'
          || (needs.authorize.outputs.attempt != github.run_attempt
          && !contains(needs.authorize.outputs.rerunners, format(',{0},', github.triggering_actor))) }}
        env:
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: |
          echo "::error::The run gate refused this run or re-run (started by ${TRIGGERING_ACTOR}): see the authorize job's log, or config/dispatchers.json for who may re-run."
          exit 1
