name: integration-test

# The staging→main promotion freshness gate matches runs on this title format
# (scripts/promotion-gate.sh); change the two together — a workflow-shape test
# pins both ends. A whole-suite dispatch (`all`, `all-offline`) drops the
# `<scenario> / <engine>` pair for the bare scenario name. The gate takes an
# `all` title as evidence for the whole required set always, and an
# `all-offline` title only for the narrowed set a skipped-smoke pre-flight
# asks for — it tells the two apart, so the cheaper suite never satisfies the
# fuller requirement. The
# branch→environment resolution here is duplicated on the `environment:` key
# of both jobs that bind one — plan, which resolves the case out of that
# environment's corpus, and scenario (YAML anchors do not work in workflows);
# keep the three expressions identical, or the title stops naming the
# environment the jobs actually bound. A schedule carries no inputs at all, so
# the scenario half would render as the degenerate ` / ` pair: the canary
# names itself instead, in a shape that matches no freshness prefix (there is
# no ` / <engine> @` in it) on top of the two screens it already fails — it
# runs from `main`, not `staging`, and binds `prod`.
run-name: "integration-test: ${{ github.event_name == 'schedule' && 'engine-actions-smoke (canary)' || ((inputs.scenario == 'all' || inputs.scenario == 'all-offline') && inputs.scenario || format('{0} / {1}', inputs.scenario, inputs.engine)) }} @ ${{ inputs.deploy-environment != 'auto' && inputs.deploy-environment || (github.ref_name == 'main' && 'prod' || github.ref_name) }}"

# Live integration scenarios for the pieces a PR branch cannot exercise through
# the trigger path: the corpus read backends, the credential-scoped corpus
# sidecar, the tokenless CourtListener MCP sidecar, and cascade cells — stub or
# one real engine — over them. Each scenario is one dispatch, strictly
# side-effect free: no corpus write, no git
# write, no PR, no issue — results go to the Actions step summary and the run
# log, and any cell output lands only in the runner's throwaway checkout. Every
# scenario is also token-free except the three engine scenarios, which say so on
# their inputs: engine-smoke spends about one predict cell's worth of the
# selected engine's model tokens, engine-actions-smoke a boot probe's, and
# codex-application-repro one evaluate cell's — so a whole-suite `all` dispatch
# spends three cells' worth plus three probes (the repro is dispatch-only and
# joins no whole-suite run), and `all-offline` (the same suite with both engine
# families dropped) spends nothing. The repro leg is the long one in wall-clock
# as well: the judge cell it presents runs 40-50 minutes, so its bounds and its
# job cap are set above that rather than at the suite's usual 45. The collect scenario is environment-free on top of token-free:
# it exercises the collect-run composite against synthetic cell artifacts
# with every write surface stubbed or diverted on the runner, so its job
# binds no deployment environment and is the one scenario that still
# dispatches from any branch.
#
# **The repro family.** A second class of scenario lives here alongside the
# preflights: one scenario per diagnosed engine defect that has a reproducible
# *input shape*, each pinned to the record shape its defect keys on.
# `codex-application-repro` is the first. The suite's other engine legs run
# against a cert-stage case — resolved from the corpus, or pinned — and a
# defect keyed on a record shape the suite never presents is invisible to it
# however green the suite runs. A repro scenario is what makes that shape
# presentable on demand, and its own failure is the finding.
#
# Two rules hold for the whole family. It is **dispatch-only**: a repro
# scenario is absent from the `suite` literal below, so no whole-suite run
# fans one out — an open defect reproducing on schedule inside `all` would
# turn every `all` run red, and the promotion gate reads a red run as no
# freshness evidence at all, blocking the very promotion that carries the fix.
# And it stays **out of `REQUIRED_SCENARIOS`** (scripts/promotion-gate.sh)
# while its defect is open, for the same reason; a repro whose defect is
# closed is a regression test and belongs in both, which is a deliberate
# maintainer edit at that point rather than a default. Its bounds sit *above*
# the work envelope it reproduces and its job cap above those — a repro leg has
# to let the cell finish, because the defect it is pinned to begins only after
# the work is done; what must stay well inside the job cap is the watchdog, so
# a step that will not conclude is concluded rather than riding to a
# cancellation whose logs GitHub drops.
#
# Manual dispatch, plus one scheduled arm. Its own workflow rather than a
# run-analytics mode because it is a preflight of the pipeline
# *infrastructure* itself, not an analysis that answers a question about the
# data: it is dispatched around changes to the read seams, the sidecars, and
# the corpus-consuming workflows — run-analytics included, so the preflight
# should not live on a surface it exists to check — and a distinct workflow
# gives release preflights their own run history.
#
# The schedule is the **boot canary**: one engine-actions-smoke leg per engine,
# daily, so a provider-side or action-side flip between promotions is found by
# a cron rather than by the next paid round. It is a mode on this workflow
# rather than a workflow of its own precisely because the invocation blocks it
# probes live here already; what it adds is a trigger, and the run it produces
# can never be mistaken for freshness evidence (see `run-name:` above). GitHub
# cron is best-effort and drops runs under load — this repository's own
# schedules are among the ones it drops — so a missed day is tolerable by
# design: the canary narrows the window between a provider flip and its
# discovery, and the promotion gate, not the canary, is what stands between a
# broken invocation and `main`. It also raises no alarm of its own: this
# workflow opens no issue and posts no comment, by the side-effect-free
# invariant that lets it run unattended at all, so what the canary buys is a
# breakage already sitting in the run history when someone next looks.
#
# The `deploy-environment` input is what lets a change be exercised against real
# infrastructure before it is promoted, and its `auto` default resolves the
# environment from the dispatching branch: `main` resolves `prod` as always,
# `staging` resolves the `staging` environment — the same read-only role and
# corpus base URL plus its own engine keys, and the trust of the staging
# read-write role, which any staging-bound job may therefore ask for (the
# refresh lane is the one reviewed asker; docs/security.md carries the
# provenance model) — and any other branch resolves its own name, which
# names no configured environment and so binds nothing: no role
# variables, no keys. An explicit choice still wins over the resolution.
# Each environment restricts deployments to its one branch, so the
# gate is code provenance — only what passed a PR and the branch's required
# checks can bind either — rather than a per-run approval, which asserts
# nothing about the code. A dispatch whose job BINDS an environment from the
# wrong branch is refused at its deployment-branch gate, and one naming an
# environment that does not exist resolves no role variables — fail-closed
# either way (the AWS trust policies pin each role to its named environments;
# docs/security.md describes the wiring and when to revisit the shape).
on:
  # The boot canary, daily. 11:53 UTC is a deliberately quiet slot: no other
  # schedule in this repository uses hour 11 (they sit at 01/02/03/04/05/07/08/
  # 10/13/14/15/16/19/20/22), and minute 53 collides with none of the minutes
  # already in use — GitHub queues every repository's crons together, so a
  # shared minute is where a dropped run is likeliest, and the top of the hour
  # is the most congested minute of all. It also lands a few hours ahead of the
  # day's evaluate round (15:39), so a red canary is visible before the round
  # that would pay for the same breakage.
  schedule:
    - cron: "53 11 * * *"
  workflow_dispatch:
    inputs:
      scenario:
        description: >-
          Which integration scenario to run. `all` fans the promotion gate's
          whole required suite out of one dispatch — the matrix legs plus the
          environment-free collect job, with engine-smoke and
          engine-actions-smoke once per engine each — and therefore SPENDS
          MODEL TOKENS: three engine-smoke cells' worth plus three boot
          probes. `all-offline` is that same suite with both engine families
          dropped: token-free end to end, and accepted as whole-suite
          freshness evidence only by a promotion dispatched with its own
          engine-smoke skip set. `codex-application-repro` is the repro
          family's first member — one codex evaluate cell against a pinned
          application-lane record — and SPENDS MODEL TOKENS: one evaluate
          cell's worth of codex. Neither whole-suite selection fans it out.
        type: choice
        default: ranged-reads
        options:
          - ranged-reads
          - corpus-service
          - stub-cascade
          - engine-smoke
          - engine-actions-smoke
          - mcp-sidecar
          - collect
          - qp-topic
          - codex-application-repro
          - all
          - all-offline
      # The case the corpus-reading scenarios target. With `docket` left
      # empty, the `plan` job resolves one at run time out of whichever corpus
      # this dispatch's environment actually serves
      # (`fedcourts corpus-integration-case`): the first snapshot-bearing,
      # in-scope, still-predictable case — exactly the shape the read set, the
      # provisioning guard and the cascade cells need, asked of the same
      # record gate the guard applies. Resolving is what naming cannot do:
      # each deployment environment resolves its own corpus estate, so a case
      # that exists in one is absent from another, and any one case drifts out
      # of shape as its docket resolves. The resolution is echoed to the run
      # summary, so a run always names its subject, and it happens before the
      # matrix fans out, so a corpus with no usable case costs seconds rather
      # than the engine-smoke legs' tokens.
      #
      # A non-empty `docket` pins one case instead and `court` is then its
      # court half; the resolver is skipped entirely. Pin a case when the
      # corpus cannot be resolved against, or when one particular case is the
      # point of the dispatch. The first is not hypothetical: the candidate
      # window is driven from the *blob's* snapshot index (which is what keeps
      # it bounded), so a pair whose blob carries no snapshot rows cannot
      # answer at all — a slice seeded split-on, the staging pair among them,
      # is exactly that, and the resolver refuses rather than naming an absent
      # case. A staging-ref dispatch therefore names a member of the seeded
      # slice; see the staging-corpus runbook in docs/security.md. A
      # pinned case must satisfy by hand what the resolver checks: it exists
      # in the corpus, it (or the `event` the dispatch narrows to) is
      # genuinely undisposed — the stub-cascade provisioning guard rightly
      # refuses a snapshot that already shows the outcome — and it carries a
      # stored snapshot, which under the live corpus split only cases the
      # post-cutover channels mutate (SCOTUS dockets) have; pre-cutover
      # index-only rows (circuit courts) serve the query/open-events reads but
      # never a snapshot.
      court:
        description: Court to resolve a case in, or the court half of a pinned case.
        type: string
        default: scotus
      docket:
        description: >-
          Empty resolves a known-good case from the corpus this run reads; a
          docket id pins that case instead. A repro-family scenario reads
          neither half: it names its own record in its steps, because that
          record IS the scenario.
        type: string
        default: ""
      engine:
        description: >-
          engine-smoke and engine-actions-smoke only — which real engine runs.
          SPENDS MODEL TOKENS: for engine-smoke, one predict cell's worth
          against the run's open-event case (a resolved or multi-event case
          also replays evaluator cells, so narrow with `event` when pinning
          one); for engine-actions-smoke, one boot probe. Ignored by `all`,
          which runs one of each per engine, by `all-offline`, which runs
          neither, and by every repro-family scenario, which names the engine
          its own defect belongs to.
        type: choice
        default: claude-code
        options:
          - claude-code
          - codex
          - gemini
      event:
        description: >-
          Optional event id to narrow the cascade scenarios to; empty runs
          every event the case defines. An event id belongs to one case, so
          pair it with a pinned `docket` rather than a resolved case.
        type: string
        default: ""
      deploy-environment:
        description: >-
          Deployment environment supplying the role and the corpus base URL. The
          `auto` default resolves it from the dispatching branch — `main`
          resolves `prod`, `staging` resolves `staging`, and any other branch
          resolves its own name, which names no configured environment and so
          binds no role variables and no keys — fail-closed. An explicit
          choice still wins, and each environment stays pinned to its one
          branch. A closed choice, not free text: run titles feed the
          promotion gate's freshness matching, so every dispatcher-controlled
          title component must come from a server-validated vocabulary.
          Unused by the collect scenario, whose job binds no environment and
          so dispatches from anywhere.
        type: choice
        # The scheduled canary supplies no input at all and lands on `prod`,
        # which is what it needs — a schedule runs from `main`, and `prod` is
        # where the engine keys are. But it gets there by a coercion, not by a
        # clause: `null != 'auto'` is true, `true && null` yields null, and the
        # falsy null falls through to the branch resolution. The
        # scheduled-workflow trap in docs/pipeline.md would have an input gate
        # like this rewritten affirmatively — `inputs.deploy-environment ==
        # 'auto' && <branch resolution> || inputs.deploy-environment`. Do NOT
        # rewrite this one that way: that shape hands a schedule the empty
        # string, and the canary would bind no environment, hold no keys, and
        # fail every leg. The trap is about gates that must be FALSE on a
        # schedule; this expression must produce a value on one.
        default: auto
        options:
          - auto
          - prod
          - staging

# Least privilege by default; the job widens only to what the scenarios need.
permissions: {}

# A superseded check has no value (every scenario is idempotent and
# side-effect free), so a newer dispatch cancels an in-flight one. The engine
# is part of the key so per-engine smokes run side by side (scenario-only
# grouping made simultaneous claude/gemini smoke dispatches cancel each
# other); for the other scenarios the engine input is a constant default, so
# the grouping is unchanged. A whole-suite dispatch (`all`, `all-offline`) —
# and a repro-family one, which names its own engine — groups on the scenario
# alone: its engine input is meaningless, and folding
# it in would let two such dispatches differing only on that input race
# instead of superseding each other, which for a repro leg is a second cell's
# spend for nothing. The two whole-suite scenarios keep
# separate groups, and neither shares one with a single-scenario run: none can
# cancel or queue behind another, and an overlap on the same scenario is
# harmless because every scenario is idempotent and side-effect free. The
# canary keys on its own name for the whole-suite reason: a schedule supplies
# no inputs, so the pair would collapse to a constant anyway, and naming it
# says which runs supersede each other.
concurrency:
  group: integration-test-${{ github.event_name == 'schedule' && 'canary' || ((inputs.scenario == 'all' || inputs.scenario == 'all-offline') && inputs.scenario || format('{0}-{1}', inputs.scenario, inputs.engine)) }}
  cancel-in-progress: true

jobs:
  # Expands the dispatch into the {scenario, engine} legs the job below fans
  # out over: `all` becomes the required suite's matrix legs (collect rides
  # the run as its own job, not a leg), `all-offline` those same legs minus
  # the token-spending engine ones, the scheduled canary the
  # engine-actions-smoke legs alone, any
  # other scenario one leg carrying the inputs unchanged — so a
  # single-scenario dispatch runs exactly the steps, env, and environment
  # binding it always has.
  #
  # It also settles the *case* the corpus-reading legs run on, once for the
  # whole fan-out: every such leg reads this job's `court`/`docket` outputs
  # and nothing else, so a resolved run and a pinned one differ in one place
  # instead of five. Resolving here rather than per leg is what makes an
  # unusable corpus cheap — the whole matrix, engine smokes included, is
  # downstream of this job, so it never starts.
  plan:
    # The schedule disjunct is not decoration: on a scheduled run the `inputs`
    # context is empty, and GitHub coerces both sides of a comparison against
    # null numerically — so `inputs.scenario != 'collect'` happens to be TRUE
    # there (NaN != NaN) and the canary would run on a coincidence of the
    # coercion rules rather than on anything stated. Naming the schedule says
    # what is meant, and survives someone hardening the inequality into the
    # fail-closed shape the scheduled-workflow trap in docs/pipeline.md asks
    # for everywhere it is a hazard rather than the intent.
    if: ${{ github.event_name == 'schedule' || inputs.scenario != 'collect' }}
    runs-on: ubuntu-latest
    # 15, not 5: the resolve path checks out, builds the Python env, assumes
    # the read-only role, and walks a bounded candidate window over the blob.
    timeout-minutes: 15
    # The resolve reads the corpus this dispatch's environment serves, so the
    # job binds that environment exactly as the scenario job does — same
    # expression, same deployment-branch gate, same fail-closed resolution for
    # a branch that names no configured environment (the read then finds no
    # role and no remote and the job fails, rather than resolving a case out
    # of some other environment's corpus). Keep this expression identical to
    # `run-name:`'s and the scenario job's; see the deploy-environment input.
    environment: ${{ inputs.deploy-environment != 'auto' && inputs.deploy-environment || (github.ref_name == 'main' && 'prod' || github.ref_name) }}
    permissions:
      contents: read
      id-token: write # assume the read-only AWS role for the ranged corpus read
    env:
      # The corpus estate, resolved exactly as the scenario job resolves it —
      # this environment's base URL (both store halves beneath it, and
      # addressing the store is the split mode) and the out-of-band index
      # pointer that keeps a staging-pointed environment reading staging's
      # index. The resolver must see the same estate the legs will, or it
      # would hand them a case out of a different corpus.
      FEDCOURTS_CORPUS_BASE_URL: ${{ vars.CORPUS_BASE_URL }}
      FEDCOURTS_CORPUS_POINTER: ${{ vars.FEDCOURTS_CORPUS_POINTER }}
      # Whether this dispatch resolves a case at all: only when the dispatcher
      # left `docket` at the sentinel AND some leg of it actually reads one.
      # The mcp-sidecar, qp-topic and engine-actions-smoke scenarios touch no
      # corpus, so a corpus that cannot answer must not redden a dispatch of
      # theirs — each is required freshness evidence in its own right, and the
      # canary's whole subject is the invocation path, which is reachable on a
      # day the corpus is not. (The scheduled canary reaches this expression
      # with an empty `inputs.scenario`, which the list does not contain, so it
      # resolves nothing either way.)
      RESOLVE_CASE: ${{ inputs.docket == '' && contains(fromJSON('["all", "all-offline", "ranged-reads", "corpus-service", "stub-cascade", "engine-smoke"]'), inputs.scenario) }}
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      # The one canonical pair the consuming legs read, whether it was
      # resolved from the corpus or passed through from the dispatch.
      court: ${{ steps.case.outputs.court }}
      docket: ${{ steps.case.outputs.docket }}
    steps:
      - name: Compute the scenario matrix
        id: plan
        env:
          # Inputs pass through the environment (never interpolated into the
          # shell) so a maintainer-supplied value cannot inject commands. A
          # schedule carries none, so the canary names its own arm here rather
          # than letting an empty scenario fall through the single-leg default
          # — one place decides what a cron run does. `canary` is not a
          # dispatch option: nothing but this expression can select it.
          SCENARIO: ${{ github.event_name == 'schedule' && 'canary' || inputs.scenario }}
          ENGINE: ${{ inputs.engine }}
        run: |
          set -euo pipefail
          # The promotion gate's required suite — keep in lockstep with
          # REQUIRED_SCENARIOS in scripts/promotion-gate.sh (a workflow-shape
          # test pins the two ends). collect is required evidence too, but it
          # needs no environment or engine, so it stays out of this matrix and
          # joins a whole-suite run through its own job below. The engine field
          # is meaningful only for the two engine scenarios; the other legs
          # carry the engine input's default as a benign constant.
          #
          # One literal for every derived selection below, filtered rather than
          # copied: `all-offline` is this minus exactly the legs that spend
          # model tokens, the canary is exactly the engine-actions-smoke ones,
          # and a second literal could drift from the first.
          suite='[
            {"scenario": "ranged-reads", "engine": "claude-code"},
            {"scenario": "corpus-service", "engine": "claude-code"},
            {"scenario": "stub-cascade", "engine": "claude-code"},
            {"scenario": "mcp-sidecar", "engine": "claude-code"},
            {"scenario": "qp-topic", "engine": "claude-code"},
            {"scenario": "engine-smoke", "engine": "claude-code"},
            {"scenario": "engine-smoke", "engine": "codex"},
            {"scenario": "engine-smoke", "engine": "gemini"},
            {"scenario": "engine-actions-smoke", "engine": "claude-code"},
            {"scenario": "engine-actions-smoke", "engine": "codex"},
            {"scenario": "engine-actions-smoke", "engine": "gemini"}
          ]'
          case "$SCENARIO" in
          all)
            matrix=$(jq -c . <<<"$suite")
            ;;
          all-offline)
            matrix=$(jq -c '[.[] | select(.scenario != "engine-smoke"
                                      and .scenario != "engine-actions-smoke")]' <<<"$suite")
            ;;
          canary)
            # The scheduled boot canary: every engine's invocation block, and
            # nothing else. Derived from the suite literal, so the canary can
            # only ever run legs the promotion gate also requires.
            matrix=$(jq -c '[.[] | select(.scenario == "engine-actions-smoke")]' <<<"$suite")
            ;;
          codex-application-repro)
            # A repro-family leg, and the engine is part of the defect rather
            # than a dispatcher's choice: pin it here so the leg cannot be
            # dispatched against an engine whose steps it does not run.
            # Deliberately absent from the suite literal above — see the repro
            # family note at the top of this file for why an open defect must
            # not ride a whole-suite run.
            matrix=$(jq -nc '[{scenario: "codex-application-repro", engine: "codex"}]')
            ;;
          *)
            matrix=$(jq -nc --arg s "$SCENARIO" --arg e "$ENGINE" \
              '[{scenario: $s, engine: $e}]')
            ;;
          esac
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"

      # The resolve path's three prerequisites, all skipped on a pinned or
      # corpus-free dispatch: the ranged backend needs the ref file from the
      # checkout, the CLI from the Python env, and credentials from the
      # read-only role. Assumed directly rather than through the
      # corpus-readonly composite for the ranged-reads leg's reason — the
      # census is a ranged read of the blob in place, never a full pull.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ env.RESOLVE_CASE == 'true' }}
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-python-env
        if: ${{ env.RESOLVE_CASE == 'true' }}

      - name: Configure AWS credentials (read-only)
        if: ${{ env.RESOLVE_CASE == 'true' }}
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME_READONLY }}
          aws-region: ${{ vars.AWS_REGION }}
          # Bound the assume-role wall clock, as the scenario job does; see
          # the note there for what a failing assume-role then looks like.
          action-timeout-s: 120

      # Always runs, with or without a resolve: it is the single producer of
      # the `court`/`docket` outputs, so the legs have one place to read from
      # in both modes.
      - name: Settle the case the scenarios run on
        id: case
        env:
          # Inputs pass through the environment (never interpolated into the
          # shell) so a maintainer-supplied value cannot inject commands.
          COURT: ${{ inputs.court }}
          DOCKET: ${{ inputs.docket }}
        run: |
          set -euo pipefail
          if [ "$RESOLVE_CASE" != true ]; then
            # Pinned, or a scenario that reads no case at all (where both
            # values are inert — no leg of such a dispatch reads them).
            printf 'court=%s\ndocket=%s\n' "$COURT" "$DOCKET" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          out="$RUNNER_TEMP/integration-case.out"
          err="$RUNNER_TEMP/integration-case.err"
          status=0
          uv run fedcourts corpus-integration-case \
            --court "$COURT" --corpus-backend ranged >"$out" 2>"$err" || status=$?
          # The command's own diagnostic — the resolved case with its
          # live-poll stamp, snapshot date and open events, or the per-reason
          # tally of what the candidate window rejected — is the whole value
          # of failing here rather than six legs later, so it reaches the log
          # and the summary on both paths. Deterministic CLI output, never a
          # transcript, so rendering it is safe; fenced in the summary, and
          # indented into the log as the sidecar replay below is — an
          # unindented line opening `::<command>::` is parsed as a workflow
          # command by the runner.
          sed 's/^/  /' "$err" >&2
          {
            echo ""
            echo "## Integration case"
            echo ""
            echo '```'
            cat "$err"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then
            echo "::error::no case resolved — the suite has no subject to run on"
            exit "$status"
          fi
          # Shape-pin before the append: these two lines become job outputs,
          # and their values come from corpus rows built out of upstream data.
          # The command emits a court id then an integer docket, nothing else;
          # anything else is a bug or a crafted row, and neither belongs in
          # $GITHUB_OUTPUT. (The pinned path above needs no such screen — its
          # values are the dispatcher's own, and already reach the legs.)
          #
          # Stated positively — each line must be one of the two expected
          # shapes, in order, and there must be exactly two. A screen written
          # as "no line disagrees" would pass a third line the file never
          # terminates, since a trailing newline is what a line count counts.
          if ! awk '
            NR == 1 && /^court=[a-z0-9][a-z0-9-]*$/ { court = 1 }
            NR == 2 && /^docket=[0-9]+$/ { docket = 1 }
            END { exit !(NR == 2 && court && docket) }' "$out"; then
            echo "::error::the resolver did not emit a court/docket pair"
            exit 1
          fi
          cat "$out" >> "$GITHUB_OUTPUT"

  scenario:
    # Every dispatch-selected scenario except `collect`, which runs on its own
    # environment-free job below: it needs no role variables, so binding it to
    # this job's deployment environment would only add a needless gate. Plus
    # the scheduled canary, named for the reason the plan job's gate carries.
    if: ${{ github.event_name == 'schedule' || inputs.scenario != 'collect' }}
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      # A broken leg must not cancel the others: each leg is independent
      # freshness evidence for its scenario, and an `all` run's whole-suite
      # evidence is simply the run succeeding — which needs every leg's own
      # verdict, not the first failure's.
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    # 45, not 30: the engine-smoke scenario spans an npm CLI install plus one
    # real agent cell, which alone can run tens of minutes on a slow model day.
    #
    # The application-repro leg gets 75 instead, and the arithmetic is its own:
    # the work it reproduces is a judge cell on an application record, measured
    # at 40-50 minutes, so its watchdog deadline sits at 50 and its step bound at
    # 58 (see the leg's own steps). 58 plus this job's setup — checkout, env,
    # corpus provisioning, blinded staging, the MCP sidecar — and the disarm,
    # distill and upload tail lands near 63, and 75 is that with room. Per-leg
    # rather than raised for everyone: a 75-minute cap on the boot probes would
    # turn a hung smoke into an hour of billed silence.
    timeout-minutes: ${{ matrix.scenario == 'codex-application-repro' && 75 || 45 }}
    # Branch-resolved with an explicit override; keep this expression
    # identical to `run-name:`'s and the plan job's above (YAML anchors do not
    # work in workflows), and see the deploy-environment input for what
    # resolves.
    environment: ${{ inputs.deploy-environment != 'auto' && inputs.deploy-environment || (github.ref_name == 'main' && 'prod' || github.ref_name) }}
    permissions:
      contents: read
      id-token: write # assume the read-only AWS role for the corpus reads
    # This environment's corpus estate, job-wide: one base URL, under which
    # both halves are fixed segments — the index the ranged reads address, and
    # the per-case content store that serves snapshot payloads and opinion
    # bodies (addressing it is the split mode). Job-level so every client-side
    # read — the ranged read set, the stub cascade, the provisioning guard,
    # the engine-smoke cascade — resolves the same estate; the sidecar process
    # gets the same address explicitly, as a corpus-sidecar composite input,
    # exactly as the cell workflows pass it.
    #
    # The index pointer travels the same way. A consumer resolves
    # the committed `corpus/corpus.db.ref`, whose digest names the production
    # blob, unless this out-of-band pointer names another published blob —
    # and content addressing means a lean slice can never publish under the
    # production digest, so an environment whose base URL names staging's
    # estate must carry staging's pointer too or every index read asks that
    # bucket for a key it does not hold. An unset variable resolves to the
    # empty string, which reads as "the committed pointer, unchanged", and no
    # fallback literal can express a pointer, so there is nothing to default
    # it to. What keeps the `prod` lane off this path is that the variable is
    # set on the `staging` environment alone — every corpus-writing workflow
    # hard-codes `environment: prod` and forwards no pointer at all.
    # Job-level for the base URL's own reason — one estate per job, never a
    # staging index resolved against a production pointer.
    env:
      FEDCOURTS_CORPUS_BASE_URL: ${{ vars.CORPUS_BASE_URL }}
      FEDCOURTS_CORPUS_POINTER: ${{ vars.FEDCOURTS_CORPUS_POINTER }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # data/qp-topics membership encodes cert outcomes (docs/qp-topic.md), so
      # every workflow that starts an agent deletes it first; the engine-smoke
      # scenario runs real cells and is the freshness evidence for cell
      # behaviour, so it must reproduce the cell environment it certifies.
      # Elsewhere in the matrix the step is a harmless no-op.
      - name: Remove the labeling-measurement oracle from the agent's tree
        run: rm -rf data/qp-topics

      - uses: ./.github/actions/setup-python-env

      # --- ranged-reads: the fixed read set against the blob in place --------

      # Ranged reads need only AWS credentials and the estate's base URL from
      # the environment, which derives the index they address — never a full
      # pull, never the blob on disk — so this
      # assumes the read-only role directly instead of via the corpus-readonly
      # composite, whose pull serves jobs that read the local file.
      - name: Configure AWS credentials (read-only)
        if: ${{ matrix.scenario == 'ranged-reads' || matrix.scenario == 'stub-cascade' }}
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME_READONLY }}
          aws-region: ${{ vars.AWS_REGION }}
          # Bound the assume-role wall clock: unbounded, its 12 retries over a
          # multi-minute connect timeout outlast every job budget here (see the
          # workflow-traps list in docs/pipeline.md). Note the cost this buys —
          # the action does not clear its timer on the error path, so ANY failing
          # assume-role now burns the full 120s and ends on "Action timed out"
          # rather than its own message; the real cause is earlier in the log.
          action-timeout-s: 120

      # All the logic — the three reads, the non-empty assertions, the
      # per-read GET/byte counters, the wall-clock budget, the Markdown
      # summary — lives in the tested `corpus-integration-check` command; this
      # step is one CLI call that fails the job on any empty read or a blown
      # budget, so a pathology (a table scan, a cache regression) fails the
      # run instead of hiding in the logs.
      - name: Run the fixed ranged read set
        if: ${{ matrix.scenario == 'ranged-reads' }}
        env:
          # The case the plan job settled — resolved from this environment's
          # corpus, or the dispatcher's pinned pair. Every leg reads it from
          # there and nowhere else, and it passes through the environment
          # (never interpolated into the shell) so no supplied value can
          # inject commands.
          COURT: ${{ needs.plan.outputs.court }}
          DOCKET: ${{ needs.plan.outputs.docket }}
        run: |
          set -euo pipefail
          uv run fedcourts corpus-integration-check \
            --court "$COURT" --docket "$DOCKET" \
            --corpus-backend ranged \
            --summary-out "$GITHUB_STEP_SUMMARY"

      # --- corpus-service: the sidecar surface the live cells retrieve from --

      # The same composite the cell workflows launch: assumes the role with
      # step-scoped credentials, starts `fedcourts corpus-serve`, health-gates,
      # and publishes the non-secret service URL job-wide. A dispatch therefore
      # exercises the dispatched ref's own composite + service code. The
      # engine-smoke scenario also takes the step-scoped credential outputs
      # for the cascade's own provisioning reads, as the codex-application-repro
      # leg does for the cell-provisioning steps it mirrors from run-evaluate.
      - uses: ./.github/actions/corpus-sidecar
        id: corpus
        if: ${{ matrix.scenario == 'corpus-service' || matrix.scenario == 'engine-smoke' || matrix.scenario == 'codex-application-repro' }}
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME_READONLY }}
          aws-region: ${{ vars.AWS_REGION }}
          # One address for the sidecar process itself: `full` query bodies
          # hydrate from the per-case content store the base derives, and the
          # sidecar is the credentialed process — a sidecar that could not
          # reach the store would silently serve bodiless rows while every
          # other read stayed green.
          corpus-base-url: ${{ vars.CORPUS_BASE_URL }}
          # The pointer, explicit for the same reason: the sidecar is a
          # separate process, and an index it resolved from the committed
          # pointer would serve production's index rows against this
          # environment's store.
          corpus-pointer: ${{ vars.FEDCOURTS_CORPUS_POINTER }}

      # The same tested command as the ranged read set, on the service
      # backend: three reads through the exact client a cell's `service`
      # backend forwards with, failing on an empty result, a blown budget, or
      # — the full-query hydration probe — an opinion-bearing row whose body
      # hydrates empty (the content-store path degrades to None rather than
      # raising, so only asking for a body can prove one arrives).
      - name: Run the service read set against the sidecar
        if: ${{ matrix.scenario == 'corpus-service' }}
        env:
          COURT: ${{ needs.plan.outputs.court }}
          DOCKET: ${{ needs.plan.outputs.docket }}
        run: |
          set -euo pipefail
          uv run fedcourts corpus-integration-check \
            --court "$COURT" --docket "$DOCKET" \
            --corpus-backend service \
            --summary-out "$GITHUB_STEP_SUMMARY"

      # --- stub-cascade: provision -> predict -> validate, token-free --------

      # The production provisioning command, exercised end to end before the
      # cascade: run-predict's own step passes the same
      # `--mode forward --refuse-terminal` (plus a staleness bound this
      # harness deliberately leaves off — a stored snapshot ages, and the
      # bound would turn the leg red on calendar time alone) but is
      # continue-on-error there (a
      # refusal must not burn the whole fan-out), so the guard drifting to
      # always-refuse — or the flag silently dropping out — fails nothing at
      # runtime, while local-cascade provisions in-process and never runs this
      # CLI at all. Here the command must *succeed and write the record* for
      # the settled case: that case is undisposed — the resolver asks this
      # very gate, and a pinned one carries the same obligation on the input —
      # so a refusal is by construction a guard regression. An isolated data
      # root keeps its writes out of the cascade's tree.
      - name: Provision the forward record through the production guard
        if: ${{ matrix.scenario == 'stub-cascade' }}
        env:
          COURT: ${{ needs.plan.outputs.court }}
          DOCKET: ${{ needs.plan.outputs.docket }}
          EVENT: ${{ inputs.event }}
          FEDCOURTS_CORPUS_BACKEND: ranged
          FEDCOURTS_DATA_ROOT: ${{ runner.temp }}/provision-guard/data
        run: |
          set -euo pipefail
          uv run fedcourts provision-snapshot --court "$COURT" --docket "$DOCKET" \
            --mode forward --refuse-terminal ${EVENT:+--event "$EVENT"}
          test -s "$FEDCOURTS_DATA_ROOT/cases/$COURT/$DOCKET/record/context.json"

      # One offline stub cascade cell with every corpus read on the ranged
      # backend. Deterministic and token-free; the cell writes derived
      # artifacts only into the runner's throwaway checkout — this job holds
      # no write credential, so nothing can land anywhere.
      - name: Run one stub cascade cell over the ranged backend
        if: ${{ matrix.scenario == 'stub-cascade' }}
        env:
          COURT: ${{ needs.plan.outputs.court }}
          DOCKET: ${{ needs.plan.outputs.docket }}
          EVENT: ${{ inputs.event }}
          FEDCOURTS_CORPUS_BACKEND: ranged
        run: |
          set -euo pipefail
          {
            echo ""
            echo "## Stub cascade over the ranged backend"
            echo ""
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          uv run fedcourts local-cascade --court "$COURT" --docket "$DOCKET" \
            --engine stub --require-predictions \
            ${EVENT:+--event "$EVENT"} | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # --- qp-topic: the labeling pipeline's post-label half, token-free -----

      # Drives the shared qp-topic-measure composite — the exact steps the
      # paid labeling run depends on — over canned inputs built from the
      # committed reference set, so the no-output guard, the publication
      # gate's refusal, and the publish-and-validate path are all exercised
      # with no model spend and no credentials. The extract and the model
      # call stay uncovered here by design: the extract needs QP document
      # rows no fixture corpus writes, and the model call is exactly what
      # `run-analytics` pays for. The leg rides this matrix job — whose
      # environment binding and id-token grant it never reads — deliberately:
      # that binding is what makes its run title's `@ staging` suffix a
      # deployment-gated provenance claim, which is how the promotion gate
      # reads every required matrix leg. A second credential-free job header
      # would trade that evidence away for no gain.
      - name: Seed canned labeling inputs from the committed reference set
        if: ${{ matrix.scenario == 'qp-topic' }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/qp-topic"
          mkdir -p "$root/data/qp-topics"
          # The oracle-fence step above deleted data/qp-topics from the
          # working tree, so recover the reference set from the commit.
          git show HEAD:data/qp-topics/qp-topic-reference.json \
            > "$root/data/qp-topics/qp-topic-reference.json"
          # The extract shape `qp-corpus` produces, minus the texts (an empty
          # text fires no shadow rule), and one label line per reference
          # entry: agreement and coverage both 100%.
          jq '[.entries[] | {case_id, docket_number, text: ""}]' \
            "$root/data/qp-topics/qp-topic-reference.json" > "$root/qp-texts.json"
          # `label` is a jq keyword, so the object key needs the explicit form.
          jq -c '.entries[] | {case_id, docket_number, label: .label}' \
            "$root/data/qp-topics/qp-topic-reference.json" > "$root/qp-labels.jsonl"
          # A labeler that produced nothing (the no-output guard's case) ...
          : > "$root/qp-labels-empty.jsonl"
          # ... and one that disagrees on every third entry: agreement ~67%,
          # far enough under the 80% gate that the measure must refuse.
          jq -c '.entries | to_entries[] | if (.key % 3) == 0
              then {case_id: .value.case_id, docket_number: .value.docket_number,
                    label: (if .value.label == "tax" then "criminal-law" else "tax" end)}
              else {case_id: .value.case_id, docket_number: .value.docket_number,
                    label: .value.label} end' \
            "$root/data/qp-topics/qp-topic-reference.json" > "$root/qp-labels-drifted.jsonl"

      - name: Measure a run whose labeler wrote nothing (must fail)
        if: ${{ matrix.scenario == 'qp-topic' }}
        id: qp-empty
        continue-on-error: true
        uses: ./.github/actions/qp-topic-measure
        with:
          labels: ${{ runner.temp }}/qp-topic/qp-labels-empty.jsonl
          texts: ${{ runner.temp }}/qp-topic/qp-texts.json
          labeler: canned/none
          data-root: ${{ runner.temp }}/qp-topic/data

      # Pin the *reason*, not just the failure: the guard fires before the
      # measure step, so measured.txt not existing yet proves the no-output
      # assert refused — a plain outcome check would stay green even if the
      # guard were dropped and the measure command's own "no label lines"
      # error failed the leg instead.
      - name: Assert the no-output guard refused before measuring
        if: ${{ matrix.scenario == 'qp-topic' }}
        env:
          EMPTY_OUTCOME: ${{ steps.qp-empty.outcome }}
        run: |
          set -euo pipefail
          if [ "$EMPTY_OUTCOME" != "failure" ]; then
            echo "::error::a labeler that wrote nothing passed the measure"
            exit 1
          fi
          if [ -e "$RUNNER_TEMP/measured.txt" ]; then
            echo "::error::the no-output guard did not fire; the measure step ran on an empty labels file"
            exit 1
          fi

      - name: Measure a drifted run (the gate must refuse to publish)
        if: ${{ matrix.scenario == 'qp-topic' }}
        id: qp-drifted
        continue-on-error: true
        uses: ./.github/actions/qp-topic-measure
        with:
          labels: ${{ runner.temp }}/qp-topic/qp-labels-drifted.jsonl
          texts: ${{ runner.temp }}/qp-topic/qp-texts.json
          labeler: canned/drifted
          data-root: ${{ runner.temp }}/qp-topic/data

      - name: Assert the gate refused the drifted run and published nothing
        if: ${{ matrix.scenario == 'qp-topic' }}
        env:
          DRIFTED_OUTCOME: ${{ steps.qp-drifted.outcome }}
        run: |
          set -euo pipefail
          if [ "$DRIFTED_OUTCOME" != "failure" ]; then
            echo "::error::a drifted labeler passed the publication gate"
            exit 1
          fi
          # The refusal, in the gate's own words — a different failure (a
          # join error, a vocabulary reject) must not satisfy this leg.
          if ! grep -q "refusing to write" "$RUNNER_TEMP/measured.txt"; then
            echo "::error::the drifted run failed for some reason other than the publication gate"
            exit 1
          fi
          if [ -e "$RUNNER_TEMP/qp-topic/data/qp-topics/qp-topics.json" ]; then
            echo "::error::a refused run left a labels artifact behind"
            exit 1
          fi

      - name: Measure a faithful run (must publish and validate)
        if: ${{ matrix.scenario == 'qp-topic' }}
        uses: ./.github/actions/qp-topic-measure
        with:
          labels: ${{ runner.temp }}/qp-topic/qp-labels.jsonl
          texts: ${{ runner.temp }}/qp-topic/qp-texts.json
          labeler: canned/reference
          data-root: ${{ runner.temp }}/qp-topic/data

      - name: Assert the published artifact carries the whole reference set
        if: ${{ matrix.scenario == 'qp-topic' }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/qp-topic"
          expected=$(jq '.cases' "$root/data/qp-topics/qp-topic-reference.json")
          jq -e --argjson n "$expected" \
            '.cases == $n and .agreement.gate_passed == true and .vocabulary == "qp-topic-v0"' \
            "$root/data/qp-topics/qp-topics.json" > /dev/null
          echo "qp-topic scenario: published $expected case(s), gate passed" >> "$GITHUB_STEP_SUMMARY"

      # --- engine-smoke: one real agent cell over the service sidecar --------

      # The one scenario that spends model tokens: a single real-engine
      # predictor cell driven through the tested local-cascade seam, with the
      # agent's corpus retrieval on the service sidecar — the full production
      # cell posture (credential-scrubbed agent env, tokenless localhost
      # retrieval, each engine's real sandbox semantics), exercised on demand.
      # This is the scenario that catches an engine-level integration break —
      # a sandbox denying localhost, a CLI behavior change — before a live
      # run finds it. The CLI install is its own SECRET-FREE step: only the
      # top-level version is exactly pinned (transitive dependencies resolve
      # fresh at every install), so npm lifecycle scripts must never see
      # credentials.
      #
      # The engine-actions-smoke legs take this step for gemini alone: that
      # engine's production invocation is a CLI call, while claude and codex
      # run through actions that install their own CLI — and letting them do
      # that is part of what the leg exercises.
      - name: Install the selected agent CLI
        if: ${{ matrix.scenario == 'engine-smoke' || (matrix.scenario == 'engine-actions-smoke' && matrix.engine == 'gemini') }}
        env:
          ENGINE: ${{ matrix.engine }}
        # zizmor: ignore[adhoc-packages] — top-level exact-version pins,
        # transitive scripts disabled, and a secret-free step environment are
        # the practical controls for global CLIs; a lockfile is not
        # expressible for `npm i -g`. The one script run on purpose is the
        # pinned claude package's own installer, which fetches the native
        # binary from the vendor's release endpoint — the same vendor trust
        # executing the agent itself carries. Keep the pins in lockstep with
        # run-predict, run-evaluate, and run-backtest.
        run: |
          set -euo pipefail
          case "$ENGINE" in
            claude-code) package="@anthropic-ai/claude-code@2.1.259" binary=claude ;;
            codex) package="@openai/codex@0.144.1" binary=codex ;;
            gemini) package="@google/gemini-cli@0.49.0" binary=gemini ;;
          esac
          npm install --silent --no-audit --ignore-scripts --global "$package"
          # Claude's native binary is placed by its postinstall, which
          # --ignore-scripts suppresses; run the pinned package's own
          # installer explicitly — the one script we already trust enough to
          # execute as the agent moments later. codex/gemini need no
          # postinstall.
          if [ "$ENGINE" = "claude-code" ]; then
            node "$(npm root -g)/@anthropic-ai/claude-code/install.cjs"
          fi
          "$binary" --version

      # The codex sandbox (bubblewrap) needs unprivileged user namespaces,
      # which Ubuntu 24.04 runners restrict via AppArmor: without this, every
      # command the agent runs — and even its file writes — dies with
      # `bwrap: setting up uid map: Permission denied` and the cell finishes
      # blocked. The same prerequisite codex-action applies for the live
      # cells before dropping sudo (which this job does not do — see the
      # engine-smoke paragraph in docs/security.md); the other engines
      # sandbox nothing and need neither sysctl. Each knob is probed before
      # writing, as upstream does: a kernel without the knob has nothing to
      # loosen.
      #
      # Every codex leg needs it: the actions-smoke and application-repro legs
      # pass the cells' own `permission-profile: fedcourts-cell` /
      # `safety-strategy: drop-sudo` pair, so their turns run under the same
      # bubblewrap sandbox.
      - name: Enable unprivileged user namespaces for the codex sandbox
        if: ${{ (matrix.scenario == 'engine-smoke' || matrix.scenario == 'engine-actions-smoke' || matrix.scenario == 'codex-application-repro') && matrix.engine == 'codex' }}
        run: |
          set -euo pipefail
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          if sysctl -n kernel.unprivileged_userns_clone >/dev/null 2>&1; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi

      # The CourtListener MCP half of the cell posture, wired for the codex
      # leg only. The corpus sidecar above gives every leg its corpus
      # retrieval; this pair gives codex the same MCP surface a live cell
      # gets — the tokenless localhost sidecar (token in the composite's
      # launch step env, never the agent's) plus the generated client config
      # naming only that URL — in run-predict's order: corpus sidecar, MCP
      # sidecar, MCP config, cell. It is here rather than on all three
      # because codex is the engine whose manifest use never arrives as an item
      # of its own: code mode dispatches every call from inside a freeform
      # `exec`, so the `record-retrieval` parser reaches it only by reading that
      # call's source, and a real rollout with the surface wired is what
      # exercises that path. What the leg evidences is that much — the engine
      # boots in the cell posture and produces a rollout the parser's
      # code-mode branch can read. What it cannot evidence is anything read off
      # the ABSENCE of an MCP-shaped item, here or in the distillation below:
      # code mode emits none whether or not retrieval happened, so that absence
      # separates nothing. (Committed production cells do carry `mcp__` rows for
      # these calls — lifted from the source, `call_source: code_mode_source` —
      # but this leg runs no capture step and produces no retrieval log.) Health
      # stays warn-only, as in the cells: an unhealthy sidecar degrades the
      # cell to corpus tooling rather than failing the smoke, and the
      # `mcp-sidecar` scenario is the leg that gates on the sidecar itself.
      - uses: ./.github/actions/mcp-sidecar
        if: ${{ matrix.scenario == 'engine-smoke' && matrix.engine == 'codex' }}
        with:
          role: predictor
          actor: codex-baseline
          courtlistener-api-token: ${{ secrets.COURTLISTENER_API_TOKEN }}

      # The tested `mcp-config` command emits codex's client format from the
      # versioned manifest (config/predictors.yaml `mcp_servers:`); this step
      # only plumbs stdout to the file codex reads. `.codex` is the cascade
      # step's CODEX_HOME below, so the config lands where the CLI looks for
      # it. The file carries a localhost URL and no token — an unknown actor
      # or a mistyped server id fails the step rather than falling back to a
      # per-client stdio spawn.
      - name: Configure the codex cell's MCP retrieval
        if: ${{ matrix.scenario == 'engine-smoke' && matrix.engine == 'codex' }}
        run: |
          set -euo pipefail
          mkdir -p .codex
          uv run fedcourts mcp-config --engine codex \
            --role predictor --actor codex-baseline \
            --http-url courtlistener=http://127.0.0.1:8378/mcp > .codex/config.toml

      # Gemini's sanitizer runs strict whenever GITHUB_SHA is set and strips
      # every custom var from the agent's shell, so the cell env contract and
      # the service-backend pointers must be allowlisted (run-predict.yml
      # carries the fuller rationale), and respectGitIgnore lets the cell read
      # its gitignored provisioned record files. Only non-secret identifiers
      # belong on this allowlist — it is written raw here, with no
      # credential-shape screen in the path. It is also the base file the
      # actions-smoke leg merges its MCP servers over, exactly as the cell
      # step writes settings and merges in one go — which is why the literal
      # is the cell step's byte for byte, telemetry block included (a test
      # compares the two). That file is part of what gemini is *invoked with*:
      # its schema has twice produced a silent no-op from a wrong namespace,
      # so a probe sending a trimmed one would certify a configuration the
      # cells do not run. Telemetry costs this workflow nothing — the log is
      # gitignored and nothing here reads or uploads it.
      - name: Configure the Gemini cell env allowlist
        if: ${{ (matrix.scenario == 'engine-smoke' || matrix.scenario == 'engine-actions-smoke') && matrix.engine == 'gemini' }}
        run: |
          set -euo pipefail
          mkdir -p .gemini
          printf '%s\n' '{"context":{"fileFiltering":{"respectGitIgnore":false}},"telemetry":{"enabled":true,"target":"local","outfile":".gemini/telemetry.log","logPrompts":true},"security":{"environmentVariableRedaction":{"allowed":["COURT_ID","DOCKET_ID","EVENT_ID","PREDICTOR_ID","EVALUATOR_ID","RUN_ID","MODEL_ID","DECIDED_BEFORE","FEDCOURTS_CORPUS_BACKEND","FEDCOURTS_CORPUS_SERVICE_URL"]}}}' > .gemini/settings.json

      # The backend split that makes this faithful: `--corpus-backend ranged`
      # pins the cascade's own provisioning reads to the blob (using this
      # step's scoped credentials), while the ambient
      # FEDCOURTS_CORPUS_BACKEND=service — which the spawned agent inherits
      # through the runner's scrubbed base env, along with the service URL the
      # sidecar composite published job-wide — points the agent's retrieval at
      # the sidecar, exactly like a live cell. The runner seam scrubs the AWS
      # credentials and every other engine's key from the agent env, so the
      # agent holds only its own engine's key (the ternaries below); the
      # predictor ids map each engine to its baseline in
      # config/predictors.yaml (an id drift fails loudly, naming the enabled
      # ids). One predictor cell, so the spend is one cell's worth against
      # the settled open-event case (a resolved event would also replay
      # evaluator cells — the input description says so). The engine keys
      # resolve from the deployment environment like every other secret, so a
      # dispatch naming an environment without the keys gets an empty key and
      # the cell fails closed regardless of step ordering. Output lands only in the
      # runner's throwaway checkout.
      - name: Run one real-engine cascade cell over the service sidecar
        if: ${{ matrix.scenario == 'engine-smoke' }}
        env:
          ENGINE: ${{ matrix.engine }}
          COURT: ${{ needs.plan.outputs.court }}
          DOCKET: ${{ needs.plan.outputs.docket }}
          EVENT: ${{ inputs.event }}
          AWS_ACCESS_KEY_ID: ${{ steps.corpus.outputs.aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.corpus.outputs.aws-secret-access-key }}
          AWS_SESSION_TOKEN: ${{ steps.corpus.outputs.aws-session-token }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          FEDCOURTS_CORPUS_BACKEND: service
          # The estate's address rides the job env for the cascade's own
          # provisioning reads; the agent inherits those two non-secret
          # values — the base URL both store halves derive from, and the index
          # pointer — harmlessly: its reads go via the sidecar, the content
          # store is unreachable without the scrubbed creds, and a pointer
          # names a blob rather than granting any reach to one.
          ANTHROPIC_API_KEY: ${{ matrix.engine == 'claude-code' && secrets.ANTHROPIC_API_KEY || '' }}
          OPENAI_API_KEY: ${{ matrix.engine == 'codex' && secrets.OPENAI_API_KEY || '' }}
          GEMINI_API_KEY: ${{ matrix.engine == 'gemini' && secrets.GEMINI_API_KEY || '' }}
          # Pin codex's home to the workspace dir the MCP config was written
          # into, exactly as the live codex cell step does: unset, the cascade
          # picks a run-scoped temp home for the API-key login, and both the
          # config the cell must read and the session rollout the shape
          # distillation reads land somewhere no later step can name. Inert
          # for the other two engines, which never read it.
          CODEX_HOME: ${{ github.workspace }}/.codex
        run: |
          set -euo pipefail
          case "$ENGINE" in
            claude-code) predictor=claude-baseline ;;
            codex) predictor=codex-baseline ;;
            gemini) predictor=gemini-baseline ;;
          esac
          # The agent's transcript is untrusted model output: it stays in the
          # run log (plain text) and out of the *rendered* step summary, where
          # a stray fence-closer could inject live Markdown. Only the
          # deterministic CascadeReport block — printed by the CLI after the
          # cells finish — is appended, and only on success (pipefail aborts
          # before the append otherwise).
          # --require-predictions: a real agent that finishes "blocked" exits
          # 0 with a validly-empty ledger; the smoke must fail on that, not
          # report green around an empty cell.
          uv run fedcourts local-cascade --court "$COURT" --docket "$DOCKET" \
            --engine "$ENGINE" --predictor "$predictor" --corpus-backend ranged \
            --require-predictions \
            ${EVENT:+--event "$EVENT"} | tee cascade-output.log
          {
            echo ""
            echo "## Engine smoke: one $ENGINE cell over the service sidecar"
            echo ""
            echo '```'
            sed -n '/^local-cascade /,$p' cascade-output.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # --- codex-application-repro: the wedge's record shape, on demand ------

      # The repro family's first member (see the family note at the top of
      # this file). Codex cells wedge — hang until the job cap cancels the
      # runner — on **application-lane** records: a SCOTUS interim docket
      # (`YYAnnn`) carrying the motion / order-response-requested /
      # brief-response event trio and the application-kind provisioned
      # document. Every other engine completes the same cells, and codex
      # completes cert-stage cells normally, which is exactly why the rest of
      # this suite cannot see it: the resolver applies no stage screen, but
      # what it settles on in practice is a cert-stage petition, and no other
      # leg here presents an application record to an engine.
      #
      # So this leg presents one, deliberately: `run-evaluate`'s codex cell
      # step, on its own invocation surface, against a record pinned below.
      # The evaluate role rather than predict because that is where the wedge
      # is deterministic — codex judge cells on these records wedge every
      # time, while codex predict cells on them sometimes complete — and
      # because the evaluate cell is the shape whose staging (blinded
      # candidates, hidden record) the rest of the suite never runs either.
      #
      # What it costs and what it says: one evaluate cell's worth of codex
      # tokens, and a red leg is the finding rather than a fault in the
      # harness. A green leg says only that this record shape completed on
      # this day, which for an open defect is worth having and for a closed
      # one is the regression test.
      #
      # The record is PINNED, not resolved. An application resolves in days,
      # so no live application docket stays a stable subject, while a
      # committed resolved one keeps its shape indefinitely — and an evaluate
      # cell wants a decided docket anyway. The pin therefore names a docket
      # whose ledger trio is committed here and whose corpus row still serves
      # the snapshot and the application document the cell reads — the
      # provisioning step below asserts that second half rather than assuming
      # it. Which corpus that is stays the deployment environment's business,
      # as it is for every other leg: the pinned docket lives in the
      # production estate, so dispatch this scenario against an environment
      # whose corpus carries it, and read a provisioning failure as the estate
      # not holding the record rather than as the defect reproducing.
      - name: Resolve the pinned application-lane cell identity
        id: repro
        if: ${{ matrix.scenario == 'codex-application-repro' }}
        run: |
          set -euo pipefail
          # The pin, spelled once. Both known-trigger dockets carry the same
          # trio; re-point these three at the sibling docket or another of its
          # events to widen an investigation, which is an edit to this
          # scenario rather than a dispatch input — the record IS the
          # scenario, and a dispatcher who could re-point it could also make a
          # red leg mean something else.
          court=scotus
          docket=9526000275
          event=evt-motion-disposition
          # The identity a production judge cell of this engine runs under,
          # read from the package and the registry rather than restated: a
          # model default bump or a prompt move would otherwise leave this leg
          # reproducing against an invocation production no longer makes.
          model=$(uv run python -c \
            'from fedcourtsai.pricing import DEFAULT_MODELS; print(DEFAULT_MODELS["codex"])')
          prompt=$(uv run python -c \
            'from pathlib import Path; from fedcourtsai.registry import enabled_evaluators; print(next(e.prompt for e in enabled_evaluators(Path("config/evaluators.yaml")) if e.id == "codex-judge"))')
          run_id=$(uv run python -c 'from fedcourtsai import ids; print(ids.run_id())')
          # Shape-screen before the append: all three become step outputs that
          # ride straight into an action's `with:` block.
          case "$model" in
            "" | *[!a-zA-Z0-9.-]*)
              echo "::error::the resolved model id is not a bare identifier"
              exit 1
              ;;
          esac
          # Charset first, then shape: `*` matches a newline, so a path
          # carrying one would otherwise pass the prefix test and forge extra
          # `key=value` lines into $GITHUB_OUTPUT — including the model that
          # rides into the action's `with:` block.
          case "$prompt" in
            *[!a-zA-Z0-9./_-]*)
              echo "::error::the resolved evaluate prompt is not a bare repo path"
              exit 1
              ;;
          esac
          case "$prompt" in
            .github/prompts/*.md) ;;
            *)
              echo "::error::the resolved evaluate prompt is not a repo prompt path"
              exit 1
              ;;
          esac
          case "$run_id" in
            [0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]T[0-9][0-9][0-9][0-9][0-9][0-9]Z) ;;
            *)
              echo "::error::the minted run id is not a UTC run-id stamp"
              exit 1
              ;;
          esac
          {
            printf 'court=%s\ndocket=%s\nevent=%s\n' "$court" "$docket" "$event"
            printf 'evaluator=codex-judge\nmodel=%s\nprompt=%s\nrun_id=%s\n' \
              "$model" "$prompt" "$run_id"
          } >> "$GITHUB_OUTPUT"
          {
            echo ""
            echo "## codex-application-repro"
            echo ""
            echo "- record: \`${court}/${docket}\` ${event} (application lane)"
            echo "- cell: codex-judge / ${model}, run ${run_id}"
          } >> "$GITHUB_STEP_SUMMARY"

      # run-evaluate's provisioning step, verbatim in what it asks for: the
      # latest snapshot and the case's documents, no `--event` cut and no
      # forward gate — an evaluate cell targets a decided docket by design.
      # Read-only credentials ride this step's env only, from the corpus
      # sidecar's outputs, exactly as they do in the cell workflow.
      - name: Provision the pinned record from the corpus
        if: ${{ matrix.scenario == 'codex-application-repro' }}
        env:
          COURT_ID: ${{ steps.repro.outputs.court }}
          DOCKET_ID: ${{ steps.repro.outputs.docket }}
          AWS_ACCESS_KEY_ID: ${{ steps.corpus.outputs.aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.corpus.outputs.aws-secret-access-key }}
          AWS_SESSION_TOKEN: ${{ steps.corpus.outputs.aws-session-token }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          FEDCOURTS_CORPUS_BACKEND: ranged
        run: |
          set -euo pipefail
          uv run fedcourts provision-snapshot --court "$COURT_ID" --docket "$DOCKET_ID"
          # The scenario's own claim, asserted rather than assumed: this leg is
          # worth running only while the record it provisions still carries the
          # application-kind document the wedge is keyed on. Without this a
          # corpus that stopped serving that document would leave the leg
          # running an ordinary record and certifying nothing.
          manifest="data/cases/$COURT_ID/$DOCKET_ID/record/documents/documents.json"
          if ! jq -e 'any(.[]; .kind == "application")' "$manifest" > /dev/null; then
            echo "::error::the provisioned record carries no application document; this leg no longer presents the shape it exists to present"
            exit 1
          fi

      # The event definition the ledger and the judge's own reads resolve
      # against, projected from the corpus as the cell workflow projects it.
      - name: Materialize the pinned event definition
        if: ${{ matrix.scenario == 'codex-application-repro' }}
        env:
          COURT_ID: ${{ steps.repro.outputs.court }}
          DOCKET_ID: ${{ steps.repro.outputs.docket }}
          EVENT_ID: ${{ steps.repro.outputs.event }}
          AWS_ACCESS_KEY_ID: ${{ steps.corpus.outputs.aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.corpus.outputs.aws-secret-access-key }}
          AWS_SESSION_TOKEN: ${{ steps.corpus.outputs.aws-session-token }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          FEDCOURTS_CORPUS_BACKEND: ranged
        run: uv run fedcourts materialize-event --court "$COURT_ID" --docket "$DOCKET_ID" --event "$EVENT_ID"

      # Blind grading, as run-evaluate stages it: each predictor's committed
      # prediction goes under an opaque alias, and the map that undoes the
      # aliasing lands in the runner temp dir the agent never browses. The
      # candidates are the ones committed in this checkout — the cell input a
      # production judge of this record actually received.
      - name: Stage the blinded candidates
        if: ${{ matrix.scenario == 'codex-application-repro' }}
        env:
          COURT_ID: ${{ steps.repro.outputs.court }}
          DOCKET_ID: ${{ steps.repro.outputs.docket }}
          EVENT_ID: ${{ steps.repro.outputs.event }}
          RUN_ID: ${{ steps.repro.outputs.run_id }}
        run: |
          set -euo pipefail
          uv run fedcourts provision-blinded-predictions \
            --court "$COURT_ID" --docket "$DOCKET_ID" --event "$EVENT_ID" \
            --run-id "$RUN_ID" --map-dir "$RUNNER_TEMP/blinding"

      # The evaluate cell's own tokenless MCP surface: same composite, same
      # warn-only health as the cells (the `mcp-sidecar` scenario is what
      # gates on the sidecar itself), on the evaluator registry's manifest.
      - uses: ./.github/actions/mcp-sidecar
        if: ${{ matrix.scenario == 'codex-application-repro' }}
        with:
          role: evaluator
          actor: ${{ steps.repro.outputs.evaluator }}
          courtlistener-api-token: ${{ secrets.COURTLISTENER_API_TOKEN }}

      # run-evaluate's "Configure agent retrieval (MCP)" codex arm: the tested
      # `mcp-config` command emits codex's client format from the versioned
      # manifest (config/evaluators.yaml `mcp_servers:`) and this step only
      # plumbs stdout to the file the CLI reads. The generated file names a
      # localhost URL and carries no token, and `.codex` is this leg's
      # CODEX_HOME, so the trusted config the permission profile lives in is
      # where codex-action looks for it.
      - name: Configure the repro cell's MCP retrieval
        if: ${{ matrix.scenario == 'codex-application-repro' }}
        env:
          EVALUATOR_ID: ${{ steps.repro.outputs.evaluator }}
        run: |
          set -euo pipefail
          mkdir -p .codex
          uv run fedcourts mcp-config --engine codex \
            --role evaluator --actor "$EVALUATOR_ID" \
            --http-url courtlistener=http://127.0.0.1:8378/mcp > .codex/config.toml

      # The cells' own tripwire, kept because this leg reproduces the cell
      # posture and not merely the cell prompt: the corpus sidecar hands its
      # role credentials out as step outputs, never through $GITHUB_ENV, and
      # the agent step below must inherit none of them.
      - name: Assert the agent env is credential-free
        if: ${{ matrix.scenario == 'codex-application-repro' }}
        run: |
          set -euo pipefail
          if env | grep -E '^AWS_' | grep -qvE '^AWS_(REGION|DEFAULT_REGION)='; then
            echo "::error::AWS credential variables leaked into the job env"
            exit 1
          fi
          echo "agent env is credential-free"

      # The de-blinding surfaces run-evaluate takes out of the judge's tree:
      # the committed predictions/ and evaluations/ trees name every actor one
      # directory above the aliased staging area, so a routine `ls` would
      # de-blind the cell. (data/qp-topics is already gone — the oracle fence
      # at the top of this job deletes it for every leg.) Nothing restores
      # them: this leg opens no PR and its checkout dies with the runner.
      - name: Remove the de-blinding surfaces from the agent's tree
        if: ${{ matrix.scenario == 'codex-application-repro' }}
        run: |
          set -euo pipefail
          uv run fedcourts hide-cell-record --stash-dir "$RUNNER_TEMP/hidden-record"

      # The bracket that makes this leg worth dispatching, and the half of it
      # that carries the verdict is the **completion sentinel**. The defect this
      # leg reproduces is a step that will not conclude *after* its agent has
      # finished: every output written and self-validated, the closing token
      # count printed, and then the step frozen `in_progress` until the job cap
      # cancels the runner — which skips every `if: always()` tail, and whose
      # logs GitHub drops, so the hang erases the evidence it exists to produce.
      # The watchdog waits for those outputs to exist, parse and go quiet, then
      # captures the runner's state and ends the step's tree — so on a reproduced
      # hang it is the **reap** that fires, ~90 s after the agent finishes, and
      # its process forest and socket table are what name whatever is holding a
      # finished step open. A green leg is then the precise certification that
      # completed work is concluded and picked up.
      #
      # So the two markers read differently here, and the difference is the whole
      # verdict. `REAPED` is the defect reproducing and being handled. `FIRED` or
      # `STOOD_DOWN` means the completion set was never satisfied — work still
      # running at the deadline, or a required file the judge never wrote — which
      # is a finding about the cell, not about teardown. The bounds below sit
      # above the 40-50 minute work envelope precisely so that the deadline is
      # never reached by a cell that simply took its time.
      - name: Arm the engine watchdog
        if: ${{ matrix.scenario == 'codex-application-repro' }}
        env:
          CODEX_HOME: ${{ github.workspace }}/.codex
          WATCHDOG_DIR: ${{ runner.temp }}/engine-watchdog
          COURT_ID: ${{ steps.repro.outputs.court }}
          DOCKET_ID: ${{ steps.repro.outputs.docket }}
          EVENT_ID: ${{ steps.repro.outputs.event }}
          EVALUATOR_ID: ${{ steps.repro.outputs.evaluator }}
          RUN_ID: ${{ steps.repro.outputs.run_id }}
          # 3000 s. The work this leg presents runs 40-50 minutes, so a deadline
          # under that would kill a healthy mid-grading cell and never reach the
          # teardown phase where the defect lives. Fifty minutes clears the
          # envelope; the step below is capped at 58, leaving the watchdog's own
          # three graces (30 s each) inside that cap with room; and this leg's
          # job cap is 75.
          #
          # It is longer than the cells' 2400 s deliberately. A cell has a whole
          # round's budget to protect and a level-triggered lane that re-derives
          # what it loses; this leg is one dispatched observation, and cutting it
          # short costs the observation itself.
          WATCHDOG_DEADLINE_S: "3000"
        run: |
          set -euo pipefail
          mkdir -p "$WATCHDOG_DIR"
          # The cell workflows' sentinel arming, verbatim in what it asks for:
          # the required-output list from the same `cell-outputs` command, handed
          # over as env rather than as a file the agent could rewrite.
          sentinel_root=""
          sentinel_paths=""
          if cell_outputs="$(timeout 60 uv run fedcourts cell-outputs --role evaluate \
            --court "$COURT_ID" --docket "$DOCKET_ID" --event "$EVENT_ID" \
            --actor "$EVALUATOR_ID" --run-id "$RUN_ID")"; then
            # `case` rather than `${x#*}`: that expansion returns the whole
            # string when there is no newline, so a root-only stdout would put
            # the output *directory* into the list of required files. Degraded to
            # no sentinel rather than to a failed step, like every other miss
            # here — the kill duty is primary, and a cell that runs on its
            # deadline alone is the behaviour before any of this.
            case "$cell_outputs" in
              *$'\n'*) ;;
              *)
                echo "::warning::cell-outputs named no required files; the watchdog runs on its deadline alone"
                cell_outputs=""
                ;;
            esac
            # Absolute already when the data root is (which a dev or a smoke can
            # set); prefixing unconditionally would yield `$PWD//abs/path` and a
            # sentinel that silently never fires.
            absolute() { case "$1" in /*) printf '%s' "$1" ;; *) printf '%s/%s' "$PWD" "$1" ;; esac; }
            if [ -n "$cell_outputs" ]; then
              sentinel_root="$(absolute "${cell_outputs%%$'\n'*}")"
              while IFS= read -r relative; do
                [ -n "$relative" ] || continue
                sentinel_paths="${sentinel_paths}${sentinel_paths:+$'\n'}$(absolute "$relative")"
              done <<< "${cell_outputs#*$'\n'}"
            fi
          else
            echo "::warning::no completion sentinel for this leg; the watchdog runs on its deadline alone"
          fi
          # The watchdog and its evidence both live outside the workspace: that
          # tree belongs to the agent for the whole of its turn, and bash reads a
          # script file as it executes it.
          cp scripts/engine-watchdog.sh "$RUNNER_TEMP/engine-watchdog.sh"
          WATCHDOG_OUTPUT_DIR="$sentinel_root" \
            WATCHDOG_SENTINEL_PATHS="$sentinel_paths" \
            nohup bash "$RUNNER_TEMP/engine-watchdog.sh" \
            > "$WATCHDOG_DIR/watchdog.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/engine-watchdog.pid"

      # run-evaluate's codex cell step: the same action at the same sha with
      # the same inputs (a test holds every surface that decides how codex
      # runs in lockstep), the same env contract, and the same kickoff prompt
      # — pointed at the pinned record. Nothing here is a probe: the cell is
      # asked to do the work a production judge cell does, because a wedge
      # that only appears under the real task is exactly the one the
      # boot-probe leg cannot see.
      - name: Evaluate the pinned application-lane record with Codex
        id: repro_codex
        if: ${{ matrix.scenario == 'codex-application-repro' }}
        # 58, above the 50-minute watchdog deadline and under the 75 this leg's
        # job is capped at. The work runs 40-50 minutes, so a bound that made
        # this leg fail *fast* would only ever fail it on healthy work; the
        # watchdog is what ends a step the runner cannot, and this stays the
        # backstop for an overrun the runner can.
        timeout-minutes: 58
        uses: openai/codex-action@86365089eb2b84e0a8fb0717b304f8bdcb13b20e # v1.12
        env:
          COURT_ID: ${{ steps.repro.outputs.court }}
          DOCKET_ID: ${{ steps.repro.outputs.docket }}
          EVENT_ID: ${{ steps.repro.outputs.event }}
          EVALUATOR_ID: ${{ steps.repro.outputs.evaluator }}
          RUN_ID: ${{ steps.repro.outputs.run_id }}
          MODEL_ID: ${{ steps.repro.outputs.model }}
          # Corpus queries go through the localhost sidecar, as in the cells:
          # same surface, no cloud credential in this shell.
          FEDCOURTS_CORPUS_BACKEND: service
          # Pin codex's home to the workspace dir the config was written into,
          # as the cell step does; the session rollout the assertion and the
          # distillation below read lands under it.
          CODEX_HOME: ${{ github.workspace }}/.codex
        with:
          allow-bot-users: "fedcourtsai-data[bot]"
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt: |
            Read ${{ steps.repro.outputs.prompt }} and AGENTS.md, then score every predictor's
            prediction for this cell against its outcome.json:

            COURT_ID=${{ steps.repro.outputs.court }}
            DOCKET_ID=${{ steps.repro.outputs.docket }}
            EVENT_ID=${{ steps.repro.outputs.event }}
            EVALUATOR_ID=${{ steps.repro.outputs.evaluator }}
            RUN_ID=${{ steps.repro.outputs.run_id }}
            MODEL_ID=${{ steps.repro.outputs.model }}

            These values are authoritative; the same identifiers are exported as
            environment variables on engines that pass them through, but if
            `$COURT_ID` expands empty in your shell, use the literals above.
            Write only the output files the prompt contract names for your cell.
            Do not commit, push, or open a PR — the workflow handles git. You run
            headless with no interactive input; if you are blocked, record it in
            flags.json and explain it in evaluation.md, then finish — do not wait
            for a reply.
          model: ${{ steps.repro.outputs.model }}
          effort: high
          safety-strategy: drop-sudo
          # The cells' block, unchanged: workspace writes plus subprocess
          # network through the `fedcourts-cell` permission profile in the
          # emitted `$CODEX_HOME/config.toml`, live web search, and a pinned
          # CLI. run-predict's codex step carries the rationale in full; a
          # test holds these values in lockstep across every surface, so this
          # leg cannot reproduce against a posture nothing else runs.
          permission-profile: fedcourts-cell
          codex-version: "0.144.1"
          codex-args: '["-c","web_search=live"]'

      # Stand the watchdog down the moment the engine step is over, however it
      # ended, so it can never fire late and kill something in the tail, and
      # assemble what the upload below publishes.
      #
      # The bundle directory is on the runner's temp path, which the agent has
      # a shell on for the whole of its turn — so nothing here trusts what sits
      # there. The pid is signalled only if it is a number naming this script;
      # the publishable copy takes **regular files only**, because
      # `upload-artifact` follows symlinks and publishing the directory
      # wholesale would let a planted link put an unrelated readable file in a
      # public artifact; and the marker the summary quotes is read from that
      # sanitized copy, truncated, because a summary is rendered markdown. A
      # planted marker can still make the leg *say* a deadline passed, which is
      # a report, not a grant — the step's own exit status is what the leg's
      # verdict rests on.
      - name: Disarm the engine watchdog
        id: repro_disarm
        if: ${{ always() && matrix.scenario == 'codex-application-repro' }}
        run: |
          set -euo pipefail
          pid_file="$RUNNER_TEMP/engine-watchdog.pid"
          if [ -f "$pid_file" ]; then
            pid=$(cat "$pid_file")
            if [[ "$pid" =~ ^[0-9]+$ ]] && grep -qa engine-watchdog.sh "/proc/$pid/cmdline" 2>/dev/null; then
              kill "$pid" 2>/dev/null || true
            fi
            rm -f "$pid_file"
          fi
          # Read from the runner-temp bundle, before the sanitized copy below:
          # this is what the assertion step reports the step half of its verdict
          # from, and the agent had a shell on the workspace, not on this path.
          reaped=false
          if [ -f "$RUNNER_TEMP/engine-watchdog/REAPED" ]; then
            reaped=true
          fi
          echo "reaped=$reaped" >> "$GITHUB_OUTPUT"
          bundle="$RUNNER_TEMP/engine-watchdog-bundle"
          rm -rf "$bundle"
          mkdir -p "$bundle"
          if [ -d "$RUNNER_TEMP/engine-watchdog" ]; then
            find "$RUNNER_TEMP/engine-watchdog" -maxdepth 1 -type f \
              -exec cp -p {} "$bundle/" \;
          fi
          for marker in REAPED FIRED STOOD_DOWN; do
            file="$bundle/$marker"
            [ -f "$file" ] || continue
            case "$marker" in
              REAPED) note="the cell's outputs were complete and quiescent and the step would not conclude; the watchdog ended it" ;;
              FIRED) note="the engine did not finish inside the bound and was killed at the deadline" ;;
              *) note="the deadline passed with no engine process matched — check the watchdog still names the action's invocation" ;;
            esac
            echo "::warning::codex-application-repro: ${note}"
            {
              echo ""
              echo "## engine watchdog — ${note}"
              echo ""
              echo '```'
              head -c 500 "$file"
              echo
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          done

      # The verdict, stated rather than implied, and stated as **two halves**.
      # The defect is a step that will not conclude after its agent has already
      # finished, so "did the work get done" and "did the step end" are separate
      # questions with separate answers — and a future regression has to be
      # legible as which of the two broke. Reported one line each:
      #
      #   outputs — how many of the files a finished cell owes are on disk,
      #             counted against the same `cell-outputs` list the watchdog's
      #             sentinel waited for, so the leg and the reaper cannot
      #             disagree about what "complete" means;
      #   step    — whether it concluded on its own, was reaped, was killed at
      #             the deadline, or never concluded at all.
      #
      # A mis-spelled `if:` above would SKIP every step and leave the leg green
      # having invoked nothing, which is the vacuous pass this scenario exists to
      # replace — so a run that got this far must show the evidence of a session,
      # and an absent one fails here. Nothing reads what the model said, and a
      # cell that finishes without an evaluation is reported rather than failed
      # (a blocked cell is not a wedge, and this leg's subject is the wedge).
      # `!cancelled()` rather than `always()`: a failed engine step is exactly the
      # case whose two halves matter most, so an implicit `success()` would skip
      # the report where it is worth the most — but a cancelled leg has nothing to
      # read and a job cancelled mid-setup would only add a misleading second
      # error to an already-red run.
      - name: Assert the repro cell ran, and report both halves of its outcome
        if: ${{ !cancelled() && matrix.scenario == 'codex-application-repro' }}
        env:
          CODEX_HOME: ${{ github.workspace }}/.codex
          COURT_ID: ${{ steps.repro.outputs.court }}
          DOCKET_ID: ${{ steps.repro.outputs.docket }}
          EVENT_ID: ${{ steps.repro.outputs.event }}
          EVALUATOR_ID: ${{ steps.repro.outputs.evaluator }}
          RUN_ID: ${{ steps.repro.outputs.run_id }}
          ENGINE_OUTCOME: ${{ steps.repro_codex.outcome }}
          REAPED: ${{ steps.repro_disarm.outputs.reaped }}
        run: |
          set -euo pipefail
          # A skipped engine step means the leg died before the cell — a setup
          # failure has already reddened the run, and "the cell never started" on
          # top of it would name the wrong cause.
          if [ "$ENGINE_OUTCOME" = "skipped" ]; then
            echo "codex-application-repro: the cell step never ran; nothing to report"
            exit 0
          fi
          if [ -z "$(find "$CODEX_HOME/sessions" -type f -name '*.jsonl' -print -quit 2>/dev/null)" ]; then
            echo "::error::codex left no session rollout — the cell never started"
            exit 1
          fi
          # Half one: the work. Counted over the required-output list rather than
          # over `evaluation.json` alone, because a judge that wrote its three
          # gradings and stopped short of its own retrieval and tooling files is
          # a *different* finding from one that graded nothing — and it is the
          # difference the sentinel keys on.
          owed=0
          present=0
          if cell_outputs="$(uv run fedcourts cell-outputs --role evaluate \
            --court "$COURT_ID" --docket "$DOCKET_ID" --event "$EVENT_ID" \
            --actor "$EVALUATOR_ID" --run-id "$RUN_ID")" \
            && case "$cell_outputs" in *$'\n'*) true ;; *) false ;; esac; then
            while IFS= read -r relative; do
              [ -n "$relative" ] || continue
              owed=$((owed + 1))
              # Spelled as an `if` and not `[ … ] && …`: under `set -e` a list
              # whose first half fails ends the step, so the *missing* file — the
              # case this count exists to report — would redden the leg instead
              # of being counted.
              if [ -s "$relative" ]; then
                present=$((present + 1))
              fi
            done <<< "${cell_outputs#*$'\n'}"
          fi
          if [ "$owed" -eq 0 ]; then
            outputs="unknown — the required-output list could not be resolved"
          elif [ "$present" -eq "$owed" ]; then
            outputs="complete — all ${owed} required output file(s) present"
          elif [ "$present" -eq 0 ]; then
            outputs="none — the cell produced nothing (blocked, not wedged)"
          else
            outputs="partial — ${present} of ${owed} required output file(s) present"
          fi
          # Half two: the step. A reap is the defect reproducing *and* being
          # handled, which is exactly what this leg certifies once the fix is in.
          if [ "${REAPED:-false}" = "true" ]; then
            step="hung after completion and was reaped by the watchdog"
          elif [ "$ENGINE_OUTCOME" = "success" ]; then
            step="concluded on its own"
          else
            step="did not conclude cleanly (outcome: ${ENGINE_OUTCOME:-unknown}) — read the watchdog bundle"
          fi
          {
            echo "codex-application-repro outputs: ${outputs}"
            echo "codex-application-repro step: ${step}"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "outputs: ${outputs}"
          echo "step: ${step}"

      # What the dispatch is worth beyond a green tick: the codex rollout's
      # item shapes, distilled by the tested `codex-item-shapes` command and
      # uploaded. The `record-retrieval` parser keys on those shapes, and an
      # unrecognized one costs a cell's whole retrieval log while reading
      # exactly like a cell that called nothing — so the transcript is the
      # only thing that can tell a behavioural zero from a capture gap, and
      # the distillation is what a fixture can be pinned to.
      #
      # Shape-only, and it must stay that way: a rollout carries retrieved
      # documents and tool arguments verbatim. The command emits item types,
      # key names, and JSON type names — never a value — and the rollout
      # itself dies with the runner. The output goes to a file, never to the
      # rendered step summary, so nothing transcript-derived reaches live
      # Markdown.
      #
      # It also goes to `RUNNER_TEMP`, not the workspace, and that placement is
      # the security control rather than tidiness: the cell has just had write
      # access to the whole workspace, so a path there can be pre-planted — a
      # file, a directory, a symlink out of the tree — and the distill step is
      # `continue-on-error`, so a failed write is swallowed and the upload
      # publishes whatever sits at the path, unscanned, from a public repo.
      # `RUNNER_TEMP` is outside the workspace-write sandbox, which makes the
      # uploaded artifact the tested command's own output by construction.
      #
      # Observation, never a gate: `always()` so a failed cell still yields
      # its shapes (a blocked cell's transcript is exactly the interesting
      # one), `continue-on-error` and a tolerant command so the smoke's
      # verdict stays the cell's.
      #
      # The application-repro leg takes both steps for the same reason and one
      # more: a reproduced wedge leaves a transcript that stops mid-turn, and
      # the shapes are the only account of it that can leave the runner.
      - name: Distill the codex transcript's item shapes
        if: ${{ always() && ((matrix.scenario == 'engine-smoke' && matrix.engine == 'codex') || matrix.scenario == 'codex-application-repro') }}
        continue-on-error: true
        env:
          CODEX_HOME: ${{ github.workspace }}/.codex
        run: |
          set -euo pipefail
          uv run fedcourts codex-item-shapes \
            --sessions-dir "$CODEX_HOME/sessions" \
            --out "$RUNNER_TEMP/codex-item-shapes.json"

      - name: Upload the codex transcript's item shapes
        if: ${{ always() && ((matrix.scenario == 'engine-smoke' && matrix.engine == 'codex') || matrix.scenario == 'codex-application-repro') }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codex-item-shapes
          # The repro leg's watchdog bundle rides the same artifact — the
          # process forest and socket table (taken after the cell completed,
          # which is what names whatever holds a finished step open), the
          # codex-home listing and the watchdog's own log, all shapes and
          # metadata, never content. The
          # sanitized copy the disarm step assembles, never the runner-temp
          # directory the agent could plant a symlink in. Absent on every
          # other leg, which is what `warn` below is for.
          path: |
            ${{ runner.temp }}/codex-item-shapes.json
            ${{ runner.temp }}/engine-watchdog-bundle
          # Warn, not error: a cell that died before writing a transcript
          # leaves nothing to upload, and this step must not be the thing
          # that reddens the smoke.
          if-no-files-found: warn
          # Long enough for a maintainer to read the run and pin a fixture
          # from it, short of the default 90: the file is a diagnostic, not a
          # record.
          retention-days: 14
          # `gh run rerun --failed` is the advertised recovery for a red run
          # and artifacts persist across attempts; without overwrite the
          # rerun 409s here.
          overwrite: true

      # --- engine-actions-smoke: each engine's own invocation block ----------

      # The second token-spending scenario, and the one the engine smoke above
      # cannot stand in for. It drives each engine through the *invocation
      # block the production cells use* — claude-code-action and codex-action
      # at their pinned shas with the cells' `with:` inputs, and gemini through
      # the CLI call run-predict makes (that engine has no pinned action: the
      # upstream one `uses:` unpinned actions the org's policy rejects) — on a
      # prompt that asks for one word. What it certifies is **acceptance**:
      # that these inputs, at this sha, are still taken by the invocation
      # surface and reach a completed turn. It says nothing about output
      # quality, and it is deliberately not what the engine smoke says: that
      # leg drives the bare CLI through the tested runner seam, so a refusal
      # raised in an action's own validation layer — before any model call —
      # passes it unseen and surfaces first in a paid production cell. A
      # static comparison of the two surfaces cannot see it either; only
      # executing the action can.
      #
      # The leg's worth is therefore exactly the fidelity of the input blocks
      # below. Two deviations are deliberate and marked in place (the kickoff
      # prompt, and claude's GitHub token); everything else is the cell step's
      # own value, and a test holds the codex block in lockstep with both cell
      # workflows' codex steps so a bump to one cannot leave this leg probing
      # an invocation nothing runs.
      - name: Resolve the engine's production cell identity
        id: cell
        if: ${{ matrix.scenario == 'engine-actions-smoke' }}
        env:
          ENGINE: ${{ matrix.engine }}
        run: |
          set -euo pipefail
          case "$ENGINE" in
            claude-code) predictor=claude-baseline ;;
            codex) predictor=codex-baseline ;;
            gemini) predictor=gemini-baseline ;;
            # Fail loudly rather than leaving `predictor` unset for `set -u` to
            # trip on further down: this is the leg's first step, so it is
            # where an engine the leg has no invocation block for should stop.
            *)
              echo "::error::no cell identity is defined for engine '${ENGINE}'"
              exit 1
              ;;
          esac
          # The model a cell of this engine actually runs. The baseline
          # predictors pin no override (a test holds them to that), so the
          # engine default in fedcourtsai.pricing is what the predict matrix
          # resolves into the cell — read from the package rather than
          # restated here, where a default bump would leave the probe asking
          # about a model production stopped using.
          model=$(uv run python -c \
            'import sys; from fedcourtsai.pricing import DEFAULT_MODELS; print(DEFAULT_MODELS[sys.argv[1]])' \
            "$ENGINE")
          # Shape-screen before the append: both values become step outputs
          # that ride straight into an action's `with:` block.
          case "$model" in
            "" | *[!a-zA-Z0-9.-]*)
              echo "::error::the resolved model id is not a bare identifier"
              exit 1
              ;;
          esac
          printf 'predictor=%s\nmodel=%s\n' "$predictor" "$model" >> "$GITHUB_OUTPUT"

      # The same composite the cells launch, so the client config each
      # invocation names below points at a server that answers: `--mcp-config
      # mcp-servers.json` is part of claude's production args, and codex reads
      # its config.toml at startup. Health stays warn-only, as in the cells —
      # the `mcp-sidecar` scenario is what gates on the sidecar itself, and a
      # degraded upstream must not redden a leg whose subject is the
      # invocation.
      - uses: ./.github/actions/mcp-sidecar
        if: ${{ matrix.scenario == 'engine-actions-smoke' }}
        with:
          role: predictor
          actor: ${{ steps.cell.outputs.predictor }}
          courtlistener-api-token: ${{ secrets.COURTLISTENER_API_TOKEN }}

      # run-predict's "Configure agent retrieval (MCP)" step, engine for
      # engine: the tested `mcp-config` command emits each client's format
      # from the versioned manifest and this step only plumbs stdout to the
      # file that engine reads. Each generated file names a localhost URL and
      # carries no token.
      - name: Configure the invocation's MCP retrieval
        if: ${{ matrix.scenario == 'engine-actions-smoke' }}
        env:
          ENGINE: ${{ matrix.engine }}
          PREDICTOR_ID: ${{ steps.cell.outputs.predictor }}
        run: |
          set -euo pipefail
          case "$ENGINE" in
            claude-code)
              uv run fedcourts mcp-config --engine claude-code \
                --role predictor --actor "$PREDICTOR_ID" \
                --http-url courtlistener=http://127.0.0.1:8378/mcp > mcp-servers.json
              ;;
            codex)
              mkdir -p .codex
              uv run fedcourts mcp-config --engine codex \
                --role predictor --actor "$PREDICTOR_ID" \
                --http-url courtlistener=http://127.0.0.1:8378/mcp > .codex/config.toml
              ;;
            gemini)
              # Merged over the settings file the allowlist step above wrote,
              # as the cell step does in one pass.
              uv run fedcourts mcp-config --engine gemini \
                --role predictor --actor "$PREDICTOR_ID" \
                --base-settings .gemini/settings.json \
                --http-url courtlistener=http://127.0.0.1:8378/mcp > .gemini/settings.json.new
              mv .gemini/settings.json.new .gemini/settings.json
              ;;
          esac

      - name: Smoke the Claude Code cell invocation
        id: actions_smoke_claude
        if: ${{ matrix.scenario == 'engine-actions-smoke' && matrix.engine == 'claude-code' }}
        # Far below the cell step's 50: one word is one turn, and a bound that
        # tight is what keeps a hung invocation from eating the job budget.
        timeout-minutes: 10
        uses: anthropics/claude-code-action@a874e9ecd7bb36efdad65429c6b35815f5a08f10 # v1.0.210
        with:
          allowed_bots: "fedcourtsai-data[bot]"
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # DEVIATION, in the safe direction. The cells hand the action a
          # freshly minted App token (issues/PR write, for the agent's own
          # comment on the trigger issue); a probe has no issue to comment on,
          # and minting a live write credential for one would be a posture
          # change. The job's own token instead — capped at `contents: read`
          # by the permissions block above. Not omitted: with no token the
          # action falls back to an OIDC exchange that mints an installation
          # token defaulting to contents/issues/pull-requests *write*.
          github_token: ${{ github.token }}
          settings: |
            {
              "env": {
                "ENABLE_PROMPT_CACHING_1H": "1"
              }
            }
          # DEVIATION, and the point of the leg: the cells' kickoff prompt
          # names a case and asks for a prediction. This asks for one word, so
          # what the run costs is a boot probe and what it proves is that the
          # invocation was accepted.
          prompt: |
            Reply with the single word: ok

            Use no tools, read no files, and write no files. This is a boot
            probe of the invocation path, not a task.
          claude_args: |
            --model ${{ steps.cell.outputs.model }}
            --max-turns 120
            --permission-mode bypassPermissions
            --mcp-config mcp-servers.json

      - name: Smoke the Codex cell invocation
        id: actions_smoke_codex
        if: ${{ matrix.scenario == 'engine-actions-smoke' && matrix.engine == 'codex' }}
        timeout-minutes: 10
        uses: openai/codex-action@86365089eb2b84e0a8fb0717b304f8bdcb13b20e # v1.12
        env:
          # Pin codex's home to the workspace dir the config was written into,
          # as the cell step does; the session rollout the assertion below
          # reads lands under it.
          CODEX_HOME: ${{ github.workspace }}/.codex
        with:
          allow-bot-users: "fedcourtsai-data[bot]"
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          # DEVIATION, as on the claude leg above: a boot probe, not a cell.
          prompt: |
            Reply with the single word: ok

            Use no tools, read no files, and write no files. This is a boot
            probe of the invocation path, not a task.
          model: ${{ steps.cell.outputs.model }}
          effort: high
          safety-strategy: drop-sudo
          # The cells' own block: the permission profile named here is declared
          # in the `$CODEX_HOME/config.toml` the MCP step above wrote, so this
          # leg exercises the profile-selection path the cells depend on — the
          # layer the bare-CLI engine smoke never traverses.
          permission-profile: fedcourts-cell
          codex-version: "0.144.1"
          codex-args: '["-c","web_search=live"]'

      - name: Smoke the Gemini cell invocation
        id: actions_smoke_gemini
        if: ${{ matrix.scenario == 'engine-actions-smoke' && matrix.engine == 'gemini' }}
        timeout-minutes: 10
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Headless runs need the workspace trusted explicitly (the CLI exits
          # 55 otherwise), exactly as the cell step declares it.
          GEMINI_CLI_TRUST_WORKSPACE: "true"
          MODEL_ID: ${{ steps.cell.outputs.model }}
          # DEVIATION, as on the two legs above: a boot probe, not a cell.
          PROMPT: |
            Reply with the single word: ok

            Use no tools, read no files, and write no files. This is a boot
            probe of the invocation path, not a task.
        run: |
          set -euo pipefail
          # The result goes to RUNNER_TEMP rather than the workspace: the CLI
          # has just run `--yolo` over the checkout, so a workspace path can
          # be pre-planted, and the assertion below must read this step's own
          # output. Never rendered into the step summary — it is model output.
          gemini --yolo --model "$MODEL_ID" --prompt "$PROMPT" --output-format json \
            > "$RUNNER_TEMP/gemini-actions-smoke.json"

      # The leg's verdict, stated rather than implied. An invocation refused in
      # its validation layer fails its own step and reddens the leg on its own
      # — but a mis-spelled `if:` above would skip every step and leave the leg
      # green having invoked nothing, which is precisely the vacuous pass this
      # scenario exists to replace. So each engine must leave the evidence of a
      # completed turn that the cells' own capture steps read — claude's
      # execution file, codex's session rollout, gemini's JSON result — and an
      # absent one fails here whatever the reason. Evidence of completion only:
      # nothing reads what the model said.
      - name: Assert the invocation was accepted and completed
        if: ${{ matrix.scenario == 'engine-actions-smoke' }}
        env:
          ENGINE: ${{ matrix.engine }}
          CLAUDE_EXECUTION_FILE: ${{ steps.actions_smoke_claude.outputs.execution_file }}
          CODEX_HOME: ${{ github.workspace }}/.codex
          GEMINI_RESULT: ${{ runner.temp }}/gemini-actions-smoke.json
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          case "$ENGINE" in
            claude-code)
              [ -n "$CLAUDE_EXECUTION_FILE" ] \
                || fail "the claude-code action reported no execution file — the step did not run"
              [ -s "$CLAUDE_EXECUTION_FILE" ] \
                || fail "the claude-code execution file is empty — no turn completed"
              ;;
            codex)
              [ -d "$CODEX_HOME/sessions" ] \
                || fail "codex wrote no sessions directory — the step did not run"
              # A rollout file appears when the session starts, so this
              # evidences a session, not a finished turn — the action's own
              # exit status is what carries the rest.
              [ -n "$(find "$CODEX_HOME/sessions" -type f -name '*.jsonl' -print -quit)" ] \
                || fail "codex left no session rollout — the session never started"
              ;;
            gemini)
              [ -s "$GEMINI_RESULT" ] \
                || fail "the gemini CLI wrote no result — the step did not run"
              jq -e 'type == "object"' "$GEMINI_RESULT" > /dev/null \
                || fail "the gemini CLI result is not the documented JSON object"
              ;;
            # An engine with no completion evidence defined for it is the
            # vacuous pass in another spelling: without this arm the case falls
            # through and the step prints the success line having checked
            # nothing. The resolve step above would die first today, but that
            # is an accident of ordering, not this assertion's own contract.
            *)
              fail "unknown engine '${ENGINE}': no completion evidence is defined for it"
              ;;
          esac
          echo "engine-actions-smoke: the ${ENGINE} cell invocation was accepted and completed" \
            >> "$GITHUB_STEP_SUMMARY"

      # Both sidecars' logs carry startup lines (the corpus one's
      # `health-check corpus read:` transfer evidence among them) and
      # per-request records (server noise, no secrets — GitHub masks the
      # credentials regardless): surface them in the job log, as the cell
      # workflows do over the same two files, so a cold-read stall or a
      # mid-scenario sidecar death is diagnosable from the failed run instead
      # of a rerun. The MCP log is the codex leg's second witness: requests in
      # this log against a distillation carrying `custom_tool_call` items and
      # no `mcp_tool_call` / `mcp_call` ones is code mode working as designed —
      # the capture lifts the manifest calls out of the freeform call's source,
      # not from an MCP-shaped item, which code mode never emits. (The
      # distillation replaces every value with its type name, so the tool name
      # itself is not in it; the payload type is.) No requests at all is the
      # engine never reaching the sidecar — a decline, or a sidecar that never
      # came up, since health is warn-only here. Either way it is a distinction
      # the shapes artifact alone cannot draw. Head and tail both, because the
      # evidence lines are at the top and an engine-smoke's query records
      # scroll them off a tail alone.
      - name: Show the sidecar logs
        if: ${{ always() && (matrix.scenario == 'corpus-service' || matrix.scenario == 'engine-smoke' || matrix.scenario == 'engine-actions-smoke' || matrix.scenario == 'mcp-sidecar' || matrix.scenario == 'codex-application-repro') }}
        continue-on-error: true
        run: |
          set -euo pipefail
          # Indent every replayed line: a line starting with ::<command>::
          # would otherwise be parsed as a workflow command by the runner.
          for log in corpus-sidecar.log cl-mcp-sidecar.log; do
            if [ ! -f "$log" ]; then
              continue
            fi
            echo "--- $log"
            lines=$(wc -l < "$log")
            if [ "$lines" -le 120 ]; then
              sed 's/^/  /' "$log"
            else
              head -n 20 "$log" | sed 's/^/  /'
              echo "  [... $((lines - 120)) line(s) elided ...]"
              tail -n 100 "$log" | sed 's/^/  /'
            fi
          done

      # --- mcp-sidecar: the tokenless CourtListener MCP surface --------------

      # The same composite the cell workflows launch, deliberately token-free:
      # the probe proves the handshake and the tool listing — everything an
      # engine's client needs before its first CourtListener call — without
      # spending one, so this scenario needs no secret and no AWS role at
      # all. Strict health, unlike the cells: there an unhealthy sidecar
      # degrades the cell to corpus tooling, but here the sidecar IS the
      # thing under test. The actor names an enabled predictor whose manifest
      # includes the CourtListener server (the sidecar scopes tool manifests
      # per actor).
      - uses: ./.github/actions/mcp-sidecar
        if: ${{ matrix.scenario == 'mcp-sidecar' }}
        with:
          role: predictor
          actor: claude-baseline
          strict-health: "true"

      # The tested MCP client check: initialize + tools/list through the
      # streamable-HTTP surface the generated cell configs point at, failing
      # the job unless the sidecar completes the handshake and hands out a
      # non-empty tool list.
      - name: Run the MCP client check against the sidecar
        if: ${{ matrix.scenario == 'mcp-sidecar' }}
        run: |
          set -euo pipefail
          uv run fedcourts mcp-integration-check --summary-out "$GITHUB_STEP_SUMMARY"

  # --- collect: the run-PR writer over synthetic cells, environment-free ---

  # Exercises the collect-run composite — the single writer for a predict/
  # evaluate run's agent output — against synthetic cell artifacts this job
  # uploads to its own run, so collect's durability contract is provable
  # without spending a live matrix: a forced download failure costs one cell
  # and not the run, the queued-cell census names the gaps and withholds the
  # trigger-issue close, and a rerun updates in place instead of duplicating.
  #
  # Deliberately no deployment environment and no AWS role: the job reads no
  # corpus and holds no secret. The composite is handed a placeholder in
  # place of the App token, a gh shim on PATH stubs every PR surface (and
  # forces the one transfer failure), and a git URL rewrite keyed on that
  # placeholder diverts the branch push to a runner-local scratch remote — so
  # nothing can write to the real repo, and a push that somehow escaped the
  # rewrite would authenticate with a non-credential and be refused. The only
  # real token in the job is the ambient read-only one the composite's
  # downloader uses to list and fetch this run's own artifacts.
  collect-scenario:
    # Fires on its own dispatch and inside either whole-suite run: the collect
    # composite is the single writer for every predict/evaluate run's output,
    # so the promotion freshness suite must include it — and because this job
    # is a separate job in the same run, a whole-suite title is evidence only
    # if this job succeeded too (a run concludes success only when every job
    # did). Token-free, so `all-offline` keeps it. Three affirmative
    # equalities, which is also what keeps the canary out: an empty `inputs`
    # context satisfies none of them, so the schedule runs the engine legs and
    # nothing else without needing a clause of its own.
    if: ${{ inputs.scenario == 'collect' || inputs.scenario == 'all' || inputs.scenario == 'all-offline' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read # checkout; the run-PR push goes to the scratch remote, never here
      actions: read # list and fetch this run's own synthetic cell artifacts
    env:
      # One synthetic predict fan-out, shared by the seeding, the artifact
      # names, and the assertions. The run and event ids are fixed literals
      # because the fixture corpus is deterministic; the seed step fails
      # loudly if the fixture's ca9/103 case stops producing this event.
      CELL_RUN_ID: 20260401T000000Z
      CELL_EVENT: evt-appeal-disposition
      # Stands in for the App token input. Not a credential: its only job is
      # to key the push-diversion rewrite below.
      PLACEHOLDER_TOKEN: collect-scenario-placeholder-token
      # Stands in for the CourtListener token input. Long enough to arm the
      # secret scan's literal-containment detector (short known-secret values
      # are skipped), so the scan proves the run's added files do NOT contain
      # the "credential" instead of passing vacuously with no needle at all.
      SCAN_NEEDLE: collect-scenario-synthetic-scan-needle
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history: the composite branches the run PR from a freshly
          # fetched origin/main and pushes that history to the scratch
          # remote, which a shallow clone cannot serve.
          fetch-depth: 0

      - uses: ./.github/actions/setup-python-env

      # Three production-shaped cells over the deterministic fixture corpus —
      # two ready (claude, codex) and one salvage (gemini: valid output, agent
      # stopped early) — each in its own status.json + data/ layout, exactly
      # what a cell workflow uploads. The cell workflows stamp every produced
      # prediction.json with its process version post-agent, so a cell
      # reaching collect is a *stamped* cell; the fixtures are stamped the
      # same way, keeping collect's validate gate on production-shaped input
      # (collect itself is stamp-agnostic).
      - name: Seed the synthetic cells
        id: seed
        run: |
          set -euo pipefail
          fixtures="$RUNNER_TEMP/collect-fixtures"
          export FEDCOURTS_CORPUS_ROOT="$fixtures/corpus"
          uv run fedcourts make-fixture-corpus --out "$fixtures/corpus/corpus.db"

          for actor in claude-baseline codex-baseline gemini-baseline; do
            cell="$fixtures/cells/predict-${actor}-ca9-103-${CELL_EVENT}"
            export FEDCOURTS_DATA_ROOT="${cell}/data"
            uv run fedcourts local-cascade --court ca9 --docket 103 \
              --engine stub --predictor "$actor" --run-id "$CELL_RUN_ID" \
              --require-predictions
            uv run fedcourts stamp-cell --court ca9 --docket 103 \
              --event "$CELL_EVENT" --run-id "$CELL_RUN_ID" \
              --role predictor --actor "$actor"
            # Fixture-drift guard: stamp-cell no-ops on a missing artifact, so
            # assert the stamped prediction really exists at the event id the
            # artifact names and assertions are keyed on.
            test -f "${cell}/data/cases/ca9/103/events/${CELL_EVENT}/predictions/${actor}/${CELL_RUN_ID}/prediction.json"
            agent_ok=true
            if [ "$actor" = gemini-baseline ]; then agent_ok=false; fi
            jq -n --arg actor "$actor" --arg event "$CELL_EVENT" \
              --arg run_id "$CELL_RUN_ID" --argjson agent_ok "$agent_ok" \
              '{court:"ca9",docket:103,event_id:$event,actor:$actor,run_id:$run_id,produced:true,validated:true,agent_ok:$agent_ok}' \
              > "${cell}/status.json"
          done

          # The lost cell: it must exist on the run (the downloader lists it)
          # but its download is forced to fail, so its content is never read —
          # a placeholder file is enough, and keeps the loss distinguishable
          # from the never-uploaded cell below.
          lost="$fixtures/cells/predict-claude-baseline-ca9-101-${CELL_EVENT}"
          mkdir -p "$lost"
          echo "download is forced to fail; this content is never read" \
            > "$lost/placeholder.txt"

          # The plan matrix — what the run was *supposed* to produce: the
          # three delivered cells, the lost cell, and one queued cell (codex
          # on ca9/101) that neither uploads nor is listed as lost, which the
          # census must therefore call never-uploaded.
          matrix=$(jq -nc --arg event "$CELL_EVENT" --arg run_id "$CELL_RUN_ID" \
            '{include:[
              {predictor_id:"claude-baseline",court:"ca9",docket:103,event_id:$event,run_id:$run_id},
              {predictor_id:"codex-baseline",court:"ca9",docket:103,event_id:$event,run_id:$run_id},
              {predictor_id:"gemini-baseline",court:"ca9",docket:103,event_id:$event,run_id:$run_id},
              {predictor_id:"claude-baseline",court:"ca9",docket:101,event_id:$event,run_id:$run_id},
              {predictor_id:"codex-baseline",court:"ca9",docket:101,event_id:$event,run_id:$run_id}
            ]}')
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"

      # One artifact per cell, named exactly as the cell workflows name theirs
      # (`<role>-<actor>-<court>-<docket>-<event>`): the composite keys its
      # download on the `predict-` prefix, and the census rebuilds these names
      # from matrix identities to classify a lost artifact.
      - name: Upload the ready claude cell
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: predict-claude-baseline-ca9-103-${{ env.CELL_EVENT }}
          path: ${{ runner.temp }}/collect-fixtures/cells/predict-claude-baseline-ca9-103-${{ env.CELL_EVENT }}
          if-no-files-found: error
          retention-days: 1
          # `gh run rerun --failed` is the advertised recovery for a red
          # `all` run and artifacts persist across attempts; without
          # overwrite the rerun 409s at this upload before reaching the
          # assertions. Scaffolding, not the contract under test.
          overwrite: true

      - name: Upload the ready codex cell
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: predict-codex-baseline-ca9-103-${{ env.CELL_EVENT }}
          path: ${{ runner.temp }}/collect-fixtures/cells/predict-codex-baseline-ca9-103-${{ env.CELL_EVENT }}
          if-no-files-found: error
          retention-days: 1
          # `gh run rerun --failed` is the advertised recovery for a red
          # `all` run and artifacts persist across attempts; without
          # overwrite the rerun 409s at this upload before reaching the
          # assertions. Scaffolding, not the contract under test.
          overwrite: true

      - name: Upload the salvage gemini cell
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: predict-gemini-baseline-ca9-103-${{ env.CELL_EVENT }}
          path: ${{ runner.temp }}/collect-fixtures/cells/predict-gemini-baseline-ca9-103-${{ env.CELL_EVENT }}
          if-no-files-found: error
          retention-days: 1
          # `gh run rerun --failed` is the advertised recovery for a red
          # `all` run and artifacts persist across attempts; without
          # overwrite the rerun 409s at this upload before reaching the
          # assertions. Scaffolding, not the contract under test.
          overwrite: true

      - name: Upload the cell whose download will be forced to fail
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: predict-claude-baseline-ca9-101-${{ env.CELL_EVENT }}
          path: ${{ runner.temp }}/collect-fixtures/cells/predict-claude-baseline-ca9-101-${{ env.CELL_EVENT }}
          if-no-files-found: error
          retention-days: 1
          # `gh run rerun --failed` is the advertised recovery for a red
          # `all` run and artifacts persist across attempts; without
          # overwrite the rerun 409s at this upload before reaching the
          # assertions. Scaffolding, not the contract under test.
          overwrite: true

      # Every write surface the composite touches, stubbed or diverted before
      # it runs. The gh shim passes `api` and `run` through to the real gh
      # (read-only, ambient token) except the one forced transfer failure,
      # no-ops `auth`, answers the PR queries from its own ledger, and fails
      # loudly on anything unstubbed — so a composite change that grows a new
      # write surface breaks this scenario instead of reaching the network.
      # The URL rewrite sends the composite's push — addressed to github.com
      # with the placeholder token — into a bare scratch repo on the runner.
      - name: Divert every write surface to runner-local stubs
        run: |
          set -euo pipefail
          shim="$RUNNER_TEMP/collect-shim"
          mkdir -p "$shim"
          printf '%s\n' "predict-claude-baseline-ca9-101-${CELL_EVENT}" > "$shim/lost-artifact"
          : > "$shim/log"
          : > "$shim/prs.tsv"
          command -v gh > "$shim/real-gh"
          cat > "$shim/gh" <<'SHIM'
          #!/usr/bin/env bash
          set -euo pipefail
          here="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          printf 'gh %s\n' "$*" >> "$here/log"
          real="$(cat "$here/real-gh")"
          arg() { # print the value following the given flag, if any
            local flag="$1"; shift
            while [ "$#" -gt 0 ]; do
              if [ "$1" = "$flag" ] && [ "$#" -gt 1 ]; then printf '%s' "$2"; return; fi
              shift
            done
          }
          case "${1-}" in
            api) exec "$real" "$@" ;; # passthrough; the job's permissions block, not this shim, is what caps the token at read
            run)
              if [ "${2-}" = download ] && [ "$(arg --name "$@")" = "$(cat "$here/lost-artifact")" ]; then
                echo "shim: forcing a transfer failure for $(arg --name "$@")" >&2
                exit 1
              fi
              exec "$real" "$@" ;; # passthrough; capped at read by the job's permissions block
            auth) exit 0 ;; # leave git credential-less; the push is diverted anyway
            pr)
              case "${2-}" in
                list)
                  if [ "$(arg --state "$@")" = all ]; then echo 0; exit 0; fi
                  awk -v b="$(arg --head "$@")" '$1 == b { print $2 }' "$here/prs.tsv"
                  exit 0 ;;
                create)
                  head_branch="$(arg --head "$@")"
                  url="https://prs.invalid/${head_branch}"
                  printf '%s\t%s\n' "$head_branch" "$url" >> "$here/prs.tsv"
                  echo "$url"; exit 0 ;;
                edit|ready|merge) exit 0 ;;
              esac
              echo "gh shim: unstubbed pr subcommand: $*" >&2; exit 64 ;;
          esac
          echo "gh shim: unstubbed command: $*" >&2
          exit 64
          SHIM
          chmod +x "$shim/gh"
          echo "$shim" >> "$GITHUB_PATH"

          scratch="$RUNNER_TEMP/collect-scratch.git"
          git init --bare -q "$scratch"
          git config --global \
            "url.file://${scratch}.insteadOf" \
            "https://x-access-token:${PLACEHOLDER_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # The commit identity the caller workflows normally configure from
          # the App token; commits only ever reach the scratch remote.
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # First pass: the shim forces the claude ca9/101 artifact's download to
      # fail, so this collects 3 of the 4 listed artifacts and must degrade
      # per-cell, not per-run.
      - name: Collect the synthetic run
        uses: ./.github/actions/collect-run
        with:
          role: predict
          token: ${{ env.PLACEHOLDER_TOKEN }}
          repo: ${{ github.repository }}
          # A synthetic trigger-issue number, not a reference to any real
          # issue: the census assertions below need a non-zero issue to prove
          # the ready PR withholds its close, and the stubbed gh never posts
          # it anywhere.
          issue: "987654321"
          matrix: ${{ steps.seed.outputs.matrix }}
          github-token: ${{ github.token }}
          courtlistener-token: ${{ env.SCAN_NEEDLE }}

      - name: Assert per-cell degradation, the census, and the gates
        run: |
          set -euo pipefail
          shim="$RUNNER_TEMP/collect-shim"
          scratch="$RUNNER_TEMP/collect-scratch.git"
          ready_branch="predict/run-${CELL_RUN_ID}"
          partial_branch="predict/run-${CELL_RUN_ID}-partial"
          ready_url="https://prs.invalid/${ready_branch}"
          partial_url="https://prs.invalid/${partial_branch}"
          lost="predict-claude-baseline-ca9-101-${CELL_EVENT}"
          fail() { echo "::error::$1"; exit 1; }

          # The forced loss cost exactly one cell, and the downloader named it.
          [ "$(cat missing-artifacts.txt)" = "$lost" ] \
            || fail "the downloader should have lost exactly ${lost}"

          # The census tells the lost artifact from the never-uploaded cell.
          jq -e --arg evt "$CELL_EVENT" '.ready.artifact_dirs == [
              "predict-claude-baseline-ca9-103-" + $evt,
              "predict-codex-baseline-ca9-103-" + $evt
            ] and .ready.draft == false' collect-plan.json > /dev/null \
            || fail "the ready PR should carry exactly the two clean cells"
          jq -e --arg evt "$CELL_EVENT" \
            '.partial.artifact_dirs == ["predict-gemini-baseline-ca9-103-" + $evt]
             and .partial.draft == true' collect-plan.json > /dev/null \
            || fail "the salvage cell should ride the draft PR"
          jq -e --arg lost "$lost" '.missing_artifacts == [$lost]' collect-plan.json > /dev/null \
            || fail "the plan should name the lost artifact"
          jq -e --arg evt "$CELL_EVENT" '.uncovered_cells == [
              {actor:"codex-baseline",court:"ca9",docket:101,event_id:$evt}
            ]' collect-plan.json > /dev/null \
            || fail "the census should name the queued cell that never uploaded"
          jq -e '(.ready.body | contains("Closes #") | not)
             and (.ready.body | contains("did not transfer"))
             and (.ready.body | contains("uploaded nothing at all"))' collect-plan.json > /dev/null \
            || fail "the ready PR body should disclose both gaps and withhold the issue close"
          jq -e '.facts_only == null and .stalled == false and .dead_actors == []' \
            collect-plan.json > /dev/null \
            || fail "a run with ready cells is neither stalled nor facts-only"

          # The pushes landed on the scratch remote: both run branches, and
          # nothing else, with the right cells on each.
          [ "$(git -C "$scratch" for-each-ref --format='%(refname:short)' refs/heads \
              | sort | paste -sd' ')" = "$ready_branch $partial_branch" ] \
            || fail "the scratch remote should hold exactly the ready and draft branches"
          ready_tree=$(git -C "$scratch" ls-tree -r --name-only "$ready_branch")
          for path in \
            "data/cases/ca9/103/events/${CELL_EVENT}/predictions/claude-baseline/${CELL_RUN_ID}/prediction.json" \
            "data/cases/ca9/103/events/${CELL_EVENT}/predictions/codex-baseline/${CELL_RUN_ID}/prediction.json" \
            "data/cases/ca9/103/events/${CELL_EVENT}/predictions/gemini-baseline/${CELL_RUN_ID}/attempt.json" \
            "data/cases/ca9/101/events/${CELL_EVENT}/predictions/codex-baseline/${CELL_RUN_ID}/attempt.json"; do
            grep -qx "$path" <<< "$ready_tree" || fail "ready branch is missing ${path}"
          done
          if grep -q "gemini-baseline/${CELL_RUN_ID}/prediction.json" <<< "$ready_tree"; then
            fail "the salvage cell's prediction must not ride the auto-merging ready PR"
          fi
          if grep -q "cases/ca9/101/.*/prediction.json" <<< "$ready_tree"; then
            fail "a lost cell's content cannot appear anywhere (it never downloaded)"
          fi
          # A transfer loss is re-collectable, not a cell failure: no fact.
          if grep -q "claude-baseline/${CELL_RUN_ID}/attempt.json" <<< "$ready_tree"; then
            fail "a lost artifact must not record a cell-failure fact"
          fi
          partial_tree=$(git -C "$scratch" ls-tree -r --name-only "$partial_branch")
          grep -qx "data/cases/ca9/103/events/${CELL_EVENT}/predictions/gemini-baseline/${CELL_RUN_ID}/prediction.json" \
            <<< "$partial_tree" \
            || fail "the draft branch should carry the salvage cell's output"

          # The PR surface: one PR per branch, auto-merge armed only on ready.
          [ "$(grep -c '^gh pr create' "$shim/log")" = 2 ] \
            || fail "expected exactly two PR creations"
          grep -q "^gh pr merge --auto --squash ${ready_url}\$" "$shim/log" \
            || fail "auto-merge should be enabled on the ready PR"
          if grep -q "merge --auto --squash ${partial_url}\$" "$shim/log"; then
            fail "a draft PR must never arm auto-merge"
          fi

          # Snapshot for the idempotency pass, mark the shim log so the second
          # pass's calls are separable, and restore the trigger-ref working
          # tree a real rerun would start from (the composite left it on the
          # draft branch).
          git -C "$scratch" rev-parse "${ready_branch}^{tree}" "${partial_branch}^{tree}" \
            > "$RUNNER_TEMP/trees-first.txt"
          cp collect-plan.json "$RUNNER_TEMP/plan-first.json"
          echo "--- rerun ---" >> "$shim/log"
          git checkout -q --detach "$GITHUB_SHA"

      # Second pass, identical inputs: `gh run rerun --failed` is the
      # documented recovery for a transfer failure, so collect must be safe
      # to repeat — same branch trees, same plan, find-and-update instead of
      # a second PR.
      - name: Collect the synthetic run again (the rerun recovery path)
        uses: ./.github/actions/collect-run
        with:
          role: predict
          token: ${{ env.PLACEHOLDER_TOKEN }}
          repo: ${{ github.repository }}
          # A synthetic trigger-issue number, not a reference to any real
          # issue: the census assertions below need a non-zero issue to prove
          # the ready PR withholds its close, and the stubbed gh never posts
          # it anywhere.
          issue: "987654321"
          matrix: ${{ steps.seed.outputs.matrix }}
          github-token: ${{ github.token }}
          courtlistener-token: ${{ env.SCAN_NEEDLE }}

      - name: Assert the rerun is idempotent
        run: |
          set -euo pipefail
          shim="$RUNNER_TEMP/collect-shim"
          scratch="$RUNNER_TEMP/collect-scratch.git"
          ready_branch="predict/run-${CELL_RUN_ID}"
          partial_branch="predict/run-${CELL_RUN_ID}-partial"
          ready_url="https://prs.invalid/${ready_branch}"
          partial_url="https://prs.invalid/${partial_branch}"
          fail() { echo "::error::$1"; exit 1; }

          # Whole-tree comparison, and both passes branch from a freshly
          # fetched origin/main — so a merge to main landing between the two
          # passes moves both branches' bases and fails this spuriously. Read
          # that failure as "main moved" and re-dispatch, not "collect broke".
          git -C "$scratch" rev-parse "${ready_branch}^{tree}" "${partial_branch}^{tree}" \
            > "$RUNNER_TEMP/trees-second.txt"
          cmp -s "$RUNNER_TEMP/trees-first.txt" "$RUNNER_TEMP/trees-second.txt" \
            || fail "the rerun changed a run branch's content (or main moved mid-scenario; re-dispatch)"
          cmp -s "$RUNNER_TEMP/plan-first.json" collect-plan.json \
            || fail "the rerun changed the collect plan"

          rerun=$(sed -n '/^--- rerun ---$/,$p' "$shim/log")
          if grep -q '^gh pr create' <<< "$rerun"; then
            fail "the rerun opened a second PR instead of updating the first"
          fi
          grep -q "^gh pr edit ${ready_url} " <<< "$rerun" \
            || fail "the rerun should update the ready PR in place"
          grep -q "^gh pr edit ${partial_url} " <<< "$rerun" \
            || fail "the rerun should update the draft PR in place"
          grep -q "^gh pr ready --undo ${partial_url}\$" <<< "$rerun" \
            || fail "the rerun must return the salvage PR to a draft"
          grep -q "^gh pr merge --auto --squash ${ready_url}\$" <<< "$rerun" \
            || fail "the rerun should re-arm auto-merge on the ready PR"

          {
            echo ""
            echo "## Collect over synthetic cells"
            echo ""
            echo "- collected 3 of 4 listed artifacts; the forced loss cost one cell, not the run"
            echo "- ready PR: 2 cells, auto-merge armed, issue close withheld (1 lost artifact, 1 never-uploaded cell)"
            echo "- draft PR: 1 salvage cell; failure facts recorded for the salvage and never-uploaded cells only"
            echo "- rerun: identical branch trees and plan; PRs updated in place, none duplicated"
          } >> "$GITHUB_STEP_SUMMARY"

