name: integration-test

# The staging→main promotion freshness gate matches runs on this title format
# (scripts/promotion-gate.sh); change the two together — a workflow-shape test
# pins both ends. A whole-suite dispatch (`all`, `all-offline`) drops the
# `<scenario> / <engine>` pair for the bare scenario name. The gate takes an
# `all` title as evidence for the whole required set always, and an
# `all-offline` title only for the narrowed set a skipped-smoke pre-flight
# asks for — it tells the two apart, so the cheaper suite never satisfies the
# fuller requirement. The
# branch→environment resolution here is duplicated on the scenario job's
# `environment:` key (YAML anchors do not work in workflows); keep the two
# expressions identical, or the title stops naming the environment the job
# actually bound.
run-name: "integration-test: ${{ (inputs.scenario == 'all' || inputs.scenario == 'all-offline') && inputs.scenario || format('{0} / {1}', inputs.scenario, inputs.engine) }} @ ${{ inputs.deploy-environment != 'auto' && inputs.deploy-environment || (github.ref_name == 'main' && 'prod' || github.ref_name) }}"

# Live integration scenarios for the pieces a PR branch cannot exercise through
# the trigger path: the corpus read backends, the credential-scoped corpus
# sidecar, the tokenless CourtListener MCP sidecar, and cascade cells — stub or
# one real engine — over them. Each scenario is one dispatch, strictly
# side-effect free: no corpus write, no git
# write, no PR, no issue — results go to the Actions step summary and the run
# log, and any cell output lands only in the runner's throwaway checkout. Every
# scenario is also token-free except engine-smoke, which spends about one
# predict cell's worth of the selected engine's model tokens and says so on
# its input — so a whole-suite `all` dispatch spends three cells' worth, and
# `all-offline` (the same suite with the engine-smoke legs dropped) spends
# nothing. The collect scenario is environment-free on top of token-free:
# it exercises the collect-run composite against synthetic cell artifacts
# with every write surface stubbed or diverted on the runner, so its job
# binds no deployment environment and is the one scenario that still
# dispatches from any branch.
#
# Manual dispatch only. Its own workflow rather than a run-analytics mode
# because it is a preflight of the pipeline *infrastructure* itself, not an
# analysis that answers a question about the data: it is dispatched around
# changes to the read seams, the sidecars, and the corpus-consuming workflows —
# run-analytics included, so the preflight should not live on a surface it
# exists to check — and a distinct workflow gives release preflights their own
# run history.
#
# The `deploy-environment` input is what lets a change be exercised against real
# infrastructure before it is promoted, and its `auto` default resolves the
# environment from the dispatching branch: `main` resolves `prod` as always,
# `staging` resolves the `staging` environment — the same read-only role and
# remote variables plus its own engine keys, and the trust of the staging
# read-write role, which any staging-bound job may therefore ask for (the
# refresh lane is the one reviewed asker; docs/security.md carries the
# provenance model) — and any other branch resolves its own name, which
# names no configured environment and so binds nothing: no role
# variables, no keys. An explicit choice still wins over the resolution.
# Each environment restricts deployments to its one branch, so the
# gate is code provenance — only what passed a PR and the branch's required
# checks can bind either — rather than a per-run approval, which asserts
# nothing about the code. A dispatch whose job BINDS an environment from the
# wrong branch is refused at its deployment-branch gate, and one naming an
# environment that does not exist resolves no role variables — fail-closed
# either way (the AWS trust policies pin each role to its named environments;
# docs/security.md describes the wiring and when to revisit the shape).
on:
  workflow_dispatch:
    inputs:
      scenario:
        description: >-
          Which integration scenario to run. `all` fans the promotion gate's
          whole required suite out of one dispatch — the matrix legs plus the
          environment-free collect job, with engine-smoke once per engine —
          and therefore SPENDS MODEL TOKENS: three engine-smoke cells' worth,
          one per engine. `all-offline` is that same suite with the three
          engine-smoke legs dropped: token-free end to end, and accepted as
          whole-suite freshness evidence only by a promotion dispatched with
          its own engine-smoke skip set.
        type: choice
        default: ranged-reads
        options:
          - ranged-reads
          - corpus-service
          - stub-cascade
          - engine-smoke
          - mcp-sidecar
          - collect
          - qp-topic
          - all
          - all-offline
      # The known-good case the scenarios target: it must exist in the corpus
      # with at least one open (predictable) event and — for the snapshot and
      # cascade reads — a snapshot in the per-case content store, which under
      # the live corpus split only cases the post-cutover channels mutate
      # (SCOTUS dockets) have. Pre-cutover index-only rows (circuit courts)
      # can serve the query/open-events reads but never a snapshot. The
      # stub-cascade provisioning-guard step adds one more precondition: the
      # case (or the `event` the dispatch narrows to) must be genuinely
      # undisposed, since the guard rightly refuses a snapshot that already
      # shows the outcome. Swap the defaults if this case ever resolves out
      # of shape.
      #
      # The defaults name a case in the *production* corpus, which is what
      # the overwhelmingly common dispatch reads. A dispatch against an
      # environment pointed at the staging pair must name a case in that
      # pair's seeded slice instead — the slice is a lean cut, so the default
      # is absent from it and the run would fail as a missing case rather
      # than a regression (see the staging-corpus runbook in
      # docs/security.md).
      court:
        description: Court id of a known case with an open event and a snapshot.
        type: string
        default: scotus
      docket:
        description: Docket id of the known case.
        type: string
        default: "73274837"
      engine:
        description: >-
          engine-smoke only — which real engine drives the cell. SPENDS MODEL
          TOKENS: one predict cell's worth against the default open-event
          case; a resolved or multi-event case also replays evaluator cells,
          so narrow with `event` when pointing elsewhere. Ignored by `all`,
          which runs one smoke per engine, and by `all-offline`, which runs
          no smoke at all.
        type: choice
        default: claude-code
        options:
          - claude-code
          - codex
          - gemini
      event:
        description: >-
          Optional event id to narrow the cascade scenarios to; empty runs
          every event the case defines.
        type: string
        default: ""
      deploy-environment:
        description: >-
          Deployment environment supplying the role/remote variables. The
          `auto` default resolves it from the dispatching branch — `main`
          resolves `prod`, `staging` resolves `staging`, and any other branch
          resolves its own name, which names no configured environment and so
          binds no role variables and no keys — fail-closed. An explicit
          choice still wins, and each environment stays pinned to its one
          branch. A closed choice, not free text: run titles feed the
          promotion gate's freshness matching, so every dispatcher-controlled
          title component must come from a server-validated vocabulary.
          Unused by the collect scenario, whose job binds no environment and
          so dispatches from anywhere.
        type: choice
        default: auto
        options:
          - auto
          - prod
          - staging

# Least privilege by default; the job widens only to what the scenarios need.
permissions: {}

# A superseded check has no value (every scenario is idempotent and
# side-effect free), so a newer dispatch cancels an in-flight one. The engine
# is part of the key so per-engine smokes run side by side (scenario-only
# grouping made simultaneous claude/gemini smoke dispatches cancel each
# other); for the other scenarios the engine input is a constant default, so
# the grouping is unchanged. A whole-suite dispatch (`all`, `all-offline`)
# groups on the scenario alone — its engine input is meaningless, and folding
# it in would let two such dispatches differing only on that input race
# instead of superseding each other. The two whole-suite scenarios keep
# separate groups, and neither shares one with a single-scenario run: none can
# cancel or queue behind another, and an overlap on the same scenario is
# harmless because every scenario is idempotent and side-effect free.
concurrency:
  group: integration-test-${{ (inputs.scenario == 'all' || inputs.scenario == 'all-offline') && inputs.scenario || format('{0}-{1}', inputs.scenario, inputs.engine) }}
  cancel-in-progress: true

jobs:
  # Expands the dispatch into the {scenario, engine} legs the job below fans
  # out over: `all` becomes the required suite's matrix legs (collect rides
  # the run as its own job, not a leg), `all-offline` those same legs minus
  # the token-spending engine-smoke ones, any
  # other scenario one leg carrying the inputs unchanged — so a
  # single-scenario dispatch runs exactly the steps, env, and environment
  # binding it always has.
  plan:
    if: ${{ inputs.scenario != 'collect' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Compute the scenario matrix
        id: plan
        env:
          # Inputs pass through the environment (never interpolated into the
          # shell) so a maintainer-supplied value cannot inject commands.
          SCENARIO: ${{ inputs.scenario }}
          ENGINE: ${{ inputs.engine }}
        run: |
          set -euo pipefail
          case "$SCENARIO" in
          all | all-offline)
            # The promotion gate's required suite — keep in lockstep with
            # REQUIRED_SCENARIOS in scripts/promotion-gate.sh (a
            # workflow-shape test pins the two ends). collect is required
            # evidence too, but it needs no environment or engine, so it
            # stays out of this matrix and joins a whole-suite run through
            # its own job below. The engine field is meaningful only for
            # engine-smoke; the other legs carry the engine input's default
            # as a benign constant.
            matrix='[
              {"scenario": "ranged-reads", "engine": "claude-code"},
              {"scenario": "corpus-service", "engine": "claude-code"},
              {"scenario": "stub-cascade", "engine": "claude-code"},
              {"scenario": "mcp-sidecar", "engine": "claude-code"},
              {"scenario": "qp-topic", "engine": "claude-code"},
              {"scenario": "engine-smoke", "engine": "claude-code"},
              {"scenario": "engine-smoke", "engine": "codex"},
              {"scenario": "engine-smoke", "engine": "gemini"}
            ]'
            # One literal for both whole-suite scenarios, filtered rather than
            # copied: `all-offline` is `all` minus exactly the legs that spend
            # model tokens, and a second literal could drift from the first.
            if [ "$SCENARIO" = all-offline ]; then
              matrix=$(jq -c '[.[] | select(.scenario != "engine-smoke")]' <<<"$matrix")
            else
              matrix=$(jq -c . <<<"$matrix")
            fi
            ;;
          *)
            matrix=$(jq -nc --arg s "$SCENARIO" --arg e "$ENGINE" \
              '[{scenario: $s, engine: $e}]')
            ;;
          esac
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"

  scenario:
    # Every dispatch-selected scenario except `collect`, which runs on its own
    # environment-free job below: it needs no role variables, so binding it to
    # this job's deployment environment would only add a needless gate.
    if: ${{ inputs.scenario != 'collect' }}
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      # A broken leg must not cancel the others: each leg is independent
      # freshness evidence for its scenario, and an `all` run's whole-suite
      # evidence is simply the run succeeding — which needs every leg's own
      # verdict, not the first failure's.
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    # 45, not 30: the engine-smoke scenario spans an npm CLI install plus one
    # real agent cell, which alone can run tens of minutes on a slow model day.
    timeout-minutes: 45
    # Branch-resolved with an explicit override; keep this expression
    # identical to the one in `run-name:` above (YAML anchors do not work in
    # workflows), and see the deploy-environment input for what resolves.
    environment: ${{ inputs.deploy-environment != 'auto' && inputs.deploy-environment || (github.ref_name == 'main' && 'prod' || github.ref_name) }}
    permissions:
      contents: read
      id-token: write # assume the read-only AWS role for the corpus reads
    # Corpus-split read side, job-wide: under FEDCOURTS_CORPUS_SPLIT=1 (the
    # clean-slate cutover switch; unset variable -> '0' -> off) snapshot
    # payloads and opinion bodies are served from the per-case content store,
    # which needs its URL. Job-level so every client-side read — the ranged
    # read set, the stub cascade, the provisioning guard, the engine-smoke
    # cascade — resolves the same mode; the sidecar process gets the same
    # pair explicitly, as corpus-sidecar composite inputs, exactly as the
    # cell workflows pass it. Inert while the flag is off.
    #
    # The index half of that pair travels the same way. A consumer resolves
    # the committed `corpus/corpus.db.ref`, whose digest names the production
    # blob, unless this out-of-band pointer names another published blob —
    # and content addressing means a lean slice can never publish under the
    # production digest, so an environment holding staging's store URLs must
    # carry staging's pointer too or every index read asks that bucket for a
    # key it does not hold. An unset variable resolves to the empty string,
    # which reads as "the committed pointer, unchanged", and no fallback
    # literal can express a pointer, so there is nothing to default it to.
    # What keeps the `prod` lane off this path is that the variable is set on
    # the `staging` environment alone — every corpus-writing workflow
    # hard-codes `environment: prod` and forwards no pointer at all.
    # Job-level for the split flag's own reason — one pair per job, never a
    # staging index resolved against a production pointer.
    env:
      FEDCOURTS_CASESTORE_URL: ${{ vars.CASESTORE_URL }}
      FEDCOURTS_CORPUS_SPLIT: ${{ vars.FEDCOURTS_CORPUS_SPLIT || '0' }}
      FEDCOURTS_CORPUS_POINTER: ${{ vars.FEDCOURTS_CORPUS_POINTER }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # data/qp-topics membership encodes cert outcomes (docs/qp-topic.md), so
      # every workflow that starts an agent deletes it first; the engine-smoke
      # scenario runs real cells and is the freshness evidence for cell
      # behaviour, so it must reproduce the cell environment it certifies.
      # Elsewhere in the matrix the step is a harmless no-op.
      - name: Remove the labeling-measurement oracle from the agent's tree
        run: rm -rf data/qp-topics

      - uses: ./.github/actions/setup-python-env

      # --- ranged-reads: the fixed read set against the blob in place --------

      # Ranged reads need only AWS credentials and the remote URL from the
      # environment — never a full pull, never the blob on disk — so this
      # assumes the read-only role directly instead of via the corpus-readonly
      # composite, whose pull serves jobs that read the local file.
      - name: Configure AWS credentials (read-only)
        if: ${{ matrix.scenario == 'ranged-reads' || matrix.scenario == 'stub-cascade' }}
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME_READONLY }}
          aws-region: ${{ vars.AWS_REGION }}
          # Bound the assume-role wall clock: unbounded, its 12 retries over a
          # multi-minute connect timeout outlast every job budget here (see the
          # workflow-traps list in docs/pipeline.md). Note the cost this buys —
          # the action does not clear its timer on the error path, so ANY failing
          # assume-role now burns the full 120s and ends on "Action timed out"
          # rather than its own message; the real cause is earlier in the log.
          action-timeout-s: 120

      # All the logic — the three reads, the non-empty assertions, the
      # per-read GET/byte counters, the wall-clock budget, the Markdown
      # summary — lives in the tested `corpus-integration-check` command; this
      # step is one CLI call that fails the job on any empty read or a blown
      # budget, so a pathology (a table scan, a cache regression) fails the
      # run instead of hiding in the logs.
      - name: Run the fixed ranged read set
        if: ${{ matrix.scenario == 'ranged-reads' }}
        env:
          # Inputs pass through the environment (never interpolated into the
          # shell) so a maintainer-supplied value cannot inject commands.
          COURT: ${{ inputs.court }}
          DOCKET: ${{ inputs.docket }}
          CORPUS_REMOTE_URL: ${{ vars.CORPUS_REMOTE_URL }}
        run: |
          set -euo pipefail
          uv run fedcourts corpus-integration-check \
            --court "$COURT" --docket "$DOCKET" \
            --corpus-backend ranged \
            --summary-out "$GITHUB_STEP_SUMMARY"

      # --- corpus-service: the sidecar surface the live cells retrieve from --

      # The same composite the cell workflows launch: assumes the role with
      # step-scoped credentials, starts `fedcourts corpus-serve`, health-gates,
      # and publishes the non-secret service URL job-wide. A dispatch therefore
      # exercises the dispatched ref's own composite + service code. The
      # engine-smoke scenario also takes the step-scoped credential outputs
      # for the cascade's own provisioning reads.
      - uses: ./.github/actions/corpus-sidecar
        id: corpus
        if: ${{ matrix.scenario == 'corpus-service' || matrix.scenario == 'engine-smoke' }}
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME_READONLY }}
          aws-region: ${{ vars.AWS_REGION }}
          corpus-remote-url: ${{ vars.CORPUS_REMOTE_URL }}
          # Corpus-split read side for the sidecar process itself: under the
          # split, `full` query bodies hydrate from the per-case content
          # store server-side, and the sidecar is the credentialed process —
          # without these the sidecar silently serves bodiless rows while
          # every other read stays green. Inert while the flag is off.
          casestore-url: ${{ vars.CASESTORE_URL }}
          corpus-split: ${{ vars.FEDCOURTS_CORPUS_SPLIT || '0' }}
          # The index half of the same pair, explicit for the same reason: the
          # sidecar is a separate process, and a pair whose index it resolved
          # from the committed pointer would serve production's index rows
          # against this environment's store.
          corpus-pointer: ${{ vars.FEDCOURTS_CORPUS_POINTER }}

      # The same tested command as the ranged read set, on the service
      # backend: three reads through the exact client a cell's `service`
      # backend forwards with, failing on an empty result, a blown budget, or
      # — the full-query hydration probe — an opinion-bearing row whose body
      # hydrates empty (the content-store path degrades to None rather than
      # raising, so only asking for a body can prove one arrives).
      - name: Run the service read set against the sidecar
        if: ${{ matrix.scenario == 'corpus-service' }}
        env:
          COURT: ${{ inputs.court }}
          DOCKET: ${{ inputs.docket }}
        run: |
          set -euo pipefail
          uv run fedcourts corpus-integration-check \
            --court "$COURT" --docket "$DOCKET" \
            --corpus-backend service \
            --summary-out "$GITHUB_STEP_SUMMARY"

      # --- stub-cascade: provision -> predict -> validate, token-free --------

      # The production provisioning command, exercised end to end before the
      # cascade: run-predict's own step passes the same
      # `--mode forward --refuse-terminal` (plus a staleness bound this
      # harness deliberately leaves off — a fixed known case's snapshot ages,
      # and the bound would turn the leg red on calendar time alone) but is
      # continue-on-error there (a
      # refusal must not burn the whole fan-out), so the guard drifting to
      # always-refuse — or the flag silently dropping out — fails nothing at
      # runtime, while local-cascade provisions in-process and never runs this
      # CLI at all. Here the command must *succeed and write the record* for
      # the known case: while that case is undisposed (part of the input
      # contract on `court`/`docket` above), a refusal is by construction a
      # guard regression. An isolated data root keeps its writes out of the
      # cascade's tree.
      - name: Provision the forward record through the production guard
        if: ${{ matrix.scenario == 'stub-cascade' }}
        env:
          COURT: ${{ inputs.court }}
          DOCKET: ${{ inputs.docket }}
          EVENT: ${{ inputs.event }}
          CORPUS_REMOTE_URL: ${{ vars.CORPUS_REMOTE_URL }}
          FEDCOURTS_CORPUS_BACKEND: ranged
          FEDCOURTS_DATA_ROOT: ${{ runner.temp }}/provision-guard/data
        run: |
          set -euo pipefail
          uv run fedcourts provision-snapshot --court "$COURT" --docket "$DOCKET" \
            --mode forward --refuse-terminal ${EVENT:+--event "$EVENT"}
          test -s "$FEDCOURTS_DATA_ROOT/cases/$COURT/$DOCKET/record/context.json"

      # One offline stub cascade cell with every corpus read on the ranged
      # backend. Deterministic and token-free; the cell writes derived
      # artifacts only into the runner's throwaway checkout — this job holds
      # no write credential, so nothing can land anywhere.
      - name: Run one stub cascade cell over the ranged backend
        if: ${{ matrix.scenario == 'stub-cascade' }}
        env:
          COURT: ${{ inputs.court }}
          DOCKET: ${{ inputs.docket }}
          EVENT: ${{ inputs.event }}
          CORPUS_REMOTE_URL: ${{ vars.CORPUS_REMOTE_URL }}
          FEDCOURTS_CORPUS_BACKEND: ranged
        run: |
          set -euo pipefail
          {
            echo ""
            echo "## Stub cascade over the ranged backend"
            echo ""
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          uv run fedcourts local-cascade --court "$COURT" --docket "$DOCKET" \
            --engine stub --require-predictions \
            ${EVENT:+--event "$EVENT"} | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # --- qp-topic: the labeling pipeline's post-label half, token-free -----

      # Drives the shared qp-topic-measure composite — the exact steps the
      # paid labeling run depends on — over canned inputs built from the
      # committed reference set, so the no-output guard, the publication
      # gate's refusal, and the publish-and-validate path are all exercised
      # with no model spend and no credentials. The extract and the model
      # call stay uncovered here by design: the extract needs QP document
      # rows no fixture corpus writes, and the model call is exactly what
      # `run-analytics` pays for. The leg rides this matrix job — whose
      # environment binding and id-token grant it never reads — deliberately:
      # that binding is what makes its run title's `@ staging` suffix a
      # deployment-gated provenance claim, which is how the promotion gate
      # reads every required matrix leg. A second credential-free job header
      # would trade that evidence away for no gain.
      - name: Seed canned labeling inputs from the committed reference set
        if: ${{ matrix.scenario == 'qp-topic' }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/qp-topic"
          mkdir -p "$root/data/qp-topics"
          # The oracle-fence step above deleted data/qp-topics from the
          # working tree, so recover the reference set from the commit.
          git show HEAD:data/qp-topics/qp-topic-reference.json \
            > "$root/data/qp-topics/qp-topic-reference.json"
          # The extract shape `qp-corpus` produces, minus the texts (an empty
          # text fires no shadow rule), and one label line per reference
          # entry: agreement and coverage both 100%.
          jq '[.entries[] | {case_id, docket_number, text: ""}]' \
            "$root/data/qp-topics/qp-topic-reference.json" > "$root/qp-texts.json"
          # `label` is a jq keyword, so the object key needs the explicit form.
          jq -c '.entries[] | {case_id, docket_number, label: .label}' \
            "$root/data/qp-topics/qp-topic-reference.json" > "$root/qp-labels.jsonl"
          # A labeler that produced nothing (the no-output guard's case) ...
          : > "$root/qp-labels-empty.jsonl"
          # ... and one that disagrees on every third entry: agreement ~67%,
          # far enough under the 80% gate that the measure must refuse.
          jq -c '.entries | to_entries[] | if (.key % 3) == 0
              then {case_id: .value.case_id, docket_number: .value.docket_number,
                    label: (if .value.label == "tax" then "criminal-law" else "tax" end)}
              else {case_id: .value.case_id, docket_number: .value.docket_number,
                    label: .value.label} end' \
            "$root/data/qp-topics/qp-topic-reference.json" > "$root/qp-labels-drifted.jsonl"

      - name: Measure a run whose labeler wrote nothing (must fail)
        if: ${{ matrix.scenario == 'qp-topic' }}
        id: qp-empty
        continue-on-error: true
        uses: ./.github/actions/qp-topic-measure
        with:
          labels: ${{ runner.temp }}/qp-topic/qp-labels-empty.jsonl
          texts: ${{ runner.temp }}/qp-topic/qp-texts.json
          labeler: canned/none
          data-root: ${{ runner.temp }}/qp-topic/data

      # Pin the *reason*, not just the failure: the guard fires before the
      # measure step, so measured.txt not existing yet proves the no-output
      # assert refused — a plain outcome check would stay green even if the
      # guard were dropped and the measure command's own "no label lines"
      # error failed the leg instead.
      - name: Assert the no-output guard refused before measuring
        if: ${{ matrix.scenario == 'qp-topic' }}
        env:
          EMPTY_OUTCOME: ${{ steps.qp-empty.outcome }}
        run: |
          set -euo pipefail
          if [ "$EMPTY_OUTCOME" != "failure" ]; then
            echo "::error::a labeler that wrote nothing passed the measure"
            exit 1
          fi
          if [ -e "$RUNNER_TEMP/measured.txt" ]; then
            echo "::error::the no-output guard did not fire; the measure step ran on an empty labels file"
            exit 1
          fi

      - name: Measure a drifted run (the gate must refuse to publish)
        if: ${{ matrix.scenario == 'qp-topic' }}
        id: qp-drifted
        continue-on-error: true
        uses: ./.github/actions/qp-topic-measure
        with:
          labels: ${{ runner.temp }}/qp-topic/qp-labels-drifted.jsonl
          texts: ${{ runner.temp }}/qp-topic/qp-texts.json
          labeler: canned/drifted
          data-root: ${{ runner.temp }}/qp-topic/data

      - name: Assert the gate refused the drifted run and published nothing
        if: ${{ matrix.scenario == 'qp-topic' }}
        env:
          DRIFTED_OUTCOME: ${{ steps.qp-drifted.outcome }}
        run: |
          set -euo pipefail
          if [ "$DRIFTED_OUTCOME" != "failure" ]; then
            echo "::error::a drifted labeler passed the publication gate"
            exit 1
          fi
          # The refusal, in the gate's own words — a different failure (a
          # join error, a vocabulary reject) must not satisfy this leg.
          if ! grep -q "refusing to write" "$RUNNER_TEMP/measured.txt"; then
            echo "::error::the drifted run failed for some reason other than the publication gate"
            exit 1
          fi
          if [ -e "$RUNNER_TEMP/qp-topic/data/qp-topics/qp-topics.json" ]; then
            echo "::error::a refused run left a labels artifact behind"
            exit 1
          fi

      - name: Measure a faithful run (must publish and validate)
        if: ${{ matrix.scenario == 'qp-topic' }}
        uses: ./.github/actions/qp-topic-measure
        with:
          labels: ${{ runner.temp }}/qp-topic/qp-labels.jsonl
          texts: ${{ runner.temp }}/qp-topic/qp-texts.json
          labeler: canned/reference
          data-root: ${{ runner.temp }}/qp-topic/data

      - name: Assert the published artifact carries the whole reference set
        if: ${{ matrix.scenario == 'qp-topic' }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/qp-topic"
          expected=$(jq '.cases' "$root/data/qp-topics/qp-topic-reference.json")
          jq -e --argjson n "$expected" \
            '.cases == $n and .agreement.gate_passed == true and .vocabulary == "qp-topic-v0"' \
            "$root/data/qp-topics/qp-topics.json" > /dev/null
          echo "qp-topic scenario: published $expected case(s), gate passed" >> "$GITHUB_STEP_SUMMARY"

      # --- engine-smoke: one real agent cell over the service sidecar --------

      # The one scenario that spends model tokens: a single real-engine
      # predictor cell driven through the tested local-cascade seam, with the
      # agent's corpus retrieval on the service sidecar — the full production
      # cell posture (credential-scrubbed agent env, tokenless localhost
      # retrieval, each engine's real sandbox semantics), exercised on demand.
      # This is the scenario that catches an engine-level integration break —
      # a sandbox denying localhost, a CLI behavior change — before a live
      # run finds it. The CLI install is its own SECRET-FREE step: only the
      # top-level version is exactly pinned (transitive dependencies resolve
      # fresh at every install), so npm lifecycle scripts must never see
      # credentials.
      - name: Install the selected agent CLI
        if: ${{ matrix.scenario == 'engine-smoke' }}
        env:
          ENGINE: ${{ matrix.engine }}
        # zizmor: ignore[adhoc-packages] — top-level exact-version pins,
        # transitive scripts disabled, and a secret-free step environment are
        # the practical controls for global CLIs; a lockfile is not
        # expressible for `npm i -g`. The one script run on purpose is the
        # pinned claude package's own installer, which fetches the native
        # binary from the vendor's release endpoint — the same vendor trust
        # executing the agent itself carries. Keep the pins in lockstep with
        # run-predict, run-evaluate, and run-backtest.
        run: |
          set -euo pipefail
          case "$ENGINE" in
            claude-code) package="@anthropic-ai/claude-code@2.1.207" binary=claude ;;
            codex) package="@openai/codex@0.144.1" binary=codex ;;
            gemini) package="@google/gemini-cli@0.49.0" binary=gemini ;;
          esac
          npm install --silent --no-audit --ignore-scripts --global "$package"
          # Claude's native binary is placed by its postinstall, which
          # --ignore-scripts suppresses; run the pinned package's own
          # installer explicitly — the one script we already trust enough to
          # execute as the agent moments later. codex/gemini need no
          # postinstall.
          if [ "$ENGINE" = "claude-code" ]; then
            node "$(npm root -g)/@anthropic-ai/claude-code/install.cjs"
          fi
          "$binary" --version

      # The codex sandbox (bubblewrap) needs unprivileged user namespaces,
      # which Ubuntu 24.04 runners restrict via AppArmor: without this, every
      # command the agent runs — and even its file writes — dies with
      # `bwrap: setting up uid map: Permission denied` and the cell finishes
      # blocked. The same prerequisite codex-action applies for the live
      # cells before dropping sudo (which this job does not do — see the
      # engine-smoke paragraph in docs/security.md); the other engines
      # sandbox nothing and need neither sysctl. Each knob is probed before
      # writing, as upstream does: a kernel without the knob has nothing to
      # loosen.
      - name: Enable unprivileged user namespaces for the codex sandbox
        if: ${{ matrix.scenario == 'engine-smoke' && matrix.engine == 'codex' }}
        run: |
          set -euo pipefail
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          if sysctl -n kernel.unprivileged_userns_clone >/dev/null 2>&1; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi

      # The CourtListener MCP half of the cell posture, wired for the codex
      # leg only. The corpus sidecar above gives every leg its corpus
      # retrieval; this pair gives codex the same MCP surface a live cell
      # gets — the tokenless localhost sidecar (token in the composite's
      # launch step env, never the agent's) plus the generated client config
      # naming only that URL — in run-predict's order: corpus sidecar, MCP
      # sidecar, MCP config, cell. It is here rather than on all three
      # because codex is the engine whose manifest use never arrives as an item
      # of its own: code mode dispatches every call from inside a freeform
      # `exec`, so the `record-retrieval` parser reaches it only by reading that
      # call's source, and a real rollout with the surface wired is what
      # exercises that path. What the leg evidences is that much — the engine
      # boots in the cell posture and produces a rollout the parser's
      # code-mode branch can read. What it cannot evidence is anything read off
      # the ABSENCE of an MCP-shaped item, here or in the distillation below:
      # code mode emits none whether or not retrieval happened, so that absence
      # separates nothing. (Committed production cells do carry `mcp__` rows for
      # these calls — lifted from the source, `call_source: code_mode_source` —
      # but this leg runs no capture step and produces no retrieval log.) Health
      # stays warn-only, as in the cells: an unhealthy sidecar degrades the
      # cell to corpus tooling rather than failing the smoke, and the
      # `mcp-sidecar` scenario is the leg that gates on the sidecar itself.
      - uses: ./.github/actions/mcp-sidecar
        if: ${{ matrix.scenario == 'engine-smoke' && matrix.engine == 'codex' }}
        with:
          role: predictor
          actor: codex-baseline
          courtlistener-api-token: ${{ secrets.COURTLISTENER_API_TOKEN }}

      # The tested `mcp-config` command emits codex's client format from the
      # versioned manifest (config/predictors.yaml `mcp_servers:`); this step
      # only plumbs stdout to the file codex reads. `.codex` is the cascade
      # step's CODEX_HOME below, so the config lands where the CLI looks for
      # it. The file carries a localhost URL and no token — an unknown actor
      # or a mistyped server id fails the step rather than falling back to a
      # per-client stdio spawn.
      - name: Configure the codex cell's MCP retrieval
        if: ${{ matrix.scenario == 'engine-smoke' && matrix.engine == 'codex' }}
        run: |
          set -euo pipefail
          mkdir -p .codex
          uv run fedcourts mcp-config --engine codex \
            --role predictor --actor codex-baseline \
            --http-url courtlistener=http://127.0.0.1:8378/mcp > .codex/config.toml

      # Gemini's sanitizer runs strict whenever GITHUB_SHA is set and strips
      # every custom var from the agent's shell, so the cell env contract and
      # the service-backend pointers must be allowlisted (run-predict.yml
      # carries the fuller rationale), and respectGitIgnore lets the cell read
      # its gitignored provisioned record files. Only non-secret identifiers
      # belong on this allowlist — it is written raw here, with no
      # credential-shape screen in the path.
      - name: Configure the Gemini cell env allowlist
        if: ${{ matrix.scenario == 'engine-smoke' && matrix.engine == 'gemini' }}
        run: |
          set -euo pipefail
          mkdir -p .gemini
          printf '%s\n' '{"context":{"fileFiltering":{"respectGitIgnore":false}},"security":{"environmentVariableRedaction":{"allowed":["COURT_ID","DOCKET_ID","EVENT_ID","PREDICTOR_ID","EVALUATOR_ID","RUN_ID","MODEL_ID","DECIDED_BEFORE","FEDCOURTS_CORPUS_BACKEND","FEDCOURTS_CORPUS_SERVICE_URL"]}}}' > .gemini/settings.json

      # The backend split that makes this faithful: `--corpus-backend ranged`
      # pins the cascade's own provisioning reads to the blob (using this
      # step's scoped credentials), while the ambient
      # FEDCOURTS_CORPUS_BACKEND=service — which the spawned agent inherits
      # through the runner's scrubbed base env, along with the service URL the
      # sidecar composite published job-wide — points the agent's retrieval at
      # the sidecar, exactly like a live cell. The runner seam scrubs the AWS
      # credentials and every other engine's key from the agent env, so the
      # agent holds only its own engine's key (the ternaries below); the
      # predictor ids map each engine to its baseline in
      # config/predictors.yaml (an id drift fails loudly, naming the enabled
      # ids). One predictor cell, so the spend is one cell's worth against
      # the default open-event case (a resolved event would also replay
      # evaluator cells — the input description says so). The engine keys
      # resolve from the deployment environment like every other secret, so a
      # dispatch naming an environment without the keys gets an empty key and
      # the cell fails closed regardless of step ordering. Output lands only in the
      # runner's throwaway checkout.
      - name: Run one real-engine cascade cell over the service sidecar
        if: ${{ matrix.scenario == 'engine-smoke' }}
        env:
          ENGINE: ${{ matrix.engine }}
          COURT: ${{ inputs.court }}
          DOCKET: ${{ inputs.docket }}
          EVENT: ${{ inputs.event }}
          AWS_ACCESS_KEY_ID: ${{ steps.corpus.outputs.aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.corpus.outputs.aws-secret-access-key }}
          AWS_SESSION_TOKEN: ${{ steps.corpus.outputs.aws-session-token }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          CORPUS_REMOTE_URL: ${{ vars.CORPUS_REMOTE_URL }}
          FEDCOURTS_CORPUS_BACKEND: service
          # The corpus pair rides the job env for the cascade's own
          # provisioning reads; the agent inherits those three non-secret
          # values — the store URL, the split flag, the index pointer —
          # harmlessly: its reads go via the sidecar, the content store is
          # unreachable without the scrubbed creds, and a pointer names a
          # blob rather than granting any reach to one.
          ANTHROPIC_API_KEY: ${{ matrix.engine == 'claude-code' && secrets.ANTHROPIC_API_KEY || '' }}
          OPENAI_API_KEY: ${{ matrix.engine == 'codex' && secrets.OPENAI_API_KEY || '' }}
          GEMINI_API_KEY: ${{ matrix.engine == 'gemini' && secrets.GEMINI_API_KEY || '' }}
          # Pin codex's home to the workspace dir the MCP config was written
          # into, exactly as the live codex cell step does: unset, the cascade
          # picks a run-scoped temp home for the API-key login, and both the
          # config the cell must read and the session rollout the shape
          # distillation reads land somewhere no later step can name. Inert
          # for the other two engines, which never read it.
          CODEX_HOME: ${{ github.workspace }}/.codex
        run: |
          set -euo pipefail
          case "$ENGINE" in
            claude-code) predictor=claude-baseline ;;
            codex) predictor=codex-baseline ;;
            gemini) predictor=gemini-baseline ;;
          esac
          # The agent's transcript is untrusted model output: it stays in the
          # run log (plain text) and out of the *rendered* step summary, where
          # a stray fence-closer could inject live Markdown. Only the
          # deterministic CascadeReport block — printed by the CLI after the
          # cells finish — is appended, and only on success (pipefail aborts
          # before the append otherwise).
          # --require-predictions: a real agent that finishes "blocked" exits
          # 0 with a validly-empty ledger; the smoke must fail on that, not
          # report green around an empty cell.
          uv run fedcourts local-cascade --court "$COURT" --docket "$DOCKET" \
            --engine "$ENGINE" --predictor "$predictor" --corpus-backend ranged \
            --require-predictions \
            ${EVENT:+--event "$EVENT"} | tee cascade-output.log
          {
            echo ""
            echo "## Engine smoke: one $ENGINE cell over the service sidecar"
            echo ""
            echo '```'
            sed -n '/^local-cascade /,$p' cascade-output.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # What the dispatch is worth beyond a green tick: the codex rollout's
      # item shapes, distilled by the tested `codex-item-shapes` command and
      # uploaded. The `record-retrieval` parser keys on those shapes, and an
      # unrecognized one costs a cell's whole retrieval log while reading
      # exactly like a cell that called nothing — so the transcript is the
      # only thing that can tell a behavioural zero from a capture gap, and
      # the distillation is what a fixture can be pinned to.
      #
      # Shape-only, and it must stay that way: a rollout carries retrieved
      # documents and tool arguments verbatim. The command emits item types,
      # key names, and JSON type names — never a value — and the rollout
      # itself dies with the runner. The output goes to a file, never to the
      # rendered step summary, so nothing transcript-derived reaches live
      # Markdown.
      #
      # It also goes to `RUNNER_TEMP`, not the workspace, and that placement is
      # the security control rather than tidiness: the cell has just had write
      # access to the whole workspace, so a path there can be pre-planted — a
      # file, a directory, a symlink out of the tree — and the distill step is
      # `continue-on-error`, so a failed write is swallowed and the upload
      # publishes whatever sits at the path, unscanned, from a public repo.
      # `RUNNER_TEMP` is outside the workspace-write sandbox, which makes the
      # uploaded artifact the tested command's own output by construction.
      #
      # Observation, never a gate: `always()` so a failed cell still yields
      # its shapes (a blocked cell's transcript is exactly the interesting
      # one), `continue-on-error` and a tolerant command so the smoke's
      # verdict stays the cell's.
      - name: Distill the codex transcript's item shapes
        if: ${{ always() && matrix.scenario == 'engine-smoke' && matrix.engine == 'codex' }}
        continue-on-error: true
        env:
          CODEX_HOME: ${{ github.workspace }}/.codex
        run: |
          set -euo pipefail
          uv run fedcourts codex-item-shapes \
            --sessions-dir "$CODEX_HOME/sessions" \
            --out "$RUNNER_TEMP/codex-item-shapes.json"

      - name: Upload the codex transcript's item shapes
        if: ${{ always() && matrix.scenario == 'engine-smoke' && matrix.engine == 'codex' }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codex-item-shapes
          path: ${{ runner.temp }}/codex-item-shapes.json
          # Warn, not error: a cell that died before writing a transcript
          # leaves nothing to upload, and this step must not be the thing
          # that reddens the smoke.
          if-no-files-found: warn
          # Long enough for a maintainer to read the run and pin a fixture
          # from it, short of the default 90: the file is a diagnostic, not a
          # record.
          retention-days: 14
          # `gh run rerun --failed` is the advertised recovery for a red run
          # and artifacts persist across attempts; without overwrite the
          # rerun 409s here.
          overwrite: true

      # Both sidecars' logs carry startup lines (the corpus one's
      # `health-check corpus read:` transfer evidence among them) and
      # per-request records (server noise, no secrets — GitHub masks the
      # credentials regardless): surface them in the job log, as the cell
      # workflows do over the same two files, so a cold-read stall or a
      # mid-scenario sidecar death is diagnosable from the failed run instead
      # of a rerun. The MCP log is the codex leg's second witness: requests in
      # this log against a distillation carrying `custom_tool_call` items and
      # no `mcp_tool_call` / `mcp_call` ones is code mode working as designed —
      # the capture lifts the manifest calls out of the freeform call's source,
      # not from an MCP-shaped item, which code mode never emits. (The
      # distillation replaces every value with its type name, so the tool name
      # itself is not in it; the payload type is.) No requests at all is the
      # engine never reaching the sidecar — a decline, or a sidecar that never
      # came up, since health is warn-only here. Either way it is a distinction
      # the shapes artifact alone cannot draw. Head and tail both, because the
      # evidence lines are at the top and an engine-smoke's query records
      # scroll them off a tail alone.
      - name: Show the sidecar logs
        if: ${{ always() && (matrix.scenario == 'corpus-service' || matrix.scenario == 'engine-smoke' || matrix.scenario == 'mcp-sidecar') }}
        continue-on-error: true
        run: |
          set -euo pipefail
          # Indent every replayed line: a line starting with ::<command>::
          # would otherwise be parsed as a workflow command by the runner.
          for log in corpus-sidecar.log cl-mcp-sidecar.log; do
            if [ ! -f "$log" ]; then
              continue
            fi
            echo "--- $log"
            lines=$(wc -l < "$log")
            if [ "$lines" -le 120 ]; then
              sed 's/^/  /' "$log"
            else
              head -n 20 "$log" | sed 's/^/  /'
              echo "  [... $((lines - 120)) line(s) elided ...]"
              tail -n 100 "$log" | sed 's/^/  /'
            fi
          done

      # --- mcp-sidecar: the tokenless CourtListener MCP surface --------------

      # The same composite the cell workflows launch, deliberately token-free:
      # the probe proves the handshake and the tool listing — everything an
      # engine's client needs before its first CourtListener call — without
      # spending one, so this scenario needs no secret and no AWS role at
      # all. Strict health, unlike the cells: there an unhealthy sidecar
      # degrades the cell to corpus tooling, but here the sidecar IS the
      # thing under test. The actor names an enabled predictor whose manifest
      # includes the CourtListener server (the sidecar scopes tool manifests
      # per actor).
      - uses: ./.github/actions/mcp-sidecar
        if: ${{ matrix.scenario == 'mcp-sidecar' }}
        with:
          role: predictor
          actor: claude-baseline
          strict-health: "true"

      # The tested MCP client check: initialize + tools/list through the
      # streamable-HTTP surface the generated cell configs point at, failing
      # the job unless the sidecar completes the handshake and hands out a
      # non-empty tool list.
      - name: Run the MCP client check against the sidecar
        if: ${{ matrix.scenario == 'mcp-sidecar' }}
        run: |
          set -euo pipefail
          uv run fedcourts mcp-integration-check --summary-out "$GITHUB_STEP_SUMMARY"

  # --- collect: the run-PR writer over synthetic cells, environment-free ---

  # Exercises the collect-run composite — the single writer for a predict/
  # evaluate run's agent output — against synthetic cell artifacts this job
  # uploads to its own run, so collect's durability contract is provable
  # without spending a live matrix: a forced download failure costs one cell
  # and not the run, the queued-cell census names the gaps and withholds the
  # trigger-issue close, and a rerun updates in place instead of duplicating.
  #
  # Deliberately no deployment environment and no AWS role: the job reads no
  # corpus and holds no secret. The composite is handed a placeholder in
  # place of the App token, a gh shim on PATH stubs every PR surface (and
  # forces the one transfer failure), and a git URL rewrite keyed on that
  # placeholder diverts the branch push to a runner-local scratch remote — so
  # nothing can write to the real repo, and a push that somehow escaped the
  # rewrite would authenticate with a non-credential and be refused. The only
  # real token in the job is the ambient read-only one the composite's
  # downloader uses to list and fetch this run's own artifacts.
  collect-scenario:
    # Fires on its own dispatch and inside either whole-suite run: the collect
    # composite is the single writer for every predict/evaluate run's output,
    # so the promotion freshness suite must include it — and because this job
    # is a separate job in the same run, a whole-suite title is evidence only
    # if this job succeeded too (a run concludes success only when every job
    # did). Token-free, so `all-offline` keeps it.
    if: ${{ inputs.scenario == 'collect' || inputs.scenario == 'all' || inputs.scenario == 'all-offline' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read # checkout; the run-PR push goes to the scratch remote, never here
      actions: read # list and fetch this run's own synthetic cell artifacts
    env:
      # One synthetic predict fan-out, shared by the seeding, the artifact
      # names, and the assertions. The run and event ids are fixed literals
      # because the fixture corpus is deterministic; the seed step fails
      # loudly if the fixture's ca9/103 case stops producing this event.
      CELL_RUN_ID: 20260401T000000Z
      CELL_EVENT: evt-appeal-disposition
      # Stands in for the App token input. Not a credential: its only job is
      # to key the push-diversion rewrite below.
      PLACEHOLDER_TOKEN: collect-scenario-placeholder-token
      # Stands in for the CourtListener token input. Long enough to arm the
      # secret scan's literal-containment detector (short known-secret values
      # are skipped), so the scan proves the run's added files do NOT contain
      # the "credential" instead of passing vacuously with no needle at all.
      SCAN_NEEDLE: collect-scenario-synthetic-scan-needle
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history: the composite branches the run PR from a freshly
          # fetched origin/main and pushes that history to the scratch
          # remote, which a shallow clone cannot serve.
          fetch-depth: 0

      - uses: ./.github/actions/setup-python-env

      # Three production-shaped cells over the deterministic fixture corpus —
      # two ready (claude, codex) and one salvage (gemini: valid output, agent
      # stopped early) — each in its own status.json + data/ layout, exactly
      # what a cell workflow uploads. The cell workflows stamp every produced
      # prediction.json with its process version post-agent, so a cell
      # reaching collect is a *stamped* cell; the fixtures are stamped the
      # same way, keeping collect's validate gate on production-shaped input
      # (collect itself is stamp-agnostic).
      - name: Seed the synthetic cells
        id: seed
        run: |
          set -euo pipefail
          fixtures="$RUNNER_TEMP/collect-fixtures"
          export FEDCOURTS_CORPUS_ROOT="$fixtures/corpus"
          uv run fedcourts make-fixture-corpus --out "$fixtures/corpus/corpus.db"

          for actor in claude-baseline codex-baseline gemini-baseline; do
            cell="$fixtures/cells/predict-${actor}-ca9-103-${CELL_EVENT}"
            export FEDCOURTS_DATA_ROOT="${cell}/data"
            uv run fedcourts local-cascade --court ca9 --docket 103 \
              --engine stub --predictor "$actor" --run-id "$CELL_RUN_ID" \
              --require-predictions
            uv run fedcourts stamp-cell --court ca9 --docket 103 \
              --event "$CELL_EVENT" --run-id "$CELL_RUN_ID" \
              --role predictor --actor "$actor"
            # Fixture-drift guard: stamp-cell no-ops on a missing artifact, so
            # assert the stamped prediction really exists at the event id the
            # artifact names and assertions are keyed on.
            test -f "${cell}/data/cases/ca9/103/events/${CELL_EVENT}/predictions/${actor}/${CELL_RUN_ID}/prediction.json"
            agent_ok=true
            if [ "$actor" = gemini-baseline ]; then agent_ok=false; fi
            jq -n --arg actor "$actor" --arg event "$CELL_EVENT" \
              --arg run_id "$CELL_RUN_ID" --argjson agent_ok "$agent_ok" \
              '{court:"ca9",docket:103,event_id:$event,actor:$actor,run_id:$run_id,produced:true,validated:true,agent_ok:$agent_ok}' \
              > "${cell}/status.json"
          done

          # The lost cell: it must exist on the run (the downloader lists it)
          # but its download is forced to fail, so its content is never read —
          # a placeholder file is enough, and keeps the loss distinguishable
          # from the never-uploaded cell below.
          lost="$fixtures/cells/predict-claude-baseline-ca9-101-${CELL_EVENT}"
          mkdir -p "$lost"
          echo "download is forced to fail; this content is never read" \
            > "$lost/placeholder.txt"

          # The plan matrix — what the run was *supposed* to produce: the
          # three delivered cells, the lost cell, and one queued cell (codex
          # on ca9/101) that neither uploads nor is listed as lost, which the
          # census must therefore call never-uploaded.
          matrix=$(jq -nc --arg event "$CELL_EVENT" --arg run_id "$CELL_RUN_ID" \
            '{include:[
              {predictor_id:"claude-baseline",court:"ca9",docket:103,event_id:$event,run_id:$run_id},
              {predictor_id:"codex-baseline",court:"ca9",docket:103,event_id:$event,run_id:$run_id},
              {predictor_id:"gemini-baseline",court:"ca9",docket:103,event_id:$event,run_id:$run_id},
              {predictor_id:"claude-baseline",court:"ca9",docket:101,event_id:$event,run_id:$run_id},
              {predictor_id:"codex-baseline",court:"ca9",docket:101,event_id:$event,run_id:$run_id}
            ]}')
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"

      # One artifact per cell, named exactly as the cell workflows name theirs
      # (`<role>-<actor>-<court>-<docket>-<event>`): the composite keys its
      # download on the `predict-` prefix, and the census rebuilds these names
      # from matrix identities to classify a lost artifact.
      - name: Upload the ready claude cell
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: predict-claude-baseline-ca9-103-${{ env.CELL_EVENT }}
          path: ${{ runner.temp }}/collect-fixtures/cells/predict-claude-baseline-ca9-103-${{ env.CELL_EVENT }}
          if-no-files-found: error
          retention-days: 1
          # `gh run rerun --failed` is the advertised recovery for a red
          # `all` run and artifacts persist across attempts; without
          # overwrite the rerun 409s at this upload before reaching the
          # assertions. Scaffolding, not the contract under test.
          overwrite: true

      - name: Upload the ready codex cell
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: predict-codex-baseline-ca9-103-${{ env.CELL_EVENT }}
          path: ${{ runner.temp }}/collect-fixtures/cells/predict-codex-baseline-ca9-103-${{ env.CELL_EVENT }}
          if-no-files-found: error
          retention-days: 1
          # `gh run rerun --failed` is the advertised recovery for a red
          # `all` run and artifacts persist across attempts; without
          # overwrite the rerun 409s at this upload before reaching the
          # assertions. Scaffolding, not the contract under test.
          overwrite: true

      - name: Upload the salvage gemini cell
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: predict-gemini-baseline-ca9-103-${{ env.CELL_EVENT }}
          path: ${{ runner.temp }}/collect-fixtures/cells/predict-gemini-baseline-ca9-103-${{ env.CELL_EVENT }}
          if-no-files-found: error
          retention-days: 1
          # `gh run rerun --failed` is the advertised recovery for a red
          # `all` run and artifacts persist across attempts; without
          # overwrite the rerun 409s at this upload before reaching the
          # assertions. Scaffolding, not the contract under test.
          overwrite: true

      - name: Upload the cell whose download will be forced to fail
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: predict-claude-baseline-ca9-101-${{ env.CELL_EVENT }}
          path: ${{ runner.temp }}/collect-fixtures/cells/predict-claude-baseline-ca9-101-${{ env.CELL_EVENT }}
          if-no-files-found: error
          retention-days: 1
          # `gh run rerun --failed` is the advertised recovery for a red
          # `all` run and artifacts persist across attempts; without
          # overwrite the rerun 409s at this upload before reaching the
          # assertions. Scaffolding, not the contract under test.
          overwrite: true

      # Every write surface the composite touches, stubbed or diverted before
      # it runs. The gh shim passes `api` and `run` through to the real gh
      # (read-only, ambient token) except the one forced transfer failure,
      # no-ops `auth`, answers the PR queries from its own ledger, and fails
      # loudly on anything unstubbed — so a composite change that grows a new
      # write surface breaks this scenario instead of reaching the network.
      # The URL rewrite sends the composite's push — addressed to github.com
      # with the placeholder token — into a bare scratch repo on the runner.
      - name: Divert every write surface to runner-local stubs
        run: |
          set -euo pipefail
          shim="$RUNNER_TEMP/collect-shim"
          mkdir -p "$shim"
          printf '%s\n' "predict-claude-baseline-ca9-101-${CELL_EVENT}" > "$shim/lost-artifact"
          : > "$shim/log"
          : > "$shim/prs.tsv"
          command -v gh > "$shim/real-gh"
          cat > "$shim/gh" <<'SHIM'
          #!/usr/bin/env bash
          set -euo pipefail
          here="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          printf 'gh %s\n' "$*" >> "$here/log"
          real="$(cat "$here/real-gh")"
          arg() { # print the value following the given flag, if any
            local flag="$1"; shift
            while [ "$#" -gt 0 ]; do
              if [ "$1" = "$flag" ] && [ "$#" -gt 1 ]; then printf '%s' "$2"; return; fi
              shift
            done
          }
          case "${1-}" in
            api) exec "$real" "$@" ;; # passthrough; the job's permissions block, not this shim, is what caps the token at read
            run)
              if [ "${2-}" = download ] && [ "$(arg --name "$@")" = "$(cat "$here/lost-artifact")" ]; then
                echo "shim: forcing a transfer failure for $(arg --name "$@")" >&2
                exit 1
              fi
              exec "$real" "$@" ;; # passthrough; capped at read by the job's permissions block
            auth) exit 0 ;; # leave git credential-less; the push is diverted anyway
            pr)
              case "${2-}" in
                list)
                  if [ "$(arg --state "$@")" = all ]; then echo 0; exit 0; fi
                  awk -v b="$(arg --head "$@")" '$1 == b { print $2 }' "$here/prs.tsv"
                  exit 0 ;;
                create)
                  head_branch="$(arg --head "$@")"
                  url="https://prs.invalid/${head_branch}"
                  printf '%s\t%s\n' "$head_branch" "$url" >> "$here/prs.tsv"
                  echo "$url"; exit 0 ;;
                edit|ready|merge) exit 0 ;;
              esac
              echo "gh shim: unstubbed pr subcommand: $*" >&2; exit 64 ;;
          esac
          echo "gh shim: unstubbed command: $*" >&2
          exit 64
          SHIM
          chmod +x "$shim/gh"
          echo "$shim" >> "$GITHUB_PATH"

          scratch="$RUNNER_TEMP/collect-scratch.git"
          git init --bare -q "$scratch"
          git config --global \
            "url.file://${scratch}.insteadOf" \
            "https://x-access-token:${PLACEHOLDER_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # The commit identity the caller workflows normally configure from
          # the App token; commits only ever reach the scratch remote.
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # First pass: the shim forces the claude ca9/101 artifact's download to
      # fail, so this collects 3 of the 4 listed artifacts and must degrade
      # per-cell, not per-run.
      - name: Collect the synthetic run
        uses: ./.github/actions/collect-run
        with:
          role: predict
          token: ${{ env.PLACEHOLDER_TOKEN }}
          repo: ${{ github.repository }}
          # A synthetic trigger-issue number, not a reference to any real
          # issue: the census assertions below need a non-zero issue to prove
          # the ready PR withholds its close, and the stubbed gh never posts
          # it anywhere.
          issue: "987654321"
          matrix: ${{ steps.seed.outputs.matrix }}
          github-token: ${{ github.token }}
          courtlistener-token: ${{ env.SCAN_NEEDLE }}

      - name: Assert per-cell degradation, the census, and the gates
        run: |
          set -euo pipefail
          shim="$RUNNER_TEMP/collect-shim"
          scratch="$RUNNER_TEMP/collect-scratch.git"
          ready_branch="predict/run-${CELL_RUN_ID}"
          partial_branch="predict/run-${CELL_RUN_ID}-partial"
          ready_url="https://prs.invalid/${ready_branch}"
          partial_url="https://prs.invalid/${partial_branch}"
          lost="predict-claude-baseline-ca9-101-${CELL_EVENT}"
          fail() { echo "::error::$1"; exit 1; }

          # The forced loss cost exactly one cell, and the downloader named it.
          [ "$(cat missing-artifacts.txt)" = "$lost" ] \
            || fail "the downloader should have lost exactly ${lost}"

          # The census tells the lost artifact from the never-uploaded cell.
          jq -e --arg evt "$CELL_EVENT" '.ready.artifact_dirs == [
              "predict-claude-baseline-ca9-103-" + $evt,
              "predict-codex-baseline-ca9-103-" + $evt
            ] and .ready.draft == false' collect-plan.json > /dev/null \
            || fail "the ready PR should carry exactly the two clean cells"
          jq -e --arg evt "$CELL_EVENT" \
            '.partial.artifact_dirs == ["predict-gemini-baseline-ca9-103-" + $evt]
             and .partial.draft == true' collect-plan.json > /dev/null \
            || fail "the salvage cell should ride the draft PR"
          jq -e --arg lost "$lost" '.missing_artifacts == [$lost]' collect-plan.json > /dev/null \
            || fail "the plan should name the lost artifact"
          jq -e --arg evt "$CELL_EVENT" '.uncovered_cells == [
              {actor:"codex-baseline",court:"ca9",docket:101,event_id:$evt}
            ]' collect-plan.json > /dev/null \
            || fail "the census should name the queued cell that never uploaded"
          jq -e '(.ready.body | contains("Closes #") | not)
             and (.ready.body | contains("did not transfer"))
             and (.ready.body | contains("uploaded nothing at all"))' collect-plan.json > /dev/null \
            || fail "the ready PR body should disclose both gaps and withhold the issue close"
          jq -e '.facts_only == null and .stalled == false and .dead_actors == []' \
            collect-plan.json > /dev/null \
            || fail "a run with ready cells is neither stalled nor facts-only"

          # The pushes landed on the scratch remote: both run branches, and
          # nothing else, with the right cells on each.
          [ "$(git -C "$scratch" for-each-ref --format='%(refname:short)' refs/heads \
              | sort | paste -sd' ')" = "$ready_branch $partial_branch" ] \
            || fail "the scratch remote should hold exactly the ready and draft branches"
          ready_tree=$(git -C "$scratch" ls-tree -r --name-only "$ready_branch")
          for path in \
            "data/cases/ca9/103/events/${CELL_EVENT}/predictions/claude-baseline/${CELL_RUN_ID}/prediction.json" \
            "data/cases/ca9/103/events/${CELL_EVENT}/predictions/codex-baseline/${CELL_RUN_ID}/prediction.json" \
            "data/cases/ca9/103/events/${CELL_EVENT}/predictions/gemini-baseline/${CELL_RUN_ID}/attempt.json" \
            "data/cases/ca9/101/events/${CELL_EVENT}/predictions/codex-baseline/${CELL_RUN_ID}/attempt.json"; do
            grep -qx "$path" <<< "$ready_tree" || fail "ready branch is missing ${path}"
          done
          if grep -q "gemini-baseline/${CELL_RUN_ID}/prediction.json" <<< "$ready_tree"; then
            fail "the salvage cell's prediction must not ride the auto-merging ready PR"
          fi
          if grep -q "cases/ca9/101/.*/prediction.json" <<< "$ready_tree"; then
            fail "a lost cell's content cannot appear anywhere (it never downloaded)"
          fi
          # A transfer loss is re-collectable, not a cell failure: no fact.
          if grep -q "claude-baseline/${CELL_RUN_ID}/attempt.json" <<< "$ready_tree"; then
            fail "a lost artifact must not record a cell-failure fact"
          fi
          partial_tree=$(git -C "$scratch" ls-tree -r --name-only "$partial_branch")
          grep -qx "data/cases/ca9/103/events/${CELL_EVENT}/predictions/gemini-baseline/${CELL_RUN_ID}/prediction.json" \
            <<< "$partial_tree" \
            || fail "the draft branch should carry the salvage cell's output"

          # The PR surface: one PR per branch, auto-merge armed only on ready.
          [ "$(grep -c '^gh pr create' "$shim/log")" = 2 ] \
            || fail "expected exactly two PR creations"
          grep -q "^gh pr merge --auto --squash ${ready_url}\$" "$shim/log" \
            || fail "auto-merge should be enabled on the ready PR"
          if grep -q "merge --auto --squash ${partial_url}\$" "$shim/log"; then
            fail "a draft PR must never arm auto-merge"
          fi

          # Snapshot for the idempotency pass, mark the shim log so the second
          # pass's calls are separable, and restore the trigger-ref working
          # tree a real rerun would start from (the composite left it on the
          # draft branch).
          git -C "$scratch" rev-parse "${ready_branch}^{tree}" "${partial_branch}^{tree}" \
            > "$RUNNER_TEMP/trees-first.txt"
          cp collect-plan.json "$RUNNER_TEMP/plan-first.json"
          echo "--- rerun ---" >> "$shim/log"
          git checkout -q --detach "$GITHUB_SHA"

      # Second pass, identical inputs: `gh run rerun --failed` is the
      # documented recovery for a transfer failure, so collect must be safe
      # to repeat — same branch trees, same plan, find-and-update instead of
      # a second PR.
      - name: Collect the synthetic run again (the rerun recovery path)
        uses: ./.github/actions/collect-run
        with:
          role: predict
          token: ${{ env.PLACEHOLDER_TOKEN }}
          repo: ${{ github.repository }}
          # A synthetic trigger-issue number, not a reference to any real
          # issue: the census assertions below need a non-zero issue to prove
          # the ready PR withholds its close, and the stubbed gh never posts
          # it anywhere.
          issue: "987654321"
          matrix: ${{ steps.seed.outputs.matrix }}
          github-token: ${{ github.token }}
          courtlistener-token: ${{ env.SCAN_NEEDLE }}

      - name: Assert the rerun is idempotent
        run: |
          set -euo pipefail
          shim="$RUNNER_TEMP/collect-shim"
          scratch="$RUNNER_TEMP/collect-scratch.git"
          ready_branch="predict/run-${CELL_RUN_ID}"
          partial_branch="predict/run-${CELL_RUN_ID}-partial"
          ready_url="https://prs.invalid/${ready_branch}"
          partial_url="https://prs.invalid/${partial_branch}"
          fail() { echo "::error::$1"; exit 1; }

          # Whole-tree comparison, and both passes branch from a freshly
          # fetched origin/main — so a merge to main landing between the two
          # passes moves both branches' bases and fails this spuriously. Read
          # that failure as "main moved" and re-dispatch, not "collect broke".
          git -C "$scratch" rev-parse "${ready_branch}^{tree}" "${partial_branch}^{tree}" \
            > "$RUNNER_TEMP/trees-second.txt"
          cmp -s "$RUNNER_TEMP/trees-first.txt" "$RUNNER_TEMP/trees-second.txt" \
            || fail "the rerun changed a run branch's content (or main moved mid-scenario; re-dispatch)"
          cmp -s "$RUNNER_TEMP/plan-first.json" collect-plan.json \
            || fail "the rerun changed the collect plan"

          rerun=$(sed -n '/^--- rerun ---$/,$p' "$shim/log")
          if grep -q '^gh pr create' <<< "$rerun"; then
            fail "the rerun opened a second PR instead of updating the first"
          fi
          grep -q "^gh pr edit ${ready_url} " <<< "$rerun" \
            || fail "the rerun should update the ready PR in place"
          grep -q "^gh pr edit ${partial_url} " <<< "$rerun" \
            || fail "the rerun should update the draft PR in place"
          grep -q "^gh pr ready --undo ${partial_url}\$" <<< "$rerun" \
            || fail "the rerun must return the salvage PR to a draft"
          grep -q "^gh pr merge --auto --squash ${ready_url}\$" <<< "$rerun" \
            || fail "the rerun should re-arm auto-merge on the ready PR"

          {
            echo ""
            echo "## Collect over synthetic cells"
            echo ""
            echo "- collected 3 of 4 listed artifacts; the forced loss cost one cell, not the run"
            echo "- ready PR: 2 cells, auto-merge armed, issue close withheld (1 lost artifact, 1 never-uploaded cell)"
            echo "- draft PR: 1 salvage cell; failure facts recorded for the salvage and never-uploaded cells only"
            echo "- rerun: identical branch trees and plan; PRs updated in place, none duplicated"
          } >> "$GITHUB_STEP_SUMMARY"

