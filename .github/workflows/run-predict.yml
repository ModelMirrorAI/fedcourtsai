name: run-predict

# The predict stage's own lane. Fans out over every enabled predictor x open
# event and runs the matching coding agent. The agent only writes files; each
# cell uploads its output as an artifact and the `collect` job aggregates the
# whole run into one PR it merges when green (plus a draft PR for any partial
# output).
# See docs/pipeline.md.
#
# One way in, and it names no cases: the **schedule** (and its on-demand
# `workflow_dispatch` twin) derives its own fan-out from the corpus-level
# predict backlog — the forecasts committed state still owes. Level-triggered by
# construction: the scan reads committed ledger state, so a round that failed,
# was declined, or never ran is simply re-derived next cycle, and no trigger has
# to be re-filed for it.
#
# The trigger decides only *when* a round derives; it never names its cases. Two
# dispatches arrive without a human: `run-pull`'s `chain-predict` job, when a
# pull window commits a forecast-relevant change, and this workflow's own
# `chain` job, when a cap stopped a round short of the backlog. Both are the same input-less dispatch.
# What decides whether a round spends is the `review` hold: every run renders its
# plan report and waits on that environment's required reviewers before a cell
# spends a token, unless its plan is within the auto-release caps and budget
# (`config/review-hold.yaml`).
on:
  schedule:
    # Twice a day, each slot margined after one of run-pull's ingestion windows
    # so a round reads a corpus the day's writer has finished with. The pull
    # windows run at :17 past 01/07/13/19 capped at 45 minutes (13:17 -> 14:02)
    # and the live windows at :47 past every even hour capped at 40 (16:47 ->
    # 17:27), so :12 past 14 and :32 past 17 each open after a window has
    # committed and before the next live window (14:47, 18:47). This job only
    # ever *reads* the corpus and takes no `corpus-write` lock, so an overlap
    # would cost nothing but a staler read; the slots open clear of one, though
    # a slow pull inside this job's own 30-minute cap can still run into
    # run-seed's 14:31 walk and the 14:47 live window. The minutes are off
    # every other workflow's (:00, :13, :17, :27, :30, :31, :39, :41, :47, :53)
    # so the repo's offset grid stays legible.
    #
    # Two slots, not sixteen — one per ingestion channel's freshest window rather
    # than one per window. Two things size the lane and neither is the cron:
    # the derivation's per-cycle cap, and the serializing group below, which
    # queues a round behind one still holding the review hold — so a faster
    # cadence buys drain rate only while a human releases holds at the same rate.
    #
    # GitHub delivers `schedule` events best-effort: a slot can be delayed or
    # dropped with no record, and a newly registered cron sometimes never
    # indexes until the file changes again on the default branch. A missed slot
    # costs half a day's drain, nothing else (the backlog is level-triggered);
    # the input-less dispatch below is the manual twin that drains it on demand.
    - cron: "12 14 * * *"
    - cron: "32 17 * * *"
  # The same derivation, on demand — for a backlog that should drain now rather
  # than at the next window. Deliberately input-less: the backlog is the only
  # case list this workflow has, and a run that wants to spend on hand-picked
  # cases is a `predict-plan` reading plus a maintainer's judgement, not a
  # trigger input that would reintroduce an unauthenticated case list.
  workflow_dispatch:

permissions: {}

# One predict round at a time, across both triggers — a per-workflow group,
# because neither a schedule nor a dispatch carries anything to key on.
#
# Serializing is load-bearing, not tidiness: two concurrent rounds would derive
# overlapping backlogs. It does not, on its own, cover the window the
# already-predicted gate is blind to: that gate reads *committed* state, so a
# round whose collect PR has not merged is invisible to it, and the next round
# plans the moment this group releases — minutes after the previous one ended,
# and long before its PR merges. The stranded-run guard below is what covers
# that window; this group covers the overlapping one.
#
# `cancel-in-progress: false` protects the *running* round, not the queue behind
# it: GitHub holds at most one pending run per group, and a third arrival
# supersedes the one that was waiting. Read that against the review hold, which
# can park a round for days — every round here is level-triggered and loses
# nothing when its successor replaces it in the queue, since the backlog it
# would have drained is re-derived by whichever round does run.
concurrency:
  group: run-predict
  cancel-in-progress: false

jobs:
  # The run gate (src/fedcourtsai/run_gate.py): a dispatch, or a re-run of any
  # run, proceeds only for a login config/dispatchers.json names. No
  # environment, no secret, a read-only token, and no project code: a sparse
  # checkout of the gate and its allow-list alone, run by path with the
  # runner's Python in isolated mode. Every other job needs this one and checks
  # the attempt it judged, because re-running some jobs does not re-run this
  # one; `run-gate` below fails the run when that check refused.
  authorize:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      attempt: ${{ steps.decide.outputs.attempt }}
      rerunners: ${{ steps.decide.outputs.rerunners }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            src/fedcourtsai/run_gate.py
            config/dispatchers.json
          sparse-checkout-cone-mode: false
      - name: Authorize who started this run
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: >-
          python3 -I -S src/fedcourtsai/run_gate.py --workflow run-predict.yml
          --event-name "$EVENT_NAME" --actor "$ACTOR"
          --triggering-actor "$TRIGGERING_ACTOR" --run-attempt "$RUN_ATTEMPT"
          --github-output "$GITHUB_OUTPUT"

  plan:
    needs: [authorize]
    if: >-
      ${{ needs.authorize.result == 'success'
      && (needs.authorize.outputs.attempt == github.run_attempt
      || contains(needs.authorize.outputs.rerunners, format(',{0},', github.triggering_actor))) }}
    runs-on: ubuntu-24.04
    # The job pulls the whole corpus and then walks every open SCOTUS event
    # TWICE — once to mint the matrix and once for the plan report the hold is
    # judged on — unattended, holding the serializing group throughout. So a
    # hung pull would otherwise burn the six-hour job default *and* block the
    # next round behind it. This is a bound on that hang, not a performance
    # budget: the walk is minutes rather than seconds on a corpus this size, and
    # killing a round that is legitimately still deriving costs a cycle for no
    # gain. 45 minutes admits pull-plus-two-walks with room, and still sits
    # inside the read-only role's default one-hour credential — which only the
    # pull needs, since both walks read the pulled file locally.
    timeout-minutes: 45
    environment: prod
    # This environment's corpus estate as one base URL: the index remote and
    # the per-case content store are fixed segments beneath it, and addressing
    # the store is the corpus-split mode. The matrix scope backstop needs it —
    # the bare-opinion-import exclusion fetches the case's latest snapshot,
    # which lives only in the store (the index carries no snapshots) — and the
    # backlog derivation's provisioning probe reads the same store.
    env:
      FEDCOURTS_CORPUS_BASE_URL: ${{ vars.CORPUS_BASE_URL }}
    permissions:
      contents: read
      id-token: write # assume the AWS role for the corpus pull (read-only)
      # List recent runs and their cell artifacts for the stranded-run guard below
      # (repo-wide read of run metadata and artifact *names*; the plan job runs no
      # agent code and downloads no artifact).
      actions: read
      # The guard's other read: whether this lane's collect PR has merged. Read
      # of PR metadata — number, head ref, state — and no write, on a job that
      # runs no agent code and opens, comments on and reviews nothing. It is the
      # narrowest scope that answers the question, since the merge state of a
      # branch this job may not fetch is not visible through `contents: read`.
      pull-requests: read
      # Count the rounds auto-released in the trailing 24 hours: each one left a
      # deployment to the `review-auto` environment. Read only; the job creates
      # no deployment. The commits the count is also read from are `main`'s
      # history, which `contents: read` above already covers.
      deployments: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_jobs: ${{ steps.plan.outputs.has_jobs }}
      # The plan-time run id names this round's collect branch, which the
      # `chain` job waits on before it dispatches the next round.
      run_id: ${{ steps.plan.outputs.run_id }}
      auto_release: ${{ steps.hold.outputs.auto_release }}
      drain_more: ${{ steps.hold.outputs.drain_more }}
    steps:
      # No authorization gate here, and none is missing: this workflow carries no
      # trigger an outside actor can reach. A `schedule` fires only from the
      # DEFAULT branch, so it can run only what a maintainer-approved promotion put
      # on `main`; a `workflow_dispatch` is gated by GitHub on repository write;
      # and this job binds `prod`, whose deployment branches are restricted to
      # `main`, so a dispatch from any other ref is refused before a step runs.
      # The `review` hold still stands between this plan and any spend, on both
      # triggers alike. (SECURITY.md -> *Trigger surface* carries the same
      # reasoning for every lane.)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python-env
        with:
          restore-cache: "false"

      # The backlog derivation is a whole-court read shape — one pass over every
      # open event plus a row per candidate case, tens of thousands of them —
      # which a pulled corpus serves in seconds and a read-in-place backend would
      # serve as a range-request storm. So pull the whole index. The default
      # role duration is right, and stays right at the 45-minute job cap: the
      # walks that follow read the pulled file locally, so nothing needs the
      # credential after this step returns. `predict-matrix` refuses a non-local
      # backend for this scan rather than performing it slowly, so getting this
      # step wrong fails the plan loudly instead of quietly costing an hour.
      # (The cell jobs below read ranged, through their own sidecar: point
      # lookups for one case are the opposite shape.)
      - uses: ./.github/actions/corpus-readonly
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME_READONLY }}
          aws-region: ${{ vars.AWS_REGION }}
          corpus-base-url: ${{ vars.CORPUS_BASE_URL }}

      # The stranded-run guard's census. A cell spends its tokens *before*
      # `collect`, the run's single durability step, and the already-predicted
      # gate reads *committed* state on `main` — so every run between "the cells
      # spent their tokens" and "the collect PR merged" is invisible to it, and
      # the next scheduled round re-derives the same events and re-spends the
      # identical run. Three ways a run sits in that gap: `collect` failed, its
      # PR is open (auto-merge waiting on checks, or a draft), or it concluded
      # success having pushed no branch at all, which is what the secret scan's
      # withhold looks like from outside. This lists recent runs' cell artifacts
      # with the two facts that tell those apart — whether `collect` succeeded,
      # and the run's own window — plus this lane's collect PRs; the matrix step
      # below withholds the cells and names the remedy for each.
      #
      # The join between a run and its PR is that window: the pipeline run id in
      # the PR's head ref (`predict/run-<run_id>`) is minted by the run's own
      # `plan` job, so it necessarily falls inside the run's window, and nothing
      # else either API returns carries it. Sound rather than exact — a queued
      # run's window can contain a neighbour's stamp too — so the decision step
      # resolves every ambiguity the safe way.
      #
      # Fetch and filter only — the decision lives in the tested `predict-matrix`
      # command. Fail-open by construction, at three grains (see the shell
      # below): an unreadable run drops out of the census, an unreadable PR
      # listing disarms the collect-PR arm alone, and a failure leaving nothing
      # usable empties the census. The failure this guard prevents is expensive,
      # not dangerous, so it must never be the reason a legitimate run does not
      # start.
      - name: Census the cell artifacts of recent runs that have not landed
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          echo '[]' > stranded-artifacts.json
          rm -f collect-prs.json
          # Three degradation grains. `degraded` is the whole-guard one: nothing
          # usable was fetched, so withhold nothing. `skipped` loses one run's
          # cells from the census and keeps the rest — a flake on the seventh
          # candidate must not discard the six good ones and re-spend them.
          # `pr_arm_off` loses only the half that judges a run whose `collect`
          # succeeded, leaving the uncollected half armed.
          degraded() {
            echo '[]' > stranded-artifacts.json
            rm -f collect-prs.json
            echo "::warning::stranded-run guard degraded — $1; this plan proceeds unguarded and may re-mint cells that already ran"
            exit 0
          }
          skipped() {
            echo "::warning::stranded-run guard skipped a run — $1; that run's cells may be re-minted"
          }
          # The ABSENCE of the file is what disarms that arm, never an empty
          # list: an empty list is a claim (this lane has no collect PR), and a
          # plan that believed it would read every collected run as having
          # pushed nothing and withhold every cell it ever produced.
          pr_arm_off() {
            rm -f collect-prs.json
            echo "::warning::stranded-run guard's collect-PR arm is off — $1; a run whose collect PR has not merged reads as landed, so its cells may be re-minted"
          }
          # One fetch, three attempts, backoff — the shape (and the reason) of
          # the collect action's artifact listing: a single transient 502 here
          # would silently turn the guard off and re-spend a whole fan-out.
          # `< /dev/null` because this runs inside a loop whose stdin IS the
          # candidate list, and a command that read it would swallow the rest.
          api() {
            out=$1
            shift
            for attempt in 1 2 3; do
              if gh api "$@" > "$out" < /dev/null; then
                return 0
              fi
              sleep $((attempt * 3))
            done
            return 1
          }
          # Bounded candidate set: one page of recent completed runs, narrowed to
          # a 48-hour window — the window is the real bound, and the page is sized
          # so a day's predict cycles cannot push a stranded run out of view
          # before the re-queue it must catch. CUTOFF travels as jq's environment
          # rather than being interpolated into the query program. The window's
          # lower bound is the EARLIER of creation and start: `run_started_at`
          # resets on a re-run, and rerunning `collect` is this guard's own
          # remedy, so taking it alone would move the window past the run id its
          # first attempt already minted — and the recovered run would then read
          # as having pushed no branch at all, which is the one verdict that
          # names a hand salvage.
          CUTOFF=$(date -u -d '48 hours ago' +%Y-%m-%dT%H:%M:%SZ) \
            || degraded "could not compute the lookback window"
          export CUTOFF
          # This lane's collect PRs to `main`, open and settled alike: a merged
          # one releases its run, an open one withholds it, and a run with none
          # at all pushed no branch. The API has no head-prefix filter, so this
          # asks for one page of PRs to `main`, newest first, and narrows here.
          #
          # Two filters, both load-bearing. The head must live in THIS
          # repository: the listing includes fork PRs, whose `head.ref` is the
          # fork's own branch name with no owner in it, so on a public repo a
          # branch named `predict/run-<stamp>` on anyone's fork would otherwise
          # read as this run's collect PR and withhold a legitimate round —
          # fail-CLOSED, the one direction this guard must never take. Pushing a
          # branch to this repository needs write, so the same-repo conjunct is
          # what makes the head ref trustworthy, exactly as ci.yml's `main-base`
          # jail requires it of a head before believing its name. Then the head
          # must be a run branch of this lane.
          #
          # Projected to the four fields the decision needs, in the fetch rather
          # than after it, so the PR *bodies* — which carry rolled-up agent flag
          # text on this lane — never land in the plan job's workspace at all.
          # The page is trusted only when its oldest row predates the census
          # window, since a page that stopped short would report a run's PR as
          # absent and withhold cells that had in fact landed; that reading is
          # taken over the whole page, before the narrowing, and as a `min`
          # rather than off the last row, so it does not rest on the API having
          # honoured the sort. Both `select`s read through `// ""` so a row the
          # API returns without the field drops itself rather than raising and
          # taking the whole arm off.
          if api collect-prs-raw.json \
               "repos/${REPO}/pulls?base=main&state=all&sort=created&direction=desc&per_page=100" \
               --jq '{oldest: (([.[].created_at] | min) // ""), prs: [.[] | select((.head.repo.full_name // "") == env.REPO) | select((.head.ref // "") | startswith("predict/run-")) | {number, head_ref: .head.ref, head_repo: .head.repo.full_name, is_open: (.state == "open"), merged: (.merged_at != null)}]}'; then
            # `|| true` so a jq failure reads as no coverage rather than tripping
            # errexit: this whole step must never be the reason a round does not
            # start, and an assignment is the one context where a failed
            # substitution would exit under `set -e`.
            oldest=$(jq -r '.oldest // ""' collect-prs-raw.json || true)
            if [ -z "$oldest" ] || [[ "$oldest" > "$CUTOFF" ]]; then
              pr_arm_off "could not establish that the PR listing reaches back past the census window"
            elif ! jq '.prs' collect-prs-raw.json > collect-prs.json; then
              pr_arm_off "could not read the PR listing"
            fi
          else
            pr_arm_off "could not list this lane's pull requests"
          fi
          api candidate-runs.tsv "repos/${REPO}/actions/workflows/run-predict.yml/runs?status=completed&per_page=50" \
            --jq '.workflow_runs[] | select(.created_at > env.CUTOFF) | [.id, ([.created_at, (.run_started_at // .created_at)] | min), .updated_at] | @tsv' \
            || degraded "could not list this workflow's recent runs"
          : > census.ndjson
          while IFS=$'\t' read -r run started updated; do
            [ -n "$run" ] || continue
            # Did any `collect` job on that run conclude success? `filter=latest`
            # is the default made explicit, and it is what makes the guard
            # release itself: a run recovered by rerunning `collect` reads as
            # collected, and lands once its PR merges. Paginated, because a
            # full-width run's cell jobs push `collect` off page one.
            if ! api collect-conclusions.txt --paginate \
                 "repos/${REPO}/actions/runs/${run}/jobs?per_page=100&filter=latest" \
                 --jq '.jobs[] | select(.name == "collect") | .conclusion'; then
              skipped "could not read run ${run}'s jobs"
              continue
            fi
            collected=false
            if grep -qx success collect-conclusions.txt; then
              collected=true
            fi
            if ! api artifact-names.txt --paginate \
                 "repos/${REPO}/actions/runs/${run}/artifacts?per_page=100" \
                 --jq '.artifacts[] | select(.expired == false) | select(.name | startswith("predict-")) | .name'; then
              skipped "could not list run ${run}'s artifacts"
              continue
            fi
            jq -R --argjson run "$run" --argjson collected "$collected" \
               --arg started "$started" --arg updated "$updated" \
               '{run_db_id: $run, artifact_name: ., collect_succeeded: $collected,
                 run_started_at: $started, run_updated_at: $updated}' artifact-names.txt \
              >> census.ndjson || degraded "could not record run ${run}'s cell artifacts"
          done < candidate-runs.tsv
          jq -s '.' census.ndjson > stranded-artifacts.json \
            || degraded "could not assemble the census"
          echo "candidate cell artifact(s): $(jq 'length' stranded-artifacts.json)"
          echo "collect PR(s) in view: $(jq 'length' collect-prs.json 2>/dev/null || echo 'arm off')"

      - name: Build predictor x case x event matrix
        id: plan
        run: |
          set -euo pipefail
          run_id=$(date -u +%Y%m%dT%H%M%SZ)
          # No case list is passed, and that is the request: given no --body-file
          # and no --court/--docket, `predict-matrix` derives the cases from the
          # corpus-level predict backlog itself.
          # --stranded-file: withhold any cell whose output already sits in a
          # run that has not landed (the census above; an empty or absent file
          # is the guard off). --collect-prs-file: what tells a collected run
          # that landed from one whose PR is still open or was never pushed; an
          # absent file is that arm off, which the census step writes by
          # deleting it. --stranded-note-file: the command writes it only when
          # that withholds *every* cell, so the file is the marker the summary
          # below branches on — an empty matrix must say "recover that run"
          # rather than read as a drained backlog, and the two are identical
          # from the count alone.
          matrix=$(uv run fedcourts predict-matrix --run-id "$run_id" \
            --stranded-file stranded-artifacts.json \
            --collect-prs-file collect-prs.json \
            --stranded-note-file stranded-note.md)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          # Kept for the hold decision, which refuses to auto-release unless this
          # minted matrix holds exactly the cells the plan below prices.
          printf '%s\n' "$matrix" > matrix.json
          # The report step re-derives the plan under this same id: the run id
          # is the join key between the approval record and the committed
          # prediction paths, so the two invocations must not mint their own.
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          count=$(echo "$matrix" | jq '.include | length')
          if [ "$count" -gt 0 ]; then
            echo "has_jobs=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_jobs=false" >> "$GITHUB_OUTPUT"
          fi
          # Ops analytics: record the planned fan-out in the Actions UI.
          echo "## run-predict — queued ${count} prediction job(s)" >> "$GITHUB_STEP_SUMMARY"
          # The step summary is the whole record — there is no trigger issue to
          # close with a note — so say what an empty matrix means rather than
          # leaving a bare zero. A drained backlog is the ordinary resting state
          # of a healthy lane, not a fault, and the run ends cleanly on it: the
          # `predict` and `collect` jobs are skipped (`needs` + `has_jobs`) and
          # nothing spends.
          if [ "$count" -eq 0 ]; then
            {
              echo ""
              if [ -s stranded-note.md ]; then
                # The note file is written only when the stranded-run guard
                # withheld EVERY cell, so its presence is the marker that this
                # empty matrix is not a drained backlog — and its body is the
                # guard's own account (the run ids and the remedy), so it is
                # rendered rather than paraphrased: the annotations name what
                # the census skipped, but only the note carries the whole story.
                echo "This matrix is empty because the stranded-run guard withheld every cell, not because the backlog is drained. Every cell this round would have minted already ran in a run whose output has not reached \`main\` — \`collect\` failed, its PR is still open, or it pushed no branch at all — so the tokens are spent and the predictions exist. Those events stay owed until their predictions are committed, so landing that run, not another round, is what clears them; the note below says which of the three it is and names the run and its PR."
                echo ""
                cat stranded-note.md
              else
                echo "The predict backlog is drained: no in-scope, funded, provisioned case with an open forecastable event is missing an enabled predictor's forecast (within this cycle's cap). Nothing to run; no spend — the run ends cleanly here. Anything held rather than owed is counted in this step's log, and re-derived next cycle."
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # The plan report the approval below is judged on: the tested plan
      # command re-derives the same fan-out the matrix step just minted (same
      # helpers, zero spend) and renders per-step counts, the would-mint cell
      # list, and the seam- and engine-conditioned spend estimate. Written to
      # the step summary BEFORE the hold, so the record of what was approved
      # exists whether or not the release ever comes — the pending deployment
      # review links this run, so the summary is the page an approver lands on.
      #
      # This step runs on EVERY round that queued jobs. The report is what the
      # review hold is judged on, so a round that skipped it would ask a
      # maintainer to release a spend with nothing to read.
      - name: Report the plan for approval
        if: ${{ steps.plan.outputs.has_jobs == 'true' }}
        # A second full walk of the backlog, so this is sized like the first
        # rather than like a render: bounded on its own so a wedged step names
        # itself, but left wide enough that the job cap above — not this — is
        # what stops a slow round, which is where the honest message is. One
        # walk measured 14 minutes on a contended developer box against the
        # shipped corpus, so both numbers are sized from that with room, and the
        # first scheduled round's step timings are what confirm them.
        timeout-minutes: 25
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PLAN_RUN_ID: ${{ steps.plan.outputs.run_id }}
        run: |
          set -euo pipefail
          # No case list, exactly as the matrix step above passed none: the plan
          # must re-derive the fan-out that was actually minted, or the plan a
          # maintainer approves is not the run.
          plan_json=$(uv run fedcourts predict-plan \
            --stranded-file stranded-artifacts.json \
            --collect-prs-file collect-prs.json \
            --run-id "$PLAN_RUN_ID" \
            --approval-report plan-report.md \
            --approval-report-run-url "$RUN_URL" 2>plan-stderr.txt) \
            || { cat plan-stderr.txt; exit 1; }
          # Kept for the hold decision below, which reads the same document the
          # report renders, so what auto-releases is what a maintainer would read.
          printf '%s\n' "$plan_json" > plan.json
          cat plan-report.md >> "$GITHUB_STEP_SUMMARY"
          {
            echo ''
            echo '<details><summary>full plan document</summary>'
            echo ''
            echo '```json'
            echo "$plan_json" | jq .
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

      # Whether this round waits on the hold, and whether it owes another round.
      # Both are `fedcourts hold-decision` over the plan document above, the
      # matrix the round minted, `config/review-hold.yaml`'s caps and trailing
      # budget, and the committed spend ledger in this checkout's `data/`
      # (measured spend over tracking.yaml's spend window, the budget's base).
      # It fails closed: with any knob at 0, a matrix that disagrees with the
      # plan, an unreadable ledger, or a 24-hour count this step cannot read,
      # the round waits on the `review` hold. The count is shared with
      # run-evaluate and summarize and has two sources, and the larger binds:
      # the `review-auto` environment's deployments (one per auto-released
      # round of any lane, but prunable by a write holder) and the auto-released
      # commits on `main` (each lane marks a released round's commit; `main`'s
      # history is append-only). A failed read leaves its flag off, which holds.
      # This step only reads; the rule and the summary are the command's.
      - name: Decide the hold and the drain
        id: hold
        if: ${{ steps.plan.outputs.has_jobs == 'true' }}
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          since=$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          count_args=()
          if released=$(gh api "repos/${REPO}/deployments?environment=review-auto&per_page=100" \
                --jq "[.[] | select(.created_at >= \"${since}\")] | length" 2>deploy-read.err) \
             && [[ "$released" =~ ^[0-9]+$ ]]; then
            count_args+=(--deployments-released "$released")
          else
            echo "::warning::could not count review-auto deployments in the last 24h ($(head -c 300 deploy-read.err | tr -s '\n:' '  ')); this round waits on the hold"
          fi
          if gh api --paginate "repos/${REPO}/commits?sha=main&since=${since}&per_page=100" \
                --jq '.[].commit.message | split("\n")[0]' > main-subjects.txt 2>subjects-read.err; then
            count_args+=(--main-subjects-file main-subjects.txt)
          else
            echo "::warning::could not read main's commits from the last 24h ($(head -c 300 subjects-read.err | tr -s '\n:' '  ')); this round waits on the hold"
          fi
          decision=$(uv run fedcourts hold-decision --seam predict --plan-file plan.json \
            --matrix-file matrix.json --summary-file "$GITHUB_STEP_SUMMARY" "${count_args[@]}")
          echo "auto_release=$(jq -r '.auto_release' <<<"$decision")" >> "$GITHUB_OUTPUT"
          echo "drain_more=$(jq -r '.drain_more' <<<"$decision")" >> "$GITHUB_OUTPUT"

  # The hold. This job carries no code, no token, and no permissions — its one
  # purpose is the deployment environment: the `review` environment's required
  # reviewers gate it, so every downstream job that spends (the matrix and the
  # collect writer behind it) waits on an explicit, audit-logged release. The
  # wait happens before the job is scheduled, so timeout-minutes bounds only
  # the no-op itself. The environment must exist WITH required reviewers
  # configured before this reaches main: GitHub auto-creates a referenced
  # environment unprotected, and an unprotected environment is no gate at all.
  #
  # A round the plan job auto-released (`hold-decision`: its minted matrix
  # priced within the per-round cap, under the daily count, and within the
  # trailing budget) binds `review-auto` instead — the environment run-evaluate
  # and summarize route to on the same decision. It has no reviewers on
  # purpose, so the job runs at once; what it adds is one of the two records
  # the next round's plan, in any of the three lanes, counts against the daily
  # cap (the other is the marked collect commit on `main`).
  # Every job downstream reads `approval.result` whichever environment it
  # bound, so the two paths differ only in whether a human released this job.
  #
  # `review-auto` must exist with its deployment branches restricted to `main`
  # and no required reviewers (docs/security.md), so only a `main` run can add
  # to the count; GitHub would otherwise create it on first reference with no
  # branch policy at all.
  approval:
    needs: [authorize, plan]
    if: >-
      ${{ needs.plan.outputs.has_jobs == 'true'
      && needs.authorize.result == 'success'
      && (needs.authorize.outputs.attempt == github.run_attempt
      || contains(needs.authorize.outputs.rerunners, format(',{0},', github.triggering_actor))) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: ${{ needs.plan.outputs.auto_release == 'true' && 'review-auto' || 'review' }}
    permissions: {}
    steps:
      - name: Release the held fan-out
        run: echo "the review hold released — the matrix may spend."

  # A hold that did not release still has to leave a durable record of what was
  # declined, and the record is this job's step summary — rendered onto the same
  # run page as the plan report the decision was made on, so the two read
  # together. `!= 'success'` covers the whole class: the Reject button (a failed
  # deployment), a cancelled or expired wait, and a plan job that died after
  # minting the matrix (approval then skipped). No token and no permissions,
  # because a step summary needs neither — which also means no API call to
  # retry and nothing that can half-succeed. Best-effort during a run
  # cancellation, like any always() job.
  #
  # A decline strands nothing: no request is left open anywhere, the plan report
  # is already on this run, and the backlog this round declined to forecast is
  # re-derived on the next cycle by construction — so a decline costs a cycle
  # and nothing else.
  rejected:
    needs: [authorize, plan, approval]
    if: >-
      ${{ always() && needs.plan.outputs.has_jobs == 'true' && needs.approval.result != 'success'
      && needs.authorize.result == 'success'
      && (needs.authorize.outputs.attempt == github.run_attempt
      || contains(needs.authorize.outputs.rerunners, format(',{0},', github.triggering_actor))) }}
    runs-on: ubuntu-24.04
    # Nothing here but the summary write; the cap is the runner's own setup
    # with room.
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Record that the hold did not release
        env:
          RESULT: ${{ needs.approval.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          {
            echo "## run-predict — the review hold did not release"
            echo ""
            echo "The \`review\` hold ended as \`${RESULT}\` — rejected, cancelled, expired, or the plan failed before the hold — so no cell ran and nothing was spent."
            echo ""
            echo "The plan report on the \`plan\` job of this run is the record of what was declined; if no report appears there, the plan failed before rendering one: ${RUN_URL}"
            echo ""
            echo "Nothing has to be re-filed: the forecasts this round would have produced are still missing from committed state, so the next scheduled round derives them again. A \`workflow_dispatch\` runs one now."
          } >> "$GITHUB_STEP_SUMMARY"

  predict:
    needs: [authorize, plan, approval]
    if: >-
      ${{ needs.plan.outputs.has_jobs == 'true'
      && needs.authorize.result == 'success'
      && (needs.authorize.outputs.attempt == github.run_attempt
      || contains(needs.authorize.outputs.rerunners, format(',{0},', github.triggering_actor))) }}
    runs-on: ubuntu-24.04
    # The engine deadline below plus the setup ahead of the engine step and the
    # capture tail behind it, with room: measured since 2026-08-01, the engine
    # step starts at most ~5.5 minutes into a cell and the tail runs under 1.5,
    # so 50 + 7 lands near 57 and 65 holds ~8 minutes over that worst case. A
    # job that reaches this cap is cancelled — no tail, logs dropped — which is
    # why the engine deadline, not this, is the bound meant to bite.
    timeout-minutes: 65
    environment: prod
    # The **engine deadline**, in minutes, and the one place it is set for this
    # workflow: every engine step's `timeout-minutes` reads it, and the arm step
    # derives the watchdog's fire time from it, a margin earlier, so the
    # watchdog — which can end a step's whole process tree — acts before the
    # runner's own step timeout does. One value for all three engines (claude's
    # action step, codex's action step, gemini's CLI step), held equal across
    # run-predict, run-evaluate and integration-test's application-repro leg
    # by a workflow-shape test. Fifty minutes: since 2026-08-01 the longest
    # completed engine step on either workflow, any engine, is 13.9 minutes
    # (p99 under 12), so this is over 3.5x the longest cell observed — a cell
    # near it is an anomaly worth a kill, not slow work. docs/pipeline.md
    # (*Graceful degradation on limits*) carries the derivation.
    env:
      ENGINE_DEADLINE_MINUTES: "50"
    permissions:
      # The cell no longer commits or opens a PR — it only reads the repo and
      # uploads an artifact; the collect job does the git/PR with its own token.
      contents: read
      id-token: write # assume the AWS role for the corpus S3 remote (read-only)
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: ./.github/actions/setup-python-env
        with:
          restore-cache: "false"

      # Read-only corpus access (OIDC role; no static keys). The session this
      # step assumes is the read-only role's. By design it is the one corpus
      # role whose trust names `prod`: the read-write role's trust names
      # `corpus-write` alone, an environment only the corpus writer jobs bind,
      # so the job's `id-token: write` reaches no role that writes a corpus
      # store. That trust is an IAM statement the promotion gate cannot read,
      # which the maintainer keeps (docs/security.md, *`corpus-write` holds
      # the production read-write role*); what
      # else accepts a `prod` token is the residual SECURITY.md states. No pull: corpus
      # bytes move only as the KBs each ranged lookup touches. The credentials
      # are scoped to the sidecar action's own steps — the agent steps below
      # inherit none; they reach the corpus through the localhost sidecar via
      # the `service` backend, and the deterministic provisioning steps take
      # the credentials from this action's outputs as step-scoped env.
      - uses: ./.github/actions/corpus-sidecar
        id: corpus
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME_READONLY }}
          aws-region: ${{ vars.AWS_REGION }}
          # 90 minutes, covering the 65-minute job cap with room: the
          # sidecar's credentials are static for the whole job, so they must
          # outlive any cell the job cap lets run.
          role-duration-seconds: "5400"
          # One address for the sidecar process itself: `full` query bodies
          # hydrate from the per-case content store the base derives, and the
          # sidecar is the credentialed process — a sidecar that could not
          # reach the store would silently serve bodiless rows while every
          # other read stayed green.
          corpus-base-url: ${{ vars.CORPUS_BASE_URL }}

      # Point-in-time snapshots are raw facts in the access-gated corpus, not git:
      # materialize this case's latest snapshot (a ranged point lookup, KB-scale)
      # to the gitignored record/ path the predictor reads (never committed).
      # Neither a missing snapshot nor a terminal-docket refusal (below) aborts
      # the run: each refuses its own cell and leaves the rest of the fan-out
      # alone.
      - name: Provision the case snapshot from the corpus
        id: provision
        continue-on-error: true
        env:
          COURT_ID: ${{ matrix.court }}
          DOCKET_ID: ${{ matrix.docket }}
          EVENT_ID: ${{ matrix.event_id }}
          # Trusted repo code running before the agent: read-only credentials
          # ride this step's env only (from the sidecar action's outputs),
          # never the job env, so no agent step inherits them.
          AWS_ACCESS_KEY_ID: ${{ steps.corpus.outputs.aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.corpus.outputs.aws-secret-access-key }}
          AWS_SESSION_TOKEN: ${{ steps.corpus.outputs.aws-session-token }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          # One address for both halves of this step's read: the index the
          # ranged backend queries, and the per-case content store the payload
          # reads (snapshots, document text) come from.
          FEDCOURTS_CORPUS_BASE_URL: ${{ vars.CORPUS_BASE_URL }}
          FEDCOURTS_CORPUS_BACKEND: ranged
        # `--mode forward`: a run-predict cell predicts a genuinely pending
        # event, and the mode in record/context.json keys the prompt contract's
        # retrieval etiquette; the cert back-test's replay provisioner
        # writes `replay` itself.
        # `--refuse-terminal` + `--event`: the forward gate — refuse (exit 3,
        # nothing written) when the record already holds this event's outcome,
        # the snapshot is older than the staleness bound, or the snapshot text
        # shows THIS EVENT's outcome. The event key is load-bearing because
        # one docket carries several events' outcomes at once: on the merits
        # event the outcome is the judgment, and the cert grant that opened
        # the event is its legitimate record. Only this workflow passes the
        # flag: run-evaluate provisions the same cell for an already-resolved
        # event, where a decided docket is the point.
        # `--max-snapshot-age-days 10`: generous against the live poller's
        # daily-ish refresh on selected petitions, so a healthy pipeline never
        # trips it — only a resumed pause or a stalled poller does.
        # Every non-zero exit refuses the cell: `refused=true` gates every
        # step below that serves the agent — the event materialization, both
        # MCP steps, the comment-token mint, the engine installs and the engine
        # steps — so a refused cell runs no agent and spends nothing. (The
        # corpus sidecar launches before this step and must — it is where
        # these credentials come from.) Two causes reach that one gate; the
        # `::warning::` lines name which. Exit 3 is the forward gate's
        # refusal — a forward cell must not run on a record that already holds
        # the outcome, or it produces a context-less prediction claiming a mode
        # it never had. Exit 1 left nothing provisioned, and refuses because the
        # provisioned snapshot is every predictor's guaranteed-common input: a
        # cell that runs without one forecasts from base rates alone while its
        # output claims the shared baseline, and nothing downstream separates
        # the two.
        run: |
          set -euo pipefail
          status=0
          poll="$RUNNER_TEMP/pre-mint-poll.json"
          uv run fedcourts provision-snapshot --court "$COURT_ID" --docket "$DOCKET_ID" --event "$EVENT_ID" --mode forward --refuse-terminal --max-snapshot-age-days 10 --pre-mint-poll --pre-mint-poll-out "$poll" || status=$?
          # The pre-mint poll's result travels as a step output, fixed before
          # any agent runs: a file would sit where the agent, running as the
          # same user, could rewrite it before the usage step reads it.
          if [ -f "$poll" ]; then
            echo "pre_mint_poll=$(tr -d '\n' < "$poll")" >> "$GITHUB_OUTPUT"
            rm -f "$poll"
          fi
          if [ "$status" -eq 1 ]; then
            # Nothing was written, so there is no cell to run. The usual cause
            # is a corpus with no snapshot for the case; a corpus read that
            # failed outright lands here too, which is why the annotation
            # states the effect rather than naming a cause it cannot know.
            echo "refused=true" >> "$GITHUB_OUTPUT"
            echo "::warning::nothing provisioned for ${COURT_ID}/${DOCKET_ID} ${EVENT_ID}; no cell runs (unprovisioned)"
            # The step ends red (under continue-on-error) on purpose: an
            # unprovisioned cell is an anomaly worth a visible mark, where the
            # forward gate's refusal below is a designed outcome and ends green.
            exit "$status"
          elif [ "$status" -ne 0 ]; then
            # Exit 3 is the gate's refusal; anything else non-zero is an
            # unclassified fault inside the gate reads, and the fail-closed
            # direction is the refusal's: a forward cell must not run on a
            # record the gate could not check.
            echo "refused=true" >> "$GITHUB_OUTPUT"
            echo "::warning::forward gate refused ${COURT_ID}/${DOCKET_ID} ${EVENT_ID} (exit ${status}); no cell runs"
          fi

      # Provisioning declares the failures it knows about through its exit code;
      # a read that half-lands declares nothing. This asks the disk instead: the
      # cell context and the dated snapshot it names must both be there, or the
      # cell is unprovisioned and refuses on the same gate. Cheap, local, and
      # credential-free — the tested command carries the definition of complete.
      # Gated on the provision half only: a cell the forward gate refused was
      # never provisioned by design, and re-asserting would report the refusal
      # as an incomplete write.
      - name: Assert the provisioned record landed
        id: record
        if: steps.provision.outputs.refused != 'true'
        continue-on-error: true
        env:
          COURT_ID: ${{ matrix.court }}
          DOCKET_ID: ${{ matrix.docket }}
          EVENT_ID: ${{ matrix.event_id }}
        run: |
          set -euo pipefail
          status=0
          uv run fedcourts assert-cell-record --court "$COURT_ID" --docket "$DOCKET_ID" --event "$EVENT_ID" || status=$?
          if [ "$status" -ne 0 ]; then
            echo "refused=true" >> "$GITHUB_OUTPUT"
            exit "$status"
          fi

      # A predictable event is a corpus fact, not a committed file. Project it into
      # the event's ledger directory so the prediction PR carries its event.yaml and
      # the offline `validate` gate can confirm the judgment references a real event
      # without the corpus. Runs before the agent so a genuinely missing event fails
      # the job before any model tokens are spent.
      - name: Materialize the event definition for the ledger
        # Skipped on a refused cell: with no agent running there is no
        # prediction PR to carry the event.yaml, and the projection read is
        # egress for nothing.
        if: steps.provision.outputs.refused != 'true' && steps.record.outputs.refused != 'true'
        env:
          COURT_ID: ${{ matrix.court }}
          DOCKET_ID: ${{ matrix.docket }}
          EVENT_ID: ${{ matrix.event_id }}
          # Step-scoped read-only credentials, same rationale as the
          # provisioning step above.
          AWS_ACCESS_KEY_ID: ${{ steps.corpus.outputs.aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.corpus.outputs.aws-secret-access-key }}
          AWS_SESSION_TOKEN: ${{ steps.corpus.outputs.aws-session-token }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          # One address for both halves of this step's read: the index the
          # ranged backend queries, and the per-case content store the payload
          # reads (snapshots, document text) come from.
          FEDCOURTS_CORPUS_BASE_URL: ${{ vars.CORPUS_BASE_URL }}
          FEDCOURTS_CORPUS_BACKEND: ranged
        run: uv run fedcourts materialize-event --court "$COURT_ID" --docket "$DOCKET_ID" --event "$EVENT_ID"

      # Tokenless HTTP sidecar for the cell's CourtListener MCP retrieval; the
      # composite carries the launch/health rationale (token in its launch
      # step env only; warn-only health so a degraded upstream never blocks
      # the cell, which runs on corpus tooling and provisioned inputs — the
      # prompt contract says so). Mirrors the corpus sidecar above.
      - # A refused cell serves no agent: do not launch a token-holding
        # sidecar process for it.
        if: steps.provision.outputs.refused != 'true' && steps.record.outputs.refused != 'true'
        uses: ./.github/actions/mcp-sidecar
        with:
          role: predictor
          actor: ${{ matrix.predictor_id }}
          courtlistener-api-token: ${{ secrets.COURTLISTENER_API_TOKEN }}

      # Configure the cell's MCP retrieval from the versioned tool
      # manifest (config/predictors.yaml `mcp_servers:`). The tested `mcp-config`
      # command emits each engine's client format; this step only plumbs stdout
      # to the file the engine reads. Each config names only the sidecar's
      # localhost URL — no launch command and no token (the sidecar's launch
      # step holds it; unset, CL tool calls error and the cell degrades to
      # corpus tooling rather than failing) — so the generated file, though
      # workspace-local and gitignored, contains nothing worth reading.
      - name: Configure agent retrieval (MCP)
        if: steps.provision.outputs.refused != 'true' && steps.record.outputs.refused != 'true'
        env:
          ENGINE: ${{ matrix.engine }}
          PREDICTOR_ID: ${{ matrix.predictor_id }}
        run: |
          set -euo pipefail
          case "$ENGINE" in
            claude-code)
              uv run fedcourts mcp-config --engine claude-code \
                --role predictor --actor "$PREDICTOR_ID" \
                --http-url courtlistener=http://127.0.0.1:8378/mcp > mcp-servers.json
              ;;
            codex)
              mkdir -p .codex
              uv run fedcourts mcp-config --engine codex \
                --role predictor --actor "$PREDICTOR_ID" \
                --http-url courtlistener=http://127.0.0.1:8378/mcp > .codex/config.toml
              ;;
            gemini)
              # The Gemini settings file is (re)written whole here — telemetry
              # block included — because the secret-free install step below must
              # stay secret-free; mcp-config merges mcpServers over the base.
              # context.fileFiltering.respectGitIgnore=false: the case snapshot
              # is provisioned into the gitignored record/ path (see the provision
              # step above), and Gemini's read_file honours .gitignore by
              # default, so without this it cannot read the very files the
              # prompt contract names — forcing a run_shell_command fallback that
              # leaves the read unlogged in retrieval_log.json. Claude and Codex
              # do not gitignore-filter their reads; this brings Gemini in line.
              # The key is namespaced under `context` per the gemini-cli 0.49.0
              # settings schema (a bare top-level fileFiltering is ignored).
              # security.environmentVariableRedaction.allowed: the cell env
              # contract (COURT_ID/DOCKET_ID/... — see _cell_env and the prompt's
              # identifier table) reaches the agent's SHELL. Gemini's sanitizer
              # runs strict whenever GITHUB_SHA is set and otherwise strips every
              # custom var, so `$COURT_ID` expanded EMPTY in a gemini cell and the
              # agent looked for its provisioned snapshot at a garbage path and
              # reported it missing — while claude and codex, reading the same
              # files, were fine. The allowlist check precedes the strict-mode
              # blanket redaction, so naming the vars here restores the identical
              # env contract the other two engines already get: same prompt, same
              # `fedcourts paths`, same $VAR. (Settings keys are `allowed` /
              # `blocked` / `enabled`, NOT the internal `allowedEnvironmentVariables`
              # field name — a wrong namespace is a silent no-op, like the bare
              # fileFiltering above. `enabled` is deliberately unset: strict mode
              # already forces redaction in CI, and setting it would newly redact
              # off-CI, where redaction is off today.) Only non-secret identifiers
              # go here; the CLI hard-refuses to allowlist anything matching
              # /TOKEN|SECRET|KEY|AUTH|CREDENTIAL|.../i regardless.
              # logPrompts:true so the tool_call telemetry events carry
              # `function_args` — without it Gemini logs the tool name but not the
              # query, leaving retrieval_log.json's query/params null (Claude and
              # Codex capture args already; this brings Gemini in line). The raw
              # telemetry.log is gitignored and excluded from the artifact upload,
              # so only the parsed query slice reaches the committed log; and this
              # step and the Gemini *agent* step are both token-free — the
              # CourtListener token lives in the MCP sidecar's launch step only,
              # and the CLI strips custom env from agent shell commands
              # except the non-secret identifiers allowlisted below (a token can
              # never be allowlisted: the CLI hard-filters /TOKEN|SECRET|KEY|.../i
              # out of the allowlist itself) — so a captured arg carries a query,
              # never a secret.
              mkdir -p .gemini
              # FEDCOURTS_CORPUS_BACKEND / FEDCOURTS_CORPUS_SERVICE_URL are the
              # corpus sidecar's cell contract: a backend name and a localhost
              # URL, non-secret by construction (and structurally so — the
              # names clear the CLI's credential-name refusal regex). This is
              # what gives this engine corpus retrieval parity: the sanitizer
              # could never allowlist AWS credentials, but it accepts these.
              printf '%s\n' '{"context":{"fileFiltering":{"respectGitIgnore":false}},"telemetry":{"enabled":true,"target":"local","outfile":".gemini/telemetry.log","logPrompts":true},"security":{"environmentVariableRedaction":{"allowed":["COURT_ID","DOCKET_ID","EVENT_ID","PREDICTOR_ID","EVALUATOR_ID","RUN_ID","MODEL_ID","DECIDED_BEFORE","FEDCOURTS_CORPUS_BACKEND","FEDCOURTS_CORPUS_SERVICE_URL"]}}}' > .gemini/settings.json
              uv run fedcourts mcp-config --engine gemini \
                --role predictor --actor "$PREDICTOR_ID" \
                --base-settings .gemini/settings.json \
                --http-url courtlistener=http://127.0.0.1:8378/mcp > .gemini/settings.json.new
              mv .gemini/settings.json.new .gemini/settings.json
              ;;
          esac

      # The regression tripwire for the whole sidecar design: the agent steps
      # below must inherit no cloud credential from the job env. The sidecar
      # action keeps the assumed role's credentials out of $GITHUB_ENV
      # (step outputs only); this proves it stays that way.
      - name: Assert the agent env is credential-free
        run: |
          set -euo pipefail
          # Any AWS_* variable except the region names is treated as
          # credential-conferring (static keys, session tokens, and the
          # role-ARN/web-identity pair alike).
          if env | grep -E '^AWS_' | grep -vE '^AWS_(REGION|DEFAULT_REGION)=' > /dev/null; then
            echo "::error::AWS credential variables leaked into the job env"
            exit 1
          fi
          echo "agent env is credential-free"

      # Two surfaces the agent must not read, taken out of its working tree
      # rather than left to instruction alone:
      #
      # 1. data/qp-topics membership encodes cert outcomes (docs/qp-topic.md),
      #    so the prompts forbid cells from reading it.
      # 2. The committed predictions/ and evaluations/ trees carry every other
      #    predictor's forecasts, the same case's earlier moments included, and
      #    the gradings of them; a cell that reads one is no longer an
      #    independent forecaster, which is what the cross-engine comparison
      #    assumes. A predictor forecasts from its record/ and needs neither
      #    tree. Runs after provisioning, the last step that reads them; the
      #    restore below puts them back the moment the agent stops.
      #
      # Every tracked path under them is marked skip-worktree first, so the
      # removal leaves `git status` clean and an agent "tidying" its checkout
      # with `git restore .`, `git checkout -- .` or `git reset --hard` cannot
      # write them back — a plain deletion shows as a change, which an agent
      # may restore. Deliberate access through git history (`git show`)
      # stays possible: the predict prompt forbids reading data/qp-topics but
      # states no read rule for the committed cell trees, so a deliberate read
      # of those is recorded by the logged-tool-call audit alone. The bits are
      # never cleared: the runner is discarded, and nothing after the agent
      # reads git's view of the tree.
      # Neither the deletion nor the move can propagate to the run PR: the
      # collect job unions each cell's data/ onto a freshly fetched clean
      # origin/main checkout, and `assert-paths` rejects any non-addition.
      - name: Remove the oracle and the committed cell record from the agent's tree
        run: |
          set -euo pipefail
          git ls-files -z -- data/qp-topics \
            ':(glob)data/cases/*/*/events/*/predictions/**' \
            ':(glob)data/cases/*/*/events/*/evaluations/**' \
            | git update-index -z --skip-worktree --stdin
          rm -rf data/qp-topics
          uv run fedcourts hide-cell-record --stash-dir "$RUNNER_TEMP/hidden-record"

      # Install the engine's CLI at the version `.github/engines/<engine>/`
      # pins, in its own SECRET-FREE step: the lockfile fixes every package by
      # hash and --ignore-scripts skips npm lifecycle scripts, and the step's
      # env carries nothing in case a package ever ran code at install. claude-code's binary
      # path feeds claude-code-action, so the action runs the pinned CLI rather
      # than the one it bundles; codex's version feeds codex-action, which
      # installs it. (.gemini/settings.json is written by the "Configure agent
      # retrieval" step above: it needs the CourtListener token in its env, and
      # this step must stay secret-free.)
      - name: Install the pinned engine CLI
        id: engine-cli
        timeout-minutes: 10
        if: steps.provision.outputs.refused != 'true' && steps.record.outputs.refused != 'true'
        uses: ./.github/actions/engine-cli
        with:
          engine: ${{ matrix.engine }}

      # codex runs as the separate `codexcell` account (see its step's
      # `safety-strategy: unprivileged-user`), so provision and permission that
      # account before the watchdog bracket: its home and derived CODEX_HOME (the
      # config copied in, a rollout it can write), read (never write) over the
      # checkout, the non-secret cell env carried across the `sudo -u` hop, and
      # write over its one output subtree. Placed OUTSIDE the engine bracket —
      # ahead of the arm step, which the watchdog tests pin adjacent to the
      # engine steps — and the disarm step returns codexcell's work to the
      # runner. Same refusal gate as
      # the codex engine step, and codex-only.
      - name: Provision the unprivileged codex user
        if: matrix.engine == 'codex' && steps.provision.outputs.refused != 'true' && steps.record.outputs.refused != 'true'
        uses: ./.github/actions/codex-user-setup
        with:
          codex-user: codexcell
          codex-config: .codex/config.toml
          grant-workspace-read: "true"
          codex-output-dir: data/cases/${{ matrix.court }}/${{ matrix.docket }}/events/${{ matrix.event_id }}/predictions/${{ matrix.predictor_id }}/${{ matrix.run_id }}

      # The bracket around every engine step below, and the reason the cell
      # survives a step that will not conclude. Two failures live here, and the
      # watchdog has a trigger for each.
      #
      # The one that actually happens: the agent finishes — every output file
      # written and self-validated, the closing token count printed — and then
      # the step's *teardown* hangs, holding `in_progress` past its own
      # `timeout-minutes` until the JOB cap cancels the runner. A cancelled job
      # runs none of the capture tail below and has its logs dropped, so
      # completed, valid work is deleted and nothing records that it existed.
      # Against that the watchdog carries a **completion sentinel**: the cell's
      # required outputs, computed here from the same paths the tail's
      # `finalize-produced` and `validate` read, plus a write-quiescence grace so
      # an agent still revising a draft is never cut off. On complete and quiet,
      # it ends the step's tree — the step concludes, the tail runs, and the cell
      # lands as the success it already was.
      #
      # The deadline stays behind it for a wedge that completes nothing: capture
      # the runner's state (shapes and metadata only — the bundle is published),
      # kill the engine, then the step's own tree, which fails the STEP and
      # leaves the tail to salvage what there is.
      #
      # Every engine is bracketed, not codex alone. The sentinel reads files the
      # contract names and the deadline reads the runner's process shapes, so
      # neither trigger knows which engine ran — and a teardown hang is a
      # property of the step, which every engine has. The gate is therefore the
      # refusal gate only: a refused cell runs no engine, so it needs no bound.
      - name: Arm the engine watchdog
        if: steps.provision.outputs.refused != 'true' && steps.record.outputs.refused != 'true'
        env:
          CODEX_HOME: ${{ github.workspace }}/.codex
          WATCHDOG_DIR: ${{ runner.temp }}/engine-watchdog
          COURT_ID: ${{ matrix.court }}
          DOCKET_ID: ${{ matrix.docket }}
          EVENT_ID: ${{ matrix.event_id }}
          ACTOR_ID: ${{ matrix.predictor_id }}
          RUN_ID: ${{ matrix.run_id }}
          # The fire time is derived in the script below from the job's one
          # engine deadline: three minutes under it. The margin is what the
          # watchdog's own escalation can take once it fires — three graces of
          # 30 s, each plus up to one 10 s poll, is two minutes at worst — plus
          # a minute's slack, so a step the watchdog ends is concluded before the
          # engine step's own `timeout-minutes` (the same deadline) would cancel
          # it. The watchdog starts within seconds of the engine step, at the end
          # of this step, so the two clocks run together.
          DEADLINE_MARGIN_S: "180"
        run: |
          set -euo pipefail
          mkdir -p "$WATCHDOG_DIR"
          # The completion sentinel, resolved before the agent has the tree. The
          # command's stdout is a hand-over: first line the directory whose write
          # quiescence is watched, the rest the files a finished cell of this role
          # owes. Both reach the watchdog as **env**, never as a file — the agent
          # owns this workspace for the whole of its turn, and a list it could
          # rewrite is a list it could satisfy without doing the work.
          #
          # Best-effort and bounded: an empty list disables the reaper and
          # leaves the deadline as the only bound, which is a degraded watchdog
          # rather than an unguarded cell.
          sentinel_root=""
          sentinel_paths=""
          if cell_outputs="$(timeout 60 uv run fedcourts cell-outputs --role predict \
            --court "$COURT_ID" --docket "$DOCKET_ID" --event "$EVENT_ID" \
            --actor "$ACTOR_ID" --run-id "$RUN_ID")"; then
            # Absolute, so nothing about the watchdog depends on the working
            # directory it happens to inherit through `nohup`.
            # `case` rather than `${x#*}`: that expansion returns the whole
            # string when there is no newline, so a root-only stdout would put
            # the output *directory* into the list of required files. Degraded to
            # no sentinel rather than to a failed step, like every other miss
            # here — the kill duty is primary, and a cell that runs on its
            # deadline alone is the behaviour before any of this.
            case "$cell_outputs" in
              *$'\n'*) ;;
              *)
                echo "::warning::cell-outputs named no required files; the watchdog runs on its deadline alone"
                cell_outputs=""
                ;;
            esac
            # Absolute already when the data root is (which a dev or a smoke can
            # set); prefixing unconditionally would yield `$PWD//abs/path` and a
            # sentinel that silently never fires.
            absolute() { case "$1" in /*) printf '%s' "$1" ;; *) printf '%s/%s' "$PWD" "$1" ;; esac; }
            if [ -n "$cell_outputs" ]; then
              sentinel_root="$(absolute "${cell_outputs%%$'\n'*}")"
              while IFS= read -r relative; do
                [ -n "$relative" ] || continue
                sentinel_paths="${sentinel_paths}${sentinel_paths:+$'\n'}$(absolute "$relative")"
              done <<< "${cell_outputs#*$'\n'}"
            fi
          else
            echo "::warning::no completion sentinel for ${EVENT_ID}; the watchdog runs on its deadline alone"
          fi
          # The fire time, from the one configured deadline. Checked as digits
          # before the arithmetic — the watchdog refuses a non-numeric knob too,
          # but a bad value must fail here, loudly, before the engine starts
          # unguarded.
          for value in "$ENGINE_DEADLINE_MINUTES" "$DEADLINE_MARGIN_S"; do
            case "$value" in
              "" | *[!0-9]* | 0?*)
                echo "::error::the engine deadline and its margin must be plain whole numbers"
                exit 1
                ;;
            esac
          done
          WATCHDOG_DEADLINE_S=$((ENGINE_DEADLINE_MINUTES * 60 - DEADLINE_MARGIN_S))
          echo "engine deadline: ${ENGINE_DEADLINE_MINUTES} min (step timeout); watchdog fires at ${WATCHDOG_DEADLINE_S}s"
          # The watchdog and its evidence both live outside the workspace: that
          # tree belongs to the agent for the whole of its turn, and bash reads a
          # script file as it executes it. The disarm step brings the bundle
          # back for the artifact.
          cp scripts/engine-watchdog.sh "$RUNNER_TEMP/engine-watchdog.sh"
          WATCHDOG_DEADLINE_S="$WATCHDOG_DEADLINE_S" \
            WATCHDOG_OUTPUT_DIR="$sentinel_root" \
            WATCHDOG_SENTINEL_PATHS="$sentinel_paths" \
            nohup bash "$RUNNER_TEMP/engine-watchdog.sh" \
            > "$WATCHDOG_DIR/watchdog.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/engine-watchdog.pid"

      - name: Predict with Claude Code
        id: predict_claude
        if: matrix.engine == 'claude-code' && steps.provision.outputs.refused != 'true' && steps.record.outputs.refused != 'true'
        # The job's one engine deadline, as on every engine step: a runaway run
        # trips this *step* (leaving the tail to salvage its work) instead of the
        # job-level timeout, which would cancel the runner and discard
        # everything. The watchdog armed above fires a margin earlier, and is
        # what ends a step whose tree will not die on the runner's own timeout.
        timeout-minutes: ${{ fromJSON(env.ENGINE_DEADLINE_MINUTES) }}
        uses: anthropics/claude-code-action@5eb090f3c3afd701a0672cd32981197ca27688f6 # v1.0.253
        env:
          COURT_ID: ${{ matrix.court }}
          DOCKET_ID: ${{ matrix.docket }}
          EVENT_ID: ${{ matrix.event_id }}
          PREDICTOR_ID: ${{ matrix.predictor_id }}
          RUN_ID: ${{ matrix.run_id }}
          MODEL_ID: ${{ matrix.model }}
          # Corpus queries go through the localhost sidecar (the URL arrived
          # job-wide from its launch step): the identical `fedcourts query`
          # surface, no cloud credential in this shell.
          FEDCOURTS_CORPUS_BACKEND: service
          # No CourtListener token on the agent step: live CL access is the MCP
          # sidecar only (a localhost URL in the config above; the token lives in
          # the sidecar's own step env), and there is no REST fallback — so the
          # token is never in an agent's env, or any file it can read, while it
          # processes adversarial docket text. If MCP is down the agent degrades
          # to corpus tooling + provisioned inputs.
        with:
          # claude-code-action runs its own actor check and refuses a bot by
          # default. This workflow's rounds are unattended, so their actor is not
          # a requester at all — it is whatever GitHub attributes the cron to,
          # which on a repo whose deterministic writers push to the default
          # branch can be the pipeline App's own login. A chained round's actor
          # is the dispatch App (`chain` and run-pull's `chain-predict`). Allow
          # exactly those two logins (never `*`) so a round cannot die on an
          # attribution it does not control; what gates the spend is the hold
          # (`review`, or the auto-release caps), not this setting.
          allowed_bots: "fedcourtsai-data[bot],fedcourtsai-dispatch[bot]"
          # Auth is the Anthropic API key (pay-per-token): automated pipeline
          # inference is API-metered by design (see docs/budget.md), and per
          # Anthropic policy the Max subscription OAuth token is for interactive
          # Claude Code / claude.ai, not CI. For a local/interactive fallback,
          # swap this for `claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}`.
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # The pinned CLI from the engine-cli step, never the one the action
          # bundles: the engine a cell runs moves only when the pin does.
          path_to_claude_code_executable: ${{ steps.engine-cli.outputs.path }}
          # The action refuses to start without a GitHub token, and its no-input
          # fallback is an OIDC exchange for an App installation token that
          # defaults to contents/issues/pull-requests *write* — reachable here,
          # since this job holds `id-token: write` for the corpus role. So it
          # gets the job's own token, capped by the job's permissions block at
          # `contents: read`: no round has an issue or PR to comment on, and the
          # cell's files ride to `collect` as an artifact. No App key is named
          # anywhere in this job, because every secret a job names reaches its
          # runner at job start, where an injected cell could recover it
          # (tests/test_workflow_token_holder.py).
          github_token: ${{ github.token }}
          # Prompt caching is automatic: the stable prefix (AGENTS.md + the
          # prompt template + schema) is cached across the run's tool-use turns.
          # The API key's default cache TTL is only 5 minutes, which would expire
          # mid-run, so ENABLE_PROMPT_CACHING_1H below pins the 1-hour TTL (and the
          # cache-read discount priced in fedcourtsai.pricing).
          settings: |
            {
              "env": {
                "ENABLE_PROMPT_CACHING_1H": "1"
              }
            }
          # The kickoff prompt is identical across the three engines and carries
          # the cell identifiers inline: some engines sanitize the shell
          # environment in CI (Gemini strips every custom env var except the
          # allowlisted cell contract), so the
          # prompt text — not the env — is the contract's delivery channel.
          prompt: |
            Read ${{ matrix.prompt }} and AGENTS.md, then produce the prediction
            for this cell:

            COURT_ID=${{ matrix.court }}
            DOCKET_ID=${{ matrix.docket }}
            EVENT_ID=${{ matrix.event_id }}
            PREDICTOR_ID=${{ matrix.predictor_id }}
            RUN_ID=${{ matrix.run_id }}
            MODEL_ID=${{ matrix.model }}

            Your provisioned inputs are at
            data/cases/${{ matrix.court }}/${{ matrix.docket }}/record/ — the
            case-level directory (a sibling of events/, not a child of it)
            holding the snapshot, context.json, and any provisioned documents.

            These values are authoritative; the same identifiers are exported as
            environment variables on engines that pass them through, but if
            `$COURT_ID` expands empty in your shell, use the literals above.
            Write only the output files the prompt contract names for your cell.
            Do not commit, push, or open a PR — the workflow handles git. You run
            headless with no interactive input; if you are blocked, record it in
            flags.json and explain it in reasoning.md, then finish — do not wait
            for a reply.
          # The model comes from the plan job's matrix (registry override or the
          # engine's predict/evaluate default in fedcourtsai.pricing) — repo
          # config, not user input.
          claude_args: |
            --model ${{ matrix.model }}
            --max-turns 120
            --permission-mode bypassPermissions
            --mcp-config mcp-servers.json

      - name: Predict with Codex
        id: predict_codex
        if: matrix.engine == 'codex' && steps.provision.outputs.refused != 'true' && steps.record.outputs.refused != 'true'
        # The same engine deadline as the Claude and Gemini steps.
        timeout-minutes: ${{ fromJSON(env.ENGINE_DEADLINE_MINUTES) }}
        uses: openai/codex-action@bdf19a4a223ec2549a3e2274a0cf61556bc07675 # v1.13
        env:
          COURT_ID: ${{ matrix.court }}
          DOCKET_ID: ${{ matrix.docket }}
          EVENT_ID: ${{ matrix.event_id }}
          PREDICTOR_ID: ${{ matrix.predictor_id }}
          RUN_ID: ${{ matrix.run_id }}
          MODEL_ID: ${{ matrix.model }}
          # Corpus queries go through the localhost sidecar (see the Claude
          # step): same surface, no cloud credential in this shell. codex runs
          # as a separate account (`safety-strategy: unprivileged-user` below),
          # and the `sudo -u` hop resets the environment, so these NON-SECRET
          # names reach the `fedcourts` commands codex spawns only through the
          # env_keep drop-in the setup action installs — named there, kept here.
          FEDCOURTS_CORPUS_BACKEND: service
          # No CourtListener token on the agent step (see the Claude step): MCP is
          # the only live-CL path and there is no REST fallback.
          # `uv` runs as codexcell: pin its cache into that account's home (the
          # runner owns `~/.cache`), and never sync — the runner built `.venv`
          # with `uv sync --locked` at setup and owns it, so codexcell reads it
          # but must not write it. Both carried across the hop by the same
          # env_keep pass.
          UV_CACHE_DIR: /home/codexcell/.cache/uv
          UV_NO_SYNC: "1"
          # No `CODEX_HOME`: the `sudo -u` hop cannot carry it, so the action
          # derives codexcell's own `~/.codex` for the config and the session
          # rollout. Setting it here would misdirect both to a home codex never
          # reads. The runner-user tail (disarm, usage, retrieval capture) keeps
          # `CODEX_HOME` pointed at the workspace `.codex`, where the teardown
          # step surfaces the rollout for it.
        with:
          # As with the Claude step: let a round GitHub attributes to the
          # pipeline App's login (`fedcourtsai-data[bot]`) or the dispatch App's
          # (`fedcourtsai-dispatch[bot]`, a chained round) past codex-action's
          # write-access check, which a bot installation fails.
          allow-bot-users: "fedcourtsai-data[bot],fedcourtsai-dispatch[bot]"
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          # The same kickoff prompt as the Claude and Gemini steps (identifiers
          # inline — the engines' methodology stays comparable, and the contract
          # never depends on env passthrough); the agent reads the template
          # itself, as the other engines do.
          prompt: |
            Read ${{ matrix.prompt }} and AGENTS.md, then produce the prediction
            for this cell:

            COURT_ID=${{ matrix.court }}
            DOCKET_ID=${{ matrix.docket }}
            EVENT_ID=${{ matrix.event_id }}
            PREDICTOR_ID=${{ matrix.predictor_id }}
            RUN_ID=${{ matrix.run_id }}
            MODEL_ID=${{ matrix.model }}

            Your provisioned inputs are at
            data/cases/${{ matrix.court }}/${{ matrix.docket }}/record/ — the
            case-level directory (a sibling of events/, not a child of it)
            holding the snapshot, context.json, and any provisioned documents.

            These values are authoritative; the same identifiers are exported as
            environment variables on engines that pass them through, but if
            `$COURT_ID` expands empty in your shell, use the literals above.
            Write only the output files the prompt contract names for your cell.
            Do not commit, push, or open a PR — the workflow handles git. You run
            headless with no interactive input; if you are blocked, record it in
            flags.json and explain it in reasoning.md, then finish — do not wait
            for a reply.
          model: ${{ matrix.model }}
          effort: high
          # Run codex as a SEPARATE unprivileged account, not as the runner user
          # with sudo dropped. `drop-sudo` irreversibly mutates the runner user's
          # own account mid-job (drops sudo, revokes `/run` socket access, sets
          # no_new_privs, empties supplementary groups); on current runner images
          # the runner agent trips on that mutated account minutes after the turn
          # and wedges the whole VM. `unprivileged-user` leaves the runner
          # account wholly intact and runs codex as `codexcell` — the account the
          # "Provision the unprivileged codex user" step above creates and grants
          # exactly its own home, its cache, read (never write) over the checkout,
          # and write over its one output subtree. `src/`, `scripts/`,
          # `pyproject.toml`, `uv.lock`, `.venv`, and the trusted
          # `.codex/config.toml` stay runner-owned and non-writable by codexcell,
          # because the post-agent `fedcourts` steps run as the runner user and
          # would otherwise execute agent-planted code. No secret reaches
          # codexcell: the model key stays behind the action's localhost proxy.
          safety-strategy: unprivileged-user
          codex-user: codexcell
          # The cell's filesystem and network policy is one permission profile,
          # `[permissions.fedcourts-cell]` in the `$CODEX_HOME/config.toml` the
          # "Configure agent retrieval (MCP)" step above emits: it extends the
          # built-in `:workspace` filesystem policy and sets `network.enabled`.
          # The profile is named in `fedcourtsai.mcp` and selected here, and a
          # test holds the two ends together.
          #
          # A workspace policy denies network to SPAWNED commands by default
          # (the CLI's own MCP/model traffic is unsandboxed), which silently cut
          # codex off from the localhost corpus service every other engine
          # reaches. Subprocess network is the accepted cross-engine posture —
          # claude and gemini run unsandboxed, the agent env is guard-asserted
          # credential-free, and retrieval is logged — so grant it rather than
          # leave codex the accidental odd one out. The grant also makes the
          # action's unauthenticated localhost model proxy reachable by spawned
          # commands — a quota-spend surface, not a key exposure, and the same
          # class the agent already controls through its own turn loop. The
          # profile and the legacy `sandbox:` input do not compose; the action
          # refuses both together, and refuses a `sandbox_workspace_write`
          # override in `codex-args` besides, which is why the grant lives in
          # the trusted config file. The CLI version is pinned (the action
          # installs whatever npm serves otherwise) so sandbox semantics change
          # only on an explicit maintainer bump — keep it in lockstep with the
          # evaluate step and the npm pins of the same CLI in run-backtest and
          # integration-test.
          #
          # Web search defaults to `cached`, which registers a search tool
          # that cannot reach the open web, and `exec` carries no `--search`
          # flag — so `live` is selected through config. The reason mirrors the
          # network grant above, though the channel is independent (this search
          # runs provider-side and is unaffected by the sandbox): claude and
          # gemini both reach the open web, and a codex scored on a strictly
          # smaller information set confounds the cross-engine comparison the
          # leaderboard exists to make. A replay
          # cell's obligation not to seek post-event material about its own
          # case is carried by the prompt and the harness-side retrieval log,
          # which records these hosted searches alongside shell and MCP calls.
          permission-profile: fedcourts-cell
          codex-version: ${{ steps.engine-cli.outputs.version }}
          # `web_search` is not one of the config roots a protected run guards,
          # so this half of the surface stays an override.
          codex-args: '["-c","web_search=live"]'

      # Gemini runs through its CLI directly, not the upstream run-gemini-cli
      # action: that action internally `uses:` unpinned actions
      # (google-github-actions/auth@v3, actions/upload-artifact@v6), which the
      # org's require-SHA-pinning policy rejects at job setup — and because
      # action resolution happens before `if:` gating, its mere presence failed
      # every cell in the job, claude and codex included. The CLI invocation
      # reproduces what the action ran: an exact-version npm install, env-var
      # auth, the same workspace settings file (telemetry preserved for the
      # usage-capture step), and the same headless `--yolo` prompt call.
      #
      # The call is made by `scripts/gemini-cell.sh`, which retries it in place
      # when a turn ends on a transient fault (gemini's INVALID_STREAM arrives
      # as a zero exit with the fault inside the JSON result) — classified by
      # the local runner's own signature sets, started only from a clean
      # output root and only while enough of this step's deadline remains,
      # never past it: the step's timeout and the watchdog bracket are
      # unchanged. The script states the rules; run-evaluate's gemini step
      # runs the same file.
      - name: Predict with Gemini
        id: predict_gemini
        if: matrix.engine == 'gemini' && steps.provision.outputs.refused != 'true' && steps.record.outputs.refused != 'true'
        # The same engine deadline as the Claude and Codex steps.
        timeout-minutes: ${{ fromJSON(env.ENGINE_DEADLINE_MINUTES) }}
        env:
          COURT_ID: ${{ matrix.court }}
          DOCKET_ID: ${{ matrix.docket }}
          EVENT_ID: ${{ matrix.event_id }}
          PREDICTOR_ID: ${{ matrix.predictor_id }}
          RUN_ID: ${{ matrix.run_id }}
          MODEL_ID: ${{ matrix.model }}
          # Corpus queries go through the localhost sidecar (see the Claude
          # step). For this engine that is the parity fix, not just posture:
          # its sanitizer could never allowlist AWS credentials, so ranged
          # queries were impossible — a backend name and a localhost URL are
          # allowlistable (both named in the settings written above).
          FEDCOURTS_CORPUS_BACKEND: service
          # No GITHUB_TOKEN here: it is simply absent from this step's env, so a
          # GitHub token could never be used — flags.json is this engine's
          # blocked-channel. Belt and braces: a token could not reach the agent's
          # shell even if it were here, because the CLI hard-filters
          # /TOKEN|SECRET|KEY|AUTH|.../i out of the settings allowlist itself, and
          # unlisted vars are stripped under strict mode (on whenever GITHUB_SHA
          # is set). Re-check on a CLI version bump.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Headless runs need the workspace trusted explicitly (the CLI exits 55
          # otherwise); the runner workspace is a fresh clone of this repo.
          GEMINI_CLI_TRUST_WORKSPACE: "true"
          # The same kickoff prompt as the Claude and Codex steps. The inline
          # identifiers stay authoritative and are the belt-and-braces channel;
          # the env vars above now also reach the agent's shell, because the
          # settings step allowlists the cell contract past the CLI's strict-mode
          # sanitizer (a harness run with no .gemini/settings.json still has only
          # the inline channel).
          PROMPT: |
            Read ${{ matrix.prompt }} and AGENTS.md, then produce the prediction
            for this cell:

            COURT_ID=${{ matrix.court }}
            DOCKET_ID=${{ matrix.docket }}
            EVENT_ID=${{ matrix.event_id }}
            PREDICTOR_ID=${{ matrix.predictor_id }}
            RUN_ID=${{ matrix.run_id }}
            MODEL_ID=${{ matrix.model }}

            Your provisioned inputs are at
            data/cases/${{ matrix.court }}/${{ matrix.docket }}/record/ — the
            case-level directory (a sibling of events/, not a child of it)
            holding the snapshot, context.json, and any provisioned documents.

            These values are authoritative; the same identifiers are exported as
            environment variables on engines that pass them through, but if
            `$COURT_ID` expands empty in your shell, use the literals above.
            Write only the output files the prompt contract names for your cell.
            Do not commit, push, or open a PR — the workflow handles git. You run
            headless with no interactive input; if you are blocked, record it in
            flags.json and explain it in reasoning.md, then finish — do not wait
            for a reply.
        run: |
          set -euo pipefail
          # A copy taken before the turn starts, as the arm step takes of the
          # watchdog: bash reads a script file as it executes it, and the agent
          # has the run of the workspace for the whole of its turn. Against an
          # edit to `scripts/` mid-turn, not a boundary against the agent.
          cp scripts/gemini-cell.sh "$RUNNER_TEMP/gemini-cell.sh"
          bash "$RUNNER_TEMP/gemini-cell.sh" predict "$PREDICTOR_ID"

      # Stand the watchdog down the moment the engine step is over, however it
      # ended, so it can never fire late and kill something in the tail.
      # `always()` and not the arm step's gate: a refused or failed cell must
      # disarm too, and in a refused cell there is simply no pid file to read.
      #
      # It also publishes the watchdog's verdict, and one of the markers is a
      # *success*: `REAPED` says the cell's outputs were complete, parsing and
      # quiescent, and the step was ended because it would not end itself. The
      # engine step's own conclusion on that path is a failure — the watchdog
      # made it one — so this step's `reaped` output is what the tail below
      # reads instead, and a cell whose work finished is not demoted to a draft
      # for the manner of its step's death. `SUSPENDED` is the neutral one: the
      # watchdog lost wall clock beside the engine and withheld every signal,
      # so the cell's outcome is whatever its step did on its own — the marker
      # is surfaced for the reader and decides nothing about the cell.
      - name: Disarm the engine watchdog
        id: disarm
        if: ${{ always() }}
        env:
          COURT_ID: ${{ matrix.court }}
          DOCKET_ID: ${{ matrix.docket }}
          EVENT_ID: ${{ matrix.event_id }}
          CODEX_HOME: ${{ github.workspace }}/.codex
          ACTOR_ID: ${{ matrix.predictor_id }}
          RUN_ID: ${{ matrix.run_id }}
          ENGINE: ${{ matrix.engine }}
        run: |
          set -euo pipefail
          # The pid file sits on the runner's temp path, which the agent could
          # also write, so signal only a pid that is a number and is this
          # script's own watchdog — never whatever the file happens to name.
          pid_file="$RUNNER_TEMP/engine-watchdog.pid"
          if [ -f "$pid_file" ]; then
            pid=$(cat "$pid_file")
            if [[ "$pid" =~ ^[0-9]+$ ]] && grep -qa engine-watchdog.sh "/proc/$pid/cmdline" 2>/dev/null; then
              kill "$pid" 2>/dev/null || true
            fi
            rm -f "$pid_file"
          fi
          # codex ran as the separate `codexcell` account: its session rollout
          # landed under that account's derived `~/.codex`, and its output
          # subtree is codexcell-owned. Return both to the runner here — the
          # FIRST runner-user step after the turn, and now the watchdog is stood
          # down — so this step's item-shapes distiller AND the usage/retrieval
          # captures, the process-version stamp, the validate step and the upload
          # below all read the rollout and read+write the output. The bracket forbids a
          # separate step between the engine and this one, so the handoff lives
          # here rather than in the `codex-user-teardown` action the integration
          # legs call — the two do the same thing. Defensive throughout: a
          # refused or non-codex cell provisioned no account, a missing rollout
          # is a warning, and no failure here fails the disarm.
          if [ "$ENGINE" = "codex" ] && id -u codexcell >/dev/null 2>&1; then
            # A reap/timeout can orphan a codexcell process still writing the
            # output subtree; kill the account before the handoff so the rollout
            # and output are stable and the chown-back cannot race a live writer.
            sudo pkill -u codexcell 2>/dev/null || true
            ch="$(getent passwd codexcell | cut -d: -f6 || true)"
            if [ -n "$ch" ] && [ ! -L "$ch/.codex/sessions" ] && [ -d "$ch/.codex/sessions" ]; then
              mkdir -p "$CODEX_HOME/sessions"
              # NO sudo, `-Rd`: the runner copies the codexcell-owned but
              # runner-readable rollout AS ITSELF, so a repointed `sessions`
              # cannot hand a root copy an arbitrary read; `-Rd` never
              # dereferences a tree entry. The `-L` guard refuses a symlinked
              # sessions dir outright. Same handoff as codex-user-teardown.
              cp -Rd "$ch/.codex/sessions/." "$CODEX_HOME/sessions/" || true
            else
              echo "::warning::no codex rollout under codexcell's home for ${EVENT_ID}"
            fi
            out="data/cases/$COURT_ID/$DOCKET_ID/events/$EVENT_ID/predictions/$ACTOR_ID/$RUN_ID"
            if [ -d "$out" ]; then
              sudo chown -R "$(id -u):$(id -g)" "$out" || true
            fi
          fi
          # Read from the runner-temp bundle rather than the workspace copy
          # assembled below, so what is read is the copy the watchdog wrote and
          # not one the disarm step just derived. That is the whole of the claim:
          # on a claude or gemini cell the agent runs as this same uid,
          # unsandboxed (bypassPermissions / --yolo), so nothing on the runner is
          # out of its reach and `reaped` is a runner-local signal it could forge
          # to have its own step counted clean. A codex cell cannot — its agent
          # is a separate account that cannot write the runner-owned bundle dir.
          # What contains a forged reap on the engines that can is not this path:
          # it only promotes a cell that must still pass `produced`, `validate`,
          # the collect job's secret scan and the `data/` path jail — and an
          # agent that controls its own outputs faces exactly those anyway.
          # SECURITY.md carries this residual rather than leaving it implied
          # here.
          reaped=false
          if [ -f "$RUNNER_TEMP/engine-watchdog/REAPED" ]; then
            reaped=true
          fi
          echo "reaped=$reaped" >> "$GITHUB_OUTPUT"
          # The deadline, as a cell-level fact the tail records into
          # status.json, so the run PR names the cause of the stop after the
          # runner and its annotations are gone. Read from the same runner-temp
          # bundle; an engine that runs as this uid could plant the marker, but
          # what that buys is a demotion's *label* — it never readies a cell.
          deadline=false
          if [ -f "$RUNNER_TEMP/engine-watchdog/FIRED" ] || [ -f "$RUNNER_TEMP/engine-watchdog/STOOD_DOWN" ]; then
            deadline=true
          fi
          echo "deadline=$deadline" >> "$GITHUB_OUTPUT"
          # Bring the bundle into the workspace, which is what the cell
          # artifact uploads. Regular files only: `upload-artifact` follows
          # symlinks, so copying the directory wholesale would let a planted
          # link publish an unrelated readable file.
          if [ -d "$RUNNER_TEMP/engine-watchdog" ]; then
            rm -rf engine-watchdog
            mkdir -p engine-watchdog
            find "$RUNNER_TEMP/engine-watchdog" -maxdepth 1 -type f \
              -exec cp -p {} engine-watchdog/ \;
          fi
          # The rollout itself never leaves the runner — it carries retrieved
          # documents verbatim, and a cell artifact is downloadable by anyone
          # with a GitHub account for its retention window. Its distilled item
          # shapes say what the engine was doing without republishing what it
          # read, so they are what a watchdog that acted hands the bundle. A
          # reap earns them too, and for the sharpest reason: that transcript
          # ends at a completed turn, so it is the account of a teardown hang.
          # A suspension earns them for the same reason from the other side:
          # the freeze brackets the sandbox's life, so that rollout's tail is
          # the account of the very window the watchdog could not observe.
          # Codex-only because the distiller reads codex's own rollout format.
          if [ "$ENGINE" = "codex" ] \
            && { [ -f engine-watchdog/REAPED ] || [ -f engine-watchdog/FIRED ] || [ -f engine-watchdog/STOOD_DOWN ] \
              || [ -f engine-watchdog/SUSPENDED ]; }; then
            uv run fedcourts codex-item-shapes \
              --sessions-dir "$CODEX_HOME/sessions" \
              --out engine-watchdog/session-shapes.json \
              || echo "::warning::no codex item shapes distilled for ${EVENT_ID}"
          fi
          # A watchdog that acted is a cell-level fact whichever way it went —
          # and one that stood down is too — so say it where the run is read;
          # the bundle itself rides the cell artifact uploaded below. The marker is truncated on the way into the
          # summary — the bundle directory is runner-writable, and a summary is
          # rendered markdown.
          for marker in REAPED FIRED STOOD_DOWN SUSPENDED; do
            [ -f "engine-watchdog/$marker" ] || continue
            case "$marker" in
              REAPED) note="the cell finished its work and its step would not conclude; the watchdog ended the step and the output was salvaged" ;;
              FIRED) note="the engine was still running at the engine deadline and was killed" ;;
              SUSPENDED) note="the watchdog lost wall clock beside the engine and stood down; nothing was signalled — the cell's outcome is its step's own" ;;
              *) note="the engine deadline passed with no engine process matched; the marker says whether the step's tree was ended" ;;
            esac
            echo "::warning::engine watchdog (${COURT_ID}/${DOCKET_ID} ${EVENT_ID}): ${note}"
            {
              echo "## engine watchdog — ${COURT_ID}/${DOCKET_ID} ${EVENT_ID}"
              echo "${note}; diagnostics ride in this cell's artifact under \`engine-watchdog/\`."
              echo '```'
              head -c 500 "engine-watchdog/$marker"
              echo
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          done

      # Put the hidden predictions/evaluations trees back the moment the agent
      # stops — ahead of every post-agent step that reads the tree (only the
      # watchdog's disarm runs before it, and that one touches runner temp and
      # the bundle alone). The stamp and `validate` read the committed trees,
      # and the usage and retrieval captures write into the cell's own
      # predictions/<predictor>/<run>/, under a hidden tree's path. It restores
      # file by file and refuses to overwrite, because the agent writes its own
      # prediction where a hidden tree stood. `!cancelled()` and no `success()`
      # gate on the hide, as in run-evaluate: a failed or timed-out agent still
      # has its cell recorded, and a skipped restore behind a green-looking job
      # is the failure this exists to prevent. No failure here can lose
      # committed data: the collect union is add-only, so a tree missing from a
      # cell's artifact is a no-op, never a deletion.
      - name: Restore the committed cell record
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          uv run fedcourts restore-cell-record --stash-dir "$RUNNER_TEMP/hidden-record"

      # The post-run half of the forward cell's docket bracket: the same poll the
      # provisioning step took before the record was written, taken again now the
      # engine has stopped. Record only — it never refuses or removes a cell. The
      # docket number comes from the provisioning step's output, fixed before the
      # agent ran, never from the cell's record, which the agent could change; the
      # result leaves as this step's output for the usage capture, so no file the
      # agent could reach carries it. Pre and post both `open` say the whole run
      # ended before the served docket showed a decision.
      - name: Poll the docket after the run
        id: post_poll
        if: ${{ !cancelled() && steps.provision.outputs.pre_mint_poll != '' && (steps.predict_claude.conclusion == 'success' || steps.predict_codex.conclusion == 'success' || steps.predict_gemini.conclusion == 'success' || steps.disarm.outputs.reaped == 'true') }}
        continue-on-error: true
        timeout-minutes: 2
        env:
          COURT_ID: ${{ matrix.court }}
          EVENT_ID: ${{ matrix.event_id }}
          PRE_MINT_POLL: ${{ steps.provision.outputs.pre_mint_poll }}
        run: |
          set -euo pipefail
          number=$(jq -r '.docket_number // empty' <<<"$PRE_MINT_POLL")
          if [ -z "$number" ]; then
            exit 0
          fi
          poll="$RUNNER_TEMP/post-run-poll.json"
          uv run fedcourts poll-docket --court "$COURT_ID" --docket-number "$number" --event "$EVENT_ID" --out "$poll"
          echo "post_run_poll=$(tr -d '\n' < "$poll")" >> "$GITHUB_OUTPUT"
          rm -f "$poll"

      # Record measured token usage + estimated cost next to the prediction so a
      # maintainer can sum it into a real $/run (docs/budget.md). Best-effort: the
      # engine logs are read here, never the agent's word, and a miss must not
      # fail the prediction — hence continue-on-error.
      # A reaped cell is included: the watchdog failed its step *after* the agent
      # finished, so the engine log it reads is a complete one and the tokens it
      # measures were really spent. The explicit `!cancelled()` is what lets that
      # clause reach anything — a reap ends the engine step as a failure, and
      # without a status function here GitHub ANDs an implicit `success()`, which
      # a failed step has already made false. It is the shape the evaluate cell's
      # usage capture already carries.
      - name: Capture model usage
        if: ${{ !cancelled() && (steps.predict_claude.conclusion == 'success' || steps.predict_codex.conclusion == 'success' || steps.predict_gemini.conclusion == 'success' || steps.disarm.outputs.reaped == 'true') }}
        continue-on-error: true
        env:
          COURT_ID: ${{ matrix.court }}
          DOCKET_ID: ${{ matrix.docket }}
          EVENT_ID: ${{ matrix.event_id }}
          PREDICTOR_ID: ${{ matrix.predictor_id }}
          RUN_ID: ${{ matrix.run_id }}
          ENGINE: ${{ matrix.engine }}
          MODEL: ${{ matrix.model }}
          CLAUDE_EXECUTION_FILE: ${{ steps.predict_claude.outputs.execution_file }}
          CLAUDE_BIN: ${{ steps.engine-cli.outputs.path }}
          REPORTED_VERSION: ${{ steps.engine-cli.outputs.reported-version }}
          ENGINE_PIN: ${{ steps.engine-cli.outputs.version }}
          PRE_MINT_POLL: ${{ steps.provision.outputs.pre_mint_poll }}
          POST_RUN_POLL: ${{ steps.post_poll.outputs.post_run_poll }}
          CODEX_HOME: ${{ github.workspace }}/.codex
          GEMINI_TELEMETRY_FILE: ${{ github.workspace }}/.gemini/telemetry.log
        run: |
          set -euo pipefail
          args=(record-usage
            --court "$COURT_ID" --docket "$DOCKET_ID" --event "$EVENT_ID"
            --run-id "$RUN_ID" --engine "$ENGINE"
            --role predictor --actor "$PREDICTOR_ID")
          # The pre-mint poll provisioning took, from its step output (fixed
          # before the agent ran), into the usage record.
          if [ -n "$PRE_MINT_POLL" ]; then
            poll_file="$(mktemp)"
            printf '%s\n' "$PRE_MINT_POLL" > "$poll_file"
            args+=(--pre-mint-poll-file "$poll_file")
          fi
          if [ -n "$POST_RUN_POLL" ]; then
            post_file="$(mktemp)"
            printf '%s\n' "$POST_RUN_POLL" > "$post_file"
            args+=(--post-run-poll-file "$post_file")
          fi
          if [ -n "$MODEL" ]; then args+=(--model "$MODEL"); fi
          # The engine version the record carries is the binary's own report:
          # read by the install step before any agent ran where the harness
          # installs the CLI, and here, after the run, for codex, which its
          # action installs. record-usage keeps the install-time read and
          # records any disagreement — the after-run read, or the pin the
          # workflow installed from — in usage.json, never picking a side.
          case "$ENGINE" in
            claude-code) engine_bin="${CLAUDE_BIN:-claude}" ;;
            *) engine_bin="$ENGINE" ;;
          esac
          after=$(timeout 30 "$engine_bin" --version 2>/dev/null | head -n 1) || after=""
          args+=(--engine-version "$REPORTED_VERSION" --engine-version-after "$after"
            --engine-pin "$ENGINE_PIN")
          # Guarded like the retrieval capture beside it: on a reaped cell the
          # claude execution file is an *output of the step the watchdog killed*,
          # so it arrives empty and passing it would only produce a warning about
          # a path that was never named. Codex and gemini read disk instead, so
          # their usage survives a reap; claude's does not, which is a gap in the
          # accounting and not in the cell.
          if [ "$ENGINE" = "claude-code" ] && [ -n "$CLAUDE_EXECUTION_FILE" ]; then
            args+=(--claude-execution-file "$CLAUDE_EXECUTION_FILE")
          elif [ "$ENGINE" = "gemini" ]; then
            args+=(--gemini-telemetry-file "$GEMINI_TELEMETRY_FILE")
          elif [ "$ENGINE" = "codex" ]; then
            args+=(--codex-sessions-dir "$CODEX_HOME/sessions")
          fi
          # Surface the measured tokens + estimated $ in the Actions UI. The
          # command already prints `usage: <actor> <N> tok ~$<cost> -> <path>`; keep
          # all but the path. A miss just warns (best-effort, like the step itself).
          if out=$(uv run fedcourts "${args[@]}"); then
            echo "$out"
            {
              echo "## predict usage — ${COURT_ID}/${DOCKET_ID} ${EVENT_ID} (${ENGINE})"
              echo "${out%% -> *}"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::no model usage captured for ${EVENT_ID}"
          fi

      # Harvest the cell's tool-call transcript to retrieval_log.json —
      # from the engine's own log (the same sources the usage capture reads),
      # never the agent's word — so the cross-evaluator can grade what a cell
      # actually retrieved. Runs even when the agent failed or timed out
      # (a partial transcript is still evidence); best-effort like the usage
      # capture, so a parse miss warns rather than failing the cell.
      - name: Capture retrieval log
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          COURT_ID: ${{ matrix.court }}
          DOCKET_ID: ${{ matrix.docket }}
          EVENT_ID: ${{ matrix.event_id }}
          PREDICTOR_ID: ${{ matrix.predictor_id }}
          RUN_ID: ${{ matrix.run_id }}
          ENGINE: ${{ matrix.engine }}
          CLAUDE_EXECUTION_FILE: ${{ steps.predict_claude.outputs.execution_file }}
          CODEX_HOME: ${{ github.workspace }}/.codex
          GEMINI_TELEMETRY_FILE: ${{ github.workspace }}/.gemini/telemetry.log
        run: |
          set -euo pipefail
          args=(record-retrieval
            --court "$COURT_ID" --docket "$DOCKET_ID" --event "$EVENT_ID"
            --run-id "$RUN_ID" --engine "$ENGINE"
            --role predictor --actor "$PREDICTOR_ID" --mode forward --mode-from-context)
          if [ "$ENGINE" = "claude-code" ] && [ -n "$CLAUDE_EXECUTION_FILE" ]; then
            args+=(--claude-execution-file "$CLAUDE_EXECUTION_FILE")
          elif [ "$ENGINE" = "gemini" ]; then
            args+=(--gemini-telemetry-file "$GEMINI_TELEMETRY_FILE")
          elif [ "$ENGINE" = "codex" ]; then
            args+=(--codex-sessions-dir "$CODEX_HOME/sessions")
          fi
          uv run fedcourts "${args[@]}" \
            || echo "::warning::no retrieval log captured for ${EVENT_ID}"

      # Stamp the agent's prediction.json with its process version — the prompt
      # template and resolved registry config in force at run time, hashed by the
      # harness (not the agent's word, exactly like usage.json). Metrics partition
      # the frozen headline on this digest. Runs BEFORE "Record cell status" (which
      # validates), so a stamp of a genuine config inconsistency fails the cell
      # honestly; a missing artifact (no-output cell) is a clean no-op. NOT
      # continue-on-error: unlike the flaky-log captures above, stamping is
      # deterministic and local, so a failure is a real bug worth surfacing.
      - name: Stamp the process version
        if: ${{ !cancelled() }}
        env:
          COURT_ID: ${{ matrix.court }}
          DOCKET_ID: ${{ matrix.docket }}
          EVENT_ID: ${{ matrix.event_id }}
          PREDICTOR_ID: ${{ matrix.predictor_id }}
          RUN_ID: ${{ matrix.run_id }}
        run: |
          set -euo pipefail
          uv run fedcourts stamp-cell \
            --court "$COURT_ID" --docket "$DOCKET_ID" --event "$EVENT_ID" \
            --run-id "$RUN_ID" --role predictor --actor "$PREDICTOR_ID"

      # The cell no longer opens a PR. Even when the agent failed or timed out
      # (`!cancelled()`), record what it produced and hand its output to the
      # collect job; that job aggregates the whole run into one PR. The decisions
      # (produced? validated?) use the same tested commands the old finalize step
      # did — this step only records them into a status file the collect job reads.
      - name: Record cell status
        if: ${{ !cancelled() }}
        env:
          COURT_ID: ${{ matrix.court }}
          DOCKET_ID: ${{ matrix.docket }}
          EVENT_ID: ${{ matrix.event_id }}
          PREDICTOR_ID: ${{ matrix.predictor_id }}
          RUN_ID: ${{ matrix.run_id }}
          # Did the agent finish cleanly? On max-turns or a step timeout the engine
          # step fails; its partial output still rides to the collect job, which
          # routes it to a draft PR a maintainer completes — never the ready one.
          #
          # A **reaped** cell counts as clean, and that is the whole point of the
          # reaper: the watchdog only ends a step whose required outputs are all
          # present, parsing and quiescent, so the failed step is the watchdog's
          # doing and not the agent's. Nothing else is relaxed — `produced` and
          # `validated` below still have to hold, so a reaped cell that wrote
          # malformed output still lands in the draft PR.
          AGENT_OK: ${{ (matrix.engine == 'claude-code' && steps.predict_claude.outcome == 'success') || (matrix.engine == 'codex' && steps.predict_codex.outcome == 'success') || (matrix.engine == 'gemini' && steps.predict_gemini.outcome == 'success') || steps.disarm.outputs.reaped == 'true' }}
          # The watchdog acted at the engine deadline (its disarm step's read
          # of the bundle). Recorded beside `agent_ok`, never instead of it:
          # it names why a cell stopped, which the collect job renders into
          # the draft PR's reason column.
          ENGINE_DEADLINE: ${{ steps.disarm.outputs.deadline == 'true' }}
          # Either gate refused the cell, so no engine ran.
          CELL_REFUSED: ${{ steps.provision.outputs.refused == 'true' || steps.record.outputs.refused == 'true' }}
          # The pre-mint poll's record, for a cell it refused: the collect job
          # rolls those up as designed refusals rather than counting them as
          # cells that produced nothing.
          PRE_MINT_POLL: ${{ steps.provision.outputs.pre_mint_poll }}
        run: |
          set -euo pipefail
          # The event.yaml is materialized before the agent runs, so a staged change
          # is not proof of a prediction. `finalize-produced` checks for the agent's
          # own prediction.json; only a produced cell is validated, and the collect
          # job commits only produced cells (a no-output cell is just warned about).
          produced=$(uv run fedcourts finalize-produced --role predict \
            --court "$COURT_ID" --docket "$DOCKET_ID" --event "$EVENT_ID" \
            --actor "$PREDICTOR_ID" --run-id "$RUN_ID")
          # A cell that lands nothing still concludes green — the collect job
          # owns the miss, recording its failure fact against the cell's
          # attempt cap — so it is named here, where the run's annotations
          # carry it, rather than left to be found by its absence. A refused
          # cell ran no engine and its gate has already said so.
          if [ "$produced" != "true" ] && [ "$CELL_REFUSED" != "true" ]; then
            echo "::warning::cell ${PREDICTOR_ID} ${COURT_ID}/${DOCKET_ID} ${EVENT_ID} produced no output (no_output; engine step ok: ${AGENT_OK})"
          fi
          validated=false
          if [ "$produced" = "true" ] && uv run fedcourts validate data; then
            validated=true
          fi
          # A poll-refused cell records the refusal; anything else records null. A
          # malformed poll output is read as no refusal, never as a failed step.
          refusal=$(jq -c 'if .state == "decided" then {polled_at, reason} else null end' \
            <<<"${PRE_MINT_POLL:-null}" 2>/dev/null) || refusal=null
          [ -n "$refusal" ] || refusal=null
          jq -n \
            --arg court "$COURT_ID" --argjson docket "$DOCKET_ID" \
            --arg event_id "$EVENT_ID" --arg actor "$PREDICTOR_ID" --arg run_id "$RUN_ID" \
            --argjson produced "$produced" --argjson validated "$validated" \
            --argjson agent_ok "$AGENT_OK" --argjson engine_deadline "$ENGINE_DEADLINE" \
            --argjson pre_mint_refusal "$refusal" \
            '{court:$court,docket:$docket,event_id:$event_id,actor:$actor,run_id:$run_id,produced:$produced,validated:$validated,agent_ok:$agent_ok,engine_deadline:$engine_deadline,pre_mint_refusal:$pre_mint_refusal}' \
            > status.json

      # One artifact per cell: its status.json, its own matrix event directory
      # under data/ — everything a cell legitimately produces lives there, and
      # shipping the rest of the checkout would hand collect a stale copy of
      # files the deterministic writers may have advanced on main while the
      # matrix ran — and the watchdog's directory, which carries its own log
      # always and the diagnostics bundle when it acted —
      # shapes and metadata only, because a cell artifact is downloadable by
      # anyone with a GitHub account for its retention window. The collect job
      # unions only `data/` (add-only) into the run's commit, so the bundle
      # never reaches the ledger. status.json at the workspace root also anchors
      # the artifact's layout: upload-artifact roots the archive at the matched
      # paths' common ancestor, so without it the deep data/ path would lose its
      # prefix and the collect union would find nothing. The name is unique per
      # predictor x case x event so concurrent cells never collide, and the
      # collect job keys the download on the `predict-` prefix.
      - name: Upload cell output
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: predict-${{ matrix.predictor_id }}-${{ matrix.court }}-${{ matrix.docket }}-${{ matrix.event_id }}
          path: |
            status.json
            data/cases/${{ matrix.court }}/${{ matrix.docket }}/events/${{ matrix.event_id }}
            engine-watchdog
          if-no-files-found: error
          retention-days: 7

      # The sidecars' logs carry their startup lines and per-request records
      # (server noise, no secrets — GitHub masks the credentials regardless):
      # surface them in the job log so a mid-run sidecar death or a failed
      # lookup is diagnosable without re-running the cell.
      - name: Show the sidecar logs
        if: ${{ always() }}
        continue-on-error: true
        run: |
          set -euo pipefail
          # Indent every replayed line: the logs are agent-adjacent bytes, and
          # a line starting with ::<command>:: would otherwise be parsed as a
          # workflow command by the runner.
          for log in corpus-sidecar.log cl-mcp-sidecar.log; do
            if [ -f "$log" ]; then
              echo "--- $log"
              tail -n 100 "$log" | sed 's/^/  /'
            fi
          done

  collect:
    # Defence in depth only. Both attempts of a re-run share `run_id`, so this
    # groups them — but GitHub refuses to re-run a run that is still in
    # progress, and the workflow-level group already serializes rounds.
    # Note the run PR's branch is keyed on the *plan-time* run id from the
    # cells' status.json, not `github.run_id`, so this group does not itself
    # guard the branch; it is cheap insurance behind those two, not the thing
    # that prevents a force-push clobber.
    concurrency:
      group: collect-${{ github.workflow }}-${{ github.run_id }}
      cancel-in-progress: false
    needs: [authorize, plan, approval, predict]
    # Run after the whole fan-out even if some cells failed, as long as the plan
    # queued jobs AND the hold released. Without the approval clause, always()
    # would fire this writer on a rejected hold (predict merely skipped) and
    # spin up the collect machinery over a run that spent nothing. This is the
    # only writer: it unions the cells' artifacts into one
    # PR per run (merged by this job when green) plus, if any cell left salvageable
    # partial output, one draft PR a maintainer finishes.
    if: >-
      ${{ always() && needs.plan.outputs.has_jobs == 'true' && needs.approval.result == 'success'
      && needs.authorize.result == 'success'
      && (needs.authorize.outputs.attempt == github.run_attempt
      || contains(needs.authorize.outputs.rerunners, format(',{0},', github.triggering_actor))) }}
    runs-on: ubuntu-24.04
    # The collect action downloads cell artifacts per artifact with bounded
    # parallelism (4 workers; each download is its own degradation boundary —
    # see the download step's comment), with up to 3 attempts and backoff per
    # artifact. A clean full-width pass (102 cells — three actors over a
    # 34-event trigger — at 5-10s per download) spends 3-5 minutes before
    # aggregation begins, an all-retry pass approaches 20, and the
    # aggregation after it was still running at 30 minutes on the first
    # post-freeze full-width run with every cell green. The collect step's own
    # cap of 50 is set by the App token's one-hour life, minted at job start and
    # spent at that step's end — the push, the PR, the auto-merge arm — so a
    # step outliving the hour trades a clean timeout-cancel for a 401
    # mid-push; 50 buys the measured aggregation while keeping the
    # credentialed tail inside the hour. The job's cap adds the three report
    # steps' own bounds and the merge step's, which mints a token of its own.
    # A cap kill either side of the push — mid-aggregation, or after a
    # push and before its PR — costs a maintainer round trip while the
    # artifacts live (rerunning collect is the documented idempotent
    # recovery). If 50 proves short, the durable fixes are re-minting the
    # token between download and aggregation, or scoping the per-kind
    # validate to the run's changed paths — not a bigger number.
    timeout-minutes: 105
    environment: prod
    permissions:
      contents: write # commit the run's predictions to a branch
      pull-requests: write # open the run PR, arm auto-merge (App token)
      checks: read # the merge step lists the run PR's check runs (GITHUB_TOKEN)
      issues: write # GITHUB_TOKEN posts flags to the agent-feedback issue (not the App token)
      actions: read # fetch this run's cell artifacts (repo-wide read; collect runs no agent code)
    steps:
      # The collect job opens and merges the PR with the dev App token. The dev
      # App bypasses no required check (see docs/security.md) — only `main`'s
      # approval rule — so its merge is bound by the required `gate` + `paths`
      # checks.
      - name: Mint app token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.DEV_APP_CLIENT_ID }}
          private-key: ${{ secrets.DEV_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: ./.github/actions/setup-python-env
        with:
          restore-cache: "false"

      - name: Configure git identity
        uses: ./.github/actions/configure-git-identity
        with:
          token: ${{ steps.app-token.outputs.token }}
          app-slug: ${{ steps.app-token.outputs.app-slug }}

      - name: Collect the run into one PR
        id: collect
        # The token-life bound; see the job's cap above.
        timeout-minutes: 50
        uses: ./.github/actions/collect-run
        with:
          role: predict
          token: ${{ steps.app-token.outputs.token }}
          repo: ${{ github.repository }}
          issue: ${{ github.event.issue.number }}
          matrix: ${{ needs.plan.outputs.matrix }}
          # The mark the next round's daily auto-release cap counts on `main`.
          auto-released: ${{ needs.plan.outputs.auto_release }}
          github-token: ${{ github.token }}
          courtlistener-token: ${{ secrets.COURTLISTENER_API_TOKEN }}

      - name: Flag a stalled run
        # A run that produced no output opens no PR, so nothing would close — or
        # even mention — the trigger issue; it would sit silently orphaned open.
        # Post the tested stall comment (rendered by the aggregate step) with the
        # ambient GITHUB_TOKEN: commenting triggers nothing, so the contents-write
        # App token stays out of it. Runs even if the aggregate step failed; the
        # file is absent whenever the run produced output.
        # A round with no trigger issue has nothing to orphan, but the stall
        # itself still has to be visible, so the report falls back to the step
        # summary rather than being skipped — a silent stall is exactly what this
        # step exists to stop. Every round takes that branch: no lane in this
        # repository has an issue trigger, so the issue number is always empty.
        # The issue arm is kept because `collect-run`'s contract still admits an
        # issue number and this job is held structurally identical to
        # run-evaluate's — not because a round here can supply one.
        if: ${{ always() }}
        # Two retried gh calls inside the deduped issue-comment command,
        # each worth up to 105s against a degraded API — bounded per step so a
        # degraded API at one report cannot spend the collect job's cap that
        # the later always()-gated report steps still need.
        timeout-minutes: 5
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          [ -s stall-comment.md ] || exit 0
          if [ -z "$ISSUE" ]; then
            # No issue to comment on, so the run's own summary is the report.
            # The rendered comment reads correctly there: it addresses the round
            # rather than a request, and its retry line is the lane's next
            # derivation, which needs nothing filed.
            {
              echo '## stalled run'
              echo ''
              cat stall-comment.md
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Marker-deduped: this step reruns whenever collect does, and rerunning
          # collect is the documented recovery for a transfer failure, so a plain
          # comment would stack a copy per attempt and bury the warning.
          uv run fedcourts post-issue-comment --issue "$ISSUE" --repo "$REPO" \
            --marker "<!-- collect-stall: ${GITHUB_RUN_ID} -->" \
            --body-file stall-comment.md

      - name: Flag a secret-scan hit
        # A withheld branch opens no PR, so without this the scan hit would be
        # visible only in the Actions log. Same ambient-token posture as the
        # stall step above; the file is absent whenever the scan came back
        # clean.
        # Falls back to the step summary on an issue-less round, like the stall
        # step — with more at stake: a security report that is skipped because
        # the round had no issue is a security report deduped into silence.
        if: ${{ always() }}
        # Same bound as the stall step above, for the same reason.
        timeout-minutes: 5
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          [ -s secret-scan-issue.md ] || exit 0
          if [ -z "$ISSUE" ]; then
            {
              echo '## secret-scan hit (branch withheld)'
              cat secret-scan-issue.md
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Marker-deduped: this step reruns whenever collect does, and rerunning
          # collect is the documented recovery for a transfer failure, so a plain
          # comment would stack a copy per attempt and bury the warning.
          #
          # Keyed on the report's *content*, not just the run, unlike the stall
          # comment above. A later attempt can collect a different artifact set
          # and so hit a different file; a run-only key would suppress that
          # second, distinct redacted report and the trigger issue would never
          # learn about it. A security report must never be deduped into silence.
          digest=$(sha256sum secret-scan-issue.md | cut -c1-16)
          uv run fedcourts post-issue-comment --issue "$ISSUE" --repo "$REPO" \
            --marker "<!-- collect-secret-scan: ${GITHUB_RUN_ID}-${digest} -->" \
            --body-file secret-scan-issue.md

      - name: Latch run flags onto the agent-feedback issue
        # Post with the ambient GITHUB_TOKEN (job-scoped `issues: write`), NOT the dev
        # App token: latching needs no cross-workflow trigger (`agent-feedback` is a
        # non-triggering label), so issue-write stays off this job's contents-write
        # token. The find-or-create and once-only idempotency are the tested
        # `post-agent-feedback` command (agent_feedback.py); this only invokes it.
        # The file is empty/absent when the run raised no flags — and also when
        # the aggregate step aborted mid-loop or the run's secret scan did not
        # pass, since the roll-up is written (scanned) at that step's end: the
        # latch is best-effort, deliberately fail-closed on agent free text.
        if: ${{ always() }}
        # Up to five retried gh calls behind the find-or-create (the label
        # ensure, the listing, the issue create on first use, the marker read,
        # the comment), each worth up to 105s against a degraded API — 525s
        # worst case, plus margin for the env spin-up.
        timeout-minutes: 12
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          [ -s feedback-comment.md ] || exit 0
          uv run fedcourts post-agent-feedback --repo "$REPO" --body-file feedback-comment.md

      # Land the run PR. Armed auto-merge never exercises the dev App's
      # approval bypass on `main` — it waits for an approval like any other PR —
      # so this job merges the PR itself once the platform accepts it. The bypass
      # covers the approval rule alone: `main: require PR`, which carries the
      # required `gate` and `paths` checks, does not list the dev App, so the
      # merge is refused until they pass. Pinned to the commit the collect step
      # pushed; the script says what else stops it. A fresh token, because the
      # first was minted at job start and the collect step can spend most of its
      # hour. Gated on the collect step alone: a report step that failed on an
      # API blip changes nothing that was pushed, and should not strand it.
      - name: Mint merge token
        id: merge-token
        if: ${{ !cancelled() && steps.collect.outcome == 'success' && steps.collect.outputs.merge-targets != '' }}
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.DEV_APP_CLIENT_ID }}
          private-key: ${{ secrets.DEV_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Merge the run PR once its checks pass
        if: ${{ !cancelled() && steps.collect.outcome == 'success' && steps.collect.outputs.merge-targets != '' }}
        # The script waits up to 20 minutes; the required checks on a run PR
        # take a few.
        timeout-minutes: 25
        shell: bash
        env:
          GH_TOKEN: ${{ steps.merge-token.outputs.token }}
          # Checks read for the check-run listing, so the dev App needs none.
          CHECKS_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          MERGE_TARGETS: ${{ steps.collect.outputs.merge-targets }}
        run: |
          set -euo pipefail
          # The script as this job's own commit holds it, never the working
          # tree, which has held cell artifacts by now.
          script="${RUNNER_TEMP}/merge-when-green.sh"
          git show "${GITHUB_SHA}:scripts/merge-when-green.sh" > "$script"
          while read -r pr sha; do
            [ -n "${pr:-}" ] || continue
            bash "$script" "$pr" "$sha" < /dev/null
          done <<<"$MERGE_TARGETS"

  # The drain chain. A round that a cap stopped short of the backlog
  # (`hold-decision`'s `drain_more`) dispatches the next round itself rather than
  # leaving the rest for the next scheduled slot. It waits for this round's own
  # collect PR to merge first: the next round's already-predicted gate reads
  # committed state, so dispatching earlier would hand the stranded-run guard
  # this round's cells to withhold and plan a narrower round. A PR that has not
  # merged inside the wait, or closed unmerged, dispatches nothing — the schedule
  # picks the backlog up, since the lane is level-triggered. Nor does a
  # promotion about to merge — a ready `staging` PR, or a ready promotion train
  # candidate approved at its head: the promotion gate's quiescence check fails
  # on any queued, running or waiting predict round, so the chain stands down
  # until that PR merges, returns to draft or loses its approval. Each step's answer is `fedcourts chain-step`'s;
  # the loop below only reads the PRs and acts on it.
  #
  # The dispatched round is an ordinary input-less dispatch on `main`: it
  # derives its own backlog and renders its own plan, and waits on the hold
  # unless its own plan auto-releases. So the chain moves *when* a round
  # derives, never what it spends without the caps' say-so.
  #
  # Off until the maintainer turns it on: the job is skipped unless the
  # repository-level `DISPATCH_CHAIN_ENABLED` variable is `true`. The switch is
  # repository-level because a job's `if:` is evaluated before the job binds its
  # environment, so a `prod`-only variable reads empty there; the App's own
  # client id and key stay on `prod`. That App holds Actions write (plus the
  # PR read the wait below needs) and nothing else, so no job that runs agent
  # code or writes the corpus holds a token that can dispatch.
  chain:
    needs: [authorize, plan, collect]
    if: >-
      ${{ !cancelled() && needs.plan.outputs.drain_more == 'true' && needs.collect.result == 'success' && vars.DISPATCH_CHAIN_ENABLED == 'true'
      && needs.authorize.result == 'success'
      && (needs.authorize.outputs.attempt == github.run_attempt
      || contains(needs.authorize.outputs.rerunners, format(',{0},', github.triggering_actor))) }}
    runs-on: ubuntu-24.04
    # The wait below is 40 minutes; the cap leaves the dispatch inside the App
    # token's one-hour life, which is minted after the checkout and setup.
    timeout-minutes: 55
    environment: prod
    # The checkout below needs read; everything else rides the dispatch token.
    permissions:
      contents: read
    steps:
      # `main`'s own code (the job binds `prod`, which admits only `main`), for
      # `fedcourts chain-step`. No credential persists in the checkout.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-python-env
        with:
          restore-cache: "false"

      - name: Mint the dispatch token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.DISPATCH_APP_CLIENT_ID }}
          private-key: ${{ secrets.DISPATCH_APP_PRIVATE_KEY }}
          permission-actions: write
          permission-pull-requests: read

      - name: Wait for this round's collect PR, then dispatch the next round
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          BRANCH: predict/run-${{ needs.plan.outputs.run_id }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 40); do
            # Reads only (GETs with the query in the URL). A failed read drops
            # its file, which `chain-step` reads as unknown: a missing promotion
            # list stands the chain down, a missing collect PR waits.
            if gh api --paginate --slurp "repos/${REPO}/pulls?state=open&base=main&per_page=100" \
              > promotion-prs.pages && jq 'add // []' promotion-prs.pages > promotion-prs.json; then
              # A ready promotion train candidate stands the chain down only once it is
              # approved at its head, which its whole review list says. A failed read
              # leaves the candidate out of the file, and `chain-step` stands the chain
              # down for a candidate it has no reviews for.
              echo '{}' > promotion-reviews.json
              for n in $(jq -r --arg repo "$REPO" '.[] | select(.draft == false
                  and .head.repo.full_name == $repo and (.head.ref | startswith("promote/")))
                  | .number' promotion-prs.json); do
                if gh api --paginate --slurp "repos/${REPO}/pulls/${n}/reviews?per_page=100" > reviews.pages; then
                  jq --arg n "$n" --slurpfile r reviews.pages '. + {($n): ($r[0] | add // [])}' \
                    promotion-reviews.json > reviews.next
                  mv reviews.next promotion-reviews.json
                fi
              done
            else
              rm -f promotion-prs.json promotion-reviews.json
            fi
            gh api "repos/${REPO}/pulls?head=${OWNER}:${BRANCH}&state=all&per_page=1" > collect-prs.json \
              || rm -f collect-prs.json
            args=(--mode drain --repo "$REPO" --attempt "$attempt" --max-attempts 40)
            [ -f promotion-prs.json ] && args+=(--promotion-prs-file promotion-prs.json)
            [ -f promotion-reviews.json ] && args+=(--promotion-reviews-file promotion-reviews.json)
            [ -f collect-prs.json ] && args+=(--collect-prs-file collect-prs.json)
            step=$(uv run fedcourts chain-step "${args[@]}")
            action=$(jq -r '.action' <<<"$step")
            reason=$(jq -r '.reason' <<<"$step")
            case "$action" in
              dispatch)
                gh workflow run run-predict.yml --repo "$REPO" --ref main
                echo "## Drain chain: ${reason}." >> "$GITHUB_STEP_SUMMARY"
                exit 0
                ;;
              stop)
                echo "## Drain chain: ${reason}; the schedule picks the backlog up." >> "$GITHUB_STEP_SUMMARY"
                exit 0
                ;;
            esac
            sleep 60
          done

  # The run gate's verdict on the run as a whole. A refused partial re-run
  # skips every job it re-runs, which alone would leave the earlier attempt's
  # successes standing and the run concluding `success`. This job needs every
  # other job, so any re-run re-runs it, and it fails the run when the gate did
  # not pass or this attempt is neither the one the gate judged nor a re-run by
  # a login the gate published. No checkout, no token, no environment.
  run-gate:
    needs: [authorize, plan, approval, rejected, predict, collect, chain]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Fail a run the gate refused
        if: >-
          ${{ needs.authorize.result != 'success'
          || (needs.authorize.outputs.attempt != github.run_attempt
          && !contains(needs.authorize.outputs.rerunners, format(',{0},', github.triggering_actor))) }}
        env:
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: |
          echo "::error::The run gate refused this run or re-run (started by ${TRIGGERING_ACTOR}): see the authorize job's log, or config/dispatchers.json for who may re-run."
          exit 1
