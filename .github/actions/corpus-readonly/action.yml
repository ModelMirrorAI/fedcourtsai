name: Read-only corpus access
description: >-
  Assume the read-only AWS role via OIDC and optionally pull the packed corpus
  from the S3 remote (`fedcourts corpus-pull`: boto3 credentials from the
  environment, checksum-verified against the committed pointer — no remote
  config file is written). The shared first half of every corpus *consumer*
  job — analytics, the metrics refresh, and the predict/evaluate plan jobs,
  whose backlog scans need the pulled index on every round.
  Corpus *writers* (run-pull's jobs) assume the read-write role and
  keep their own wiring. The calling job must run setup-python-env BEFORE this
  composite (corpus-pull runs from the synced environment), grant
  `id-token: write`, and run in the `prod` environment so the role and the
  corpus base URL are available to pass in.

inputs:
  role-to-assume:
    description: The read-only AWS role ARN (pass vars.AWS_ROLE_TO_ASSUME_READONLY).
    required: true
  aws-region:
    description: AWS region for the role/remote (pass vars.AWS_REGION).
    required: true
  corpus-base-url:
    description: >-
      The corpus estate's base URL for this environment (pass
      vars.CORPUS_BASE_URL). The index remote and the per-case content store
      are fixed segments beneath it (fedcourtsai.paths), so one address names
      the whole estate and the two halves cannot be paired across
      environments.
    required: true
  missing-pointer:
    description: >-
      What to do when no corpus pointer is committed in the checkout: "fail"
      the job, or "warn" and skip the pull (for jobs that degrade gracefully
      without the corpus).
    required: false
    default: "fail"
  role-duration-seconds:
    description: >-
      Credential lifetime for the assumed role, in seconds; the default is the
      OIDC default hour, stated explicitly. The exported credentials are
      static — boto3 cannot refresh them — so a job whose corpus or
      content-store reads outlast this window dies mid-walk on ExpiredToken,
      after the work and with an error naming the wrong cause. A long-reading
      caller must pass a value covering its own step timeout. A value above
      3600 also needs the read-only role's IAM maximum session duration to
      allow it; an excess request fails at the assume step inside its 120s
      action timeout (the STS reason is in the per-attempt retry lines, the
      terminal error is the timeout), not at the hour mark.
    required: false
    default: "3600"

runs:
  using: composite
  steps:
    - name: Configure AWS credentials (corpus S3 remote, read-only)
      uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
      with:
        role-to-assume: ${{ inputs.role-to-assume }}
        aws-region: ${{ inputs.aws-region }}
        role-duration-seconds: ${{ inputs.role-duration-seconds }}
        # Bound the assume-role wall clock: unbounded, its 12 retries over a
        # multi-minute connect timeout outlast every job budget here (see the
        # workflow-traps list in docs/pipeline.md). Note the cost this buys —
        # the action does not clear its timer on the error path, so ANY failing
        # assume-role now burns the full 120s and ends on "Action timed out"
        # rather than its own message; the real cause is earlier in the log.
        action-timeout-s: 120
    - name: Pull the corpus
      shell: bash
      env:
        FEDCOURTS_CORPUS_BASE_URL: ${{ inputs.corpus-base-url }}
        MISSING_POINTER: ${{ inputs.missing-pointer }}
      run: |
        set -euo pipefail
        # corpus-pull resolves the committed pointer (corpus/corpus.db.ref)
        # against the index remote derived from the base URL, and verifies the
        # blob's checksum + size
        # before it lands — *committed*, because every caller of this composite
        # hard-codes `environment: prod`, where the out-of-band pointer
        # override is unset, and none forwards one. A shell carrying the
        # override resolves that instead of the pointer file.
        uv run fedcourts corpus-pull --missing-pointer "$MISSING_POINTER"
