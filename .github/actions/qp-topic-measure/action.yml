name: Measure a qp-topic labeling run
description: >
  The post-label half of a qp-topic labeling run: assert the labeler wrote its
  declared output, measure it against the hand reference set with the tested
  `fedcourts qp-topics` command (which owns the whole publication decision and
  refuses to write below the agreement/coverage gate), render the measured
  block into the step summary, and re-validate the data root the artifact was
  written into.

  Shared verbatim by the production labeling job (`run-analytics.yml`,
  `qp-topic-label` mode) and the token-free `qp-topic` integration-test
  scenario, so the scenario exercises the exact steps the paid run depends on
  rather than a copy that can drift. The caller keeps everything upstream of
  the labels file — the extract, the model call, the oracle fence, and the
  transcript capture: those are the paid run's security posture and stay
  reviewable next to its trigger.

inputs:
  labels:
    description: The labeler's JSONL output — one object per labeled text.
    required: true
  texts:
    description: The `qp-corpus` extract the labeler read, for the shadow pass.
    required: true
  labeler:
    description: Who assigned the labels — engine and model, free-form.
    required: true
  frame-rows:
    description: >
      QP-bearing rows the extract counted in the labeling frame this batch was
      cut from. The extract job knows it and this one does not, so it travels
      as a plain integer — never the `.batch.json` sidecar, which carries the
      draw's Term x fee-class shape and stays on the extract runner. Recorded
      on the batch's ledger entry, it is what lets the docket pack's topic cut
      measure the labeled share of the frame instead of bounding it. Empty
      where the caller cut no frame (the canned integration-test legs), which
      leaves the ledger entry without one and the cut on its bound.
    required: false
    default: ''
  frame:
    description: >
      Which frame the labels cover: `petitions` (measured against the reference
      set, accrued into `qp-topics.json`) or `applications` (measured against
      the application reference block, accrued into
      `qp-topics-applications.json`). Defaults to the petition frame, which is
      what the integration-test scenario labels.
    required: false
    default: petitions
  agreement-out:
    description: >
      Where `qp-topics --agreement-out` writes the run's measured agreement —
      the gate figures — on either side of the gate, so a refused run's
      measurement survives into its spend record. Empty writes none (the
      integration-test scenario records no spend).
    required: false
    default: ''
  replicate-out:
    description: >
      Set for a reference-only replicate: `qp-topics --replicate-out` writes the
      run's item-level record here, writes no labels artifact, and exits 0 on
      either side of the gate, since a replicate measures the labeler and
      publishes nothing. Empty (the default) is an ordinary labeling run.
    required: false
    default: ''
  data-root:
    description: >
      Data root holding `qp-topics/qp-topic-reference.json`; the labels
      artifact is written and validated there. The production job uses the
      checkout's `data`; the integration-test scenario points at a
      runner-temp root seeded from the committed reference set.
    required: false
    default: data
  transcript-hint:
    description: >
      Appended to the no-output error: where the caller captured a labeler
      transcript, this names the artifact so the operator lands on the
      diagnostic record. Empty where no transcript exists (the canned
      integration-test legs).
    required: false
    default: ''

outputs:
  measured-file:
    description: >
      The sanitized measured block (backticks stripped) the measure step
      rendered into the step summary — the same bytes a caller may embed in a
      PR body. Declared as an output because the production PR step depends
      on it; consuming the path any other way is an undeclared contract.
    value: ${{ steps.measure.outputs.measured-file }}

runs:
  using: composite
  steps:
    # Fail loud if the labeler produced nothing. `claude-code-action` can exit
    # `is_error: false` while the agent aborted on an internal error and never
    # wrote its output file, which otherwise surfaces a step later as the
    # measure command's cryptic "--labels: path does not exist". Assert the one
    # declared output exists and is non-empty so a no-output run reads as an
    # agent failure to re-run rather than a gate refusal to interpret.
    - name: Assert the labeler wrote its output
      shell: bash
      env:
        LABELS_OUT: ${{ inputs.labels }}
        LABELER: ${{ inputs.labeler }}
        TRANSCRIPT_HINT: ${{ inputs.transcript-hint }}
      run: |
        set -euo pipefail
        if [ ! -s "$LABELS_OUT" ]; then
          echo "::error::the labeler ($LABELER) wrote no labels to $LABELS_OUT — the agent exited without producing its only declared output.${TRANSCRIPT_HINT:+ $TRANSCRIPT_HINT}"
          exit 1
        fi
        # Counted as `read_label_lines` reads the file — non-blank lines,
        # final newline or not — so this number and the caller's label-line
        # count, which the production lane gates publication on, cannot
        # disagree about the same file by one.
        echo "labeler wrote $(awk 'NF{n++} END{print n+0}' "$LABELS_OUT") label line(s)"

    - name: Measure the run and write the labels artifact
      id: measure
      shell: bash
      env:
        LABELS_OUT: ${{ inputs.labels }}
        TEXTS: ${{ inputs.texts }}
        LABELER: ${{ inputs.labeler }}
        FRAME_ROWS: ${{ inputs.frame-rows }}
        QP_FRAME: ${{ inputs.frame }}
        AGREEMENT_OUT: ${{ inputs.agreement-out }}
        REPLICATE_OUT: ${{ inputs.replicate-out }}
        DATA_ROOT: ${{ inputs.data-root }}
        # The measure command reads the reference set and writes the artifact
        # under the settings data root, while `validate` takes the path as an
        # argument — one input feeds both so they can never point at
        # different trees.
        FEDCOURTS_DATA_ROOT: ${{ inputs.data-root }}
      run: |
        set -euo pipefail
        # The tested command owns the whole publication decision: it validates
        # every label against the vocabulary, joins on both keys, measures
        # agreement against the hand reference set, and REFUSES to write below
        # the agreement/coverage gate (exit non-zero, no artifact, no override
        # flag). Capture rather than fail fast, because a refusal is a result
        # to report: the measured block reaches the step summary either way.
        status=0
        # Passed only when the caller has one: the flag is optional, and an
        # empty string would be a malformed integer rather than "no frame".
        extra=()
        if [ -n "$FRAME_ROWS" ]; then
          extra=(--frame-rows "$FRAME_ROWS")
        fi
        if [ -n "$AGREEMENT_OUT" ]; then
          extra+=(--agreement-out "$AGREEMENT_OUT")
        fi
        if [ -n "$REPLICATE_OUT" ]; then
          extra+=(--replicate-out "$REPLICATE_OUT")
        fi
        case "$QP_FRAME" in
          petitions|applications) ;;
          *)
            echo "::error::unknown qp-topic frame: ${QP_FRAME}"
            exit 1
            ;;
        esac
        uv run fedcourts qp-topics \
          --frame "$QP_FRAME" \
          --labels "$LABELS_OUT" \
          --texts "$TEXTS" \
          --labeler "$LABELER" \
          "${extra[@]+"${extra[@]}"}" > "$RUNNER_TEMP/measured.txt" 2>&1 || status=$?
        cat "$RUNNER_TEMP/measured.txt"
        # On the failure path the command quotes up to 160 characters of the
        # offending labels line into its error, and those bytes are the
        # agent's. Strip backticks (octal 140) so a crafted label cannot close
        # the fence below and inject markdown into a public step summary or,
        # later, into the PR body rendered from the same file.
        tr -d '\140' < "$RUNNER_TEMP/measured.txt" > "$RUNNER_TEMP/measured-safe.txt"
        {
          if [ -n "$REPLICATE_OUT" ]; then
            echo "### qp-topic ${QP_FRAME} replicate (reference rows only, nothing published)"
            echo
            echo "One reference-only replicate: agreement with the frame's reference,"
            echo "not accuracy, recorded for the run-to-run spread and gated on nothing"
            echo "(see the replicate section of docs/qp-topic.md)."
          elif [ "$QP_FRAME" = applications ]; then
            echo "### qp-topic-v1 application labeling run"
            echo
            echo "Agreement with the application reference block's adjudicated"
            echo "labels, not accuracy, and in-sample: the register rules the"
            echo "labeler applies were fitted to this block, and its blind raters"
            echo "are instances of the labeler's own model. Not quotable until an"
            echo "independent rater has checked it (see the Applications section"
            echo "of docs/qp-topic.md)."
          else
            echo "### qp-topic-v0 labeling run"
            echo
            echo "Agreement with a single v0 reference rater, not accuracy; the"
            echo "reference frame is grant-enriched, so it certifies the grant"
            echo "stream only (see docs/qp-topic.md)."
          fi
          echo
          echo '```'
          cat "$RUNNER_TEMP/measured-safe.txt"
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
        echo "measured-file=$RUNNER_TEMP/measured-safe.txt" >> "$GITHUB_OUTPUT"
        if [ "$status" -ne 0 ]; then
          echo "::error::qp-topics published nothing; the measured block above is the result"
          exit "$status"
        fi
        uv run fedcourts validate "$DATA_ROOT"
