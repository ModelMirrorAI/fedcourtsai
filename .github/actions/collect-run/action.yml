name: Collect a matrix run into one PR
description: >
  Download every cell artifact for a `run:predict` / `run:evaluate` fan-out, union
  the ready cells into one auto-merging PR and any salvageable partial output into
  one draft PR, and surface the run's stalls, secret-scan hits, and agent flags.

  The single writer for a run's agent output. Shared verbatim by run-predict and
  run-evaluate, which differ only in the artifact prefix and the judgment noun —
  both derived from `role` — so a change to the collect contract lands once.

  The caller keeps the job header (`needs`, `if`, `runs-on`, `timeout-minutes`,
  `environment`, `permissions`) and the setup steps (token mint, checkout, python
  env, git identity): that is the security posture, and it stays reviewable next
  to the trigger rather than hidden behind a `uses:`.

  The caller also keeps the three `always()` reporting steps that post the stall
  comment, the secret-scan hit, and the agent-flag latch. That is deliberate and
  load-bearing: a cancellation (a manual cancel, or this job's `timeout-minutes`)
  tears down a composite step and does not guarantee its remaining inner steps
  run, whereas job-level `always()` steps still fire. Those three exist precisely
  so a collect that dies leaves a trace instead of a silently orphaned trigger
  issue, so they must not lose that guarantee. They carry no role dependency, so
  keeping them in the caller costs no drift risk.

inputs:
  role:
    description: '`predict` or `evaluate` — selects the artifact prefix, the `--role` flag, and the noun.'
    required: true
  token:
    description: >
      The dev App installation token (contents + pull-requests write). Used for
      the branch push and the run PR. Deliberately *not* used for the issue
      comments below — see `github-token`.
    required: true
  repo:
    description: The `owner/name` this run belongs to.
    required: true
  issue:
    description: Trigger issue number; empty when the run was not issue-triggered.
    required: false
    default: ''
  github-token:
    description: >
      The ambient `GITHUB_TOKEN`, used only for the issue comments. Commenting
      triggers no workflow, so issue-write stays off the contents-write App token.
    required: true
  matrix:
    description: >
      The plan job's matrix JSON (`needs.plan.outputs.matrix`) — the only record
      of what this run was supposed to produce. A queued cell that uploads
      nothing at all leaves no `status.json`, so without this it is
      indistinguishable from a cell that was never queued.
    required: false
    default: ''
  courtlistener-token:
    description: >
      Scan input only, for the secret scan's literal-containment detector — the
      one credential reachable from an agent cell, searched for in the run's added
      files before anything is pushed.
    required: false
    default: ''

runs:
  using: composite
  steps:
    # First step, before the downloads: a setup failure here should cost
    # nothing but its own ten seconds.
    #
    # The union loop further down branches each run PR from `origin/main` with a
    # `git checkout -B` **in this same working tree**, which swaps every
    # tracked file — `src/fedcourtsai/` included — to main's content. The
    # project is installed editable against that tree, so a plain
    # `uv run fedcourts` after that point executes *main's* CLI rather than
    # the one this composite was checked out with. On `main` the two are the
    # same file and nothing shows; off it they are not, and the mismatch is
    # silent in the direction that matters — a composite passing a flag its
    # own CLI defines fails against an older main, and the integration
    # scenario that exists to catch that reports main's behavior instead.
    # Materialize the CLI once from the checked-out source into a directory no
    # branch switch can reach, and call it by absolute path throughout, so the
    # CLI a collect runs is the ref the workflow was dispatched at — by
    # construction, not by coincidence of which branch the tree sits on.
    #
    # Only the runtime dependency group: nothing here uses the dev tools, and
    # the lock is still the pin (`--locked`, as everywhere else this repo
    # installs dependencies). Both files the wheel build reads — `pyproject.toml`
    # for the metadata and `README.md`, which its `readme =` names — are copied
    # alongside `src/`, so a missing one fails here at setup rather than
    # mid-collect with a run's output already downloaded.
    - name: Pin the CLI to this checkout
      id: cli
      shell: bash
      run: |
        set -euo pipefail
        cli="${RUNNER_TEMP}/collect-cli"
        rm -rf "$cli"
        mkdir -p "$cli"
        cp -a pyproject.toml uv.lock README.md src "$cli"/
        uv sync --locked --no-default-groups --project "$cli"
        bin="${cli}/.venv/bin/fedcourts"
        test -x "$bin"
        printf 'bin=%s\n' "$bin" >> "$GITHUB_OUTPUT"

    # Per-artifact downloads, NOT `actions/download-artifact` over the whole set.
    # That action fetches every artifact as a single fail-fast unit: on
    # 2026-07-18 one transient failure after its five internal retries killed the
    # step, and because the aggregate step is chained under it, all 46 of that
    # run's successful cells were discarded. Downloading per artifact makes each
    # download its own degradation boundary, so one bad artifact costs one cell
    # instead of the run. Downloads run with bounded parallelism, but every
    # shared record — the collected count, the missing-artifacts ledger, the
    # zero-collected check — is aggregated by a single writer after the workers
    # finish: each worker touches only its own per-artifact marker file, so no
    # two processes ever write the same path.
    - name: Download cell artifacts
      shell: bash
      env:
        # `actions: read` on this run only — enough to list and fetch its own
        # artifacts. Deliberately the ambient token, not the contents-write App
        # token: reading artifacts needs no write anywhere.
        GH_TOKEN: ${{ inputs.github-token }}
        REPO: ${{ inputs.repo }}
        ROLE: ${{ inputs.role }}
      run: |
        set -euo pipefail
        mkdir -p cell-artifacts

        # This run's own cell artifacts. Listing is per-run, which is what makes
        # `gh run rerun --failed` a recovery path: a rerun of just this job
        # re-lists the original attempt's artifacts and re-fetches them.
        # Retried like the downloads below: this is the one call whose failure
        # would fail the whole step, in a step whose purpose is tolerating
        # transient failure.
        listed=false
        for attempt in 1 2 3; do
          if gh api --paginate "repos/${REPO}/actions/runs/${GITHUB_RUN_ID}/artifacts" \
               --jq '.artifacts[] | select(.expired == false) | .name' \
               > all-artifacts.txt < /dev/null; then
            listed=true
            break
          fi
          [ "$attempt" -lt 3 ] && sleep $((attempt * 5))
        done
        if [ "$listed" != true ]; then
          echo "::error::could not list this run's artifacts after 3 attempts"
          exit 1
        fi
        grep -E "^${ROLE}-" all-artifacts.txt | sort -u > artifact-names.txt || true
        expected=$(wc -l < artifact-names.txt)
        echo "found ${expected} ${ROLE} artifact(s) on this run"

        # Each worker downloads one artifact with a 3-attempt/backoff and the
        # clean-extraction discipline, and records success as a marker file
        # named after the artifact — never a shared file. It always returns 0:
        # a failed artifact is a recorded degradation, not a step failure, and
        # a nonzero return would make xargs kill the whole batch. `bash -c`
        # does not inherit this step's shell options, so the function sets its
        # own (deliberately without `-e`: a failed attempt must fall through
        # to the next one, not abort the worker).
        download_one() {
          set -uo pipefail
          name=$1
          # An empty item can only come from a blank input line, which the
          # grep above cannot produce — but `rm -rf "cell-artifacts/"` on the
          # collection directory would cost the whole run, so guard anyway.
          [ -n "$name" ] || return 0
          for attempt in 1 2 3; do
            # Clear any truncated extraction first: a half-written data/ subtree
            # would otherwise be unioned into the PR as if it were complete.
            rm -rf "cell-artifacts/${name}"
            # `gh run download` can hang far longer than it can fail; bound it
            # so a hang degrades into a retried attempt instead of holding a
            # worker slot to the job cap.
            if timeout 120 gh run download "$GITHUB_RUN_ID" --repo "$REPO" \
                 --name "$name" --dir "cell-artifacts/${name}"; then
              : > "dl-status/${name}.ok"
              return 0
            fi
            [ "$attempt" -lt 3 ] && sleep $((attempt * 5))
          done
          rm -rf "cell-artifacts/${name}"
          echo "::warning::artifact ${name} did not download after 3 attempts; that cell's output is NOT in this run's PR"
          return 0
        }
        export -f download_one

        # Bounded parallelism: 4 workers cuts the pre-aggregation wall-clock
        # roughly 4x at full fan-out width while staying gentle on the API.
        # Artifact names cannot contain newlines (GitHub rejects them), so
        # newline-delimited xargs input is unambiguous; they are valid filenames
        # for the marker files for the same reason (no `/` or `\`). The marker
        # directory is reset every invocation — a rerun in the same workspace
        # (the documented transfer-failure recovery) must re-derive its census
        # from this pass alone, never from a previous one's markers. Tolerate
        # an abnormal worker exit (a signal-killed process makes xargs itself
        # fail): the set-difference below counts whatever actually landed, so
        # a torn batch degrades to missing entries instead of a dead step.
        rm -rf dl-status
        mkdir -p dl-status
        xargs -r -d '\n' -P 4 -n 1 bash -c 'download_one "$1"' _ < artifact-names.txt \
          || echo "::warning::a download worker exited abnormally; the ledger below reflects what landed"

        # Single-writer aggregation, after every worker has finished. The
        # missing ledger is the set difference between what was expected and
        # what verifiably downloaded, so it is complete by construction — an
        # artifact whose worker died without recording anything is still
        # ledgered as missing rather than vanishing from the census.
        find dl-status -name '*.ok' -printf '%f\n' | sed 's/\.ok$//' | sort > downloaded.txt
        collected=$(wc -l < downloaded.txt)
        comm -23 artifact-names.txt downloaded.txt > missing-artifacts.txt
        while IFS= read -r name; do
          [ -n "$name" ] || continue
          rm -rf "cell-artifacts/${name}"
        done < missing-artifacts.txt

        echo "collected ${collected} of ${expected} artifact(s)"

        # Distinguish an infrastructure failure from a genuine stall. With zero
        # artifacts on disk the aggregate step renders the stall comment, which
        # tells a maintainer to re-label and re-run the whole matrix — the right
        # advice when no cell uploaded anything, and an expensive misdiagnosis
        # when the artifacts exist and merely failed to transfer. Fail loudly
        # instead and leave them intact: `gh run rerun --failed` is the fix.
        if [ "$expected" -gt 0 ] && [ "$collected" -eq 0 ]; then
          echo "::error::${expected} artifact(s) exist on this run but none downloaded." \
            "This is a transfer failure, not a stalled run — re-run the collect job" \
            "(cell artifacts are retained 7 days)."
          exit 1
        fi

    - name: Aggregate the run into one PR
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        REPO: ${{ inputs.repo }}
        ISSUE: ${{ inputs.issue }}
        ROLE: ${{ inputs.role }}
        # Via env, never interpolated into the shell body: the matrix carries
        # court/docket/event ids parsed from the trigger issue.
        # The CLI pinned to this checkout by the step above — never a bare
        # `uv run`, which resolves against a working tree the union loop
        # below rewrites to `origin/main` mid-step.
        FEDCOURTS: ${{ steps.cli.outputs.bin }}
        PLAN_MATRIX: ${{ inputs.matrix }}
        # For the secret scan's literal-containment detector only: the one
        # credential reachable from an agent cell, searched for in the run's
        # added files before anything is pushed. This step parses agent
        # bytes with jq/git/tested Python but never executes them.
        COURTLISTENER_API_TOKEN: ${{ inputs.courtlistener-token }}
      run: |
        set -euo pipefail
        gh auth setup-git
        run_url="https://github.com/${REPO}/actions/runs/${GITHUB_RUN_ID}"
        # The plan's matrix is the only record of what the run was supposed to
        # produce. Written once (via env, never interpolated) and read below both
        # as collect-plan's queued-cell census and — on a run where no cell
        # uploaded — as the sole source of the run id. Two gaps the cell census
        # cannot see, because neither leaves a status.json — without them the run
        # would auto-merge a PR presenting itself as complete while quietly
        # omitting cells. Each names its own remedy, and both withhold the issue
        # close as a fully-absent engine already does:
        #   --missing-file  the artifact failed to transfer   -> re-run collect
        #   --matrix-file   the cell uploaded nothing at all  -> needs a re-queue
        matrix_args=()
        if [ -n "${PLAN_MATRIX:-}" ]; then
          printf '%s' "$PLAN_MATRIX" > plan-matrix.json
          matrix_args=(--matrix-file plan-matrix.json)
        fi
        # Did any cell deliver an artifact this run? A wholesale failure (every
        # cell cancelled/dead before upload) leaves cell-artifacts empty. That run
        # still has per-cell failure facts to persist and a stall to make loud —
        # so it must NOT exit early past the fact-writing below — but it has no
        # status.json to read the run id from.
        had_artifacts=false
        if [ -d cell-artifacts ] && [ -n "$(ls -A cell-artifacts)" ]; then
          had_artifacts=true
        fi
        if [ "$had_artifacts" = true ]; then
          # All cells share the plan's run id; read it off any status file. Search
          # recursively, matching collect-plan. The per-artifact download nests
          # every cell under its own directory *by construction*, so the old
          # single-artifact flattening case (which used to extract flat into
          # cell-artifacts/ itself) can no longer arise.
          run_id=$(find cell-artifacts -name status.json -exec jq -r '.run_id' {} + | head -n1)
        else
          # No cell uploaded: render the tested stall comment for the trigger issue
          # so the run's silence is loud there (the next step posts it with the
          # ambient token), and take the run id from the matrix — every queued cell
          # stamped the same id, and there is no status.json to read.
          echo "::warning::no cell artifacts to collect"
          "$FEDCOURTS" stall-comment --role "$ROLE" --run-url "$run_url" > stall-comment.md
          run_id=$(jq -r 'first(.include[].run_id) // empty' plan-matrix.json 2>/dev/null || true)
        fi
        # Neither a status.json nor a matrix: the run left no trace of what it was
        # meant to produce, so there are no facts to record and no census to take.
        # The stall comment above (on a no-artifact run) is the only signal; stop.
        if [ -z "$run_id" ]; then
          echo "::warning::no run id from artifacts or matrix; nothing to aggregate"
          exit 0
        fi
        # The ready/draft/facts-only partition, branch names, and PR prose are
        # computed by the tested `collect-plan`; this step only runs git and gh.
        # The ready PR closes the triggering issue on merge (unless a draft still
        # has work); the facts-only PR never does.
        plan=$("$FEDCOURTS" collect-plan --role "$ROLE" --run-id "$run_id" \
          --status-dir cell-artifacts --issue "$ISSUE" \
          --missing-file missing-artifacts.txt "${matrix_args[@]}")
        # Never silently drop a cell: warn for each that produced no output. The
        # judgment noun rides on the plan (`_JUDGMENT_NOUN`, the same mapping that
        # names the PR title and commit message) rather than being re-derived
        # here, so the warning text cannot drift from the PR's.
        jq -r '.noun as $noun | .skipped[]
          | "::warning::no \($noun) for \(.actor) on \(.court)/\(.docket) \(.event_id)"' <<<"$plan"
        # Same for a queued cell that uploaded nothing at all. Warned here, not
        # only in the PR body: the body is rendered under the ready PR, so on a
        # run where most cells died — exactly what this census is for — there is
        # no PR to carry the note and the cells would vanish from the log too.
        jq -r '.uncovered_cells[]
          | "::warning::no cell output at all for \(.actor) on \(.court)/\(.docket) \(.event_id);"
          + " re-running collect will not recover it — it needs a re-queue"' <<<"$plan"
        if [ "$(jq -r '.stalled' <<<"$plan")" = "true" ]; then
          # Artifacts arrived but no cell produced output and no agent finished
          # cleanly (the tested `stalled` signal) — same stall, same comment.
          "$FEDCOURTS" stall-comment --role "$ROLE" --run-url "$run_url" > stall-comment.md
        fi
        # Record one durable failure fact per failed cell (skipped/salvage/died)
        # into the ledger, BEFORE the union loop's `git add data/`, so the facts
        # ride this run's per-run PR. `collect` is the only observer of a cell that
        # ran and produced no usable artifact, but it is corpus-blind (git-ledger
        # write only), so the per-cell attempt cap counts these committed files
        # rather than a corpus column. The failed partition is already decided by
        # `collect-plan` (carried in its JSON); this only materializes the files.
        # Written on the job's checkout as untracked, run-scoped paths: they survive
        # the loop's `checkout -B "$branch" origin/main` and are picked up by the
        # first pushed branch's `git add data/`, so a rerun overwrites rather than
        # duplicating, and the append-only path jail still passes.
        printf '%s' "$plan" > collect-plan.json
        # Fail-soft: recording failure facts is advisory metadata and must never
        # abort the aggregation — losing the facts costs a warning, losing the
        # aggregation strands the run's real predictions. On any error the facts
        # are simply not written (the acceptable degradation) and collection
        # proceeds, mirroring this step's empty-census-on-malformed-input rule.
        # On a run with output the facts ride the ready/partial PR's `git add
        # data/`; on a wholesale-failed run with neither, the facts-only kind in
        # the loop below opens a small PR to commit them so the attempt cap still
        # advances (`collect-plan` emits it exactly when ready and partial are both
        # absent, so the facts are never committed twice).
        "$FEDCOURTS" record-cell-failures --plan-file collect-plan.json --data-root data \
          || echo "::warning::could not record cell-failure facts; continuing"
        # `facts_only` is null on any run that opened a ready or partial PR (its
        # facts rode that PR) and on a run with no failed cell, so this loop can
        # never double-commit the facts. It is a non-draft, deterministic-body PR,
        # so it runs the same three gates and auto-merges like `ready` — but it
        # carries no `Closes #`, leaving the trigger issue open for the failed run.
        for kind in ready partial facts_only; do
          pr=$(jq -c ".${kind}" <<<"$plan")
          [ "$pr" = "null" ] && continue
          branch=$(jq -r '.branch' <<<"$pr")
          # Rerunning collect is the documented recovery for a transfer failure,
          # so this loop must be safe to repeat. A kind whose PR is already
          # settled — merged, or closed as a deliberate reject of bad agent
          # output — must not be redone: re-pushing would put merged content
          # back on a branch, or resurrect rejected work under auto-merge.
          #
          # Assigned, not tested inline: a command substitution inside `[ ... ]`
          # discards its exit status, so a 5xx or a token blip would read as "no
          # settled PR" and fall through to the force-push below. This is the
          # only check standing between --force and settled work, and it is a
          # network call, so it must fail closed.
          settled=$(gh pr list --repo "$REPO" --head "$branch" --state all \
            --json state --jq '[.[] | select(.state != "OPEN")] | length')
          if [ "$settled" -gt 0 ]; then
            echo "${branch} already settled (merged or closed); nothing to redo"
            continue
          fi
          # Branch from the CURRENT remote main tip, re-fetched each pass,
          # not the job's local main. The matrix runs long, and the
          # deterministic writers (live/seed/pull) commit to main directly and
          # can rewrite its recent history; a branch built on the now-orphaned
          # local checkout would carry those orphaned commits — including any
          # recently merged `.github/workflows/*` change — into the push pack.
          # The app token is deliberately without `workflows` permission, so
          # GitHub then rejects the whole push. Basing the branch on a freshly
          # fetched origin/main guarantees the pack is only this run's data/
          # commit; a force-push landing after the fetch degrades to an
          # ordinary non-fast-forward reject, loud and retriable, never a
          # permission failure that strands a run's output.
          git fetch --no-tags -q origin main
          git checkout -q -B "$branch" origin/main
          # Union each member cell's data/ subtree onto the clean main checkout.
          # Cells write disjoint paths, so the union is conflict-free.
          while IFS= read -r dir; do
            cp -a "cell-artifacts/${dir}/data/." data/
          done < <(jq -r '.artifact_dirs[]' <<<"$pr")
          git add data/
          draft=$(jq -r '.draft' <<<"$pr")
          auto=true
          # Enforce the append-only data/ jail and a final schema check here,
          # producer-side. Either failing downgrades the PR to a draft for review
          # instead of auto-merging something unexpected (CI re-checks the jail).
          git diff --cached --name-status > changes.txt
          if ! "$FEDCOURTS" assert-paths --name-status-file changes.txt; then
            draft=true; auto=false; echo "::warning::path jail tripped; opening ${branch} as a draft"
          fi
          if ! "$FEDCOURTS" validate data; then
            draft=true; auto=false; echo "::warning::validation failed; opening ${branch} as a draft"
          fi
          # Third gate: schema checks read shape, not content, so a secret
          # copied into a free-text artifact would otherwise auto-merge to
          # the public repo. Unlike the two gates above, a draft is not
          # enough — the push itself would publish the secret — so a hit
          # (or a misconfigured scan) withholds the branch entirely. The
          # PR body is rendered first and scanned too: it carries the run's
          # flag roll-up, which is agent free text. The tested, redacted
          # report (file/rule/line, never the matched text) rides to the
          # trigger issue via the next steps, and the flagged files stay
          # reviewable in the run's cell artifacts. The run id keys the
          # entropy heuristic's one exemption — the collected run's own
          # ledger directory in the run's own scanned text — equality-pinned, so no
          # other run's (or an invented) path is exempt.
          jq -r '.body' <<<"$pr" > pr-body.md
          if ! "$FEDCOURTS" scan-diff-for-secrets --name-status-file changes.txt \
              --known-secret-env COURTLISTENER_API_TOKEN \
              --extra-file pr-body.md \
              --issue-comment-file secret-scan-issue.md \
              --run-url "$run_url" \
              --run-id "$run_id"; then
            echo "::warning::secret scan did not pass; withholding ${branch}"
            # Hard-reset so a modified tracked file from the withheld union
            # cannot ride into the next iteration's branch; then drop the
            # untracked additions. The helper files this step writes are
            # untracked outside data/, so they survive.
            git reset -q --hard && git clean -qfd data/
            continue
          fi
          # A PR that merged between the settled check and here leaves the union
          # a no-op against the re-fetched main. Committing an empty index exits
          # non-zero and would kill the step before the *other* kind is handled,
          # stranding a draft. Nothing to push is a clean skip, not a failure.
          if git diff --cached --quiet; then
            echo "${branch}: content already on main; nothing to push"
            continue
          fi
          git commit -q -m "$(jq -r '.commit_message' <<<"$pr")"
          # Push with the app (write) token explicitly; blank any ambient
          # extraheader at command scope so the write token authenticates.
          # --force because the branch is run-scoped (`<role>/run-<run_id>`) and
          # bot-owned, so nothing else writes it: on a rerun the previous
          # attempt's branch is this run's own leftover, and a plain push would
          # non-fast-forward reject and abort under `set -e`. The merged check
          # above is what keeps force from touching settled work. Trade-off:
          # a rerun discards hand-edits to an unmerged draft branch.
          git -c http.extraHeader= -c "http.https://github.com/.extraHeader=" \
            push --force "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" \
            "HEAD:refs/heads/${branch}"
          title=$(jq -r '.title' <<<"$pr")
          # Find-or-update: `gh pr create` errors on an existing open PR for the
          # same head, which would abort the rerun under `set -e`.
          url=$(gh pr list --repo "$REPO" --head "$branch" --state open \
            --json url --jq '.[0].url // empty')
          if [ -z "$url" ]; then
            flags=()
            [ "$draft" = "true" ] && flags+=(--draft)
            url=$(gh pr create --base main --head "$branch" "${flags[@]}" \
              --title "$title" --body-file pr-body.md)
          else
            gh pr edit "$url" --title "$title" --body-file pr-body.md
            # Reconcile draft state. The two directions are NOT symmetric.
            # Promoting is benign if it fails: the PR stays a draft, nothing
            # auto-merges, and the state is visible. Demoting is not — an
            # earlier clean attempt may have armed auto-merge, and the block
            # below only declines to *enable* it, never disables it. So a
            # swallowed demotion would let gate-tripped content merge the
            # moment checks go green. Disarm first, then fail loudly.
            if [ "$draft" = "true" ]; then
              gh pr merge --disable-auto "$url" || true
              gh pr ready --undo "$url" \
                || { echo "::error::could not return ${url} to draft after a gate tripped"; exit 1; }
            else
              gh pr ready "$url" || true
            fi
          fi
          # Enable auto-merge only for a ready (non-draft, jail-clean) PR. A miss
          # (e.g. the repo's "Allow auto-merge" is off) leaves the PR open for a
          # manual merge rather than failing the run.
          if [ "$draft" != "true" ] && [ "$auto" = "true" ]; then
            gh pr merge --auto --squash "$url" \
              || echo "::warning::could not enable auto-merge on ${url}"
          fi
        done
        # Publish the run's flag roll-up only when no branch tripped the
        # secret scan and the roll-up text itself scans clean: flags are
        # agent free text, and with no PR to carry them they would
        # otherwise publish unscanned via the summary and the feedback
        # latch.
        flags_md=$(jq -r '.flags' <<<"$plan")
        if [ -s secret-scan-issue.md ]; then
          flags_md=""
        elif [ -n "$flags_md" ] && [ "$flags_md" != "null" ]; then
          printf '%s\n' "$flags_md" > run-flags.md
          if ! "$FEDCOURTS" scan-diff-for-secrets --name-status-file /dev/null \
              --known-secret-env COURTLISTENER_API_TOKEN \
              --extra-file run-flags.md \
              --issue-comment-file secret-scan-issue.md \
              --run-url "$run_url" \
              --run-id "$run_id"; then
            echo "::warning::secret scan hit in the flag roll-up; suppressing it"
            flags_md=""
          fi
        fi
        if [ -n "$flags_md" ] && [ "$flags_md" != "null" ]; then
          # Surface this run's agent flags in the Actions summary so they are
          # seen even when no PR opens (e.g. every cell was blocked). They also
          # ride in the ready/draft PR body, and each produced cell's flags.json
          # is committed.
          printf '%s\n' "$flags_md" >> "$GITHUB_STEP_SUMMARY"
          # Roll this run's agent flags to a file for the next step to latch onto
          # the long-lived agent-feedback issue. That step posts with the ambient
          # GITHUB_TOKEN rather than this job's contents-write App token (least
          # privilege — see the step's comment). `feedback_comment` (rendered by
          # collect-plan) carries this same roll-up.
          feedback=$(jq -r '.feedback_comment' <<<"$plan")
          if [ -n "$feedback" ] && [ "$feedback" != "null" ]; then
            printf '%s\n' "$feedback" > feedback-comment.md
          fi
        fi
