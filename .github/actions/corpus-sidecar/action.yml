name: Corpus query sidecar
description: >-
  Assume the read-only AWS role via OIDC with the credentials scoped to this
  action's own steps — never the job env — and launch `fedcourts corpus-serve`
  as a background localhost service that holds them. Later steps reach the
  corpus through the sidecar via the non-secret FEDCOURTS_CORPUS_SERVICE_URL
  (the `service` backend), so an agent step's shell carries no cloud
  credential at all; the deterministic pre-agent steps that still read S3
  directly (provisioning) take the credentials from this action's outputs as
  step-scoped env. The cell-job successor to `corpus-ranged`, which the
  agentless plan jobs keep (job-wide credentials are fine where no agent
  runs). The calling job must grant `id-token: write` and run in the `prod`
  environment so the role and remote variables are available to pass in.

inputs:
  role-to-assume:
    description: The read-only AWS role ARN (pass vars.AWS_ROLE_TO_ASSUME_READONLY).
    required: true
  aws-region:
    description: AWS region for the role/remote (pass vars.AWS_REGION).
    required: true
  corpus-remote-url:
    description: >-
      The corpus remote's bucket URL (pass vars.CORPUS_REMOTE_URL).
    required: true
  casestore-url:
    description: >-
      The per-case content store URL (pass vars.CASESTORE_URL). Under the
      corpus-split mode the sidecar hydrates `full` query bodies from the
      store server-side — the sidecar is the credentialed process, so
      omitting this under the split silently returns bodiless rows to every
      cell. Explicit inputs, not job-env inheritance, so every call site
      shows the sidecar's read configuration.
    required: false
    default: ""
  corpus-split:
    description: >-
      The corpus-split go-live switch (pass
      `vars.FEDCOURTS_CORPUS_SPLIT || '0'`). Off, the sidecar serves every
      payload from the blob and casestore-url is inert.
    required: false
    default: "0"

outputs:
  aws-access-key-id:
    description: >-
      Read-only credential for the caller's deterministic pre-agent steps,
      passed as step-scoped env — never job-wide, never on an agent step. A
      step that must both provision and spawn an agent (the integration
      engine-smoke cascade) is the one sanctioned exception: there the runner
      seam's scrubbed base env keeps the credentials out of the spawned
      agent's environment.
    value: ${{ steps.creds.outputs.aws-access-key-id }}
  aws-secret-access-key:
    description: Step-scoped counterpart secret (masked by the credentials action).
    value: ${{ steps.creds.outputs.aws-secret-access-key }}
  aws-session-token:
    description: Step-scoped session token (masked by the credentials action).
    value: ${{ steps.creds.outputs.aws-session-token }}

runs:
  using: composite
  steps:
    # output-credentials + output-env-credentials=false is the crux: the
    # assumed role's credentials become masked step *outputs* and nothing —
    # not even AWS_REGION — lands in the job env, so the agent steps that run
    # later in this job inherit no credential.
    - name: Assume the read-only role (step outputs only, never the job env)
      id: creds
      uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
      with:
        role-to-assume: ${{ inputs.role-to-assume }}
        aws-region: ${{ inputs.aws-region }}
        output-credentials: true
        output-env-credentials: false
        # Bound the assume-role wall clock: unbounded, its 12 retries over a
        # multi-minute connect timeout outlast every job budget here (see the
        # workflow-traps list in docs/pipeline.md). Note the cost this buys —
        # the action does not clear its timer on the error path, so ANY failing
        # assume-role now burns the full 120s and ends on "Action timed out"
        # rather than its own message; the real cause is earlier in the log.
        action-timeout-s: 120

    - name: Launch the corpus query sidecar
      shell: bash
      env:
        AWS_ACCESS_KEY_ID: ${{ steps.creds.outputs.aws-access-key-id }}
        AWS_SECRET_ACCESS_KEY: ${{ steps.creds.outputs.aws-secret-access-key }}
        AWS_SESSION_TOKEN: ${{ steps.creds.outputs.aws-session-token }}
        AWS_REGION: ${{ inputs.aws-region }}
        CORPUS_REMOTE_URL: ${{ inputs.corpus-remote-url }}
        FEDCOURTS_CASESTORE_URL: ${{ inputs.casestore-url }}
        FEDCOURTS_CORPUS_SPLIT: ${{ inputs.corpus-split }}
      run: |
        set -euo pipefail
        # The background sidecar inherits the credentials from THIS step's
        # env and serves ranged corpus queries over localhost for the rest of
        # the job (the runner reaps it at job end). Only the non-secret
        # localhost URL goes job-wide.
        nohup uv run fedcourts corpus-serve --corpus-backend ranged \
          --host 127.0.0.1 --port 8377 > corpus-sidecar.log 2>&1 &
        echo "$!" > corpus-sidecar.pid
        # The port here, in the launch line above, and in the health check
        # below must stay in lockstep (a literal, not an expansion — an
        # env-file write with expansion trips the workflow linter).
        echo "FEDCOURTS_CORPUS_SERVICE_URL=http://127.0.0.1:8377" >> "$GITHUB_ENV"

    - name: Wait for the sidecar to become healthy
      shell: bash
      run: |
        set -euo pipefail
        # /healthz runs a real point read (the open alone proves nothing —
        # SQLite defers page reads to the first statement), so green here
        # proves the corpus is genuinely answerable, with the cold ranged
        # transfer paid before any model token is spent — the same posture as
        # an OIDC failure today; the sidecar log records the transfer as
        # `health-check corpus read: ...`. A dead sidecar process fails fast
        # instead of waiting out the loop. Two bounds, because the two
        # unready modes differ: --max-time caps one attempt (a hung backend
        # read), while not-yet-listening returns instantly and wants many
        # cheap retries — and the single-threaded server keeps grinding a
        # slow read while curl retries queue behind it, so a slow-but-
        # succeeding read costs attempts, never a false failure. The deadline
        # caps the whole gate: a readiness that limps to success late would
        # otherwise eat the caller job's non-agent slack and kill the cell
        # mid-agent with the tokens already spent — strictly worse than
        # failing here (degrade, never hang).
        deadline=$((SECONDS + 180))
        while [ "$SECONDS" -lt "$deadline" ]; do
          if curl -fsS --max-time 20 http://127.0.0.1:8377/healthz >/dev/null 2>&1; then
            exit 0
          fi
          if ! kill -0 "$(cat corpus-sidecar.pid)" 2>/dev/null; then
            echo "::error::corpus sidecar process died during startup"
            break
          fi
          sleep 1
        done
        echo "::error::corpus sidecar failed to become healthy"
        tail -n 50 corpus-sidecar.log || true
        exit 1
