name: Install the pinned engine CLI
description: >
  Resolve an engine's CLI version from `.github/engines/package.json`, the one
  pin every cell, smoke and labeler reads, and install that exact version for
  the engines this repository installs itself. claude-code and gemini are
  installed here; codex is installed by `openai/codex-action`, which takes the
  `version` output as its `codex-version`, so for codex this only resolves
  unless `install-codex` asks for the CLI itself.
  Run it in a step whose environment holds no secret: the install's own scripts
  are skipped, but transitive dependencies still resolve fresh at install time.

inputs:
  engine:
    description: "`claude-code`, `codex` or `gemini`."
    required: true
  install-codex:
    description: >
      "true" installs codex here as well, for a caller that runs the codex CLI
      directly rather than through codex-action (the integration engine smoke).
    required: false
    default: "false"

outputs:
  version:
    description: "The pinned version for the engine."
    value: ${{ steps.resolve.outputs.version }}
  path:
    description: >
      claude-code only: the installed `claude` binary, for claude-code-action's
      `path_to_claude_code_executable`, so the action runs the pinned CLI and
      never installs its own bundled one. Empty for the other engines.
    value: ${{ steps.install.outputs.path }}

runs:
  using: composite
  steps:
    - id: resolve
      shell: bash
      env:
        ENGINE: ${{ inputs.engine }}
        PINS: ${{ github.action_path }}/../../engines/package.json
      run: |
        set -euo pipefail
        case "$ENGINE" in
          claude-code) package=@anthropic-ai/claude-code ;;
          codex) package=@openai/codex ;;
          gemini) package=@google/gemini-cli ;;
          *) echo "::error::engine-cli: unknown engine '$ENGINE'"; exit 1 ;;
        esac
        version=$(jq -er --arg p "$package" '.dependencies[$p]' "$PINS")
        # An exact version only: a range would let two cells of one round run
        # different CLIs.
        if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "::error::engine-cli: $package is pinned to '$version', not an exact version"
          exit 1
        fi
        echo "package=$package" >> "$GITHUB_OUTPUT"
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - id: install
      shell: bash
      env:
        ENGINE: ${{ inputs.engine }}
        INSTALL_CODEX: ${{ inputs.install-codex }}
        PACKAGE: ${{ steps.resolve.outputs.package }}
        VERSION: ${{ steps.resolve.outputs.version }}
      # zizmor: ignore[adhoc-packages] — top-level exact-version pin, scripts
      # disabled, and a secret-free environment are the practical controls for a
      # single global CLI; a lockfile is not expressible for `npm i -g`.
      run: |
        set -euo pipefail
        case "$ENGINE" in
          codex)
            if [ "$INSTALL_CODEX" != true ]; then
              echo "path=" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            ;;
        esac
        npm install --silent --no-audit --ignore-scripts --global "${PACKAGE}@${VERSION}"
        if [ "$ENGINE" = claude-code ]; then
          # --ignore-scripts skips the postinstall that places Claude Code's
          # native binary, so run the pinned package's own installer explicitly.
          node "$(npm root -g)/@anthropic-ai/claude-code/install.cjs"
          claude --version
          path=$(command -v claude)
          test -n "$path"
          echo "path=$path" >> "$GITHUB_OUTPUT"
        else
          if [ "$ENGINE" = codex ]; then codex --version; else gemini --version; fi
          echo "path=" >> "$GITHUB_OUTPUT"
        fi
