name: Setup Python env
description: Install uv (with cache only where a job is allowed it) and sync the project's dependencies into .venv.

inputs:
  save-cache:
    description: >-
      Whether the uv cache is saved at the end of the job. "false" for a job
      that runs a parse of third-party content (run-repair's handoff-parse):
      a cache saved after code nobody wrote may have run could be restored by
      any job that restores the uv cache. Restoring is unaffected.
    required: false
    default: "true"
  restore-cache:
    description: >-
      Whether the uv cache is used at all; only "true" turns it on. Every job
      passes "false" except the few `tests/test_workflow_cache_restore.py`
      allows, which hold no write credential, no secret but the runtime token
      and no deployment environment, and whose result is no required check or
      gate evidence. A job passing "false" installs from the index as the
      lockfile pins and neither restores nor saves a cache, so an entry a parse
      of third-party content saved under a key nothing had claimed yet never
      runs beside a credential, a secret, or a verdict something else trusts.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    # The version pin buys reproducibility (no more unpinned "latest" in a
    # pin-everything repo) and offline checksum validation of the binary; it
    # does NOT remove the action's per-run manifest fetch, which happens on
    # the download path regardless. That fetch is a single attempt with a
    # hard 5s timeout, and one transient blip took down a seed walk — hence
    # the one retry below. The pin matches the devcontainer's uv at time of
    # pinning; bump deliberately.
    - name: Install uv
      id: install-uv
      continue-on-error: true
      uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      with:
        version: "0.11.26"
        enable-cache: ${{ inputs.restore-cache == 'true' }}
        restore-cache: ${{ inputs.restore-cache == 'true' }}
        save-cache: ${{ inputs.restore-cache == 'true' && inputs.save-cache == 'true' }}
    - name: Install uv (retry after a transient fetch failure)
      if: steps.install-uv.outcome == 'failure'
      uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      with:
        version: "0.11.26"
        enable-cache: ${{ inputs.restore-cache == 'true' }}
        restore-cache: ${{ inputs.restore-cache == 'true' }}
        save-cache: ${{ inputs.restore-cache == 'true' && inputs.save-cache == 'true' }}
    # `--locked` is what makes uv.lock a control rather than a hint: it refuses
    # to install when the lock is stale against pyproject.toml, where a bare
    # `uv sync` re-resolves and installs whatever it finds. The lockfile is the
    # supply-chain pin for the project's own dependencies (SECURITY.md), and
    # every job that installs them — including the prod data runs — comes
    # through this step, so drift fails here or nowhere. Local development runs
    # a plain `uv sync`, which re-locks; relock with the *pinned* uv above,
    # since this flag couples that pin to the lockfile format — a lock written
    # by a newer uv fails every job here, not just the one that changed a
    # dependency.
    - name: Sync dependencies
      shell: bash
      run: uv sync --locked
