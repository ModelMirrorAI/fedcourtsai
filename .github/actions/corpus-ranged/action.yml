name: Ranged corpus access
description: >-
  Assume the read-only AWS role via OIDC and point the corpus read seam at the
  ranged backend: every later step in the job queries the immutable corpus
  blob in place on the corpus remote via HTTP range requests — no full-blob
  pull, per-query egress in KBs. For jobs with no agent step (the agent
  fan-outs' plan jobs, whose scope gating is point lookups, not a scan):
  job-wide credentials are fine only where no agent runs — the cell jobs use
  `corpus-sidecar`, which keeps the credentials step-scoped, and the
  scan-heavy consumers (analytics, the metrics refresh) keep `corpus-readonly`
  for their full pulls. The calling job must grant
  `id-token: write` and run in the `prod` environment so the role and the
  corpus base URL are available to pass in.

inputs:
  role-to-assume:
    description: The read-only AWS role ARN (pass vars.AWS_ROLE_TO_ASSUME_READONLY).
    required: true
  aws-region:
    description: AWS region for the role/remote (pass vars.AWS_REGION).
    required: true
  corpus-base-url:
    description: >-
      The corpus estate's base URL for this environment (pass
      vars.CORPUS_BASE_URL). The index remote the ranged reads address and the
      per-case content store the payload reads address are fixed segments
      beneath it (fedcourtsai.paths).
    required: true

runs:
  using: composite
  steps:
    - name: Configure AWS credentials (corpus S3 remote, read-only)
      uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
      with:
        role-to-assume: ${{ inputs.role-to-assume }}
        aws-region: ${{ inputs.aws-region }}
        # Bound the assume-role wall clock: unbounded, its 12 retries over a
        # multi-minute connect timeout outlast every job budget here (see the
        # workflow-traps list in docs/pipeline.md). Note the cost this buys —
        # the action does not clear its timer on the error path, so ANY failing
        # assume-role now burns the full 120s and ends on "Action timed out"
        # rather than its own message; the real cause is earlier in the log.
        action-timeout-s: 120
    - name: Select the ranged corpus backend
      shell: bash
      env:
        FEDCOURTS_CORPUS_BASE_URL: ${{ inputs.corpus-base-url }}
      run: |
        set -euo pipefail
        # Job-wide env for every later step: the read seam resolves the
        # committed corpus pointer against the index remote derived from the
        # base URL and serves reads via ranged GETs (see "The ranged read
        # backend" in docs/data-pipeline.md); the payload reads follow the
        # content store the same base derives.
        # The heredoc form keeps the write line-safe: a multiline value cannot
        # smuggle extra NAME=value pairs into the job env.
        {
          echo "FEDCOURTS_CORPUS_BACKEND=ranged"
          echo "FEDCOURTS_CORPUS_BASE_URL<<__FEDCOURTS_EOF__"
          echo "$FEDCOURTS_CORPUS_BASE_URL"
          echo "__FEDCOURTS_EOF__"
        } >> "$GITHUB_ENV"
