version: 2
updates:
  # Keep the workflow action pins (full SHAs) fresh; zizmor requires pinning, so
  # Dependabot is how we get security/version bumps. Covers .github/workflows and
  # the composite action under .github/actions.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Dependency bumps are code/config, so they land on the staging branch
    # and ride a promotion batch to main like every other change.
    target-branch: staging
    groups:
      actions:
        # A grouped bump moves every pin of one action together, so the
        # cell-workflow tests that hold those pins in lockstep stay green
        # across a release that changes what the action does with the inputs
        # the cells send — an engine action's refusals fire in its own
        # validation layer, which no required check traverses. Dispatch
        # `integration-test` `engine-actions-smoke` before promoting a bump to
        # `openai/codex-action` or `anthropics/claude-code-action`; see
        # docs/testing.md.
        patterns:
          - "*"

  # Python dependencies, resolved from pyproject.toml + uv.lock.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    target-branch: staging
    groups:
      python:
        patterns:
          - "*"

  # Dev container Features, resolved into .devcontainer/devcontainer-lock.json so
  # a rebuild's inputs are a tracked diff. This ecosystem covers Features only —
  # the base image (mcr.microsoft.com/devcontainers/python:1-3.12) and the
  # Claude Code CLI (installed natively by .devcontainer/install-claude.sh,
  # outside any ecosystem Dependabot watches) stay knowingly floating — and it
  # has no security-update lane, so it buys freshness and traceability, not
  # vulnerability response.
  - package-ecosystem: devcontainers
    directory: /
    schedule:
      interval: weekly
    target-branch: staging
    groups:
      devcontainers:
        patterns:
          - "*"
